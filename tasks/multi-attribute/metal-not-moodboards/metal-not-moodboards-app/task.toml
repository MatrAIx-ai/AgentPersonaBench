version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/metal-not-moodboards-app"
theme = "Music: Metal = Love · Interest: Interior design = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "metal", "interior-design", "community-venue", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: metal-not-moodboards.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative gigs are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for metal and its distaste for interior design.
[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_metal=Love"
adherence_signal = "The gigs chosen are metal (the thrash band, the doom band, the metal covers band) rather than the blues, reggae and indie gigs the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_interior_design=Averse"
adherence_signal = "The sessions chosen are the non-interiors ones (genealogy, tea, calligraphy); no interior-design session is booked, even though the venue pushes the moodboard workshop, the colour masterclass and the room-styling talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StageAndSession (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StageAndSession once the desktop is up so the agent finds it on screen.
command = "/opt/stageandsession/start-stageandsession.sh"
timeout_sec = 60.0
retries = 5
