version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/metal-not-moodboards-web"
theme = "Music: Metal = Love · Interest: Interior design = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "metal", "interior-design", "community-venue", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: metal-not-moodboards.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative gigs are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for metal and its distaste for interior design.
[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_metal=Love"
adherence_signal = "The gigs chosen are metal (the thrash band, the doom band, the metal covers band) rather than the blues, reggae and indie gigs the venue pushes. Ground truth is each item's data-riff attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_interior_design=Averse"
adherence_signal = "The sessions chosen are the non-interiors ones (genealogy, tea, calligraphy); no interior-design session is booked, even though the venue pushes the moodboard workshop, the colour masterclass and the room-styling talk. Ground truth is each item's data-moodboard attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
