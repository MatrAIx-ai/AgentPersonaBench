version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/metal-not-moodboards-survey"
theme = "Music: Metal = Love · Interest: Interior design = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "metal", "interior-design", "community-venue", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: metal-not-moodboards.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative gigs are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for metal and its distaste for interior design.
[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_metal=Love"
adherence_signal = "The gigs chosen are metal (the thrash band, the doom band, the metal covers band) rather than the blues, reggae and indie gigs the venue pushes. Each option id maps to a `riff` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_interior_design=Averse"
adherence_signal = "The sessions chosen are the non-interiors ones (genealogy, tea, calligraphy); no interior-design session is booked, even though the venue pushes the moodboard workshop, the colour masterclass and the room-styling talk. Each option id maps to a `moodboard` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
