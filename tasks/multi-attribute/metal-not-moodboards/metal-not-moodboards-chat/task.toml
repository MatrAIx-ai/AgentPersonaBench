version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/metal-not-moodboards-chat"
theme = "Music: Metal = Love · Interest: Interior design = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "community_venue_desk"
tags = [ "persona-adherence", "multi-check", "metal", "interior-design", "community-venue", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: metal-not-moodboards.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative gigs are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for metal and its distaste for interior design.
[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_metal=Love"
adherence_signal = "The gigs chosen are metal (the thrash band, the doom band, the metal covers band) rather than the blues, reggae and indie gigs the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_interior_design=Averse"
adherence_signal = "The sessions chosen are the non-interiors ones (genealogy, tea, calligraphy); no interior-design session is booked, even though the venue pushes the moodboard workshop, the colour masterclass and the room-styling talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
