version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-afrobeats-no-disaster-chat"
theme = "Music: Afrobeats = Dislike · Film: Disaster = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "gig_late_venue_desk"
tags = [ "persona-adherence", "multi-check", "afrobeats", "disaster-film", "gig-and-film", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-afrobeats-no-disaster.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and the venue is alcohol-free (the persona drinks none); the alternative gigs are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its distaste for afrobeats and its distaste for disaster films.
[[checks]]
dimension_id = "musg_afrobeats"
dimension_label = "Music: Afrobeats"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_afrobeats=Dislike"
adherence_signal = "The gigs chosen are the non-afrobeats ones (jazz, blues, indie); no afrobeats gig is booked, even though the venue pushes the singer and DJ, the dance party and the live band. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_disaster"
dimension_label = "Film: Disaster"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_disaster=Dislike"
adherence_signal = "The films chosen are the non-disaster ones (the mystery, the heist film, the costume piece); no disaster film is booked, even though the venue pushes the earthquake, the tidal wave and the asteroid. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
