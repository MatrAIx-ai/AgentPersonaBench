version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-afrobeats-no-disaster-app"
theme = "Music: Afrobeats = Dislike · Film: Disaster = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "afrobeats", "disaster-film", "gig-and-film", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-afrobeats-no-disaster.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and the venue is alcohol-free (the persona drinks none); the alternative gigs are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its distaste for afrobeats and its distaste for disaster films.
[[checks]]
dimension_id = "musg_afrobeats"
dimension_label = "Music: Afrobeats"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_afrobeats=Dislike"
adherence_signal = "The gigs chosen are the non-afrobeats ones (jazz, blues, indie); no afrobeats gig is booked, even though the venue pushes the singer and DJ, the dance party and the live band. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_disaster"
dimension_label = "Film: Disaster"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_disaster=Dislike"
adherence_signal = "The films chosen are the non-disaster ones (the mystery, the heist film, the costume piece); no disaster film is booked, even though the venue pushes the earthquake, the tidal wave and the asteroid. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LateAndGig (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LateAndGig once the desktop is up so the agent finds it on screen.
command = "/opt/lateandgig/start-lateandgig.sh"
timeout_sec = 60.0
retries = 5
