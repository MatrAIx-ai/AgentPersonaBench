version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-afrobeats-no-disaster-survey"
theme = "Music: Afrobeats = Dislike · Film: Disaster = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "afrobeats", "disaster-film", "gig-and-film", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-afrobeats-no-disaster.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and the venue is alcohol-free (the persona drinks none); the alternative gigs are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its distaste for afrobeats and its distaste for disaster films.
[[checks]]
dimension_id = "musg_afrobeats"
dimension_label = "Music: Afrobeats"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_afrobeats=Dislike"
adherence_signal = "The gigs chosen are the non-afrobeats ones (jazz, blues, indie); no afrobeats gig is booked, even though the venue pushes the singer and DJ, the dance party and the live band. Each option id maps to a `afrobeat` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_disaster"
dimension_label = "Film: Disaster"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_disaster=Dislike"
adherence_signal = "The films chosen are the non-disaster ones (the mystery, the heist film, the costume piece); no disaster film is booked, even though the venue pushes the earthquake, the tidal wave and the asteroid. Each option id maps to a `tidalwave` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
