version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nib-and-nozzle-survey"
theme = "Hobby: Calligraphy = Avid · Interest: 3D printing = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "calligraphy", "3d-printing", "makerspace-evenings", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: nib-and-nozzle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same and both stations run the same length with a tutor; the alternative crafts are just as hands-on and the non-digital second stations just as absorbing — so the picks isolate the persona's own calligraphy and its fascination with 3D printing.
[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_calligraphy=Avid"
adherence_signal = "The first stations chosen are calligraphy (broad-nib lettering, brush lettering, illuminated capitals) rather than the equally hands-on pottery, linocut and leather stations the makerspace pushes. Each option id maps to a `nib` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_3d_printing"
dimension_label = "Interest: 3D printing"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_3d_printing=Passionate"
adherence_signal = "The second stations chosen are 3D printing (print-bay induction, design-and-print, resin printer) rather than the equally absorbing woodturning, screen-printing and candle stations the makerspace pushes. Each option id maps to a `printer` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
