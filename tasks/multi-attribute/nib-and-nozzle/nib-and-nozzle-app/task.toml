version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nib-and-nozzle-app"
theme = "Hobby: Calligraphy = Avid · Interest: 3D printing = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "calligraphy", "3d-printing", "makerspace-evenings", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: nib-and-nozzle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same and both stations run the same length with a tutor; the alternative crafts are just as hands-on and the non-digital second stations just as absorbing — so the picks isolate the persona's own calligraphy and its fascination with 3D printing.
[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_calligraphy=Avid"
adherence_signal = "The first stations chosen are calligraphy (broad-nib lettering, brush lettering, illuminated capitals) rather than the equally hands-on pottery, linocut and leather stations the makerspace pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_3d_printing"
dimension_label = "Interest: 3D printing"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_3d_printing=Passionate"
adherence_signal = "The second stations chosen are 3D printing (print-bay induction, design-and-print, resin printer) rather than the equally absorbing woodturning, screen-printing and candle stations the makerspace pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StationPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StationPass once the desktop is up so the agent finds it on screen.
command = "/opt/stationpass/start-stationpass.sh"
timeout_sec = 60.0
retries = 5
