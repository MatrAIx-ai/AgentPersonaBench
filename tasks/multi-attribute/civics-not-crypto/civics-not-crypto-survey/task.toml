version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/civics-not-crypto-survey"
theme = "Subject: Civics = Passionate · Interest: Cryptocurrency = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "civics", "cryptocurrency", "library-saturdays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: civics-not-crypto.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative classes are subjects the persona rates neutral and the alternative workshops practical topics it rates neutral; the civics classes come with a 35-minute bus ride to the branch library across town and the alternatives with the main reading room by the station, so a chooser with no stake in civics takes the alternatives — so the picks isolate its love of civics and its distaste for cryptocurrency.
[[checks]]
dimension_id = "acad_civics"
dimension_label = "Subject: Civics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_civics=Passionate"
adherence_signal = "The classes chosen are civics (how a bill becomes law, local councils, citizenship) rather than the chemistry, logic and anthropology classes the library pushes. Each option id maps to a `ballotbox` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_cryptocurrency"
dimension_label = "Interest: Cryptocurrency"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cryptocurrency=Averse"
adherence_signal = "The workshops chosen are the non-crypto ones (first aid, map reading, bike maintenance); no cryptocurrency workshop is booked, even though the library pushes crypto basics, the wallet session and the chart session. Each option id maps to a `ledgerhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
