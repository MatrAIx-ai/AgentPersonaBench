version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/civics-not-crypto-app"
theme = "Subject: Civics = Passionate · Interest: Cryptocurrency = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "civics", "cryptocurrency", "library-saturdays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: civics-not-crypto.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative classes are subjects the persona rates neutral and the alternative workshops practical topics it rates neutral; the civics classes come with a 35-minute bus ride to the branch library across town and the alternatives with the main reading room by the station, so a chooser with no stake in civics takes the alternatives — so the picks isolate its love of civics and its distaste for cryptocurrency.
[[checks]]
dimension_id = "acad_civics"
dimension_label = "Subject: Civics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_civics=Passionate"
adherence_signal = "The classes chosen are civics (how a bill becomes law, local councils, citizenship) rather than the chemistry, logic and anthropology classes the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_cryptocurrency"
dimension_label = "Interest: Cryptocurrency"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cryptocurrency=Averse"
adherence_signal = "The workshops chosen are the non-crypto ones (first aid, map reading, bike maintenance); no cryptocurrency workshop is booked, even though the library pushes crypto basics, the wallet session and the chart session. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LearningSaturdaysLibrary (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LearningSaturdaysLibrary once the desktop is up so the agent finds it on screen.
command = "/opt/learningsaturdayslibrary/start-learningsaturdayslibrary.sh"
timeout_sec = 60.0
retries = 5
