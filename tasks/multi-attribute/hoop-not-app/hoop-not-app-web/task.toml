version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hoop-not-app-web"
theme = "Hobby: Embroidery = Avid · Tech savviness = Cautious adopter"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "embroidery", "tech-savviness", "craft-kits", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hoop-not-app.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit is covered in full and rated the same difficulty; the alternative crafts are ones the persona rates neutral, the yarn crafts it also enjoys are kept off both sides, and the app-driven guidance costs nothing extra — so the picks isolate the persona's own embroidery and its wariness of new tech.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_embroidery=Avid"
adherence_signal = "The kits chosen are embroidery kits (crewel, sashiko, goldwork) rather than the equally good watercolour, linocut and polymer-clay kits the shop pushes. Ground truth is each item's data-needle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
value = "Cautious adopter"
evaluator = "rule-based"
evaluator_name = "tech_savviness=Cautious adopter"
adherence_signal = "The kits chosen come with printed guidance (paper pattern, booklet, cards) rather than the phone-camera, smart-tool and AR-headset versions the shop pushes. Ground truth is each item's data-printed attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
