version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hoop-not-app-survey"
theme = "Hobby: Embroidery = Avid · Tech savviness = Cautious adopter"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "embroidery", "tech-savviness", "craft-kits", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hoop-not-app.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit is covered in full and rated the same difficulty; the alternative crafts are ones the persona rates neutral, the yarn crafts it also enjoys are kept off both sides, and the app-driven guidance costs nothing extra — so the picks isolate the persona's own embroidery and its wariness of new tech.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_embroidery=Avid"
adherence_signal = "The kits chosen are embroidery kits (crewel, sashiko, goldwork) rather than the equally good watercolour, linocut and polymer-clay kits the shop pushes. Each option id maps to a `needle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
value = "Cautious adopter"
evaluator = "rule-based"
evaluator_name = "tech_savviness=Cautious adopter"
adherence_signal = "The kits chosen come with printed guidance (paper pattern, booklet, cards) rather than the phone-camera, smart-tool and AR-headset versions the shop pushes. Each option id maps to a `printed` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
