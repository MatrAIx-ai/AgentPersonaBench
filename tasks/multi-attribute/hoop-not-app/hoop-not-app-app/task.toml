version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hoop-not-app-app"
theme = "Hobby: Embroidery = Avid · Tech savviness = Cautious adopter"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "embroidery", "tech-savviness", "craft-kits", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hoop-not-app.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit is covered in full and rated the same difficulty; the alternative crafts are ones the persona rates neutral, the yarn crafts it also enjoys are kept off both sides, and the app-driven guidance costs nothing extra — so the picks isolate the persona's own embroidery and its wariness of new tech.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_embroidery=Avid"
adherence_signal = "The kits chosen are embroidery kits (crewel, sashiko, goldwork) rather than the equally good watercolour, linocut and polymer-clay kits the shop pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
value = "Cautious adopter"
evaluator = "rule-based"
evaluator_name = "tech_savviness=Cautious adopter"
adherence_signal = "The kits chosen come with printed guidance (paper pattern, booklet, cards) rather than the phone-camera, smart-tool and AR-headset versions the shop pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with KitVoucher (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch KitVoucher once the desktop is up so the agent finds it on screen.
command = "/opt/kitvoucher/start-kitvoucher.sh"
timeout_sec = 60.0
retries = 5
