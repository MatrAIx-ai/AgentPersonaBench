version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cycling-not-business-chat"
theme = "Sport: Cycling = Follow · Subject: Business studies = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "club_race_desk"
tags = [ "persona-adherence", "multi-check", "cycling", "business-studies", "sports-and-learning-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cycling-not-business.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the cycling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its cycling fandom and its distaste for business studies.
[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_cycling=Follow"
adherence_signal = "The outings chosen are cycling (the Tour stage screening, the criterium, the velodrome meeting) rather than the tennis, rugby and badminton outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_business_studies"
dimension_label = "Subject: Business studies"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_business_studies=Averse"
adherence_signal = "The talks chosen are the non-business ones (physics, geography, logic); no business talk is booked, even though the club pushes the balance sheet, marketing basics and starting a small business. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
