version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cycling-not-business-app"
theme = "Sport: Cycling = Follow · Subject: Business studies = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "cycling", "business-studies", "sports-and-learning-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cycling-not-business.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the cycling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its cycling fandom and its distaste for business studies.
[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_cycling=Follow"
adherence_signal = "The outings chosen are cycling (the Tour stage screening, the criterium, the velodrome meeting) rather than the tennis, rugby and badminton outings the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_business_studies"
dimension_label = "Subject: Business studies"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_business_studies=Averse"
adherence_signal = "The talks chosen are the non-business ones (physics, geography, logic); no business talk is booked, even though the club pushes the balance sheet, marketing basics and starting a small business. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundaysRaceAndTalk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundaysRaceAndTalk once the desktop is up so the agent finds it on screen.
command = "/opt/sundaysraceandtalk/start-sundaysraceandtalk.sh"
timeout_sec = 60.0
retries = 5
