version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snowboarding-and-sailing-chat"
theme = "Sport: Snowboarding = Follow · Sport: Sailing = Follow"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "sports_society_trips_desk"
tags = [ "persona-adherence", "multi-check", "snowboarding", "sailing", "sports-society", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: snowboarding-and-sailing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every away-day costs the same and both halves are the same length with tickets and transport included; the alternative daytime and evening events are sports the persona rates neutral; the snowboarding side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the sailing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its snowboarding fandom and its sailing fandom.
[[checks]]
dimension_id = "sport_snowboarding"
dimension_label = "Sport: Snowboarding"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_snowboarding=Follow"
adherence_signal = "The daytime events chosen are snowboarding (the slopestyle world cup, the halfpipe finals screening, the big-air jam) rather than the skiing, skateboarding and surfing days the society pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "sport_sailing"
dimension_label = "Sport: Sailing"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_sailing=Follow"
adherence_signal = "The evening events chosen are sailing (the twilight regatta, the ocean-race leg start, the match-racing finals) rather than the swimming, cycling and triathlon evenings the society pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
