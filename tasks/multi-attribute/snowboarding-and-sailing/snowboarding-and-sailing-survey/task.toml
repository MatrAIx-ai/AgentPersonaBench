version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snowboarding-and-sailing-survey"
theme = "Sport: Snowboarding = Follow · Sport: Sailing = Follow"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "snowboarding", "sailing", "sports-society", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: snowboarding-and-sailing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every away-day costs the same and both halves are the same length with tickets and transport included; the alternative daytime and evening events are sports the persona rates neutral; the snowboarding side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the sailing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its snowboarding fandom and its sailing fandom.
[[checks]]
dimension_id = "sport_snowboarding"
dimension_label = "Sport: Snowboarding"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_snowboarding=Follow"
adherence_signal = "The daytime events chosen are snowboarding (the slopestyle world cup, the halfpipe finals screening, the big-air jam) rather than the skiing, skateboarding and surfing days the society pushes. Each option id maps to a `halfpipe` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_sailing"
dimension_label = "Sport: Sailing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_sailing=Follow"
adherence_signal = "The evening events chosen are sailing (the twilight regatta, the ocean-race leg start, the match-racing finals) rather than the swimming, cycling and triathlon evenings the society pushes. Each option id maps to a `regatta` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
