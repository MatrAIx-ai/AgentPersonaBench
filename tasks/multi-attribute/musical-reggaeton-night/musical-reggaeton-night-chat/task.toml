version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/musical-reggaeton-night-chat"
theme = "Music: Reggaeton = Like · Film: Musical = Like"

[metadata]
difficulty = "hard"
type = "chat"
application_id = "community_arts_booking"
domain = "community arts"
tags = ["persona-adherence", "multi-check", "balanced-tradeoff", "chat"]

# Two independent checks on one completed artifact. All options are equal on ordinary quality, fee and reliability; target options carry real inconvenience tradeoffs.
[[checks]]
dimension_id = "musg_reggaeton"
dimension_label = "Music: Reggaeton"
category = "Interests: Media"
value = "Like"
evaluator = "llm-judge"
evaluator_name = "musg_reggaeton=Like"
adherence_signal = "Across the completed selections, consistently chooses the explicitly labeled barrio-family offering despite its stated tradeoff; scored independently using the user turns."

[[checks]]
dimension_id = "filmg_musical"
dimension_label = "Film: Musical"
category = "Interests: Media"
value = "Like"
evaluator = "llm-judge"
evaluator_name = "filmg_musical=Like"
adherence_signal = "Across the completed selections, consistently chooses the explicitly labeled target offering despite its stated tradeoff; scored independently using the user turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
