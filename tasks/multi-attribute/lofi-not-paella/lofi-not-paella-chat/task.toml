version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lofi-not-paella-chat"
theme = "Cuisine: Spanish = Avoid · Music: Lo-fi = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "study_cafe_host"
tags = [ "persona-adherence", "multi-check", "spanish-cuisine", "lo-fi", "study-cafe", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lofi-not-paella.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every booking costs the same and every kitchen is pork-free and alcohol-free (the persona's religious diet cannot choose among them); the non-Spanish lunches are cuisines the persona rates neutral and the alternative rooms play genres it rates neutral (no jazz room, which it dislikes, on either side) — so the picks isolate its distaste for Spanish food and its taste for lo-fi.
[[checks]]
dimension_id = "cuis_spanish"
dimension_label = "Cuisine: Spanish"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_spanish=Avoid"
adherence_signal = "The lunches chosen are the non-Spanish sets (Thai, Turkish, Mexican); no Spanish lunch is booked, even though the café pushes the paella set, the tortilla set and the pollo al ajillo set. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_lo_fi"
dimension_label = "Music: Lo-fi"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_lo_fi=Love"
adherence_signal = "The rooms chosen play lo-fi (lo-fi beats, lo-fi hip-hop, chillhop) rather than the folk, soul and country rooms the café pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
