version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lofi-not-paella-app"
theme = "Cuisine: Spanish = Avoid · Music: Lo-fi = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spanish-cuisine", "lo-fi", "study-cafe", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lofi-not-paella.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every booking costs the same and every kitchen is pork-free and alcohol-free (the persona's religious diet cannot choose among them); the non-Spanish lunches are cuisines the persona rates neutral and the alternative rooms play genres it rates neutral (no jazz room, which it dislikes, on either side) — so the picks isolate its distaste for Spanish food and its taste for lo-fi.
[[checks]]
dimension_id = "cuis_spanish"
dimension_label = "Cuisine: Spanish"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_spanish=Avoid"
adherence_signal = "The lunches chosen are the non-Spanish sets (Thai, Turkish, Mexican); no Spanish lunch is booked, even though the café pushes the paella set, the tortilla set and the pollo al ajillo set. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_lo_fi"
dimension_label = "Music: Lo-fi"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_lo_fi=Love"
adherence_signal = "The rooms chosen play lo-fi (lo-fi beats, lo-fi hip-hop, chillhop) rather than the folk, soul and country rooms the café pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BowlAndDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BowlAndDesk once the desktop is up so the agent finds it on screen.
command = "/opt/bowlanddesk/start-bowlanddesk.sh"
timeout_sec = 60.0
retries = 5
