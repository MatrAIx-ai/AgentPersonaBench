version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lofi-not-paella-web"
theme = "Cuisine: Spanish = Avoid · Music: Lo-fi = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spanish-cuisine", "lo-fi", "study-cafe", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lofi-not-paella.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every booking costs the same and every kitchen is pork-free and alcohol-free (the persona's religious diet cannot choose among them); the non-Spanish lunches are cuisines the persona rates neutral and the alternative rooms play genres it rates neutral (no jazz room, which it dislikes, on either side) — so the picks isolate its distaste for Spanish food and its taste for lo-fi.
[[checks]]
dimension_id = "cuis_spanish"
dimension_label = "Cuisine: Spanish"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_spanish=Avoid"
adherence_signal = "The lunches chosen are the non-Spanish sets (Thai, Turkish, Mexican); no Spanish lunch is booked, even though the café pushes the paella set, the tortilla set and the pollo al ajillo set. Ground truth is each item's data-paella attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_lo_fi"
dimension_label = "Music: Lo-fi"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_lo_fi=Love"
adherence_signal = "The rooms chosen play lo-fi (lo-fi beats, lo-fi hip-hop, chillhop) rather than the folk, soul and country rooms the café pushes. Ground truth is each item's data-lofi attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
