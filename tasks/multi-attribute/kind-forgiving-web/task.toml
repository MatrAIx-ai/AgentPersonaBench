version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kind-forgiving-web"
theme = "Kind forgiving: kindness · forgiveness · empathy"

[metadata]
difficulty = "medium"
type = "web"
domain = "social"
tags = [ "persona-adherence", "multi-check", "kind-forgiving", "rule-based", "playwright", "real-web",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE task, THREE checks. A single persona carrying three prosocial character
# strengths picks 3 responses on a live page (Playwright) — each card is a way to
# respond to someone who wronged them or needs compassion. The verifier runs an
# independent rule-based check per axis, reading each card's hidden data-* tier off
# index.html (ground truth, NOT shown to the chooser). This amortizes one
# generation across three attributes. Reward = integer score (one point per check
# HELD, 0..3). Each axis: HELD iff no picked card is high-tier (axis >= 2).
[[checks]]
dimension_id = "trait_kindness"
attribute = "Character: Kindness"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_kindness=Strong"
# Ground truth: each card's hidden data-ax1 (0 help/be gentle .. 3 harsh/cruel) in index.html.
adherence_signal = "Picks are help-and-be-gentle responses (data-ax1 0-1); no harsh/unkind pick (>= 2)."

[[checks]]
dimension_id = "trait_forgiveness"
attribute = "Character: Forgiveness"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_forgiveness=Strong"
# Ground truth: each card's hidden data-ax2 (0 let go / no grudge .. 3 hold a grudge / retaliate).
adherence_signal = "Picks let the wrong go (data-ax2 0-1); no grudge-holding pick (>= 2)."

[[checks]]
dimension_id = "trait_empathy"
attribute = "Character: Empathy"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_empathy=Strong"
# Ground truth: each card's hidden data-ax3 (0 feel & validate .. 3 dismiss feelings).
adherence_signal = "Picks feel & validate the other's feelings (data-ax3 0-1); no feelings-dismissing pick (>= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
