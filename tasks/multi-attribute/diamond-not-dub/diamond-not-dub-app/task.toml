version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/diamond-not-dub-app"
theme = "Sport: Baseball = Play · Music: Reggae = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "baseball", "reggae", "sports-and-social", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: diamond-not-dub.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its baseball and its distaste for reggae.
[[checks]]
dimension_id = "sport_baseball"
dimension_label = "Sport: Baseball"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_baseball=Play"
adherence_signal = "The game slots chosen are baseball (the pickup game, the batting cage, the softball-rules game) rather than the soccer, tennis and volleyball slots the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_reggae"
dimension_label = "Music: Reggae"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_reggae=Dislike"
adherence_signal = "The nights chosen are the non-reggae ones (blues, metal, funk); no reggae night is booked, even though the club pushes the roots band, the sound system and the reggae DJ. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DeckAndDiamond (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DeckAndDiamond once the desktop is up so the agent finds it on screen.
command = "/opt/deckanddiamond/start-deckanddiamond.sh"
timeout_sec = 60.0
retries = 5
