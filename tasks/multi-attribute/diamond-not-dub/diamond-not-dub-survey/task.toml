version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/diamond-not-dub-survey"
theme = "Sport: Baseball = Play · Music: Reggae = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "baseball", "reggae", "sports-and-social", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: diamond-not-dub.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its baseball and its distaste for reggae.
[[checks]]
dimension_id = "sport_baseball"
dimension_label = "Sport: Baseball"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_baseball=Play"
adherence_signal = "The game slots chosen are baseball (the pickup game, the batting cage, the softball-rules game) rather than the soccer, tennis and volleyball slots the club pushes. Each option id maps to a `diamond` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_reggae"
dimension_label = "Music: Reggae"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_reggae=Dislike"
adherence_signal = "The nights chosen are the non-reggae ones (blues, metal, funk); no reggae night is booked, even though the club pushes the roots band, the sound system and the reggae DJ. Each option id maps to a `dubnight` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
