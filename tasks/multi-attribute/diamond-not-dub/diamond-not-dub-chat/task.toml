version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/diamond-not-dub-chat"
theme = "Sport: Baseball = Play · Music: Reggae = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "sports_social_saturdays_desk"
tags = [ "persona-adherence", "multi-check", "baseball", "reggae", "sports-and-social", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: diamond-not-dub.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its baseball and its distaste for reggae.
[[checks]]
dimension_id = "sport_baseball"
dimension_label = "Sport: Baseball"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_baseball=Play"
adherence_signal = "The game slots chosen are baseball (the pickup game, the batting cage, the softball-rules game) rather than the soccer, tennis and volleyball slots the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_reggae"
dimension_label = "Music: Reggae"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_reggae=Dislike"
adherence_signal = "The nights chosen are the non-reggae ones (blues, metal, funk); no reggae night is booked, even though the club pushes the roots band, the sound system and the reggae DJ. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
