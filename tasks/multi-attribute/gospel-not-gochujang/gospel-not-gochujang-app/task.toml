version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gospel-not-gochujang-app"
theme = "Music: Gospel = Love · Cuisine: Korean = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "gospel", "korean-cuisine", "music-brunch", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gospel-not-gochujang.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every brunch costs the same and every brunch is alcohol-free (the persona drinks none, so that cannot choose); the alternative sets are genres the persona rates neutral and the alternative kitchens cuisines it rates neutral — so the picks isolate its taste for gospel and its distaste for Korean food.
[[checks]]
dimension_id = "musg_gospel"
dimension_label = "Music: Gospel"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_gospel=Love"
adherence_signal = "The sets chosen are gospel (choir brunch, gospel band brunch, singalong brunch) rather than the reggae, indie-acoustic and bluegrass brunches the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_korean"
dimension_label = "Cuisine: Korean"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_korean=Avoid"
adherence_signal = "The kitchens chosen are the non-Korean ones (Thai, Moroccan, Caribbean); no Korean kitchen is booked, even though the club pushes the Korean barbecue, the Korean fried chicken and the bibimbap kitchen. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SetsBrunch (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SetsBrunch once the desktop is up so the agent finds it on screen.
command = "/opt/setsbrunch/start-setsbrunch.sh"
timeout_sec = 60.0
retries = 5
