version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gospel-not-gochujang-chat"
theme = "Music: Gospel = Love · Cuisine: Korean = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "brunch_club_host"
tags = [ "persona-adherence", "multi-check", "gospel", "korean-cuisine", "music-brunch", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gospel-not-gochujang.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every brunch costs the same and every brunch is alcohol-free (the persona drinks none, so that cannot choose); the alternative sets are genres the persona rates neutral and the alternative kitchens cuisines it rates neutral — so the picks isolate its taste for gospel and its distaste for Korean food.
[[checks]]
dimension_id = "musg_gospel"
dimension_label = "Music: Gospel"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_gospel=Love"
adherence_signal = "The sets chosen are gospel (choir brunch, gospel band brunch, singalong brunch) rather than the reggae, indie-acoustic and bluegrass brunches the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_korean"
dimension_label = "Cuisine: Korean"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_korean=Avoid"
adherence_signal = "The kitchens chosen are the non-Korean ones (Thai, Moroccan, Caribbean); no Korean kitchen is booked, even though the club pushes the Korean barbecue, the Korean fried chicken and the bibimbap kitchen. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
