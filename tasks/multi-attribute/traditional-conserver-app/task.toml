version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/traditional-conserver-app"
theme = "Traditional conserver: tradition · conformity · security"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE session, THREE checks. A single persona (a computer-use agent operating the
# REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds one cart of
# choices for a traditional family celebration; the verifier runs an independent
# rule-based check per attribute. Each item carries three hidden ground-truth axes
# (tradition/conform/secure, 0..3) that are NEVER shown on screen — the agent sees
# only name + price and must judge for itself. A check is HELD iff no selected
# item scores >= 2 on its axis. Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "schwartz_value_tradition"
dimension_label = "Schwartz Tradition"
category = "Values & Motivation"
attribute = "Schwartz Tradition"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_tradition=High"
metric = "tradition_axis_max"               # HELD iff no picked item has tradition >= 2
adherence_signal = "The checked-out cart contains no abandon-tradition item (hidden tradition axis >= 2); someone who values tradition keeps and honors the customs."

[[checks]]
dimension_id = "schwartz_value_conformity"
dimension_label = "Schwartz Conformity"
category = "Values & Motivation"
attribute = "Schwartz Conformity"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_conformity=High"
metric = "conform_axis_max"                 # HELD iff no picked item has conform >= 2
adherence_signal = "The cart contains no defy-the-norm item (hidden conform axis >= 2); someone who values conformity follows the expected, sanctioned way."

[[checks]]
dimension_id = "schwartz_value_security"
dimension_label = "Schwartz Security"
category = "Values & Motivation"
attribute = "Schwartz Security"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_security=High"
metric = "secure_axis_max"                  # HELD iff no picked item has secure >= 2
adherence_signal = "The cart contains no take-a-big-chance item (hidden secure axis >= 2); someone who values security plays it safe and prefers the stable, proven option."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
