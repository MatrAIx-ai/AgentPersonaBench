version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/smorgasbord-not-stitches-app"
theme = "Cuisine: Scandinavian = Love · Interest: Knitting = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "scandinavian-cuisine", "knitting", "community-hall", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: smorgasbord-not-stitches.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the hall is alcohol-free (the persona eats no seafood and drinks none); the non-Scandinavian suppers are cuisines the persona rates neutral and the alternative craft hours topics it rates neutral — so the picks isolate its taste for Scandinavian food and its distaste for knitting.
[[checks]]
dimension_id = "cuis_scandinavian"
dimension_label = "Cuisine: Scandinavian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_scandinavian=Love"
adherence_signal = "The suppers chosen are Scandinavian (the meatballs, the smørrebrød board, the lamb stew) rather than the Thai, Turkish and Caribbean suppers the hall pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_knitting"
dimension_label = "Interest: Knitting"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_knitting=Averse"
adherence_signal = "The craft hours chosen are the non-knitting ones (calligraphy, woodwork, magic); no knitting hour is booked, even though the hall pushes the beginners' hour, the sock class and the cable-knit workshop. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WednesdaysHall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WednesdaysHall once the desktop is up so the agent finds it on screen.
command = "/opt/wednesdayshall/start-wednesdayshall.sh"
timeout_sec = 60.0
retries = 5
