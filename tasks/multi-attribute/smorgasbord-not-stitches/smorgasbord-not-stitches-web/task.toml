version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/smorgasbord-not-stitches-web"
theme = "Cuisine: Scandinavian = Love · Interest: Knitting = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "scandinavian-cuisine", "knitting", "community-hall", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: smorgasbord-not-stitches.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the hall is alcohol-free (the persona eats no seafood and drinks none); the non-Scandinavian suppers are cuisines the persona rates neutral and the alternative craft hours topics it rates neutral — so the picks isolate its taste for Scandinavian food and its distaste for knitting.
[[checks]]
dimension_id = "cuis_scandinavian"
dimension_label = "Cuisine: Scandinavian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_scandinavian=Love"
adherence_signal = "The suppers chosen are Scandinavian (the meatballs, the smørrebrød board, the lamb stew) rather than the Thai, Turkish and Caribbean suppers the hall pushes. Ground truth is each item's data-smorgasbord attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_knitting"
dimension_label = "Interest: Knitting"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_knitting=Averse"
adherence_signal = "The craft hours chosen are the non-knitting ones (calligraphy, woodwork, magic); no knitting hour is booked, even though the hall pushes the beginners' hour, the sock class and the cable-knit workshop. Ground truth is each item's data-needles attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
