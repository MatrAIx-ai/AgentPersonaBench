version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/green-tariff-not-credit-app"
theme = "Attitude: Renewable energy = Enthusiast · Attitude: Taking on debt = Opposed"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household"
tags = [ "persona-adherence", "multi-check", "renewable-energy", "taking-on-debt", "energy-plans", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: green-tariff-not-credit.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle comes with the same thermostat-and-meter kit at the same kit price, and the three meters are alike; the renewable tariffs charge a unit rate about 15% above the standard tariffs, so a chooser with no stake in renewables takes the cheaper standard rate, and paying for the kit outright costs the whole sum at signup while the credit plan costs nothing today — so the picks isolate the persona's appetite for renewable energy and its refusal to take on debt.
[[checks]]
dimension_id = "att_renewable_energy"
dimension_label = "Attitude: Renewable energy"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_renewable_energy=Enthusiast"
adherence_signal = "The tariffs chosen are the renewable-backed ones (wind and solar, green-certified, community renewables) rather than the cheaper standard grid-mix tariffs the supplier pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "att_taking_on_debt"
dimension_label = "Attitude: Taking on debt"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_taking_on_debt=Opposed"
adherence_signal = "The kit is paid outright on every bundle chosen; no credit agreement is taken on, even though the supplier pushes the 24-month interest-free plan. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlansThreeMeter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlansThreeMeter once the desktop is up so the agent finds it on screen.
command = "/opt/plansthreemeter/start-plansthreemeter.sh"
timeout_sec = 60.0
retries = 5
