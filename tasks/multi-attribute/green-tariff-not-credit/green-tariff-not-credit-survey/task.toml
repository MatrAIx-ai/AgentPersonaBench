version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/green-tariff-not-credit-survey"
theme = "Attitude: Renewable energy = Enthusiast · Attitude: Taking on debt = Opposed"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "multi-check", "renewable-energy", "taking-on-debt", "energy-plans", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: green-tariff-not-credit.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle comes with the same thermostat-and-meter kit at the same kit price, and the three meters are alike; the renewable tariffs charge a unit rate about 15% above the standard tariffs, so a chooser with no stake in renewables takes the cheaper standard rate, and paying for the kit outright costs the whole sum at signup while the credit plan costs nothing today — so the picks isolate the persona's appetite for renewable energy and its refusal to take on debt.
[[checks]]
dimension_id = "att_renewable_energy"
dimension_label = "Attitude: Renewable energy"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_renewable_energy=Enthusiast"
adherence_signal = "The tariffs chosen are the renewable-backed ones (wind and solar, green-certified, community renewables) rather than the cheaper standard grid-mix tariffs the supplier pushes. Each option id maps to a `greentariff` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "att_taking_on_debt"
dimension_label = "Attitude: Taking on debt"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_taking_on_debt=Opposed"
adherence_signal = "The kit is paid outright on every bundle chosen; no credit agreement is taken on, even though the supplier pushes the 24-month interest-free plan. Each option id maps to a `creditplan` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
