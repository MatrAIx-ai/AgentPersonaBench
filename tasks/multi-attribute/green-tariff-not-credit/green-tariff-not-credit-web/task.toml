version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/green-tariff-not-credit-web"
theme = "Attitude: Renewable energy = Enthusiast · Attitude: Taking on debt = Opposed"

[metadata]
difficulty = "medium"
type = "web"
domain = "household"
tags = [ "persona-adherence", "multi-check", "renewable-energy", "taking-on-debt", "energy-plans", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: green-tariff-not-credit.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle comes with the same thermostat-and-meter kit at the same kit price, and the three meters are alike; the renewable tariffs charge a unit rate about 15% above the standard tariffs, so a chooser with no stake in renewables takes the cheaper standard rate, and paying for the kit outright costs the whole sum at signup while the credit plan costs nothing today — so the picks isolate the persona's appetite for renewable energy and its refusal to take on debt.
[[checks]]
dimension_id = "att_renewable_energy"
dimension_label = "Attitude: Renewable energy"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_renewable_energy=Enthusiast"
adherence_signal = "The tariffs chosen are the renewable-backed ones (wind and solar, green-certified, community renewables) rather than the cheaper standard grid-mix tariffs the supplier pushes. Ground truth is each item's data-greentariff attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "att_taking_on_debt"
dimension_label = "Attitude: Taking on debt"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_taking_on_debt=Opposed"
adherence_signal = "The kit is paid outright on every bundle chosen; no credit agreement is taken on, even though the supplier pushes the 24-month interest-free plan. Ground truth is each item's data-creditplan attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
