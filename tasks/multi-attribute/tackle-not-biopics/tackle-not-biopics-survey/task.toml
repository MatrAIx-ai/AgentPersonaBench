version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tackle-not-biopics-survey"
theme = "Interest: Fishing = Passionate · Film: Biopic = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "fishing", "biopic", "lakeside-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tackle-not-biopics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and every outing is outdoors (so being outside is common to both sides); the alternative outings are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its fishing and its distaste for biopics.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_fishing=Passionate"
adherence_signal = "The outings chosen are fishing (the fly-fishing morning, the coarse session, the boat trip) rather than the birdwatching, photography and hiking outings the centre pushes. Each option id maps to a `tackle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_biopic=Dislike"
adherence_signal = "The films chosen are the non-biopics (the western, the heist film, the space adventure); no biopic is booked, even though the centre pushes the musician's, the athlete's and the scientist's life stories. Each option id maps to a `lifestory` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
