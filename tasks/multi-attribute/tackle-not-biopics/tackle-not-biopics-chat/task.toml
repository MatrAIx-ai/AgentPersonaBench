version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tackle-not-biopics-chat"
theme = "Interest: Fishing = Passionate · Film: Biopic = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "lakeside_centre_desk"
tags = [ "persona-adherence", "multi-check", "fishing", "biopic", "lakeside-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tackle-not-biopics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and every outing is outdoors (so being outside is common to both sides); the alternative outings are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its fishing and its distaste for biopics.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_fishing=Passionate"
adherence_signal = "The outings chosen are fishing (the fly-fishing morning, the coarse session, the boat trip) rather than the birdwatching, photography and hiking outings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_biopic=Dislike"
adherence_signal = "The films chosen are the non-biopics (the western, the heist film, the space adventure); no biopic is booked, even though the centre pushes the musician's, the athlete's and the scientist's life stories. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
