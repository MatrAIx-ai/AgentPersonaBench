version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tackle-not-biopics-web"
theme = "Interest: Fishing = Passionate · Film: Biopic = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "fishing", "biopic", "lakeside-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tackle-not-biopics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and every outing is outdoors (so being outside is common to both sides); the alternative outings are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its fishing and its distaste for biopics.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_fishing=Passionate"
adherence_signal = "The outings chosen are fishing (the fly-fishing morning, the coarse session, the boat trip) rather than the birdwatching, photography and hiking outings the centre pushes. Ground truth is each item's data-tackle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_biopic=Dislike"
adherence_signal = "The films chosen are the non-biopics (the western, the heist film, the space adventure); no biopic is booked, even though the centre pushes the musician's, the athlete's and the scientist's life stories. Ground truth is each item's data-lifestory attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
