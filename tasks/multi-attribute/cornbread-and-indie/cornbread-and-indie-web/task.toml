version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cornbread-and-indie-web"
theme = "Cuisine: Southern soul food = Love · Music: Indie = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "soul-food", "indie-music", "supper-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cornbread-and-indie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is alcohol-free and serves no beef or pork; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for soul food and for indie music independently.
[[checks]]
dimension_id = "cuis_southern_soul_food"
dimension_label = "Cuisine: Southern soul food"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_southern_soul_food=Love"
adherence_signal = "The menus chosen are Southern soul food (smothered chicken, catfish and grits, chicken and waffles) rather than the equally good parmigiana, souvlaki and tikka plates the club pushes. Ground truth is each item's data-soulfood attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_indie"
dimension_label = "Music: Indie"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_indie=Love"
adherence_signal = "The bands chosen are indie (the four-piece, the singer-songwriter, the jangle-pop trio) rather than the equally good jazz, country and pop acts the club pushes. Ground truth is each item's data-indieband attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
