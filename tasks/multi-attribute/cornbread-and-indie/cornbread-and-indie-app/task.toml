version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cornbread-and-indie-app"
theme = "Cuisine: Southern soul food = Love · Music: Indie = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "soul-food", "indie-music", "supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cornbread-and-indie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is alcohol-free and serves no beef or pork; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for soul food and for indie music independently.
[[checks]]
dimension_id = "cuis_southern_soul_food"
dimension_label = "Cuisine: Southern soul food"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_southern_soul_food=Love"
adherence_signal = "The menus chosen are Southern soul food (smothered chicken, catfish and grits, chicken and waffles) rather than the equally good parmigiana, souvlaki and tikka plates the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_indie"
dimension_label = "Music: Indie"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_indie=Love"
adherence_signal = "The bands chosen are indie (the four-piece, the singer-songwriter, the jangle-pop trio) rather than the equally good jazz, country and pop acts the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubSupper (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubSupper once the desktop is up so the agent finds it on screen.
command = "/opt/clubsupper/start-clubsupper.sh"
timeout_sec = 60.0
retries = 5
