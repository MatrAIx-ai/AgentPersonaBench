version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/physics-not-algebra-app"
theme = "Subject: Physics = Passionate · Subject: Algebra = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "physics", "algebra", "science-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: physics-not-algebra.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the physics side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of physics and its distaste for algebra.
[[checks]]
dimension_id = "acad_physics"
dimension_label = "Subject: Physics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_physics=Passionate"
adherence_signal = "The talks chosen are physics (why the sky is blue, quantum for the curious, waves and resonance) rather than the biology, economics and statistics talks the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_algebra"
dimension_label = "Subject: Algebra"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_algebra=Averse"
adherence_signal = "The workshops chosen are the non-algebra ones (drama, geography, map reading); no algebra workshop is booked, even though the centre pushes matrices, groups and polynomials. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScienceTalksSunday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScienceTalksSunday once the desktop is up so the agent finds it on screen.
command = "/opt/sciencetalkssunday/start-sciencetalkssunday.sh"
timeout_sec = 60.0
retries = 5
