# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: physics-not-algebra.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the physics side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of physics and its distaste for algebra.
[[checks]]
dimension_id = "acad_physics"
dimension_label = "Subject: Physics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_physics=Passionate"
adherence_signal = "The talks chosen are physics (why the sky is blue, quantum for the curious, waves and resonance) rather than the biology, economics and statistics talks the centre pushes. Each option id maps to a `pendulum` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_algebra"
dimension_label = "Subject: Algebra"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_algebra=Averse"
adherence_signal = "The workshops chosen are the non-algebra ones (drama, geography, map reading); no algebra workshop is booked, even though the centre pushes matrices, groups and polynomials. Each option id maps to a `matrixhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

