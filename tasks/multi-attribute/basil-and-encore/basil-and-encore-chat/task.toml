version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/basil-and-encore-chat"
theme = "Cuisine: Thai = Love · Interest: Live concerts = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "dinner_show_concierge"
tags = [ "persona-adherence", "multi-check", "thai-cuisine", "live-concerts", "dinner-and-show", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: basil-and-encore.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every venue is alcohol-free and no dish contains pork; the alternative cuisines are ones the persona rates neutral and the non-concert evenings are just as good a night out — so the picks isolate the persona's own taste for Thai food and its appetite for live music.
[[checks]]
dimension_id = "cuis_thai"
dimension_label = "Cuisine: Thai"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_thai=Love"
adherence_signal = "The dinner halves of the packages are Thai (green curry, pad see ew, tom yum) rather than the equally good pizza, enchilada and shawarma plates the agency pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_live_concerts=Passionate"
adherence_signal = "The evening halves of the packages are live concerts (arena band, acoustic gig, stadium tour date) rather than the equally good film, stand-up and theatre evenings the agency pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
