version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/basil-and-encore-app"
theme = "Cuisine: Thai = Love · Interest: Live concerts = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "thai-cuisine", "live-concerts", "dinner-and-show", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: basil-and-encore.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every venue is alcohol-free and no dish contains pork; the alternative cuisines are ones the persona rates neutral and the non-concert evenings are just as good a night out — so the picks isolate the persona's own taste for Thai food and its appetite for live music.
[[checks]]
dimension_id = "cuis_thai"
dimension_label = "Cuisine: Thai"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_thai=Love"
adherence_signal = "The dinner halves of the packages are Thai (green curry, pad see ew, tom yum) rather than the equally good pizza, enchilada and shawarma plates the agency pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_live_concerts=Passionate"
adherence_signal = "The evening halves of the packages are live concerts (arena band, acoustic gig, stadium tour date) rather than the equally good film, stand-up and theatre evenings the agency pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightPlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightPlanner once the desktop is up so the agent finds it on screen.
command = "/opt/nightplanner/start-nightplanner.sh"
timeout_sec = 60.0
retries = 5
