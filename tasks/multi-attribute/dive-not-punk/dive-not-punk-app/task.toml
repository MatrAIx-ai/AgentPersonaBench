version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dive-not-punk-app"
theme = "Hobby: Scuba diving = Active · Music: Punk = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scuba-diving", "punk", "coastal-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dive-not-punk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every day is outdoors on the water (the persona is strongly outdoor, so being outside is common to both sides) and the boathouse is alcohol-free (the persona drinks none); the alternative days are water hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its diving and its distaste for punk.
[[checks]]
dimension_id = "hob_scuba_diving"
dimension_label = "Hobby: Scuba diving"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_scuba_diving=Active"
adherence_signal = "The days chosen are dives (the shore dive, the wreck dive, the drift dive) rather than the kayaking, paddleboarding and snorkelling days the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_punk"
dimension_label = "Music: Punk"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_punk=Dislike"
adherence_signal = "The gigs chosen are the non-punk ones (folk, jazz, country); no punk gig is booked, even though the centre pushes the punk band, the hardcore showcase and the pop-punk covers band. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysBoathouse (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysBoathouse once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysboathouse/start-saturdaysboathouse.sh"
timeout_sec = 60.0
retries = 5
