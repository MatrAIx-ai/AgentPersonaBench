version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dive-not-punk-chat"
theme = "Hobby: Scuba diving = Active · Music: Punk = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "coastal_centre_desk"
tags = [ "persona-adherence", "multi-check", "scuba-diving", "punk", "coastal-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dive-not-punk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every day is outdoors on the water (the persona is strongly outdoor, so being outside is common to both sides) and the boathouse is alcohol-free (the persona drinks none); the alternative days are water hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its diving and its distaste for punk.
[[checks]]
dimension_id = "hob_scuba_diving"
dimension_label = "Hobby: Scuba diving"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_scuba_diving=Active"
adherence_signal = "The days chosen are dives (the shore dive, the wreck dive, the drift dive) rather than the kayaking, paddleboarding and snorkelling days the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_punk"
dimension_label = "Music: Punk"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_punk=Dislike"
adherence_signal = "The gigs chosen are the non-punk ones (folk, jazz, country); no punk gig is booked, even though the centre pushes the punk band, the hardcore showcase and the pop-punk covers band. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
