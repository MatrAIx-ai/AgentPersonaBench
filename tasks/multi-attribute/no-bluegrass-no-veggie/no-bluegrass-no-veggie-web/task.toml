version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-bluegrass-no-veggie-web"
theme = "Music: Bluegrass = Dislike · Cuisine: Vegetarian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "bluegrass", "vegetarian-cuisine", "concert-and-supper", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-bluegrass-no-veggie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every supper is alcohol-free and seafood-free (the persona drinks none and eats no seafood); the alternative concerts are genres the persona rates neutral and the non-vegetarian suppers cuisines it rates neutral — so the picks isolate its distaste for bluegrass and its distaste for vegetarian cuisine.
[[checks]]
dimension_id = "musg_bluegrass"
dimension_label = "Music: Bluegrass"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_bluegrass=Dislike"
adherence_signal = "The concerts chosen are the non-bluegrass ones (classical, soul, house); no bluegrass concert is booked, even though the venue pushes the bluegrass band, the string band and the jam. Ground truth is each item's data-banjo attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_vegetarian"
dimension_label = "Cuisine: Vegetarian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_vegetarian=Avoid"
adherence_signal = "The suppers chosen are the non-vegetarian ones (Korean, Turkish, Caribbean); no vegetarian supper is booked, even though the venue pushes the tasting menu, the meat-free mezze and the curry house. Ground truth is each item's data-meatfree attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
