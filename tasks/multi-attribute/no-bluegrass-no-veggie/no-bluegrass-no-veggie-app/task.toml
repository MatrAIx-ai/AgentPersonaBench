version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-bluegrass-no-veggie-app"
theme = "Music: Bluegrass = Dislike · Cuisine: Vegetarian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "bluegrass", "vegetarian-cuisine", "concert-and-supper", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-bluegrass-no-veggie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every supper is alcohol-free and seafood-free (the persona drinks none and eats no seafood); the alternative concerts are genres the persona rates neutral and the non-vegetarian suppers cuisines it rates neutral — so the picks isolate its distaste for bluegrass and its distaste for vegetarian cuisine.
[[checks]]
dimension_id = "musg_bluegrass"
dimension_label = "Music: Bluegrass"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_bluegrass=Dislike"
adherence_signal = "The concerts chosen are the non-bluegrass ones (classical, soul, house); no bluegrass concert is booked, even though the venue pushes the bluegrass band, the string band and the jam. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_vegetarian"
dimension_label = "Cuisine: Vegetarian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_vegetarian=Avoid"
adherence_signal = "The suppers chosen are the non-vegetarian ones (Korean, Turkish, Caribbean); no vegetarian supper is booked, even though the venue pushes the tasting menu, the meat-free mezze and the curry house. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with KitchenAndConcert (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch KitchenAndConcert once the desktop is up so the agent finds it on screen.
command = "/opt/kitchenandconcert/start-kitchenandconcert.sh"
timeout_sec = 60.0
retries = 5
