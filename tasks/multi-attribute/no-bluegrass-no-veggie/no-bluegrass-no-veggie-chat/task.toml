version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-bluegrass-no-veggie-chat"
theme = "Music: Bluegrass = Dislike · Cuisine: Vegetarian = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "concert_kitchen_venue_desk"
tags = [ "persona-adherence", "multi-check", "bluegrass", "vegetarian-cuisine", "concert-and-supper", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-bluegrass-no-veggie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every supper is alcohol-free and seafood-free (the persona drinks none and eats no seafood); the alternative concerts are genres the persona rates neutral and the non-vegetarian suppers cuisines it rates neutral — so the picks isolate its distaste for bluegrass and its distaste for vegetarian cuisine.
[[checks]]
dimension_id = "musg_bluegrass"
dimension_label = "Music: Bluegrass"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_bluegrass=Dislike"
adherence_signal = "The concerts chosen are the non-bluegrass ones (classical, soul, house); no bluegrass concert is booked, even though the venue pushes the bluegrass band, the string band and the jam. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_vegetarian"
dimension_label = "Cuisine: Vegetarian"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_vegetarian=Avoid"
adherence_signal = "The suppers chosen are the non-vegetarian ones (Korean, Turkish, Caribbean); no vegetarian supper is booked, even though the venue pushes the tasting menu, the meat-free mezze and the curry house. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
