version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/focus-hour-app"
theme = "Interest: Productivity = Passionate · Interest: Tea = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "productivity", "tea", "co-working-perks", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: focus-hour.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair is included in the membership and both halves are the same length; the alternative sessions are lunchtime topics the persona rates neutral, and the non-tea breaks are just as social (the persona drinks no coffee, so no coffee break is offered on either side) — so the picks isolate its appetite for productivity systems and its distaste for tea.
[[checks]]
dimension_id = "topic_productivity"
dimension_label = "Interest: Productivity"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_productivity=Passionate"
adherence_signal = "The lunchtime sessions chosen are productivity sessions (time-blocking clinic, deep-work seminar, personal-systems workshop) rather than the local-history, chess and language-exchange lunches the space pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_tea"
dimension_label = "Interest: Tea"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_tea=Averse"
adherence_signal = "The afternoon breaks chosen are the non-tea breaks (fresh-juice bar, smoothie station, sparkling water and fruit); no tea break is booked, even though the space pushes the tea tasting, the matcha bar and the chai hour. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PerkDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PerkDesk once the desktop is up so the agent finds it on screen.
command = "/opt/perkdesk/start-perkdesk.sh"
timeout_sec = 60.0
retries = 5
