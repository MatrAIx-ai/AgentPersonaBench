version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fidget-clean-reset-web"
theme = "Habit: Nail-biting / fidgeting = Daily · Habit: Procrasti-cleaning = Daily"

[metadata]
difficulty = "hard"
type = "web"
domain = "personal work routine planning"
tags = [ "persona-adherence", "multi-check", "balanced-tradeoffs", "choice-based", "web",]

# Two checks score independent decisions on one artifact (reward 0..2).
# Every plan has the same fee, three-hour reservation, lighting, chair, laptop, privacy, and deliverable target. Fidget-enabled desks include a silent resistance ring but have a compact 60 cm surface with no external monitor; still-hand desks provide a 120 cm surface and external monitor but no tactile aid. Session-reset plans reserve a thirty-minute self-cleaning and sorting break inside each session; uninterrupted plans keep the full focus block and receive a weekly facilities clean instead.
[[checks]]
dimension_id = "habit_nail_biting_fidgeting"
dimension_label = "Habit: Nail-biting / fidgeting"
category = "Behavior: Habits"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "habit_nail_biting_fidgeting=Daily"
adherence_signal = "The final choices consistently select the fidget-enabled workstation rather than the still-hand workstation; each check observes its own independent decision on the same artifact."
[[checks]]
dimension_id = "habit_procrasti_cleaning"
dimension_label = "Habit: Procrasti-cleaning"
category = "Behavior: Habits"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "habit_procrasti_cleaning=Daily"
adherence_signal = "The final choices consistently select the daily cleaning reset rather than the uninterrupted weekly-clean plan; each check observes its own independent decision on the same artifact."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
