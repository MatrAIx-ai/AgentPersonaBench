version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biopics-not-baozi-web"
theme = "Film: Biopic = Love · Cuisine: Chinese = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "biopic", "chinese-cuisine", "dinner-and-a-movie", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biopics-not-baozi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the non-Chinese suppers cuisines it rates neutral; every Chinese dish is chicken or duck (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its taste for biopics and its distaste for Chinese food.
[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_biopic=Love"
adherence_signal = "The films chosen are biopics (the musician's, the athlete's, the scientist's) rather than the comedy, space adventure and heist film the cinema pushes. Ground truth is each item's data-lifereel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_chinese=Avoid"
adherence_signal = "The suppers chosen are the non-Chinese ones (Lebanese, Italian, Greek); no Chinese supper is booked, even though the cinema pushes the baozi and noodles, the kung pao and the duck pancakes. Ground truth is each item's data-wokplate attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
