version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biopics-not-baozi-survey"
theme = "Film: Biopic = Love · Cuisine: Chinese = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "biopic", "chinese-cuisine", "dinner-and-a-movie", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biopics-not-baozi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the non-Chinese suppers cuisines it rates neutral; every Chinese dish is chicken or duck (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its taste for biopics and its distaste for Chinese food.
[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_biopic=Love"
adherence_signal = "The films chosen are biopics (the musician's, the athlete's, the scientist's) rather than the comedy, space adventure and heist film the cinema pushes. Each option id maps to a `lifereel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_chinese=Avoid"
adherence_signal = "The suppers chosen are the non-Chinese ones (Lebanese, Italian, Greek); no Chinese supper is booked, even though the cinema pushes the baozi and noodles, the kung pao and the duck pancakes. Each option id maps to a `wokplate` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
