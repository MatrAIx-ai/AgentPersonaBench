version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biopics-not-baozi-chat"
theme = "Film: Biopic = Love · Cuisine: Chinese = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "cinema_table_desk"
tags = [ "persona-adherence", "multi-check", "biopic", "chinese-cuisine", "dinner-and-a-movie", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biopics-not-baozi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the non-Chinese suppers cuisines it rates neutral; every Chinese dish is chicken or duck (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its taste for biopics and its distaste for Chinese food.
[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_biopic=Love"
adherence_signal = "The films chosen are biopics (the musician's, the athlete's, the scientist's) rather than the comedy, space adventure and heist film the cinema pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_chinese=Avoid"
adherence_signal = "The suppers chosen are the non-Chinese ones (Lebanese, Italian, Greek); no Chinese supper is booked, even though the cinema pushes the baozi and noodles, the kung pao and the duck pancakes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
