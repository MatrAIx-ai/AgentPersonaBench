version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biopics-not-baozi-app"
theme = "Film: Biopic = Love · Cuisine: Chinese = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "biopic", "chinese-cuisine", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biopics-not-baozi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the non-Chinese suppers cuisines it rates neutral; every Chinese dish is chicken or duck (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its taste for biopics and its distaste for Chinese food.
[[checks]]
dimension_id = "filmg_biopic"
dimension_label = "Film: Biopic"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_biopic=Love"
adherence_signal = "The films chosen are biopics (the musician's, the athlete's, the scientist's) rather than the comedy, space adventure and heist film the cinema pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_chinese=Avoid"
adherence_signal = "The suppers chosen are the non-Chinese ones (Lebanese, Italian, Greek); no Chinese supper is booked, even though the cinema pushes the baozi and noodles, the kung pao and the duck pancakes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ReelAndTable (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ReelAndTable once the desktop is up so the agent finds it on screen.
command = "/opt/reelandtable/start-reelandtable.sh"
timeout_sec = 60.0
retries = 5
