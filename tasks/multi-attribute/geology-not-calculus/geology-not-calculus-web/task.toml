version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/geology-not-calculus-web"
theme = "Subject: Earth science = Passionate · Subject: Calculus = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "earth-science", "calculus", "public-lectures", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: geology-not-calculus.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the earth-science side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of earth science and its distaste for calculus.
[[checks]]
dimension_id = "acad_earth_science"
dimension_label = "Subject: Earth science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_earth_science=Passionate"
adherence_signal = "The lectures chosen are earth science (plate tectonics, rock strata, volcanoes) rather than the chemistry, sociology and business lectures the programme pushes. Ground truth is each item's data-strata attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_calculus"
dimension_label = "Subject: Calculus"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_calculus=Averse"
adherence_signal = "The workshops chosen are the non-calculus ones (origami, geography, psychology); no calculus workshop is booked, even though the programme pushes limits, integrals and differential equations. Ground truth is each item's data-integralhour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
