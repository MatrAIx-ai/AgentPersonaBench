version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-mindfulness-no-travelogues-app"
theme = "Interest: Mindfulness = Averse · Books: Travel writing = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "mindfulness", "travel-writing", "reading-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-mindfulness-no-travelogues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, the book is posted ahead and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for mindfulness and its distaste for travel writing.
[[checks]]
dimension_id = "topic_mindfulness"
dimension_label = "Interest: Mindfulness"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_mindfulness=Averse"
adherence_signal = "The sessions chosen are the non-mindfulness ones (languages, night sky, chess); no mindfulness session is booked, even though the centre pushes the meditation hour, the body scan and the mindful-breathing class. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_travel_writing"
dimension_label = "Books: Travel writing"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_travel_writing=Dislike"
adherence_signal = "The books chosen are the non-travelogues (the literary novel, the historical novel, the essays); no travel writing is booked, even though the centre pushes the Silk Road, the coast walk and the rail journey. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfAndSession (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfAndSession once the desktop is up so the agent finds it on screen.
command = "/opt/shelfandsession/start-shelfandsession.sh"
timeout_sec = 60.0
retries = 5
