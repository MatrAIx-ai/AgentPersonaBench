version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-mindfulness-no-travelogues-chat"
theme = "Interest: Mindfulness = Averse · Books: Travel writing = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "wellbeing_reading_centre_desk"
tags = [ "persona-adherence", "multi-check", "mindfulness", "travel-writing", "reading-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-mindfulness-no-travelogues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, the book is posted ahead and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for mindfulness and its distaste for travel writing.
[[checks]]
dimension_id = "topic_mindfulness"
dimension_label = "Interest: Mindfulness"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_mindfulness=Averse"
adherence_signal = "The sessions chosen are the non-mindfulness ones (languages, night sky, chess); no mindfulness session is booked, even though the centre pushes the meditation hour, the body scan and the mindful-breathing class. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_travel_writing"
dimension_label = "Books: Travel writing"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_travel_writing=Dislike"
adherence_signal = "The books chosen are the non-travelogues (the literary novel, the historical novel, the essays); no travel writing is booked, even though the centre pushes the Silk Road, the coast walk and the rail journey. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
