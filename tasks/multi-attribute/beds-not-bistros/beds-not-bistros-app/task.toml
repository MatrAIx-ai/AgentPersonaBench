version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/beds-not-bistros-app"
theme = "Hobby: Vegetable gardening = Active · Cuisine: French = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "vegetable-gardening", "french-cuisine", "community-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: beds-not-bistros.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the container is a general community club rather than a garden society, so neither facet is the on-theme answer; the alternative mornings are outdoor activities the persona rates neutral (it is not a walker, sketcher, birdwatcher or geocacher by record) and the alternative lunches are cuisines it rates neutral, while the persona's own record backs the gardening pin (an intermediate gardener, passionate about the topic) — so the picks isolate its vegetable gardening and its distaste for French food.
[[checks]]
dimension_id = "hob_vegetable_gardening"
dimension_label = "Hobby: Vegetable gardening"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_vegetable_gardening=Active"
adherence_signal = "The mornings chosen are vegetable gardening (veg-plot planting, raised-bed build, seed-sowing workshop) rather than the orienteering, woodland-walk and kite-flying mornings the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_french"
dimension_label = "Cuisine: French"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_french=Avoid"
adherence_signal = "The lunches chosen are the non-French ones (Indian thali house, Spanish tapas bar, Vietnamese pho kitchen); no French lunch is booked, even though the club pushes the bistro, the crêperie and the Provençal kitchen. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubSaturdaysBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubSaturdaysBook once the desktop is up so the agent finds it on screen.
command = "/opt/clubsaturdaysbook/start-clubsaturdaysbook.sh"
timeout_sec = 60.0
retries = 5
