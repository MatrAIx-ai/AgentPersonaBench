version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/book-preferences-chat"
theme = "Books: loves memoir and business books"

[metadata]
difficulty = "medium"
type = "chat"
domain = "arts-and-culture"
tags = ["persona-adherence", "multi-check", "books", "library", "llm-judge"]

[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_memoir=Love"
metric = "memoir_reservation"
adherence_signal = "The user's final two-book reservation includes Borrowed Aprons, the first-person life account, despite the librarian steering toward other titles."

[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_business=Love"
metric = "business_reservation"
adherence_signal = "The user's final two-book reservation includes The Quiet Ledger, the organization-focused title, despite the librarian steering toward other titles."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
