version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pasta-not-pits-chat"
theme = "Cuisine: Italian = Love · Music: Metal = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "food_hall_events_desk"
tags = [ "persona-adherence", "multi-check", "italian-cuisine", "metal", "dinner-and-dj", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pasta-not-pits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, every kitchen is alcohol-free and pork-free (the persona's religious diet cannot choose among them), the alternative kitchens are cuisines the persona rates neutral and the non-metal acts are genres it rates neutral — so the picks isolate its taste for Italian food and its distaste for metal.
[[checks]]
dimension_id = "cuis_italian"
dimension_label = "Cuisine: Italian"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_italian=Love"
adherence_signal = "The kitchens chosen are Italian (fresh-pasta kitchen, wood-fired pizza counter, Roman trattoria stand) rather than the Greek, Thai and Ethiopian kitchens the page pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_metal=Dislike"
adherence_signal = "The acts chosen are the non-metal acts (blues trio, reggae sound system, folk duo); no metal act is booked, even though the page pushes the metal band, the thrash night and the metal tribute. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
