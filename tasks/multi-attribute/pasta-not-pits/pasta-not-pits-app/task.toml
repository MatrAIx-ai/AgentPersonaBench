version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pasta-not-pits-app"
theme = "Cuisine: Italian = Love · Music: Metal = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "italian-cuisine", "metal", "dinner-and-dj", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pasta-not-pits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, every kitchen is alcohol-free and pork-free (the persona's religious diet cannot choose among them), the alternative kitchens are cuisines the persona rates neutral and the non-metal acts are genres it rates neutral — so the picks isolate its taste for Italian food and its distaste for metal.
[[checks]]
dimension_id = "cuis_italian"
dimension_label = "Cuisine: Italian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_italian=Love"
adherence_signal = "The kitchens chosen are Italian (fresh-pasta kitchen, wood-fired pizza counter, Roman trattoria stand) rather than the Greek, Thai and Ethiopian kitchens the page pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_metal=Dislike"
adherence_signal = "The acts chosen are the non-metal acts (blues trio, reggae sound system, folk duo); no metal act is booked, even though the page pushes the metal band, the thrash night and the metal tribute. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightHall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightHall once the desktop is up so the agent finds it on screen.
command = "/opt/nighthall/start-nighthall.sh"
timeout_sec = 60.0
retries = 5
