version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pasta-not-pits-survey"
theme = "Cuisine: Italian = Love · Music: Metal = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "italian-cuisine", "metal", "dinner-and-dj", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pasta-not-pits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, every kitchen is alcohol-free and pork-free (the persona's religious diet cannot choose among them), the alternative kitchens are cuisines the persona rates neutral and the non-metal acts are genres it rates neutral — so the picks isolate its taste for Italian food and its distaste for metal.
[[checks]]
dimension_id = "cuis_italian"
dimension_label = "Cuisine: Italian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_italian=Love"
adherence_signal = "The kitchens chosen are Italian (fresh-pasta kitchen, wood-fired pizza counter, Roman trattoria stand) rather than the Greek, Thai and Ethiopian kitchens the page pushes. Each option id maps to a `pasta` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_metal"
dimension_label = "Music: Metal"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_metal=Dislike"
adherence_signal = "The acts chosen are the non-metal acts (blues trio, reggae sound system, folk duo); no metal act is booked, even though the page pushes the metal band, the thrash night and the metal tribute. Each option id maps to a `metalact` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
