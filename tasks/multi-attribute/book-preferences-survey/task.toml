version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/book-preferences-survey"
theme = "Books: loves memoir and business books"

[metadata]
difficulty = "medium"
type = "survey"
domain = "arts-and-culture"
tags = ["persona-adherence", "multi-check", "books", "library", "rule-based"]

[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_memoir=Love"
metric = "memoir_choices"
pass_equals = 3
adherence_signal = "The persona selects the first-person life account in each of three otherwise comparable library choices."

[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_business=Love"
metric = "business_choices"
pass_equals = 3
adherence_signal = "The persona selects the organization, enterprise, or management-focused book in each of three otherwise comparable library choices."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
