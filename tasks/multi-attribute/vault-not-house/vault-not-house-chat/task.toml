version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/vault-not-house-chat"
theme = "Sport: Gymnastics = Play · Music: House = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "sports_centre_fridays_desk"
tags = [ "persona-adherence", "multi-check", "gymnastics", "house", "sports-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: vault-not-house.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative classes are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its gymnastics and its distaste for house music.
[[checks]]
dimension_id = "sport_gymnastics"
dimension_label = "Sport: Gymnastics"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_gymnastics=Play"
adherence_signal = "The classes chosen are gymnastics (the adult class, the tumbling session, bars and beam) rather than the badminton, climbing and fencing sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_house"
dimension_label = "Music: House"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_house=Dislike"
adherence_signal = "The socials chosen are the non-house ones (drum and bass, reggaeton, funk and soul); no house night is booked, even though the centre pushes the house DJ, the deep-house set and the classic-house night. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
