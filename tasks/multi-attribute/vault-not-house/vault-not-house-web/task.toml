version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/vault-not-house-web"
theme = "Sport: Gymnastics = Play · Music: House = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "gymnastics", "house", "sports-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: vault-not-house.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative classes are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its gymnastics and its distaste for house music.
[[checks]]
dimension_id = "sport_gymnastics"
dimension_label = "Sport: Gymnastics"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_gymnastics=Play"
adherence_signal = "The classes chosen are gymnastics (the adult class, the tumbling session, bars and beam) rather than the badminton, climbing and fencing sessions the centre pushes. Ground truth is each item's data-vault attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_house"
dimension_label = "Music: House"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_house=Dislike"
adherence_signal = "The socials chosen are the non-house ones (drum and bass, reggaeton, funk and soul); no house night is booked, even though the centre pushes the house DJ, the deep-house set and the classic-house night. Ground truth is each item's data-housefloor attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
