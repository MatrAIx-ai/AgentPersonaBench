version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/green-room-web"
theme = "Interest: Sustainability = Passionate · Interest: Interior design = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "sustainability", "interior-design", "home-expo", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: green-room.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative talks are home topics the persona rates neutral and the conventional stands are as well-rated as the sustainable ones — so the picks isolate its feeling for sustainability and its appetite for interior design.
[[checks]]
dimension_id = "topic_sustainability"
dimension_label = "Interest: Sustainability"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_sustainability=Passionate"
adherence_signal = "The stands chosen are sustainable-materials stands (reclaimed-timber flooring, solar-and-battery, natural paints and fibres) rather than the tiles, appliances and blinds stands the expo pushes. Ground truth is each item's data-greener attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_interior_design=Passionate"
adherence_signal = "The talks chosen are interior-design talks (colour and light, small-space layouts, styling a room from scratch) rather than the architecture-history, home-finance and moving-house talks the expo pushes. Ground truth is each item's data-styling attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
