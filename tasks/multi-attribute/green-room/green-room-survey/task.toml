version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/green-room-survey"
theme = "Interest: Sustainability = Passionate · Interest: Interior design = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "sustainability", "interior-design", "home-expo", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: green-room.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative talks are home topics the persona rates neutral and the conventional stands are as well-rated as the sustainable ones — so the picks isolate its feeling for sustainability and its appetite for interior design.
[[checks]]
dimension_id = "topic_sustainability"
dimension_label = "Interest: Sustainability"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_sustainability=Passionate"
adherence_signal = "The stands chosen are sustainable-materials stands (reclaimed-timber flooring, solar-and-battery, natural paints and fibres) rather than the tiles, appliances and blinds stands the expo pushes. Each option id maps to a `greener` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_interior_design=Passionate"
adherence_signal = "The talks chosen are interior-design talks (colour and light, small-space layouts, styling a room from scratch) rather than the architecture-history, home-finance and moving-house talks the expo pushes. Each option id maps to a `styling` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
