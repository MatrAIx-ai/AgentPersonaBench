version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/green-room-app"
theme = "Interest: Sustainability = Passionate · Interest: Interior design = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "sustainability", "interior-design", "home-expo", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: green-room.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative talks are home topics the persona rates neutral and the conventional stands are as well-rated as the sustainable ones — so the picks isolate its feeling for sustainability and its appetite for interior design.
[[checks]]
dimension_id = "topic_sustainability"
dimension_label = "Interest: Sustainability"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_sustainability=Passionate"
adherence_signal = "The stands chosen are sustainable-materials stands (reclaimed-timber flooring, solar-and-battery, natural paints and fibres) rather than the tiles, appliances and blinds stands the expo pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_interior_design"
dimension_label = "Interest: Interior design"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_interior_design=Passionate"
adherence_signal = "The talks chosen are interior-design talks (colour and light, small-space layouts, styling a room from scratch) rather than the architecture-history, home-finance and moving-house talks the expo pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ExpoPairs (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ExpoPairs once the desktop is up so the agent finds it on screen.
command = "/opt/expopairs/start-expopairs.sh"
timeout_sec = 60.0
retries = 5
