version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skydive-not-mezze-survey"
theme = "Hobby: Skydiving = Avid · Cuisine: Lebanese = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "skydiving", "lebanese-cuisine", "airfield-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skydive-not-mezze.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day costs the same and every activity is outdoors (the persona is outdoor-leaning, so being outside is common to both sides); the alternative activities are outdoor hobbies the persona rates neutral and the non-Lebanese lunches cuisines it rates neutral — so the picks isolate its skydiving and its distaste for Lebanese food.
[[checks]]
dimension_id = "hob_skydiving"
dimension_label = "Hobby: Skydiving"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_skydiving=Avid"
adherence_signal = "The activities chosen are skydiving (the tandem jump, the solo freefall jump, the wind-tunnel session) rather than the paragliding, kayaking and climbing mornings the centre pushes. Each option id maps to a `freefall` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_lebanese"
dimension_label = "Cuisine: Lebanese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_lebanese=Avoid"
adherence_signal = "The lunches chosen are the non-Lebanese ones (Italian, Thai, German); no Lebanese lunch is booked, even though the centre pushes the mezze platter, the shawarma and the kibbeh. Each option id maps to a `mezze` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
