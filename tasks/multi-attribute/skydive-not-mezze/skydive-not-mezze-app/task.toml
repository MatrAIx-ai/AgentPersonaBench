version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skydive-not-mezze-app"
theme = "Hobby: Skydiving = Avid · Cuisine: Lebanese = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "skydiving", "lebanese-cuisine", "airfield-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skydive-not-mezze.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day costs the same and every activity is outdoors (the persona is outdoor-leaning, so being outside is common to both sides); the alternative activities are outdoor hobbies the persona rates neutral and the non-Lebanese lunches cuisines it rates neutral — so the picks isolate its skydiving and its distaste for Lebanese food.
[[checks]]
dimension_id = "hob_skydiving"
dimension_label = "Hobby: Skydiving"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_skydiving=Avid"
adherence_signal = "The activities chosen are skydiving (the tandem jump, the solo freefall jump, the wind-tunnel session) rather than the paragliding, kayaking and climbing mornings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_lebanese"
dimension_label = "Cuisine: Lebanese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_lebanese=Avoid"
adherence_signal = "The lunches chosen are the non-Lebanese ones (Italian, Thai, German); no Lebanese lunch is booked, even though the centre pushes the mezze platter, the shawarma and the kibbeh. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysAirfield (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysAirfield once the desktop is up so the agent finds it on screen.
command = "/opt/daysairfield/start-daysairfield.sh"
timeout_sec = 60.0
retries = 5
