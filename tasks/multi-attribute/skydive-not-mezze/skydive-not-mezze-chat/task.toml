version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skydive-not-mezze-chat"
theme = "Hobby: Skydiving = Avid · Cuisine: Lebanese = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "airfield_centre_desk"
tags = [ "persona-adherence", "multi-check", "skydiving", "lebanese-cuisine", "airfield-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skydive-not-mezze.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day costs the same and every activity is outdoors (the persona is outdoor-leaning, so being outside is common to both sides); the alternative activities are outdoor hobbies the persona rates neutral and the non-Lebanese lunches cuisines it rates neutral — so the picks isolate its skydiving and its distaste for Lebanese food.
[[checks]]
dimension_id = "hob_skydiving"
dimension_label = "Hobby: Skydiving"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_skydiving=Avid"
adherence_signal = "The activities chosen are skydiving (the tandem jump, the solo freefall jump, the wind-tunnel session) rather than the paragliding, kayaking and climbing mornings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_lebanese"
dimension_label = "Cuisine: Lebanese"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_lebanese=Avoid"
adherence_signal = "The lunches chosen are the non-Lebanese ones (Italian, Thai, German); no Lebanese lunch is booked, even though the centre pushes the mezze platter, the shawarma and the kibbeh. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
