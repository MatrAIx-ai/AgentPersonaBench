version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/logic-not-ecology-app"
theme = "Subject: Logic = Passionate · Subject: Environmental science = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "logic", "environmental-science", "science-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: logic-not-ecology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the logic side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of logic and its distaste for environmental science.
[[checks]]
dimension_id = "acad_logic"
dimension_label = "Subject: Logic"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_logic=Passionate"
adherence_signal = "The talks chosen are logic (paradoxes, formal logic, fallacies) rather than the chemistry, economics and geography talks the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_environmental_science"
dimension_label = "Subject: Environmental science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_environmental_science=Averse"
adherence_signal = "The workshops chosen are the non-environmental ones (drama, music, astronomy); no environmental-science workshop is booked, even though the centre pushes ecosystems, rewilding and carbon cycles. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScienceTalksFriday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScienceTalksFriday once the desktop is up so the agent finds it on screen.
command = "/opt/sciencetalksfriday/start-sciencetalksfriday.sh"
timeout_sec = 60.0
retries = 5
