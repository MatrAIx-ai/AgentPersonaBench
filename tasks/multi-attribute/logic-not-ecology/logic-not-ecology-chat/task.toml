version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/logic-not-ecology-chat"
theme = "Subject: Logic = Passionate · Subject: Environmental science = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "science_centre_friday_desk"
tags = [ "persona-adherence", "multi-check", "logic", "environmental-science", "science-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: logic-not-ecology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the logic side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of logic and its distaste for environmental science.
[[checks]]
dimension_id = "acad_logic"
dimension_label = "Subject: Logic"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_logic=Passionate"
adherence_signal = "The talks chosen are logic (paradoxes, formal logic, fallacies) rather than the chemistry, economics and geography talks the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_environmental_science"
dimension_label = "Subject: Environmental science"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_environmental_science=Averse"
adherence_signal = "The workshops chosen are the non-environmental ones (drama, music, astronomy); no environmental-science workshop is booked, even though the centre pushes ecosystems, rewilding and carbon cycles. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
