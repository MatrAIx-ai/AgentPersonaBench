version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/essays-not-brisket-chat"
theme = "Books: Essays = Love · Cuisine: American BBQ = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "book_supper_club_host"
tags = [ "persona-adherence", "multi-check", "essays", "american-bbq", "book-and-supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: essays-not-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same; the alternative books are genres the persona rates neutral and the non-BBQ suppers cuisines it rates neutral; every smokehouse dish is chicken or turkey (no pork or beef, so its religious dietary restriction is never the reason) — so the picks isolate its taste for essays and its distaste for American BBQ.
[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_essays=Love"
adherence_signal = "The books chosen are essay collections (the personal essays, the nature essays, the cultural criticism) rather than the fantasy, mystery and memoir picks the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_american_bbq=Avoid"
adherence_signal = "The suppers chosen are the non-BBQ ones (Lebanese, Korean, Greek); no smokehouse supper is booked, even though the club pushes the chicken platter, the smoked turkey and the wings. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
