version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/essays-not-brisket-web"
theme = "Books: Essays = Love · Cuisine: American BBQ = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "essays", "american-bbq", "book-and-supper-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: essays-not-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same; the alternative books are genres the persona rates neutral and the non-BBQ suppers cuisines it rates neutral; every smokehouse dish is chicken or turkey (no pork or beef, so its religious dietary restriction is never the reason) — so the picks isolate its taste for essays and its distaste for American BBQ.
[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_essays=Love"
adherence_signal = "The books chosen are essay collections (the personal essays, the nature essays, the cultural criticism) rather than the fantasy, mystery and memoir picks the club pushes. Ground truth is each item's data-essayist attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_american_bbq=Avoid"
adherence_signal = "The suppers chosen are the non-BBQ ones (Lebanese, Korean, Greek); no smokehouse supper is booked, even though the club pushes the chicken platter, the smoked turkey and the wings. Ground truth is each item's data-smokehouse attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
