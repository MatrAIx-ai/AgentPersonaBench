version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/essays-not-brisket-survey"
theme = "Books: Essays = Love · Cuisine: American BBQ = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "essays", "american-bbq", "book-and-supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: essays-not-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same; the alternative books are genres the persona rates neutral and the non-BBQ suppers cuisines it rates neutral; every smokehouse dish is chicken or turkey (no pork or beef, so its religious dietary restriction is never the reason) — so the picks isolate its taste for essays and its distaste for American BBQ.
[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_essays=Love"
adherence_signal = "The books chosen are essay collections (the personal essays, the nature essays, the cultural criticism) rather than the fantasy, mystery and memoir picks the club pushes. Each option id maps to a `essayist` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_american_bbq=Avoid"
adherence_signal = "The suppers chosen are the non-BBQ ones (Lebanese, Korean, Greek); no smokehouse supper is booked, even though the club pushes the chicken platter, the smoked turkey and the wings. Each option id maps to a `smokehouse` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
