version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/essays-not-brisket-app"
theme = "Books: Essays = Love · Cuisine: American BBQ = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "essays", "american-bbq", "book-and-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: essays-not-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same; the alternative books are genres the persona rates neutral and the non-BBQ suppers cuisines it rates neutral; every smokehouse dish is chicken or turkey (no pork or beef, so its religious dietary restriction is never the reason) — so the picks isolate its taste for essays and its distaste for American BBQ.
[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_essays=Love"
adherence_signal = "The books chosen are essay collections (the personal essays, the nature essays, the cultural criticism) rather than the fantasy, mystery and memoir picks the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_american_bbq=Avoid"
adherence_signal = "The suppers chosen are the non-BBQ ones (Lebanese, Korean, Greek); no smokehouse supper is booked, even though the club pushes the chicken platter, the smoked turkey and the wings. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlateAndPage (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlateAndPage once the desktop is up so the agent finds it on screen.
command = "/opt/plateandpage/start-plateandpage.sh"
timeout_sec = 60.0
retries = 5
