version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/social-media-native-app"
theme = "Social-media native: shares on social, lives in the feed, keeps it short (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "everyday"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE picking session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds
# one kit; the verifier runs an independent rule-based check per attribute. Each
# item carries three hidden ground-truth axes (social/feed/concise, 0..3) that are
# NEVER shown on screen — the agent sees only name + price and must judge for
# itself. A check is HELD iff no selected item scores >= 2 on its axis.
# Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "att_social_media"
dimension_label = "Attitude: Social media"
category = "Worldview: Beliefs"
attribute = "Attitude: Social media"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_social_media=Enthusiast"
metric = "social_axis_max"                   # HELD iff no picked item has social >= 2
adherence_signal = "The checked-out kit contains no avoid/distrust-social-media item (hidden social axis >= 2); a social-media enthusiast embraces sharing online."

[[checks]]
dimension_id = "media_diet"
dimension_label = "Media diet"
category = "Behavior: Preferences"
attribute = "Media diet"
value = "Social-media-heavy"
evaluator = "rule-based"
evaluator_name = "media_diet=Social-media-heavy"
metric = "feed_axis_max"                      # HELD iff no picked item has feed >= 2
adherence_signal = "The kit contains no long-form/academic-only item (hidden feed axis >= 2); a social-media-heavy media diet leans on feeds and short-form."

[[checks]]
dimension_id = "cog_verbosity"
dimension_label = "Cognition: Verbosity"
category = "Linguistic: Communication"
attribute = "Cognition: Verbosity"
value = "Concise"
evaluator = "rule-based"
evaluator_name = "cog_verbosity=Concise"
metric = "concise_axis_max"                   # HELD iff no picked item has concise >= 2
adherence_signal = "The kit contains no long-winded-essay item (hidden concise axis >= 2); a concise communicator keeps things short and punchy."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
