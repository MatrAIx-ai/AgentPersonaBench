version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lens-not-lecture-chat"
theme = "Film: Documentary = Love · Interest: History = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "festival_box_office"
tags = [ "persona-adherence", "multi-check", "documentary", "history", "film-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lens-not-lecture.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with the pass and the same length; the fiction features are from genres the persona rates neutral and the non-history subjects are just as substantial — so the picks isolate the persona's own taste for documentaries and its distaste for history.
[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_documentary=Love"
adherence_signal = "The screenings chosen are documentaries rather than the equally well-reviewed fiction features the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_history"
dimension_label = "Interest: History"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_history=Averse"
adherence_signal = "The screenings chosen are on non-history subjects (reefs, space, street food); no history film is booked, even though the festival pushes its history strand as the headline. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
