version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lens-not-lecture-survey"
theme = "Film: Documentary = Love · Interest: History = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "documentary", "history", "film-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lens-not-lecture.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with the pass and the same length; the fiction features are from genres the persona rates neutral and the non-history subjects are just as substantial — so the picks isolate the persona's own taste for documentaries and its distaste for history.
[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_documentary=Love"
adherence_signal = "The screenings chosen are documentaries rather than the equally well-reviewed fiction features the festival pushes. Each option id maps to a `doc` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_history"
dimension_label = "Interest: History"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_history=Averse"
adherence_signal = "The screenings chosen are on non-history subjects (reefs, space, street food); no history film is booked, even though the festival pushes its history strand as the headline. Each option id maps to a `historic` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
