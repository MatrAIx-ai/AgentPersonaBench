version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lens-not-lecture-web"
theme = "Film: Documentary = Love · Interest: History = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "documentary", "history", "film-festival", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lens-not-lecture.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with the pass and the same length; the fiction features are from genres the persona rates neutral and the non-history subjects are just as substantial — so the picks isolate the persona's own taste for documentaries and its distaste for history.
[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_documentary=Love"
adherence_signal = "The screenings chosen are documentaries rather than the equally well-reviewed fiction features the festival pushes. Ground truth is each item's data-doc attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_history"
dimension_label = "Interest: History"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_history=Averse"
adherence_signal = "The screenings chosen are on non-history subjects (reefs, space, street food); no history film is booked, even though the festival pushes its history strand as the headline. Ground truth is each item's data-historic attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
