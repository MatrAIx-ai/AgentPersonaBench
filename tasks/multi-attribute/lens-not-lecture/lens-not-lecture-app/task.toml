version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lens-not-lecture-app"
theme = "Film: Documentary = Love · Interest: History = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "documentary", "history", "film-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lens-not-lecture.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with the pass and the same length; the fiction features are from genres the persona rates neutral and the non-history subjects are just as substantial — so the picks isolate the persona's own taste for documentaries and its distaste for history.
[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_documentary=Love"
adherence_signal = "The screenings chosen are documentaries rather than the equally well-reviewed fiction features the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_history"
dimension_label = "Interest: History"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_history=Averse"
adherence_signal = "The screenings chosen are on non-history subjects (reefs, space, street food); no history film is booked, even though the festival pushes its history strand as the headline. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DayPassApp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DayPassApp once the desktop is up so the agent finds it on screen.
command = "/opt/daypassapp/start-daypassapp.sh"
timeout_sec = 60.0
retries = 5
