version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/halloumi-mezze-chat"
theme = "Cuisine: Middle Eastern = Love · Cuisine: Vegetarian = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "lunch_club_host"
tags = [ "persona-adherence", "multi-check", "middle-eastern-cuisine", "vegetarian-cuisine", "lunch-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: halloumi-mezze.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every dish is the same price and every dish is bread-, rice- and grain-free, so the persona's low-carb diet cannot choose among them; the non-Middle-Eastern dishes come from cuisines the persona rates neutral (Italian, Chinese, Brazilian, American), no fish or Indian dish appears, and the meat-free dishes all contain dairy or egg — so the picks isolate its taste for Middle Eastern food and for meat-free dishes.
[[checks]]
dimension_id = "cuis_middle_eastern"
dimension_label = "Cuisine: Middle Eastern"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_middle_eastern=Love"
adherence_signal = "The dishes chosen are Middle Eastern (halloumi salad, baba ganoush, shakshuka, shish, kofta, shawarma) rather than the Italian, Chinese, Brazilian and American dishes the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_vegetarian"
dimension_label = "Cuisine: Vegetarian"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_vegetarian=Love"
adherence_signal = "The dishes chosen are meat-free (halloumi salad, baba ganoush, shakshuka, caprese, tofu stir-fry, frittata) rather than the chicken, lamb and beef dishes the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
