version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/halloumi-mezze-app"
theme = "Cuisine: Middle Eastern = Love · Cuisine: Vegetarian = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "middle-eastern-cuisine", "vegetarian-cuisine", "lunch-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: halloumi-mezze.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every dish is the same price and every dish is bread-, rice- and grain-free, so the persona's low-carb diet cannot choose among them; the non-Middle-Eastern dishes come from cuisines the persona rates neutral (Italian, Chinese, Brazilian, American), no fish or Indian dish appears, and the meat-free dishes all contain dairy or egg — so the picks isolate its taste for Middle Eastern food and for meat-free dishes.
[[checks]]
dimension_id = "cuis_middle_eastern"
dimension_label = "Cuisine: Middle Eastern"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_middle_eastern=Love"
adherence_signal = "The dishes chosen are Middle Eastern (halloumi salad, baba ganoush, shakshuka, shish, kofta, shawarma) rather than the Italian, Chinese, Brazilian and American dishes the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_vegetarian"
dimension_label = "Cuisine: Vegetarian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_vegetarian=Love"
adherence_signal = "The dishes chosen are meat-free (halloumi salad, baba ganoush, shakshuka, caprese, tofu stir-fry, frittata) rather than the chicken, lamb and beef dishes the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubLunch (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubLunch once the desktop is up so the agent finds it on screen.
command = "/opt/clublunch/start-clublunch.sh"
timeout_sec = 60.0
retries = 5
