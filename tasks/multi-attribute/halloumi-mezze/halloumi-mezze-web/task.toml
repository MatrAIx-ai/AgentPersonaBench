version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/halloumi-mezze-web"
theme = "Cuisine: Middle Eastern = Love · Cuisine: Vegetarian = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "middle-eastern-cuisine", "vegetarian-cuisine", "lunch-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: halloumi-mezze.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every dish is the same price and every dish is bread-, rice- and grain-free, so the persona's low-carb diet cannot choose among them; the non-Middle-Eastern dishes come from cuisines the persona rates neutral (Italian, Chinese, Brazilian, American), no fish or Indian dish appears, and the meat-free dishes all contain dairy or egg — so the picks isolate its taste for Middle Eastern food and for meat-free dishes.
[[checks]]
dimension_id = "cuis_middle_eastern"
dimension_label = "Cuisine: Middle Eastern"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_middle_eastern=Love"
adherence_signal = "The dishes chosen are Middle Eastern (halloumi salad, baba ganoush, shakshuka, shish, kofta, shawarma) rather than the Italian, Chinese, Brazilian and American dishes the club pushes. Ground truth is each item's data-levant attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_vegetarian"
dimension_label = "Cuisine: Vegetarian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_vegetarian=Love"
adherence_signal = "The dishes chosen are meat-free (halloumi salad, baba ganoush, shakshuka, caprese, tofu stir-fry, frittata) rather than the chicken, lamb and beef dishes the club pushes. Ground truth is each item's data-veggie attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
