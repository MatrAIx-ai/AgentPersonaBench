version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/prudent-planner-app"
theme = "Prudent planner: cautious · patriotism · prudence"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "finance"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE planning session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) chooses a
# set of everyday money moves (savings, insurance, investing, a big purchase); the
# verifier runs an independent rule-based check per attribute. Each option carries
# three hidden ground-truth axes (risk/patriotism/prudence, 0..3) that are NEVER
# shown on screen — the agent sees only name, description, and dollar figure and
# must judge for itself which moves it would genuinely make. A check is HELD iff no
# selected item scores >= 2 on its axis. Reward = integer score, one point per axis
# HELD (0..3). The axes are decorrelated: an option can be low-risk yet imprudent,
# or safe yet unpatriotic (a prudent move routed offshore).
[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
attribute = "Risk tolerance"
value = "Cautious"
evaluator = "rule-based"
evaluator_name = "risk_tolerance=Cautious"
metric = "risk_axis_max"                     # HELD iff no picked item has risk >= 2
adherence_signal = "The checked-out plan contains no high-risk move (hidden risk axis >= 2); a cautious planner sticks to risk-averse choices."

[[checks]]
dimension_id = "val_patriotism"
dimension_label = "Value: Patriotism"
category = "Values & Motivation"
attribute = "Value: Patriotism"
value = "Important"
evaluator = "rule-based"
evaluator_name = "val_patriotism=Important"
metric = "patriotism_axis_max"               # HELD iff no picked item has patriotism >= 2
adherence_signal = "The plan contains no unpatriotic move (hidden patriotism axis >= 2); someone for whom patriotism is an important value keeps money supporting their own country and economy rather than offshoring it."

[[checks]]
dimension_id = "trait_prudence"
dimension_label = "Character: Prudence"
category = "Personality: Character"
attribute = "Character: Prudence"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_prudence=Strong"
metric = "prudence_axis_max"                 # HELD iff no picked item has prudence >= 2
adherence_signal = "The plan contains no impulsive move (hidden prudence axis >= 2); a strongly prudent person researches and plans rather than acting on impulse."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
