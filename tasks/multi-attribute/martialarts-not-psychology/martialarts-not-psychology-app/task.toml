version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/martialarts-not-psychology-app"
theme = "Sport: Martial arts = Follow · Subject: Psychology = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "martial-arts", "psychology", "sports-and-learning-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: martialarts-not-psychology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the martial-arts side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its martial-arts fandom and its distaste for psychology.
[[checks]]
dimension_id = "sport_martial_arts"
dimension_label = "Sport: Martial arts"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_martial_arts=Follow"
adherence_signal = "The outings chosen are martial arts (the karate championship, the taekwondo screening, the judo final) rather than the rugby, tennis and badminton outings the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_psychology"
dimension_label = "Subject: Psychology"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_psychology=Averse"
adherence_signal = "The talks chosen are the non-psychology ones (geography, astronomy, chemistry); no psychology talk is booked, even though the club pushes memory, cognitive biases and habit. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TalkAndMatch (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TalkAndMatch once the desktop is up so the agent finds it on screen.
command = "/opt/talkandmatch/start-talkandmatch.sh"
timeout_sec = 60.0
retries = 5
