version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/martialarts-not-psychology-chat"
theme = "Sport: Martial arts = Follow · Subject: Psychology = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "sports_learning_club_desk"
tags = [ "persona-adherence", "multi-check", "martial-arts", "psychology", "sports-and-learning-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: martialarts-not-psychology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the martial-arts side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its martial-arts fandom and its distaste for psychology.
[[checks]]
dimension_id = "sport_martial_arts"
dimension_label = "Sport: Martial arts"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_martial_arts=Follow"
adherence_signal = "The outings chosen are martial arts (the karate championship, the taekwondo screening, the judo final) rather than the rugby, tennis and badminton outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_psychology"
dimension_label = "Subject: Psychology"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_psychology=Averse"
adherence_signal = "The talks chosen are the non-psychology ones (geography, astronomy, chemistry); no psychology talk is booked, even though the club pushes memory, cognitive biases and habit. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
