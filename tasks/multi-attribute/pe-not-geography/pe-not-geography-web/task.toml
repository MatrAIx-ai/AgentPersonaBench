version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pe-not-geography-web"
theme = "Subject: Physical education = Passionate · Subject: Geography = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "physical-education", "geography", "learning-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pe-not-geography.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative classes and seminars are subjects the persona rates neutral; the physical-education side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of physical education and its distaste for geography.
[[checks]]
dimension_id = "acad_physical_education"
dimension_label = "Subject: Physical education"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_physical_education=Passionate"
adherence_signal = "The classes chosen are physical education (coaching kids' sport, anatomy of movement, designing a training session) rather than the statistics, economics and literature classes the centre pushes. Ground truth is each item's data-whistle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_geography"
dimension_label = "Subject: Geography"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_geography=Averse"
adherence_signal = "The seminars chosen are the non-geography ones (philosophy, music, logic); no geography seminar is booked, even though the centre pushes rivers and cities, map projections and deserts. Ground truth is each item's data-atlashour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
