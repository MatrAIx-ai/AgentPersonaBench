version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pe-not-geography-app"
theme = "Subject: Physical education = Passionate · Subject: Geography = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "physical-education", "geography", "learning-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pe-not-geography.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative classes and seminars are subjects the persona rates neutral; the physical-education side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of physical education and its distaste for geography.
[[checks]]
dimension_id = "acad_physical_education"
dimension_label = "Subject: Physical education"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_physical_education=Passionate"
adherence_signal = "The classes chosen are physical education (coaching kids' sport, anatomy of movement, designing a training session) rather than the statistics, economics and literature classes the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_geography"
dimension_label = "Subject: Geography"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_geography=Averse"
adherence_signal = "The seminars chosen are the non-geography ones (philosophy, music, logic); no geography seminar is booked, even though the centre pushes rivers and cities, map projections and deserts. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClassPairsSaturday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClassPairsSaturday once the desktop is up so the agent finds it on screen.
command = "/opt/classpairssaturday/start-classpairssaturday.sh"
timeout_sec = 60.0
retries = 5
