version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkel-not-salsa-app"
theme = "Hobby: Snorkeling = Avid · Music: Latin = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "snorkeling", "latin", "coastal-resort", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: snorkel-not-salsa.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and kit is provided; the alternative sessions are outdoor hobbies the persona rates neutral and the alternative shows genres it rates neutral — so the picks isolate its snorkelling and its distaste for Latin music.
[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_snorkeling=Avid"
adherence_signal = "The sessions chosen are snorkels (the reef snorkel, the night snorkel, the sea-cave snorkel) rather than the paddleboarding, cliff-climbing and beach-ride sessions the resort pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_latin=Dislike"
adherence_signal = "The shows chosen are the non-Latin ones (blues, indie, gospel); no Latin show is booked, even though the resort pushes the salsa band, the Latin big band and the bachata night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TerraceAndReef (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TerraceAndReef once the desktop is up so the agent finds it on screen.
command = "/opt/terraceandreef/start-terraceandreef.sh"
timeout_sec = 60.0
retries = 5
