version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkel-not-salsa-survey"
theme = "Hobby: Snorkeling = Avid · Music: Latin = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "snorkeling", "latin", "coastal-resort", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: snorkel-not-salsa.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and kit is provided; the alternative sessions are outdoor hobbies the persona rates neutral and the alternative shows genres it rates neutral — so the picks isolate its snorkelling and its distaste for Latin music.
[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_snorkeling=Avid"
adherence_signal = "The sessions chosen are snorkels (the reef snorkel, the night snorkel, the sea-cave snorkel) rather than the paddleboarding, cliff-climbing and beach-ride sessions the resort pushes. Each option id maps to a `snorkel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_latin=Dislike"
adherence_signal = "The shows chosen are the non-Latin ones (blues, indie, gospel); no Latin show is booked, even though the resort pushes the salsa band, the Latin big band and the bachata night. Each option id maps to a `salsanight` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
