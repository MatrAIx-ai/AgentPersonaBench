version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkel-not-salsa-chat"
theme = "Hobby: Snorkeling = Avid · Music: Latin = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "resort_day_pass_desk"
tags = [ "persona-adherence", "multi-check", "snorkeling", "latin", "coastal-resort", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: snorkel-not-salsa.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and kit is provided; the alternative sessions are outdoor hobbies the persona rates neutral and the alternative shows genres it rates neutral — so the picks isolate its snorkelling and its distaste for Latin music.
[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_snorkeling=Avid"
adherence_signal = "The sessions chosen are snorkels (the reef snorkel, the night snorkel, the sea-cave snorkel) rather than the paddleboarding, cliff-climbing and beach-ride sessions the resort pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_latin=Dislike"
adherence_signal = "The shows chosen are the non-Latin ones (blues, indie, gospel); no Latin show is booked, even though the resort pushes the salsa band, the Latin big band and the bachata night. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
