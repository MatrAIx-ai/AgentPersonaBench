version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkel-not-salsa-web"
theme = "Hobby: Snorkeling = Avid · Music: Latin = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "snorkeling", "latin", "coastal-resort", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: snorkel-not-salsa.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and kit is provided; the alternative sessions are outdoor hobbies the persona rates neutral and the alternative shows genres it rates neutral — so the picks isolate its snorkelling and its distaste for Latin music.
[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_snorkeling=Avid"
adherence_signal = "The sessions chosen are snorkels (the reef snorkel, the night snorkel, the sea-cave snorkel) rather than the paddleboarding, cliff-climbing and beach-ride sessions the resort pushes. Ground truth is each item's data-snorkel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_latin=Dislike"
adherence_signal = "The shows chosen are the non-Latin ones (blues, indie, gospel); no Latin show is booked, even though the resort pushes the salsa band, the Latin big band and the bachata night. Ground truth is each item's data-salsanight attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
