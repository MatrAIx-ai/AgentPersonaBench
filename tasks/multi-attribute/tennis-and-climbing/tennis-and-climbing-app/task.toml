version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tennis-and-climbing-app"
theme = "Sport: Tennis = Follow · Sport: Climbing = Follow"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "tennis", "climbing", "supporters-section", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tennis-and-climbing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every weekend costs the same and both halves are the same length with tickets and transport included; the alternative daytime and evening events are sports the persona rates neutral; the tennis side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives; the climbing side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its tennis fandom and its climbing fandom.
[[checks]]
dimension_id = "sport_tennis"
dimension_label = "Sport: Tennis"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_tennis=Follow"
adherence_signal = "The daytime events chosen are tennis (the tour event from centre court, the grand-slam final screening, the Davis Cup tie) rather than the rugby, baseball and fencing days the section pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_climbing"
dimension_label = "Sport: Climbing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_climbing=Follow"
adherence_signal = "The evening events chosen are climbing (the lead world cup final, the national lead-climbing championship from the stands, the speed finals at the wall) rather than the gymnastics, athletics and CrossFit evenings the section pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupportersWeekends (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupportersWeekends once the desktop is up so the agent finds it on screen.
command = "/opt/supportersweekends/start-supportersweekends.sh"
timeout_sec = 60.0
retries = 5
