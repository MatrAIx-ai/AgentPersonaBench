version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-sagas-no-tapas-survey"
theme = "Books: Historical fiction = Dislike · Cuisine: Spanish tapas = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "spanish-tapas", "reading-and-dining-society", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-sagas-no-tapas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the society is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-tapas suppers cuisines it rates neutral; no dish contains pork (so its religious dietary restriction is never the reason) — so the picks isolate its distaste for historical fiction and its distaste for tapas.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_historical_fiction=Dislike"
adherence_signal = "The books chosen are the non-historical ones (the literary novel, the mystery, the romance); no historical novel is booked, even though the society pushes the Tudor novel, the Roman saga and the plague-year novel. Each option id maps to a `saga` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_spanish_tapas=Avoid"
adherence_signal = "The suppers chosen are the non-tapas ones (Lebanese, Peruvian, German); no tapas supper is booked, even though the society pushes the bravas and croquetas, the gambas and the tortilla. Each option id maps to a `tapasboard` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
