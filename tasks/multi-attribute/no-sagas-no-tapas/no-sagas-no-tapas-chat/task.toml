version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-sagas-no-tapas-chat"
theme = "Books: Historical fiction = Dislike · Cuisine: Spanish tapas = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "reading_dining_society_secretary"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "spanish-tapas", "reading-and-dining-society", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-sagas-no-tapas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the society is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-tapas suppers cuisines it rates neutral; no dish contains pork (so its religious dietary restriction is never the reason) — so the picks isolate its distaste for historical fiction and its distaste for tapas.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_historical_fiction=Dislike"
adherence_signal = "The books chosen are the non-historical ones (the literary novel, the mystery, the romance); no historical novel is booked, even though the society pushes the Tudor novel, the Roman saga and the plague-year novel. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_spanish_tapas=Avoid"
adherence_signal = "The suppers chosen are the non-tapas ones (Lebanese, Peruvian, German); no tapas supper is booked, even though the society pushes the bravas and croquetas, the gambas and the tortilla. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
