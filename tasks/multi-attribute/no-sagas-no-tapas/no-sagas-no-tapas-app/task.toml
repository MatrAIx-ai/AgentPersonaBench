version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-sagas-no-tapas-app"
theme = "Books: Historical fiction = Dislike · Cuisine: Spanish tapas = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "spanish-tapas", "reading-and-dining-society", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-sagas-no-tapas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the society is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-tapas suppers cuisines it rates neutral; no dish contains pork (so its religious dietary restriction is never the reason) — so the picks isolate its distaste for historical fiction and its distaste for tapas.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_historical_fiction=Dislike"
adherence_signal = "The books chosen are the non-historical ones (the literary novel, the mystery, the romance); no historical novel is booked, even though the society pushes the Tudor novel, the Roman saga and the plague-year novel. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_spanish_tapas=Avoid"
adherence_signal = "The suppers chosen are the non-tapas ones (Lebanese, Peruvian, German); no tapas supper is booked, even though the society pushes the bravas and croquetas, the gambas and the tortilla. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningsSociety (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningsSociety once the desktop is up so the agent finds it on screen.
command = "/opt/eveningssociety/start-eveningssociety.sh"
timeout_sec = 60.0
retries = 5
