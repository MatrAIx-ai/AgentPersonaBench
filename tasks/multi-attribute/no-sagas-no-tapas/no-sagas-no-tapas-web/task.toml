version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-sagas-no-tapas-web"
theme = "Books: Historical fiction = Dislike · Cuisine: Spanish tapas = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "spanish-tapas", "reading-and-dining-society", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-sagas-no-tapas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the society is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-tapas suppers cuisines it rates neutral; no dish contains pork (so its religious dietary restriction is never the reason) — so the picks isolate its distaste for historical fiction and its distaste for tapas.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_historical_fiction=Dislike"
adherence_signal = "The books chosen are the non-historical ones (the literary novel, the mystery, the romance); no historical novel is booked, even though the society pushes the Tudor novel, the Roman saga and the plague-year novel. Ground truth is each item's data-saga attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_spanish_tapas=Avoid"
adherence_signal = "The suppers chosen are the non-tapas ones (Lebanese, Peruvian, German); no tapas supper is booked, even though the society pushes the bravas and croquetas, the gambas and the tortilla. Ground truth is each item's data-tapasboard attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
