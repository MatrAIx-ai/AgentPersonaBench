version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-litfest-no-shawarma-app"
theme = "Interest: Literature = Averse · Cuisine: Middle Eastern = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "literature", "middle-eastern-cuisine", "cultural-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-litfest-no-shawarma.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is indoor-leaning) and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the non-Middle-Eastern suppers cuisines it rates neutral — so the picks isolate its distaste for literature and its distaste for Middle Eastern food.
[[checks]]
dimension_id = "topic_literature"
dimension_label = "Interest: Literature"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_literature=Averse"
adherence_signal = "The sessions chosen are the non-literature ones (local history, magic, board games); no literature session is booked, even though the centre pushes the author talk, the classic-novels seminar and the reading. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_middle_eastern"
dimension_label = "Cuisine: Middle Eastern"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_middle_eastern=Avoid"
adherence_signal = "The suppers chosen are the non-Middle-Eastern ones (Korean, Thai, Spanish); no Middle Eastern supper is booked, even though the centre pushes the shawarma, the mezze and the kofta. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperSessionThursday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperSessionThursday once the desktop is up so the agent finds it on screen.
command = "/opt/suppersessionthursday/start-suppersessionthursday.sh"
timeout_sec = 60.0
retries = 5
