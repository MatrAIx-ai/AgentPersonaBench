version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-litfest-no-shawarma-chat"
theme = "Interest: Literature = Averse · Cuisine: Middle Eastern = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "cultural_centre_thursday_desk"
tags = [ "persona-adherence", "multi-check", "literature", "middle-eastern-cuisine", "cultural-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-litfest-no-shawarma.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is indoor-leaning) and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the non-Middle-Eastern suppers cuisines it rates neutral — so the picks isolate its distaste for literature and its distaste for Middle Eastern food.
[[checks]]
dimension_id = "topic_literature"
dimension_label = "Interest: Literature"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_literature=Averse"
adherence_signal = "The sessions chosen are the non-literature ones (local history, magic, board games); no literature session is booked, even though the centre pushes the author talk, the classic-novels seminar and the reading. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_middle_eastern"
dimension_label = "Cuisine: Middle Eastern"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_middle_eastern=Avoid"
adherence_signal = "The suppers chosen are the non-Middle-Eastern ones (Korean, Thai, Spanish); no Middle Eastern supper is booked, even though the centre pushes the shawarma, the mezze and the kofta. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
