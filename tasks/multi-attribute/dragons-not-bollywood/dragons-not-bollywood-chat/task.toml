version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dragons-not-bollywood-chat"
theme = "Books: Fantasy = Love · Music: Bollywood = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "book_concert_club_host"
tags = [ "persona-adherence", "multi-check", "fantasy", "bollywood", "book-and-concert-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dragons-not-bollywood.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its taste for fantasy and its distaste for Bollywood music.
[[checks]]
dimension_id = "bookg_fantasy"
dimension_label = "Books: Fantasy"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_fantasy=Love"
adherence_signal = "The books chosen are fantasy (the dragon-rider epic, the portal fantasy, the sword-and-sorcery novel) rather than the mystery, historical and memoir picks the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_bollywood"
dimension_label = "Music: Bollywood"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_bollywood=Dislike"
adherence_signal = "The concerts chosen are the non-Bollywood ones (jazz, country, classical); no Bollywood concert is booked, even though the club pushes the hits night, the live orchestra and the dance party. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
