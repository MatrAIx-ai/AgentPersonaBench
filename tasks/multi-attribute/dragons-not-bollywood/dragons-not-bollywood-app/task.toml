version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dragons-not-bollywood-app"
theme = "Books: Fantasy = Love · Music: Bollywood = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "fantasy", "bollywood", "book-and-concert-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dragons-not-bollywood.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its taste for fantasy and its distaste for Bollywood music.
[[checks]]
dimension_id = "bookg_fantasy"
dimension_label = "Books: Fantasy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_fantasy=Love"
adherence_signal = "The books chosen are fantasy (the dragon-rider epic, the portal fantasy, the sword-and-sorcery novel) rather than the mystery, historical and memoir picks the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_bollywood"
dimension_label = "Music: Bollywood"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_bollywood=Dislike"
adherence_signal = "The concerts chosen are the non-Bollywood ones (jazz, country, classical); no Bollywood concert is booked, even though the club pushes the hits night, the live orchestra and the dance party. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TuneAndTome (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TuneAndTome once the desktop is up so the agent finds it on screen.
command = "/opt/tuneandtome/start-tuneandtome.sh"
timeout_sec = 60.0
retries = 5
