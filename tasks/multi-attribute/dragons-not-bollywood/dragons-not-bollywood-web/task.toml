version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dragons-not-bollywood-web"
theme = "Books: Fantasy = Love · Music: Bollywood = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "fantasy", "bollywood", "book-and-concert-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dragons-not-bollywood.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its taste for fantasy and its distaste for Bollywood music.
[[checks]]
dimension_id = "bookg_fantasy"
dimension_label = "Books: Fantasy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_fantasy=Love"
adherence_signal = "The books chosen are fantasy (the dragon-rider epic, the portal fantasy, the sword-and-sorcery novel) rather than the mystery, historical and memoir picks the club pushes. Ground truth is each item's data-dragonrider attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_bollywood"
dimension_label = "Music: Bollywood"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_bollywood=Dislike"
adherence_signal = "The concerts chosen are the non-Bollywood ones (jazz, country, classical); no Bollywood concert is booked, even though the club pushes the hits night, the live orchestra and the dance party. Ground truth is each item's data-filmi attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
