version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ears-on-court-survey"
theme = "Sport: Basketball = Play · Learning style = Auditory"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "multi-check", "basketball", "learning-style", "coaching-courses", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ears-on-court.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course costs the same, runs the same hours and is by a certified coach; the alternative sports are ones the persona rates neutral and the written formats are just as thorough — so the picks isolate the persona's own basketball and its preference for learning by listening.
[[checks]]
dimension_id = "sport_basketball"
dimension_label = "Sport: Basketball"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_basketball=Play"
adherence_signal = "The courses chosen are basketball courses (shooting mechanics, pick-and-roll reads, point-guard decisions) rather than the equally well-made tennis, swim and golf courses the marketplace pushes. Each option id maps to a `hoops` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "learning_style"
dimension_label = "Learning style"
category = "Learning: Style"
value = "Auditory"
evaluator = "rule-based"
evaluator_name = "learning_style=Auditory"
adherence_signal = "The formats chosen are the audio ones (coach's audio series, narrated playbook, podcast-style course) rather than the written workbooks, card decks and case-study packs the marketplace pushes. Each option id maps to a `audio` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
