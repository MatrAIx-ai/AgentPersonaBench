version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ears-on-court-chat"
theme = "Sport: Basketball = Play · Learning style = Auditory"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "coaching_marketplace_desk"
tags = [ "persona-adherence", "multi-check", "basketball", "learning-style", "coaching-courses", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ears-on-court.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course costs the same, runs the same hours and is by a certified coach; the alternative sports are ones the persona rates neutral and the written formats are just as thorough — so the picks isolate the persona's own basketball and its preference for learning by listening.
[[checks]]
dimension_id = "sport_basketball"
dimension_label = "Sport: Basketball"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_basketball=Play"
adherence_signal = "The courses chosen are basketball courses (shooting mechanics, pick-and-roll reads, point-guard decisions) rather than the equally well-made tennis, swim and golf courses the marketplace pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "learning_style"
dimension_label = "Learning style"
category = "Learning: Style"
value = "Auditory"
evaluator = "llm-judge"
evaluator_name = "learning_style=Auditory"
adherence_signal = "The formats chosen are the audio ones (coach's audio series, narrated playbook, podcast-style course) rather than the written workbooks, card decks and case-study packs the marketplace pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
