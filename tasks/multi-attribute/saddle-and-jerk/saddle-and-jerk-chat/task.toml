version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-and-jerk-chat"
theme = "Hobby: Horseback riding = Active · Cuisine: Caribbean = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "day_trip_planner"
tags = [ "persona-adherence", "multi-check", "horseback-riding", "caribbean-cuisine", "day-trips", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-and-jerk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every kitchen is pork-free and alcohol-free; the alternative activities are outdoor mornings the persona rates neutral and the alternative lunches cuisines it rates neutral — so the picks isolate its riding and its taste for Caribbean food.
[[checks]]
dimension_id = "hob_horseback_riding"
dimension_label = "Hobby: Horseback riding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_horseback_riding=Active"
adherence_signal = "The activities chosen are riding (trail ride, beach hack, riding lesson) rather than the kayak, bike and boat mornings the operator pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_caribbean"
dimension_label = "Cuisine: Caribbean"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_caribbean=Love"
adherence_signal = "The lunches chosen are Caribbean (jerk-chicken shack, curry-goat kitchen, roti stop) rather than the Moroccan, Brazilian and Thai lunches the operator pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
