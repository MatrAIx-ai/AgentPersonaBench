version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-and-jerk-web"
theme = "Hobby: Horseback riding = Active · Cuisine: Caribbean = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "horseback-riding", "caribbean-cuisine", "day-trips", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-and-jerk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every kitchen is pork-free and alcohol-free; the alternative activities are outdoor mornings the persona rates neutral and the alternative lunches cuisines it rates neutral — so the picks isolate its riding and its taste for Caribbean food.
[[checks]]
dimension_id = "hob_horseback_riding"
dimension_label = "Hobby: Horseback riding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_horseback_riding=Active"
adherence_signal = "The activities chosen are riding (trail ride, beach hack, riding lesson) rather than the kayak, bike and boat mornings the operator pushes. Ground truth is each item's data-saddle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_caribbean"
dimension_label = "Cuisine: Caribbean"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_caribbean=Love"
adherence_signal = "The lunches chosen are Caribbean (jerk-chicken shack, curry-goat kitchen, roti stop) rather than the Moroccan, Brazilian and Thai lunches the operator pushes. Ground truth is each item's data-jerk attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
