version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-and-jerk-app"
theme = "Hobby: Horseback riding = Active · Cuisine: Caribbean = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "horseback-riding", "caribbean-cuisine", "day-trips", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-and-jerk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every kitchen is pork-free and alcohol-free; the alternative activities are outdoor mornings the persona rates neutral and the alternative lunches cuisines it rates neutral — so the picks isolate its riding and its taste for Caribbean food.
[[checks]]
dimension_id = "hob_horseback_riding"
dimension_label = "Hobby: Horseback riding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_horseback_riding=Active"
adherence_signal = "The activities chosen are riding (trail ride, beach hack, riding lesson) rather than the kayak, bike and boat mornings the operator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_caribbean"
dimension_label = "Cuisine: Caribbean"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_caribbean=Love"
adherence_signal = "The lunches chosen are Caribbean (jerk-chicken shack, curry-goat kitchen, roti stop) rather than the Moroccan, Brazilian and Thai lunches the operator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysTrip (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysTrip once the desktop is up so the agent finds it on screen.
command = "/opt/daystrip/start-daystrip.sh"
timeout_sec = 60.0
retries = 5
