version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-and-jerk-survey"
theme = "Hobby: Horseback riding = Active · Cuisine: Caribbean = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "horseback-riding", "caribbean-cuisine", "day-trips", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-and-jerk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every kitchen is pork-free and alcohol-free; the alternative activities are outdoor mornings the persona rates neutral and the alternative lunches cuisines it rates neutral — so the picks isolate its riding and its taste for Caribbean food.
[[checks]]
dimension_id = "hob_horseback_riding"
dimension_label = "Hobby: Horseback riding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_horseback_riding=Active"
adherence_signal = "The activities chosen are riding (trail ride, beach hack, riding lesson) rather than the kayak, bike and boat mornings the operator pushes. Each option id maps to a `saddle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_caribbean"
dimension_label = "Cuisine: Caribbean"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_caribbean=Love"
adherence_signal = "The lunches chosen are Caribbean (jerk-chicken shack, curry-goat kitchen, roti stop) rather than the Moroccan, Brazilian and Thai lunches the operator pushes. Each option id maps to a `jerk` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
