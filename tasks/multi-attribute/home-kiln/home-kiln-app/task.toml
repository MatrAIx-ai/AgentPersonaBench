version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-kiln-app"
theme = "Vacation style = Staycation · Hobby: Pottery = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "vacation-style", "pottery", "holiday-courses", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: home-kiln.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course costs the same for the same days, with travel and lodging included where away; the away versions are fully arranged and the alternative crafts are just as hands-on — so the picks isolate the persona's own preference for holidaying from home and its pottery.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Staycation"
evaluator = "rule-based"
evaluator_name = "lstyle_vacation_style=Staycation"
adherence_signal = "The courses chosen are the local ones with nights at home (town studio, community kiln, day-return pottery) rather than the residential, retreat and hotel versions the site pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_pottery"
dimension_label = "Hobby: Pottery"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_pottery=Active"
adherence_signal = "The courses chosen are pottery (wheel throwing, hand building, glaze and fire) rather than the equally good woodturning, weaving and stained-glass courses the site pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LeaveWeeks (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LeaveWeeks once the desktop is up so the agent finds it on screen.
command = "/opt/leaveweeks/start-leaveweeks.sh"
timeout_sec = 60.0
retries = 5
