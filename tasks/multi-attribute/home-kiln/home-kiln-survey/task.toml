version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-kiln-survey"
theme = "Vacation style = Staycation · Hobby: Pottery = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "vacation-style", "pottery", "holiday-courses", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: home-kiln.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course costs the same for the same days, with travel and lodging included where away; the away versions are fully arranged and the alternative crafts are just as hands-on — so the picks isolate the persona's own preference for holidaying from home and its pottery.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Staycation"
evaluator = "rule-based"
evaluator_name = "lstyle_vacation_style=Staycation"
adherence_signal = "The courses chosen are the local ones with nights at home (town studio, community kiln, day-return pottery) rather than the residential, retreat and hotel versions the site pushes. Each option id maps to a `homebase` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_pottery"
dimension_label = "Hobby: Pottery"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_pottery=Active"
adherence_signal = "The courses chosen are pottery (wheel throwing, hand building, glaze and fire) rather than the equally good woodturning, weaving and stained-glass courses the site pushes. Each option id maps to a `clay` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
