version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-gyros-no-capes-chat"
theme = "Cuisine: Greek = Avoid · Film: Superhero = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "supper_club_concierge"
tags = [ "persona-adherence", "multi-check", "greek-cuisine", "superhero-films", "dinner-and-a-movie", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-gyros-no-capes.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every deal costs the same, seats the same and serves no alcohol; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own distaste for Greek food and for superhero films.
[[checks]]
dimension_id = "cuis_greek"
dimension_label = "Cuisine: Greek"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_greek=Avoid"
adherence_signal = "The dinner halves of the deals chosen are the non-Greek plates; no souvlaki, spanakopita or gyros deal is booked, even though the club pushes the Greek kitchen as its residency. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_superhero"
dimension_label = "Film: Superhero"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_superhero=Dislike"
adherence_signal = "The film halves of the deals chosen are the non-superhero screenings; no caped-crusader, masked-vigilante or super-team film is booked, even though the club pushes them as the event screenings. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
