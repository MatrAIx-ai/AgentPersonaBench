version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-gyros-no-capes-app"
theme = "Cuisine: Greek = Avoid · Film: Superhero = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "greek-cuisine", "superhero-films", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-gyros-no-capes.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every deal costs the same, seats the same and serves no alcohol; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own distaste for Greek food and for superhero films.
[[checks]]
dimension_id = "cuis_greek"
dimension_label = "Cuisine: Greek"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_greek=Avoid"
adherence_signal = "The dinner halves of the deals chosen are the non-Greek plates; no souvlaki, spanakopita or gyros deal is booked, even though the club pushes the Greek kitchen as its residency. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_superhero"
dimension_label = "Film: Superhero"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_superhero=Dislike"
adherence_signal = "The film halves of the deals chosen are the non-superhero screenings; no caped-crusader, masked-vigilante or super-team film is booked, even though the club pushes them as the event screenings. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenSupper (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenSupper once the desktop is up so the agent finds it on screen.
command = "/opt/screensupper/start-screensupper.sh"
timeout_sec = 60.0
retries = 5
