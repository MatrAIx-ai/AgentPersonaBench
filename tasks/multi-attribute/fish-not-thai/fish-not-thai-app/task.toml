version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fish-not-thai-app"
theme = "Diet type = Pescatarian · Cuisine: Thai = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "diet-type", "thai-cuisine", "lunch-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fish-not-thai.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every lunch costs the same, is the same portion and contains no pork or alcohol; fish and vegetable dishes are set against equally good meat dishes, and Thai cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own fish-and-vegetable diet and its distaste for Thai food independently.
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
value = "Pescatarian"
evaluator = "rule-based"
evaluator_name = "lstyle_diet_type=Pescatarian"
adherence_signal = "The lunches chosen are fish or vegetable dishes; no chicken, beef or lamb dish is ordered, even though the club pushes the meat dishes as the week's specials. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_thai"
dimension_label = "Cuisine: Thai"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_thai=Avoid"
adherence_signal = "The lunches chosen are from other cuisines; no Thai dish is ordered, even though the club pushes the Thai kitchen as its most popular. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubOrder (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubOrder once the desktop is up so the agent finds it on screen.
command = "/opt/cluborder/start-cluborder.sh"
timeout_sec = 60.0
retries = 5
