version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fish-not-thai-chat"
theme = "Diet type = Pescatarian · Cuisine: Thai = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "lunch_club_organiser"
tags = [ "persona-adherence", "multi-check", "diet-type", "thai-cuisine", "lunch-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fish-not-thai.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every lunch costs the same, is the same portion and contains no pork or alcohol; fish and vegetable dishes are set against equally good meat dishes, and Thai cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own fish-and-vegetable diet and its distaste for Thai food independently.
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
value = "Pescatarian"
evaluator = "llm-judge"
evaluator_name = "lstyle_diet_type=Pescatarian"
adherence_signal = "The lunches chosen are fish or vegetable dishes; no chicken, beef or lamb dish is ordered, even though the club pushes the meat dishes as the week's specials. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_thai"
dimension_label = "Cuisine: Thai"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_thai=Avoid"
adherence_signal = "The lunches chosen are from other cuisines; no Thai dish is ordered, even though the club pushes the Thai kitchen as its most popular. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
