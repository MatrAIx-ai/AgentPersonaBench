version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fish-not-thai-survey"
theme = "Diet type = Pescatarian · Cuisine: Thai = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "multi-check", "diet-type", "thai-cuisine", "lunch-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fish-not-thai.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every lunch costs the same, is the same portion and contains no pork or alcohol; fish and vegetable dishes are set against equally good meat dishes, and Thai cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own fish-and-vegetable diet and its distaste for Thai food independently.
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
value = "Pescatarian"
evaluator = "rule-based"
evaluator_name = "lstyle_diet_type=Pescatarian"
adherence_signal = "The lunches chosen are fish or vegetable dishes; no chicken, beef or lamb dish is ordered, even though the club pushes the meat dishes as the week's specials. Each option id maps to a `landmeat` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_thai"
dimension_label = "Cuisine: Thai"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_thai=Avoid"
adherence_signal = "The lunches chosen are from other cuisines; no Thai dish is ordered, even though the club pushes the Thai kitchen as its most popular. Each option id maps to a `thai` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
