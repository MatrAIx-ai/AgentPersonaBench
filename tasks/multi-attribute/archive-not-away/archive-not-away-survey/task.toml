version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/archive-not-away-survey"
theme = "Books: History = Love · Travel frequency = Homebody"

[metadata]
difficulty = "easy"
type = "survey"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "history-books", "travel-frequency", "reading-society", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: archive-not-away.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event is free with membership and the same length; the away versions are fully organised with travel included and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own devotion to history and its preference for staying close to home.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_history=Love"
adherence_signal = "The society events chosen are the history ones (medieval trade, the archives, the Silk Road) rather than the equally engaging poetry, science-fiction and mystery events the programme pushes. Each option id maps to a `chronicle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "lstyle_travel_freq"
dimension_label = "Travel frequency"
category = "Interests: Culture"
value = "Homebody"
evaluator = "rule-based"
evaluator_name = "lstyle_travel_freq=Homebody"
adherence_signal = "The events chosen are the local ones (town library, community hall, records office) rather than the overnight, coach-trip and residential-weekend versions the programme pushes. Each option id maps to a `local` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
