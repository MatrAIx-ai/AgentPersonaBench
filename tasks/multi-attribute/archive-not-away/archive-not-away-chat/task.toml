version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/archive-not-away-chat"
theme = "Books: History = Love · Travel frequency = Homebody"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "reading_society_secretary"
tags = [ "persona-adherence", "multi-check", "history-books", "travel-frequency", "reading-society", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: archive-not-away.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event is free with membership and the same length; the away versions are fully organised with travel included and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own devotion to history and its preference for staying close to home.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_history=Love"
adherence_signal = "The society events chosen are the history ones (medieval trade, the archives, the Silk Road) rather than the equally engaging poetry, science-fiction and mystery events the programme pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "lstyle_travel_freq"
dimension_label = "Travel frequency"
category = "Interests: Culture"
value = "Homebody"
evaluator = "llm-judge"
evaluator_name = "lstyle_travel_freq=Homebody"
adherence_signal = "The events chosen are the local ones (town library, community hall, records office) rather than the overnight, coach-trip and residential-weekend versions the programme pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
