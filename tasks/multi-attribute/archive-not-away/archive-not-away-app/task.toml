version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/archive-not-away-app"
theme = "Books: History = Love · Travel frequency = Homebody"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "history-books", "travel-frequency", "reading-society", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: archive-not-away.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event is free with membership and the same length; the away versions are fully organised with travel included and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own devotion to history and its preference for staying close to home.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_history=Love"
adherence_signal = "The society events chosen are the history ones (medieval trade, the archives, the Silk Road) rather than the equally engaging poetry, science-fiction and mystery events the programme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "lstyle_travel_freq"
dimension_label = "Travel frequency"
category = "Interests: Culture"
value = "Homebody"
evaluator = "rule-based"
evaluator_name = "lstyle_travel_freq=Homebody"
adherence_signal = "The events chosen are the local ones (town library, community hall, records office) rather than the overnight, coach-trip and residential-weekend versions the programme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ReadersDiary (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ReadersDiary once the desktop is up so the agent finds it on screen.
command = "/opt/readersdiary/start-readersdiary.sh"
timeout_sec = 60.0
retries = 5
