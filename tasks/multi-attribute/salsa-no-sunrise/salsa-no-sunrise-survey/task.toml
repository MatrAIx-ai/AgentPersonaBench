version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/salsa-no-sunrise-survey"
theme = "Music: Latin = Love · Interest: Yoga = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "latin-music", "yoga", "resort-day-pass", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: salsa-no-sunrise.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass is included in the stay, alcohol-free and the same length on both halves; the alternative genres are ones the persona rates neutral and the non-yoga mornings are just as gentle — so the picks isolate the persona's own Latin music and its distaste for yoga.
[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_latin=Love"
adherence_signal = "The evening halves of the day passes are Latin sets (salsa band, bossa nova trio, cumbia night) rather than the equally good house, folk and classical sets the resort pushes. Each option id maps to a `clave` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_yoga"
dimension_label = "Interest: Yoga"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_yoga=Averse"
adherence_signal = "The morning halves of the day passes are the non-yoga mornings (volleyball, aqua aerobics, coastal walk); no yoga session is booked, even though the resort pushes the yoga mornings as its signature. Each option id maps to a `mat` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
