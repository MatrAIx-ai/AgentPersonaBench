version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/salsa-no-sunrise-chat"
theme = "Music: Latin = Love · Interest: Yoga = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "resort_concierge"
tags = [ "persona-adherence", "multi-check", "latin-music", "yoga", "resort-day-pass", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: salsa-no-sunrise.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass is included in the stay, alcohol-free and the same length on both halves; the alternative genres are ones the persona rates neutral and the non-yoga mornings are just as gentle — so the picks isolate the persona's own Latin music and its distaste for yoga.
[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_latin=Love"
adherence_signal = "The evening halves of the day passes are Latin sets (salsa band, bossa nova trio, cumbia night) rather than the equally good house, folk and classical sets the resort pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_yoga"
dimension_label = "Interest: Yoga"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_yoga=Averse"
adherence_signal = "The morning halves of the day passes are the non-yoga mornings (volleyball, aqua aerobics, coastal walk); no yoga session is booked, even though the resort pushes the yoga mornings as its signature. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
