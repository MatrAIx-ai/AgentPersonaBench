version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/salsa-no-sunrise-app"
theme = "Music: Latin = Love · Interest: Yoga = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "latin-music", "yoga", "resort-day-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: salsa-no-sunrise.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass is included in the stay, alcohol-free and the same length on both halves; the alternative genres are ones the persona rates neutral and the non-yoga mornings are just as gentle — so the picks isolate the persona's own Latin music and its distaste for yoga.
[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_latin=Love"
adherence_signal = "The evening halves of the day passes are Latin sets (salsa band, bossa nova trio, cumbia night) rather than the equally good house, folk and classical sets the resort pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_yoga"
dimension_label = "Interest: Yoga"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_yoga=Averse"
adherence_signal = "The morning halves of the day passes are the non-yoga mornings (volleyball, aqua aerobics, coastal walk); no yoga session is booked, even though the resort pushes the yoga mornings as its signature. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StayPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StayPass once the desktop is up so the agent finds it on screen.
command = "/opt/staypass/start-staypass.sh"
timeout_sec = 60.0
retries = 5
