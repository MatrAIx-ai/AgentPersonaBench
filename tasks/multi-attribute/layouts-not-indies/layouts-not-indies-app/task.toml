version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/layouts-not-indies-app"
theme = "Hobby: Scrapbooking = Avid · Film: Indie film = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "indie-film", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: layouts-not-indies.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its scrapbooking and its distaste for indie films.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_scrapbooking=Avid"
adherence_signal = "The workshops chosen are scrapbooking (the heritage album, the travel journal, the embellishment class) rather than the knitting, pottery and calligraphy sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_indie_film"
dimension_label = "Film: Indie film"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_indie_film=Dislike"
adherence_signal = "The films chosen are the non-indie ones (the western, the costume piece, the musical); no indie film is booked, even though the centre pushes the micro-budget drama, the festival comedy and the first feature. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenAndAlbum (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenAndAlbum once the desktop is up so the agent finds it on screen.
command = "/opt/screenandalbum/start-screenandalbum.sh"
timeout_sec = 60.0
retries = 5
