version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/layouts-not-indies-web"
theme = "Hobby: Scrapbooking = Avid · Film: Indie film = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "indie-film", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: layouts-not-indies.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its scrapbooking and its distaste for indie films.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_scrapbooking=Avid"
adherence_signal = "The workshops chosen are scrapbooking (the heritage album, the travel journal, the embellishment class) rather than the knitting, pottery and calligraphy sessions the centre pushes. Ground truth is each item's data-album attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_indie_film"
dimension_label = "Film: Indie film"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_indie_film=Dislike"
adherence_signal = "The films chosen are the non-indie ones (the western, the costume piece, the musical); no indie film is booked, even though the centre pushes the micro-budget drama, the festival comedy and the first feature. Ground truth is each item's data-indiereel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
