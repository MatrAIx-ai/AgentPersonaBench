version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/layouts-not-indies-survey"
theme = "Hobby: Scrapbooking = Avid · Film: Indie film = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "indie-film", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: layouts-not-indies.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its scrapbooking and its distaste for indie films.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_scrapbooking=Avid"
adherence_signal = "The workshops chosen are scrapbooking (the heritage album, the travel journal, the embellishment class) rather than the knitting, pottery and calligraphy sessions the centre pushes. Each option id maps to a `album` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_indie_film"
dimension_label = "Film: Indie film"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_indie_film=Dislike"
adherence_signal = "The films chosen are the non-indie ones (the western, the costume piece, the musical); no indie film is booked, even though the centre pushes the micro-budget drama, the festival comedy and the first feature. Each option id maps to a `indiereel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
