version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rugby-and-volleyball-survey"
theme = "Sport: Rugby = Follow · Sport: Volleyball = Follow"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "rugby", "volleyball", "members-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rugby-and-volleyball.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every weekend costs the same and both halves are the same length with tickets and transport included; the alternative afternoons and screenings are sports the persona rates neutral; the rugby side comes with the away end, a 45-minute coach transfer and the alternatives with the home stand, five minutes from the club, so a chooser with no stake in the trait takes the alternatives; the volleyball side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its rugby fandom and its volleyball fandom.
[[checks]]
dimension_id = "sport_rugby"
dimension_label = "Sport: Rugby"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_rugby=Follow"
adherence_signal = "The afternoon fixtures chosen are rugby (the club match from the main stand, the cup semi-final, the sevens tournament day) rather than the basketball, hockey and cricket afternoons the club pushes. Each option id maps to a `mainstand` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_volleyball"
dimension_label = "Sport: Volleyball"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_volleyball=Follow"
adherence_signal = "The evening screenings chosen are volleyball (the indoor league final, the nations-league match, the beach-volleyball tour final) rather than the badminton, table-tennis and tennis screenings the club pushes. Each option id maps to a `netside` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
