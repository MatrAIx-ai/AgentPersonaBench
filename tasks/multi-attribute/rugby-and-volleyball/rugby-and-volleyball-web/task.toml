version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rugby-and-volleyball-web"
theme = "Sport: Rugby = Follow · Sport: Volleyball = Follow"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "rugby", "volleyball", "members-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rugby-and-volleyball.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every weekend costs the same and both halves are the same length with tickets and transport included; the alternative afternoons and screenings are sports the persona rates neutral; the rugby side comes with the away end, a 45-minute coach transfer and the alternatives with the home stand, five minutes from the club, so a chooser with no stake in the trait takes the alternatives; the volleyball side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its rugby fandom and its volleyball fandom.
[[checks]]
dimension_id = "sport_rugby"
dimension_label = "Sport: Rugby"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_rugby=Follow"
adherence_signal = "The afternoon fixtures chosen are rugby (the club match from the main stand, the cup semi-final, the sevens tournament day) rather than the basketball, hockey and cricket afternoons the club pushes. Ground truth is each item's data-mainstand attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "sport_volleyball"
dimension_label = "Sport: Volleyball"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_volleyball=Follow"
adherence_signal = "The evening screenings chosen are volleyball (the indoor league final, the nations-league match, the beach-volleyball tour final) rather than the badminton, table-tennis and tennis screenings the club pushes. Ground truth is each item's data-netside attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
