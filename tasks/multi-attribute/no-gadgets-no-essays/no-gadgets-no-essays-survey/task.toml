version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-gadgets-no-essays-survey"
theme = "Interest: Technology = Averse · Books: Essays = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "technology", "essays", "library-tuesdays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-gadgets-no-essays.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Tuesday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for technology and its distaste for essays.
[[checks]]
dimension_id = "topic_technology"
dimension_label = "Interest: Technology"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_technology=Averse"
adherence_signal = "The sessions chosen are the non-technology ones (local history, birdwatching, chess); no technology session is booked, even though the library pushes the smartphone clinic, the smart-home demo and the tech-trends talk. Each option id maps to a `gadget` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_essays=Dislike"
adherence_signal = "The books chosen are the non-essay ones (the memoir, the history, the poetry); no essay collection is booked, even though the library pushes the personal essays, the nature essays and the criticism. Each option id maps to a `essayshelf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
