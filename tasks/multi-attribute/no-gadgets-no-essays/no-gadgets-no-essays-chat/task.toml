version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-gadgets-no-essays-chat"
theme = "Interest: Technology = Averse · Books: Essays = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "library_tuesday_desk"
tags = [ "persona-adherence", "multi-check", "technology", "essays", "library-tuesdays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-gadgets-no-essays.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Tuesday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for technology and its distaste for essays.
[[checks]]
dimension_id = "topic_technology"
dimension_label = "Interest: Technology"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_technology=Averse"
adherence_signal = "The sessions chosen are the non-technology ones (local history, birdwatching, chess); no technology session is booked, even though the library pushes the smartphone clinic, the smart-home demo and the tech-trends talk. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_essays=Dislike"
adherence_signal = "The books chosen are the non-essay ones (the memoir, the history, the poetry); no essay collection is booked, even though the library pushes the personal essays, the nature essays and the criticism. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
