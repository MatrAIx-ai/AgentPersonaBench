version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/astronomy-not-geometry-app"
theme = "Subject: Astronomy = Passionate · Subject: Geometry = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "astronomy", "geometry", "science-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: astronomy-not-geometry.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the astronomy side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of astronomy and its distaste for geometry.
[[checks]]
dimension_id = "acad_astronomy"
dimension_label = "Subject: Astronomy"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_astronomy=Passionate"
adherence_signal = "The talks chosen are astronomy (the life of stars, exoplanets, the night sky this season) rather than the chemistry, economics and anthropology talks the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_geometry"
dimension_label = "Subject: Geometry"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_geometry=Averse"
adherence_signal = "The workshops chosen are the non-geometry ones (biology, foreign languages, drama); no geometry workshop is booked, even though the centre pushes Euclid, tilings and compass-and-straightedge proofs. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysScienceCentre (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysScienceCentre once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayssciencecentre/start-saturdayssciencecentre.sh"
timeout_sec = 60.0
retries = 5
