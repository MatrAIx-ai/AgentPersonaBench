version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/astronomy-not-geometry-chat"
theme = "Subject: Astronomy = Passionate · Subject: Geometry = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "science_centre_learning_desk"
tags = [ "persona-adherence", "multi-check", "astronomy", "geometry", "science-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: astronomy-not-geometry.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the astronomy side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of astronomy and its distaste for geometry.
[[checks]]
dimension_id = "acad_astronomy"
dimension_label = "Subject: Astronomy"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_astronomy=Passionate"
adherence_signal = "The talks chosen are astronomy (the life of stars, exoplanets, the night sky this season) rather than the chemistry, economics and anthropology talks the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_geometry"
dimension_label = "Subject: Geometry"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_geometry=Averse"
adherence_signal = "The workshops chosen are the non-geometry ones (biology, foreign languages, drama); no geometry workshop is booked, even though the centre pushes Euclid, tilings and compass-and-straightedge proofs. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
