version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/literature-not-history-chat"
theme = "Subject: Literature = Passionate · Subject: World history = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "library_sunday_desk"
tags = [ "persona-adherence", "multi-check", "literature", "world-history", "library-sundays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: literature-not-history.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions and seminars are subjects the persona rates neutral; the literature side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of literature and its distaste for world history.
[[checks]]
dimension_id = "acad_literature"
dimension_label = "Subject: Literature"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_literature=Passionate"
adherence_signal = "The sessions chosen are literature (the novel survey, close reading, poetry and metre) rather than the statistics, economics and astronomy sessions the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_world_history"
dimension_label = "Subject: World history"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_world_history=Averse"
adherence_signal = "The seminars chosen are the non-history ones (psychology, geography, logic); no world-history seminar is booked, even though the library pushes the Silk Road, empires and their endings and revolutions compared. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
