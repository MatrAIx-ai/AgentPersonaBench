version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/literature-not-history-survey"
theme = "Subject: Literature = Passionate · Subject: World history = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "literature", "world-history", "library-sundays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: literature-not-history.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions and seminars are subjects the persona rates neutral; the literature side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of literature and its distaste for world history.
[[checks]]
dimension_id = "acad_literature"
dimension_label = "Subject: Literature"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_literature=Passionate"
adherence_signal = "The sessions chosen are literature (the novel survey, close reading, poetry and metre) rather than the statistics, economics and astronomy sessions the library pushes. Each option id maps to a `closeread` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_world_history"
dimension_label = "Subject: World history"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_world_history=Averse"
adherence_signal = "The seminars chosen are the non-history ones (psychology, geography, logic); no world-history seminar is booked, even though the library pushes the Silk Road, empires and their endings and revolutions compared. Each option id maps to a `empirehour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
