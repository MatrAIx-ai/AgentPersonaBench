version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hives-not-nibs-app"
theme = "Hobby: Beekeeping = Avid · Interest: Calligraphy = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "beekeeping", "calligraphy", "allotment-society", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hives-not-nibs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative sessions are outdoor hobbies the persona has no rating on (so being outdoors is common to both sides) and the alternative craft hours crafts it has no rating on — so the picks isolate its beekeeping and its distaste for calligraphy.
[[checks]]
dimension_id = "hob_beekeeping"
dimension_label = "Hobby: Beekeeping"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_beekeeping=Avid"
adherence_signal = "The sessions chosen are beekeeping (hive inspection, honey extraction, queen-rearing workshop) rather than the gardening, foraging and birdwatching sessions the society pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_calligraphy"
dimension_label = "Interest: Calligraphy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_calligraphy=Averse"
adherence_signal = "The craft hours chosen are the non-calligraphy ones (origami, model building, quilting); no lettering hour is booked, even though the society pushes broad-nib basics, brush lettering and copperplate. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekendsSociety (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekendsSociety once the desktop is up so the agent finds it on screen.
command = "/opt/weekendssociety/start-weekendssociety.sh"
timeout_sec = 60.0
retries = 5
