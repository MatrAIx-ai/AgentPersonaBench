version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hives-not-nibs-chat"
theme = "Hobby: Beekeeping = Avid · Interest: Calligraphy = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "allotment_society_desk"
tags = [ "persona-adherence", "multi-check", "beekeeping", "calligraphy", "allotment-society", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hives-not-nibs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative sessions are outdoor hobbies the persona has no rating on (so being outdoors is common to both sides) and the alternative craft hours crafts it has no rating on — so the picks isolate its beekeeping and its distaste for calligraphy.
[[checks]]
dimension_id = "hob_beekeeping"
dimension_label = "Hobby: Beekeeping"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_beekeeping=Avid"
adherence_signal = "The sessions chosen are beekeeping (hive inspection, honey extraction, queen-rearing workshop) rather than the gardening, foraging and birdwatching sessions the society pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_calligraphy"
dimension_label = "Interest: Calligraphy"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_calligraphy=Averse"
adherence_signal = "The craft hours chosen are the non-calligraphy ones (origami, model building, quilting); no lettering hour is booked, even though the society pushes broad-nib basics, brush lettering and copperplate. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
