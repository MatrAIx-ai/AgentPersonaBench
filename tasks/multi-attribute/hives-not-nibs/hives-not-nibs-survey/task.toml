version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hives-not-nibs-survey"
theme = "Hobby: Beekeeping = Avid · Interest: Calligraphy = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "beekeeping", "calligraphy", "allotment-society", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hives-not-nibs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative sessions are outdoor hobbies the persona has no rating on (so being outdoors is common to both sides) and the alternative craft hours crafts it has no rating on — so the picks isolate its beekeeping and its distaste for calligraphy.
[[checks]]
dimension_id = "hob_beekeeping"
dimension_label = "Hobby: Beekeeping"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_beekeeping=Avid"
adherence_signal = "The sessions chosen are beekeeping (hive inspection, honey extraction, queen-rearing workshop) rather than the gardening, foraging and birdwatching sessions the society pushes. Each option id maps to a `hive` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_calligraphy"
dimension_label = "Interest: Calligraphy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_calligraphy=Averse"
adherence_signal = "The craft hours chosen are the non-calligraphy ones (origami, model building, quilting); no lettering hour is booked, even though the society pushes broad-nib basics, brush lettering and copperplate. Each option id maps to a `lettering` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
