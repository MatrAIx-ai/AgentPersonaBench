version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gymnastics-not-economics-chat"
theme = "Sport: Gymnastics = Follow · Subject: Economics = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "club_arena_desk"
tags = [ "persona-adherence", "multi-check", "gymnastics", "economics", "sports-and-learning-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gymnastics-not-economics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, both halves are the same length and the clubhouse is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the gymnastics side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its gymnastics fandom and its distaste for economics.
[[checks]]
dimension_id = "sport_gymnastics"
dimension_label = "Sport: Gymnastics"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_gymnastics=Follow"
adherence_signal = "The outings chosen are gymnastics (the artistic championship, the rhythmic screening, the trampoline world cup) rather than the soccer, tennis and darts outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_economics"
dimension_label = "Subject: Economics"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_economics=Averse"
adherence_signal = "The talks chosen are the non-economics ones (statistics, world history, astronomy); no economics talk is booked, even though the club pushes supply and demand, inflation and game theory. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
