version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/clubs-not-churrasco-app"
theme = "Hobby: Juggling = Avid · Cuisine: Brazilian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "juggling", "brazilian-cuisine", "community-circus", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: clubs-not-churrasco.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every lunch is alcohol-free and seafood-free (the persona drinks none and eats no seafood); the alternative sessions are circus skills the persona has no rating on and the non-Brazilian lunches cuisines it rates neutral — so the picks isolate its juggling and its distaste for Brazilian food.
[[checks]]
dimension_id = "hob_juggling"
dimension_label = "Hobby: Juggling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_juggling=Avid"
adherence_signal = "The sessions chosen are juggling (the ball clinic, club passing, the clubs workshop) rather than the trapeze, tightwire and unicycle sessions the circus pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_brazilian"
dimension_label = "Cuisine: Brazilian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_brazilian=Avoid"
adherence_signal = "The lunches chosen are the non-Brazilian ones (Korean, Turkish, Vietnamese); no Brazilian lunch is booked, even though the circus pushes the coxinha, the churrasco and the feijoada. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysCircus (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysCircus once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayscircus/start-saturdayscircus.sh"
timeout_sec = 60.0
retries = 5
