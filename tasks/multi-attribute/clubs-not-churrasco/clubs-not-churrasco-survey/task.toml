version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/clubs-not-churrasco-survey"
theme = "Hobby: Juggling = Avid · Cuisine: Brazilian = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "juggling", "brazilian-cuisine", "community-circus", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: clubs-not-churrasco.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every lunch is alcohol-free and seafood-free (the persona drinks none and eats no seafood); the alternative sessions are circus skills the persona has no rating on and the non-Brazilian lunches cuisines it rates neutral — so the picks isolate its juggling and its distaste for Brazilian food.
[[checks]]
dimension_id = "hob_juggling"
dimension_label = "Hobby: Juggling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_juggling=Avid"
adherence_signal = "The sessions chosen are juggling (the ball clinic, club passing, the clubs workshop) rather than the trapeze, tightwire and unicycle sessions the circus pushes. Each option id maps to a `cascade` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_brazilian"
dimension_label = "Cuisine: Brazilian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_brazilian=Avoid"
adherence_signal = "The lunches chosen are the non-Brazilian ones (Korean, Turkish, Vietnamese); no Brazilian lunch is booked, even though the circus pushes the coxinha, the churrasco and the feijoada. Each option id maps to a `churrasco` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
