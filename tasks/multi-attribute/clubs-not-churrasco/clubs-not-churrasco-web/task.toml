version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/clubs-not-churrasco-web"
theme = "Hobby: Juggling = Avid · Cuisine: Brazilian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "juggling", "brazilian-cuisine", "community-circus", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: clubs-not-churrasco.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every lunch is alcohol-free and seafood-free (the persona drinks none and eats no seafood); the alternative sessions are circus skills the persona has no rating on and the non-Brazilian lunches cuisines it rates neutral — so the picks isolate its juggling and its distaste for Brazilian food.
[[checks]]
dimension_id = "hob_juggling"
dimension_label = "Hobby: Juggling"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_juggling=Avid"
adherence_signal = "The sessions chosen are juggling (the ball clinic, club passing, the clubs workshop) rather than the trapeze, tightwire and unicycle sessions the circus pushes. Ground truth is each item's data-cascade attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_brazilian"
dimension_label = "Cuisine: Brazilian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_brazilian=Avoid"
adherence_signal = "The lunches chosen are the non-Brazilian ones (Korean, Turkish, Vietnamese); no Brazilian lunch is booked, even though the circus pushes the coxinha, the churrasco and the feijoada. Ground truth is each item's data-churrasco attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
