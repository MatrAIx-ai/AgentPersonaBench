version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/punk-not-costume-web"
theme = "Music: Punk = Love · Film: Historical = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "punk", "historical-film", "gig-and-film", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: punk-not-costume.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and both halves are the same length; the alternative gigs are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for punk and its distaste for period films.
[[checks]]
dimension_id = "musg_punk"
dimension_label = "Music: Punk"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_punk=Love"
adherence_signal = "The gigs chosen are punk (the punk band, the hardcore showcase, the pop-punk covers band) rather than the reggae, jazz and folk gigs the venue pushes. Ground truth is each item's data-mosh attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_historical"
dimension_label = "Film: Historical"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_historical=Dislike"
adherence_signal = "The films chosen are the non-period ones (the western, the heist film, the comedy); no historical film is booked, even though the venue pushes the costume piece, the medieval epic and the Victorian drama. Ground truth is each item's data-costumereel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
