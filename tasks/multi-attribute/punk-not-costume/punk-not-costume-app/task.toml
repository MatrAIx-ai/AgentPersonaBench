version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/punk-not-costume-app"
theme = "Music: Punk = Love · Film: Historical = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "punk", "historical-film", "gig-and-film", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: punk-not-costume.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and both halves are the same length; the alternative gigs are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for punk and its distaste for period films.
[[checks]]
dimension_id = "musg_punk"
dimension_label = "Music: Punk"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_punk=Love"
adherence_signal = "The gigs chosen are punk (the punk band, the hardcore showcase, the pop-punk covers band) rather than the reggae, jazz and folk gigs the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_historical"
dimension_label = "Film: Historical"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_historical=Dislike"
adherence_signal = "The films chosen are the non-period ones (the western, the heist film, the comedy); no historical film is booked, even though the venue pushes the costume piece, the medieval epic and the Victorian drama. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ProjectorAndAmp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ProjectorAndAmp once the desktop is up so the agent finds it on screen.
command = "/opt/projectorandamp/start-projectorandamp.sh"
timeout_sec = 60.0
retries = 5
