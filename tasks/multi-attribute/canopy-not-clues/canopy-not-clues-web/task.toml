version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/canopy-not-clues-web"
theme = "Hobby: Paragliding = Avid · Books: Mystery = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "paragliding", "mystery", "adventure-and-book-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: canopy-not-clues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same, every day is outdoors (so being outside is common to both sides) and the book is posted ahead; the alternative days are outdoor hobbies the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its paragliding and its distaste for mysteries.
[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_paragliding=Avid"
adherence_signal = "The days chosen are paragliding (the tandem, the ground-handling day, the ridge-soaring day) rather than the kayaking, geocaching and trekking days the club pushes. Ground truth is each item's data-canopy attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_mystery"
dimension_label = "Books: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_mystery=Dislike"
adherence_signal = "The books chosen are the non-mysteries (the literary novel, the science fiction, the fantasy); no mystery is booked, even though the club pushes the locked room, the cosy village mystery and the procedural. Ground truth is each item's data-whodunit attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
