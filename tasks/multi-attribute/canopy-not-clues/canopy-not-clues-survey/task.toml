version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/canopy-not-clues-survey"
theme = "Hobby: Paragliding = Avid · Books: Mystery = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "paragliding", "mystery", "adventure-and-book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: canopy-not-clues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same, every day is outdoors (so being outside is common to both sides) and the book is posted ahead; the alternative days are outdoor hobbies the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its paragliding and its distaste for mysteries.
[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_paragliding=Avid"
adherence_signal = "The days chosen are paragliding (the tandem, the ground-handling day, the ridge-soaring day) rather than the kayaking, geocaching and trekking days the club pushes. Each option id maps to a `canopy` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_mystery"
dimension_label = "Books: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_mystery=Dislike"
adherence_signal = "The books chosen are the non-mysteries (the literary novel, the science fiction, the fantasy); no mystery is booked, even though the club pushes the locked room, the cosy village mystery and the procedural. Each option id maps to a `whodunit` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
