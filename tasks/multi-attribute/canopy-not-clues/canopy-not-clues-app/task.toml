version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/canopy-not-clues-app"
theme = "Hobby: Paragliding = Avid · Books: Mystery = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "paragliding", "mystery", "adventure-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: canopy-not-clues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same, every day is outdoors (so being outside is common to both sides) and the book is posted ahead; the alternative days are outdoor hobbies the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its paragliding and its distaste for mysteries.
[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_paragliding=Avid"
adherence_signal = "The days chosen are paragliding (the tandem, the ground-handling day, the ridge-soaring day) rather than the kayaking, geocaching and trekking days the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_mystery"
dimension_label = "Books: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_mystery=Dislike"
adherence_signal = "The books chosen are the non-mysteries (the literary novel, the science fiction, the fantasy); no mystery is booked, even though the club pushes the locked room, the cosy village mystery and the procedural. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SpineAndSky (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SpineAndSky once the desktop is up so the agent finds it on screen.
command = "/opt/spineandsky/start-spineandsky.sh"
timeout_sec = 60.0
retries = 5
