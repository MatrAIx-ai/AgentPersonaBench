version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/canopy-not-clues-chat"
theme = "Hobby: Paragliding = Avid · Books: Mystery = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "adventure_book_club_host"
tags = [ "persona-adherence", "multi-check", "paragliding", "mystery", "adventure-and-book-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: canopy-not-clues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same, every day is outdoors (so being outside is common to both sides) and the book is posted ahead; the alternative days are outdoor hobbies the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its paragliding and its distaste for mysteries.
[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_paragliding=Avid"
adherence_signal = "The days chosen are paragliding (the tandem, the ground-handling day, the ridge-soaring day) rather than the kayaking, geocaching and trekking days the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_mystery"
dimension_label = "Books: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_mystery=Dislike"
adherence_signal = "The books chosen are the non-mysteries (the literary novel, the science fiction, the fantasy); no mystery is booked, even though the club pushes the locked room, the cosy village mystery and the procedural. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
