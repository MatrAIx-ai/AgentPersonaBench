version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drawn-clues-app"
theme = "Learning style = Visual · Books: Mystery = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "multi-check", "learning-style", "mystery-books", "library-loans", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: drawn-clues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every loan is free and runs the same three weeks; the text and audio editions are complete and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own preference for pictures and diagrams and its taste for mysteries.
[[checks]]
dimension_id = "learning_style"
dimension_label = "Learning style"
category = "Learning: Style"
value = "Visual"
evaluator = "rule-based"
evaluator_name = "learning_style=Visual"
adherence_signal = "The editions chosen are the pictorial ones (graphic-novel adaptation, illustrated edition with maps and photos, comic-panel edition) rather than the plain e-book, audiobook and radio-play editions the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_mystery"
dimension_label = "Books: Mystery"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_mystery=Love"
adherence_signal = "The titles chosen are mysteries (the locked-room mystery, the detective series opener, the cosy whodunit) rather than the equally well-reviewed thriller, sci-fi and historical titles the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LoanShelf (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LoanShelf once the desktop is up so the agent finds it on screen.
command = "/opt/loanshelf/start-loanshelf.sh"
timeout_sec = 60.0
retries = 5
