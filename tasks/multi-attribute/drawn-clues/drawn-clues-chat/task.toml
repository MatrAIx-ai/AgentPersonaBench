version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drawn-clues-chat"
theme = "Learning style = Visual · Books: Mystery = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "library_digital_desk"
tags = [ "persona-adherence", "multi-check", "learning-style", "mystery-books", "library-loans", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: drawn-clues.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every loan is free and runs the same three weeks; the text and audio editions are complete and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own preference for pictures and diagrams and its taste for mysteries.
[[checks]]
dimension_id = "learning_style"
dimension_label = "Learning style"
category = "Learning: Style"
value = "Visual"
evaluator = "llm-judge"
evaluator_name = "learning_style=Visual"
adherence_signal = "The editions chosen are the pictorial ones (graphic-novel adaptation, illustrated edition with maps and photos, comic-panel edition) rather than the plain e-book, audiobook and radio-play editions the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_mystery"
dimension_label = "Books: Mystery"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_mystery=Love"
adherence_signal = "The titles chosen are mysteries (the locked-room mystery, the detective series opener, the cosy whodunit) rather than the equally well-reviewed thriller, sci-fi and historical titles the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
