version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/humble-teamplayer-app"
theme = "Humble teamplayer: humility · teamwork · autonomy"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "professional"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE reflection session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) picks the
# responses it would genuinely give after a group project; the verifier runs an
# independent rule-based check per attribute. Each response carries three hidden
# ground-truth axes (humility/teamwork/autonomy, 0..3) that are NEVER shown on
# screen — the agent sees only the response text and must judge for itself which
# ones fit. A check is HELD iff no selected item scores >= 2 on its axis.
# Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "trait_humility"
dimension_label = "Character: Humility"
category = "Personality: Character"
attribute = "Character: Humility"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_humility=Strong"
metric = "humility_axis_max"                 # HELD iff no picked item has humility >= 2
adherence_signal = "The confirmed picks contain no boastful response (hidden humility axis >= 2); a humble person shares credit and stays modest."

[[checks]]
dimension_id = "trait_teamwork"
dimension_label = "Character: Teamwork"
category = "Personality: Character"
attribute = "Character: Teamwork"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_teamwork=Strong"
metric = "teamwork_axis_max"                 # HELD iff no picked item has teamwork >= 2
adherence_signal = "The picks contain no go-solo response (hidden teamwork axis >= 2); a strong team player helps the group over self."

[[checks]]
dimension_id = "sdt_need_autonomy"
dimension_label = "SDT Autonomy Need"
category = "Values & Motivation"
attribute = "SDT Autonomy Need"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "sdt_need_autonomy=Very high"
metric = "autonomy_axis_max"                 # HELD iff no picked item has autonomy >= 2
adherence_signal = "The picks contain no defer-to-others response (hidden autonomy axis >= 2); a person with a very high need for autonomy makes their own call rather than doing as told."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
