version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rooftop-and-radio-chat"
theme = "Cuisine: Japanese = Love · Music: Electronic = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "rooftop_supper_club_host"
tags = [ "persona-adherence", "multi-check", "japanese-cuisine", "electronic-music", "rooftop-supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rooftop-and-radio.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, every menu is vegetarian (the persona's diet cannot choose among them) and the bar is alcohol-free; the alternative kitchens are cuisines the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its taste for Japanese food and for electronic music.
[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_japanese=Love"
adherence_signal = "The kitchens chosen are Japanese (vegetable tempura, Japanese curry, grilled-vegetable yakitori) rather than the Ethiopian, Lebanese and Italian kitchens the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_electronic=Love"
adherence_signal = "The nights chosen are electronic (electronic DJ set, live electronic act, electronica night) rather than the hip-hop, Latin and indie nights the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
