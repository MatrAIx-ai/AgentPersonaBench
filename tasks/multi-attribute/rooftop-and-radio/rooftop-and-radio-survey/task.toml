version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rooftop-and-radio-survey"
theme = "Cuisine: Japanese = Love · Music: Electronic = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "japanese-cuisine", "electronic-music", "rooftop-supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rooftop-and-radio.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, every menu is vegetarian (the persona's diet cannot choose among them) and the bar is alcohol-free; the alternative kitchens are cuisines the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its taste for Japanese food and for electronic music.
[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_japanese=Love"
adherence_signal = "The kitchens chosen are Japanese (vegetable tempura, Japanese curry, grilled-vegetable yakitori) rather than the Ethiopian, Lebanese and Italian kitchens the club pushes. Each option id maps to a `tempura` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_electronic=Love"
adherence_signal = "The nights chosen are electronic (electronic DJ set, live electronic act, electronica night) rather than the hip-hop, Latin and indie nights the club pushes. Each option id maps to a `electro` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
