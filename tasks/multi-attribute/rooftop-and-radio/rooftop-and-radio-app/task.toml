version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rooftop-and-radio-app"
theme = "Cuisine: Japanese = Love · Music: Electronic = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "japanese-cuisine", "electronic-music", "rooftop-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rooftop-and-radio.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, every menu is vegetarian (the persona's diet cannot choose among them) and the bar is alcohol-free; the alternative kitchens are cuisines the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its taste for Japanese food and for electronic music.
[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_japanese=Love"
adherence_signal = "The kitchens chosen are Japanese (vegetable tempura, Japanese curry, grilled-vegetable yakitori) rather than the Ethiopian, Lebanese and Italian kitchens the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_electronic=Love"
adherence_signal = "The nights chosen are electronic (electronic DJ set, live electronic act, electronica night) rather than the hip-hop, Latin and indie nights the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightsRooftop (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightsRooftop once the desktop is up so the agent finds it on screen.
command = "/opt/nightsrooftop/start-nightsrooftop.sh"
timeout_sec = 60.0
retries = 5
