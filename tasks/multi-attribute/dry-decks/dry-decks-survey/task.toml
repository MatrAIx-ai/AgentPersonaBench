version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-decks-survey"
theme = "Interest: Wine = Averse · Interest: Self-improvement = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "wine", "self-improvement", "cruise-programme", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dry-decks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session is included, seated, the same length and in the same lounge; the pastime sides are equally engaging and the drink sides are equally hospitable, so the picks isolate the persona's own pull toward self-improvement and its distaste for wine.
[[checks]]
dimension_id = "topic_wine"
dimension_label = "Interest: Wine"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_wine=Averse"
adherence_signal = "The sessions chosen are the ones served with coffee, tea or sparkling water; no wine flight, pairing or welcome glass is booked, even though the programme pushes the wine sessions as the signature events. Each option id maps to a `vino` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_self_improvement"
dimension_label = "Interest: Self-improvement"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_self_improvement=Passionate"
adherence_signal = "The sessions chosen are the self-improvement workshops (goal-setting, habits, confidence coaching) rather than the equally engaging watercolour, history and bridge sessions the programme pushes. Each option id maps to a `growth` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
