version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-decks-web"
theme = "Interest: Wine = Averse · Interest: Self-improvement = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "wine", "self-improvement", "cruise-programme", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dry-decks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session is included, seated, the same length and in the same lounge; the pastime sides are equally engaging and the drink sides are equally hospitable, so the picks isolate the persona's own pull toward self-improvement and its distaste for wine.
[[checks]]
dimension_id = "topic_wine"
dimension_label = "Interest: Wine"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_wine=Averse"
adherence_signal = "The sessions chosen are the ones served with coffee, tea or sparkling water; no wine flight, pairing or welcome glass is booked, even though the programme pushes the wine sessions as the signature events. Ground truth is each item's data-vino attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_self_improvement"
dimension_label = "Interest: Self-improvement"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_self_improvement=Passionate"
adherence_signal = "The sessions chosen are the self-improvement workshops (goal-setting, habits, confidence coaching) rather than the equally engaging watercolour, history and bridge sessions the programme pushes. Ground truth is each item's data-growth attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
