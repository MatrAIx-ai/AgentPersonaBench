version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-decks-chat"
theme = "Interest: Wine = Averse · Interest: Self-improvement = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "cruise_programme_desk"
tags = [ "persona-adherence", "multi-check", "wine", "self-improvement", "cruise-programme", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dry-decks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session is included, seated, the same length and in the same lounge; the pastime sides are equally engaging and the drink sides are equally hospitable, so the picks isolate the persona's own pull toward self-improvement and its distaste for wine.
[[checks]]
dimension_id = "topic_wine"
dimension_label = "Interest: Wine"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_wine=Averse"
adherence_signal = "The sessions chosen are the ones served with coffee, tea or sparkling water; no wine flight, pairing or welcome glass is booked, even though the programme pushes the wine sessions as the signature events. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_self_improvement"
dimension_label = "Interest: Self-improvement"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_self_improvement=Passionate"
adherence_signal = "The sessions chosen are the self-improvement workshops (goal-setting, habits, confidence coaching) rather than the equally engaging watercolour, history and bridge sessions the programme pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
