version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dramedy-not-decibels-app"
theme = "Film: Comedy-drama = Love · Interest: Music = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "comedy-drama", "music", "evening-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dramedy-not-decibels.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative screenings are genres the persona rates neutral and the non-music second halves are just as sociable (all of them indoors, as the persona prefers) — so the picks isolate its taste for comedy-drama and its distaste for music.
[[checks]]
dimension_id = "filmg_comedy_drama"
dimension_label = "Film: Comedy-drama"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_comedy_drama=Love"
adherence_signal = "The screenings chosen are comedy-dramas (family, workplace, coming-of-age) rather than the space adventure, heist film and superhero film the pass pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_music"
dimension_label = "Interest: Music"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_music=Averse"
adherence_signal = "The second halves chosen are the non-music hours (quiz night, board games, short-film block); no music half is booked, even though the pass pushes the live band set, the acoustic session and the DJ set. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningsTwoPart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningsTwoPart once the desktop is up so the agent finds it on screen.
command = "/opt/eveningstwopart/start-eveningstwopart.sh"
timeout_sec = 60.0
retries = 5
