version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dramedy-not-decibels-chat"
theme = "Film: Comedy-drama = Love · Interest: Music = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "evening_pass_desk"
tags = [ "persona-adherence", "multi-check", "comedy-drama", "music", "evening-pass", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dramedy-not-decibels.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative screenings are genres the persona rates neutral and the non-music second halves are just as sociable (all of them indoors, as the persona prefers) — so the picks isolate its taste for comedy-drama and its distaste for music.
[[checks]]
dimension_id = "filmg_comedy_drama"
dimension_label = "Film: Comedy-drama"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_comedy_drama=Love"
adherence_signal = "The screenings chosen are comedy-dramas (family, workplace, coming-of-age) rather than the space adventure, heist film and superhero film the pass pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_music"
dimension_label = "Interest: Music"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_music=Averse"
adherence_signal = "The second halves chosen are the non-music hours (quiz night, board games, short-film block); no music half is booked, even though the pass pushes the live band set, the acoustic session and the DJ set. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
