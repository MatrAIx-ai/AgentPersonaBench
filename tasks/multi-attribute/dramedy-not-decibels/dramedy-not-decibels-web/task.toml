version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dramedy-not-decibels-web"
theme = "Film: Comedy-drama = Love · Interest: Music = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "comedy-drama", "music", "evening-pass", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dramedy-not-decibels.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative screenings are genres the persona rates neutral and the non-music second halves are just as sociable (all of them indoors, as the persona prefers) — so the picks isolate its taste for comedy-drama and its distaste for music.
[[checks]]
dimension_id = "filmg_comedy_drama"
dimension_label = "Film: Comedy-drama"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_comedy_drama=Love"
adherence_signal = "The screenings chosen are comedy-dramas (family, workplace, coming-of-age) rather than the space adventure, heist film and superhero film the pass pushes. Ground truth is each item's data-dramedy attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_music"
dimension_label = "Interest: Music"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_music=Averse"
adherence_signal = "The second halves chosen are the non-music hours (quiz night, board games, short-film block); no music half is booked, even though the pass pushes the live band set, the acoustic session and the DJ set. Ground truth is each item's data-musichalf attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
