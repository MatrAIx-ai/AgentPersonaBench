version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/history-not-health-app"
theme = "Subject: World history = Passionate · Subject: Health science = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "world-history", "health-science", "museum-sundays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: history-not-health.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative talks and seminars are subjects the persona rates neutral; the history side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of world history and its distaste for health science.
[[checks]]
dimension_id = "acad_world_history"
dimension_label = "Subject: World history"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_world_history=Passionate"
adherence_signal = "The talks chosen are world history (the Silk Road, empires and their endings, revolutions compared) rather than the chemistry, economics and sociology talks the museum pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_health_science"
dimension_label = "Subject: Health science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_health_science=Averse"
adherence_signal = "The seminars chosen are the non-health-science ones (drama, philosophy, logic); no health-science seminar is booked, even though the museum pushes sleep science, nutrition myths and the immune system. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundayTalksMuseum (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundayTalksMuseum once the desktop is up so the agent finds it on screen.
command = "/opt/sundaytalksmuseum/start-sundaytalksmuseum.sh"
timeout_sec = 60.0
retries = 5
