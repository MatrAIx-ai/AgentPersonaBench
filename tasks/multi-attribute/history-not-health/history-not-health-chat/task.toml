version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/history-not-health-chat"
theme = "Subject: World history = Passionate · Subject: Health science = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "museum_sunday_desk"
tags = [ "persona-adherence", "multi-check", "world-history", "health-science", "museum-sundays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: history-not-health.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative talks and seminars are subjects the persona rates neutral; the history side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of world history and its distaste for health science.
[[checks]]
dimension_id = "acad_world_history"
dimension_label = "Subject: World history"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_world_history=Passionate"
adherence_signal = "The talks chosen are world history (the Silk Road, empires and their endings, revolutions compared) rather than the chemistry, economics and sociology talks the museum pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_health_science"
dimension_label = "Subject: Health science"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_health_science=Averse"
adherence_signal = "The seminars chosen are the non-health-science ones (drama, philosophy, logic); no health-science seminar is booked, even though the museum pushes sleep science, nutrition myths and the immune system. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
