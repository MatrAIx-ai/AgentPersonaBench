version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/history-not-health-survey"
theme = "Subject: World history = Passionate · Subject: Health science = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "world-history", "health-science", "museum-sundays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: history-not-health.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative talks and seminars are subjects the persona rates neutral; the history side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of world history and its distaste for health science.
[[checks]]
dimension_id = "acad_world_history"
dimension_label = "Subject: World history"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_world_history=Passionate"
adherence_signal = "The talks chosen are world history (the Silk Road, empires and their endings, revolutions compared) rather than the chemistry, economics and sociology talks the museum pushes. Each option id maps to a `chronicle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_health_science"
dimension_label = "Subject: Health science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_health_science=Averse"
adherence_signal = "The seminars chosen are the non-health-science ones (drama, philosophy, logic); no health-science seminar is booked, even though the museum pushes sleep science, nutrition myths and the immune system. Each option id maps to a `clinichour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
