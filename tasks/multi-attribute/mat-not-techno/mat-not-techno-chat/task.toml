version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mat-not-techno-chat"
theme = "Sport: Wrestling = Play · Music: Techno = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "leisure_centre_saturday_desk"
tags = [ "persona-adherence", "multi-check", "wrestling", "techno", "leisure-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: mat-not-techno.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the social is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its wrestling and its distaste for techno.
[[checks]]
dimension_id = "sport_wrestling"
dimension_label = "Sport: Wrestling"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_wrestling=Play"
adherence_signal = "The sessions chosen are wrestling (open mat, the freestyle class, the Greco-Roman clinic) rather than the table-tennis, climbing and swimming sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_techno"
dimension_label = "Music: Techno"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_techno=Dislike"
adherence_signal = "The socials chosen are the non-techno ones (house, drum and bass, synthwave); no techno night is booked, even though the centre pushes the techno DJ, the warehouse set and the minimal night. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
