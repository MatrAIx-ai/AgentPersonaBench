version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mat-not-techno-app"
theme = "Sport: Wrestling = Play · Music: Techno = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "wrestling", "techno", "leisure-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: mat-not-techno.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the social is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its wrestling and its distaste for techno.
[[checks]]
dimension_id = "sport_wrestling"
dimension_label = "Sport: Wrestling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_wrestling=Play"
adherence_signal = "The sessions chosen are wrestling (open mat, the freestyle class, the Greco-Roman clinic) rather than the table-tennis, climbing and swimming sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_techno"
dimension_label = "Music: Techno"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_techno=Dislike"
adherence_signal = "The socials chosen are the non-techno ones (house, drum and bass, synthwave); no techno night is booked, even though the centre pushes the techno DJ, the warehouse set and the minimal night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysSportsHall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysSportsHall once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayssportshall/start-saturdayssportshall.sh"
timeout_sec = 60.0
retries = 5
