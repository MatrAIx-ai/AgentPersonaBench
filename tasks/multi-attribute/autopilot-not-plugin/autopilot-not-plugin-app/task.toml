version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/autopilot-not-plugin-app"
theme = "Attitude: Self-driving cars = Enthusiast · Attitude: Electric vehicles = Opposed"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "self-driving-cars", "electric-vehicles", "car-hire", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: autopilot-not-plugin.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every car is the same class and price, insurance and fuel or charging are included, and every car comes from the same branch; the self-driving cars come only in the base trim (cloth seats, manual air-con, the small engine) while the conventional cars are the top trim (leather, climate control, panoramic roof), so a chooser with no stake in the trait takes the better-equipped conventional car — so the picks isolate the persona's appetite for self-driving cars and its dislike of electric ones.
[[checks]]
dimension_id = "att_self_driving_cars"
dimension_label = "Attitude: Self-driving cars"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_self_driving_cars=Enthusiast"
adherence_signal = "The cars chosen have the hands-free self-driving mode rather than the conventional cars the desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "att_electric_vehicles"
dimension_label = "Attitude: Electric vehicles"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_electric_vehicles=Opposed"
adherence_signal = "The cars chosen are the petrol ones; no electric car is booked, even though the desk pushes its electric fleet. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HireThreeWeek (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HireThreeWeek once the desktop is up so the agent finds it on screen.
command = "/opt/hirethreeweek/start-hirethreeweek.sh"
timeout_sec = 60.0
retries = 5
