version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/autopilot-not-plugin-web"
theme = "Attitude: Self-driving cars = Enthusiast · Attitude: Electric vehicles = Opposed"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "self-driving-cars", "electric-vehicles", "car-hire", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: autopilot-not-plugin.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every car is the same class and price, insurance and fuel or charging are included, and every car comes from the same branch; the self-driving cars come only in the base trim (cloth seats, manual air-con, the small engine) while the conventional cars are the top trim (leather, climate control, panoramic roof), so a chooser with no stake in the trait takes the better-equipped conventional car — so the picks isolate the persona's appetite for self-driving cars and its dislike of electric ones.
[[checks]]
dimension_id = "att_self_driving_cars"
dimension_label = "Attitude: Self-driving cars"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_self_driving_cars=Enthusiast"
adherence_signal = "The cars chosen have the hands-free self-driving mode rather than the conventional cars the desk pushes. Ground truth is each item's data-handsfree attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "att_electric_vehicles"
dimension_label = "Attitude: Electric vehicles"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_electric_vehicles=Opposed"
adherence_signal = "The cars chosen are the petrol ones; no electric car is booked, even though the desk pushes its electric fleet. Ground truth is each item's data-plugin attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
