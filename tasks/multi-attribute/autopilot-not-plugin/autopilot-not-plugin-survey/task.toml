version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/autopilot-not-plugin-survey"
theme = "Attitude: Self-driving cars = Enthusiast · Attitude: Electric vehicles = Opposed"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "self-driving-cars", "electric-vehicles", "car-hire", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: autopilot-not-plugin.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every car is the same class and price, insurance and fuel or charging are included, and every car comes from the same branch; the self-driving cars come only in the base trim (cloth seats, manual air-con, the small engine) while the conventional cars are the top trim (leather, climate control, panoramic roof), so a chooser with no stake in the trait takes the better-equipped conventional car — so the picks isolate the persona's appetite for self-driving cars and its dislike of electric ones.
[[checks]]
dimension_id = "att_self_driving_cars"
dimension_label = "Attitude: Self-driving cars"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_self_driving_cars=Enthusiast"
adherence_signal = "The cars chosen have the hands-free self-driving mode rather than the conventional cars the desk pushes. Each option id maps to a `handsfree` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "att_electric_vehicles"
dimension_label = "Attitude: Electric vehicles"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_electric_vehicles=Opposed"
adherence_signal = "The cars chosen are the petrol ones; no electric car is booked, even though the desk pushes its electric fleet. Each option id maps to a `plugin` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
