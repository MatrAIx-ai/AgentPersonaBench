version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/plato-not-poltergeists-chat"
theme = "Books: Philosophy = Love · Film: Horror = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "book_film_club_secretary"
tags = [ "persona-adherence", "multi-check", "philosophy", "horror", "book-and-film-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: plato-not-poltergeists.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for philosophy and its distaste for horror.
[[checks]]
dimension_id = "bookg_philosophy"
dimension_label = "Books: Philosophy"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_philosophy=Love"
adherence_signal = "The books chosen are philosophy (the Stoicism introduction, the philosophy of mind, the history of ethics) rather than the fantasy, memoir and popular-science picks the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_horror=Dislike"
adherence_signal = "The films chosen are the non-horror ones (the documentary, the romance, the fantasy epic); no horror is booked, even though the club pushes the haunted house, the slasher and the possession film. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
