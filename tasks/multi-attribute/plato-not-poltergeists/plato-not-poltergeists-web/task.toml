version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/plato-not-poltergeists-web"
theme = "Books: Philosophy = Love · Film: Horror = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "philosophy", "horror", "book-and-film-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: plato-not-poltergeists.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for philosophy and its distaste for horror.
[[checks]]
dimension_id = "bookg_philosophy"
dimension_label = "Books: Philosophy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_philosophy=Love"
adherence_signal = "The books chosen are philosophy (the Stoicism introduction, the philosophy of mind, the history of ethics) rather than the fantasy, memoir and popular-science picks the club pushes. Ground truth is each item's data-stoic attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_horror=Dislike"
adherence_signal = "The films chosen are the non-horror ones (the documentary, the romance, the fantasy epic); no horror is booked, even though the club pushes the haunted house, the slasher and the possession film. Ground truth is each item's data-hauntedreel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
