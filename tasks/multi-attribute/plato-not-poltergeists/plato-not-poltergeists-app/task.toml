version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/plato-not-poltergeists-app"
theme = "Books: Philosophy = Love · Film: Horror = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "philosophy", "horror", "book-and-film-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: plato-not-poltergeists.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for philosophy and its distaste for horror.
[[checks]]
dimension_id = "bookg_philosophy"
dimension_label = "Books: Philosophy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_philosophy=Love"
adherence_signal = "The books chosen are philosophy (the Stoicism introduction, the philosophy of mind, the history of ethics) rather than the fantasy, memoir and popular-science picks the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_horror=Dislike"
adherence_signal = "The films chosen are the non-horror ones (the documentary, the romance, the fantasy epic); no horror is booked, even though the club pushes the haunted house, the slasher and the possession film. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenAndChapter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenAndChapter once the desktop is up so the agent finds it on screen.
command = "/opt/screenandchapter/start-screenandchapter.sh"
timeout_sec = 60.0
retries = 5
