version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thermals-not-trawlers-chat"
theme = "Hobby: Paragliding = Active · Cuisine: Seafood = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "coastal_weekend_planner"
tags = [ "persona-adherence", "multi-check", "paragliding", "seafood", "coastal-weekend", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: thermals-not-trawlers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every restaurant is alcohol-free; the alternative activities are as much a day out on the coast and the alternative dinners are cuisines the persona rates neutral — so the picks isolate its paragliding and its distaste for seafood.
[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_paragliding=Active"
adherence_signal = "The activities chosen are paragliding (tandem flight, ridge-soaring lesson, paramotor taster) rather than the boat tour, coastal walk and lighthouse museum the operator pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_seafood=Avoid"
adherence_signal = "The dinners chosen are the non-seafood restaurants (Turkish grill, Caribbean kitchen, Chinese restaurant); no seafood dinner is booked, even though the operator pushes the harbour fish restaurant, the oyster bar and the grilled-fish shack. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
