version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thermals-not-trawlers-app"
theme = "Hobby: Paragliding = Active · Cuisine: Seafood = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "paragliding", "seafood", "coastal-weekend", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: thermals-not-trawlers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every restaurant is alcohol-free; the alternative activities are as much a day out on the coast and the alternative dinners are cuisines the persona rates neutral — so the picks isolate its paragliding and its distaste for seafood.
[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_paragliding=Active"
adherence_signal = "The activities chosen are paragliding (tandem flight, ridge-soaring lesson, paramotor taster) rather than the boat tour, coastal walk and lighthouse museum the operator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_seafood=Avoid"
adherence_signal = "The dinners chosen are the non-seafood restaurants (Turkish grill, Caribbean kitchen, Chinese restaurant); no seafood dinner is booked, even though the operator pushes the harbour fish restaurant, the oyster bar and the grilled-fish shack. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysCoast (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysCoast once the desktop is up so the agent finds it on screen.
command = "/opt/dayscoast/start-dayscoast.sh"
timeout_sec = 60.0
retries = 5
