version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/grateful-honest-web"
theme = "Grateful honest: gratitude · generosity · honesty"

[metadata]
difficulty = "medium"
type = "web"
domain = "social"
tags = [ "persona-adherence", "multi-check", "grateful-honest", "rule-based", "playwright", "real-web",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE task, THREE checks. A single persona carrying three character values picks 3
# things they'd genuinely do from a live "kindness board" (Playwright); the
# verifier runs an independent rule-based check per axis, reading each card's
# hidden data-* tier off index.html (ground truth, NOT shown to the person). This
# amortizes one generation across three attributes. Reward = integer score (one
# point per check HELD, 0..3). Each axis: HELD iff no pick is high-tier (axis >= 2).
[[checks]]
dimension_id = "trait_gratitude"
attribute = "Character: Gratitude"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_gratitude=Strong"
# Ground truth: each card's hidden data-ax1 (0 grateful/acknowledges .. 3 takes for granted) in index.html.
adherence_signal = "Picks acknowledge kindness gratefully (data-ax1 0-1); no takes-it-for-granted pick (>= 2)."

[[checks]]
dimension_id = "trait_generosity"
attribute = "Character: Generosity"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_generosity=Strong"
# Ground truth: each card's hidden data-ax2 (0 gives/shares freely .. 3 keeps it all/withholds).
adherence_signal = "Picks give and share (data-ax2 0-1); no keeps-it-all/withholds pick (>= 2)."

[[checks]]
dimension_id = "trait_honesty"
attribute = "Character: Honesty"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_honesty=Strong"
# Ground truth: each card's hidden data-ax3 (0 truthful/returns what isn't theirs .. 3 lies/deceives/keeps).
adherence_signal = "Picks tell the truth / return what isn't theirs (data-ax3 0-1); no lie/deceive pick (>= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
