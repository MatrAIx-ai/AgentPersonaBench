version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/oche-not-pho-app"
theme = "Sport: Darts = Play · Cuisine: Vietnamese = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "darts", "vietnamese-cuisine", "sports-and-social", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: oche-not-pho.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the non-Vietnamese suppers cuisines it rates neutral — so the picks isolate its darts and its distaste for Vietnamese food.
[[checks]]
dimension_id = "sport_darts"
dimension_label = "Sport: Darts"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_darts=Play"
adherence_signal = "The slots chosen are darts (the league night, the coached session, the knockout) rather than the bowling, table-tennis and badminton slots the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_vietnamese"
dimension_label = "Cuisine: Vietnamese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_vietnamese=Avoid"
adherence_signal = "The suppers chosen are the non-Vietnamese ones (Italian, Korean, Turkish); no Vietnamese supper is booked, even though the club pushes the pho, the bánh mì and the bún chả. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TableAndOche (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TableAndOche once the desktop is up so the agent finds it on screen.
command = "/opt/tableandoche/start-tableandoche.sh"
timeout_sec = 60.0
retries = 5
