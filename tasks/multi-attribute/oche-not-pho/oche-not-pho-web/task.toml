version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/oche-not-pho-web"
theme = "Sport: Darts = Play · Cuisine: Vietnamese = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "darts", "vietnamese-cuisine", "sports-and-social", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: oche-not-pho.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the non-Vietnamese suppers cuisines it rates neutral — so the picks isolate its darts and its distaste for Vietnamese food.
[[checks]]
dimension_id = "sport_darts"
dimension_label = "Sport: Darts"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_darts=Play"
adherence_signal = "The slots chosen are darts (the league night, the coached session, the knockout) rather than the bowling, table-tennis and badminton slots the club pushes. Ground truth is each item's data-oche attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_vietnamese"
dimension_label = "Cuisine: Vietnamese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_vietnamese=Avoid"
adherence_signal = "The suppers chosen are the non-Vietnamese ones (Italian, Korean, Turkish); no Vietnamese supper is booked, even though the club pushes the pho, the bánh mì and the bún chả. Ground truth is each item's data-phobowl attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
