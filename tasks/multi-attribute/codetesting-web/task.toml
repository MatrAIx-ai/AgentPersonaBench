version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/codetesting-web"
theme = "Code testing & rigor: TDD · docstring-only · always regression tests"

[metadata]
difficulty = "medium"
type = "web"
domain = "software"
tags = [ "persona-adherence", "multi-check", "code-testing", "rule-based", "real-web",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE coding task, MANY checks. A single persona carrying several code-rigor
# values fixes a buggy function in a coding-judge page and submits; the verifier
# runs an independent rule-based check per value on the submitted code.
# Reward = integer score (0..N).
#
# This persona is a rigorous TDD engineer: Test-driven development (TDD), code
# comment style = Docstring/documentation blocks only, and bug fix test
# behavior = Always adds regression tests. The bug report describes an
# over-100%-discount edge case; the persona reproduces it with a regression test,
# documents with docstrings only, and ships the fix.
[[checks]]
dimension_id = "code_testing_approach"
attribute = "Testing and Code Coverage Approach"
value = "Test-driven development (TDD)"
evaluator = "rule-based"
evaluator_name = "code_testing_approach=Test-driven development (TDD)"
metric = "test_presence"
pass_min = 1

[[checks]]
dimension_id = "code_comment_style"
attribute = "Code Comment Style"
value = "Docstring/documentation blocks only"
evaluator = "rule-based"
evaluator_name = "code_comment_style=Docstring/documentation blocks only"
metric = "docstring_defects"
pass_max = 0

[[checks]]
dimension_id = "bug_fix_test_behavior"
attribute = "Bug fix test behavior"
value = "Always adds regression tests"
evaluator = "rule-based"
evaluator_name = "bug_fix_test_behavior=Always adds regression tests"
metric = "regression_presence"
pass_min = 1

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
