version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ramen-not-trap-survey"
theme = "Cuisine: Ramen = Love · Music: Trap = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ramen", "trap", "food-hall", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ramen-not-trap.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and both halves are the same length; the non-ramen suppers are cuisines the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for ramen and its distaste for trap.
[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_ramen=Love"
adherence_signal = "The suppers chosen are ramen (tonkotsu, shoyu, spicy miso) rather than the roast-duck, jerk-chicken and shawarma plates the venue pushes. Each option id maps to a `noodlebowl` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_trap"
dimension_label = "Music: Trap"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_trap=Dislike"
adherence_signal = "The sets chosen are the non-trap ones (funk, blues, ska); no trap set is booked, even though the venue pushes the trap DJ, the trap showcase and the producers' night. Each option id maps to a `trapset` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
