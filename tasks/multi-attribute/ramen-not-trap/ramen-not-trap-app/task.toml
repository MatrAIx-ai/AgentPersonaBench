version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ramen-not-trap-app"
theme = "Cuisine: Ramen = Love · Music: Trap = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ramen", "trap", "food-hall", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ramen-not-trap.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and both halves are the same length; the non-ramen suppers are cuisines the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for ramen and its distaste for trap.
[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_ramen=Love"
adherence_signal = "The suppers chosen are ramen (tonkotsu, shoyu, spicy miso) rather than the roast-duck, jerk-chicken and shawarma plates the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_trap"
dimension_label = "Music: Trap"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_trap=Dislike"
adherence_signal = "The sets chosen are the non-trap ones (funk, blues, ska); no trap set is booked, even though the venue pushes the trap DJ, the trap showcase and the producers' night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StageAndCounter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StageAndCounter once the desktop is up so the agent finds it on screen.
command = "/opt/stageandcounter/start-stageandcounter.sh"
timeout_sec = 60.0
retries = 5
