version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ramen-not-trap-chat"
theme = "Cuisine: Ramen = Love · Music: Trap = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "food_hall_nights_desk"
tags = [ "persona-adherence", "multi-check", "ramen", "trap", "food-hall", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ramen-not-trap.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and both halves are the same length; the non-ramen suppers are cuisines the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for ramen and its distaste for trap.
[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_ramen=Love"
adherence_signal = "The suppers chosen are ramen (tonkotsu, shoyu, spicy miso) rather than the roast-duck, jerk-chicken and shawarma plates the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_trap"
dimension_label = "Music: Trap"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_trap=Dislike"
adherence_signal = "The sets chosen are the non-trap ones (funk, blues, ska); no trap set is booked, even though the venue pushes the trap DJ, the trap showcase and the producers' night. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
