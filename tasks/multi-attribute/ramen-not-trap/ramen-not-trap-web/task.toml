version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ramen-not-trap-web"
theme = "Cuisine: Ramen = Love · Music: Trap = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ramen", "trap", "food-hall", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ramen-not-trap.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and both halves are the same length; the non-ramen suppers are cuisines the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for ramen and its distaste for trap.
[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_ramen=Love"
adherence_signal = "The suppers chosen are ramen (tonkotsu, shoyu, spicy miso) rather than the roast-duck, jerk-chicken and shawarma plates the venue pushes. Ground truth is each item's data-noodlebowl attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_trap"
dimension_label = "Music: Trap"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_trap=Dislike"
adherence_signal = "The sets chosen are the non-trap ones (funk, blues, ska); no trap set is booked, even though the venue pushes the trap DJ, the trap showcase and the producers' night. Ground truth is each item's data-trapset attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
