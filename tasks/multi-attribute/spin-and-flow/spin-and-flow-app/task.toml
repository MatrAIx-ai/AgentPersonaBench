version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-and-flow-app"
theme = "Interest: Cycling = Passionate · Sport: Yoga = Play"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "cycling", "yoga", "club-timetable", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-and-flow.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative weekend sessions are just as outdoor and just as energetic, and the alternative classes are ones the persona rates neutral; the rides meet at the out-of-town car park, 30 minutes from the club, while the alternatives start from the club car park, and the yoga classes run in the small studio with mats first come first served while the alternatives get a reserved mat in the main studio, so a chooser with no stake in either takes the alternatives — so the picks isolate its devotion to cycling and its yoga.
[[checks]]
dimension_id = "topic_cycling"
dimension_label = "Interest: Cycling"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_cycling=Passionate"
adherence_signal = "The weekend sessions chosen are rides (road ride, gravel loop, hill-climb morning) rather than the five-a-side, bootcamp and ultimate sessions the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_yoga"
dimension_label = "Sport: Yoga"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_yoga=Play"
adherence_signal = "The weekday classes chosen are yoga (vinyasa flow, yin, ashtanga) rather than the aqua-aerobics, Zumba and circuits classes the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekClub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekClub once the desktop is up so the agent finds it on screen.
command = "/opt/weekclub/start-weekclub.sh"
timeout_sec = 60.0
retries = 5
