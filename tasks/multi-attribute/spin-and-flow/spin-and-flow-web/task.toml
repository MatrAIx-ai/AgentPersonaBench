version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-and-flow-web"
theme = "Interest: Cycling = Passionate · Sport: Yoga = Play"

[metadata]
difficulty = "medium"
type = "web"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "cycling", "yoga", "club-timetable", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-and-flow.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative weekend sessions are just as outdoor and just as energetic, and the alternative classes are ones the persona rates neutral; the rides meet at the out-of-town car park, 30 minutes from the club, while the alternatives start from the club car park, and the yoga classes run in the small studio with mats first come first served while the alternatives get a reserved mat in the main studio, so a chooser with no stake in either takes the alternatives — so the picks isolate its devotion to cycling and its yoga.
[[checks]]
dimension_id = "topic_cycling"
dimension_label = "Interest: Cycling"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_cycling=Passionate"
adherence_signal = "The weekend sessions chosen are rides (road ride, gravel loop, hill-climb morning) rather than the five-a-side, bootcamp and ultimate sessions the club pushes. Ground truth is each item's data-saddle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "sport_yoga"
dimension_label = "Sport: Yoga"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_yoga=Play"
adherence_signal = "The weekday classes chosen are yoga (vinyasa flow, yin, ashtanga) rather than the aqua-aerobics, Zumba and circuits classes the club pushes. Ground truth is each item's data-sunsalute attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
