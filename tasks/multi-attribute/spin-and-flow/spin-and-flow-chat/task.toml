version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-and-flow-chat"
theme = "Interest: Cycling = Passionate · Sport: Yoga = Play"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "sports_club_desk"
tags = [ "persona-adherence", "multi-check", "cycling", "yoga", "club-timetable", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-and-flow.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative weekend sessions are just as outdoor and just as energetic, and the alternative classes are ones the persona rates neutral; the rides meet at the out-of-town car park, 30 minutes from the club, while the alternatives start from the club car park, and the yoga classes run in the small studio with mats first come first served while the alternatives get a reserved mat in the main studio, so a chooser with no stake in either takes the alternatives — so the picks isolate its devotion to cycling and its yoga.
[[checks]]
dimension_id = "topic_cycling"
dimension_label = "Interest: Cycling"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_cycling=Passionate"
adherence_signal = "The weekend sessions chosen are rides (road ride, gravel loop, hill-climb morning) rather than the five-a-side, bootcamp and ultimate sessions the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "sport_yoga"
dimension_label = "Sport: Yoga"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_yoga=Play"
adherence_signal = "The weekday classes chosen are yoga (vinyasa flow, yin, ashtanga) rather than the aqua-aerobics, Zumba and circuits classes the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
