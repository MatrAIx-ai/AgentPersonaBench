version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/house-not-houses-app"
theme = "Music: House = Love · Interest: Real estate = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "house-music", "real-estate", "saturday-card", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: house-not-houses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and every venue is alcohol-free (the persona drinks none); the alternative nights are genres the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for house music and its distaste for property talk.
[[checks]]
dimension_id = "musg_house"
dimension_label = "Music: House"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_house=Love"
adherence_signal = "The nights chosen are house (house night, deep-house set, house-classics party) rather than the blues, country and Latin nights the card pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_real_estate"
dimension_label = "Interest: Real estate"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_real_estate=Averse"
adherence_signal = "The afternoons chosen are the non-property ones (photography walk, astronomy talk, languages taster); no real-estate session is booked, even though the card pushes the investment seminar, the show-home tour and the buy-to-let talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CardWeekend (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CardWeekend once the desktop is up so the agent finds it on screen.
command = "/opt/cardweekend/start-cardweekend.sh"
timeout_sec = 60.0
retries = 5
