version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/house-not-houses-chat"
theme = "Music: House = Love · Interest: Real estate = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "weekend_card_planner"
tags = [ "persona-adherence", "multi-check", "house-music", "real-estate", "saturday-card", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: house-not-houses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and every venue is alcohol-free (the persona drinks none); the alternative nights are genres the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for house music and its distaste for property talk.
[[checks]]
dimension_id = "musg_house"
dimension_label = "Music: House"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_house=Love"
adherence_signal = "The nights chosen are house (house night, deep-house set, house-classics party) rather than the blues, country and Latin nights the card pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_real_estate"
dimension_label = "Interest: Real estate"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_real_estate=Averse"
adherence_signal = "The afternoons chosen are the non-property ones (photography walk, astronomy talk, languages taster); no real-estate session is booked, even though the card pushes the investment seminar, the show-home tour and the buy-to-let talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
