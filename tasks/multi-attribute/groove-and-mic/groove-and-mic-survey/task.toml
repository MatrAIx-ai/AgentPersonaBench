version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/groove-and-mic-survey"
theme = "Music: Funk = Love · Hobby: Karaoke = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "funk", "karaoke", "night-out", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: groove-and-mic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative sets are genres the persona rates neutral and the alternative after-parties are just as sociable — so the picks isolate its taste for funk and its karaoke habit.
[[checks]]
dimension_id = "musg_funk"
dimension_label = "Music: Funk"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_funk=Love"
adherence_signal = "The sets chosen are funk (funk band, funk-and-brass night, seventies funk revue) rather than the jazz, indie and bluegrass sets the site pushes. Each option id maps to a `groove` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_karaoke"
dimension_label = "Hobby: Karaoke"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_karaoke=Avid"
adherence_signal = "The after-parties chosen are karaoke (karaoke bar, private karaoke room, karaoke open stage) rather than the quiz, comedy-club and board-games slots the site pushes. Each option id maps to a `mic` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
