version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/groove-and-mic-app"
theme = "Music: Funk = Love · Hobby: Karaoke = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "funk", "karaoke", "night-out", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: groove-and-mic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative sets are genres the persona rates neutral and the alternative after-parties are just as sociable — so the picks isolate its taste for funk and its karaoke habit.
[[checks]]
dimension_id = "musg_funk"
dimension_label = "Music: Funk"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_funk=Love"
adherence_signal = "The sets chosen are funk (funk band, funk-and-brass night, seventies funk revue) rather than the jazz, indie and bluegrass sets the site pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_karaoke"
dimension_label = "Hobby: Karaoke"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_karaoke=Avid"
adherence_signal = "The after-parties chosen are karaoke (karaoke bar, private karaoke room, karaoke open stage) rather than the quiz, comedy-club and board-games slots the site pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PackagesNight (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PackagesNight once the desktop is up so the agent finds it on screen.
command = "/opt/packagesnight/start-packagesnight.sh"
timeout_sec = 60.0
retries = 5
