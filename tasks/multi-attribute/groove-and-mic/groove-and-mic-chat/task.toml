version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/groove-and-mic-chat"
theme = "Music: Funk = Love · Hobby: Karaoke = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "night_out_concierge"
tags = [ "persona-adherence", "multi-check", "funk", "karaoke", "night-out", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: groove-and-mic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative sets are genres the persona rates neutral and the alternative after-parties are just as sociable — so the picks isolate its taste for funk and its karaoke habit.
[[checks]]
dimension_id = "musg_funk"
dimension_label = "Music: Funk"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_funk=Love"
adherence_signal = "The sets chosen are funk (funk band, funk-and-brass night, seventies funk revue) rather than the jazz, indie and bluegrass sets the site pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_karaoke"
dimension_label = "Hobby: Karaoke"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_karaoke=Avid"
adherence_signal = "The after-parties chosen are karaoke (karaoke bar, private karaoke room, karaoke open stage) rather than the quiz, comedy-club and board-games slots the site pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
