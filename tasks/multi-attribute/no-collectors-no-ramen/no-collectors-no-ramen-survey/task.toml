version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-collectors-no-ramen-survey"
theme = "Interest: Collecting = Averse · Cuisine: Ramen = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "collecting", "ramen", "community-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-collectors-no-ramen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative sessions are topics the persona rates neutral and the non-ramen lunches cuisines it rates neutral — so the picks isolate its distaste for collecting and its distaste for ramen.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_collecting=Averse"
adherence_signal = "The sessions chosen are the non-collecting ones (photography, board games, local history); no collectors' session is booked, even though the centre pushes the coin-and-stamp fair, the vintage-toy talk and the swap meet. Each option id maps to a `collector` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_ramen=Avoid"
adherence_signal = "The lunches chosen are the non-ramen ones (Indian, Thai, German); no ramen lunch is booked, even though the centre pushes the tonkotsu, the shoyu and the spicy miso. Each option id maps to a `noodlebowl` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
