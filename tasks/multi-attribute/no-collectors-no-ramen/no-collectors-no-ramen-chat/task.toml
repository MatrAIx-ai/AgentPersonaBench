version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-collectors-no-ramen-chat"
theme = "Interest: Collecting = Averse · Cuisine: Ramen = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "centre_morning_lunch_desk"
tags = [ "persona-adherence", "multi-check", "collecting", "ramen", "community-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-collectors-no-ramen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative sessions are topics the persona rates neutral and the non-ramen lunches cuisines it rates neutral — so the picks isolate its distaste for collecting and its distaste for ramen.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_collecting=Averse"
adherence_signal = "The sessions chosen are the non-collecting ones (photography, board games, local history); no collectors' session is booked, even though the centre pushes the coin-and-stamp fair, the vintage-toy talk and the swap meet. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_ramen=Avoid"
adherence_signal = "The lunches chosen are the non-ramen ones (Indian, Thai, German); no ramen lunch is booked, even though the centre pushes the tonkotsu, the shoyu and the spicy miso. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
