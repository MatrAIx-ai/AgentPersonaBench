version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-collectors-no-ramen-app"
theme = "Interest: Collecting = Averse · Cuisine: Ramen = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "collecting", "ramen", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-collectors-no-ramen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative sessions are topics the persona rates neutral and the non-ramen lunches cuisines it rates neutral — so the picks isolate its distaste for collecting and its distaste for ramen.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_collecting=Averse"
adherence_signal = "The sessions chosen are the non-collecting ones (photography, board games, local history); no collectors' session is booked, even though the centre pushes the coin-and-stamp fair, the vintage-toy talk and the swap meet. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_ramen=Avoid"
adherence_signal = "The lunches chosen are the non-ramen ones (Indian, Thai, German); no ramen lunch is booked, even though the centre pushes the tonkotsu, the shoyu and the spicy miso. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LunchAndMorning (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LunchAndMorning once the desktop is up so the agent finds it on screen.
command = "/opt/lunchandmorning/start-lunchandmorning.sh"
timeout_sec = 60.0
retries = 5
