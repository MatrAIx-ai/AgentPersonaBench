version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nibs-not-toons-app"
theme = "Interest: Calligraphy = Passionate · Film: Animation = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "calligraphy", "animation", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: nibs-not-toons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its calligraphy and its distaste for animated films.
[[checks]]
dimension_id = "topic_calligraphy"
dimension_label = "Interest: Calligraphy"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_calligraphy=Passionate"
adherence_signal = "The workshops chosen are calligraphy (broad-nib basics, brush lettering, copperplate) rather than the candle, scrapbooking and embroidery workshops the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_animation=Dislike"
adherence_signal = "The films chosen are the non-animated ones (the comedy, the musical, the biopic); no animated film is booked, even though the centre pushes the hand-drawn feature, the stop-motion film and the computer-animated feature. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenAndInk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenAndInk once the desktop is up so the agent finds it on screen.
command = "/opt/screenandink/start-screenandink.sh"
timeout_sec = 60.0
retries = 5
