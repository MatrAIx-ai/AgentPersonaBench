version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nibs-not-toons-survey"
theme = "Interest: Calligraphy = Passionate · Film: Animation = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "calligraphy", "animation", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: nibs-not-toons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its calligraphy and its distaste for animated films.
[[checks]]
dimension_id = "topic_calligraphy"
dimension_label = "Interest: Calligraphy"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_calligraphy=Passionate"
adherence_signal = "The workshops chosen are calligraphy (broad-nib basics, brush lettering, copperplate) rather than the candle, scrapbooking and embroidery workshops the centre pushes. Each option id maps to a `nib` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_animation=Dislike"
adherence_signal = "The films chosen are the non-animated ones (the comedy, the musical, the biopic); no animated film is booked, even though the centre pushes the hand-drawn feature, the stop-motion film and the computer-animated feature. Each option id maps to a `toon` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
