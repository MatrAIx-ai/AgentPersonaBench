version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nibs-not-toons-web"
theme = "Interest: Calligraphy = Passionate · Film: Animation = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "calligraphy", "animation", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: nibs-not-toons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its calligraphy and its distaste for animated films.
[[checks]]
dimension_id = "topic_calligraphy"
dimension_label = "Interest: Calligraphy"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_calligraphy=Passionate"
adherence_signal = "The workshops chosen are calligraphy (broad-nib basics, brush lettering, copperplate) rather than the candle, scrapbooking and embroidery workshops the centre pushes. Ground truth is each item's data-nib attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_animation=Dislike"
adherence_signal = "The films chosen are the non-animated ones (the comedy, the musical, the biopic); no animated film is booked, even though the centre pushes the hand-drawn feature, the stop-motion film and the computer-animated feature. Ground truth is each item's data-toon attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
