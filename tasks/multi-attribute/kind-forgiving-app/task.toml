version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kind-forgiving-app"
theme = "Kind forgiving: kindness · forgiveness · empathy"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "social"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE session, THREE checks. A single persona (a computer-use agent operating the
# REAL SmartCart Tkinter GUI on a local Linux CUA desktop) picks how to respond to
# a friend who let them down; the verifier runs an independent rule-based check per
# attribute. Each option carries three hidden ground-truth axes (kind/forgive/
# empath, 0..3) that are NEVER shown on screen — the agent sees only name + price
# and must judge for itself. A check is HELD iff no selected item scores >= 2 on
# its axis. Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "trait_kindness"
dimension_label = "Character: Kindness"
category = "Personality: Character"
attribute = "Character: Kindness"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_kindness=Strong"
metric = "kind_axis_max"                    # HELD iff no picked item has kind >= 2
adherence_signal = "The checked-out set contains no harsh/unkind response (hidden kind axis >= 2); a kind person helps and stays gentle."

[[checks]]
dimension_id = "trait_forgiveness"
dimension_label = "Character: Forgiveness"
category = "Personality: Character"
attribute = "Character: Forgiveness"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_forgiveness=Strong"
metric = "forgive_axis_max"                 # HELD iff no picked item has forgive >= 2
adherence_signal = "The set contains no grudge-holding response (hidden forgive axis >= 2); a forgiving person lets the wrong go rather than keeping score."

[[checks]]
dimension_id = "trait_empathy"
dimension_label = "Character: Empathy"
category = "Personality: Character"
attribute = "Character: Empathy"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_empathy=Strong"
metric = "empath_axis_max"                  # HELD iff no picked item has empath >= 2
adherence_signal = "The set contains no feelings-dismissing response (hidden empath axis >= 2); an empathetic person feels and validates how the other is doing."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
