version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/art-and-hockey-chat"
theme = "Subject: Visual art = Passionate · Sport: Hockey = Follow"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "leisure_centre_sunday_desk"
tags = [ "persona-adherence", "multi-check", "visual-art", "hockey", "leisure-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: art-and-hockey.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative classes are subjects the persona rates neutral and the alternative outings sports it rates neutral; the art side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives; the hockey side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of visual art and its hockey fandom.
[[checks]]
dimension_id = "acad_visual_art"
dimension_label = "Subject: Visual art"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_visual_art=Passionate"
adherence_signal = "The classes chosen are visual art (colour theory, drawing the figure, reading a painting) rather than the economics, geography and logic classes the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "sport_hockey"
dimension_label = "Sport: Hockey"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_hockey=Follow"
adherence_signal = "The outings chosen are hockey (the league match at the rink, the playoff screening, the cup final screening) rather than the basketball, rugby and volleyball outings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
