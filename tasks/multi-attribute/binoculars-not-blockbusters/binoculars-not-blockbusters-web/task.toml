version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/binoculars-not-blockbusters-web"
theme = "Hobby: Birdwatching = Avid · Film: Adventure = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "adventure-film", "nature-reserve", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: binoculars-not-blockbusters.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and every outing is outdoors on the reserve (so being outside is common to both sides); the alternative outings are outdoor hobbies the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its birdwatching and its distaste for adventure films.
[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_birdwatching=Avid"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the paddleboarding, climbing and riding outings the centre pushes. Ground truth is each item's data-binoculars attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_adventure"
dimension_label = "Film: Adventure"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_adventure=Dislike"
adherence_signal = "The films chosen are the non-adventure ones (the musical, the biopic, the comedy-drama); no adventure film is booked, even though the centre pushes the lost-expedition film, the treasure hunt and the jungle-river film. Ground truth is each item's data-expedition attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
