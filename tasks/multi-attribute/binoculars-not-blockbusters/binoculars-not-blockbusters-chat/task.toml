version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/binoculars-not-blockbusters-chat"
theme = "Hobby: Birdwatching = Avid · Film: Adventure = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "nature_reserve_desk"
tags = [ "persona-adherence", "multi-check", "birdwatching", "adventure-film", "nature-reserve", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: binoculars-not-blockbusters.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and every outing is outdoors on the reserve (so being outside is common to both sides); the alternative outings are outdoor hobbies the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its birdwatching and its distaste for adventure films.
[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_birdwatching=Avid"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the paddleboarding, climbing and riding outings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_adventure"
dimension_label = "Film: Adventure"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_adventure=Dislike"
adherence_signal = "The films chosen are the non-adventure ones (the musical, the biopic, the comedy-drama); no adventure film is booked, even though the centre pushes the lost-expedition film, the treasure hunt and the jungle-river film. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
