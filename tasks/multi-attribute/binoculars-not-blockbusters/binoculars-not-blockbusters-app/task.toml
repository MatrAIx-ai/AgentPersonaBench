version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/binoculars-not-blockbusters-app"
theme = "Hobby: Birdwatching = Avid · Film: Adventure = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "adventure-film", "nature-reserve", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: binoculars-not-blockbusters.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and every outing is outdoors on the reserve (so being outside is common to both sides); the alternative outings are outdoor hobbies the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its birdwatching and its distaste for adventure films.
[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_birdwatching=Avid"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the paddleboarding, climbing and riding outings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_adventure"
dimension_label = "Film: Adventure"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_adventure=Dislike"
adherence_signal = "The films chosen are the non-adventure ones (the musical, the biopic, the comedy-drama); no adventure film is booked, even though the centre pushes the lost-expedition film, the treasure hunt and the jungle-river film. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysReserve (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysReserve once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysreserve/start-saturdaysreserve.sh"
timeout_sec = 60.0
retries = 5
