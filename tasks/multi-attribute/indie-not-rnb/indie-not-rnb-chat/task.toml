version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/indie-not-rnb-chat"
theme = "Film: Indie film = Love · Music: R&B = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "film_and_gig_desk"
tags = [ "persona-adherence", "multi-check", "indie-films", "r-and-b", "film-and-gig", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: indie-not-rnb.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every venue is alcohol-free; the alternative screenings are genres the persona rates neutral and the non-R&B gigs genres it rates neutral — so the picks isolate its taste for indie film and its distaste for R&B.
[[checks]]
dimension_id = "filmg_indie_film"
dimension_label = "Film: Indie film"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_indie_film=Love"
adherence_signal = "The screenings chosen are indie films (micro-budget debut, festival-circuit indie, one-flat two-hander) rather than the sci-fi, animated and heist films the night pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_r_b"
dimension_label = "Music: R&B"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_r_b=Dislike"
adherence_signal = "The gigs chosen are the non-R&B gigs (rock band, folk duo, afrobeats night); no R&B gig is booked, even though the night pushes the R&B headliner, the showcase and the neo-soul night. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
