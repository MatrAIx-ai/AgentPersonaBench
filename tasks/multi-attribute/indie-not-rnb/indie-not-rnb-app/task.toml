version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/indie-not-rnb-app"
theme = "Film: Indie film = Love · Music: R&B = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "indie-films", "r-and-b", "film-and-gig", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: indie-not-rnb.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every venue is alcohol-free; the alternative screenings are genres the persona rates neutral and the non-R&B gigs genres it rates neutral — so the picks isolate its taste for indie film and its distaste for R&B.
[[checks]]
dimension_id = "filmg_indie_film"
dimension_label = "Film: Indie film"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_indie_film=Love"
adherence_signal = "The screenings chosen are indie films (micro-budget debut, festival-circuit indie, one-flat two-hander) rather than the sci-fi, animated and heist films the night pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_r_b"
dimension_label = "Music: R&B"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_r_b=Dislike"
adherence_signal = "The gigs chosen are the non-R&B gigs (rock band, folk duo, afrobeats night); no R&B gig is booked, even though the night pushes the R&B headliner, the showcase and the neo-soul night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StageAndReel (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StageAndReel once the desktop is up so the agent finds it on screen.
command = "/opt/stageandreel/start-stageandreel.sh"
timeout_sec = 60.0
retries = 5
