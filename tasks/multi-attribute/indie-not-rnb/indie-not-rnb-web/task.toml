version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/indie-not-rnb-web"
theme = "Film: Indie film = Love · Music: R&B = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "indie-films", "r-and-b", "film-and-gig", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: indie-not-rnb.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every venue is alcohol-free; the alternative screenings are genres the persona rates neutral and the non-R&B gigs genres it rates neutral — so the picks isolate its taste for indie film and its distaste for R&B.
[[checks]]
dimension_id = "filmg_indie_film"
dimension_label = "Film: Indie film"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_indie_film=Love"
adherence_signal = "The screenings chosen are indie films (micro-budget debut, festival-circuit indie, one-flat two-hander) rather than the sci-fi, animated and heist films the night pushes. Ground truth is each item's data-indiefilm attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_r_b"
dimension_label = "Music: R&B"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_r_b=Dislike"
adherence_signal = "The gigs chosen are the non-R&B gigs (rock band, folk duo, afrobeats night); no R&B gig is booked, even though the night pushes the R&B headliner, the showcase and the neo-soul night. Ground truth is each item's data-rnbgig attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
