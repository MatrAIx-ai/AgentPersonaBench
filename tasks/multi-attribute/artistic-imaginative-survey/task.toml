version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/artistic-imaginative-survey"
theme = "Artistic imaginative: inventive/original ideas · seeks beauty & aesthetics · thinks in concepts"

[metadata]
difficulty = "medium"
type = "survey"
domain = "everyday-life"
tags = [ "persona-adherence", "multi-check", "rule-based", "choice-based",]

# --- Multi-attribute SURVEY task ---------------------------------------------- #
# ONE persona, ONE questionnaire, THREE independent checks (scored k/3). A single
# "artistic imaginative" persona answers 6 everyday questions; the verifier scores
# each chosen option on THREE hidden axes and runs one rule-based check per axis.
# This amortizes one generation across three attributes instead of one task per
# value.
#
# Survey env: each option carries hidden per-axis tiers in tests/answer_key.yaml
# (imag{}, art{}, abst{}). The questionnaire never names imagination, artistic
# interest, or abstraction as traits and never says anything is measured — it just
# asks what the person would actually do. The answer key is host-only (tests/ is
# not mounted), so the agent can't self-score. Reward = integer count of HELD
# checks (0..3).

[[checks]]
dimension_id = "big5_imagination"
dimension_label = "Imagination"
category = "Personality: Big Five"
attribute = "Big Five: Imagination"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_imagination=Very high"
# Anchored to a hidden per-option `imag` tier (0 = wildly inventive .. 3 = obvious/literal).
adherence_signal = "No chosen option is a literal/unimaginative tier (imag >= 2); tier-0/1 inventive picks are imaginative."

[[checks]]
dimension_id = "big5_artistic_interest"
dimension_label = "Artistic interest"
category = "Personality: Big Five"
attribute = "Big Five: Artistic interest"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_artistic_interest=Very high"
# Anchored to a hidden per-option `art` tier (0 = strongly beauty-seeking .. 3 = indifferent to looks).
adherence_signal = "No chosen option is an art-indifferent tier (art >= 2); tier-0/1 beauty-seeking picks show artistic interest."

[[checks]]
dimension_id = "cog_abstraction"
dimension_label = "Abstract vs concrete"
category = "Linguistic: Communication"
attribute = "Cognition: Abstraction"
value = "Abstract"
evaluator = "rule-based"
evaluator_name = "cog_abstraction=Abstract"
# Anchored to a hidden per-option `abst` tier (0 = conceptual/big-picture .. 3 = strictly concrete/literal).
adherence_signal = "No chosen option is a strictly-concrete/literal tier (abst >= 2); tier-0/1 conceptual picks are abstract."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
