version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skateboarding-not-motorcycles-web"
theme = "Sport: Skateboarding = Follow · Interest: Motorcycles = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "skateboarding", "motorcycles", "sports-and-social-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skateboarding-not-motorcycles.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, both halves are the same length and the clubhouse is alcohol-free; the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the skate side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its skateboarding fandom and its distaste for motorcycles.
[[checks]]
dimension_id = "sport_skateboarding"
dimension_label = "Sport: Skateboarding"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_skateboarding=Follow"
adherence_signal = "The outings chosen are skateboarding (the street championship, the vert screening, the skatepark open) rather than the golf, cricket and badminton outings the club pushes. Ground truth is each item's data-deckfan attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_motorcycles"
dimension_label = "Interest: Motorcycles"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_motorcycles=Averse"
adherence_signal = "The sessions chosen are the non-motorcycle ones (cookery, geography, film quiz); no motorcycle session is booked, even though the club pushes the classic-bike show, the superbike screening and the restoration talk. Ground truth is each item's data-throttlehour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
