version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dough-and-type-survey"
theme = "Hobby: Bread baking = Active · Hobby: Letterpress = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "bread-baking", "letterpress", "makers-fair", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dough-and-type.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both workshops are the same length; the alternative crafts (weaving, soap, glass, macramé, mosaic, marbling) are ones the persona has no rating on — its occasional crafts (pottery, candles, calligraphy) are kept off both sides — so the picks isolate the persona's bread baking and its letterpress.
[[checks]]
dimension_id = "hob_bread_baking"
dimension_label = "Hobby: Bread baking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_bread_baking=Active"
adherence_signal = "The morning workshops chosen are bread workshops (sourdough shaping, enriched-dough session, flatbread session) rather than the weaving, soap and glass mornings the fair pushes. Each option id maps to a `loaf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_letterpress"
dimension_label = "Hobby: Letterpress"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_letterpress=Avid"
adherence_signal = "The afternoon workshops chosen are letterpress workshops (card printing, poster typesetting on the proof press, wood-type poster printing) rather than the macramé, mosaic and marbling afternoons the fair pushes. Each option id maps to a `press` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
