version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dough-and-type-chat"
theme = "Hobby: Bread baking = Active · Hobby: Letterpress = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "makers_fair_desk"
tags = [ "persona-adherence", "multi-check", "bread-baking", "letterpress", "makers-fair", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dough-and-type.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both workshops are the same length; the alternative crafts (weaving, soap, glass, macramé, mosaic, marbling) are ones the persona has no rating on — its occasional crafts (pottery, candles, calligraphy) are kept off both sides — so the picks isolate the persona's bread baking and its letterpress.
[[checks]]
dimension_id = "hob_bread_baking"
dimension_label = "Hobby: Bread baking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_bread_baking=Active"
adherence_signal = "The morning workshops chosen are bread workshops (sourdough shaping, enriched-dough session, flatbread session) rather than the weaving, soap and glass mornings the fair pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_letterpress"
dimension_label = "Hobby: Letterpress"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_letterpress=Avid"
adherence_signal = "The afternoon workshops chosen are letterpress workshops (card printing, poster typesetting on the proof press, wood-type poster printing) rather than the macramé, mosaic and marbling afternoons the fair pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
