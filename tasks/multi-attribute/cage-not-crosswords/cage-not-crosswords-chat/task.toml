version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cage-not-crosswords-chat"
theme = "Sport: MMA = Play · Interest: Puzzles = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "leisure_centre_midweek_desk"
tags = [ "persona-adherence", "multi-check", "mma", "puzzles", "leisure-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cage-not-crosswords.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and the café is alcohol-free (the persona drinks none); the alternative classes are sports the persona rates neutral and the alternative café hours topics it rates neutral — so the picks isolate its MMA and its distaste for puzzles.
[[checks]]
dimension_id = "sport_mma"
dimension_label = "Sport: MMA"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_mma=Play"
adherence_signal = "The classes chosen are MMA (the beginners' class, open-mat grappling, pad-work striking) rather than the badminton, swimming and yoga sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_puzzles"
dimension_label = "Interest: Puzzles"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_puzzles=Averse"
adherence_signal = "The café hours chosen are the non-puzzle ones (languages, sketching, night sky); no puzzle hour is booked, even though the centre pushes the crossword club, the jigsaw evening and the sudoku league. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
