version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cage-not-crosswords-web"
theme = "Sport: MMA = Play · Interest: Puzzles = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "mma", "puzzles", "leisure-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cage-not-crosswords.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and the café is alcohol-free (the persona drinks none); the alternative classes are sports the persona rates neutral and the alternative café hours topics it rates neutral — so the picks isolate its MMA and its distaste for puzzles.
[[checks]]
dimension_id = "sport_mma"
dimension_label = "Sport: MMA"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_mma=Play"
adherence_signal = "The classes chosen are MMA (the beginners' class, open-mat grappling, pad-work striking) rather than the badminton, swimming and yoga sessions the centre pushes. Ground truth is each item's data-octagon attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_puzzles"
dimension_label = "Interest: Puzzles"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_puzzles=Averse"
adherence_signal = "The café hours chosen are the non-puzzle ones (languages, sketching, night sky); no puzzle hour is booked, even though the centre pushes the crossword club, the jigsaw evening and the sudoku league. Ground truth is each item's data-gridhour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
