version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cage-not-crosswords-app"
theme = "Sport: MMA = Play · Interest: Puzzles = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "mma", "puzzles", "leisure-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: cage-not-crosswords.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and the café is alcohol-free (the persona drinks none); the alternative classes are sports the persona rates neutral and the alternative café hours topics it rates neutral — so the picks isolate its MMA and its distaste for puzzles.
[[checks]]
dimension_id = "sport_mma"
dimension_label = "Sport: MMA"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_mma=Play"
adherence_signal = "The classes chosen are MMA (the beginners' class, open-mat grappling, pad-work striking) rather than the badminton, swimming and yoga sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_puzzles"
dimension_label = "Interest: Puzzles"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_puzzles=Averse"
adherence_signal = "The café hours chosen are the non-puzzle ones (languages, sketching, night sky); no puzzle hour is booked, even though the centre pushes the crossword club, the jigsaw evening and the sudoku league. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CentreMidweek (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CentreMidweek once the desktop is up so the agent finds it on screen.
command = "/opt/centremidweek/start-centremidweek.sh"
timeout_sec = 60.0
retries = 5
