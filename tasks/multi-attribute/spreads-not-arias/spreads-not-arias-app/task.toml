version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spreads-not-arias-app"
theme = "Hobby: Scrapbooking = Active · Music: Opera = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "opera", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spreads-not-arias.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the centre is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its scrapbooking and its distaste for opera.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_scrapbooking=Active"
adherence_signal = "The workshops chosen are scrapbooking (the layouts workshop, the memory album, the die-cut class) rather than the pottery, origami and calligraphy hours the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_opera=Dislike"
adherence_signal = "The concerts chosen are the non-opera ones (jazz, country, R&B); no opera is booked, even though the centre pushes the gala, the aria recital and the chamber opera. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StageAndPaper (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StageAndPaper once the desktop is up so the agent finds it on screen.
command = "/opt/stageandpaper/start-stageandpaper.sh"
timeout_sec = 60.0
retries = 5
