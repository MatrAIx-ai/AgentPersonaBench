version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spreads-not-arias-web"
theme = "Hobby: Scrapbooking = Active · Music: Opera = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "opera", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spreads-not-arias.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the centre is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its scrapbooking and its distaste for opera.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_scrapbooking=Active"
adherence_signal = "The workshops chosen are scrapbooking (the layouts workshop, the memory album, the die-cut class) rather than the pottery, origami and calligraphy hours the centre pushes. Ground truth is each item's data-layout attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_opera=Dislike"
adherence_signal = "The concerts chosen are the non-opera ones (jazz, country, R&B); no opera is booked, even though the centre pushes the gala, the aria recital and the chamber opera. Ground truth is each item's data-aria attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
