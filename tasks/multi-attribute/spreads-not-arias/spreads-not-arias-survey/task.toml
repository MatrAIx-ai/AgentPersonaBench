version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spreads-not-arias-survey"
theme = "Hobby: Scrapbooking = Active · Music: Opera = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "opera", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spreads-not-arias.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the centre is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its scrapbooking and its distaste for opera.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_scrapbooking=Active"
adherence_signal = "The workshops chosen are scrapbooking (the layouts workshop, the memory album, the die-cut class) rather than the pottery, origami and calligraphy hours the centre pushes. Each option id maps to a `layout` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_opera=Dislike"
adherence_signal = "The concerts chosen are the non-opera ones (jazz, country, R&B); no opera is booked, even though the centre pushes the gala, the aria recital and the chamber opera. Each option id maps to a `aria` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
