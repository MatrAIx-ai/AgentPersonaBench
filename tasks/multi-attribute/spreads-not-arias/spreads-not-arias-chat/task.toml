version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spreads-not-arias-chat"
theme = "Hobby: Scrapbooking = Active · Music: Opera = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "arts_centre_concert_desk"
tags = [ "persona-adherence", "multi-check", "scrapbooking", "opera", "arts-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spreads-not-arias.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the centre is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its scrapbooking and its distaste for opera.
[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_scrapbooking=Active"
adherence_signal = "The workshops chosen are scrapbooking (the layouts workshop, the memory album, the die-cut class) rather than the pottery, origami and calligraphy hours the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_opera=Dislike"
adherence_signal = "The concerts chosen are the non-opera ones (jazz, country, R&B); no opera is booked, even though the centre pushes the gala, the aria recital and the chamber opera. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
