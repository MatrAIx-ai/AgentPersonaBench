version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/starships-not-trenches-survey"
theme = "Books: Science fiction = Love · Film: War = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "science-fiction", "war-film", "book-and-film-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: starships-not-trenches.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for science fiction and its distaste for war films.
[[checks]]
dimension_id = "bookg_science_fiction"
dimension_label = "Books: Science fiction"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_science_fiction=Love"
adherence_signal = "The books chosen are science fiction (the generation ship, the first contact, the far future) rather than the literary, historical and fantasy picks the club pushes. Each option id maps to a `starship` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_war"
dimension_label = "Film: War"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_war=Dislike"
adherence_signal = "The films chosen are the non-war ones (the western, the comedy, the biopic); no war film is booked, even though the club pushes the trenches, the D-Day film and the jungle war. Each option id maps to a `trench` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
