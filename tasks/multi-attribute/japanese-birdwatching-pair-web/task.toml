version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/japanese-birdwatching-pair-web"
theme = "Turntable: preferred japanese dinner and avoided birdwatching outing"

[metadata]
difficulty = "medium"
type = "web"
domain = "food-and-dining"
tags = [ "persona-adherence", "multi-check", "taste-cuis-topic", "rule-based", "playwright", "real-web",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
#
# Isolation: inside a group every option carries the same neutral spec line, so
# no option is shorter, cheaper or easier than another and only the genre
# differs. Genre taste is a preference with no better answer.
[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_japanese=Love"
adherence_signal = "The submitted queue selects the japanese option in both independent featured sections."

[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_birdwatching=Averse"
adherence_signal = "The submitted queue opens both customization panels and replaces each birdwatching default with the sole alternative outside that genre."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
