version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/traditional-conserver-survey"
theme = "Traditional conserver: tradition · conformity · security"

[metadata]
difficulty = "medium"
type = "survey"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "rule-based", "choice-based",]

# --- Multi-attribute SURVEY task ---------------------------------------------- #
# ONE persona, ONE questionnaire, THREE independent checks (scored k/3). A single
# "traditional conserver" persona answers 6 everyday questions about customs,
# norms, and stability; the verifier scores each chosen option on THREE hidden
# axes and runs one rule-based check per axis. This amortizes one generation
# across three attributes instead of one task per value.
#
# Survey env (like cost-sensitive-survey): each option carries hidden per-axis
# tiers in tests/answer_key.yaml (tradition{}, conform{}, secure{}). The
# questionnaire never names tradition, conformity, or security as traits and never
# says anything is measured — it just asks what the person would actually do. The
# answer key is host-only (tests/ is not mounted), so the agent can't self-score.
# Reward = integer count of HELD checks (0..3).

[[checks]]
dimension_id = "schwartz_value_tradition"
dimension_label = "Schwartz Tradition"
category = "Values & Motivation"
attribute = "Schwartz Tradition"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_tradition=High"
# Anchored to a hidden per-option `tradition` tier (0 = keep/honor the custom ..
# 3 = abandon or break with tradition).
adherence_signal = "No chosen option abandons tradition (tradition >= 2); tier-0/1 keep-the-custom picks embody a strong tradition value."

[[checks]]
dimension_id = "schwartz_value_conformity"
dimension_label = "Schwartz Conformity"
category = "Values & Motivation"
attribute = "Schwartz Conformity"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_conformity=High"
# Anchored to a hidden per-option `conform` tier (0 = follow the rules/expected
# proper way .. 3 = defy norms/break convention).
adherence_signal = "No chosen option defies the norms (conform >= 2); tier-0/1 follow-the-expected-way picks embody a strong conformity value."

[[checks]]
dimension_id = "schwartz_value_security"
dimension_label = "Schwartz Security"
category = "Values & Motivation"
attribute = "Schwartz Security"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_security=High"
# Anchored to a hidden per-option `secure` tier (0 = play it safe/stable ..
# 3 = take a big chance/gamble).
adherence_signal = "No chosen option takes a big chance (secure >= 2); tier-0/1 play-it-safe picks embody a strong security value."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
