version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/analytical-decider-app"
theme = "Analytical decider: weighs the evidence, digs into the details, wants it settled (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "decisions"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE decision-planning session, THREE checks. A single persona (a computer-use
# agent operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop)
# builds one plan of the steps they'd take for a big decision; the verifier runs an
# independent rule-based check per attribute. Each step carries three hidden
# ground-truth axes (analytical/detail/closure, 0..3) that are NEVER shown on
# screen — the agent sees only the step name + short note and must judge for
# itself. A check is HELD iff no selected step scores >= 2 on its axis. Reward =
# integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "decision_style"
dimension_label = "Decision style"
category = "Risk & Decision"
attribute = "Decision style"
value = "Analytical"
evaluator = "rule-based"
evaluator_name = "decision_style=Analytical"
metric = "analytical_axis_max"              # HELD iff no picked step has analytical >= 2
adherence_signal = "The chosen plan contains no snap-gut step (hidden analytical axis >= 2); an analytical decider weighs the evidence before choosing."

[[checks]]
dimension_id = "cog_detail_orientation"
dimension_label = "Cognition: Detail orientation"
category = "Linguistic: Communication"
attribute = "Cognition: Detail orientation"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "cog_detail_orientation=Very high"
metric = "detail_axis_max"                  # HELD iff no picked step has detail >= 2
adherence_signal = "The plan contains no gloss-over step (hidden detail axis >= 2); a detail-oriented decider digs into the specifics rather than skipping them."

[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for closure"
category = "Risk & Decision"
attribute = "Need for closure"
value = "High"
evaluator = "rule-based"
evaluator_name = "need_for_closure=High"
metric = "closure_axis_max"                 # HELD iff no picked step has closure >= 2
adherence_signal = "The plan contains no leave-it-open step (hidden closure axis >= 2); a high need for closure means settling on a firm decision rather than keeping it open."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
