version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sawdust-not-trance-chat"
theme = "Hobby: Woodworking = Active · Music: Trance = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "centre_saturday_desk"
tags = [ "persona-adherence", "multi-check", "woodworking", "trance", "community-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sawdust-not-trance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hall is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its woodworking and its distaste for trance.
[[checks]]
dimension_id = "hob_woodworking"
dimension_label = "Hobby: Woodworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_woodworking=Active"
adherence_signal = "The workshops chosen are woodwork (the dovetail workshop, spoon carving, the stool build) rather than the pottery, leather and origami workshops the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_trance"
dimension_label = "Music: Trance"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_trance=Dislike"
adherence_signal = "The socials chosen are the non-trance ones (disco, house, synthwave); no trance night is booked, even though the centre pushes the trance DJ, the psytrance set and the uplifting night. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
