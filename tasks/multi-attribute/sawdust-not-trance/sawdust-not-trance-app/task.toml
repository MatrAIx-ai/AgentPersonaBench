version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sawdust-not-trance-app"
theme = "Hobby: Woodworking = Active · Music: Trance = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "woodworking", "trance", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sawdust-not-trance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hall is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its woodworking and its distaste for trance.
[[checks]]
dimension_id = "hob_woodworking"
dimension_label = "Hobby: Woodworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_woodworking=Active"
adherence_signal = "The workshops chosen are woodwork (the dovetail workshop, spoon carving, the stool build) rather than the pottery, leather and origami workshops the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_trance"
dimension_label = "Music: Trance"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_trance=Dislike"
adherence_signal = "The socials chosen are the non-trance ones (disco, house, synthwave); no trance night is booked, even though the centre pushes the trance DJ, the psytrance set and the uplifting night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HallAndBench (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HallAndBench once the desktop is up so the agent finds it on screen.
command = "/opt/hallandbench/start-hallandbench.sh"
timeout_sec = 60.0
retries = 5
