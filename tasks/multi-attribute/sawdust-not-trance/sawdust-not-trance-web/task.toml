version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sawdust-not-trance-web"
theme = "Hobby: Woodworking = Active · Music: Trance = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "woodworking", "trance", "community-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sawdust-not-trance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hall is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its woodworking and its distaste for trance.
[[checks]]
dimension_id = "hob_woodworking"
dimension_label = "Hobby: Woodworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_woodworking=Active"
adherence_signal = "The workshops chosen are woodwork (the dovetail workshop, spoon carving, the stool build) rather than the pottery, leather and origami workshops the centre pushes. Ground truth is each item's data-sawdust attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_trance"
dimension_label = "Music: Trance"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_trance=Dislike"
adherence_signal = "The socials chosen are the non-trance ones (disco, house, synthwave); no trance night is booked, even though the centre pushes the trance DJ, the psytrance set and the uplifting night. Ground truth is each item's data-trancefloor attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
