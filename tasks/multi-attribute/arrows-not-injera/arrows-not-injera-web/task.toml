version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/arrows-not-injera-web"
theme = "Sport: Archery = Play · Cuisine: Ethiopian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "archery", "ethiopian-cuisine", "outdoor-sports-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: arrows-not-injera.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the non-Ethiopian lunches cuisines it rates neutral — so the picks isolate its archery and its distaste for Ethiopian food.
[[checks]]
dimension_id = "sport_archery"
dimension_label = "Sport: Archery"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_archery=Play"
adherence_signal = "The sessions chosen are archery (the coached session, the field course, the 3D round) rather than the climbing, golf and running sessions the centre pushes. Ground truth is each item's data-quiver attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_ethiopian"
dimension_label = "Cuisine: Ethiopian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_ethiopian=Avoid"
adherence_signal = "The lunches chosen are the non-Ethiopian ones (Italian, Mexican, Turkish); no Ethiopian lunch is booked, even though the centre pushes the beyaynetu, the doro wat and the tibs. Ground truth is each item's data-injeraplate attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
