version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/arrows-not-injera-app"
theme = "Sport: Archery = Play · Cuisine: Ethiopian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "archery", "ethiopian-cuisine", "outdoor-sports-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: arrows-not-injera.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the non-Ethiopian lunches cuisines it rates neutral — so the picks isolate its archery and its distaste for Ethiopian food.
[[checks]]
dimension_id = "sport_archery"
dimension_label = "Sport: Archery"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_archery=Play"
adherence_signal = "The sessions chosen are archery (the coached session, the field course, the 3D round) rather than the climbing, golf and running sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_ethiopian"
dimension_label = "Cuisine: Ethiopian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_ethiopian=Avoid"
adherence_signal = "The lunches chosen are the non-Ethiopian ones (Italian, Mexican, Turkish); no Ethiopian lunch is booked, even though the centre pushes the beyaynetu, the doro wat and the tibs. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LunchAndRange (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LunchAndRange once the desktop is up so the agent finds it on screen.
command = "/opt/lunchandrange/start-lunchandrange.sh"
timeout_sec = 60.0
retries = 5
