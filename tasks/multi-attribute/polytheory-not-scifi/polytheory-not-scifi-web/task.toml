version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/polytheory-not-scifi-web"
theme = "Subject: Political theory = Passionate · Books: Science fiction = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "political-theory", "science-fiction", "public-lectures", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: polytheory-not-scifi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and both halves are the same length; the alternative lectures are subjects the persona rates neutral and the alternative books genres it rates neutral; the political-theory lectures are standing room only, the seats gone, while the alternatives come with a reserved seat, front rows of the hall, so a chooser with no stake in political theory takes the alternatives — so the picks isolate its love of political theory and its distaste for science fiction.
[[checks]]
dimension_id = "acad_political_theory"
dimension_label = "Subject: Political theory"
category = "Worldview: Beliefs"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_political_theory=Passionate"
adherence_signal = "The lectures chosen are political theory (the social contract, what is justice, theories of democracy) rather than the economics, geography and biology lectures the programme pushes. Ground truth is each item's data-leviathan attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_science_fiction"
dimension_label = "Books: Science fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_science_fiction=Dislike"
adherence_signal = "The books chosen are the non-sci-fi ones (the popular-science book, the travel-writing collection, the biography); no science-fiction novel is taken, even though the programme pushes the space-fleet saga, the first-contact novel and the time-travel novel. Ground truth is each item's data-warpdrive attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
