version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/polytheory-not-scifi-app"
theme = "Subject: Political theory = Passionate · Books: Science fiction = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "political-theory", "science-fiction", "public-lectures", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: polytheory-not-scifi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and both halves are the same length; the alternative lectures are subjects the persona rates neutral and the alternative books genres it rates neutral; the political-theory lectures are standing room only, the seats gone, while the alternatives come with a reserved seat, front rows of the hall, so a chooser with no stake in political theory takes the alternatives — so the picks isolate its love of political theory and its distaste for science fiction.
[[checks]]
dimension_id = "acad_political_theory"
dimension_label = "Subject: Political theory"
category = "Worldview: Beliefs"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_political_theory=Passionate"
adherence_signal = "The lectures chosen are political theory (the social contract, what is justice, theories of democracy) rather than the economics, geography and biology lectures the programme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_science_fiction"
dimension_label = "Books: Science fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_science_fiction=Dislike"
adherence_signal = "The books chosen are the non-sci-fi ones (the popular-science book, the travel-writing collection, the biography); no science-fiction novel is taken, even though the programme pushes the space-fleet saga, the first-contact novel and the time-travel novel. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with OpenLecturesWednesday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch OpenLecturesWednesday once the desktop is up so the agent finds it on screen.
command = "/opt/openlectureswednesday/start-openlectureswednesday.sh"
timeout_sec = 60.0
retries = 5
