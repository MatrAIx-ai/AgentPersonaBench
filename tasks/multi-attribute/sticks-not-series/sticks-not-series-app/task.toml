version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sticks-not-series-app"
theme = "Sport: Hockey = Play · Interest: TV series = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "hockey", "tv-series", "weekend-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sticks-not-series.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same, both halves are the same length, and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative sports are ones the persona rates none, offered in the same committed register as the hockey (a training session, a league game, a squad outing) so that the trade is a preference rather than serious-against-taster and the non-series evenings are just as sociable — so the picks isolate its hockey and its distaste for television series.
[[checks]]
dimension_id = "sport_hockey"
dimension_label = "Sport: Hockey"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_hockey=Play"
adherence_signal = "The Saturday sports chosen are hockey (league match, training session, mixed sevens) rather than the rugby, basketball and rowing Saturdays the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_tv_series"
dimension_label = "Interest: TV series"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_tv_series=Averse"
adherence_signal = "The evenings chosen are the non-series evenings (film night, trivia night, craft-and-chat); no series evening is booked, even though the club pushes the finale watch party, the box-set marathon and the series quiz. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysClub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysClub once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysclub/start-saturdaysclub.sh"
timeout_sec = 60.0
retries = 5
