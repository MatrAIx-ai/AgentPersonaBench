version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sticks-not-series-survey"
theme = "Sport: Hockey = Play · Interest: TV series = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "hockey", "tv-series", "weekend-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sticks-not-series.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same, both halves are the same length, and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative sports are ones the persona rates none, offered in the same committed register as the hockey (a training session, a league game, a squad outing) so that the trade is a preference rather than serious-against-taster and the non-series evenings are just as sociable — so the picks isolate its hockey and its distaste for television series.
[[checks]]
dimension_id = "sport_hockey"
dimension_label = "Sport: Hockey"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_hockey=Play"
adherence_signal = "The Saturday sports chosen are hockey (league match, training session, mixed sevens) rather than the rugby, basketball and rowing Saturdays the club pushes. Each option id maps to a `hockey` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_tv_series"
dimension_label = "Interest: TV series"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_tv_series=Averse"
adherence_signal = "The evenings chosen are the non-series evenings (film night, trivia night, craft-and-chat); no series evening is booked, even though the club pushes the finale watch party, the box-set marathon and the series quiz. Each option id maps to a `boxset` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
