version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cookery-no-litfic-chat"
theme = "Interest: Cooking = Averse · Books: Literary fiction = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "centre_reading_group_desk"
tags = [ "persona-adherence", "multi-check", "cooking", "literary-fiction", "community-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-cookery-no-litfic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for cooking and its distaste for literary fiction.
[[checks]]
dimension_id = "topic_cooking"
dimension_label = "Interest: Cooking"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_cooking=Averse"
adherence_signal = "The sessions chosen are the non-cookery ones (photography, board games, magic); no cookery session is booked, even though the centre pushes the knife-skills class, the pastry morning and the one-pot workshop. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_literary_fiction"
dimension_label = "Books: Literary fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_literary_fiction=Dislike"
adherence_signal = "The books chosen are the non-literary ones (the fantasy, the thriller, the popular science); no literary novel is booked, even though the centre pushes the prize-shortlisted novel, the stream-of-consciousness novel and the linked stories. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
