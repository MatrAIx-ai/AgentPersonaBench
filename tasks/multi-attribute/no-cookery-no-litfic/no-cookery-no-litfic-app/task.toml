version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cookery-no-litfic-app"
theme = "Interest: Cooking = Averse · Books: Literary fiction = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "cooking", "literary-fiction", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-cookery-no-litfic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for cooking and its distaste for literary fiction.
[[checks]]
dimension_id = "topic_cooking"
dimension_label = "Interest: Cooking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cooking=Averse"
adherence_signal = "The sessions chosen are the non-cookery ones (photography, board games, magic); no cookery session is booked, even though the centre pushes the knife-skills class, the pastry morning and the one-pot workshop. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_literary_fiction"
dimension_label = "Books: Literary fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_literary_fiction=Dislike"
adherence_signal = "The books chosen are the non-literary ones (the fantasy, the thriller, the popular science); no literary novel is booked, even though the centre pushes the prize-shortlisted novel, the stream-of-consciousness novel and the linked stories. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BookAndMorning (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BookAndMorning once the desktop is up so the agent finds it on screen.
command = "/opt/bookandmorning/start-bookandmorning.sh"
timeout_sec = 60.0
retries = 5
