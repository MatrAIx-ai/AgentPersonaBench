version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cookery-no-litfic-web"
theme = "Interest: Cooking = Averse · Books: Literary fiction = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "cooking", "literary-fiction", "community-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-cookery-no-litfic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for cooking and its distaste for literary fiction.
[[checks]]
dimension_id = "topic_cooking"
dimension_label = "Interest: Cooking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cooking=Averse"
adherence_signal = "The sessions chosen are the non-cookery ones (photography, board games, magic); no cookery session is booked, even though the centre pushes the knife-skills class, the pastry morning and the one-pot workshop. Ground truth is each item's data-stovetop attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_literary_fiction"
dimension_label = "Books: Literary fiction"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_literary_fiction=Dislike"
adherence_signal = "The books chosen are the non-literary ones (the fantasy, the thriller, the popular science); no literary novel is booked, even though the centre pushes the prize-shortlisted novel, the stream-of-consciousness novel and the linked stories. Ground truth is each item's data-litfic attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
