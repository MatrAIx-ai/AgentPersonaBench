version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/baseball-and-cricket-app"
theme = "Sport: Baseball = Follow · Sport: Cricket = Follow"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "baseball", "cricket", "sports-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: baseball-and-cricket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every weekend costs the same and both fixtures are the same length with tickets and transport included; the alternative afternoons and evenings are sports the persona rates neutral; the baseball side comes with the away end, a 45-minute coach transfer and the alternatives with the home stand, five minutes from the club, so a chooser with no stake in the trait takes the alternatives; the cricket side comes with restricted-view seats, the last left and the alternatives with the best seats in the house, centre row, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its baseball fandom and its cricket fandom.
[[checks]]
dimension_id = "sport_baseball"
dimension_label = "Sport: Baseball"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_baseball=Follow"
adherence_signal = "The afternoon fixtures chosen are baseball (the ballpark league game, the playoff game, the college series game) rather than the gridiron, hockey and rugby afternoons the pass desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_cricket"
dimension_label = "Sport: Cricket"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_cricket=Follow"
adherence_signal = "The evening fixtures chosen are cricket (the floodlit T20, the test-match session on the big screen, the one-day final screening) rather than the tennis, volleyball and badminton evenings the pass desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekendDoubleHeader (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekendDoubleHeader once the desktop is up so the agent finds it on screen.
command = "/opt/weekenddoubleheader/start-weekenddoubleheader.sh"
timeout_sec = 60.0
retries = 5
