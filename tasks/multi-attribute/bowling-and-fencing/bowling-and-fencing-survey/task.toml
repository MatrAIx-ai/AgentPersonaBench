version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bowling-and-fencing-survey"
theme = "Sport: Bowling = Follow · Sport: Fencing = Follow"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "bowling", "fencing", "arena-season-ticket", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bowling-and-fencing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both bills are the same length with tickets and transport included; the alternative early-evening and late events are sports the persona rates neutral; the bowling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the fencing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its tenpin-bowling fandom and its fencing fandom.
[[checks]]
dimension_id = "sport_bowling"
dimension_label = "Sport: Bowling"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_bowling=Follow"
adherence_signal = "The early-evening events chosen are tenpin bowling (the pro tour final at the lanes, the national championship from the concourse, the tour-stop screening) rather than the darts, table-tennis and esports bills the arena pushes. Each option id maps to a `lanes` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_fencing"
dimension_label = "Sport: Fencing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_fencing=Follow"
adherence_signal = "The late bills chosen are fencing (the national championship, the grand-prix foil finals screening, the sabre finals night) rather than the archery, karate and boxing bills the arena pushes. Each option id maps to a `piste_strip` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
