version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bowling-and-fencing-chat"
theme = "Sport: Bowling = Follow · Sport: Fencing = Follow"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "arena_season_ticket_desk"
tags = [ "persona-adherence", "multi-check", "bowling", "fencing", "arena-season-ticket", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bowling-and-fencing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both bills are the same length with tickets and transport included; the alternative early-evening and late events are sports the persona rates neutral; the bowling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the fencing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its tenpin-bowling fandom and its fencing fandom.
[[checks]]
dimension_id = "sport_bowling"
dimension_label = "Sport: Bowling"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_bowling=Follow"
adherence_signal = "The early-evening events chosen are tenpin bowling (the pro tour final at the lanes, the national championship from the concourse, the tour-stop screening) rather than the darts, table-tennis and esports bills the arena pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "sport_fencing"
dimension_label = "Sport: Fencing"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_fencing=Follow"
adherence_signal = "The late bills chosen are fencing (the national championship, the grand-prix foil finals screening, the sabre finals night) rather than the archery, karate and boxing bills the arena pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
