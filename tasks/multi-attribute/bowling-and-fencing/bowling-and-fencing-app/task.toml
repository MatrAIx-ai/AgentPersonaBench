version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bowling-and-fencing-app"
theme = "Sport: Bowling = Follow · Sport: Fencing = Follow"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "bowling", "fencing", "arena-season-ticket", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bowling-and-fencing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both bills are the same length with tickets and transport included; the alternative early-evening and late events are sports the persona rates neutral; the bowling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the fencing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its tenpin-bowling fandom and its fencing fandom.
[[checks]]
dimension_id = "sport_bowling"
dimension_label = "Sport: Bowling"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_bowling=Follow"
adherence_signal = "The early-evening events chosen are tenpin bowling (the pro tour final at the lanes, the national championship from the concourse, the tour-stop screening) rather than the darts, table-tennis and esports bills the arena pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_fencing"
dimension_label = "Sport: Fencing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_fencing=Follow"
adherence_signal = "The late bills chosen are fencing (the national championship, the grand-prix foil finals screening, the sabre finals night) rather than the archery, karate and boxing bills the arena pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ArenaFridays (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ArenaFridays once the desktop is up so the agent finds it on screen.
command = "/opt/arenafridays/start-arenafridays.sh"
timeout_sec = 60.0
retries = 5
