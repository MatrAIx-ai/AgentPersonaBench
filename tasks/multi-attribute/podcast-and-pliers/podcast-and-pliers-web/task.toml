version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/podcast-and-pliers-web"
theme = "Podcast listening = Daily · Hobby: Jewelry making = Avid"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "podcast-listening", "jewelry-making", "craft-kit-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: podcast-and-pliers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit costs the same and is the same quality, and the companion course covers the same steps in every format; the alternative crafts (weaving, glass fusing, soap making) are ones the persona has no rating on — its Never crafts (pottery, leather, calligraphy) are kept off both sides — and the persona is a digital native, so video and PDF are as easy for it as audio; the picks isolate its jewellery making and its podcast habit.
[[checks]]
dimension_id = "lstyle_podcast_listening"
dimension_label = "Podcast listening"
category = "Interests: Culture"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "lstyle_podcast_listening=Daily"
adherence_signal = "The companion courses chosen are podcast series (audio episodes to listen along to) rather than the video, PDF and printed formats the club pushes. Ground truth is each item's data-earbuds attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_jewelry_making"
dimension_label = "Hobby: Jewelry making"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_jewelry_making=Avid"
adherence_signal = "The kits chosen are jewellery kits (silver ring-making, stone-setting pendant, wax carving for casting) rather than the weaving, glass-fusing and soap-making kits the club pushes. Ground truth is each item's data-jeweller attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
