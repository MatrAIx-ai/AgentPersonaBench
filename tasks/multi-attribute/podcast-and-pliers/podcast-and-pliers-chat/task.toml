version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/podcast-and-pliers-chat"
theme = "Podcast listening = Daily · Hobby: Jewelry making = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "craft_kit_club_advisor"
tags = [ "persona-adherence", "multi-check", "podcast-listening", "jewelry-making", "craft-kit-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: podcast-and-pliers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit costs the same and is the same quality, and the companion course covers the same steps in every format; the alternative crafts (weaving, glass fusing, soap making) are ones the persona has no rating on — its Never crafts (pottery, leather, calligraphy) are kept off both sides — and the persona is a digital native, so video and PDF are as easy for it as audio; the picks isolate its jewellery making and its podcast habit.
[[checks]]
dimension_id = "lstyle_podcast_listening"
dimension_label = "Podcast listening"
category = "Interests: Culture"
value = "Daily"
evaluator = "llm-judge"
evaluator_name = "lstyle_podcast_listening=Daily"
adherence_signal = "The companion courses chosen are podcast series (audio episodes to listen along to) rather than the video, PDF and printed formats the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_jewelry_making"
dimension_label = "Hobby: Jewelry making"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_jewelry_making=Avid"
adherence_signal = "The kits chosen are jewellery kits (silver ring-making, stone-setting pendant, wax carving for casting) rather than the weaving, glass-fusing and soap-making kits the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
