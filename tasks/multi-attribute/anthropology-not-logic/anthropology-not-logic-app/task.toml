version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anthropology-not-logic-app"
theme = "Subject: Anthropology = Passionate · Subject: Logic = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "anthropology", "logic", "museum-lates", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: anthropology-not-logic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative talks and seminars are subjects the persona rates neutral; the anthropology side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of anthropology and its distaste for logic.
[[checks]]
dimension_id = "acad_anthropology"
dimension_label = "Subject: Anthropology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_anthropology=Passionate"
adherence_signal = "The talks chosen are anthropology (kinship, rituals, fieldwork stories) rather than the chemistry, economics and astronomy talks the museum pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_logic"
dimension_label = "Subject: Logic"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_logic=Averse"
adherence_signal = "The seminars chosen are the non-logic ones (sociology, geography, music); no logic seminar is booked, even though the museum pushes paradoxes, formal logic and fallacies. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningTalksMuseum (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningTalksMuseum once the desktop is up so the agent finds it on screen.
command = "/opt/eveningtalksmuseum/start-eveningtalksmuseum.sh"
timeout_sec = 60.0
retries = 5
