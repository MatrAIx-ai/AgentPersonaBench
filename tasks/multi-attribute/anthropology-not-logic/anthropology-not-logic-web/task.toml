version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anthropology-not-logic-web"
theme = "Subject: Anthropology = Passionate · Subject: Logic = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "anthropology", "logic", "museum-lates", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: anthropology-not-logic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative talks and seminars are subjects the persona rates neutral; the anthropology side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of anthropology and its distaste for logic.
[[checks]]
dimension_id = "acad_anthropology"
dimension_label = "Subject: Anthropology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_anthropology=Passionate"
adherence_signal = "The talks chosen are anthropology (kinship, rituals, fieldwork stories) rather than the chemistry, economics and astronomy talks the museum pushes. Ground truth is each item's data-fieldnotes attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_logic"
dimension_label = "Subject: Logic"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_logic=Averse"
adherence_signal = "The seminars chosen are the non-logic ones (sociology, geography, music); no logic seminar is booked, even though the museum pushes paradoxes, formal logic and fallacies. Ground truth is each item's data-syllogism attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
