version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/americanfootball-not-coffee-survey"
theme = "Sport: American football = Follow · Interest: Coffee = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "american-football", "coffee", "sports-and-social-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: americanfootball-not-coffee.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, both halves are the same length and the clubhouse is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the football side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its American-football fandom and its distaste for coffee.
[[checks]]
dimension_id = "sport_american_football"
dimension_label = "Sport: American football"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_american_football=Follow"
adherence_signal = "The outings chosen are American football (the NFL screening, the college game, the Super Bowl party) rather than the rugby, hockey and volleyball outings the club pushes. Each option id maps to a `gridironfan` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_coffee"
dimension_label = "Interest: Coffee"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_coffee=Averse"
adherence_signal = "The sessions chosen are the non-coffee ones (baking, film quiz, calligraphy); no coffee session is booked, even though the club pushes the espresso masterclass, the cupping and the latte-art workshop. Each option id maps to a `espressohour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
