version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/americanfootball-not-coffee-chat"
theme = "Sport: American football = Follow · Interest: Coffee = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "club_gridiron_desk"
tags = [ "persona-adherence", "multi-check", "american-football", "coffee", "sports-and-social-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: americanfootball-not-coffee.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, both halves are the same length and the clubhouse is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the football side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its American-football fandom and its distaste for coffee.
[[checks]]
dimension_id = "sport_american_football"
dimension_label = "Sport: American football"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_american_football=Follow"
adherence_signal = "The outings chosen are American football (the NFL screening, the college game, the Super Bowl party) rather than the rugby, hockey and volleyball outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_coffee"
dimension_label = "Interest: Coffee"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_coffee=Averse"
adherence_signal = "The sessions chosen are the non-coffee ones (baking, film quiz, calligraphy); no coffee session is booked, even though the club pushes the espresso masterclass, the cupping and the latte-art workshop. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
