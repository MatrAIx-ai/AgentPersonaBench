version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/squash-not-scones-web"
theme = "Sport: Squash = Play · Interest: Baking = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "squash", "baking", "leisure-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: squash-not-scones.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and everything is indoors (the persona leans indoors, so that cannot choose); the alternative court slots are indoor sports the persona rates neutral and the alternative classes topics it rates neutral — so the picks isolate its squash and its distaste for baking.
[[checks]]
dimension_id = "sport_squash"
dimension_label = "Sport: Squash"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_squash=Play"
adherence_signal = "The court slots chosen are squash (ladder match, coaching hour, club session) rather than the badminton, table-tennis and darts slots the centre pushes. Ground truth is each item's data-squashcourt attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_baking"
dimension_label = "Interest: Baking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_baking=Averse"
adherence_signal = "The classes chosen are the non-baking ones (pottery, board games, film club); no baking class is booked, even though the centre pushes the bread class, the pastry class and cake decorating. Ground truth is each item's data-bakeclass attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
