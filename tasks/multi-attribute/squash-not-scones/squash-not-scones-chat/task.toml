version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/squash-not-scones-chat"
theme = "Sport: Squash = Play · Interest: Baking = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "leisure_centre_bookings"
tags = [ "persona-adherence", "multi-check", "squash", "baking", "leisure-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: squash-not-scones.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and everything is indoors (the persona leans indoors, so that cannot choose); the alternative court slots are indoor sports the persona rates neutral and the alternative classes topics it rates neutral — so the picks isolate its squash and its distaste for baking.
[[checks]]
dimension_id = "sport_squash"
dimension_label = "Sport: Squash"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_squash=Play"
adherence_signal = "The court slots chosen are squash (ladder match, coaching hour, club session) rather than the badminton, table-tennis and darts slots the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_baking"
dimension_label = "Interest: Baking"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_baking=Averse"
adherence_signal = "The classes chosen are the non-baking ones (pottery, board games, film club); no baking class is booked, even though the centre pushes the bread class, the pastry class and cake decorating. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
