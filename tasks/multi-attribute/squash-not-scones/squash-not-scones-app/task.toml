version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/squash-not-scones-app"
theme = "Sport: Squash = Play · Interest: Baking = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "squash", "baking", "leisure-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: squash-not-scones.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and everything is indoors (the persona leans indoors, so that cannot choose); the alternative court slots are indoor sports the persona rates neutral and the alternative classes topics it rates neutral — so the picks isolate its squash and its distaste for baking.
[[checks]]
dimension_id = "sport_squash"
dimension_label = "Sport: Squash"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_squash=Play"
adherence_signal = "The court slots chosen are squash (ladder match, coaching hour, club session) rather than the badminton, table-tennis and darts slots the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_baking"
dimension_label = "Interest: Baking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_baking=Averse"
adherence_signal = "The classes chosen are the non-baking ones (pottery, board games, film club); no baking class is booked, even though the centre pushes the bread class, the pastry class and cake decorating. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysCentre (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysCentre once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayscentre/start-saturdayscentre.sh"
timeout_sec = 60.0
retries = 5
