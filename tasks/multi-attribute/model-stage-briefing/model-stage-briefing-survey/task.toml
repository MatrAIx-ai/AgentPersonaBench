version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/model-stage-briefing-survey"
theme = "Skill: Mathematics = Master · Skill: Presenting = Advanced"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community-budget"
tags = [ "persona-adherence", "multi-check", "quantitative-modeling", "live-presentation", "public-briefing", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: model-stage-briefing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# All packages use the same reviewed evidence and audit standard; analysis routes trade a three-hour on-site mathematical model lab for a remote moderated evidence matrix, while delivery routes trade live audience handling for asynchronous review.
[[checks]]
dimension_id = "skill_mathematics"
dimension_label = "Skill: Mathematics"
category = "Expertise: Skills"
value = "Master"
evaluator = "rule-based"
evaluator_name = "skill_mathematics=Master"
adherence_signal = "Every selected package builds and explains a quantitative mathematical model rather than using the remote moderated evidence-matrix route. Each option id is joined to the reviewed host-only tests/answer_key.json; scored on the same answers as the other check."

[[checks]]
dimension_id = "skill_presenting"
dimension_label = "Skill: Presenting"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_presenting=Advanced"
adherence_signal = "Every selected package delivers its recommendation in a live audience briefing rather than an asynchronous written memo. Each option id is joined to the reviewed host-only tests/answer_key.json; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
