version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/model-stage-briefing-app"
theme = "Skill: Mathematics = Master · Skill: Presenting = Advanced"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community-budget"
tags = [ "persona-adherence", "multi-check", "quantitative-modeling", "live-presentation", "public-briefing", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: model-stage-briefing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# All packages use the same reviewed evidence and audit standard; analysis routes trade a three-hour on-site mathematical model lab for a remote moderated evidence matrix, while delivery routes trade live audience handling for asynchronous review.
[[checks]]
dimension_id = "skill_mathematics"
dimension_label = "Skill: Mathematics"
category = "Expertise: Skills"
value = "Master"
evaluator = "rule-based"
evaluator_name = "skill_mathematics=Master"
adherence_signal = "Every selected package builds and explains a quantitative mathematical model rather than using the remote moderated evidence-matrix route. Visible app ids, names, descriptions, and notes are joined to the reviewed host-only tests/answer_key.json; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "skill_presenting"
dimension_label = "Skill: Presenting"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_presenting=Advanced"
adherence_signal = "Every selected package delivers its recommendation in a live audience briefing rather than an asynchronous written memo. Visible app ids, names, descriptions, and notes are joined to the reviewed host-only tests/answer_key.json; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BriefingPlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BriefingPlanner once the desktop is up so the agent finds it on screen.
command = "/opt/briefingplanner/start-briefingplanner.sh"
timeout_sec = 60.0
retries = 5
