version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/techno-ticket-chat"
theme = "Music: Techno = Love · Interest: Volunteering = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "festival_access_desk"
tags = [ "persona-adherence", "multi-check", "techno", "volunteering", "festival-access", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: techno-ticket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every option costs the same, covers the same hours and is alcohol-free, so the volunteer shift saves nothing; the alternative stages are ones the persona rates neutral — so the picks isolate the persona's own techno and its distaste for volunteering.
[[checks]]
dimension_id = "musg_techno"
dimension_label = "Music: Techno"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_techno=Love"
adherence_signal = "The stages chosen are techno (main techno stage, warehouse tent, sunrise set) rather than the equally good rock, jazz and indie stages the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_volunteering"
dimension_label = "Interest: Volunteering"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_volunteering=Averse"
adherence_signal = "The tickets chosen are standard tickets; no community, crew or helper ticket with a volunteer shift is booked, even though the festival pushes them as the way to be part of it. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
