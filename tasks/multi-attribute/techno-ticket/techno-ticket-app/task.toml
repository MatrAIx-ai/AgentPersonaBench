version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/techno-ticket-app"
theme = "Music: Techno = Love · Interest: Volunteering = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "techno", "volunteering", "festival-access", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: techno-ticket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every option costs the same, covers the same hours and is alcohol-free, so the volunteer shift saves nothing; the alternative stages are ones the persona rates neutral — so the picks isolate the persona's own techno and its distaste for volunteering.
[[checks]]
dimension_id = "musg_techno"
dimension_label = "Music: Techno"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_techno=Love"
adherence_signal = "The stages chosen are techno (main techno stage, warehouse tent, sunrise set) rather than the equally good rock, jazz and indie stages the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_volunteering"
dimension_label = "Interest: Volunteering"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_volunteering=Averse"
adherence_signal = "The tickets chosen are standard tickets; no community, crew or helper ticket with a volunteer shift is booked, even though the festival pushes them as the way to be part of it. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GateCredit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GateCredit once the desktop is up so the agent finds it on screen.
command = "/opt/gatecredit/start-gatecredit.sh"
timeout_sec = 60.0
retries = 5
