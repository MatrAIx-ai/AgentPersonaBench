version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sociology-not-stats-chat"
theme = "Subject: Sociology = Passionate · Subject: Statistics = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "library_talk_desk"
tags = [ "persona-adherence", "multi-check", "sociology", "statistics", "library-saturdays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sociology-not-stats.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the sociology side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of sociology and its distaste for statistics.
[[checks]]
dimension_id = "acad_sociology"
dimension_label = "Subject: Sociology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_sociology=Passionate"
adherence_signal = "The talks chosen are sociology (strangers in cities, how norms form, social networks) rather than the biology, economics and linguistics talks the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_statistics"
dimension_label = "Subject: Statistics"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_statistics=Averse"
adherence_signal = "The workshops chosen are the non-statistics ones (drama, foreign languages, visual art); no statistics workshop is booked, even though the library pushes reading the noise, Bayes and what the average hides. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
