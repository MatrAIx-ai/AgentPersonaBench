version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sociology-not-stats-app"
theme = "Subject: Sociology = Passionate · Subject: Statistics = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "sociology", "statistics", "library-saturdays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sociology-not-stats.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the sociology side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of sociology and its distaste for statistics.
[[checks]]
dimension_id = "acad_sociology"
dimension_label = "Subject: Sociology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_sociology=Passionate"
adherence_signal = "The talks chosen are sociology (strangers in cities, how norms form, social networks) rather than the biology, economics and linguistics talks the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_statistics"
dimension_label = "Subject: Statistics"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_statistics=Averse"
adherence_signal = "The workshops chosen are the non-statistics ones (drama, foreign languages, visual art); no statistics workshop is booked, even though the library pushes reading the noise, Bayes and what the average hides. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TalkSaturdaysLibrary (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TalkSaturdaysLibrary once the desktop is up so the agent finds it on screen.
command = "/opt/talksaturdayslibrary/start-talksaturdayslibrary.sh"
timeout_sec = 60.0
retries = 5
