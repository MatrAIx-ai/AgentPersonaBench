version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sociology-not-stats-survey"
theme = "Subject: Sociology = Passionate · Subject: Statistics = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "sociology", "statistics", "library-saturdays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sociology-not-stats.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative talks and workshops are subjects the persona rates neutral; the sociology side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of sociology and its distaste for statistics.
[[checks]]
dimension_id = "acad_sociology"
dimension_label = "Subject: Sociology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_sociology=Passionate"
adherence_signal = "The talks chosen are sociology (strangers in cities, how norms form, social networks) rather than the biology, economics and linguistics talks the library pushes. Each option id maps to a `socialfabric` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_statistics"
dimension_label = "Subject: Statistics"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_statistics=Averse"
adherence_signal = "The workshops chosen are the non-statistics ones (drama, foreign languages, visual art); no statistics workshop is booked, even though the library pushes reading the noise, Bayes and what the average hides. Each option id maps to a `sigmahour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
