version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/boxing-and-archery-web"
theme = "Sport: Boxing = Follow · Sport: Archery = Follow"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "boxing", "archery", "arena-season-pass", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: boxing-and-archery.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every double-header costs the same and both bills are the same length with tickets and transport included; the alternative afternoons and evenings are sports the persona rates neutral; the boxing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives; the archery side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its boxing fandom and its archery fandom.
[[checks]]
dimension_id = "sport_boxing"
dimension_label = "Sport: Boxing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_boxing=Follow"
adherence_signal = "The late-afternoon events chosen are boxing (the amateur finals from the stands, the title-fight screening, the fight night at the arena) rather than the MMA, wrestling and taekwondo bills the arena pushes. Ground truth is each item's data-ringside attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "sport_archery"
dimension_label = "Sport: Archery"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_archery=Follow"
adherence_signal = "The evening bills chosen are archery (the indoor finals at the arena, the world-cup screening, the national outdoor finals) rather than the fencing, darts and bowling bills the arena pushes. Ground truth is each item's data-target_line attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
