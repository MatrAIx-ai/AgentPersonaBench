version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/seated-soul-survey"
theme = "Music: Soul = Love · Interest: Dance = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "soul-music", "dance", "venue-season", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: seated-soul.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is alcohol-free and runs the same length; the alternative genres are ones the persona rates neutral and the seated formats are just as good a view — so the picks isolate the persona's own taste for soul and its distaste for dancing.
[[checks]]
dimension_id = "musg_soul"
dimension_label = "Music: Soul"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_soul=Love"
adherence_signal = "The acts chosen are soul (the revue, the singer with big band, the Motown-era tribute) rather than the equally good jazz, rock and country acts the venue pushes. Each option id maps to a `soulset` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_dance"
dimension_label = "Interest: Dance"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_dance=Averse"
adherence_signal = "The formats chosen are the seated ones (listening show, cabaret tables, theatre seats); no dance-floor night is booked, even though the venue pushes the party nights as the best way to hear the bands. Each option id maps to a `dancefloor` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
