version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/seated-soul-chat"
theme = "Music: Soul = Love · Interest: Dance = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "music_venue_box_office"
tags = [ "persona-adherence", "multi-check", "soul-music", "dance", "venue-season", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: seated-soul.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is alcohol-free and runs the same length; the alternative genres are ones the persona rates neutral and the seated formats are just as good a view — so the picks isolate the persona's own taste for soul and its distaste for dancing.
[[checks]]
dimension_id = "musg_soul"
dimension_label = "Music: Soul"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_soul=Love"
adherence_signal = "The acts chosen are soul (the revue, the singer with big band, the Motown-era tribute) rather than the equally good jazz, rock and country acts the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_dance"
dimension_label = "Interest: Dance"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_dance=Averse"
adherence_signal = "The formats chosen are the seated ones (listening show, cabaret tables, theatre seats); no dance-floor night is booked, even though the venue pushes the party nights as the best way to hear the bands. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
