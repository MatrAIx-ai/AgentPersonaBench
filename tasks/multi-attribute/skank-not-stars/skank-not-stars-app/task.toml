version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skank-not-stars-app"
theme = "Music: Ska = Love · Interest: Astronomy = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "ska", "astronomy", "friday-doubles", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skank-not-stars.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and the venue is alcohol-free (the persona drinks none); the alternative gigs are genres the persona rates neutral and the alternative late sessions topics it rates neutral — so the picks isolate its taste for ska and its distaste for astronomy.
[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_ska=Love"
adherence_signal = "The gigs chosen are ska (the ska band, the two-tone night, the ska DJ) rather than the blues, indie and techno gigs the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_astronomy"
dimension_label = "Interest: Astronomy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_astronomy=Averse"
adherence_signal = "The late sessions chosen are the non-astronomy ones (the film quiz, the magic show, the one-act drama); no astronomy session is booked, even though the venue pushes the planetarium, the telescope night and the meteor talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with AfterAndGig (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch AfterAndGig once the desktop is up so the agent finds it on screen.
command = "/opt/afterandgig/start-afterandgig.sh"
timeout_sec = 60.0
retries = 5
