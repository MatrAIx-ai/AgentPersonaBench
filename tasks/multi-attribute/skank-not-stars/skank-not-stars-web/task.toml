version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skank-not-stars-web"
theme = "Music: Ska = Love · Interest: Astronomy = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "ska", "astronomy", "friday-doubles", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skank-not-stars.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and the venue is alcohol-free (the persona drinks none); the alternative gigs are genres the persona rates neutral and the alternative late sessions topics it rates neutral — so the picks isolate its taste for ska and its distaste for astronomy.
[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_ska=Love"
adherence_signal = "The gigs chosen are ska (the ska band, the two-tone night, the ska DJ) rather than the blues, indie and techno gigs the venue pushes. Ground truth is each item's data-upstroke attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_astronomy"
dimension_label = "Interest: Astronomy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_astronomy=Averse"
adherence_signal = "The late sessions chosen are the non-astronomy ones (the film quiz, the magic show, the one-act drama); no astronomy session is booked, even though the venue pushes the planetarium, the telescope night and the meteor talk. Ground truth is each item's data-stargaze attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
