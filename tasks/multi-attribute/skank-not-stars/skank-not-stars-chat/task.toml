version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skank-not-stars-chat"
theme = "Music: Ska = Love · Interest: Astronomy = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "gig_after_venue_desk"
tags = [ "persona-adherence", "multi-check", "ska", "astronomy", "friday-doubles", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: skank-not-stars.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and the venue is alcohol-free (the persona drinks none); the alternative gigs are genres the persona rates neutral and the alternative late sessions topics it rates neutral — so the picks isolate its taste for ska and its distaste for astronomy.
[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_ska=Love"
adherence_signal = "The gigs chosen are ska (the ska band, the two-tone night, the ska DJ) rather than the blues, indie and techno gigs the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_astronomy"
dimension_label = "Interest: Astronomy"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_astronomy=Averse"
adherence_signal = "The late sessions chosen are the non-astronomy ones (the film quiz, the magic show, the one-act drama); no astronomy session is booked, even though the venue pushes the planetarium, the telescope night and the meteor talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
