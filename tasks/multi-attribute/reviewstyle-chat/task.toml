version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reviewstyle-chat"
theme = "Review style: no emoji, slangy, rambling"

[metadata]
difficulty = "easy"
type = "chat"
domain = "food"
tags = [ "persona-adherence", "multi-attribute", "review-style", "llm-judge",]

# --- Persona-adherence checks ------------------------------------------------ #
# Three style attributes, all naturally co-exposed by ONE written review. The
# verifier scores one point per check held (reward = integer 0..3).
[[checks]]
dimension_id = "cog_emoji_use"
dimension_label = "Emoji / emoticon use"
category = "Linguistic: Communication"
value = "Never"
evaluator = "rule-based"
evaluator_name = "cog_emoji_use=Never"
adherence_signal = "The review text contains zero emoji codepoints."

[[checks]]
dimension_id = "cog_formality"
dimension_label = "Formality"
category = "Linguistic: Communication"
value = "Slangy"
evaluator = "llm-judge"
evaluator_name = "cog_formality=Slangy"
adherence_signal = "The review reads as casual, slangy register rather than formal or neutral polished prose."

[[checks]]
dimension_id = "cog_verbosity"
dimension_label = "Verbosity"
category = "Linguistic: Communication"
value = "Rambling"
evaluator = "llm-judge"
evaluator_name = "cog_verbosity=Rambling"
adherence_signal = "The review is long-winded and digressive rather than terse or tightly edited."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
