version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-spin-no-romance-chat"
theme = "Interest: Cycling = Averse · Film: Romance = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "leisure_centre_screen_desk"
tags = [ "persona-adherence", "multi-check", "cycling", "romance-film", "leisure-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-spin-no-romance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its distaste for cycling and its distaste for romance films.
[[checks]]
dimension_id = "topic_cycling"
dimension_label = "Interest: Cycling"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_cycling=Averse"
adherence_signal = "The sessions chosen are the non-cycling ones (hiking, photography, running); no cycling session is booked, even though the centre pushes the spin class, the group ride and the maintenance workshop. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_romance"
dimension_label = "Film: Romance"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_romance=Dislike"
adherence_signal = "The films chosen are the non-romances (the western, the heist film, the musical); no romance is booked, even though the centre pushes the wedding-season romance, the second-chance romance and the holiday romance. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
