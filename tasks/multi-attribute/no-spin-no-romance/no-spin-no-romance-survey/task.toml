version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-spin-no-romance-survey"
theme = "Interest: Cycling = Averse · Film: Romance = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "cycling", "romance-film", "leisure-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-spin-no-romance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its distaste for cycling and its distaste for romance films.
[[checks]]
dimension_id = "topic_cycling"
dimension_label = "Interest: Cycling"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cycling=Averse"
adherence_signal = "The sessions chosen are the non-cycling ones (hiking, photography, running); no cycling session is booked, even though the centre pushes the spin class, the group ride and the maintenance workshop. Each option id maps to a `pedal` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_romance"
dimension_label = "Film: Romance"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_romance=Dislike"
adherence_signal = "The films chosen are the non-romances (the western, the heist film, the musical); no romance is booked, even though the centre pushes the wedding-season romance, the second-chance romance and the holiday romance. Each option id maps to a `meetcute` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
