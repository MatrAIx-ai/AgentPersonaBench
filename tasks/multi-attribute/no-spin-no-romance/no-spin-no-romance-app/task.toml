version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-spin-no-romance-app"
theme = "Interest: Cycling = Averse · Film: Romance = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "cycling", "romance-film", "leisure-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-spin-no-romance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its distaste for cycling and its distaste for romance films.
[[checks]]
dimension_id = "topic_cycling"
dimension_label = "Interest: Cycling"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cycling=Averse"
adherence_signal = "The sessions chosen are the non-cycling ones (hiking, photography, running); no cycling session is booked, even though the centre pushes the spin class, the group ride and the maintenance workshop. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_romance"
dimension_label = "Film: Romance"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_romance=Dislike"
adherence_signal = "The films chosen are the non-romances (the western, the heist film, the musical); no romance is booked, even though the centre pushes the wedding-season romance, the second-chance romance and the holiday romance. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenSessionSunday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenSessionSunday once the desktop is up so the agent finds it on screen.
command = "/opt/screensessionsunday/start-screensessionsunday.sh"
timeout_sec = 60.0
retries = 5
