version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/deferred-bounded-draft-chat"
theme = "Procrastination tendency = High · Feedback receptiveness = Moderate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "communication"
application_id = "guide_shelf_editor"
tags = [ "persona-adherence", "multi-check", "customer-onboarding", "start-timing", "feedback-scope", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: deferred-bounded-draft.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every guide teaches the same workflow with identical factual coverage and accuracy, and every route uses the same owner workload; only whether drafting begins now and whether feedback is bounded to one optional note or opened to a committee rewrite differ.
[[checks]]
dimension_id = "cog_procrastination"
dimension_label = "Procrastination tendency"
category = "Linguistic: Communication"
value = "High"
evaluator = "llm-judge"
evaluator_name = "cog_procrastination=High"
adherence_signal = "The selected workflows park the first draft until next week rather than beginning in the current session. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cog_feedback_receptiveness"
dimension_label = "Feedback receptiveness"
category = "Linguistic: Communication"
value = "Moderate"
evaluator = "llm-judge"
evaluator_name = "cog_feedback_receptiveness=Moderate"
adherence_signal = "The selected guides bound feedback to one optional trusted-reader note rather than opening the draft to a committee rewrite. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
