version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/deferred-bounded-draft-app"
theme = "Procrastination tendency = High · Feedback receptiveness = Moderate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "communication"
tags = [ "persona-adherence", "multi-check", "customer-onboarding", "start-timing", "feedback-scope", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: deferred-bounded-draft.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every guide teaches the same workflow with identical factual coverage and accuracy, and every route uses the same owner workload; only whether drafting begins now and whether feedback is bounded to one optional note or opened to a committee rewrite differ.
[[checks]]
dimension_id = "cog_procrastination"
dimension_label = "Procrastination tendency"
category = "Linguistic: Communication"
value = "High"
evaluator = "rule-based"
evaluator_name = "cog_procrastination=High"
adherence_signal = "The selected workflows park the first draft until next week rather than beginning in the current session. Submitted ID/name pairs are bound to the real app catalog, then evaluated with the host-only answer key; the app writes the artifact after real clicks."

[[checks]]
dimension_id = "cog_feedback_receptiveness"
dimension_label = "Feedback receptiveness"
category = "Linguistic: Communication"
value = "Moderate"
evaluator = "rule-based"
evaluator_name = "cog_feedback_receptiveness=Moderate"
adherence_signal = "The selected guides bound feedback to one optional trusted-reader note rather than opening the draft to a committee rewrite. Submitted ID/name pairs are bound to the real app catalog, then evaluated with the host-only answer key; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GuidePicker (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GuidePicker once the desktop is up so the agent finds it on screen.
command = "/opt/guidepicker/start-guidepicker.sh"
timeout_sec = 60.0
retries = 5
