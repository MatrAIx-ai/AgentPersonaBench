version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/deferred-bounded-draft-survey"
theme = "Procrastination tendency = High · Feedback receptiveness = Moderate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "communication"
tags = [ "persona-adherence", "multi-check", "customer-onboarding", "start-timing", "feedback-scope", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: deferred-bounded-draft.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every guide teaches the same workflow with identical factual coverage and accuracy, and every route uses the same owner workload; only whether drafting begins now and whether feedback is bounded to one optional note or opened to a committee rewrite differ.
[[checks]]
dimension_id = "cog_procrastination"
dimension_label = "Procrastination tendency"
category = "Linguistic: Communication"
value = "High"
evaluator = "rule-based"
evaluator_name = "cog_procrastination=High"
adherence_signal = "The selected workflows park the first draft until next week rather than beginning in the current session. Each option id maps to a `deferredstart` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cog_feedback_receptiveness"
dimension_label = "Feedback receptiveness"
category = "Linguistic: Communication"
value = "Moderate"
evaluator = "rule-based"
evaluator_name = "cog_feedback_receptiveness=Moderate"
adherence_signal = "The selected guides bound feedback to one optional trusted-reader note rather than opening the draft to a committee rewrite. Each option id maps to a `revisable` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
