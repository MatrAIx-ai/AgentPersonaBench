version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/psychology-not-geology-survey"
theme = "Subject: Psychology = Passionate · Subject: Earth science = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "psychology", "earth-science", "adult-education", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: psychology-not-geology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the psychology side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of psychology and its distaste for earth science.
[[checks]]
dimension_id = "acad_psychology"
dimension_label = "Subject: Psychology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_psychology=Passionate"
adherence_signal = "The lectures chosen are psychology (memory, cognitive biases, habit) rather than the statistics, sociology and chemistry lectures the college pushes. Each option id maps to a `inkblot` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_earth_science"
dimension_label = "Subject: Earth science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_earth_science=Averse"
adherence_signal = "The workshops chosen are the non-earth-science ones (literature, origami, logic); no earth-science workshop is booked, even though the college pushes tectonics, rock strata and volcanoes. Each option id maps to a `rockhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
