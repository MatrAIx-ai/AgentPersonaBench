version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/psychology-not-geology-app"
theme = "Subject: Psychology = Passionate · Subject: Earth science = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "psychology", "earth-science", "adult-education", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: psychology-not-geology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the psychology side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of psychology and its distaste for earth science.
[[checks]]
dimension_id = "acad_psychology"
dimension_label = "Subject: Psychology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_psychology=Passionate"
adherence_signal = "The lectures chosen are psychology (memory, cognitive biases, habit) rather than the statistics, sociology and chemistry lectures the college pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_earth_science"
dimension_label = "Subject: Earth science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_earth_science=Averse"
adherence_signal = "The workshops chosen are the non-earth-science ones (literature, origami, logic); no earth-science workshop is booked, even though the college pushes tectonics, rock strata and volcanoes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CollegePairsEvening (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CollegePairsEvening once the desktop is up so the agent finds it on screen.
command = "/opt/collegepairsevening/start-collegepairsevening.sh"
timeout_sec = 60.0
retries = 5
