version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/psychology-not-geology-chat"
theme = "Subject: Psychology = Passionate · Subject: Earth science = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "adult_education_office"
tags = [ "persona-adherence", "multi-check", "psychology", "earth-science", "adult-education", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: psychology-not-geology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the psychology side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of psychology and its distaste for earth science.
[[checks]]
dimension_id = "acad_psychology"
dimension_label = "Subject: Psychology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_psychology=Passionate"
adherence_signal = "The lectures chosen are psychology (memory, cognitive biases, habit) rather than the statistics, sociology and chemistry lectures the college pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_earth_science"
dimension_label = "Subject: Earth science"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_earth_science=Averse"
adherence_signal = "The workshops chosen are the non-earth-science ones (literature, origami, logic); no earth-science workshop is booked, even though the college pushes tectonics, rock strata and volcanoes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
