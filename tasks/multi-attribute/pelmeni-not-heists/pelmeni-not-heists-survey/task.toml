version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pelmeni-not-heists-survey"
theme = "Cuisine: Russian = Love · Film: Crime = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "multi-check", "russian-cuisine", "crime-film", "dinner-and-a-movie", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pelmeni-not-heists.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the non-Russian suppers are cuisines the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for Russian food and its distaste for crime films.
[[checks]]
dimension_id = "cuis_russian"
dimension_label = "Cuisine: Russian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_russian=Love"
adherence_signal = "The suppers chosen are Russian (pelmeni, stroganoff, borscht and blini) rather than the Greek, Cantonese and Indian plates the cinema pushes. Each option id maps to a `pelmeni` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_crime"
dimension_label = "Film: Crime"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_crime=Dislike"
adherence_signal = "The films chosen are the non-crime ones (the comedy, the musical, the biopic); no crime film is booked, even though the cinema pushes the mob saga, the heist film and the procedural. Each option id maps to a `heistreel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
