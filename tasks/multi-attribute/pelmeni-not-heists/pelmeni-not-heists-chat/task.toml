version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pelmeni-not-heists-chat"
theme = "Cuisine: Russian = Love · Film: Crime = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "cinema_supper_desk"
tags = [ "persona-adherence", "multi-check", "russian-cuisine", "crime-film", "dinner-and-a-movie", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pelmeni-not-heists.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the non-Russian suppers are cuisines the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for Russian food and its distaste for crime films.
[[checks]]
dimension_id = "cuis_russian"
dimension_label = "Cuisine: Russian"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_russian=Love"
adherence_signal = "The suppers chosen are Russian (pelmeni, stroganoff, borscht and blini) rather than the Greek, Cantonese and Indian plates the cinema pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_crime"
dimension_label = "Film: Crime"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_crime=Dislike"
adherence_signal = "The films chosen are the non-crime ones (the comedy, the musical, the biopic); no crime film is booked, even though the cinema pushes the mob saga, the heist film and the procedural. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
