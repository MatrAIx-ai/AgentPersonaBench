version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pelmeni-not-heists-app"
theme = "Cuisine: Russian = Love · Film: Crime = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "russian-cuisine", "crime-film", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pelmeni-not-heists.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the non-Russian suppers are cuisines the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its taste for Russian food and its distaste for crime films.
[[checks]]
dimension_id = "cuis_russian"
dimension_label = "Cuisine: Russian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_russian=Love"
adherence_signal = "The suppers chosen are Russian (pelmeni, stroganoff, borscht and blini) rather than the Greek, Cantonese and Indian plates the cinema pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_crime"
dimension_label = "Film: Crime"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_crime=Dislike"
adherence_signal = "The films chosen are the non-crime ones (the comedy, the musical, the biopic); no crime film is booked, even though the cinema pushes the mob saga, the heist film and the procedural. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightsSupperScreen (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightsSupperScreen once the desktop is up so the agent finds it on screen.
command = "/opt/nightssupperscreen/start-nightssupperscreen.sh"
timeout_sec = 60.0
retries = 5
