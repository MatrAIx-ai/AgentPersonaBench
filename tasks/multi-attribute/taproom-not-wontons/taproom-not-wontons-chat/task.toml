version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taproom-not-wontons-chat"
theme = "Interest: Craft beer = Passionate · Cuisine: Cantonese = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "tasting_venue_desk"
tags = [ "persona-adherence", "multi-check", "craft-beer", "cantonese-cuisine", "tasting-and-supper", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: taproom-not-wontons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every supper is pescatarian (the persona eats no meat, so diet is never the reason); the alternative sessions are topics the persona rates neutral and the non-Cantonese suppers cuisines it rates neutral — so the picks isolate its craft beer and its distaste for Cantonese food.
[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_craft_beer=Passionate"
adherence_signal = "The sessions chosen are craft beer (the tasting flight, the brewery tour, the pairing masterclass) rather than the coffee, tea and magic sessions the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_cantonese"
dimension_label = "Cuisine: Cantonese"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_cantonese=Avoid"
adherence_signal = "The suppers chosen are the non-Cantonese ones (Thai, Mexican, Japanese); no Cantonese supper is booked, even though the venue pushes the steamed sea bass, the salt-and-pepper tofu and the har gow. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
