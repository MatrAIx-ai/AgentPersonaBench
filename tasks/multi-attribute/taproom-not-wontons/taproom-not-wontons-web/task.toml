version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taproom-not-wontons-web"
theme = "Interest: Craft beer = Passionate · Cuisine: Cantonese = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "craft-beer", "cantonese-cuisine", "tasting-and-supper", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: taproom-not-wontons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every supper is pescatarian (the persona eats no meat, so diet is never the reason); the alternative sessions are topics the persona rates neutral and the non-Cantonese suppers cuisines it rates neutral — so the picks isolate its craft beer and its distaste for Cantonese food.
[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_craft_beer=Passionate"
adherence_signal = "The sessions chosen are craft beer (the tasting flight, the brewery tour, the pairing masterclass) rather than the coffee, tea and magic sessions the venue pushes. Ground truth is each item's data-taproom attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_cantonese"
dimension_label = "Cuisine: Cantonese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_cantonese=Avoid"
adherence_signal = "The suppers chosen are the non-Cantonese ones (Thai, Mexican, Japanese); no Cantonese supper is booked, even though the venue pushes the steamed sea bass, the salt-and-pepper tofu and the har gow. Ground truth is each item's data-dimsum attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
