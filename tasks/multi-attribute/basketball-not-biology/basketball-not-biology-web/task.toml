version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/basketball-not-biology-web"
theme = "Sport: Basketball = Follow · Subject: Biology = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "basketball", "biology", "sports-and-learning-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: basketball-not-biology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the basketball side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its basketball fandom and its distaste for biology.
[[checks]]
dimension_id = "sport_basketball"
dimension_label = "Sport: Basketball"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_basketball=Follow"
adherence_signal = "The outings chosen are basketball (the courtside game, the playoff screening, the college final) rather than the soccer, tennis and rugby outings the club pushes. Ground truth is each item's data-courtside attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_biology"
dimension_label = "Subject: Biology"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_biology=Averse"
adherence_signal = "The talks chosen are the non-biology ones (economics, geography, logic); no biology talk is booked, even though the club pushes cells, evolution and the microbiome. Ground truth is each item's data-celltalk attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
