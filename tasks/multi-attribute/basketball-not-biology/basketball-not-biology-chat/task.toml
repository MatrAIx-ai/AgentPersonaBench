version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/basketball-not-biology-chat"
theme = "Sport: Basketball = Follow · Subject: Biology = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "club_sunday_desk"
tags = [ "persona-adherence", "multi-check", "basketball", "biology", "sports-and-learning-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: basketball-not-biology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the basketball side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its basketball fandom and its distaste for biology.
[[checks]]
dimension_id = "sport_basketball"
dimension_label = "Sport: Basketball"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_basketball=Follow"
adherence_signal = "The outings chosen are basketball (the courtside game, the playoff screening, the college final) rather than the soccer, tennis and rugby outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_biology"
dimension_label = "Subject: Biology"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_biology=Averse"
adherence_signal = "The talks chosen are the non-biology ones (economics, geography, logic); no biology talk is booked, even though the club pushes cells, evolution and the microbiome. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
