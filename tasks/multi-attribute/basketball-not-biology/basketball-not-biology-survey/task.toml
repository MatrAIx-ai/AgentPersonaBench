version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/basketball-not-biology-survey"
theme = "Sport: Basketball = Follow · Subject: Biology = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "basketball", "biology", "sports-and-learning-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: basketball-not-biology.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the basketball side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its basketball fandom and its distaste for biology.
[[checks]]
dimension_id = "sport_basketball"
dimension_label = "Sport: Basketball"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_basketball=Follow"
adherence_signal = "The outings chosen are basketball (the courtside game, the playoff screening, the college final) rather than the soccer, tennis and rugby outings the club pushes. Each option id maps to a `courtside` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_biology"
dimension_label = "Subject: Biology"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_biology=Averse"
adherence_signal = "The talks chosen are the non-biology ones (economics, geography, logic); no biology talk is booked, even though the club pushes cells, evolution and the microbiome. Each option id maps to a `celltalk` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
