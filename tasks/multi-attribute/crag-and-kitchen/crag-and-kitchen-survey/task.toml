version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crag-and-kitchen-survey"
theme = "Sport: Climbing = Play · Cooking frequency = Rarely"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "climbing", "cooking-frequency", "adventure-weekend", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crag-and-kitchen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Both activity sides are outdoors, active and rated the same; both meal sides are plant-based and included in the pass, differing only in whether the guest cooks — so the packages isolate the persona's own climbing and its habit of not cooking.
[[checks]]
dimension_id = "sport_climbing"
dimension_label = "Sport: Climbing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_climbing=Play"
adherence_signal = "The Saturday packages are built around climbing sessions (crag morning, multi-pitch day, sport-climbing clinic) rather than the equally outdoor kayak, hike and bike alternatives the operator pushes. Each option id maps to a `crag` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Rarely"
evaluator = "rule-based"
evaluator_name = "lstyle_cooking_freq=Rarely"
adherence_signal = "The evening meals chosen are the chef-prepared, ready-to-heat options; no cook-your-own kit is booked, even though the operator pushes the camp-cooking kits as the highlight. Each option id maps to a `cookit` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
