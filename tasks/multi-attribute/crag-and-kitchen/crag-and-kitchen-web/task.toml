version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crag-and-kitchen-web"
theme = "Sport: Climbing = Play · Cooking frequency = Rarely"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "climbing", "cooking-frequency", "adventure-weekend", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crag-and-kitchen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Both activity sides are outdoors, active and rated the same; both meal sides are plant-based and included in the pass, differing only in whether the guest cooks — so the packages isolate the persona's own climbing and its habit of not cooking.
[[checks]]
dimension_id = "sport_climbing"
dimension_label = "Sport: Climbing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_climbing=Play"
adherence_signal = "The Saturday packages are built around climbing sessions (crag morning, multi-pitch day, sport-climbing clinic) rather than the equally outdoor kayak, hike and bike alternatives the operator pushes. Ground truth is each item's data-crag attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Rarely"
evaluator = "rule-based"
evaluator_name = "lstyle_cooking_freq=Rarely"
adherence_signal = "The evening meals chosen are the chef-prepared, ready-to-heat options; no cook-your-own kit is booked, even though the operator pushes the camp-cooking kits as the highlight. Ground truth is each item's data-cookit attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
