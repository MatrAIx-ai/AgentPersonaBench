version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crag-and-kitchen-chat"
theme = "Sport: Climbing = Play · Cooking frequency = Rarely"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "adventure_operator_desk"
tags = [ "persona-adherence", "multi-check", "climbing", "cooking-frequency", "adventure-weekend", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crag-and-kitchen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Both activity sides are outdoors, active and rated the same; both meal sides are plant-based and included in the pass, differing only in whether the guest cooks — so the packages isolate the persona's own climbing and its habit of not cooking.
[[checks]]
dimension_id = "sport_climbing"
dimension_label = "Sport: Climbing"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_climbing=Play"
adherence_signal = "The Saturday packages are built around climbing sessions (crag morning, multi-pitch day, sport-climbing clinic) rather than the equally outdoor kayak, hike and bike alternatives the operator pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Rarely"
evaluator = "llm-judge"
evaluator_name = "lstyle_cooking_freq=Rarely"
adherence_signal = "The evening meals chosen are the chef-prepared, ready-to-heat options; no cook-your-own kit is booked, even though the operator pushes the camp-cooking kits as the highlight. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
