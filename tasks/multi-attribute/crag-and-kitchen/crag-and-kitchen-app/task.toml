version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crag-and-kitchen-app"
theme = "Sport: Climbing = Play · Cooking frequency = Rarely"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "climbing", "cooking-frequency", "adventure-weekend", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crag-and-kitchen.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Both activity sides are outdoors, active and rated the same; both meal sides are plant-based and included in the pass, differing only in whether the guest cooks — so the packages isolate the persona's own climbing and its habit of not cooking.
[[checks]]
dimension_id = "sport_climbing"
dimension_label = "Sport: Climbing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_climbing=Play"
adherence_signal = "The Saturday packages are built around climbing sessions (crag morning, multi-pitch day, sport-climbing clinic) rather than the equally outdoor kayak, hike and bike alternatives the operator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Rarely"
evaluator = "rule-based"
evaluator_name = "lstyle_cooking_freq=Rarely"
adherence_signal = "The evening meals chosen are the chef-prepared, ready-to-heat options; no cook-your-own kit is booked, even though the operator pushes the camp-cooking kits as the highlight. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PeakPlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PeakPlanner once the desktop is up so the agent finds it on screen.
command = "/opt/peakplanner/start-peakplanner.sh"
timeout_sec = 60.0
retries = 5
