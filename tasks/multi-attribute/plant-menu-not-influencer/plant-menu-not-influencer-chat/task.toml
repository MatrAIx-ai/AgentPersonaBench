version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/plant-menu-not-influencer-chat"
theme = "Attitude: Veganism = Enthusiast · Attitude: Influencers = Opposed"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "ready_meal_service_desk"
tags = [ "persona-adherence", "multi-check", "veganism", "influencers", "ready-meal-plans", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: plant-menu-not-influencer.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every weekly plan costs the same with the same portions and nothing has to be cooked; the cuisines of the plant-based weeks (Thai, Ethiopian, Vietnamese) are ones the persona rates neutral, and the chicken menus carry no cuisine label; the plant-based weeks arrive in a fixed early-morning slot that someone must sign for while the chicken menus arrive in a chosen slot and are left in a cool box, and the chef-written menus are fixed for the week while the influencer-curated ones allow swaps in the app, so a chooser with no stake in either trait takes an influencer-curated chicken week — so the picks isolate the persona's appetite for plant-based eating and its refusal to follow an influencer's picks.
[[checks]]
dimension_id = "att_veganism"
dimension_label = "Attitude: Veganism"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "llm-judge"
evaluator_name = "att_veganism=Enthusiast"
adherence_signal = "The plans chosen are the plant-based menus (Thai, Ethiopian, Vietnamese) rather than the chicken-and-vegetable menus the service pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "att_influencers"
dimension_label = "Attitude: Influencers"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "llm-judge"
evaluator_name = "att_influencers=Opposed"
adherence_signal = "The plans chosen are the chef-written ones; no influencer-curated menu is booked, even though the service pushes its influencer's picks. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
