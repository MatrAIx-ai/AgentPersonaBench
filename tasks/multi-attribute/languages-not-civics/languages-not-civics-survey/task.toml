version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/languages-not-civics-survey"
theme = "Subject: Foreign languages = Passionate · Subject: Civics = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "foreign-languages", "civics", "community-college", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: languages-not-civics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every weekend costs the same and both halves are the same length; the alternative classes and seminars are subjects the persona rates neutral; the languages side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of languages and its distaste for civics.
[[checks]]
dimension_id = "acad_foreign_languages"
dimension_label = "Subject: Foreign languages"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_foreign_languages=Passionate"
adherence_signal = "The classes chosen are foreign languages (Spanish conversation, how languages borrow words, Italian for travellers) rather than the algebra, biology and statistics classes the college pushes. Each option id maps to a `phrasebook` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_civics"
dimension_label = "Subject: Civics"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_civics=Averse"
adherence_signal = "The seminars chosen are the non-civics ones (economics, visual art, logic); no civics seminar is booked, even though the college pushes bill to law, local councils and citizenship. Each option id maps to a `councilhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
