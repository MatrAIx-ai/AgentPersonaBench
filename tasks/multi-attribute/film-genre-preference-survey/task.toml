version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/film-genre-preference-survey"
theme = "Film genre preferences: Love comedy and dislike horror"

[metadata]
difficulty = "medium"
type = "survey"
domain = "entertainment"
tags = ["persona-adherence", "multi-check", "film", "survey", "rule-based"]

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_comedy=Love"
metric = "humorous_story_choices"
adherence_signal = "The persona actively includes at least one humor-led story across four independent movie-night selections."

[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_horror=Dislike"
metric = "fear_story_choices"
adherence_signal = "The persona does not select any story centered on menace, dread, or supernatural threat."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
