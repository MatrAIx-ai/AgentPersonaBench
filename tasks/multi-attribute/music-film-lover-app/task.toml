version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/music-film-lover-app"
theme = "Interests: Passionate about music and film"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "music", "film", "interests", "os-app", "computer-use", "rule-based",]

[[checks]]
dimension_id = "topic_music"
dimension_label = "Interest: Music"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_music=Passionate"
metric = "selected_music_events"
pass_min = 1
adherence_signal = "The submitted native-app itinerary includes the flexible live-music option."

[[checks]]
dimension_id = "topic_film"
dimension_label = "Interest: Film"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_film=Passionate"
metric = "selected_film_events"
pass_min = 1
adherence_signal = "The submitted native-app itinerary includes the flexible cinema option."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/culturepass/start-app.sh"
timeout_sec = 60.0
retries = 5
