version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/injera-not-iambs-app"
theme = "Cuisine: Ethiopian = Love · Interest: Poetry = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ethiopian", "poetry", "supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: injera-not-iambs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is vegetarian and alcohol-free (the persona is vegetarian and drinks none) and everything is indoors; the non-Ethiopian suppers are cuisines the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for Ethiopian food and its distaste for poetry.
[[checks]]
dimension_id = "cuis_ethiopian"
dimension_label = "Cuisine: Ethiopian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_ethiopian=Love"
adherence_signal = "The suppers chosen are Ethiopian (the beyaynetu platter, shiro with injera, misir wot and gomen) rather than the Thai, Italian and Lebanese suppers the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_poetry"
dimension_label = "Interest: Poetry"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_poetry=Averse"
adherence_signal = "The sessions chosen are the non-poetry ones (the film quiz, the magic show, the history talk); no poetry session is booked, even though the club pushes the reading, the open mic and the writing circle. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with AfterSupper (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch AfterSupper once the desktop is up so the agent finds it on screen.
command = "/opt/aftersupper/start-aftersupper.sh"
timeout_sec = 60.0
retries = 5
