version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/injera-not-iambs-chat"
theme = "Cuisine: Ethiopian = Love · Interest: Poetry = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "supper_session_club_host"
tags = [ "persona-adherence", "multi-check", "ethiopian", "poetry", "supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: injera-not-iambs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is vegetarian and alcohol-free (the persona is vegetarian and drinks none) and everything is indoors; the non-Ethiopian suppers are cuisines the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for Ethiopian food and its distaste for poetry.
[[checks]]
dimension_id = "cuis_ethiopian"
dimension_label = "Cuisine: Ethiopian"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_ethiopian=Love"
adherence_signal = "The suppers chosen are Ethiopian (the beyaynetu platter, shiro with injera, misir wot and gomen) rather than the Thai, Italian and Lebanese suppers the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_poetry"
dimension_label = "Interest: Poetry"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_poetry=Averse"
adherence_signal = "The sessions chosen are the non-poetry ones (the film quiz, the magic show, the history talk); no poetry session is booked, even though the club pushes the reading, the open mic and the writing circle. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
