version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/transitions-not-anime-web"
theme = "Sport: Triathlon = Play · Interest: Anime = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "triathlon", "anime", "leisure-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: transitions-not-anime.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative mornings are sports the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its triathlon training and its distaste for anime.
[[checks]]
dimension_id = "sport_triathlon"
dimension_label = "Sport: Triathlon"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_triathlon=Play"
adherence_signal = "The mornings chosen are triathlon (the brick session, the swim-and-transition practice, the sprint time trial) rather than the tennis, badminton and rowing sessions the centre pushes. Ground truth is each item's data-transition attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_anime"
dimension_label = "Interest: Anime"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_anime=Averse"
adherence_signal = "The afternoons chosen are the non-anime ones (the classic film, board games, magic); no anime session is booked, even though the centre pushes the anime film, the series marathon and the anime club. Ground truth is each item's data-animeroom attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
