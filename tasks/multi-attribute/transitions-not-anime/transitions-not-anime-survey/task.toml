version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/transitions-not-anime-survey"
theme = "Sport: Triathlon = Play · Interest: Anime = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "triathlon", "anime", "leisure-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: transitions-not-anime.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative mornings are sports the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its triathlon training and its distaste for anime.
[[checks]]
dimension_id = "sport_triathlon"
dimension_label = "Sport: Triathlon"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_triathlon=Play"
adherence_signal = "The mornings chosen are triathlon (the brick session, the swim-and-transition practice, the sprint time trial) rather than the tennis, badminton and rowing sessions the centre pushes. Each option id maps to a `transition` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_anime"
dimension_label = "Interest: Anime"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_anime=Averse"
adherence_signal = "The afternoons chosen are the non-anime ones (the classic film, board games, magic); no anime session is booked, even though the centre pushes the anime film, the series marathon and the anime club. Each option id maps to a `animeroom` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
