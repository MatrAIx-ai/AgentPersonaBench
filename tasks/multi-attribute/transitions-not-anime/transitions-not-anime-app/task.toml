version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/transitions-not-anime-app"
theme = "Sport: Triathlon = Play · Interest: Anime = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "triathlon", "anime", "leisure-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: transitions-not-anime.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative mornings are sports the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its triathlon training and its distaste for anime.
[[checks]]
dimension_id = "sport_triathlon"
dimension_label = "Sport: Triathlon"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_triathlon=Play"
adherence_signal = "The mornings chosen are triathlon (the brick session, the swim-and-transition practice, the sprint time trial) rather than the tennis, badminton and rowing sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_anime"
dimension_label = "Interest: Anime"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_anime=Averse"
adherence_signal = "The afternoons chosen are the non-anime ones (the classic film, board games, magic); no anime session is booked, even though the centre pushes the anime film, the series marathon and the anime club. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CentreBundlesSunday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CentreBundlesSunday once the desktop is up so the agent finds it on screen.
command = "/opt/centrebundlessunday/start-centrebundlessunday.sh"
timeout_sec = 60.0
retries = 5
