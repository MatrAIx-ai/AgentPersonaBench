version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pistes-not-lofi-web"
theme = "Sport: Skiing = Play · Music: Lo-fi = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "skiing", "lo-fi", "mountain-resort", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pistes-not-lofi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and kit is provided; the alternative activities are sports the persona rates neutral and the alternative lounge sets genres it rates neutral — so the picks isolate its skiing and its distaste for lo-fi.
[[checks]]
dimension_id = "sport_skiing"
dimension_label = "Sport: Skiing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_skiing=Play"
adherence_signal = "The activities chosen are skiing (the guided piste morning, the lesson, the first-lift powder run) rather than the swimming, badminton and table-tennis sessions the resort pushes. Ground truth is each item's data-piste attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_lo_fi"
dimension_label = "Music: Lo-fi"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_lo_fi=Dislike"
adherence_signal = "The lounge sets chosen are the non-lo-fi ones (blues, classical, reggae); no lo-fi set is booked, even though the resort pushes the lo-fi beats DJ, the listening lounge and the chillhop set. Ground truth is each item's data-lofilounge attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
