version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pistes-not-lofi-app"
theme = "Sport: Skiing = Play · Music: Lo-fi = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "skiing", "lo-fi", "mountain-resort", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pistes-not-lofi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and kit is provided; the alternative activities are sports the persona rates neutral and the alternative lounge sets genres it rates neutral — so the picks isolate its skiing and its distaste for lo-fi.
[[checks]]
dimension_id = "sport_skiing"
dimension_label = "Sport: Skiing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_skiing=Play"
adherence_signal = "The activities chosen are skiing (the guided piste morning, the lesson, the first-lift powder run) rather than the swimming, badminton and table-tennis sessions the resort pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_lo_fi"
dimension_label = "Music: Lo-fi"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_lo_fi=Dislike"
adherence_signal = "The lounge sets chosen are the non-lo-fi ones (blues, classical, reggae); no lo-fi set is booked, even though the resort pushes the lo-fi beats DJ, the listening lounge and the chillhop set. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DayPassesPeak (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DayPassesPeak once the desktop is up so the agent finds it on screen.
command = "/opt/daypassespeak/start-daypassespeak.sh"
timeout_sec = 60.0
retries = 5
