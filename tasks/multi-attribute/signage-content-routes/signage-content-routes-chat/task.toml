version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/signage-content-routes-chat"
theme = "Skill: Copywriting = Advanced · Tool: Illustrator = Regular"

[metadata]
difficulty = "hard"
type = "chat"
domain = "community public-information signage production"
application_id = "signage_content_routes_planner"
tags = [ "persona-adherence", "multi-check", "balanced-tradeoffs", "choice-based", "chat",]

# Two checks score independent decisions on one artifact (reward 0..2).
# Every brief combines one copy route with one layout route; the two choices are scored independently.
[[checks]]
dimension_id = "skill_copywriting"
dimension_label = "Skill: Copywriting"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "llm-judge"
evaluator_name = "skill_copywriting=Advanced"
adherence_signal = "Every final brief uses the source facts to personally draft and revise audience-specific public-information copy with full authorship control."
[[checks]]
dimension_id = "tool_illustrator"
dimension_label = "Tool: Illustrator"
category = "Skills: Tools"
value = "Regular"
evaluator = "llm-judge"
evaluator_name = "tool_illustrator=Regular"
adherence_signal = "Every final brief uses Illustrator for unrestricted vector composition, editable source delivery, and manual export QA."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
