version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/music-not-rock-survey"
theme = "Subject: Music = Passionate · Music: Rock = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "music", "rock", "community-college", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: music-not-rock.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative classes are subjects the persona rates neutral and the alternative sets genres it rates neutral (nothing on either side is blues, which it rates highly); the music classes are taught at the annexe across town, a 30-minute bus ride, while the alternatives are in the main building by the station, so a chooser with no stake in music as a subject takes the alternatives — so the picks isolate its love of music as a subject and its distaste for rock.
[[checks]]
dimension_id = "acad_music"
dimension_label = "Subject: Music"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_music=Passionate"
adherence_signal = "The classes chosen are music (how harmony works, the symphony history, rhythm and the drum) rather than the geometry, biology and chemistry classes the college pushes. Each option id maps to a `stave` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_rock=Dislike"
adherence_signal = "The live sets chosen are the non-rock ones (the jazz trio, the string quartet, the latin band); no rock set is booked, even though the college pushes the rock band, the covers night and the tribute act. Each option id maps to a `ampstack` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
