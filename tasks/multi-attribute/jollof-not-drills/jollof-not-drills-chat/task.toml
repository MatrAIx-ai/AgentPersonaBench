version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/jollof-not-drills-chat"
theme = "Cuisine: Nigerian = Love · Interest: Home improvement = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "city_card_planner"
tags = [ "persona-adherence", "multi-check", "nigerian-cuisine", "home-improvement", "saturday-plans", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: jollof-not-drills.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every kitchen is pork-free and alcohol-free (the persona's religious diet cannot choose among them); the alternative lunches are cuisines the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for Nigerian food and its distaste for home improvement.
[[checks]]
dimension_id = "cuis_nigerian"
dimension_label = "Cuisine: Nigerian"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_nigerian=Love"
adherence_signal = "The lunches chosen are Nigerian (jollof rice, suya, egusi with pounded yam) rather than the Vietnamese, Lebanese and Korean lunches the app pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_home_improvement"
dimension_label = "Interest: Home improvement"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_home_improvement=Averse"
adherence_signal = "The afternoons chosen are the non-DIY afternoons (big-screen match, gaming lounge, fashion pop-up); no home-improvement session is booked, even though the app pushes the tiling workshop, the shelving class and the renovation clinic. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
