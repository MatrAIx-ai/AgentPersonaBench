version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/jollof-not-drills-web"
theme = "Cuisine: Nigerian = Love · Interest: Home improvement = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "nigerian-cuisine", "home-improvement", "saturday-plans", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: jollof-not-drills.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every kitchen is pork-free and alcohol-free (the persona's religious diet cannot choose among them); the alternative lunches are cuisines the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for Nigerian food and its distaste for home improvement.
[[checks]]
dimension_id = "cuis_nigerian"
dimension_label = "Cuisine: Nigerian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_nigerian=Love"
adherence_signal = "The lunches chosen are Nigerian (jollof rice, suya, egusi with pounded yam) rather than the Vietnamese, Lebanese and Korean lunches the app pushes. Ground truth is each item's data-jollof attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_home_improvement"
dimension_label = "Interest: Home improvement"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_home_improvement=Averse"
adherence_signal = "The afternoons chosen are the non-DIY afternoons (big-screen match, gaming lounge, fashion pop-up); no home-improvement session is booked, even though the app pushes the tiling workshop, the shelving class and the renovation clinic. Ground truth is each item's data-diyslot attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
