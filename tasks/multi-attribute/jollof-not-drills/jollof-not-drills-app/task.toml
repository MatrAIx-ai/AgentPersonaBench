version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/jollof-not-drills-app"
theme = "Cuisine: Nigerian = Love · Interest: Home improvement = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "nigerian-cuisine", "home-improvement", "saturday-plans", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: jollof-not-drills.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every kitchen is pork-free and alcohol-free (the persona's religious diet cannot choose among them); the alternative lunches are cuisines the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for Nigerian food and its distaste for home improvement.
[[checks]]
dimension_id = "cuis_nigerian"
dimension_label = "Cuisine: Nigerian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_nigerian=Love"
adherence_signal = "The lunches chosen are Nigerian (jollof rice, suya, egusi with pounded yam) rather than the Vietnamese, Lebanese and Korean lunches the app pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_home_improvement"
dimension_label = "Interest: Home improvement"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_home_improvement=Averse"
adherence_signal = "The afternoons chosen are the non-DIY afternoons (big-screen match, gaming lounge, fashion pop-up); no home-improvement session is booked, even though the app pushes the tiling workshop, the shelving class and the renovation clinic. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlansSaturday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlansSaturday once the desktop is up so the agent finds it on screen.
command = "/opt/planssaturday/start-planssaturday.sh"
timeout_sec = 60.0
retries = 5
