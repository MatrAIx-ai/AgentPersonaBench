version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bistro-book-club-app"
theme = "Books: Historical fiction = Love · Cuisine: French = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "french-cuisine", "supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bistro-book-club.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every kitchen is alcohol-free and pork-free; the alternative novels are genres the persona rates neutral and the alternative kitchens cuisines it rates neutral — so the picks isolate its taste for historical fiction and for French food.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_historical_fiction=Love"
adherence_signal = "The novels chosen are historical fiction (Tudor court, Napoleonic wars, medieval abbey) rather than the literary novel, locked-room mystery and mountaineer's memoir the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_french"
dimension_label = "Cuisine: French"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_french=Love"
adherence_signal = "The kitchens chosen are French (bistro roast chicken, onion soup and gratin, ratatouille and tarte tatin) rather than the Peruvian, Moroccan and Japanese kitchens the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperChapter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperChapter once the desktop is up so the agent finds it on screen.
command = "/opt/supperchapter/start-supperchapter.sh"
timeout_sec = 60.0
retries = 5
