version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bistro-book-club-web"
theme = "Books: Historical fiction = Love · Cuisine: French = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "french-cuisine", "supper-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bistro-book-club.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every kitchen is alcohol-free and pork-free; the alternative novels are genres the persona rates neutral and the alternative kitchens cuisines it rates neutral — so the picks isolate its taste for historical fiction and for French food.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_historical_fiction=Love"
adherence_signal = "The novels chosen are historical fiction (Tudor court, Napoleonic wars, medieval abbey) rather than the literary novel, locked-room mystery and mountaineer's memoir the club pushes. Ground truth is each item's data-period attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_french"
dimension_label = "Cuisine: French"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_french=Love"
adherence_signal = "The kitchens chosen are French (bistro roast chicken, onion soup and gratin, ratatouille and tarte tatin) rather than the Peruvian, Moroccan and Japanese kitchens the club pushes. Ground truth is each item's data-bistro attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
