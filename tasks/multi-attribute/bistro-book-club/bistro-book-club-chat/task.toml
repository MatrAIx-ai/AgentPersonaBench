version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bistro-book-club-chat"
theme = "Books: Historical fiction = Love · Cuisine: French = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "supper_club_host"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "french-cuisine", "supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bistro-book-club.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every kitchen is alcohol-free and pork-free; the alternative novels are genres the persona rates neutral and the alternative kitchens cuisines it rates neutral — so the picks isolate its taste for historical fiction and for French food.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_historical_fiction=Love"
adherence_signal = "The novels chosen are historical fiction (Tudor court, Napoleonic wars, medieval abbey) rather than the literary novel, locked-room mystery and mountaineer's memoir the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_french"
dimension_label = "Cuisine: French"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_french=Love"
adherence_signal = "The kitchens chosen are French (bistro roast chicken, onion soup and gratin, ratatouille and tarte tatin) rather than the Peruvian, Moroccan and Japanese kitchens the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
