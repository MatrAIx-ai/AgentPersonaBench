version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bistro-book-club-survey"
theme = "Books: Historical fiction = Love · Cuisine: French = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "historical-fiction", "french-cuisine", "supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bistro-book-club.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every kitchen is alcohol-free and pork-free; the alternative novels are genres the persona rates neutral and the alternative kitchens cuisines it rates neutral — so the picks isolate its taste for historical fiction and for French food.
[[checks]]
dimension_id = "bookg_historical_fiction"
dimension_label = "Books: Historical fiction"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_historical_fiction=Love"
adherence_signal = "The novels chosen are historical fiction (Tudor court, Napoleonic wars, medieval abbey) rather than the literary novel, locked-room mystery and mountaineer's memoir the club pushes. Each option id maps to a `period` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_french"
dimension_label = "Cuisine: French"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_french=Love"
adherence_signal = "The kitchens chosen are French (bistro roast chicken, onion soup and gratin, ratatouille and tarte tatin) rather than the Peruvian, Moroccan and Japanese kitchens the club pushes. Each option id maps to a `bistro` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
