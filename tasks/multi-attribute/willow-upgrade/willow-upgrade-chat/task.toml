version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/willow-upgrade-chat"
theme = "Sport: Cricket = Play · Spending vs saving = Spender"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
application_id = "club_shop_counter"
tags = [ "persona-adherence", "multi-check", "cricket", "spending-style", "club-shop", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: willow-upgrade.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# The voucher covers the basic version of any item in full, every basic does the same job for the club season, every upgrade is a step up in finish and feel at the same kind of top-up from the persona's own pocket, and anything not topped up stays in the persona's pocket; the general kit is just as useful as the cricket kit — so the picks isolate the persona's own cricket and its readiness to pay for the nicer version.
[[checks]]
dimension_id = "sport_cricket"
dimension_label = "Sport: Cricket"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_cricket=Play"
adherence_signal = "The products chosen are cricket kit (a bat, batting gloves, spikes) rather than the equally useful goggles, holdall and mat the shop pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
value = "Spender"
evaluator = "llm-judge"
evaluator_name = "lstyle_frugality=Spender"
adherence_signal = "The versions chosen are the upgrades (grade-1 willow, pro-grade, premium), each a top-up from the persona's own pocket for a step up in finish and feel, rather than the basic versions that do the same job and are covered in full. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
