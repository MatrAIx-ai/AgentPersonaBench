version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/willow-upgrade-survey"
theme = "Sport: Cricket = Play · Spending vs saving = Spender"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "cricket", "spending-style", "club-shop", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: willow-upgrade.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# The voucher covers the basic version of any item in full, every basic does the same job for the club season, every upgrade is a step up in finish and feel at the same kind of top-up from the persona's own pocket, and anything not topped up stays in the persona's pocket; the general kit is just as useful as the cricket kit — so the picks isolate the persona's own cricket and its readiness to pay for the nicer version.
[[checks]]
dimension_id = "sport_cricket"
dimension_label = "Sport: Cricket"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_cricket=Play"
adherence_signal = "The products chosen are cricket kit (a bat, batting gloves, spikes) rather than the equally useful goggles, holdall and mat the shop pushes. Each option id maps to a `willow` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
value = "Spender"
evaluator = "rule-based"
evaluator_name = "lstyle_frugality=Spender"
adherence_signal = "The versions chosen are the upgrades (grade-1 willow, pro-grade, premium), each a top-up from the persona's own pocket for a step up in finish and feel, rather than the basic versions that do the same job and are covered in full. Each option id maps to a `upgrade` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
