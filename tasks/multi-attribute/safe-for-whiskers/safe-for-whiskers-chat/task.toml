version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/safe-for-whiskers-chat"
theme = "Pet ownership = Cat · Hobby: Bonsai = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
application_id = "plant_shop_counter"
tags = [ "persona-adherence", "multi-check", "pet-ownership", "bonsai", "plant-shop", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: safe-for-whiskers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every plant is covered in full, the same size and potted, and every included extra is worth the same; the extras on one side (a tip-proof planter, an out-of-reach bracket, a pot of catnip) matter only to a home with cats and the others (a glazed pot, a self-watering pot, a year's feed) to anyone, no plant carries a toxicity label — so the picks isolate the household with cats and the bonsai habit.
[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
value = "Cat"
evaluator = "llm-judge"
evaluator_name = "lstyle_pet_ownership=Cat"
adherence_signal = "The plants chosen come with the extras made for a home with cats (the tip-proof planter, the bracket out of reach of paws, the pot of catnip) rather than the equally attractive glazed pot, self-watering pot and year's feed the shop pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_bonsai"
dimension_label = "Hobby: Bonsai"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_bonsai=Active"
adherence_signal = "The plants chosen are bonsai rather than the equally healthy ordinary houseplants the shop pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
