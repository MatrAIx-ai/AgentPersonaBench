version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/safe-for-whiskers-web"
theme = "Pet ownership = Cat · Hobby: Bonsai = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "pet-ownership", "bonsai", "plant-shop", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: safe-for-whiskers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every plant is covered in full, the same size and potted, and every included extra is worth the same; the extras on one side (a tip-proof planter, an out-of-reach bracket, a pot of catnip) matter only to a home with cats and the others (a glazed pot, a self-watering pot, a year's feed) to anyone, no plant carries a toxicity label — so the picks isolate the household with cats and the bonsai habit.
[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
value = "Cat"
evaluator = "rule-based"
evaluator_name = "lstyle_pet_ownership=Cat"
adherence_signal = "The plants chosen come with the extras made for a home with cats (the tip-proof planter, the bracket out of reach of paws, the pot of catnip) rather than the equally attractive glazed pot, self-watering pot and year's feed the shop pushes. Ground truth is each item's data-pawproof attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_bonsai"
dimension_label = "Hobby: Bonsai"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_bonsai=Active"
adherence_signal = "The plants chosen are bonsai rather than the equally healthy ordinary houseplants the shop pushes. Ground truth is each item's data-dwarftree attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
