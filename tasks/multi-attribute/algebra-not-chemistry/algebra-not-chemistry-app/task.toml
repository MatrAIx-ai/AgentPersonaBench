version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/algebra-not-chemistry-app"
theme = "Subject: Algebra = Passionate · Subject: Chemistry = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "algebra", "chemistry", "learning-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: algebra-not-chemistry.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the algebra side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of algebra and its distaste for chemistry.
[[checks]]
dimension_id = "acad_algebra"
dimension_label = "Subject: Algebra"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_algebra=Passionate"
adherence_signal = "The lectures chosen are algebra (matrices, groups and symmetry, polynomials) rather than the statistics, psychology and logic lectures the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_chemistry"
dimension_label = "Subject: Chemistry"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_chemistry=Averse"
adherence_signal = "The workshops chosen are the non-chemistry ones (drama, astronomy, creative writing); no chemistry lab is booked, even though the centre pushes the periodic table, kitchen chemistry and molecules that changed history. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LecturesWednesday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LecturesWednesday once the desktop is up so the agent finds it on screen.
command = "/opt/lectureswednesday/start-lectureswednesday.sh"
timeout_sec = 60.0
retries = 5
