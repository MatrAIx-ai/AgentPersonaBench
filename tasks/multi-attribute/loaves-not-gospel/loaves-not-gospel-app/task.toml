version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loaves-not-gospel-app"
theme = "Hobby: Bread baking = Avid · Music: Gospel = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "bread-baking", "gospel", "community-kitchen", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: loaves-not-gospel.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its bread baking and its distaste for gospel music.
[[checks]]
dimension_id = "hob_bread_baking"
dimension_label = "Hobby: Bread baking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_bread_baking=Avid"
adherence_signal = "The sessions chosen are bread (the sourdough workshop, the baguette class, the brioche class) rather than the cheese, candle and leather sessions the kitchen pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_gospel"
dimension_label = "Music: Gospel"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_gospel=Dislike"
adherence_signal = "The concerts chosen are the non-gospel ones (jazz, bluegrass, the string quartet); no gospel concert is booked, even though the kitchen pushes the gospel choir, the brunch band and the gospel quartet. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundaysKitchen (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundaysKitchen once the desktop is up so the agent finds it on screen.
command = "/opt/sundayskitchen/start-sundayskitchen.sh"
timeout_sec = 60.0
retries = 5
