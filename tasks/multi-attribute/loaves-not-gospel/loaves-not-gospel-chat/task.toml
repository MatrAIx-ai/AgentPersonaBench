version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loaves-not-gospel-chat"
theme = "Hobby: Bread baking = Avid · Music: Gospel = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "community_kitchen_desk"
tags = [ "persona-adherence", "multi-check", "bread-baking", "gospel", "community-kitchen", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: loaves-not-gospel.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its bread baking and its distaste for gospel music.
[[checks]]
dimension_id = "hob_bread_baking"
dimension_label = "Hobby: Bread baking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_bread_baking=Avid"
adherence_signal = "The sessions chosen are bread (the sourdough workshop, the baguette class, the brioche class) rather than the cheese, candle and leather sessions the kitchen pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_gospel"
dimension_label = "Music: Gospel"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_gospel=Dislike"
adherence_signal = "The concerts chosen are the non-gospel ones (jazz, bluegrass, the string quartet); no gospel concert is booked, even though the kitchen pushes the gospel choir, the brunch band and the gospel quartet. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
