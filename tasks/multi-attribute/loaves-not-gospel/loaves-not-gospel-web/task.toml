version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loaves-not-gospel-web"
theme = "Hobby: Bread baking = Avid · Music: Gospel = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "bread-baking", "gospel", "community-kitchen", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: loaves-not-gospel.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative sessions are crafts the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its bread baking and its distaste for gospel music.
[[checks]]
dimension_id = "hob_bread_baking"
dimension_label = "Hobby: Bread baking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_bread_baking=Avid"
adherence_signal = "The sessions chosen are bread (the sourdough workshop, the baguette class, the brioche class) rather than the cheese, candle and leather sessions the kitchen pushes. Ground truth is each item's data-crumb attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_gospel"
dimension_label = "Music: Gospel"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_gospel=Dislike"
adherence_signal = "The concerts chosen are the non-gospel ones (jazz, bluegrass, the string quartet); no gospel concert is booked, even though the kitchen pushes the gospel choir, the brunch band and the gospel quartet. Ground truth is each item's data-gospelchoir attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
