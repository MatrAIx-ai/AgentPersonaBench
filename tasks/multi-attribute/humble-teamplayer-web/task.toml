version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/humble-teamplayer-web"
theme = "Humble teamplayer: humility · teamwork · autonomy"

[metadata]
difficulty = "medium"
type = "web"
domain = "professional"
tags = [ "persona-adherence", "multi-check", "humble-teamplayer", "rule-based", "playwright", "real-web",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE reflection task, THREE checks. A single persona carrying three humble-teamplayer
# traits picks the 3 responses/actions it would genuinely take after a group project,
# on a live board page (Playwright); the verifier runs an independent rule-based check
# per axis, reading each card's hidden data-* tier off index.html (ground truth, NOT
# shown to the persona). This amortizes one generation across three attributes. Reward
# = integer score (one point per check HELD, 0..3). Each axis: HELD iff no picked card
# is high-tier (axis >= 2). The three data-ax* attribute names are neutral so nothing
# on the page hints which trait is being measured.
[[checks]]
dimension_id = "trait_humility"
attribute = "Character: Humility"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_humility=Strong"
# Ground truth: each card's hidden data-ax1 (0 modest/shares credit .. 3 boastful) in index.html.
adherence_signal = "Choices are modest / credit-sharing (data-ax1 0-1); no boastful, spotlight-grabbing pick (>= 2)."

[[checks]]
dimension_id = "trait_teamwork"
attribute = "Character: Teamwork"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_teamwork=Strong"
# Ground truth: each card's hidden data-ax2 (0 collaborative/team-first .. 3 goes solo/self-serving).
adherence_signal = "Choices favor the team (data-ax2 0-1); no go-solo, self-serving pick (>= 2)."

[[checks]]
dimension_id = "sdt_need_autonomy"
attribute = "SDT Autonomy Need"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "sdt_need_autonomy=Very high"
# Ground truth: each card's hidden data-ax3 (0 self-directed/makes own call .. 3 defers/does as told).
adherence_signal = "Choices are self-directed (data-ax3 0-1); no defer-to-others, do-as-told pick (>= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
