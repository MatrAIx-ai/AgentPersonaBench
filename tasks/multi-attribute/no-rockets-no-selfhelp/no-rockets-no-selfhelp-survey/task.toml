version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rockets-no-selfhelp-survey"
theme = "Interest: Space = Averse · Books: Self-help = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "space", "self-help", "library-saturdays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-rockets-no-selfhelp.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for space and its distaste for self-help.
[[checks]]
dimension_id = "topic_space"
dimension_label = "Interest: Space"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_space=Averse"
adherence_signal = "The sessions chosen are the non-space ones (local history, photography, chess); no space session is booked, even though the library pushes the planetarium, the rocketry talk and the Mars lecture. Each option id maps to a `rocket` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_self_help=Dislike"
adherence_signal = "The books chosen are the non-self-help ones (the literary novel, the memoir, the essays); no self-help is booked, even though the library pushes the habits bestseller, the confidence book and the decluttering guide. Each option id maps to a `selfhelp` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
