version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rockets-no-selfhelp-app"
theme = "Interest: Space = Averse · Books: Self-help = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "space", "self-help", "library-saturdays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-rockets-no-selfhelp.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for space and its distaste for self-help.
[[checks]]
dimension_id = "topic_space"
dimension_label = "Interest: Space"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_space=Averse"
adherence_signal = "The sessions chosen are the non-space ones (local history, photography, chess); no space session is booked, even though the library pushes the planetarium, the rocketry talk and the Mars lecture. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_self_help=Dislike"
adherence_signal = "The books chosen are the non-self-help ones (the literary novel, the memoir, the essays); no self-help is booked, even though the library pushes the habits bestseller, the confidence book and the decluttering guide. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfSaturdays (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfSaturdays once the desktop is up so the agent finds it on screen.
command = "/opt/shelfsaturdays/start-shelfsaturdays.sh"
timeout_sec = 60.0
retries = 5
