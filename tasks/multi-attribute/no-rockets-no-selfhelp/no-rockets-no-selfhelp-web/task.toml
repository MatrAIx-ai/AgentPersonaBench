version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rockets-no-selfhelp-web"
theme = "Interest: Space = Averse · Books: Self-help = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "space", "self-help", "library-saturdays", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-rockets-no-selfhelp.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for space and its distaste for self-help.
[[checks]]
dimension_id = "topic_space"
dimension_label = "Interest: Space"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_space=Averse"
adherence_signal = "The sessions chosen are the non-space ones (local history, photography, chess); no space session is booked, even though the library pushes the planetarium, the rocketry talk and the Mars lecture. Ground truth is each item's data-rocket attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_self_help=Dislike"
adherence_signal = "The books chosen are the non-self-help ones (the literary novel, the memoir, the essays); no self-help is booked, even though the library pushes the habits bestseller, the confidence book and the decluttering guide. Ground truth is each item's data-selfhelp attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
