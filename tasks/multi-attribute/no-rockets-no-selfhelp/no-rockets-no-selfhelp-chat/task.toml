version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rockets-no-selfhelp-chat"
theme = "Interest: Space = Averse · Books: Self-help = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "library_shelf_desk"
tags = [ "persona-adherence", "multi-check", "space", "self-help", "library-saturdays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-rockets-no-selfhelp.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for space and its distaste for self-help.
[[checks]]
dimension_id = "topic_space"
dimension_label = "Interest: Space"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_space=Averse"
adherence_signal = "The sessions chosen are the non-space ones (local history, photography, chess); no space session is booked, even though the library pushes the planetarium, the rocketry talk and the Mars lecture. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_self_help=Dislike"
adherence_signal = "The books chosen are the non-self-help ones (the literary novel, the memoir, the essays); no self-help is booked, even though the library pushes the habits bestseller, the confidence book and the decluttering guide. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
