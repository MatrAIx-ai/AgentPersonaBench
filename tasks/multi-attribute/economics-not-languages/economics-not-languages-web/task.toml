version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/economics-not-languages-web"
theme = "Subject: Economics = Passionate · Subject: Foreign languages = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "economics", "foreign-languages", "public-lectures", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: economics-not-languages.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative lectures and classes are subjects the persona rates neutral; the economics side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of economics and its distaste for foreign languages.
[[checks]]
dimension_id = "acad_economics"
dimension_label = "Subject: Economics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_economics=Passionate"
adherence_signal = "The lectures chosen are economics (supply and demand, inflation, game theory) rather than the physics, world-history and psychology lectures the programme pushes. Ground truth is each item's data-ledgerline attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_foreign_languages"
dimension_label = "Subject: Foreign languages"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_foreign_languages=Averse"
adherence_signal = "The classes chosen are the non-language ones (logic, civics, sociology); no language class is booked, even though the programme pushes Spanish conversation, borrowed words and German for travellers. Ground truth is each item's data-verbtable attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
