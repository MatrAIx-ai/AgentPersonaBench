version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/economics-not-languages-app"
theme = "Subject: Economics = Passionate · Subject: Foreign languages = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "economics", "foreign-languages", "public-lectures", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: economics-not-languages.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative lectures and classes are subjects the persona rates neutral; the economics side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of economics and its distaste for foreign languages.
[[checks]]
dimension_id = "acad_economics"
dimension_label = "Subject: Economics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_economics=Passionate"
adherence_signal = "The lectures chosen are economics (supply and demand, inflation, game theory) rather than the physics, world-history and psychology lectures the programme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_foreign_languages"
dimension_label = "Subject: Foreign languages"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_foreign_languages=Averse"
adherence_signal = "The classes chosen are the non-language ones (logic, civics, sociology); no language class is booked, even though the programme pushes Spanish conversation, borrowed words and German for travellers. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with OpenLecturesThursday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch OpenLecturesThursday once the desktop is up so the agent finds it on screen.
command = "/opt/openlecturesthursday/start-openlecturesthursday.sh"
timeout_sec = 60.0
retries = 5
