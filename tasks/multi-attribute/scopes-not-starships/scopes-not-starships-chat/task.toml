version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scopes-not-starships-chat"
theme = "Hobby: Stargazing = Avid · Film: Sci-fi = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "science_centre_nights_desk"
tags = [ "persona-adherence", "multi-check", "stargazing", "sci-fi", "science-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scopes-not-starships.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative activities are hobbies the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its stargazing and its distaste for science fiction.
[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_stargazing=Avid"
adherence_signal = "The activities chosen are stargazing (the rooftop telescope night, the dark-sky trip, the meteor watch) rather than the candle, model-building and calligraphy sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_sci_fi"
dimension_label = "Film: Sci-fi"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_sci_fi=Dislike"
adherence_signal = "The films chosen are the non-science-fiction ones (the comedy, the musical, the heist film); no science fiction is booked, even though the centre pushes the colony film, the time-loop film and the android film. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
