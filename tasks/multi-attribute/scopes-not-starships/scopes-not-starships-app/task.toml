version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scopes-not-starships-app"
theme = "Hobby: Stargazing = Avid · Film: Sci-fi = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "stargazing", "sci-fi", "science-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scopes-not-starships.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative activities are hobbies the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its stargazing and its distaste for science fiction.
[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_stargazing=Avid"
adherence_signal = "The activities chosen are stargazing (the rooftop telescope night, the dark-sky trip, the meteor watch) rather than the candle, model-building and calligraphy sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_sci_fi"
dimension_label = "Film: Sci-fi"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_sci_fi=Dislike"
adherence_signal = "The films chosen are the non-science-fiction ones (the comedy, the musical, the heist film); no science fiction is booked, even though the centre pushes the colony film, the time-loop film and the android film. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightsScienceCentre (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightsScienceCentre once the desktop is up so the agent finds it on screen.
command = "/opt/nightssciencecentre/start-nightssciencecentre.sh"
timeout_sec = 60.0
retries = 5
