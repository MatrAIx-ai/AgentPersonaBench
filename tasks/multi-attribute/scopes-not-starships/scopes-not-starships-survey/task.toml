version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scopes-not-starships-survey"
theme = "Hobby: Stargazing = Avid · Film: Sci-fi = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "stargazing", "sci-fi", "science-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scopes-not-starships.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative activities are hobbies the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its stargazing and its distaste for science fiction.
[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_stargazing=Avid"
adherence_signal = "The activities chosen are stargazing (the rooftop telescope night, the dark-sky trip, the meteor watch) rather than the candle, model-building and calligraphy sessions the centre pushes. Each option id maps to a `telescope` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_sci_fi"
dimension_label = "Film: Sci-fi"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_sci_fi=Dislike"
adherence_signal = "The films chosen are the non-science-fiction ones (the comedy, the musical, the heist film); no science fiction is booked, even though the centre pushes the colony film, the time-loop film and the android film. Each option id maps to a `starship` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
