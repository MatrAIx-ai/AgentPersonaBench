version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kits-not-showtunes-web"
theme = "Hobby: Model building = Avid · Film: Musical = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "model-building", "musical", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: kits-not-showtunes.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its model building and its distaste for musicals.
[[checks]]
dimension_id = "hob_model_building"
dimension_label = "Hobby: Model building"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_model_building=Avid"
adherence_signal = "The workshops chosen are model building (the plastic-kit session, the railway scenery workshop, the diorama class) rather than the candle, origami and pottery sessions the centre pushes. Ground truth is each item's data-sprue attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_musical"
dimension_label = "Film: Musical"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_musical=Dislike"
adherence_signal = "The films chosen are the non-musicals (the western, the space film, the mystery); no musical is booked, even though the centre pushes the backstage musical, the golden-age musical and the rock opera. Ground truth is each item's data-showtune attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
