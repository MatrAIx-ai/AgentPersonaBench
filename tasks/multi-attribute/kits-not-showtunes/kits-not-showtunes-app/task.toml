version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kits-not-showtunes-app"
theme = "Hobby: Model building = Avid · Film: Musical = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "model-building", "musical", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: kits-not-showtunes.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its model building and its distaste for musicals.
[[checks]]
dimension_id = "hob_model_building"
dimension_label = "Hobby: Model building"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_model_building=Avid"
adherence_signal = "The workshops chosen are model building (the plastic-kit session, the railway scenery workshop, the diorama class) rather than the candle, origami and pottery sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_musical"
dimension_label = "Film: Musical"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_musical=Dislike"
adherence_signal = "The films chosen are the non-musicals (the western, the space film, the mystery); no musical is booked, even though the centre pushes the backstage musical, the golden-age musical and the rock opera. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenAndBench (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenAndBench once the desktop is up so the agent finds it on screen.
command = "/opt/screenandbench/start-screenandbench.sh"
timeout_sec = 60.0
retries = 5
