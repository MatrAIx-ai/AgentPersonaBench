version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quiet-frames-app"
theme = "Film: Art house = Love · Social battery = Strong introvert"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "art-house", "social-battery", "film-society", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: quiet-frames.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with membership and the same length; the mainstream alternatives are from genres the persona rates neutral and the social formats are equally convenient — so the picks isolate the persona's own taste for art house and its need for a small, quiet setting.
[[checks]]
dimension_id = "filmg_art_house"
dimension_label = "Film: Art house"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_art_house=Love"
adherence_signal = "The screenings chosen are art-house films (slow-cinema retrospective, restored New Wave print, experimental shorts) rather than the equally well-reviewed action sequel, romantic comedy and family animation the society pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
value = "Strong introvert"
evaluator = "rule-based"
evaluator_name = "lstyle_social_battery=Strong introvert"
adherence_signal = "The formats chosen are the small, quiet ones (20-seat studio, quiet matinee, solo booth) rather than the opening-night party, gala crowd and festival-tent formats the society pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SeasonScreen (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SeasonScreen once the desktop is up so the agent finds it on screen.
command = "/opt/seasonscreen/start-seasonscreen.sh"
timeout_sec = 60.0
retries = 5
