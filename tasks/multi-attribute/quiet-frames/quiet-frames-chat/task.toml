version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quiet-frames-chat"
theme = "Film: Art house = Love · Social battery = Strong introvert"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "film_society_desk"
tags = [ "persona-adherence", "multi-check", "art-house", "social-battery", "film-society", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: quiet-frames.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with membership and the same length; the mainstream alternatives are from genres the persona rates neutral and the social formats are equally convenient — so the picks isolate the persona's own taste for art house and its need for a small, quiet setting.
[[checks]]
dimension_id = "filmg_art_house"
dimension_label = "Film: Art house"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_art_house=Love"
adherence_signal = "The screenings chosen are art-house films (slow-cinema retrospective, restored New Wave print, experimental shorts) rather than the equally well-reviewed action sequel, romantic comedy and family animation the society pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
value = "Strong introvert"
evaluator = "llm-judge"
evaluator_name = "lstyle_social_battery=Strong introvert"
adherence_signal = "The formats chosen are the small, quiet ones (20-seat studio, quiet matinee, solo booth) rather than the opening-night party, gala crowd and festival-tent formats the society pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
