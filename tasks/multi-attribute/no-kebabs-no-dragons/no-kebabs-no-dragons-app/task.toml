version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-kebabs-no-dragons-app"
theme = "Cuisine: Turkish = Avoid · Books: Fantasy = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "turkish-cuisine", "fantasy", "book-and-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-kebabs-no-dragons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the book is posted ahead; the non-Turkish suppers are cuisines the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for Turkish food and its distaste for fantasy.
[[checks]]
dimension_id = "cuis_turkish"
dimension_label = "Cuisine: Turkish"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_turkish=Avoid"
adherence_signal = "The suppers chosen are the non-Turkish ones (Italian, Thai, Indian); no Turkish supper is booked, even though the club pushes the shish kebab, the lahmacun and the pide plate. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_fantasy"
dimension_label = "Books: Fantasy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_fantasy=Dislike"
adherence_signal = "The books chosen are the non-fantasy ones (the thriller, the memoir, the popular science); no fantasy is booked, even though the club pushes the dragon-rider epic, the portal fantasy and the sword-and-sorcery novel. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TomeAndTable (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TomeAndTable once the desktop is up so the agent finds it on screen.
command = "/opt/tomeandtable/start-tomeandtable.sh"
timeout_sec = 60.0
retries = 5
