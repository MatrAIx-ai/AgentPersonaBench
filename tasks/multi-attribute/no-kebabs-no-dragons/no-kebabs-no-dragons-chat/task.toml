version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-kebabs-no-dragons-chat"
theme = "Cuisine: Turkish = Avoid · Books: Fantasy = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "table_tome_club_host"
tags = [ "persona-adherence", "multi-check", "turkish-cuisine", "fantasy", "book-and-supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-kebabs-no-dragons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the book is posted ahead; the non-Turkish suppers are cuisines the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for Turkish food and its distaste for fantasy.
[[checks]]
dimension_id = "cuis_turkish"
dimension_label = "Cuisine: Turkish"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_turkish=Avoid"
adherence_signal = "The suppers chosen are the non-Turkish ones (Italian, Thai, Indian); no Turkish supper is booked, even though the club pushes the shish kebab, the lahmacun and the pide plate. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_fantasy"
dimension_label = "Books: Fantasy"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_fantasy=Dislike"
adherence_signal = "The books chosen are the non-fantasy ones (the thriller, the memoir, the popular science); no fantasy is booked, even though the club pushes the dragon-rider epic, the portal fantasy and the sword-and-sorcery novel. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
