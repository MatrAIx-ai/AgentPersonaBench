version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-kebabs-no-dragons-web"
theme = "Cuisine: Turkish = Avoid · Books: Fantasy = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "turkish-cuisine", "fantasy", "book-and-supper-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-kebabs-no-dragons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the book is posted ahead; the non-Turkish suppers are cuisines the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for Turkish food and its distaste for fantasy.
[[checks]]
dimension_id = "cuis_turkish"
dimension_label = "Cuisine: Turkish"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_turkish=Avoid"
adherence_signal = "The suppers chosen are the non-Turkish ones (Italian, Thai, Indian); no Turkish supper is booked, even though the club pushes the shish kebab, the lahmacun and the pide plate. Ground truth is each item's data-kebab attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_fantasy"
dimension_label = "Books: Fantasy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_fantasy=Dislike"
adherence_signal = "The books chosen are the non-fantasy ones (the thriller, the memoir, the popular science); no fantasy is booked, even though the club pushes the dragon-rider epic, the portal fantasy and the sword-and-sorcery novel. Ground truth is each item's data-dragon attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
