version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reviews-not-usual-brands-app"
theme = "Attitude: Online reviews = Enthusiast · Attitude: Brand loyalty = Opposed"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "multi-check", "online-reviews", "brand-loyalty", "household-restock", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: reviews-not-usual-brands.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every product costs the same as its alternatives and is the same size. The rated listings carry a crowd rating (4.8 stars from thousands of customer reviews) and nothing else; the unreviewed ones carry an institutional quality signal in its place (the consumer association's Best Buy award, an independent lab's top score, a professional-kitchen staple) with no customer reviews on the site yet. The cost of the keyed side is the award or lab score it lacks: a chooser with no stake in crowd reviews takes the award or the lab score, and only someone who specifically trusts customer reviews prefers the rating — so the picks isolate the persona's trust in online reviews and its refusal to buy a brand out of habit.
[[checks]]
dimension_id = "att_online_reviews"
dimension_label = "Attitude: Online reviews"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_online_reviews=Enthusiast"
adherence_signal = "The products chosen are the customer-reviewed listings (thousands of reviews, 4.8 stars) rather than the award-and-lab-score listings with no customer reviews that the shop pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "att_brand_loyalty"
dimension_label = "Attitude: Brand loyalty"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_brand_loyalty=Opposed"
adherence_signal = "The products chosen are the brands not tried before; no usual-brand listing is booked, even though the shop pushes 'your usual' at every turn. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ThreeRestock (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ThreeRestock once the desktop is up so the agent finds it on screen.
command = "/opt/threerestock/start-threerestock.sh"
timeout_sec = 60.0
retries = 5
