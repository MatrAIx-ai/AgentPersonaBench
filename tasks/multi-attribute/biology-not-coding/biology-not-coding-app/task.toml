version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biology-not-coding-app"
theme = "Subject: Biology = Passionate · Subject: Computer science = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "biology", "computer-science", "public-lectures", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biology-not-coding.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the biology side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of biology and its distaste for computer science.
[[checks]]
dimension_id = "acad_biology"
dimension_label = "Subject: Biology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_biology=Passionate"
adherence_signal = "The lectures chosen are biology (cells, evolution in real time, the microbiome) rather than the economics, world-history and statistics lectures the programme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_computer_science"
dimension_label = "Subject: Computer science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_computer_science=Averse"
adherence_signal = "The workshops chosen are the non-computing ones (drama, visual art, earth science); no computer-science workshop is booked, even though the programme pushes algorithms, internet routing and first-program sessions. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysOpenLecture (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysOpenLecture once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysopenlecture/start-saturdaysopenlecture.sh"
timeout_sec = 60.0
retries = 5
