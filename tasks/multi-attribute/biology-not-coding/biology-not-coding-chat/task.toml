version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biology-not-coding-chat"
theme = "Subject: Biology = Passionate · Subject: Computer science = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "public_programme_office"
tags = [ "persona-adherence", "multi-check", "biology", "computer-science", "public-lectures", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biology-not-coding.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the biology side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of biology and its distaste for computer science.
[[checks]]
dimension_id = "acad_biology"
dimension_label = "Subject: Biology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_biology=Passionate"
adherence_signal = "The lectures chosen are biology (cells, evolution in real time, the microbiome) rather than the economics, world-history and statistics lectures the programme pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_computer_science"
dimension_label = "Subject: Computer science"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_computer_science=Averse"
adherence_signal = "The workshops chosen are the non-computing ones (drama, visual art, earth science); no computer-science workshop is booked, even though the programme pushes algorithms, internet routing and first-program sessions. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
