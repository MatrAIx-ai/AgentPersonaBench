version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/biology-not-coding-survey"
theme = "Subject: Biology = Passionate · Subject: Computer science = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "biology", "computer-science", "public-lectures", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: biology-not-coding.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the biology side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of biology and its distaste for computer science.
[[checks]]
dimension_id = "acad_biology"
dimension_label = "Subject: Biology"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_biology=Passionate"
adherence_signal = "The lectures chosen are biology (cells, evolution in real time, the microbiome) rather than the economics, world-history and statistics lectures the programme pushes. Each option id maps to a `microscope` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_computer_science"
dimension_label = "Subject: Computer science"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_computer_science=Averse"
adherence_signal = "The workshops chosen are the non-computing ones (drama, visual art, earth science); no computer-science workshop is booked, even though the programme pushes algorithms, internet routing and first-program sessions. Each option id maps to a `codelab` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
