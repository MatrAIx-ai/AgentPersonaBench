version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-action-no-verse-survey"
theme = "Film: Action = Dislike · Books: Poetry = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "action-film", "poetry", "film-and-book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-action-no-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for action films and its distaste for poetry.
[[checks]]
dimension_id = "filmg_action"
dimension_label = "Film: Action"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_action=Dislike"
adherence_signal = "The films chosen are the non-action ones (the courtroom drama, the superhero film, the thriller); no action film is booked, even though the club pushes the car chase, the martial-arts film and the special-forces film. Each option id maps to a `carchase` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_poetry=Dislike"
adherence_signal = "The books chosen are the non-poetry ones (the literary novel, the historical novel, the horror novel); no poetry is booked, even though the club pushes the sonnets, the contemporary collection and the epic poem. Each option id maps to a `sonnet` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
