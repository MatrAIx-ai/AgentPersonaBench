version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-action-no-verse-web"
theme = "Film: Action = Dislike · Books: Poetry = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "action-film", "poetry", "film-and-book-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-action-no-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for action films and its distaste for poetry.
[[checks]]
dimension_id = "filmg_action"
dimension_label = "Film: Action"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_action=Dislike"
adherence_signal = "The films chosen are the non-action ones (the courtroom drama, the superhero film, the thriller); no action film is booked, even though the club pushes the car chase, the martial-arts film and the special-forces film. Ground truth is each item's data-carchase attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_poetry=Dislike"
adherence_signal = "The books chosen are the non-poetry ones (the literary novel, the historical novel, the horror novel); no poetry is booked, even though the club pushes the sonnets, the contemporary collection and the epic poem. Ground truth is each item's data-sonnet attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
