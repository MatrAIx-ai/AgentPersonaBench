version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-action-no-verse-chat"
theme = "Film: Action = Dislike · Books: Poetry = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "screen_spine_club_host"
tags = [ "persona-adherence", "multi-check", "action-film", "poetry", "film-and-book-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-action-no-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for action films and its distaste for poetry.
[[checks]]
dimension_id = "filmg_action"
dimension_label = "Film: Action"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_action=Dislike"
adherence_signal = "The films chosen are the non-action ones (the courtroom drama, the superhero film, the thriller); no action film is booked, even though the club pushes the car chase, the martial-arts film and the special-forces film. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_poetry=Dislike"
adherence_signal = "The books chosen are the non-poetry ones (the literary novel, the historical novel, the horror novel); no poetry is booked, even though the club pushes the sonnets, the contemporary collection and the epic poem. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
