version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-action-no-verse-app"
theme = "Film: Action = Dislike · Books: Poetry = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "action-film", "poetry", "film-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-action-no-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for action films and its distaste for poetry.
[[checks]]
dimension_id = "filmg_action"
dimension_label = "Film: Action"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_action=Dislike"
adherence_signal = "The films chosen are the non-action ones (the courtroom drama, the superhero film, the thriller); no action film is booked, even though the club pushes the car chase, the martial-arts film and the special-forces film. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_poetry=Dislike"
adherence_signal = "The books chosen are the non-poetry ones (the literary novel, the historical novel, the horror novel); no poetry is booked, even though the club pushes the sonnets, the contemporary collection and the epic poem. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SpineAndScreen (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SpineAndScreen once the desktop is up so the agent finds it on screen.
command = "/opt/spineandscreen/start-spineandscreen.sh"
timeout_sec = 60.0
retries = 5
