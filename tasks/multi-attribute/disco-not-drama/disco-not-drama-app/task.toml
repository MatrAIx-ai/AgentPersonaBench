version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/disco-not-drama-app"
theme = "Music: Disco = Love · Interest: Theater = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "disco", "theater", "night-out", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: disco-not-drama.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, both halves are the same length, and every venue is alcohol-free; the alternative second halves are genres the persona rates neutral and the non-theatre first halves are just as sociable — so the picks isolate its taste for disco and its distaste for theatre.
[[checks]]
dimension_id = "musg_disco"
dimension_label = "Music: Disco"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_disco=Love"
adherence_signal = "The second halves chosen are disco (disco night, seventies disco party, disco roller night) rather than the techno, reggaeton and K-pop nights the pass pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_theater"
dimension_label = "Interest: Theater"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_theater=Averse"
adherence_signal = "The first halves chosen are the non-theatre ones (magic show, quiz night, sci-fi screening); no play is booked, even though the pass pushes the stage play, the fringe piece and Shakespeare in the park. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HalvesTwo (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HalvesTwo once the desktop is up so the agent finds it on screen.
command = "/opt/halvestwo/start-halvestwo.sh"
timeout_sec = 60.0
retries = 5
