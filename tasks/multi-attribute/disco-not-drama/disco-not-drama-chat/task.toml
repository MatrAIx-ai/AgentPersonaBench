version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/disco-not-drama-chat"
theme = "Music: Disco = Love · Interest: Theater = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "night_out_pass_desk"
tags = [ "persona-adherence", "multi-check", "disco", "theater", "night-out", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: disco-not-drama.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, both halves are the same length, and every venue is alcohol-free; the alternative second halves are genres the persona rates neutral and the non-theatre first halves are just as sociable — so the picks isolate its taste for disco and its distaste for theatre.
[[checks]]
dimension_id = "musg_disco"
dimension_label = "Music: Disco"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_disco=Love"
adherence_signal = "The second halves chosen are disco (disco night, seventies disco party, disco roller night) rather than the techno, reggaeton and K-pop nights the pass pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_theater"
dimension_label = "Interest: Theater"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_theater=Averse"
adherence_signal = "The first halves chosen are the non-theatre ones (magic show, quiz night, sci-fi screening); no play is booked, even though the pass pushes the stage play, the fringe piece and Shakespeare in the park. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
