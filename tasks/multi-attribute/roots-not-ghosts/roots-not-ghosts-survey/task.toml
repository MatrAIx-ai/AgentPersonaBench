version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/roots-not-ghosts-survey"
theme = "Hobby: Genealogy = Active · Books: Horror = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "genealogy", "horror-books", "library-programme", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: roots-not-ghosts.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle is free with the library card and every session is the same length; the alternative sessions are crafts the persona rates neutral (its own crafts — pottery, origami, juggling, model building — are kept off both sides) and the non-horror books are genres it rates neutral — so the picks isolate its family-history research and its distaste for horror fiction.
[[checks]]
dimension_id = "hob_genealogy"
dimension_label = "Hobby: Genealogy"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_genealogy=Active"
adherence_signal = "The sessions chosen are genealogy sessions (family-history clinic, parish-records workshop, DNA-results reading) rather than the candle, sketching and calligraphy evenings the library pushes. Each option id maps to a `ancestry` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_horror"
dimension_label = "Books: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_horror=Dislike"
adherence_signal = "The books chosen are the non-horror loans (science fiction, locked-room mystery, travel book); no horror novel is taken, even though the library pushes the haunted-house novel, the possession novel and the folk-horror novel. Each option id maps to a `horrorbook` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
