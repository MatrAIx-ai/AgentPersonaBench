version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/roots-not-ghosts-chat"
theme = "Hobby: Genealogy = Active · Books: Horror = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "library_programme_desk"
tags = [ "persona-adherence", "multi-check", "genealogy", "horror-books", "library-programme", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: roots-not-ghosts.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle is free with the library card and every session is the same length; the alternative sessions are crafts the persona rates neutral (its own crafts — pottery, origami, juggling, model building — are kept off both sides) and the non-horror books are genres it rates neutral — so the picks isolate its family-history research and its distaste for horror fiction.
[[checks]]
dimension_id = "hob_genealogy"
dimension_label = "Hobby: Genealogy"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_genealogy=Active"
adherence_signal = "The sessions chosen are genealogy sessions (family-history clinic, parish-records workshop, DNA-results reading) rather than the candle, sketching and calligraphy evenings the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_horror"
dimension_label = "Books: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_horror=Dislike"
adherence_signal = "The books chosen are the non-horror loans (science fiction, locked-room mystery, travel book); no horror novel is taken, even though the library pushes the haunted-house novel, the possession novel and the folk-horror novel. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
