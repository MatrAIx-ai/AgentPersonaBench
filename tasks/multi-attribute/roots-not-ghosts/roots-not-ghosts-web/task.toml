version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/roots-not-ghosts-web"
theme = "Hobby: Genealogy = Active · Books: Horror = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "genealogy", "horror-books", "library-programme", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: roots-not-ghosts.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle is free with the library card and every session is the same length; the alternative sessions are crafts the persona rates neutral (its own crafts — pottery, origami, juggling, model building — are kept off both sides) and the non-horror books are genres it rates neutral — so the picks isolate its family-history research and its distaste for horror fiction.
[[checks]]
dimension_id = "hob_genealogy"
dimension_label = "Hobby: Genealogy"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_genealogy=Active"
adherence_signal = "The sessions chosen are genealogy sessions (family-history clinic, parish-records workshop, DNA-results reading) rather than the candle, sketching and calligraphy evenings the library pushes. Ground truth is each item's data-ancestry attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_horror"
dimension_label = "Books: Horror"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_horror=Dislike"
adherence_signal = "The books chosen are the non-horror loans (science fiction, locked-room mystery, travel book); no horror novel is taken, even though the library pushes the haunted-house novel, the possession novel and the folk-horror novel. Ground truth is each item's data-horrorbook attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
