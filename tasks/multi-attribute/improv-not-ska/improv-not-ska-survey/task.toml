version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/improv-not-ska-survey"
theme = "Hobby: Improv = Avid · Music: Ska = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "improv", "ska", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: improv-not-ska.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its improv and its distaste for ska.
[[checks]]
dimension_id = "hob_improv"
dimension_label = "Hobby: Improv"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_improv=Avid"
adherence_signal = "The workshops chosen are improv (the short-form jam, the long-form workshop, the drop-in show slot) rather than the calligraphy, candle and whittling hours the centre pushes. Each option id maps to a `yesand` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_ska=Dislike"
adherence_signal = "The gigs chosen are the non-ska ones (indie, gospel, Latin); no ska gig is booked, even though the centre pushes the ska band, the two-tone night and the ska DJ. Each option id maps to a `skagig` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
