version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/improv-not-ska-web"
theme = "Hobby: Improv = Avid · Music: Ska = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "improv", "ska", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: improv-not-ska.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its improv and its distaste for ska.
[[checks]]
dimension_id = "hob_improv"
dimension_label = "Hobby: Improv"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_improv=Avid"
adherence_signal = "The workshops chosen are improv (the short-form jam, the long-form workshop, the drop-in show slot) rather than the calligraphy, candle and whittling hours the centre pushes. Ground truth is each item's data-yesand attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_ska=Dislike"
adherence_signal = "The gigs chosen are the non-ska ones (indie, gospel, Latin); no ska gig is booked, even though the centre pushes the ska band, the two-tone night and the ska DJ. Ground truth is each item's data-skagig attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
