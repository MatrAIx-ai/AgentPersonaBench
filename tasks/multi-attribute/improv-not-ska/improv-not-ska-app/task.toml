version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/improv-not-ska-app"
theme = "Hobby: Improv = Avid · Music: Ska = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "improv", "ska", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: improv-not-ska.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its improv and its distaste for ska.
[[checks]]
dimension_id = "hob_improv"
dimension_label = "Hobby: Improv"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_improv=Avid"
adherence_signal = "The workshops chosen are improv (the short-form jam, the long-form workshop, the drop-in show slot) rather than the calligraphy, candle and whittling hours the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_ska=Dislike"
adherence_signal = "The gigs chosen are the non-ska ones (indie, gospel, Latin); no ska gig is booked, even though the centre pushes the ska band, the two-tone night and the ska DJ. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HeadlinerAndHour (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HeadlinerAndHour once the desktop is up so the agent finds it on screen.
command = "/opt/headlinerandhour/start-headlinerandhour.sh"
timeout_sec = 60.0
retries = 5
