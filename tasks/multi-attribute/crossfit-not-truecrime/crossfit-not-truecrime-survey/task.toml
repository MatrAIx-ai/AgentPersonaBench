version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crossfit-not-truecrime-survey"
theme = "Sport: CrossFit = Follow · Books: True crime = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "crossfit", "true-crime", "sports-and-book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crossfit-not-truecrime.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the club is alcohol-free; the alternative outings are sports the persona rates neutral and the alternative books genres it rates neutral; the CrossFit side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its CrossFit fandom and its distaste for true crime.
[[checks]]
dimension_id = "sport_crossfit"
dimension_label = "Sport: CrossFit"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_crossfit=Follow"
adherence_signal = "The outings chosen are CrossFit (the Games screening, the regional competition, the semifinal watch party) rather than the hockey, darts and cricket outings the club pushes. Each option id maps to a `boxfan` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_true_crime"
dimension_label = "Books: True crime"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_true_crime=Dislike"
adherence_signal = "The books chosen are the non-true-crime ones (the travel-writing collection, the biography, the popular-science book); no true-crime book is booked, even though the club pushes the cold case, the heist account and the courtroom account. Each option id maps to a `casefileshelf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
