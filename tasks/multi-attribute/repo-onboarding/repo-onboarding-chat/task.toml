version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/repo-onboarding-chat"
theme = "Codebase onboarding style = Asks teammates / AI for map · Coding agent context sharing comfort = Shares natural-language descriptions only"

[metadata]
difficulty = "medium"
type = "chat"
domain = "software"
application_id = "repository_onboarding_planner"
tags = [ "persona-adherence", "multi-check", "repository-onboarding", "bug-triage", "developer-workflow", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: repo-onboarding.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every plan uses the same repository, approved privacy boundary, tools, test suite, time budget, and read-only onboarding phase. A guided map provides quick contextual orientation but depends on another party's framing; self-mapping is independent and first-hand but takes more reading and searching. A developer-written natural-language brief is quick to share and limits the project detail exposed to the coding agent but may omit relevant context; direct read-only source-tree and index access provides grounded, complete context but exposes more pre-cleared repository detail and requires indexing setup.
[[checks]]
dimension_id = "codebase_onboarding_style"
dimension_label = "Codebase onboarding style"
category = "Developer: Code Maintenance"
value = "Asks teammates / AI for map"
evaluator = "llm-judge"
evaluator_name = "codebase_onboarding_style=Asks teammates / AI for map"
adherence_signal = "The selected onboarding plans begin with a concise repository map or walkthrough from a teammate or AI before independently tracing the codebase. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "coding_agent_context_sharing_comfort"
dimension_label = "Coding agent context sharing comfort"
category = "Developer: Agent Adoption"
value = "Shares natural-language descriptions only"
evaluator = "llm-judge"
evaluator_name = "coding_agent_context_sharing_comfort=Shares natural-language descriptions only"
adherence_signal = "The selected onboarding plans give the coding agent only the developer's written natural-language repository brief, without direct source-tree or repository-index access. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
