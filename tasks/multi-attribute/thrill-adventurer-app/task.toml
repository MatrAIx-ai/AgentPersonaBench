version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrill-adventurer-app"
theme = "Thrill-adventurer: books bold new outings, embraces risk & thrills, passionate about being active (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE outing-planning session, THREE checks. A single persona (a computer-use
# agent operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop)
# builds one plan; the verifier runs an independent rule-based check per attribute.
# Each outing carries three hidden ground-truth axes (adv/risk/fit, 0..3) that are
# NEVER shown on screen — the agent sees only name + price and must judge for
# itself. A check is HELD iff no selected outing scores >= 2 on its axis (>= 2 is
# the OFF-persona, safe/cautious/sedentary end). Reward = integer score, one point
# per axis HELD (0..3).
[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Big Five: Adventurousness"
category = "Personality: Big Five"
attribute = "Adventurousness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_adventurousness=Very high"
metric = "adv_axis_max"                     # HELD iff no picked outing has adv >= 2
adherence_signal = "The booked plan contains no safe-routine outing (hidden adv axis >= 2); an adventurous person seeks bold, new experiences."

[[checks]]
dimension_id = "dospert_recreational_risk_tolerance"
dimension_label = "Recreational risk tolerance"
category = "Risk & Decision"
attribute = "Recreational risk tolerance"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "dospert_recreational_risk_tolerance=Very high"
metric = "risk_axis_max"                    # HELD iff no picked outing has risk >= 2
adherence_signal = "The plan contains no risk-averse outing (hidden risk axis >= 2); a high recreational-risk-taker embraces thrilling, daring activities."

[[checks]]
dimension_id = "topic_fitness"
dimension_label = "Topic: Fitness"
category = "Health: Fitness"
attribute = "Fitness"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_fitness=Passionate"
metric = "fit_axis_max"                      # HELD iff no picked outing has fit >= 2
adherence_signal = "The plan contains no sedentary outing (hidden fit axis >= 2); someone passionate about fitness is eager to be physically active."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
