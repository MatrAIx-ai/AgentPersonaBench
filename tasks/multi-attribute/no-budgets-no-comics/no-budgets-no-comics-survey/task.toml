version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budgets-no-comics-survey"
theme = "Interest: Personal finance = Averse · Books: Graphic novels = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "personal-finance", "graphic-novels", "community-library", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-budgets-no-comics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the book is posted ahead; the alternative workshops are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for personal finance and its distaste for graphic novels.
[[checks]]
dimension_id = "topic_personal_finance"
dimension_label = "Interest: Personal finance"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_personal_finance=Averse"
adherence_signal = "The workshops chosen are the non-finance ones (genealogy, board games, magic); no personal-finance workshop is booked, even though the library pushes the budgeting workshop, the pensions clinic and the household-finance seminar. Each option id maps to a `budgetsheet` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_graphic_novels"
dimension_label = "Books: Graphic novels"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_graphic_novels=Dislike"
adherence_signal = "The books chosen are the non-graphic ones (the literary novel, the poetry, the memoir); no graphic novel is booked, even though the library pushes the superhero volume, the literary graphic novel and the adaptation. Each option id maps to a `panels` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
