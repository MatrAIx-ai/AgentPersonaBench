version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budgets-no-comics-web"
theme = "Interest: Personal finance = Averse · Books: Graphic novels = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "personal-finance", "graphic-novels", "community-library", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-budgets-no-comics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the book is posted ahead; the alternative workshops are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for personal finance and its distaste for graphic novels.
[[checks]]
dimension_id = "topic_personal_finance"
dimension_label = "Interest: Personal finance"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_personal_finance=Averse"
adherence_signal = "The workshops chosen are the non-finance ones (genealogy, board games, magic); no personal-finance workshop is booked, even though the library pushes the budgeting workshop, the pensions clinic and the household-finance seminar. Ground truth is each item's data-budgetsheet attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_graphic_novels"
dimension_label = "Books: Graphic novels"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_graphic_novels=Dislike"
adherence_signal = "The books chosen are the non-graphic ones (the literary novel, the poetry, the memoir); no graphic novel is booked, even though the library pushes the superhero volume, the literary graphic novel and the adaptation. Ground truth is each item's data-panels attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
