version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budgets-no-comics-app"
theme = "Interest: Personal finance = Averse · Books: Graphic novels = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "personal-finance", "graphic-novels", "community-library", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-budgets-no-comics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the book is posted ahead; the alternative workshops are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for personal finance and its distaste for graphic novels.
[[checks]]
dimension_id = "topic_personal_finance"
dimension_label = "Interest: Personal finance"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_personal_finance=Averse"
adherence_signal = "The workshops chosen are the non-finance ones (genealogy, board games, magic); no personal-finance workshop is booked, even though the library pushes the budgeting workshop, the pensions clinic and the household-finance seminar. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_graphic_novels"
dimension_label = "Books: Graphic novels"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_graphic_novels=Dislike"
adherence_signal = "The books chosen are the non-graphic ones (the literary novel, the poetry, the memoir); no graphic novel is booked, even though the library pushes the superhero volume, the literary graphic novel and the adaptation. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfAndWorkshop (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfAndWorkshop once the desktop is up so the agent finds it on screen.
command = "/opt/shelfandworkshop/start-shelfandworkshop.sh"
timeout_sec = 60.0
retries = 5
