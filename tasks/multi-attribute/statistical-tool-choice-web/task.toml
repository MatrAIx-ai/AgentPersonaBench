version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/statistical-tool-choice-web"
theme = "Complete an online regression through one of four equally capable workspaces"

[metadata]
difficulty = "medium"
type = "web"
domain = "data-analysis"
tags = ["persona-adherence", "multi-check", "statistics", "tool-choice", "rule-based", "playwright"]

[[checks]]
dimension_id = "tool_stata"
dimension_label = "Tool: Stata"
category = "Skills: Tools"
value = "Power user"
evaluator = "rule-based"
evaluator_name = "tool_stata=Power user"
adherence_signal = "The completed and exported analysis was run in the Stata workspace."

[[checks]]
dimension_id = "tool_python"
dimension_label = "Tool: Python"
category = "Skills: Tools"
value = "Never used"
evaluator = "rule-based"
evaluator_name = "tool_python=Never used"
adherence_signal = "The completed analysis was not run in the Python workspace."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
