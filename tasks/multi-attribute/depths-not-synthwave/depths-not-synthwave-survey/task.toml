version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/depths-not-synthwave-survey"
theme = "Hobby: Scuba diving = Avid · Music: Synthwave = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scuba-diving", "synthwave", "coastal-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: depths-not-synthwave.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every day is on the water (so being outdoors is common to both sides) and the boathouse is alcohol-free (the persona drinks none); the alternative days are water hobbies the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its diving and its distaste for synthwave.
[[checks]]
dimension_id = "hob_scuba_diving"
dimension_label = "Hobby: Scuba diving"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_scuba_diving=Avid"
adherence_signal = "The days chosen are dives (the wreck dive, the reef drift, the night dive) rather than the kayaking, paddleboarding and snorkelling days the centre pushes. Each option id maps to a `depthgauge` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_synthwave"
dimension_label = "Music: Synthwave"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_synthwave=Dislike"
adherence_signal = "The sets chosen are the non-synthwave ones (blues, folk, country); no synthwave set is booked, even though the centre pushes the synthwave DJ, the retrowave act and the outrun night. Each option id maps to a `outrun` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
