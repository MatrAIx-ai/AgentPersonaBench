version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/depths-not-synthwave-web"
theme = "Hobby: Scuba diving = Avid · Music: Synthwave = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "scuba-diving", "synthwave", "coastal-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: depths-not-synthwave.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every day is on the water (so being outdoors is common to both sides) and the boathouse is alcohol-free (the persona drinks none); the alternative days are water hobbies the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its diving and its distaste for synthwave.
[[checks]]
dimension_id = "hob_scuba_diving"
dimension_label = "Hobby: Scuba diving"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_scuba_diving=Avid"
adherence_signal = "The days chosen are dives (the wreck dive, the reef drift, the night dive) rather than the kayaking, paddleboarding and snorkelling days the centre pushes. Ground truth is each item's data-depthgauge attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_synthwave"
dimension_label = "Music: Synthwave"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_synthwave=Dislike"
adherence_signal = "The sets chosen are the non-synthwave ones (blues, folk, country); no synthwave set is booked, even though the centre pushes the synthwave DJ, the retrowave act and the outrun night. Ground truth is each item's data-outrun attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
