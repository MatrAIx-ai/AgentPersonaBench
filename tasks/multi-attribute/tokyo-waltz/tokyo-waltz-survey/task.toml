version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tokyo-waltz-survey"
theme = "Music: J-pop = Love · Hobby: Ballroom dance = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "j-pop", "ballroom", "studio-socials", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tokyo-waltz.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every social night costs the same, runs the same hours and is alcohol-free; the alternative music themes are ones the persona rates neutral and the alternative dance nights are just as social — so the picks isolate the persona's own J-pop taste and its ballroom dancing.
[[checks]]
dimension_id = "musg_j_pop"
dimension_label = "Music: J-pop"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_j_pop=Love"
adherence_signal = "The social nights chosen are the J-pop-themed ones rather than the equally danceable big-band, chart-pop and 80s-synth nights the studio pushes. Each option id maps to a `jpop` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_ballroom_dance"
dimension_label = "Hobby: Ballroom dance"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_ballroom_dance=Active"
adherence_signal = "The social nights chosen are ballroom nights (waltz and foxtrot, tango and quickstep, beginners' mixer) rather than the equally social line-dancing, street-dance and Zumba nights the studio pushes. Each option id maps to a `ballroom` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
