version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tokyo-waltz-chat"
theme = "Music: J-pop = Love · Hobby: Ballroom dance = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "dance_studio_desk"
tags = [ "persona-adherence", "multi-check", "j-pop", "ballroom", "studio-socials", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tokyo-waltz.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every social night costs the same, runs the same hours and is alcohol-free; the alternative music themes are ones the persona rates neutral and the alternative dance nights are just as social — so the picks isolate the persona's own J-pop taste and its ballroom dancing.
[[checks]]
dimension_id = "musg_j_pop"
dimension_label = "Music: J-pop"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_j_pop=Love"
adherence_signal = "The social nights chosen are the J-pop-themed ones rather than the equally danceable big-band, chart-pop and 80s-synth nights the studio pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_ballroom_dance"
dimension_label = "Hobby: Ballroom dance"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_ballroom_dance=Active"
adherence_signal = "The social nights chosen are ballroom nights (waltz and foxtrot, tango and quickstep, beginners' mixer) rather than the equally social line-dancing, street-dance and Zumba nights the studio pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
