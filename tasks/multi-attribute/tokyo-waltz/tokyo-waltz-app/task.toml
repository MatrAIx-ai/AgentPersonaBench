version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tokyo-waltz-app"
theme = "Music: J-pop = Love · Hobby: Ballroom dance = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "j-pop", "ballroom", "studio-socials", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tokyo-waltz.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every social night costs the same, runs the same hours and is alcohol-free; the alternative music themes are ones the persona rates neutral and the alternative dance nights are just as social — so the picks isolate the persona's own J-pop taste and its ballroom dancing.
[[checks]]
dimension_id = "musg_j_pop"
dimension_label = "Music: J-pop"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_j_pop=Love"
adherence_signal = "The social nights chosen are the J-pop-themed ones rather than the equally danceable big-band, chart-pop and 80s-synth nights the studio pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_ballroom_dance"
dimension_label = "Hobby: Ballroom dance"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_ballroom_dance=Active"
adherence_signal = "The social nights chosen are ballroom nights (waltz and foxtrot, tango and quickstep, beginners' mixer) rather than the equally social line-dancing, street-dance and Zumba nights the studio pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FloorPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FloorPass once the desktop is up so the agent finds it on screen.
command = "/opt/floorpass/start-floorpass.sh"
timeout_sec = 60.0
retries = 5
