version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stanzas-not-strays-app"
theme = "Interest: Poetry = Passionate · Interest: Pets = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "poetry", "pets", "community-library", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stanzas-not-strays.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative circles are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its poetry and its distaste for pets.
[[checks]]
dimension_id = "topic_poetry"
dimension_label = "Interest: Poetry"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_poetry=Passionate"
adherence_signal = "The circles chosen are poetry (the reading circle, the writing workshop, the spoken-word open mic) rather than the philosophy, languages and sketching circles the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_pets=Averse"
adherence_signal = "The sessions chosen are the non-pets ones (night sky, board games, chess); no pets session is booked, even though the library pushes the dog-training demo, the cat-care talk and the rescue-animals afternoon. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysLibrary (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysLibrary once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayslibrary/start-saturdayslibrary.sh"
timeout_sec = 60.0
retries = 5
