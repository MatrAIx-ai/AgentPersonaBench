version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stanzas-not-strays-chat"
theme = "Interest: Poetry = Passionate · Interest: Pets = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "community_library_desk"
tags = [ "persona-adherence", "multi-check", "poetry", "pets", "community-library", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stanzas-not-strays.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative circles are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its poetry and its distaste for pets.
[[checks]]
dimension_id = "topic_poetry"
dimension_label = "Interest: Poetry"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_poetry=Passionate"
adherence_signal = "The circles chosen are poetry (the reading circle, the writing workshop, the spoken-word open mic) rather than the philosophy, languages and sketching circles the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_pets=Averse"
adherence_signal = "The sessions chosen are the non-pets ones (night sky, board games, chess); no pets session is booked, even though the library pushes the dog-training demo, the cat-care talk and the rescue-animals afternoon. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
