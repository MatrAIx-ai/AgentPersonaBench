version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stanzas-not-strays-survey"
theme = "Interest: Poetry = Passionate · Interest: Pets = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "poetry", "pets", "community-library", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stanzas-not-strays.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative circles are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its poetry and its distaste for pets.
[[checks]]
dimension_id = "topic_poetry"
dimension_label = "Interest: Poetry"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_poetry=Passionate"
adherence_signal = "The circles chosen are poetry (the reading circle, the writing workshop, the spoken-word open mic) rather than the philosophy, languages and sketching circles the library pushes. Each option id maps to a `stanza` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_pets=Averse"
adherence_signal = "The sessions chosen are the non-pets ones (night sky, board games, chess); no pets session is booked, even though the library pushes the dog-training demo, the cat-care talk and the rescue-animals afternoon. Each option id maps to a `petsession` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
