version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stanzas-not-strays-web"
theme = "Interest: Poetry = Passionate · Interest: Pets = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "poetry", "pets", "community-library", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stanzas-not-strays.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative circles are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its poetry and its distaste for pets.
[[checks]]
dimension_id = "topic_poetry"
dimension_label = "Interest: Poetry"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_poetry=Passionate"
adherence_signal = "The circles chosen are poetry (the reading circle, the writing workshop, the spoken-word open mic) rather than the philosophy, languages and sketching circles the library pushes. Ground truth is each item's data-stanza attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_pets=Averse"
adherence_signal = "The sessions chosen are the non-pets ones (night sky, board games, chess); no pets session is booked, even though the library pushes the dog-training demo, the cat-care talk and the rescue-animals afternoon. Ground truth is each item's data-petsession attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
