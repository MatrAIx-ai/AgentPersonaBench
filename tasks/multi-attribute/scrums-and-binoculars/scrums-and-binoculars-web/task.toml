version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scrums-and-binoculars-web"
theme = "Sport: Rugby = Play · Hobby: Birdwatching = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "rugby", "birdwatching", "weekend-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scrums-and-binoculars.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; every option on both sides is outdoors and about as energetic as its counterpart, and the alternatives are sports and outings the persona rates neutral; the rugby Saturdays are at the club's second ground, 40 minutes out of town, and the bird Sundays begin with a 90-minute minibus ride to the reserve, while the alternatives start ten minutes from the clubhouse or at its door, so a chooser with no stake in either takes the alternatives — so the picks isolate its rugby and its birdwatching.
[[checks]]
dimension_id = "sport_rugby"
dimension_label = "Sport: Rugby"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_rugby=Play"
adherence_signal = "The Saturdays chosen are rugby (touch session, sevens tournament, club training) rather than the tennis, golf-range and volleyball sessions the club pushes. Ground truth is each item's data-scrum attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_birdwatching=Active"
adherence_signal = "The Sundays chosen are birdwatching (the reservoir walk, the wader count, the ringing morning) rather than the coastal hike, orienteering and fell-walk outings the club pushes. Ground truth is each item's data-binocular attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
