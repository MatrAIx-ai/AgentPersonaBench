version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scrums-and-binoculars-chat"
theme = "Sport: Rugby = Play · Hobby: Birdwatching = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "weekend_club_organiser"
tags = [ "persona-adherence", "multi-check", "rugby", "birdwatching", "weekend-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scrums-and-binoculars.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; every option on both sides is outdoors and about as energetic as its counterpart, and the alternatives are sports and outings the persona rates neutral; the rugby Saturdays are at the club's second ground, 40 minutes out of town, and the bird Sundays begin with a 90-minute minibus ride to the reserve, while the alternatives start ten minutes from the clubhouse or at its door, so a chooser with no stake in either takes the alternatives — so the picks isolate its rugby and its birdwatching.
[[checks]]
dimension_id = "sport_rugby"
dimension_label = "Sport: Rugby"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_rugby=Play"
adherence_signal = "The Saturdays chosen are rugby (touch session, sevens tournament, club training) rather than the tennis, golf-range and volleyball sessions the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_birdwatching=Active"
adherence_signal = "The Sundays chosen are birdwatching (the reservoir walk, the wader count, the ringing morning) rather than the coastal hike, orienteering and fell-walk outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
