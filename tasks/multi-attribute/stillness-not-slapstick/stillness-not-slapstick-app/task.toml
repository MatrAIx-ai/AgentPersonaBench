version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stillness-not-slapstick-app"
theme = "Interest: Spirituality = Passionate · Film: Comedy = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spirituality", "comedy-films", "sunday-programme", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stillness-not-slapstick.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day ticket costs the same and both halves are the same length; the alternative mornings are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its spiritual life and its distaste for comedies, which are separate things: a contemplative person can still enjoy a heist film.
[[checks]]
dimension_id = "topic_spirituality"
dimension_label = "Interest: Spirituality"
category = "Worldview: Beliefs"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_spirituality=Passionate"
adherence_signal = "The mornings chosen are spiritual sessions (meditation-and-dharma talk, contemplative-prayer circle, spiritual-traditions seminar) rather than the garden-history, chess and baking mornings the hall pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_comedy=Dislike"
adherence_signal = "The films chosen are the non-comedies (animated feature, heist crime film, space adventure); no comedy is booked, even though the hall pushes the slapstick, the buddy comedy and the spoof. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HallSunday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HallSunday once the desktop is up so the agent finds it on screen.
command = "/opt/hallsunday/start-hallsunday.sh"
timeout_sec = 60.0
retries = 5
