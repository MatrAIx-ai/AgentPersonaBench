version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stillness-not-slapstick-web"
theme = "Interest: Spirituality = Passionate · Film: Comedy = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spirituality", "comedy-films", "sunday-programme", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stillness-not-slapstick.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day ticket costs the same and both halves are the same length; the alternative mornings are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its spiritual life and its distaste for comedies, which are separate things: a contemplative person can still enjoy a heist film.
[[checks]]
dimension_id = "topic_spirituality"
dimension_label = "Interest: Spirituality"
category = "Worldview: Beliefs"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_spirituality=Passionate"
adherence_signal = "The mornings chosen are spiritual sessions (meditation-and-dharma talk, contemplative-prayer circle, spiritual-traditions seminar) rather than the garden-history, chess and baking mornings the hall pushes. Ground truth is each item's data-stillness attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_comedy=Dislike"
adherence_signal = "The films chosen are the non-comedies (animated feature, heist crime film, space adventure); no comedy is booked, even though the hall pushes the slapstick, the buddy comedy and the spoof. Ground truth is each item's data-gagreel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
