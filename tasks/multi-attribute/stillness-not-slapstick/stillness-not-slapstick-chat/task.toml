version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stillness-not-slapstick-chat"
theme = "Interest: Spirituality = Passionate · Film: Comedy = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "community_hall_programmer"
tags = [ "persona-adherence", "multi-check", "spirituality", "comedy-films", "sunday-programme", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stillness-not-slapstick.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day ticket costs the same and both halves are the same length; the alternative mornings are topics the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its spiritual life and its distaste for comedies, which are separate things: a contemplative person can still enjoy a heist film.
[[checks]]
dimension_id = "topic_spirituality"
dimension_label = "Interest: Spirituality"
category = "Worldview: Beliefs"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_spirituality=Passionate"
adherence_signal = "The mornings chosen are spiritual sessions (meditation-and-dharma talk, contemplative-prayer circle, spiritual-traditions seminar) rather than the garden-history, chess and baking mornings the hall pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_comedy=Dislike"
adherence_signal = "The films chosen are the non-comedies (animated feature, heist crime film, space adventure); no comedy is booked, even though the hall pushes the slapstick, the buddy comedy and the spoof. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
