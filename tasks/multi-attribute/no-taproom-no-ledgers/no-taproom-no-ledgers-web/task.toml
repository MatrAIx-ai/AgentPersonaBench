version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-taproom-no-ledgers-web"
theme = "Interest: Craft beer = Averse · Books: Business = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "craft-beer", "business-books", "members-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-taproom-no-ledgers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for craft beer and its distaste for business books.
[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_craft_beer=Averse"
adherence_signal = "The sessions chosen are the non-craft-beer ones (coffee, photography, board games); no craft-beer session is booked, even though the club pushes the tasting flight, the brewery tour and the styles talk. Ground truth is each item's data-taproomslot attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_business=Dislike"
adherence_signal = "The books chosen are the non-business ones (the mystery, the fantasy, the popular science); no business book is booked, even though the club pushes the management bestseller, the negotiation book and the founder's playbook. Ground truth is each item's data-ledger attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
