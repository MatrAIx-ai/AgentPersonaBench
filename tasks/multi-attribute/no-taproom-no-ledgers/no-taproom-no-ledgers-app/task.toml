version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-taproom-no-ledgers-app"
theme = "Interest: Craft beer = Averse · Books: Business = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "craft-beer", "business-books", "members-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-taproom-no-ledgers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for craft beer and its distaste for business books.
[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_craft_beer=Averse"
adherence_signal = "The sessions chosen are the non-craft-beer ones (coffee, photography, board games); no craft-beer session is booked, even though the club pushes the tasting flight, the brewery tour and the styles talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_business=Dislike"
adherence_signal = "The books chosen are the non-business ones (the mystery, the fantasy, the popular science); no business book is booked, even though the club pushes the management bestseller, the negotiation book and the founder's playbook. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MeetupsMembers (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MeetupsMembers once the desktop is up so the agent finds it on screen.
command = "/opt/meetupsmembers/start-meetupsmembers.sh"
timeout_sec = 60.0
retries = 5
