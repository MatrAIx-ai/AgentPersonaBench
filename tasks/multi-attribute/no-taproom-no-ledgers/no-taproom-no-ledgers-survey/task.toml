version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-taproom-no-ledgers-survey"
theme = "Interest: Craft beer = Averse · Books: Business = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "craft-beer", "business-books", "members-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-taproom-no-ledgers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for craft beer and its distaste for business books.
[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_craft_beer=Averse"
adherence_signal = "The sessions chosen are the non-craft-beer ones (coffee, photography, board games); no craft-beer session is booked, even though the club pushes the tasting flight, the brewery tour and the styles talk. Each option id maps to a `taproomslot` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_business=Dislike"
adherence_signal = "The books chosen are the non-business ones (the mystery, the fantasy, the popular science); no business book is booked, even though the club pushes the management bestseller, the negotiation book and the founder's playbook. Each option id maps to a `ledger` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
