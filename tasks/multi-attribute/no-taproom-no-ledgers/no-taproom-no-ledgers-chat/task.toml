version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-taproom-no-ledgers-chat"
theme = "Interest: Craft beer = Averse · Books: Business = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "members_club_secretary"
tags = [ "persona-adherence", "multi-check", "craft-beer", "business-books", "members-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-taproom-no-ledgers.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the book is posted ahead; the alternative sessions are topics the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for craft beer and its distaste for business books.
[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_craft_beer=Averse"
adherence_signal = "The sessions chosen are the non-craft-beer ones (coffee, photography, board games); no craft-beer session is booked, even though the club pushes the tasting flight, the brewery tour and the styles talk. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_business=Dislike"
adherence_signal = "The books chosen are the non-business ones (the mystery, the fantasy, the popular science); no business book is booked, even though the club pushes the management bestseller, the negotiation book and the founder's playbook. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
