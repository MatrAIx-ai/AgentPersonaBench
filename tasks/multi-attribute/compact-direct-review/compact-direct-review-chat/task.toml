version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/compact-direct-review-chat"
theme = "Attention span = Short · Storytelling tendency = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "productivity"
application_id = "scenario_deck_coordinator"
tags = [ "persona-adherence", "multi-check", "tabletop-drill", "briefing-length", "narrative-structure", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: compact-direct-review.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every drill packet contains the same decision facts and takes the same total session time; only reading length and whether the facts are organized as a case story differ.
[[checks]]
dimension_id = "cog_attention_span"
dimension_label = "Attention span"
category = "Linguistic: Communication"
value = "Short"
evaluator = "llm-judge"
evaluator_name = "cog_attention_span=Short"
adherence_signal = "The selected packets use a compact one-screen scan rather than a sustained multi-page walkthrough. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cog_storytelling"
dimension_label = "Storytelling tendency"
category = "Linguistic: Communication"
value = "Low"
evaluator = "llm-judge"
evaluator_name = "cog_storytelling=Low"
adherence_signal = "The selected packets use a direct factual reference rather than a beginning-middle-end case story. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
