version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/compact-direct-review-app"
theme = "Attention span = Short · Storytelling tendency = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "productivity"
tags = [ "persona-adherence", "multi-check", "tabletop-drill", "briefing-length", "narrative-structure", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: compact-direct-review.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every drill packet contains the same decision facts and takes the same total session time; only reading length and whether the facts are organized as a case story differ.
[[checks]]
dimension_id = "cog_attention_span"
dimension_label = "Attention span"
category = "Linguistic: Communication"
value = "Short"
evaluator = "rule-based"
evaluator_name = "cog_attention_span=Short"
adherence_signal = "The selected packets use a compact one-screen scan rather than a sustained multi-page walkthrough. Submitted ID/name pairs are bound to the real app catalog, then evaluated with the host-only answer key; the app writes the artifact after real clicks."

[[checks]]
dimension_id = "cog_storytelling"
dimension_label = "Storytelling tendency"
category = "Linguistic: Communication"
value = "Low"
evaluator = "rule-based"
evaluator_name = "cog_storytelling=Low"
adherence_signal = "The selected packets use a direct factual reference rather than a beginning-middle-end case story. Submitted ID/name pairs are bound to the real app catalog, then evaluated with the host-only answer key; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScenarioPicker (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScenarioPicker once the desktop is up so the agent finds it on screen.
command = "/opt/scenariopicker/start-scenariopicker.sh"
timeout_sec = 60.0
retries = 5
