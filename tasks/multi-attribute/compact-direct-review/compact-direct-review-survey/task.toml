version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/compact-direct-review-survey"
theme = "Attention span = Short · Storytelling tendency = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "productivity"
tags = [ "persona-adherence", "multi-check", "tabletop-drill", "briefing-length", "narrative-structure", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: compact-direct-review.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every drill packet contains the same decision facts and takes the same total session time; only reading length and whether the facts are organized as a case story differ.
[[checks]]
dimension_id = "cog_attention_span"
dimension_label = "Attention span"
category = "Linguistic: Communication"
value = "Short"
evaluator = "rule-based"
evaluator_name = "cog_attention_span=Short"
adherence_signal = "The selected packets use a compact one-screen scan rather than a sustained multi-page walkthrough. Each option id maps to a `longread` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cog_storytelling"
dimension_label = "Storytelling tendency"
category = "Linguistic: Communication"
value = "Low"
evaluator = "rule-based"
evaluator_name = "cog_storytelling=Low"
adherence_signal = "The selected packets use a direct factual reference rather than a beginning-middle-end case story. Each option id maps to a `narrative` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
