version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stitch-not-standup-app"
theme = "Hobby: Embroidery = Active · Interest: Stand-up comedy = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "embroidery", "stand-up-comedy", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stitch-not-standup.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative late shows forms it rates neutral — so the picks isolate its embroidery and its distaste for stand-up comedy.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_embroidery=Active"
adherence_signal = "The workshops chosen are embroidery (crewel work, sashiko, goldwork) rather than the origami, calligraphy and scrapbooking workshops the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_stand_up_comedy"
dimension_label = "Interest: Stand-up comedy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_stand_up_comedy=Averse"
adherence_signal = "The late shows chosen are the non-comedy ones (magic, dance, the one-act drama); no stand-up show is booked, even though the centre pushes the open mic, the touring comic and the roast. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DoubleFriday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DoubleFriday once the desktop is up so the agent finds it on screen.
command = "/opt/doublefriday/start-doublefriday.sh"
timeout_sec = 60.0
retries = 5
