version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stitch-not-standup-survey"
theme = "Hobby: Embroidery = Active · Interest: Stand-up comedy = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "embroidery", "stand-up-comedy", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stitch-not-standup.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative late shows forms it rates neutral — so the picks isolate its embroidery and its distaste for stand-up comedy.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_embroidery=Active"
adherence_signal = "The workshops chosen are embroidery (crewel work, sashiko, goldwork) rather than the origami, calligraphy and scrapbooking workshops the centre pushes. Each option id maps to a `needle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_stand_up_comedy"
dimension_label = "Interest: Stand-up comedy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_stand_up_comedy=Averse"
adherence_signal = "The late shows chosen are the non-comedy ones (magic, dance, the one-act drama); no stand-up show is booked, even though the centre pushes the open mic, the touring comic and the roast. Each option id maps to a `openmic` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
