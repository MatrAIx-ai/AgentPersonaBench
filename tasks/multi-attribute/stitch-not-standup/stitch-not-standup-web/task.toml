version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stitch-not-standup-web"
theme = "Hobby: Embroidery = Active · Interest: Stand-up comedy = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "embroidery", "stand-up-comedy", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stitch-not-standup.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative late shows forms it rates neutral — so the picks isolate its embroidery and its distaste for stand-up comedy.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_embroidery=Active"
adherence_signal = "The workshops chosen are embroidery (crewel work, sashiko, goldwork) rather than the origami, calligraphy and scrapbooking workshops the centre pushes. Ground truth is each item's data-needle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_stand_up_comedy"
dimension_label = "Interest: Stand-up comedy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_stand_up_comedy=Averse"
adherence_signal = "The late shows chosen are the non-comedy ones (magic, dance, the one-act drama); no stand-up show is booked, even though the centre pushes the open mic, the touring comic and the roast. Ground truth is each item's data-openmic attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
