version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stitch-not-standup-chat"
theme = "Hobby: Embroidery = Active · Interest: Stand-up comedy = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "arts_centre_friday_desk"
tags = [ "persona-adherence", "multi-check", "embroidery", "stand-up-comedy", "arts-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stitch-not-standup.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative late shows forms it rates neutral — so the picks isolate its embroidery and its distaste for stand-up comedy.
[[checks]]
dimension_id = "hob_embroidery"
dimension_label = "Hobby: Embroidery"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_embroidery=Active"
adherence_signal = "The workshops chosen are embroidery (crewel work, sashiko, goldwork) rather than the origami, calligraphy and scrapbooking workshops the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_stand_up_comedy"
dimension_label = "Interest: Stand-up comedy"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_stand_up_comedy=Averse"
adherence_signal = "The late shows chosen are the non-comedy ones (magic, dance, the one-act drama); no stand-up show is booked, even though the centre pushes the open mic, the touring comic and the roast. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
