version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dim-sum-and-drives-app"
theme = "Cuisine: Cantonese = Love · Sport: Table tennis = Play"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "cantonese-cuisine", "table-tennis", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dim-sum-and-drives.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and every supper is pork-free and alcohol-free; the alternative activities are indoor sports the persona rates neutral and the alternative suppers cuisines it rates neutral — so the picks isolate its table tennis and its taste for Cantonese food.
[[checks]]
dimension_id = "cuis_cantonese"
dimension_label = "Cuisine: Cantonese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_cantonese=Love"
adherence_signal = "The suppers chosen are Cantonese (dim sum, roast-chicken rice, wonton noodles) rather than the Lebanese, Peruvian and Thai suppers the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_table_tennis"
dimension_label = "Sport: Table tennis"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_table_tennis=Play"
adherence_signal = "The activities chosen are table tennis (league night, doubles ladder, coaching hour) rather than the badminton, darts and bowling nights the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightsCentre (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightsCentre once the desktop is up so the agent finds it on screen.
command = "/opt/nightscentre/start-nightscentre.sh"
timeout_sec = 60.0
retries = 5
