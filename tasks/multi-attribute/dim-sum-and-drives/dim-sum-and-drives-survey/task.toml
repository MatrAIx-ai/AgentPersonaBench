version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dim-sum-and-drives-survey"
theme = "Cuisine: Cantonese = Love · Sport: Table tennis = Play"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "cantonese-cuisine", "table-tennis", "community-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dim-sum-and-drives.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and every supper is pork-free and alcohol-free; the alternative activities are indoor sports the persona rates neutral and the alternative suppers cuisines it rates neutral — so the picks isolate its table tennis and its taste for Cantonese food.
[[checks]]
dimension_id = "cuis_cantonese"
dimension_label = "Cuisine: Cantonese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_cantonese=Love"
adherence_signal = "The suppers chosen are Cantonese (dim sum, roast-chicken rice, wonton noodles) rather than the Lebanese, Peruvian and Thai suppers the centre pushes. Each option id maps to a `dimsum` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_table_tennis"
dimension_label = "Sport: Table tennis"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_table_tennis=Play"
adherence_signal = "The activities chosen are table tennis (league night, doubles ladder, coaching hour) rather than the badminton, darts and bowling nights the centre pushes. Each option id maps to a `paddle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
