version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mma-not-polytheory-survey"
theme = "Sport: MMA = Follow · Subject: Political theory = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "mma", "political-theory", "sports-and-learning-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: mma-not-polytheory.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, both halves are the same length and the clubhouse is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative talks subjects it rates neutral; the MMA side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its MMA fandom and its distaste for political theory.
[[checks]]
dimension_id = "sport_mma"
dimension_label = "Sport: MMA"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_mma=Follow"
adherence_signal = "The outings chosen are MMA (the fight-night screening, the live card, the title-fight screening) rather than the golf, tennis and bowling outings the club pushes. Each option id maps to a `cagefan` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_political_theory"
dimension_label = "Subject: Political theory"
category = "Worldview: Beliefs"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_political_theory=Averse"
adherence_signal = "The talks chosen are the non-political-theory ones (economics, geography, psychology); no political-theory talk is booked, even though the club pushes the social contract, justice and democracy. Each option id maps to a `contracttalk` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
