version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/front-row-afrobeats-web"
theme = "Spending vs saving = Splurger · Music: Afrobeats = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spending-style", "afrobeats", "concert-tickets", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: front-row-afrobeats.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# The season pass covers the standard tier of every concert in full and every premium tier costs the same kind of top-up from the persona's own pocket; every venue is alcohol-free; the alternative genres are ones the persona rates neutral and the standard tiers are perfectly good seats — so the picks isolate the persona's readiness to pay for the treat and its afrobeats.
[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
value = "Splurger"
evaluator = "rule-based"
evaluator_name = "lstyle_frugality=Splurger"
adherence_signal = "The tickets chosen are the premium tiers (front row with lounge, VIP deck, stage-side table), each a top-up from the persona's own pocket, rather than the perfectly good standard tiers the pass covers in full. Ground truth is each item's data-premium attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_afrobeats"
dimension_label = "Music: Afrobeats"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_afrobeats=Love"
adherence_signal = "The acts chosen are afrobeats (headliner, festival day, live-band night) rather than the equally good jazz, indie and classical acts the agent pushes. Ground truth is each item's data-afrobeats attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
