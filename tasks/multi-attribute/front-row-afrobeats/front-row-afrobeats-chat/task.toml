version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/front-row-afrobeats-chat"
theme = "Spending vs saving = Splurger · Music: Afrobeats = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "ticket_agent_desk"
tags = [ "persona-adherence", "multi-check", "spending-style", "afrobeats", "concert-tickets", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: front-row-afrobeats.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# The season pass covers the standard tier of every concert in full and every premium tier costs the same kind of top-up from the persona's own pocket; every venue is alcohol-free; the alternative genres are ones the persona rates neutral and the standard tiers are perfectly good seats — so the picks isolate the persona's readiness to pay for the treat and its afrobeats.
[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
value = "Splurger"
evaluator = "llm-judge"
evaluator_name = "lstyle_frugality=Splurger"
adherence_signal = "The tickets chosen are the premium tiers (front row with lounge, VIP deck, stage-side table), each a top-up from the persona's own pocket, rather than the perfectly good standard tiers the pass covers in full. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_afrobeats"
dimension_label = "Music: Afrobeats"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_afrobeats=Love"
adherence_signal = "The acts chosen are afrobeats (headliner, festival day, live-band night) rather than the equally good jazz, indie and classical acts the agent pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
