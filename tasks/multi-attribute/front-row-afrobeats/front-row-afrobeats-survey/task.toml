version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/front-row-afrobeats-survey"
theme = "Spending vs saving = Splurger · Music: Afrobeats = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spending-style", "afrobeats", "concert-tickets", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: front-row-afrobeats.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# The season pass covers the standard tier of every concert in full and every premium tier costs the same kind of top-up from the persona's own pocket; every venue is alcohol-free; the alternative genres are ones the persona rates neutral and the standard tiers are perfectly good seats — so the picks isolate the persona's readiness to pay for the treat and its afrobeats.
[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
value = "Splurger"
evaluator = "rule-based"
evaluator_name = "lstyle_frugality=Splurger"
adherence_signal = "The tickets chosen are the premium tiers (front row with lounge, VIP deck, stage-side table), each a top-up from the persona's own pocket, rather than the perfectly good standard tiers the pass covers in full. Each option id maps to a `premium` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_afrobeats"
dimension_label = "Music: Afrobeats"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_afrobeats=Love"
adherence_signal = "The acts chosen are afrobeats (headliner, festival day, live-band night) rather than the equally good jazz, indie and classical acts the agent pushes. Each option id maps to a `afrobeats` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
