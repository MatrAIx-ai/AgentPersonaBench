version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-history-no-smorgasbord-survey"
theme = "Books: History = Dislike · Cuisine: Scandinavian = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "history", "scandinavian-cuisine", "book-and-supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-history-no-smorgasbord.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-Scandinavian suppers cuisines it rates neutral — so the picks isolate its distaste for history books and its distaste for Scandinavian food.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_history=Dislike"
adherence_signal = "The books chosen are the non-history ones (the literary novel, the mystery, the science fiction); no history book is booked, even though the club pushes the Roman empire, the Cold War and the printing press. Each option id maps to a `chronicle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_scandinavian"
dimension_label = "Cuisine: Scandinavian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_scandinavian=Avoid"
adherence_signal = "The suppers chosen are the non-Scandinavian ones (Italian, Korean, Indian); no Scandinavian supper is booked, even though the club pushes the meatballs, the smørrebrød and the lamb stew. Each option id maps to a `smorgasboard` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
