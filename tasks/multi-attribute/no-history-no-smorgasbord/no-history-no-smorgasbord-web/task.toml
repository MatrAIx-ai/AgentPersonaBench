version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-history-no-smorgasbord-web"
theme = "Books: History = Dislike · Cuisine: Scandinavian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "history", "scandinavian-cuisine", "book-and-supper-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-history-no-smorgasbord.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-Scandinavian suppers cuisines it rates neutral — so the picks isolate its distaste for history books and its distaste for Scandinavian food.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_history=Dislike"
adherence_signal = "The books chosen are the non-history ones (the literary novel, the mystery, the science fiction); no history book is booked, even though the club pushes the Roman empire, the Cold War and the printing press. Ground truth is each item's data-chronicle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_scandinavian"
dimension_label = "Cuisine: Scandinavian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_scandinavian=Avoid"
adherence_signal = "The suppers chosen are the non-Scandinavian ones (Italian, Korean, Indian); no Scandinavian supper is booked, even though the club pushes the meatballs, the smørrebrød and the lamb stew. Ground truth is each item's data-smorgasboard attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
