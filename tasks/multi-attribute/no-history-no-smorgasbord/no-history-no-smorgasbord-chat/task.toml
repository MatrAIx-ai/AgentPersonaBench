version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-history-no-smorgasbord-chat"
theme = "Books: History = Dislike · Cuisine: Scandinavian = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "volume_venue_club_host"
tags = [ "persona-adherence", "multi-check", "history", "scandinavian-cuisine", "book-and-supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-history-no-smorgasbord.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-Scandinavian suppers cuisines it rates neutral — so the picks isolate its distaste for history books and its distaste for Scandinavian food.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_history=Dislike"
adherence_signal = "The books chosen are the non-history ones (the literary novel, the mystery, the science fiction); no history book is booked, even though the club pushes the Roman empire, the Cold War and the printing press. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_scandinavian"
dimension_label = "Cuisine: Scandinavian"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_scandinavian=Avoid"
adherence_signal = "The suppers chosen are the non-Scandinavian ones (Italian, Korean, Indian); no Scandinavian supper is booked, even though the club pushes the meatballs, the smørrebrød and the lamb stew. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
