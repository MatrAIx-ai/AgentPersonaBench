version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-history-no-smorgasbord-app"
theme = "Books: History = Dislike · Cuisine: Scandinavian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "history", "scandinavian-cuisine", "book-and-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-history-no-smorgasbord.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-Scandinavian suppers cuisines it rates neutral — so the picks isolate its distaste for history books and its distaste for Scandinavian food.
[[checks]]
dimension_id = "bookg_history"
dimension_label = "Books: History"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_history=Dislike"
adherence_signal = "The books chosen are the non-history ones (the literary novel, the mystery, the science fiction); no history book is booked, even though the club pushes the Roman empire, the Cold War and the printing press. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_scandinavian"
dimension_label = "Cuisine: Scandinavian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_scandinavian=Avoid"
adherence_signal = "The suppers chosen are the non-Scandinavian ones (Italian, Korean, Indian); no Scandinavian supper is booked, even though the club pushes the meatballs, the smørrebrød and the lamb stew. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with VenueAndVolume (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch VenueAndVolume once the desktop is up so the agent finds it on screen.
command = "/opt/venueandvolume/start-venueandvolume.sh"
timeout_sec = 60.0
retries = 5
