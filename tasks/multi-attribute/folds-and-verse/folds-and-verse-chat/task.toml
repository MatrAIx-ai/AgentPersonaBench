version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/folds-and-verse-chat"
theme = "Hobby: Origami = Active · Books: Poetry = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "evening_kit_curator"
tags = [ "persona-adherence", "multi-check", "origami", "poetry", "quiet-evening-kits", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: folds-and-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit costs the same and takes about the same evening; the alternative crafts are paper crafts the persona rates neutral (its own other crafts — pottery, juggling, model building — are kept off both sides) and the alternative books are genres it rates neutral — so the picks isolate its origami and its taste for poetry.
[[checks]]
dimension_id = "hob_origami"
dimension_label = "Hobby: Origami"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_origami=Active"
adherence_signal = "The crafts chosen are origami kits (crane-and-lily, modular origami, tessellation) rather than the scrapbooking, calligraphy and card-making kits the subscription pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_poetry=Love"
adherence_signal = "The books chosen are poetry (a new collection, a selected poems, a book of sonnets) rather than the mystery, popular-science and travel paperbacks the subscription pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
