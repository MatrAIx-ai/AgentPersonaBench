version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/folds-and-verse-web"
theme = "Hobby: Origami = Active · Books: Poetry = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "origami", "poetry", "quiet-evening-kits", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: folds-and-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit costs the same and takes about the same evening; the alternative crafts are paper crafts the persona rates neutral (its own other crafts — pottery, juggling, model building — are kept off both sides) and the alternative books are genres it rates neutral — so the picks isolate its origami and its taste for poetry.
[[checks]]
dimension_id = "hob_origami"
dimension_label = "Hobby: Origami"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_origami=Active"
adherence_signal = "The crafts chosen are origami kits (crane-and-lily, modular origami, tessellation) rather than the scrapbooking, calligraphy and card-making kits the subscription pushes. Ground truth is each item's data-folds attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_poetry=Love"
adherence_signal = "The books chosen are poetry (a new collection, a selected poems, a book of sonnets) rather than the mystery, popular-science and travel paperbacks the subscription pushes. Ground truth is each item's data-verse attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
