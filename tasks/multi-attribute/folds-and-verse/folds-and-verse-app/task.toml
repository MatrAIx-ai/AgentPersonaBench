version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/folds-and-verse-app"
theme = "Hobby: Origami = Active · Books: Poetry = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "origami", "poetry", "quiet-evening-kits", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: folds-and-verse.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every kit costs the same and takes about the same evening; the alternative crafts are paper crafts the persona rates neutral (its own other crafts — pottery, juggling, model building — are kept off both sides) and the alternative books are genres it rates neutral — so the picks isolate its origami and its taste for poetry.
[[checks]]
dimension_id = "hob_origami"
dimension_label = "Hobby: Origami"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_origami=Active"
adherence_signal = "The crafts chosen are origami kits (crane-and-lily, modular origami, tessellation) rather than the scrapbooking, calligraphy and card-making kits the subscription pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_poetry"
dimension_label = "Books: Poetry"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_poetry=Love"
adherence_signal = "The books chosen are poetry (a new collection, a selected poems, a book of sonnets) rather than the mystery, popular-science and travel paperbacks the subscription pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with KitsQuiet (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch KitsQuiet once the desktop is up so the agent finds it on screen.
command = "/opt/kitsquiet/start-kitsquiet.sh"
timeout_sec = 60.0
retries = 5
