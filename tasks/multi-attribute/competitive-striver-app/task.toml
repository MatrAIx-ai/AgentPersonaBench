version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/competitive-striver-app"
theme = "Competitive striver: competitiveness · relatedness · achievement"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "professional"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE shopping session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds
# one cart from a board of opportunities; the verifier runs an independent
# rule-based check per attribute. Each item carries three hidden ground-truth
# axes (ax1/ax2/ax3, 0..3) that are NEVER shown on screen — the agent sees only
# name + price and must judge for itself. A check is HELD iff no selected item
# scores >= 2 on its axis. Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "trait_competitiveness"
dimension_label = "Character: Competitiveness"
category = "Personality: Character"
attribute = "Character: Competitiveness"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_competitiveness=Strong"
metric = "ax1_axis_max"                     # HELD iff no picked item has ax1 >= 2
adherence_signal = "The checked-out cart contains no non-competitive item (hidden ax1 >= 2); a strongly competitive person plays to win and enters the contest."

[[checks]]
dimension_id = "sdt_need_relatedness"
dimension_label = "SDT Relatedness Need"
category = "Values & Motivation"
attribute = "SDT Relatedness Need"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "sdt_need_relatedness=Very high"
metric = "ax2_axis_max"                     # HELD iff no picked item has ax2 >= 2
adherence_signal = "The cart contains no detached / goes-it-alone item (hidden ax2 >= 2); someone with a very high need for relatedness picks what keeps them connected to the group over what isolates them."

[[checks]]
dimension_id = "schwartz_value_achievement"
dimension_label = "Schwartz Achievement"
category = "Values & Motivation"
attribute = "Schwartz Achievement"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_achievement=High"
metric = "ax3_axis_max"                     # HELD iff no picked item has ax3 >= 2
adherence_signal = "The cart contains no achievement-indifferent item (hidden ax3 >= 2); someone who values achievement highly cares about excelling and demonstrating competence."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
