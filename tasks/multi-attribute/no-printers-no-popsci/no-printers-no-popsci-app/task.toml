version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-printers-no-popsci-app"
theme = "Interest: 3D printing = Averse · Books: Popular science = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "3d-printing", "popular-science", "science-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-printers-no-popsci.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every visit costs the same and the book is posted ahead; the alternative workshops are crafts the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for 3D printing and its distaste for popular science.
[[checks]]
dimension_id = "topic_3d_printing"
dimension_label = "Interest: 3D printing"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_3d_printing=Averse"
adherence_signal = "The workshops chosen are the non-3D-printing ones (candle, origami, calligraphy); no printing workshop is booked, even though the centre pushes printer basics, the keyring session and the resin demo. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_popular_science"
dimension_label = "Books: Popular science"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_popular_science=Dislike"
adherence_signal = "The books chosen are the non-science ones (the literary novel, the memoir, the fantasy novel); no popular science is booked, even though the centre pushes the physics book, the microbiome book and the history of the universe. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LibraryAndWorkshop (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LibraryAndWorkshop once the desktop is up so the agent finds it on screen.
command = "/opt/libraryandworkshop/start-libraryandworkshop.sh"
timeout_sec = 60.0
retries = 5
