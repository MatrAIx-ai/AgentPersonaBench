version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-printers-no-popsci-survey"
theme = "Interest: 3D printing = Averse · Books: Popular science = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "3d-printing", "popular-science", "science-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-printers-no-popsci.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every visit costs the same and the book is posted ahead; the alternative workshops are crafts the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for 3D printing and its distaste for popular science.
[[checks]]
dimension_id = "topic_3d_printing"
dimension_label = "Interest: 3D printing"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_3d_printing=Averse"
adherence_signal = "The workshops chosen are the non-3D-printing ones (candle, origami, calligraphy); no printing workshop is booked, even though the centre pushes printer basics, the keyring session and the resin demo. Each option id maps to a `filament` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_popular_science"
dimension_label = "Books: Popular science"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_popular_science=Dislike"
adherence_signal = "The books chosen are the non-science ones (the literary novel, the memoir, the fantasy novel); no popular science is booked, even though the centre pushes the physics book, the microbiome book and the history of the universe. Each option id maps to a `popsci` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
