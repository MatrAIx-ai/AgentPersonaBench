version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-printers-no-popsci-chat"
theme = "Interest: 3D printing = Averse · Books: Popular science = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "science_centre_members_desk"
tags = [ "persona-adherence", "multi-check", "3d-printing", "popular-science", "science-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-printers-no-popsci.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every visit costs the same and the book is posted ahead; the alternative workshops are crafts the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for 3D printing and its distaste for popular science.
[[checks]]
dimension_id = "topic_3d_printing"
dimension_label = "Interest: 3D printing"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_3d_printing=Averse"
adherence_signal = "The workshops chosen are the non-3D-printing ones (candle, origami, calligraphy); no printing workshop is booked, even though the centre pushes printer basics, the keyring session and the resin demo. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_popular_science"
dimension_label = "Books: Popular science"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_popular_science=Dislike"
adherence_signal = "The books chosen are the non-science ones (the literary novel, the memoir, the fantasy novel); no popular science is booked, even though the centre pushes the physics book, the microbiome book and the history of the universe. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
