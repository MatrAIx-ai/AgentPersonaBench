version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chemistry-and-soccer-app"
theme = "Subject: Chemistry = Passionate · Sport: Soccer = Follow"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "chemistry", "soccer", "science-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: chemistry-and-soccer.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative labs are subjects the persona rates neutral and the alternative outings sports it rates neutral; the chemistry side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives; the football side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of chemistry and its football fandom.
[[checks]]
dimension_id = "acad_chemistry"
dimension_label = "Subject: Chemistry"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_chemistry=Passionate"
adherence_signal = "The labs chosen are chemistry (the periodic table, kitchen chemistry, molecules that built the modern world) rather than the physics, geography and economics sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_soccer"
dimension_label = "Sport: Soccer"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_soccer=Follow"
adherence_signal = "The outings chosen are football (the league match at the stadium, the derby screening, the cup semi-final screening) rather than the basketball, tennis and rugby outings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MatchdayAndLab (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MatchdayAndLab once the desktop is up so the agent finds it on screen.
command = "/opt/matchdayandlab/start-matchdayandlab.sh"
timeout_sec = 60.0
retries = 5
