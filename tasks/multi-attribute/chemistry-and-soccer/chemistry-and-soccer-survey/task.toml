version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chemistry-and-soccer-survey"
theme = "Subject: Chemistry = Passionate · Sport: Soccer = Follow"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "chemistry", "soccer", "science-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: chemistry-and-soccer.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative labs are subjects the persona rates neutral and the alternative outings sports it rates neutral; the chemistry side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives; the football side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of chemistry and its football fandom.
[[checks]]
dimension_id = "acad_chemistry"
dimension_label = "Subject: Chemistry"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_chemistry=Passionate"
adherence_signal = "The labs chosen are chemistry (the periodic table, kitchen chemistry, molecules that built the modern world) rather than the physics, geography and economics sessions the centre pushes. Each option id maps to a `benchflask` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_soccer"
dimension_label = "Sport: Soccer"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_soccer=Follow"
adherence_signal = "The outings chosen are football (the league match at the stadium, the derby screening, the cup semi-final screening) rather than the basketball, tennis and rugby outings the centre pushes. Each option id maps to a `terrace` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
