version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/board-alone-app"
theme = "Team vs solo work = Strongly solo · Hobby: Paddleboarding = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "paddleboarding", "team-vs-solo", "watersports-week", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: board-alone.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session costs the same, lasts the same and is on the same sheltered water; the alternative crafts are ones the persona rates neutral and the group formats are just as well run — so the picks isolate the persona's own paddleboarding and its preference for doing things on its own.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
value = "Strongly solo"
evaluator = "rule-based"
evaluator_name = "pref_team_vs_solo=Strongly solo"
adherence_signal = "The sessions chosen are the self-guided, one-person formats (private hire, dawn launch, own-pace loop) rather than the guided-group, paired-drill and relay formats the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_paddleboarding"
dimension_label = "Hobby: Paddleboarding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_paddleboarding=Active"
adherence_signal = "The crafts chosen are paddleboards rather than the equally easy kayak, skiff and canoe options the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LaunchPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LaunchPass once the desktop is up so the agent finds it on screen.
command = "/opt/launchpass/start-launchpass.sh"
timeout_sec = 60.0
retries = 5
