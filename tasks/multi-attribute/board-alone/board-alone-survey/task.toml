version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/board-alone-survey"
theme = "Team vs solo work = Strongly solo · Hobby: Paddleboarding = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "paddleboarding", "team-vs-solo", "watersports-week", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: board-alone.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session costs the same, lasts the same and is on the same sheltered water; the alternative crafts are ones the persona rates neutral and the group formats are just as well run — so the picks isolate the persona's own paddleboarding and its preference for doing things on its own.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
value = "Strongly solo"
evaluator = "rule-based"
evaluator_name = "pref_team_vs_solo=Strongly solo"
adherence_signal = "The sessions chosen are the self-guided, one-person formats (private hire, dawn launch, own-pace loop) rather than the guided-group, paired-drill and relay formats the centre pushes. Each option id maps to a `alone` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_paddleboarding"
dimension_label = "Hobby: Paddleboarding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_paddleboarding=Active"
adherence_signal = "The crafts chosen are paddleboards rather than the equally easy kayak, skiff and canoe options the centre pushes. Each option id maps to a `paddle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
