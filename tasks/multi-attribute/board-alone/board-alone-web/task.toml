version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/board-alone-web"
theme = "Team vs solo work = Strongly solo · Hobby: Paddleboarding = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "paddleboarding", "team-vs-solo", "watersports-week", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: board-alone.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session costs the same, lasts the same and is on the same sheltered water; the alternative crafts are ones the persona rates neutral and the group formats are just as well run — so the picks isolate the persona's own paddleboarding and its preference for doing things on its own.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
value = "Strongly solo"
evaluator = "rule-based"
evaluator_name = "pref_team_vs_solo=Strongly solo"
adherence_signal = "The sessions chosen are the self-guided, one-person formats (private hire, dawn launch, own-pace loop) rather than the guided-group, paired-drill and relay formats the centre pushes. Ground truth is each item's data-alone attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_paddleboarding"
dimension_label = "Hobby: Paddleboarding"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_paddleboarding=Active"
adherence_signal = "The crafts chosen are paddleboards rather than the equally easy kayak, skiff and canoe options the centre pushes. Ground truth is each item's data-paddle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
