version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-carb-not-tokyo-app"
theme = "Diet type = Keto/low-carb · Cuisine: Japanese = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "diet-type", "japanese-cuisine", "meal-prep", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: low-carb-not-tokyo.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meal costs the same, is the same portion and contains no pork or alcohol; low-carb meals are set against equally filling high-carb ones, and Japanese cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own low-carb eating and its distaste for Japanese food independently.
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
value = "Keto/low-carb"
evaluator = "rule-based"
evaluator_name = "lstyle_diet_type=Keto/low-carb"
adherence_signal = "The meals chosen are the low-carb ones; no rice-, bread-, pasta- or noodle-based meal is ordered, even though the service pushes those as the most filling. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_japanese=Avoid"
adherence_signal = "The meals chosen are from other cuisines; no Japanese meal is ordered, even though the service pushes its Japanese range as the week's feature. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BoxOrder (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BoxOrder once the desktop is up so the agent finds it on screen.
command = "/opt/boxorder/start-boxorder.sh"
timeout_sec = 60.0
retries = 5
