version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-carb-not-tokyo-web"
theme = "Diet type = Keto/low-carb · Cuisine: Japanese = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "diet-type", "japanese-cuisine", "meal-prep", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: low-carb-not-tokyo.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meal costs the same, is the same portion and contains no pork or alcohol; low-carb meals are set against equally filling high-carb ones, and Japanese cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own low-carb eating and its distaste for Japanese food independently.
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
value = "Keto/low-carb"
evaluator = "rule-based"
evaluator_name = "lstyle_diet_type=Keto/low-carb"
adherence_signal = "The meals chosen are the low-carb ones; no rice-, bread-, pasta- or noodle-based meal is ordered, even though the service pushes those as the most filling. Ground truth is each item's data-carbheavy attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_japanese=Avoid"
adherence_signal = "The meals chosen are from other cuisines; no Japanese meal is ordered, even though the service pushes its Japanese range as the week's feature. Ground truth is each item's data-japanese attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
