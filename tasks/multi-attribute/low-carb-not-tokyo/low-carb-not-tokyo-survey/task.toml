version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-carb-not-tokyo-survey"
theme = "Diet type = Keto/low-carb · Cuisine: Japanese = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "multi-check", "diet-type", "japanese-cuisine", "meal-prep", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: low-carb-not-tokyo.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meal costs the same, is the same portion and contains no pork or alcohol; low-carb meals are set against equally filling high-carb ones, and Japanese cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own low-carb eating and its distaste for Japanese food independently.
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
value = "Keto/low-carb"
evaluator = "rule-based"
evaluator_name = "lstyle_diet_type=Keto/low-carb"
adherence_signal = "The meals chosen are the low-carb ones; no rice-, bread-, pasta- or noodle-based meal is ordered, even though the service pushes those as the most filling. Each option id maps to a `carbheavy` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_japanese"
dimension_label = "Cuisine: Japanese"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_japanese=Avoid"
adherence_signal = "The meals chosen are from other cuisines; no Japanese meal is ordered, even though the service pushes its Japanese range as the week's feature. Each option id maps to a `japanese` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
