version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/two-stage-pass-app"
theme = "Music: Hip-hop = Love · Music: Trance = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "hip-hop", "trance", "festival-wristband", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: two-stage-pass.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening is free with the wristband and both slots are the same length; the alternative main-stage and tent genres are ones the persona rates neutral — so the picks isolate the persona's own taste for hip hop and for trance independently.
[[checks]]
dimension_id = "musg_hip_hop"
dimension_label = "Music: Hip-hop"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_hip_hop=Love"
adherence_signal = "The main-stage halves of the evenings are hip hop (headliner, rap collective, legends revue) rather than the equally big pop, reggae and Latin sets the wristband desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_trance"
dimension_label = "Music: Trance"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_trance=Love"
adherence_signal = "The tent halves of the evenings are trance (trance tent, sunrise trance, trance arena) rather than the equally good disco, reggaeton and lo-fi tents the desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StagePlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StagePlanner once the desktop is up so the agent finds it on screen.
command = "/opt/stageplanner/start-stageplanner.sh"
timeout_sec = 60.0
retries = 5
