version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/two-stage-pass-chat"
theme = "Music: Hip-hop = Love · Music: Trance = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "festival_wristband_desk"
tags = [ "persona-adherence", "multi-check", "hip-hop", "trance", "festival-wristband", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: two-stage-pass.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening is free with the wristband and both slots are the same length; the alternative main-stage and tent genres are ones the persona rates neutral — so the picks isolate the persona's own taste for hip hop and for trance independently.
[[checks]]
dimension_id = "musg_hip_hop"
dimension_label = "Music: Hip-hop"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_hip_hop=Love"
adherence_signal = "The main-stage halves of the evenings are hip hop (headliner, rap collective, legends revue) rather than the equally big pop, reggae and Latin sets the wristband desk pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_trance"
dimension_label = "Music: Trance"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_trance=Love"
adherence_signal = "The tent halves of the evenings are trance (trance tent, sunrise trance, trance arena) rather than the equally good disco, reggaeton and lo-fi tents the desk pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
