version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pitch-and-plate-web"
theme = "Sport: Soccer = Play · Cuisine: Vegan = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "soccer", "vegan-cuisine", "sunday-socials", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pitch-and-plate.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every sport is equally sociable and the same length, and every meal is generous with no pork or alcohol on either side — so the picks isolate the persona's own football and its taste for vegan food.
[[checks]]
dimension_id = "sport_soccer"
dimension_label = "Sport: Soccer"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_soccer=Play"
adherence_signal = "The Sunday packages chosen are football games (5-a-side league, 11-a-side, futsal) rather than the equally sociable badminton, touch-rugby and table-tennis sessions the club pushes. Ground truth is each item's data-pitch attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_vegan"
dimension_label = "Cuisine: Vegan"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_vegan=Love"
adherence_signal = "The team meals chosen are the vegan spreads (lentil dal, jackfruit tacos, chickpea curry) rather than the equally generous shawarma, kofta and sea-bream spreads the club pushes. Ground truth is each item's data-plantmenu attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
