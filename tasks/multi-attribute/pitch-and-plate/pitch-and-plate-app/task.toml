version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pitch-and-plate-app"
theme = "Sport: Soccer = Play · Cuisine: Vegan = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "soccer", "vegan-cuisine", "sunday-socials", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pitch-and-plate.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every sport is equally sociable and the same length, and every meal is generous with no pork or alcohol on either side — so the picks isolate the persona's own football and its taste for vegan food.
[[checks]]
dimension_id = "sport_soccer"
dimension_label = "Sport: Soccer"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_soccer=Play"
adherence_signal = "The Sunday packages chosen are football games (5-a-side league, 11-a-side, futsal) rather than the equally sociable badminton, touch-rugby and table-tennis sessions the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_vegan"
dimension_label = "Cuisine: Vegan"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_vegan=Love"
adherence_signal = "The team meals chosen are the vegan spreads (lentil dal, jackfruit tacos, chickpea curry) rather than the equally generous shawarma, kofta and sea-bream spreads the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SquadSunday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SquadSunday once the desktop is up so the agent finds it on screen.
command = "/opt/squadsunday/start-squadsunday.sh"
timeout_sec = 60.0
retries = 5
