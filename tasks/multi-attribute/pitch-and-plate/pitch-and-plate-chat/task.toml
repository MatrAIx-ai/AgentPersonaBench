version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pitch-and-plate-chat"
theme = "Sport: Soccer = Play · Cuisine: Vegan = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "sports_social_desk"
tags = [ "persona-adherence", "multi-check", "soccer", "vegan-cuisine", "sunday-socials", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pitch-and-plate.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every sport is equally sociable and the same length, and every meal is generous with no pork or alcohol on either side — so the picks isolate the persona's own football and its taste for vegan food.
[[checks]]
dimension_id = "sport_soccer"
dimension_label = "Sport: Soccer"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_soccer=Play"
adherence_signal = "The Sunday packages chosen are football games (5-a-side league, 11-a-side, futsal) rather than the equally sociable badminton, touch-rugby and table-tennis sessions the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_vegan"
dimension_label = "Cuisine: Vegan"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_vegan=Love"
adherence_signal = "The team meals chosen are the vegan spreads (lentil dal, jackfruit tacos, chickpea curry) rather than the equally generous shawarma, kofta and sea-bream spreads the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
