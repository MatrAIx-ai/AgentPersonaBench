version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/foil-not-phrasebook-web"
theme = "Sport: Fencing = Play · Interest: Languages = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "multi-check", "fencing", "languages", "term-bundles", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: foil-not-phrasebook.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every term bundle costs the same and both sessions are the same length; the alternative sports are ones the persona rates neutral and the non-language classes are just as practical — so the picks isolate the persona's own fencing and its distaste for language study.
[[checks]]
dimension_id = "sport_fencing"
dimension_label = "Sport: Fencing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_fencing=Play"
adherence_signal = "The sport halves of the bundles are fencing sessions (foil club night, épée coaching, sabre beginners) rather than the equally sociable badminton, table-tennis and archery sessions the centre pushes. Ground truth is each item's data-piste attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_languages"
dimension_label = "Interest: Languages"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_languages=Averse"
adherence_signal = "The class halves of the bundles are the non-language classes (photography, woodwork, first aid); no language class is booked, even though the centre pushes the language strand as its flagship. Ground truth is each item's data-lingo attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
