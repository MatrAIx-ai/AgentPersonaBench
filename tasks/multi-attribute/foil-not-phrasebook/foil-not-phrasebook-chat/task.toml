version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/foil-not-phrasebook-chat"
theme = "Sport: Fencing = Play · Interest: Languages = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "community_centre_desk"
tags = [ "persona-adherence", "multi-check", "fencing", "languages", "term-bundles", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: foil-not-phrasebook.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every term bundle costs the same and both sessions are the same length; the alternative sports are ones the persona rates neutral and the non-language classes are just as practical — so the picks isolate the persona's own fencing and its distaste for language study.
[[checks]]
dimension_id = "sport_fencing"
dimension_label = "Sport: Fencing"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_fencing=Play"
adherence_signal = "The sport halves of the bundles are fencing sessions (foil club night, épée coaching, sabre beginners) rather than the equally sociable badminton, table-tennis and archery sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_languages"
dimension_label = "Interest: Languages"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_languages=Averse"
adherence_signal = "The class halves of the bundles are the non-language classes (photography, woodwork, first aid); no language class is booked, even though the centre pushes the language strand as its flagship. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
