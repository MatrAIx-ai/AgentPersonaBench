version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swell-not-breaks-survey"
theme = "Sport: Surfing = Play · Music: Drum & bass = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "surfing", "drum-and-bass", "beach-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: swell-not-breaks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the beach stage is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its surfing and its distaste for drum and bass.
[[checks]]
dimension_id = "sport_surfing"
dimension_label = "Sport: Surfing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_surfing=Play"
adherence_signal = "The sessions chosen are surfing (the dawn session, the coached lesson, the point-break trip) rather than the swimming, badminton and volleyball sessions the centre pushes. Each option id maps to a `swell` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_drum_bass"
dimension_label = "Music: Drum & bass"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_drum_bass=Dislike"
adherence_signal = "The sets chosen are the non-drum-and-bass ones (jazz, soul, reggaeton); no drum-and-bass set is booked, even though the centre pushes the drum-and-bass DJ, the jungle night and the liquid set. Each option id maps to a `breakbeat` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
