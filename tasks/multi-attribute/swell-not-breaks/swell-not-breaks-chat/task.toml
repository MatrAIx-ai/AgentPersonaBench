version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swell-not-breaks-chat"
theme = "Sport: Surfing = Play · Music: Drum & bass = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "beach_centre_desk"
tags = [ "persona-adherence", "multi-check", "surfing", "drum-and-bass", "beach-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: swell-not-breaks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the beach stage is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its surfing and its distaste for drum and bass.
[[checks]]
dimension_id = "sport_surfing"
dimension_label = "Sport: Surfing"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_surfing=Play"
adherence_signal = "The sessions chosen are surfing (the dawn session, the coached lesson, the point-break trip) rather than the swimming, badminton and volleyball sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_drum_bass"
dimension_label = "Music: Drum & bass"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_drum_bass=Dislike"
adherence_signal = "The sets chosen are the non-drum-and-bass ones (jazz, soul, reggaeton); no drum-and-bass set is booked, even though the centre pushes the drum-and-bass DJ, the jungle night and the liquid set. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
