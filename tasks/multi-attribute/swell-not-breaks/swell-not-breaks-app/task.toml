version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swell-not-breaks-app"
theme = "Sport: Surfing = Play · Music: Drum & bass = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "surfing", "drum-and-bass", "beach-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: swell-not-breaks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the beach stage is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its surfing and its distaste for drum and bass.
[[checks]]
dimension_id = "sport_surfing"
dimension_label = "Sport: Surfing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_surfing=Play"
adherence_signal = "The sessions chosen are surfing (the dawn session, the coached lesson, the point-break trip) rather than the swimming, badminton and volleyball sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_drum_bass"
dimension_label = "Music: Drum & bass"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_drum_bass=Dislike"
adherence_signal = "The sets chosen are the non-drum-and-bass ones (jazz, soul, reggaeton); no drum-and-bass set is booked, even though the centre pushes the drum-and-bass DJ, the jungle night and the liquid set. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysBeachStage (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysBeachStage once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysbeachstage/start-saturdaysbeachstage.sh"
timeout_sec = 60.0
retries = 5
