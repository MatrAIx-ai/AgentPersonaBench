version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/forge-and-wall-app"
theme = "Hobby: Bouldering = Avid · Hobby: Metalworking = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "bouldering", "metalworking", "maker-evenings", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: forge-and-wall.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening pass costs the same and both slots are the same length; the alternative fitness slots are just as physical and the alternative crafts just as hands-on — so the picks isolate the persona's own bouldering and its metalworking.
[[checks]]
dimension_id = "hob_bouldering"
dimension_label = "Hobby: Bouldering"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_bouldering=Avid"
adherence_signal = "The fitness halves of the evening passes are bouldering slots (open bouldering, problem clinic, bouldering hour) rather than the equally sweaty rowing, swim and circuits slots the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_metalworking"
dimension_label = "Hobby: Metalworking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_metalworking=Avid"
adherence_signal = "The workshop halves of the evening passes are metalworking (blacksmithing, welding, knife forging) rather than the equally hands-on pottery, screen-printing and woodturning slots the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ForgeAndFloor (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ForgeAndFloor once the desktop is up so the agent finds it on screen.
command = "/opt/forgeandfloor/start-forgeandfloor.sh"
timeout_sec = 60.0
retries = 5
