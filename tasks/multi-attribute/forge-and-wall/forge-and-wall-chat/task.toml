version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/forge-and-wall-chat"
theme = "Hobby: Bouldering = Avid · Hobby: Metalworking = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "maker_centre_desk"
tags = [ "persona-adherence", "multi-check", "bouldering", "metalworking", "maker-evenings", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: forge-and-wall.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening pass costs the same and both slots are the same length; the alternative fitness slots are just as physical and the alternative crafts just as hands-on — so the picks isolate the persona's own bouldering and its metalworking.
[[checks]]
dimension_id = "hob_bouldering"
dimension_label = "Hobby: Bouldering"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_bouldering=Avid"
adherence_signal = "The fitness halves of the evening passes are bouldering slots (open bouldering, problem clinic, bouldering hour) rather than the equally sweaty rowing, swim and circuits slots the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_metalworking"
dimension_label = "Hobby: Metalworking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_metalworking=Avid"
adherence_signal = "The workshop halves of the evening passes are metalworking (blacksmithing, welding, knife forging) rather than the equally hands-on pottery, screen-printing and woodturning slots the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
