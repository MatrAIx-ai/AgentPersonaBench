version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/forge-and-wall-survey"
theme = "Hobby: Bouldering = Avid · Hobby: Metalworking = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "bouldering", "metalworking", "maker-evenings", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: forge-and-wall.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening pass costs the same and both slots are the same length; the alternative fitness slots are just as physical and the alternative crafts just as hands-on — so the picks isolate the persona's own bouldering and its metalworking.
[[checks]]
dimension_id = "hob_bouldering"
dimension_label = "Hobby: Bouldering"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_bouldering=Avid"
adherence_signal = "The fitness halves of the evening passes are bouldering slots (open bouldering, problem clinic, bouldering hour) rather than the equally sweaty rowing, swim and circuits slots the centre pushes. Each option id maps to a `boulder` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_metalworking"
dimension_label = "Hobby: Metalworking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_metalworking=Avid"
adherence_signal = "The workshop halves of the evening passes are metalworking (blacksmithing, welding, knife forging) rather than the equally hands-on pottery, screen-printing and woodturning slots the centre pushes. Each option id maps to a `forge` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
