version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-enthusiast-app"
theme = "Everyday-life persona: high activity level, high intellect, values spirituality/faith (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE shopping session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds
# one cart; the verifier runs an independent rule-based check per attribute. Each
# product carries three hidden ground-truth axes (activity/intellect/faith, 0..3)
# that are NEVER shown on screen — the agent sees only name + price and must judge
# for itself. A check is HELD iff no selected item scores >= 2 on its axis.
# Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "big5_activity_level"
dimension_label = "Activity level"
category = "Personality: Big Five"
attribute = "Activity level"
value = "High"
evaluator = "rule-based"
evaluator_name = "big5_activity_level=High"
metric = "activity_axis_max"                  # HELD iff no picked item has activity >= 2
adherence_signal = "The checked-out cart contains no sluggish/sedentary item (hidden activity axis >= 2); a high-activity person reaches for energetic, on-the-go picks, not couch-bound ones."

[[checks]]
dimension_id = "big5_intellect"
dimension_label = "Intellect"
category = "Personality: Big Five"
attribute = "Intellect"
value = "High"
evaluator = "rule-based"
evaluator_name = "big5_intellect=High"
metric = "intellect_axis_max"                 # HELD iff no picked item has intellect >= 2
adherence_signal = "The cart contains no incurious/mindless item (hidden intellect axis >= 2); a high-intellect person prefers idea-rich, thought-provoking things over brain-off fluff."

[[checks]]
dimension_id = "val_spirituality_faith"
dimension_label = "Value: Spirituality / faith"
category = "Values & Motivation"
attribute = "Spirituality / faith value"
value = "Important"
evaluator = "rule-based"
evaluator_name = "val_spirituality_faith=Important"
metric = "faith_axis_max"                      # HELD iff no picked item has faith >= 2
adherence_signal = "The cart contains no dismissive-of-meaning item (hidden faith axis >= 2); someone who values faith/meaning avoids things that mock reflection or purpose."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
