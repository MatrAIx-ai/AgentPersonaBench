version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hides-not-consoles-app"
theme = "Interest: Birdwatching = Passionate · Interest: Gaming = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "gaming", "nature-reserve", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hides-not-consoles.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every outing is outdoors (the persona is outdoor-leaning, so being outside is common to both sides) and the centre is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its birdwatching and its distaste for gaming.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_birdwatching=Passionate"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the photography, geocaching and sketching outings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_gaming"
dimension_label = "Interest: Gaming"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_gaming=Averse"
adherence_signal = "The sessions chosen are the non-gaming ones (board games, chess, magic); no gaming session is booked, even though the centre pushes the console tournament, the retro arcade and the VR session. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysReserve (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysReserve once the desktop is up so the agent finds it on screen.
command = "/opt/daysreserve/start-daysreserve.sh"
timeout_sec = 60.0
retries = 5
