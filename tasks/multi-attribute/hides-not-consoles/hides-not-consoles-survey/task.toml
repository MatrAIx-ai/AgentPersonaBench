version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hides-not-consoles-survey"
theme = "Interest: Birdwatching = Passionate · Interest: Gaming = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "gaming", "nature-reserve", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hides-not-consoles.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every outing is outdoors (the persona is outdoor-leaning, so being outside is common to both sides) and the centre is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its birdwatching and its distaste for gaming.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_birdwatching=Passionate"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the photography, geocaching and sketching outings the centre pushes. Each option id maps to a `warbler` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_gaming"
dimension_label = "Interest: Gaming"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_gaming=Averse"
adherence_signal = "The sessions chosen are the non-gaming ones (board games, chess, magic); no gaming session is booked, even though the centre pushes the console tournament, the retro arcade and the VR session. Each option id maps to a `joypad` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
