version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hides-not-consoles-chat"
theme = "Interest: Birdwatching = Passionate · Interest: Gaming = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "reserve_visitor_centre_desk"
tags = [ "persona-adherence", "multi-check", "birdwatching", "gaming", "nature-reserve", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hides-not-consoles.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every outing is outdoors (the persona is outdoor-leaning, so being outside is common to both sides) and the centre is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its birdwatching and its distaste for gaming.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_birdwatching=Passionate"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the photography, geocaching and sketching outings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_gaming"
dimension_label = "Interest: Gaming"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_gaming=Averse"
adherence_signal = "The sessions chosen are the non-gaming ones (board games, chess, magic); no gaming session is booked, even though the centre pushes the console tournament, the retro arcade and the VR session. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
