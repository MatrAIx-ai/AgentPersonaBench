version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hides-not-consoles-web"
theme = "Interest: Birdwatching = Passionate · Interest: Gaming = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "gaming", "nature-reserve", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hides-not-consoles.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every outing is outdoors (the persona is outdoor-leaning, so being outside is common to both sides) and the centre is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its birdwatching and its distaste for gaming.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_birdwatching=Passionate"
adherence_signal = "The outings chosen are birdwatching (the dawn-chorus walk, the wader hide, the raptor watch) rather than the photography, geocaching and sketching outings the centre pushes. Ground truth is each item's data-warbler attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_gaming"
dimension_label = "Interest: Gaming"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_gaming=Averse"
adherence_signal = "The sessions chosen are the non-gaming ones (board games, chess, magic); no gaming session is booked, even though the centre pushes the console tournament, the retro arcade and the VR session. Ground truth is each item's data-joypad attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
