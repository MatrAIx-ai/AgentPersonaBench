version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/haskell-sketch-prototype-survey"
theme = "Programming: Haskell = Expert · Skill: Drawing = Advanced"

[metadata]
difficulty = "easy"
type = "survey"
domain = "interactive-exhibit"
tags = [ "persona-adherence", "multi-check", "prototype", "functional-programming", "visual-sketching", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: haskell-sketch-prototype.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# All packages deliver the same tested kiosk prototype; implementation routes trade Haskell control for managed-builder convenience, and visual routes trade fixed on-site drawing and revision work for remotely commissioned reusable illustration components.
[[checks]]
dimension_id = "prog_haskell"
dimension_label = "Programming: Haskell"
category = "Skills: Programming"
value = "Expert"
evaluator = "rule-based"
evaluator_name = "prog_haskell=Expert"
adherence_signal = "Every selected prototype package implements the interaction layer in Haskell rather than a managed visual builder. Each option id is joined to the reviewed host-only tests/answer_key.json; scored on the same answers as the other check."

[[checks]]
dimension_id = "skill_drawing"
dimension_label = "Skill: Drawing"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_drawing=Advanced"
adherence_signal = "Every selected prototype package creates its visual studies personally by hand from a blank page rather than using professionally commissioned reusable illustration components. Each option id is joined to the reviewed host-only tests/answer_key.json; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
