version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/haskell-sketch-prototype-web"
theme = "Programming: Haskell = Expert · Skill: Drawing = Advanced"

[metadata]
difficulty = "medium"
type = "web"
domain = "interactive-exhibit"
tags = [ "persona-adherence", "multi-check", "prototype", "functional-programming", "visual-sketching", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: haskell-sketch-prototype.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# All packages deliver the same tested kiosk prototype; implementation routes trade Haskell control for managed-builder convenience, and visual routes trade fixed on-site drawing and revision work for remotely commissioned reusable illustration components.
[[checks]]
dimension_id = "prog_haskell"
dimension_label = "Programming: Haskell"
category = "Skills: Programming"
value = "Expert"
evaluator = "rule-based"
evaluator_name = "prog_haskell=Expert"
adherence_signal = "Every selected prototype package implements the interaction layer in Haskell rather than a managed visual builder. Visible DOM ids and text are joined to the reviewed host-only tests/answer_key.json; scored on the same cart as the other check."

[[checks]]
dimension_id = "skill_drawing"
dimension_label = "Skill: Drawing"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_drawing=Advanced"
adherence_signal = "Every selected prototype package creates its visual studies personally by hand from a blank page rather than using professionally commissioned reusable illustration components. Visible DOM ids and text are joined to the reviewed host-only tests/answer_key.json; scored on the same cart as the other check."

[verifier]
