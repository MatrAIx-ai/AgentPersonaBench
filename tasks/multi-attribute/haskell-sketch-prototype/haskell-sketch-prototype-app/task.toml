version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/haskell-sketch-prototype-app"
theme = "Programming: Haskell = Expert · Skill: Drawing = Advanced"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "interactive-exhibit"
tags = [ "persona-adherence", "multi-check", "prototype", "functional-programming", "visual-sketching", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: haskell-sketch-prototype.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# All packages deliver the same tested kiosk prototype; implementation routes trade Haskell control for managed-builder convenience, and visual routes trade fixed on-site drawing and revision work for remotely commissioned reusable illustration components.
[[checks]]
dimension_id = "prog_haskell"
dimension_label = "Programming: Haskell"
category = "Skills: Programming"
value = "Expert"
evaluator = "rule-based"
evaluator_name = "prog_haskell=Expert"
adherence_signal = "Every selected prototype package implements the interaction layer in Haskell rather than a managed visual builder. Visible app ids, names, descriptions, and notes are joined to the reviewed host-only tests/answer_key.json; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "skill_drawing"
dimension_label = "Skill: Drawing"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_drawing=Advanced"
adherence_signal = "Every selected prototype package creates its visual studies personally by hand from a blank page rather than using professionally commissioned reusable illustration components. Visible app ids, names, descriptions, and notes are joined to the reviewed host-only tests/answer_key.json; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PrototypeBench (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PrototypeBench once the desktop is up so the agent finds it on screen.
command = "/opt/prototypebench/start-prototypebench.sh"
timeout_sec = 60.0
retries = 5
