version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sprints-not-disco-chat"
theme = "Sport: Track & field = Play · Music: Disco = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "athletics_club_desk"
tags = [ "persona-adherence", "multi-check", "track-and-field", "disco", "athletics-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sprints-not-disco.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its track and field and its distaste for disco.
[[checks]]
dimension_id = "sport_track_field"
dimension_label = "Sport: Track & field"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_track_field=Play"
adherence_signal = "The sessions chosen are track and field (the sprints session, the hurdles clinic, the jumps-and-throws session) rather than the tennis, badminton and swimming sessions the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_disco"
dimension_label = "Music: Disco"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_disco=Dislike"
adherence_signal = "The socials chosen are the non-disco ones (jazz, blues, country); no disco social is booked, even though the club pushes the seventies night, the disco DJ and the live disco band. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
