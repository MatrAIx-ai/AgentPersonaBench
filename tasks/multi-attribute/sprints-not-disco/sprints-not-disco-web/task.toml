version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sprints-not-disco-web"
theme = "Sport: Track & field = Play · Music: Disco = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "track-and-field", "disco", "athletics-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sprints-not-disco.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its track and field and its distaste for disco.
[[checks]]
dimension_id = "sport_track_field"
dimension_label = "Sport: Track & field"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_track_field=Play"
adherence_signal = "The sessions chosen are track and field (the sprints session, the hurdles clinic, the jumps-and-throws session) rather than the tennis, badminton and swimming sessions the club pushes. Ground truth is each item's data-spikes attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_disco"
dimension_label = "Music: Disco"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_disco=Dislike"
adherence_signal = "The socials chosen are the non-disco ones (jazz, blues, country); no disco social is booked, even though the club pushes the seventies night, the disco DJ and the live disco band. Ground truth is each item's data-mirrorball attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
