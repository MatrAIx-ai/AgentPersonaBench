version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sprints-not-disco-app"
theme = "Sport: Track & field = Play · Music: Disco = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "track-and-field", "disco", "athletics-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sprints-not-disco.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its track and field and its distaste for disco.
[[checks]]
dimension_id = "sport_track_field"
dimension_label = "Sport: Track & field"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_track_field=Play"
adherence_signal = "The sessions chosen are track and field (the sprints session, the hurdles clinic, the jumps-and-throws session) rather than the tennis, badminton and swimming sessions the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_disco"
dimension_label = "Music: Disco"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_disco=Dislike"
adherence_signal = "The socials chosen are the non-disco ones (jazz, blues, country); no disco social is booked, even though the club pushes the seventies night, the disco DJ and the live disco band. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubhouseAndTrack (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubhouseAndTrack once the desktop is up so the agent finds it on screen.
command = "/opt/clubhouseandtrack/start-clubhouseandtrack.sh"
timeout_sec = 60.0
retries = 5
