version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paper-philately-app"
theme = "Tech savviness = Avoidant · Hobby: Stamp collecting = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "tech-savviness", "stamp-collecting", "collectors-fair", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paper-philately.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session is free with the pass and the same length; the app-run sessions are just as well organised and the other collecting fields are just as lively — so the picks isolate the persona's own avoidance of apps and screens and its stamp collecting.
[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
value = "Avoidant"
evaluator = "rule-based"
evaluator_name = "tech_savviness=Avoidant"
adherence_signal = "The sessions chosen are the paper, in-person formats (printed catalogue, trades at the table, an appraiser at a desk) rather than the QR-code, app-auction and photo-upload formats the fair pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_stamp_collecting"
dimension_label = "Hobby: Stamp collecting"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_stamp_collecting=Active"
adherence_signal = "The sessions chosen are stamp sessions (swap table, first-day-cover dealers, philatelic appraisal) rather than the equally lively postcard, badge and camera sessions the fair pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FairDayPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FairDayPass once the desktop is up so the agent finds it on screen.
command = "/opt/fairdaypass/start-fairdaypass.sh"
timeout_sec = 60.0
retries = 5
