version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paper-philately-web"
theme = "Tech savviness = Avoidant · Hobby: Stamp collecting = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "tech-savviness", "stamp-collecting", "collectors-fair", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paper-philately.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session is free with the pass and the same length; the app-run sessions are just as well organised and the other collecting fields are just as lively — so the picks isolate the persona's own avoidance of apps and screens and its stamp collecting.
[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
value = "Avoidant"
evaluator = "rule-based"
evaluator_name = "tech_savviness=Avoidant"
adherence_signal = "The sessions chosen are the paper, in-person formats (printed catalogue, trades at the table, an appraiser at a desk) rather than the QR-code, app-auction and photo-upload formats the fair pushes. Ground truth is each item's data-paperbased attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_stamp_collecting"
dimension_label = "Hobby: Stamp collecting"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_stamp_collecting=Active"
adherence_signal = "The sessions chosen are stamp sessions (swap table, first-day-cover dealers, philatelic appraisal) rather than the equally lively postcard, badge and camera sessions the fair pushes. Ground truth is each item's data-philately attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
