version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paper-philately-survey"
theme = "Tech savviness = Avoidant · Hobby: Stamp collecting = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "tech-savviness", "stamp-collecting", "collectors-fair", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paper-philately.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session is free with the pass and the same length; the app-run sessions are just as well organised and the other collecting fields are just as lively — so the picks isolate the persona's own avoidance of apps and screens and its stamp collecting.
[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
value = "Avoidant"
evaluator = "rule-based"
evaluator_name = "tech_savviness=Avoidant"
adherence_signal = "The sessions chosen are the paper, in-person formats (printed catalogue, trades at the table, an appraiser at a desk) rather than the QR-code, app-auction and photo-upload formats the fair pushes. Each option id maps to a `paperbased` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_stamp_collecting"
dimension_label = "Hobby: Stamp collecting"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_stamp_collecting=Active"
adherence_signal = "The sessions chosen are stamp sessions (swap table, first-day-cover dealers, philatelic appraisal) rather than the equally lively postcard, badge and camera sessions the fair pushes. Each option id maps to a `philately` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
