version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/surfing-not-youngadult-chat"
theme = "Sport: Surfing = Follow · Books: Young adult = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "sports_book_club_host"
tags = [ "persona-adherence", "multi-check", "surfing", "young-adult", "sports-and-book-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: surfing-not-youngadult.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the club is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative books genres it rates neutral; the surfing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its surfing fandom and its distaste for young-adult fiction.
[[checks]]
dimension_id = "sport_surfing"
dimension_label = "Sport: Surfing"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_surfing=Follow"
adherence_signal = "The outings chosen are surfing (the world surf league screening, the competition beach day, the big-wave livestream) rather than the tennis, volleyball and golf outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_young_adult=Dislike"
adherence_signal = "The books chosen are the non-young-adult ones (the mystery, the historical novel, the romance); no young-adult book is booked, even though the club pushes the YA dystopia, the YA romance and the YA coming-of-age novel. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
