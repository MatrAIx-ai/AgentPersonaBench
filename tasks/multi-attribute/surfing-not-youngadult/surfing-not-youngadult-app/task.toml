version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/surfing-not-youngadult-app"
theme = "Sport: Surfing = Follow · Books: Young adult = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "surfing", "young-adult", "sports-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: surfing-not-youngadult.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the club is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative books genres it rates neutral; the surfing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its surfing fandom and its distaste for young-adult fiction.
[[checks]]
dimension_id = "sport_surfing"
dimension_label = "Sport: Surfing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_surfing=Follow"
adherence_signal = "The outings chosen are surfing (the world surf league screening, the competition beach day, the big-wave livestream) rather than the tennis, volleyball and golf outings the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_young_adult=Dislike"
adherence_signal = "The books chosen are the non-young-adult ones (the mystery, the historical novel, the romance); no young-adult book is booked, even though the club pushes the YA dystopia, the YA romance and the YA coming-of-age novel. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BookshelfAndBeach (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BookshelfAndBeach once the desktop is up so the agent finds it on screen.
command = "/opt/bookshelfandbeach/start-bookshelfandbeach.sh"
timeout_sec = 60.0
retries = 5
