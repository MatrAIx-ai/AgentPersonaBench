version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-jazz-no-sushi-app"
theme = "Music: Jazz = Dislike · Cuisine: Sushi = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "jazz", "sushi", "concert-and-supper", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-jazz-no-sushi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is strongly indoor) and the venue is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the non-sushi suppers cuisines it rates neutral — so the picks isolate its distaste for jazz and its distaste for sushi.
[[checks]]
dimension_id = "musg_jazz"
dimension_label = "Music: Jazz"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_jazz=Dislike"
adherence_signal = "The concerts chosen are the non-jazz ones (rock, reggae, indie); no jazz concert is booked, even though the venue pushes the quartet, the big-band night and the vocalist. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_sushi"
dimension_label = "Cuisine: Sushi"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_sushi=Avoid"
adherence_signal = "The suppers chosen are the non-sushi ones (Italian, Thai, Indian); no sushi supper is booked, even though the venue pushes the omakase, the sushi set and the hand-roll bar. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with KitchenAndHall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch KitchenAndHall once the desktop is up so the agent finds it on screen.
command = "/opt/kitchenandhall/start-kitchenandhall.sh"
timeout_sec = 60.0
retries = 5
