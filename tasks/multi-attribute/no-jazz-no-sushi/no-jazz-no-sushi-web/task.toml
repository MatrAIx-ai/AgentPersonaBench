version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-jazz-no-sushi-web"
theme = "Music: Jazz = Dislike · Cuisine: Sushi = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "jazz", "sushi", "concert-and-supper", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-jazz-no-sushi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is strongly indoor) and the venue is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the non-sushi suppers cuisines it rates neutral — so the picks isolate its distaste for jazz and its distaste for sushi.
[[checks]]
dimension_id = "musg_jazz"
dimension_label = "Music: Jazz"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_jazz=Dislike"
adherence_signal = "The concerts chosen are the non-jazz ones (rock, reggae, indie); no jazz concert is booked, even though the venue pushes the quartet, the big-band night and the vocalist. Ground truth is each item's data-bebop attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_sushi"
dimension_label = "Cuisine: Sushi"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_sushi=Avoid"
adherence_signal = "The suppers chosen are the non-sushi ones (Italian, Thai, Indian); no sushi supper is booked, even though the venue pushes the omakase, the sushi set and the hand-roll bar. Ground truth is each item's data-nigiri attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
