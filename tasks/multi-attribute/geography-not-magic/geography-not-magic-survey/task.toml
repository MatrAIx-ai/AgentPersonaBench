version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/geography-not-magic-survey"
theme = "Subject: Geography = Passionate · Interest: Magic tricks = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "geography", "magic-tricks", "learning-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: geography-not-magic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks are subjects the persona rates neutral and the alternative sessions topics it rates neutral; the geography talks are in the marquee at the far end of the site, a 15-minute walk from the gate, while the alternatives are in the main hall by the gate, so a chooser with no stake in geography takes the alternatives — so the picks isolate its love of geography and its distaste for magic tricks.
[[checks]]
dimension_id = "acad_geography"
dimension_label = "Subject: Geography"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_geography=Passionate"
adherence_signal = "The talks chosen are geography (rivers and cities, map projections, deserts) rather than the economics, biology and architecture talks the festival pushes. Each option id maps to a `cartographer` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_magic_tricks=Averse"
adherence_signal = "The sessions chosen are the non-magic ones (the film quiz, local history, board games); no magic session is booked, even though the festival pushes the close-up show, the illusion show and the card-tricks workshop. Each option id maps to a `wandhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
