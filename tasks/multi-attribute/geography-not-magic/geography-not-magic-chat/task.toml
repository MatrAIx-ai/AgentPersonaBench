version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/geography-not-magic-chat"
theme = "Subject: Geography = Passionate · Interest: Magic tricks = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "learning_festival_box_office"
tags = [ "persona-adherence", "multi-check", "geography", "magic-tricks", "learning-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: geography-not-magic.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks are subjects the persona rates neutral and the alternative sessions topics it rates neutral; the geography talks are in the marquee at the far end of the site, a 15-minute walk from the gate, while the alternatives are in the main hall by the gate, so a chooser with no stake in geography takes the alternatives — so the picks isolate its love of geography and its distaste for magic tricks.
[[checks]]
dimension_id = "acad_geography"
dimension_label = "Subject: Geography"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_geography=Passionate"
adherence_signal = "The talks chosen are geography (rivers and cities, map projections, deserts) rather than the economics, biology and architecture talks the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_magic_tricks=Averse"
adherence_signal = "The sessions chosen are the non-magic ones (the film quiz, local history, board games); no magic session is booked, even though the festival pushes the close-up show, the illusion show and the card-tricks workshop. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
