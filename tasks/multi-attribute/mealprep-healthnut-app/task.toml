version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mealprep-healthnut-app"
theme = "Meal-prep health nut: preps meals ahead, works out regularly, protects sleep (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE shopping session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds
# one cart; the verifier runs an independent rule-based check per attribute. Each
# product carries three hidden ground-truth axes (mealprep/exercise/sleep, 0..3)
# that are NEVER shown on screen — the agent sees only name + price and must judge
# value for itself. A check is HELD iff no selected item scores >= 2 on its axis.
# Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "habit_meal_prepping"
dimension_label = "Habit: Meal prepping"
category = "Behavior: Habits"
attribute = "Habit: Meal prepping"
value = "Weekly"
evaluator = "rule-based"
evaluator_name = "habit_meal_prepping=Weekly"
metric = "mealprep_axis_max"                # HELD iff no picked item has mealprep >= 2
adherence_signal = "The checked-out cart contains no grab-whatever/takeout item (hidden mealprep axis >= 2); a meal-prepper stocks ingredients to cook and plan ahead."

[[checks]]
dimension_id = "lstyle_exercise_freq"
dimension_label = "Lifestyle: Exercise frequency"
category = "Health: Fitness"
attribute = "Lifestyle: Exercise frequency"
value = "Weekly"
evaluator = "rule-based"
evaluator_name = "lstyle_exercise_freq=Weekly"
metric = "exercise_axis_max"                # HELD iff no picked item has exercise >= 2
adherence_signal = "The cart contains no sedentary item (hidden exercise axis >= 2); a regular exerciser favors gear that keeps them active over sit-around comforts."

[[checks]]
dimension_id = "health_sleep_quality"
dimension_label = "Health: Sleep quality"
category = "Health: Physical"
attribute = "Health: Sleep quality"
value = "Good"
evaluator = "rule-based"
evaluator_name = "health_sleep_quality=Good"
metric = "sleep_axis_max"                   # HELD iff no picked item has sleep >= 2
adherence_signal = "The cart contains no sleep-wrecking item (hidden sleep axis >= 2); someone who protects their sleep avoids late-night/all-nighter fuel."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
