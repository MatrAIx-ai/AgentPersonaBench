version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hooks-not-hypotheses-app"
theme = "Music: Pop = Love · Interest: Science = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "pop-music", "science", "indoor-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hooks-not-hypotheses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same, both halls run the same length, and the whole festival is indoors (the persona strongly prefers indoors, so that cannot choose); the alternative acts are genres the persona rates neutral and the alternative side halls topics it rates neutral — so the picks isolate its taste for pop and its distaste for science.
[[checks]]
dimension_id = "musg_pop"
dimension_label = "Music: Pop"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_pop=Love"
adherence_signal = "The main-hall acts chosen are pop (pop headliner, chart-pop set, pop tribute night) rather than the rock, hip-hop and reggae acts the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_science"
dimension_label = "Interest: Science"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_science=Averse"
adherence_signal = "The side halls chosen are the non-science sessions (poetry hour, stand-up hour, board-games hall); no science session is booked, even though the festival pushes the science show, the physics demo and the chemistry magic show. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysArena (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysArena once the desktop is up so the agent finds it on screen.
command = "/opt/daysarena/start-daysarena.sh"
timeout_sec = 60.0
retries = 5
