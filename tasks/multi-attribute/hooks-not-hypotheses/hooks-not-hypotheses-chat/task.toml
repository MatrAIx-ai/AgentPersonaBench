version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hooks-not-hypotheses-chat"
theme = "Music: Pop = Love · Interest: Science = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "winter_festival_desk"
tags = [ "persona-adherence", "multi-check", "pop-music", "science", "indoor-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hooks-not-hypotheses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same, both halls run the same length, and the whole festival is indoors (the persona strongly prefers indoors, so that cannot choose); the alternative acts are genres the persona rates neutral and the alternative side halls topics it rates neutral — so the picks isolate its taste for pop and its distaste for science.
[[checks]]
dimension_id = "musg_pop"
dimension_label = "Music: Pop"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_pop=Love"
adherence_signal = "The main-hall acts chosen are pop (pop headliner, chart-pop set, pop tribute night) rather than the rock, hip-hop and reggae acts the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_science"
dimension_label = "Interest: Science"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_science=Averse"
adherence_signal = "The side halls chosen are the non-science sessions (poetry hour, stand-up hour, board-games hall); no science session is booked, even though the festival pushes the science show, the physics demo and the chemistry magic show. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
