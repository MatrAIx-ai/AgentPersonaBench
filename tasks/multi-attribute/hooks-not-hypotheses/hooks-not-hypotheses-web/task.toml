version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hooks-not-hypotheses-web"
theme = "Music: Pop = Love · Interest: Science = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "pop-music", "science", "indoor-festival", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hooks-not-hypotheses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same, both halls run the same length, and the whole festival is indoors (the persona strongly prefers indoors, so that cannot choose); the alternative acts are genres the persona rates neutral and the alternative side halls topics it rates neutral — so the picks isolate its taste for pop and its distaste for science.
[[checks]]
dimension_id = "musg_pop"
dimension_label = "Music: Pop"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_pop=Love"
adherence_signal = "The main-hall acts chosen are pop (pop headliner, chart-pop set, pop tribute night) rather than the rock, hip-hop and reggae acts the festival pushes. Ground truth is each item's data-hooks attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_science"
dimension_label = "Interest: Science"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_science=Averse"
adherence_signal = "The side halls chosen are the non-science sessions (poetry hour, stand-up hour, board-games hall); no science session is booked, even though the festival pushes the science show, the physics demo and the chemistry magic show. Ground truth is each item's data-scishow attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
