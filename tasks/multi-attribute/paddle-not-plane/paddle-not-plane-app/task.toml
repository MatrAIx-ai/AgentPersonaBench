version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paddle-not-plane-app"
theme = "Hobby: Kayaking = Active · Interest: Woodworking = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "kayaking", "woodworking", "outdoor-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paddle-not-plane.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every morning is on the water (so being outdoors is common to both sides) and kit is provided; the alternative mornings are water hobbies the persona rates neutral and the alternative workshops topics it rates neutral — so the picks isolate its kayaking and its distaste for woodworking.
[[checks]]
dimension_id = "hob_kayaking"
dimension_label = "Hobby: Kayaking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_kayaking=Active"
adherence_signal = "The mornings chosen are kayaking (the sea-kayak trip, the river session, the rolling clinic) rather than the paddleboarding, snorkelling and try-dive mornings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_woodworking"
dimension_label = "Interest: Woodworking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_woodworking=Averse"
adherence_signal = "The workshops chosen are the non-woodwork ones (calligraphy, knitting, magic); no woodwork workshop is booked, even though the centre pushes spoon carving, the dovetail box and the lathe taster. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WorkshopAndWater (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WorkshopAndWater once the desktop is up so the agent finds it on screen.
command = "/opt/workshopandwater/start-workshopandwater.sh"
timeout_sec = 60.0
retries = 5
