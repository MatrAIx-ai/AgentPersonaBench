version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paddle-not-plane-chat"
theme = "Hobby: Kayaking = Active · Interest: Woodworking = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "outdoor_centre_desk"
tags = [ "persona-adherence", "multi-check", "kayaking", "woodworking", "outdoor-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paddle-not-plane.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every morning is on the water (so being outdoors is common to both sides) and kit is provided; the alternative mornings are water hobbies the persona rates neutral and the alternative workshops topics it rates neutral — so the picks isolate its kayaking and its distaste for woodworking.
[[checks]]
dimension_id = "hob_kayaking"
dimension_label = "Hobby: Kayaking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_kayaking=Active"
adherence_signal = "The mornings chosen are kayaking (the sea-kayak trip, the river session, the rolling clinic) rather than the paddleboarding, snorkelling and try-dive mornings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_woodworking"
dimension_label = "Interest: Woodworking"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_woodworking=Averse"
adherence_signal = "The workshops chosen are the non-woodwork ones (calligraphy, knitting, magic); no woodwork workshop is booked, even though the centre pushes spoon carving, the dovetail box and the lathe taster. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
