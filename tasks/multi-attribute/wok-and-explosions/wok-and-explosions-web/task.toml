version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wok-and-explosions-web"
theme = "Cuisine: Chinese = Love · Film: Action = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "chinese-cuisine", "action-films", "dinner-and-a-movie", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wok-and-explosions.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every deal costs the same and seats the same; no dish contains pork or alcohol on either side; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Chinese food and for action films.
[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_chinese=Love"
adherence_signal = "The dinner halves of the deals are Chinese dishes (kung pao chicken, beef chow fun, mapo tofu) rather than the equally good pizza, tagine and shawarma plates the club pushes. Ground truth is each item's data-wok attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_action"
dimension_label = "Film: Action"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_action=Love"
adherence_signal = "The film halves of the deals are action pictures (heist blockbuster, car-chase sequel, martial-arts epic) rather than the equally well-reviewed drama, romance and documentary the club pushes. Ground truth is each item's data-stunt attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
