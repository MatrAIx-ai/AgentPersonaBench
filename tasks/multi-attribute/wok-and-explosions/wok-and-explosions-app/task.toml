version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wok-and-explosions-app"
theme = "Cuisine: Chinese = Love · Film: Action = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "chinese-cuisine", "action-films", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wok-and-explosions.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every deal costs the same and seats the same; no dish contains pork or alcohol on either side; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Chinese food and for action films.
[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_chinese=Love"
adherence_signal = "The dinner halves of the deals are Chinese dishes (kung pao chicken, beef chow fun, mapo tofu) rather than the equally good pizza, tagine and shawarma plates the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_action"
dimension_label = "Film: Action"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_action=Love"
adherence_signal = "The film halves of the deals are action pictures (heist blockbuster, car-chase sequel, martial-arts epic) rather than the equally well-reviewed drama, romance and documentary the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperReel (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperReel once the desktop is up so the agent finds it on screen.
command = "/opt/supperreel/start-supperreel.sh"
timeout_sec = 60.0
retries = 5
