version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wheel-and-wand-app"
theme = "Hobby: Pottery = Avid · Film: Fantasy = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "pottery", "fantasy-films", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wheel-and-wand.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral (its own other crafts — origami, juggling, model building — are kept off both sides) and the alternative films are genres it rates neutral — so the picks isolate its pottery and its taste for fantasy films.
[[checks]]
dimension_id = "hob_pottery"
dimension_label = "Hobby: Pottery"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_pottery=Avid"
adherence_signal = "The workshops chosen are pottery workshops (wheel-throwing, hand-building, glazing) rather than the candle, woodturning and calligraphy workshops the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_fantasy"
dimension_label = "Film: Fantasy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_fantasy=Love"
adherence_signal = "The films chosen are fantasy (dragon epic, portal fantasy, sword-and-sorcery quest) rather than the musical, crime caper and courtroom drama the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdayArts (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdayArts once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayarts/start-saturdayarts.sh"
timeout_sec = 60.0
retries = 5
