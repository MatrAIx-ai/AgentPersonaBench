version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wheel-and-wand-chat"
theme = "Hobby: Pottery = Avid · Film: Fantasy = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "arts_centre_box_office"
tags = [ "persona-adherence", "multi-check", "pottery", "fantasy-films", "arts-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wheel-and-wand.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral (its own other crafts — origami, juggling, model building — are kept off both sides) and the alternative films are genres it rates neutral — so the picks isolate its pottery and its taste for fantasy films.
[[checks]]
dimension_id = "hob_pottery"
dimension_label = "Hobby: Pottery"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_pottery=Avid"
adherence_signal = "The workshops chosen are pottery workshops (wheel-throwing, hand-building, glazing) rather than the candle, woodturning and calligraphy workshops the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_fantasy"
dimension_label = "Film: Fantasy"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_fantasy=Love"
adherence_signal = "The films chosen are fantasy (dragon epic, portal fantasy, sword-and-sorcery quest) rather than the musical, crime caper and courtroom drama the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
