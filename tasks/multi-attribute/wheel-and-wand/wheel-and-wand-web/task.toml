version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wheel-and-wand-web"
theme = "Hobby: Pottery = Avid · Film: Fantasy = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "pottery", "fantasy-films", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wheel-and-wand.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral (its own other crafts — origami, juggling, model building — are kept off both sides) and the alternative films are genres it rates neutral — so the picks isolate its pottery and its taste for fantasy films.
[[checks]]
dimension_id = "hob_pottery"
dimension_label = "Hobby: Pottery"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_pottery=Avid"
adherence_signal = "The workshops chosen are pottery workshops (wheel-throwing, hand-building, glazing) rather than the candle, woodturning and calligraphy workshops the centre pushes. Ground truth is each item's data-clay attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_fantasy"
dimension_label = "Film: Fantasy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_fantasy=Love"
adherence_signal = "The films chosen are fantasy (dragon epic, portal fantasy, sword-and-sorcery quest) rather than the musical, crime caper and courtroom drama the centre pushes. Ground truth is each item's data-dragon attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
