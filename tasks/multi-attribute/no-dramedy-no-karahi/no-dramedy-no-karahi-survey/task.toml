version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-dramedy-no-karahi-survey"
theme = "Film: Comedy-drama = Dislike · Cuisine: Pakistani = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "comedy-drama", "pakistani-cuisine", "dinner-and-a-movie", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-dramedy-no-karahi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the cinema is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the non-Pakistani suppers cuisines it rates neutral — so the picks isolate its distaste for comedy-dramas and its distaste for Pakistani food.
[[checks]]
dimension_id = "filmg_comedy_drama"
dimension_label = "Film: Comedy-drama"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_comedy_drama=Dislike"
adherence_signal = "The films chosen are the non-comedy-dramas (the western, the heist film, the space film); no comedy-drama is booked, even though the cinema pushes the family comedy-drama, the small-town one and the coming-of-age one. Each option id maps to a `dramedy` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_pakistani"
dimension_label = "Cuisine: Pakistani"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_pakistani=Avoid"
adherence_signal = "The suppers chosen are the non-Pakistani ones (Italian, Thai, Turkish); no Pakistani supper is booked, even though the cinema pushes the karahi, the nihari and the seekh kebabs. Each option id maps to a `karahi` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
