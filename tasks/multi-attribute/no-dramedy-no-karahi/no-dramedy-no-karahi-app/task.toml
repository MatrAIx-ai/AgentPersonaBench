version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-dramedy-no-karahi-app"
theme = "Film: Comedy-drama = Dislike · Cuisine: Pakistani = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "comedy-drama", "pakistani-cuisine", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-dramedy-no-karahi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the cinema is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the non-Pakistani suppers cuisines it rates neutral — so the picks isolate its distaste for comedy-dramas and its distaste for Pakistani food.
[[checks]]
dimension_id = "filmg_comedy_drama"
dimension_label = "Film: Comedy-drama"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_comedy_drama=Dislike"
adherence_signal = "The films chosen are the non-comedy-dramas (the western, the heist film, the space film); no comedy-drama is booked, even though the cinema pushes the family comedy-drama, the small-town one and the coming-of-age one. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_pakistani"
dimension_label = "Cuisine: Pakistani"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_pakistani=Avoid"
adherence_signal = "The suppers chosen are the non-Pakistani ones (Italian, Thai, Turkish); no Pakistani supper is booked, even though the cinema pushes the karahi, the nihari and the seekh kebabs. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlateAndPicture (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlateAndPicture once the desktop is up so the agent finds it on screen.
command = "/opt/plateandpicture/start-plateandpicture.sh"
timeout_sec = 60.0
retries = 5
