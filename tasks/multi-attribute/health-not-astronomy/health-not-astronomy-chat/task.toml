version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-not-astronomy-chat"
theme = "Subject: Health science = Passionate · Subject: Astronomy = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "science_festival_box_office"
tags = [ "persona-adherence", "multi-check", "health-science", "astronomy", "science-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: health-not-astronomy.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the health-science side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of health science and its distaste for astronomy.
[[checks]]
dimension_id = "acad_health_science"
dimension_label = "Subject: Health science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_health_science=Passionate"
adherence_signal = "The talks chosen are health science (sleep science, nutrition myths, the immune system) rather than the physics, economics and anthropology talks the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_astronomy"
dimension_label = "Subject: Astronomy"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_astronomy=Averse"
adherence_signal = "The sessions chosen are the non-astronomy ones (drama, foreign languages, logic); no astronomy session is booked, even though the festival pushes the life of stars, exoplanets and the night sky. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
