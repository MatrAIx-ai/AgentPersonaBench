version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-not-astronomy-web"
theme = "Subject: Health science = Passionate · Subject: Astronomy = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "health-science", "astronomy", "science-festival", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: health-not-astronomy.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the health-science side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of health science and its distaste for astronomy.
[[checks]]
dimension_id = "acad_health_science"
dimension_label = "Subject: Health science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_health_science=Passionate"
adherence_signal = "The talks chosen are health science (sleep science, nutrition myths, the immune system) rather than the physics, economics and anthropology talks the festival pushes. Ground truth is each item's data-stethoscope attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_astronomy"
dimension_label = "Subject: Astronomy"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_astronomy=Averse"
adherence_signal = "The sessions chosen are the non-astronomy ones (drama, foreign languages, logic); no astronomy session is booked, even though the festival pushes the life of stars, exoplanets and the night sky. Ground truth is each item's data-starsession attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
