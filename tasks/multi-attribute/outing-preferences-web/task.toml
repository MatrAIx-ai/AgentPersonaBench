version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/outing-preferences-web"
theme = "Interest in pets: Averse · Interest in hiking: Passionate"

[metadata]
difficulty = "hard"
type = "web"
domain = "leisure planning"
tags = ["persona-adherence", "multi-attribute", "weekend-outings", "rule-based", "pets", "hiking", "browser"]

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
adherence_signal = "After reviewing activity details, confirms an outing without direct participation with companion animals."

[[checks]]
dimension_id = "topic_hiking"
dimension_label = "Interest: Hiking"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
adherence_signal = "Confirms the animal-free Summit Circuit guided ridge hike rather than a non-hiking or dog-paired outing."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
