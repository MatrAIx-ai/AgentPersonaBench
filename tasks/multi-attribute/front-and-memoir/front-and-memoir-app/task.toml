version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/front-and-memoir-app"
theme = "Film: War = Love · Books: Biography = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "multi-check", "war-films", "biography", "film-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: front-and-memoir.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pairing is free with membership and the same reading length; the alternative film and book genres are ones the persona rates neutral — so the picks isolate the persona's own taste for war films and for biographies independently.
[[checks]]
dimension_id = "filmg_war"
dimension_label = "Film: War"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_war=Love"
adherence_signal = "The film halves of the pairings are war films (submarine drama, trench epic, resistance thriller) rather than the equally well-reviewed courtroom, sci-fi and documentary films the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_biography"
dimension_label = "Books: Biography"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_biography=Love"
adherence_signal = "The book halves of the pairings are biographies (a general's, an aviator's, a nurse's) rather than the equally well-reviewed sci-fi novel, poetry collection and business book the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ReelAndPage (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ReelAndPage once the desktop is up so the agent finds it on screen.
command = "/opt/reelandpage/start-reelandpage.sh"
timeout_sec = 60.0
retries = 5
