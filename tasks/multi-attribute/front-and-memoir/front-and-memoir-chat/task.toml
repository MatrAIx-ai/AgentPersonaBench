version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/front-and-memoir-chat"
theme = "Film: War = Love · Books: Biography = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "pairings_club_curator"
tags = [ "persona-adherence", "multi-check", "war-films", "biography", "film-and-book-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: front-and-memoir.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pairing is free with membership and the same reading length; the alternative film and book genres are ones the persona rates neutral — so the picks isolate the persona's own taste for war films and for biographies independently.
[[checks]]
dimension_id = "filmg_war"
dimension_label = "Film: War"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_war=Love"
adherence_signal = "The film halves of the pairings are war films (submarine drama, trench epic, resistance thriller) rather than the equally well-reviewed courtroom, sci-fi and documentary films the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_biography"
dimension_label = "Books: Biography"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_biography=Love"
adherence_signal = "The book halves of the pairings are biographies (a general's, an aviator's, a nurse's) rather than the equally well-reviewed sci-fi novel, poetry collection and business book the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
