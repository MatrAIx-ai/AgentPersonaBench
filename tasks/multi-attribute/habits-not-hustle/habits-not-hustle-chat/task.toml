version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/habits-not-hustle-chat"
theme = "Books: Self-help = Love · Interest: Entrepreneurship = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "library_events_desk"
tags = [ "persona-adherence", "multi-check", "self-help", "entrepreneurship", "library-programme", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: habits-not-hustle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle is free with the library card and every talk is the same length; the alternative books are genres the persona rates neutral and the alternative talks topics it rates neutral; the self-help titles are about habits, boundaries and sleep rather than business, so the two facets stay separate — the picks isolate its taste for self-help and its distaste for entrepreneurship.
[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_self_help=Love"
adherence_signal = "The books chosen are self-help (habits, boundaries, sleep) rather than the memoir, travel book and poetry collection the library pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_entrepreneurship"
dimension_label = "Interest: Entrepreneurship"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_entrepreneurship=Averse"
adherence_signal = "The talks chosen are the non-business talks (local history, astronomy, photography); no entrepreneurship talk is booked, even though the library pushes the founders' panel, the side-business talk and the pitching talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
