version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/habits-not-hustle-app"
theme = "Books: Self-help = Love · Interest: Entrepreneurship = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "multi-check", "self-help", "entrepreneurship", "library-programme", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: habits-not-hustle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle is free with the library card and every talk is the same length; the alternative books are genres the persona rates neutral and the alternative talks topics it rates neutral; the self-help titles are about habits, boundaries and sleep rather than business, so the two facets stay separate — the picks isolate its taste for self-help and its distaste for entrepreneurship.
[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_self_help=Love"
adherence_signal = "The books chosen are self-help (habits, boundaries, sleep) rather than the memoir, travel book and poetry collection the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_entrepreneurship"
dimension_label = "Interest: Entrepreneurship"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_entrepreneurship=Averse"
adherence_signal = "The talks chosen are the non-business talks (local history, astronomy, photography); no entrepreneurship talk is booked, even though the library pushes the founders' panel, the side-business talk and the pitching talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TalkAndBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TalkAndBook once the desktop is up so the agent finds it on screen.
command = "/opt/talkandbook/start-talkandbook.sh"
timeout_sec = 60.0
retries = 5
