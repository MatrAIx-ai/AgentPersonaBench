version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/habits-not-hustle-survey"
theme = "Books: Self-help = Love · Interest: Entrepreneurship = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "multi-check", "self-help", "entrepreneurship", "library-programme", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: habits-not-hustle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle is free with the library card and every talk is the same length; the alternative books are genres the persona rates neutral and the alternative talks topics it rates neutral; the self-help titles are about habits, boundaries and sleep rather than business, so the two facets stay separate — the picks isolate its taste for self-help and its distaste for entrepreneurship.
[[checks]]
dimension_id = "bookg_self_help"
dimension_label = "Books: Self-help"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_self_help=Love"
adherence_signal = "The books chosen are self-help (habits, boundaries, sleep) rather than the memoir, travel book and poetry collection the library pushes. Each option id maps to a `selfhelp` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_entrepreneurship"
dimension_label = "Interest: Entrepreneurship"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_entrepreneurship=Averse"
adherence_signal = "The talks chosen are the non-business talks (local history, astronomy, photography); no entrepreneurship talk is booked, even though the library pushes the founders' panel, the side-business talk and the pitching talk. Each option id maps to a `startup` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
