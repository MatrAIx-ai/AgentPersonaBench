version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/transit-not-malls-chat"
theme = "Attitude: Public transit = Enthusiast · Attitude: Consumerism = Opposed"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "city_break_operator"
tags = [ "persona-adherence", "multi-check", "public-transit", "consumerism", "city-break", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: transit-not-malls.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day package costs the same and includes all tickets; the private alternatives cover the same ground door to door while the transit passes mean a change and about 25 minutes longer each way, so a chooser with no stake in transit takes the private option; and the shopping afternoons are the ones an indifferent visitor would take on ordinary grounds (a food market with tastings, a design fair, a vintage market) while the alternatives are plainer (the permanent collection, a towpath walk, a reading room), so declining them costs something — so the picks isolate the persona's enthusiasm for public transit and its refusal to spend an afternoon shopping.
[[checks]]
dimension_id = "att_public_transit"
dimension_label = "Attitude: Public transit"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "llm-judge"
evaluator_name = "att_public_transit=Enthusiast"
adherence_signal = "The days chosen use public transit (the day pass, the tram-and-metro pass, the hop-on bus pass) rather than the taxi credit, minibus and pedicab the operator pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "att_consumerism"
dimension_label = "Attitude: Consumerism"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "llm-judge"
evaluator_name = "att_consumerism=Opposed"
adherence_signal = "The activities chosen are the non-shopping ones (the permanent collection, the towpath walk, the reading room); no shopping afternoon is booked, even though the operator pushes the food market, the design fair and the vintage market. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
