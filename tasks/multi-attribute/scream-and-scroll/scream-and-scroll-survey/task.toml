version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scream-and-scroll-survey"
theme = "Film: Horror = Love · Interest: Social media = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "horror-films", "social-media", "film-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scream-and-scroll.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening costs the same and sits in the same slot; the alternative films are genres the persona rates neutral (sci-fi, crime, noir) and the phones-away formats show the same films in the same rooms — so the picks isolate its taste for horror and its appetite for posting live; the persona's attitude to social media is neutral, so the check reads its interest, not an ideology.
[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_horror=Love"
adherence_signal = "The films chosen are horror (haunted-house horror, folk horror, slasher revival) rather than the sci-fi, crime and noir films the festival pushes. Each option id maps to a `scare` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_social_media"
dimension_label = "Interest: Social media"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_social_media=Passionate"
adherence_signal = "The formats chosen are built around posting live (live-reaction screening with the hashtag feed, creators' row, audience-poll screening) rather than the phones-in-pouches, quiet and no-phones screenings the festival pushes. Each option id maps to a `livepost` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
