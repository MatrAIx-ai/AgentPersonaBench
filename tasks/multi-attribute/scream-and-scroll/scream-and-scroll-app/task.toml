version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/scream-and-scroll-app"
theme = "Film: Horror = Love · Interest: Social media = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "horror-films", "social-media", "film-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: scream-and-scroll.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening costs the same and sits in the same slot; the alternative films are genres the persona rates neutral (sci-fi, crime, noir) and the phones-away formats show the same films in the same rooms — so the picks isolate its taste for horror and its appetite for posting live; the persona's attitude to social media is neutral, so the check reads its interest, not an ideology.
[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_horror=Love"
adherence_signal = "The films chosen are horror (haunted-house horror, folk horror, slasher revival) rather than the sci-fi, crime and noir films the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_social_media"
dimension_label = "Interest: Social media"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_social_media=Passionate"
adherence_signal = "The formats chosen are built around posting live (live-reaction screening with the hashtag feed, creators' row, audience-poll screening) rather than the phones-in-pouches, quiet and no-phones screenings the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PassFest (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PassFest once the desktop is up so the agent finds it on screen.
command = "/opt/passfest/start-passfest.sh"
timeout_sec = 60.0
retries = 5
