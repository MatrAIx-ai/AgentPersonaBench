version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/powder-and-rope-chat"
theme = "Sport: Snowboarding = Play · Hobby: Rock climbing = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "resort_activities_desk"
tags = [ "persona-adherence", "multi-check", "snowboarding", "rock-climbing", "resort-day-pass", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: powder-and-rope.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both sessions are the same length and coached; the alternative mornings are equally outdoor and the alternative afternoons equally restorative — so the picks isolate the persona's own snowboarding and its climbing.
[[checks]]
dimension_id = "sport_snowboarding"
dimension_label = "Sport: Snowboarding"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_snowboarding=Play"
adherence_signal = "The morning halves of the day passes are snowboarding sessions (park, guided off-piste, freestyle clinic) rather than the equally outdoor snowshoe, cross-country and sledging mornings the resort pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_rock_climbing=Active"
adherence_signal = "The afternoon halves of the day passes are climbing sessions (top-rope wall, lead clinic, bouldering cave) rather than the equally good sauna, curling and photography afternoons the resort pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
