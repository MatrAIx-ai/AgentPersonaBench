version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/powder-and-rope-survey"
theme = "Sport: Snowboarding = Play · Hobby: Rock climbing = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "snowboarding", "rock-climbing", "resort-day-pass", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: powder-and-rope.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both sessions are the same length and coached; the alternative mornings are equally outdoor and the alternative afternoons equally restorative — so the picks isolate the persona's own snowboarding and its climbing.
[[checks]]
dimension_id = "sport_snowboarding"
dimension_label = "Sport: Snowboarding"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_snowboarding=Play"
adherence_signal = "The morning halves of the day passes are snowboarding sessions (park, guided off-piste, freestyle clinic) rather than the equally outdoor snowshoe, cross-country and sledging mornings the resort pushes. Each option id maps to a `board` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_rock_climbing=Active"
adherence_signal = "The afternoon halves of the day passes are climbing sessions (top-rope wall, lead clinic, bouldering cave) rather than the equally good sauna, curling and photography afternoons the resort pushes. Each option id maps to a `rope` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
