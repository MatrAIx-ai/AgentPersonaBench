version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/powder-and-rope-app"
theme = "Sport: Snowboarding = Play · Hobby: Rock climbing = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "snowboarding", "rock-climbing", "resort-day-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: powder-and-rope.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both sessions are the same length and coached; the alternative mornings are equally outdoor and the alternative afternoons equally restorative — so the picks isolate the persona's own snowboarding and its climbing.
[[checks]]
dimension_id = "sport_snowboarding"
dimension_label = "Sport: Snowboarding"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_snowboarding=Play"
adherence_signal = "The morning halves of the day passes are snowboarding sessions (park, guided off-piste, freestyle clinic) rather than the equally outdoor snowshoe, cross-country and sledging mornings the resort pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_rock_climbing=Active"
adherence_signal = "The afternoon halves of the day passes are climbing sessions (top-rope wall, lead clinic, bouldering cave) rather than the equally good sauna, curling and photography afternoons the resort pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PeakPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PeakPass once the desktop is up so the agent finds it on screen.
command = "/opt/peakpass/start-peakpass.sh"
timeout_sec = 60.0
retries = 5
