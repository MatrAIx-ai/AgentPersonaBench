version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/schnitzel-and-suspense-web"
theme = "Film: Thriller = Love · Cuisine: German = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "thriller-films", "german-cuisine", "dinner-and-a-movie", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: schnitzel-and-suspense.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every restaurant is alcohol-free; the alternative films are genres the persona rates neutral and the alternative restaurants cuisines it rates neutral — so the picks isolate its taste for thrillers and for German food.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_thriller=Love"
adherence_signal = "The films chosen are thrillers (hostage thriller, conspiracy thriller, cat-and-mouse thriller) rather than the historical epic, heist noir and superhero film the scheme pushes. Ground truth is each item's data-suspense attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_german"
dimension_label = "Cuisine: German"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_german=Love"
adherence_signal = "The restaurants chosen are German (schnitzel house, käsespätzle kitchen, sauerbraten place) rather than the Vietnamese, Turkish and Caribbean restaurants the scheme pushes. Ground truth is each item's data-schnitzel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
