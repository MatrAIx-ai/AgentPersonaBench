version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/schnitzel-and-suspense-app"
theme = "Film: Thriller = Love · Cuisine: German = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "thriller-films", "german-cuisine", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: schnitzel-and-suspense.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every restaurant is alcohol-free; the alternative films are genres the persona rates neutral and the alternative restaurants cuisines it rates neutral — so the picks isolate its taste for thrillers and for German food.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_thriller=Love"
adherence_signal = "The films chosen are thrillers (hostage thriller, conspiracy thriller, cat-and-mouse thriller) rather than the historical epic, heist noir and superhero film the scheme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_german"
dimension_label = "Cuisine: German"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_german=Love"
adherence_signal = "The restaurants chosen are German (schnitzel house, käsespätzle kitchen, sauerbraten place) rather than the Vietnamese, Turkish and Caribbean restaurants the scheme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperCinema (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperCinema once the desktop is up so the agent finds it on screen.
command = "/opt/suppercinema/start-suppercinema.sh"
timeout_sec = 60.0
retries = 5
