version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/schnitzel-and-suspense-survey"
theme = "Film: Thriller = Love · Cuisine: German = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "thriller-films", "german-cuisine", "dinner-and-a-movie", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: schnitzel-and-suspense.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and every restaurant is alcohol-free; the alternative films are genres the persona rates neutral and the alternative restaurants cuisines it rates neutral — so the picks isolate its taste for thrillers and for German food.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_thriller=Love"
adherence_signal = "The films chosen are thrillers (hostage thriller, conspiracy thriller, cat-and-mouse thriller) rather than the historical epic, heist noir and superhero film the scheme pushes. Each option id maps to a `suspense` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_german"
dimension_label = "Cuisine: German"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_german=Love"
adherence_signal = "The restaurants chosen are German (schnitzel house, käsespätzle kitchen, sauerbraten place) rather than the Vietnamese, Turkish and Caribbean restaurants the scheme pushes. Each option id maps to a `schnitzel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
