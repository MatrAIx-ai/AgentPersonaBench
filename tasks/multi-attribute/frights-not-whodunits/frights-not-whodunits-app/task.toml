version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frights-not-whodunits-app"
theme = "Books: Horror = Love · Film: Mystery = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "horror-books", "mystery-films", "book-and-film-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: frights-not-whodunits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative novels are genres the persona rates neutral and the non-mystery screenings genres it rates neutral — so the picks isolate its taste for horror fiction and its distaste for mystery films, two separate things: a reader can relish a haunted-house novel and still not want to sit through a whodunit.
[[checks]]
dimension_id = "bookg_horror"
dimension_label = "Books: Horror"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_horror=Love"
adherence_signal = "The novels chosen are horror (haunted house, possession, folk horror) rather than the science-fiction novel, fantasy novel and memoir the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_mystery"
dimension_label = "Film: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_mystery=Dislike"
adherence_signal = "The screenings chosen are the non-mystery films (action film, animated feature, musical); no mystery is booked, even though the club pushes the whodunit, the missing-person mystery and the country-house mystery. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenChapter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenChapter once the desktop is up so the agent finds it on screen.
command = "/opt/screenchapter/start-screenchapter.sh"
timeout_sec = 60.0
retries = 5
