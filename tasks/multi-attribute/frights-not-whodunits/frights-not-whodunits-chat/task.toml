version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frights-not-whodunits-chat"
theme = "Books: Horror = Love · Film: Mystery = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "chapter_screen_host"
tags = [ "persona-adherence", "multi-check", "horror-books", "mystery-films", "book-and-film-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: frights-not-whodunits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative novels are genres the persona rates neutral and the non-mystery screenings genres it rates neutral — so the picks isolate its taste for horror fiction and its distaste for mystery films, two separate things: a reader can relish a haunted-house novel and still not want to sit through a whodunit.
[[checks]]
dimension_id = "bookg_horror"
dimension_label = "Books: Horror"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_horror=Love"
adherence_signal = "The novels chosen are horror (haunted house, possession, folk horror) rather than the science-fiction novel, fantasy novel and memoir the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_mystery"
dimension_label = "Film: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_mystery=Dislike"
adherence_signal = "The screenings chosen are the non-mystery films (action film, animated feature, musical); no mystery is booked, even though the club pushes the whodunit, the missing-person mystery and the country-house mystery. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
