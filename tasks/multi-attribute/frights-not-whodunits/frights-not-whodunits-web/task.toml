version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frights-not-whodunits-web"
theme = "Books: Horror = Love · Film: Mystery = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "horror-books", "mystery-films", "book-and-film-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: frights-not-whodunits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative novels are genres the persona rates neutral and the non-mystery screenings genres it rates neutral — so the picks isolate its taste for horror fiction and its distaste for mystery films, two separate things: a reader can relish a haunted-house novel and still not want to sit through a whodunit.
[[checks]]
dimension_id = "bookg_horror"
dimension_label = "Books: Horror"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_horror=Love"
adherence_signal = "The novels chosen are horror (haunted house, possession, folk horror) rather than the science-fiction novel, fantasy novel and memoir the club pushes. Ground truth is each item's data-frights attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_mystery"
dimension_label = "Film: Mystery"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_mystery=Dislike"
adherence_signal = "The screenings chosen are the non-mystery films (action film, animated feature, musical); no mystery is booked, even though the club pushes the whodunit, the missing-person mystery and the country-house mystery. Ground truth is each item's data-whodunit attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
