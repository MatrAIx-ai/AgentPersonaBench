version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/esports-not-orchestra-app"
theme = "Sport: Esports = Play · Music: Classical = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "esports", "classical", "student-union", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: esports-not-orchestra.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its esports and its distaste for classical music.
[[checks]]
dimension_id = "sport_esports"
dimension_label = "Sport: Esports"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_esports=Play"
adherence_signal = "The slots chosen are esports (the five-stack scrim, the fighting-game bracket, the LAN heat) rather than the badminton, table-tennis and climbing slots the union pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_classical"
dimension_label = "Music: Classical"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_classical=Dislike"
adherence_signal = "The concerts chosen are the non-classical ones (blues, indie, gospel); no classical concert is booked, even though the union pushes the string quartet, the chamber orchestra and the piano recital. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WednesdaysUnion (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WednesdaysUnion once the desktop is up so the agent finds it on screen.
command = "/opt/wednesdaysunion/start-wednesdaysunion.sh"
timeout_sec = 60.0
retries = 5
