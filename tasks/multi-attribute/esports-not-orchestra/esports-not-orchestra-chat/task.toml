version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/esports-not-orchestra-chat"
theme = "Sport: Esports = Play · Music: Classical = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "student_union_events_desk"
tags = [ "persona-adherence", "multi-check", "esports", "classical", "student-union", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: esports-not-orchestra.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its esports and its distaste for classical music.
[[checks]]
dimension_id = "sport_esports"
dimension_label = "Sport: Esports"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_esports=Play"
adherence_signal = "The slots chosen are esports (the five-stack scrim, the fighting-game bracket, the LAN heat) rather than the badminton, table-tennis and climbing slots the union pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_classical"
dimension_label = "Music: Classical"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_classical=Dislike"
adherence_signal = "The concerts chosen are the non-classical ones (blues, indie, gospel); no classical concert is booked, even though the union pushes the string quartet, the chamber orchestra and the piano recital. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
