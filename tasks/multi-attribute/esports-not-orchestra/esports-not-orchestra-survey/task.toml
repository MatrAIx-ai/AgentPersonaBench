version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/esports-not-orchestra-survey"
theme = "Sport: Esports = Play · Music: Classical = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "esports", "classical", "student-union", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: esports-not-orchestra.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Wednesday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its esports and its distaste for classical music.
[[checks]]
dimension_id = "sport_esports"
dimension_label = "Sport: Esports"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_esports=Play"
adherence_signal = "The slots chosen are esports (the five-stack scrim, the fighting-game bracket, the LAN heat) rather than the badminton, table-tennis and climbing slots the union pushes. Each option id maps to a `scrim` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_classical"
dimension_label = "Music: Classical"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_classical=Dislike"
adherence_signal = "The concerts chosen are the non-classical ones (blues, indie, gospel); no classical concert is booked, even though the union pushes the string quartet, the chamber orchestra and the piano recital. Each option id maps to a `chamber` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
