version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-not-gumbo-survey"
theme = "Sport: Equestrian = Play · Cuisine: Cajun = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "equestrian", "cajun", "country-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-not-gumbo.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative activities are sports the persona rates neutral and the non-Cajun lunches cuisines it rates neutral — so the picks isolate its riding and its distaste for Cajun food.
[[checks]]
dimension_id = "sport_equestrian"
dimension_label = "Sport: Equestrian"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_equestrian=Play"
adherence_signal = "The activities chosen are equestrian (the show-jumping lesson, the dressage session, the cross-country ride) rather than the tennis, golf and archery sessions the club pushes. Each option id maps to a `stirrup` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_cajun=Avoid"
adherence_signal = "The lunches chosen are the non-Cajun ones (Italian, Greek, Spanish); no Cajun lunch is booked, even though the club pushes the gumbo, the jambalaya and the blackened catfish. Each option id maps to a `gumbo` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
