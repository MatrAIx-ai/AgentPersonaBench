version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-not-gumbo-chat"
theme = "Sport: Equestrian = Play · Cuisine: Cajun = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "country_club_desk"
tags = [ "persona-adherence", "multi-check", "equestrian", "cajun", "country-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-not-gumbo.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative activities are sports the persona rates neutral and the non-Cajun lunches cuisines it rates neutral — so the picks isolate its riding and its distaste for Cajun food.
[[checks]]
dimension_id = "sport_equestrian"
dimension_label = "Sport: Equestrian"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_equestrian=Play"
adherence_signal = "The activities chosen are equestrian (the show-jumping lesson, the dressage session, the cross-country ride) rather than the tennis, golf and archery sessions the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_cajun=Avoid"
adherence_signal = "The lunches chosen are the non-Cajun ones (Italian, Greek, Spanish); no Cajun lunch is booked, even though the club pushes the gumbo, the jambalaya and the blackened catfish. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
