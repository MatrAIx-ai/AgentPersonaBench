version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/saddle-not-gumbo-app"
theme = "Sport: Equestrian = Play · Cuisine: Cajun = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "equestrian", "cajun", "country-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: saddle-not-gumbo.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative activities are sports the persona rates neutral and the non-Cajun lunches cuisines it rates neutral — so the picks isolate its riding and its distaste for Cajun food.
[[checks]]
dimension_id = "sport_equestrian"
dimension_label = "Sport: Equestrian"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_equestrian=Play"
adherence_signal = "The activities chosen are equestrian (the show-jumping lesson, the dressage session, the cross-country ride) rather than the tennis, golf and archery sessions the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_cajun=Avoid"
adherence_signal = "The lunches chosen are the non-Cajun ones (Italian, Greek, Spanish); no Cajun lunch is booked, even though the club pushes the gumbo, the jambalaya and the blackened catfish. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundayBundlesClub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundayBundlesClub once the desktop is up so the agent finds it on screen.
command = "/opt/sundaybundlesclub/start-sundaybundlesclub.sh"
timeout_sec = 60.0
retries = 5
