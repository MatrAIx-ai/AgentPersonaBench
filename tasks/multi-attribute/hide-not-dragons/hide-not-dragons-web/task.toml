version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hide-not-dragons-web"
theme = "Hobby: Leatherworking = Avid · Film: Fantasy = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "leatherworking", "fantasy-film", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hide-not-dragons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, everything is indoors (the persona is indoor-leaning) and the centre is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its leatherworking and its distaste for fantasy films.
[[checks]]
dimension_id = "hob_leatherworking"
dimension_label = "Hobby: Leatherworking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_leatherworking=Avid"
adherence_signal = "The workshops chosen are leatherworking (the card wallet, the belt, the hand-stitched bag) rather than the knitting, pottery and origami sessions the centre pushes. Ground truth is each item's data-saddlestitch attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_fantasy"
dimension_label = "Film: Fantasy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_fantasy=Dislike"
adherence_signal = "The films chosen are the non-fantasy ones (the heist film, the biopic, the comedy-drama); no fantasy film is booked, even though the centre pushes the dragon epic, the portal film and the sword-and-sorcery film. Ground truth is each item's data-dragonreel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
