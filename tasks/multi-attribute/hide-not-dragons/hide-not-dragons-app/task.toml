version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hide-not-dragons-app"
theme = "Hobby: Leatherworking = Avid · Film: Fantasy = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "leatherworking", "fantasy-film", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hide-not-dragons.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, everything is indoors (the persona is indoor-leaning) and the centre is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its leatherworking and its distaste for fantasy films.
[[checks]]
dimension_id = "hob_leatherworking"
dimension_label = "Hobby: Leatherworking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_leatherworking=Avid"
adherence_signal = "The workshops chosen are leatherworking (the card wallet, the belt, the hand-stitched bag) rather than the knitting, pottery and origami sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_fantasy"
dimension_label = "Film: Fantasy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_fantasy=Dislike"
adherence_signal = "The films chosen are the non-fantasy ones (the heist film, the biopic, the comedy-drama); no fantasy film is booked, even though the centre pushes the dragon epic, the portal film and the sword-and-sorcery film. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenAndHide (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenAndHide once the desktop is up so the agent finds it on screen.
command = "/opt/screenandhide/start-screenandhide.sh"
timeout_sec = 60.0
retries = 5
