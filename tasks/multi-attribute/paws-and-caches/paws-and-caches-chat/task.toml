version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paws-and-caches-chat"
theme = "Pet ownership = Multiple pets · Hobby: Geocaching = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "holiday_let_agent"
tags = [ "persona-adherence", "multi-check", "pet-ownership", "geocaching", "holiday-cottages", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paws-and-caches.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every cottage costs the same, sleeps the same and sits the same distance from the coast; the no-pets cottages are equally comfortable and the non-cache draws are equally attractive — so the picks isolate the persona's own household of animals and its geocaching.
[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
value = "Multiple pets"
evaluator = "llm-judge"
evaluator_name = "lstyle_pet_ownership=Multiple pets"
adherence_signal = "The cottages chosen are the pets-welcome ones rather than the no-pets cottages the agency pushes as its premium picks. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_geocaching"
dimension_label = "Hobby: Geocaching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_geocaching=Active"
adherence_signal = "The cottages chosen are the ones with a geocache trail on the doorstep rather than the equally attractive sea-view, hot-tub and breakfast-hamper cottages the agency pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
