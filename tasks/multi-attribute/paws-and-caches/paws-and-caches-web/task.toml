version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paws-and-caches-web"
theme = "Pet ownership = Multiple pets · Hobby: Geocaching = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "pet-ownership", "geocaching", "holiday-cottages", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paws-and-caches.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every cottage costs the same, sleeps the same and sits the same distance from the coast; the no-pets cottages are equally comfortable and the non-cache draws are equally attractive — so the picks isolate the persona's own household of animals and its geocaching.
[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
value = "Multiple pets"
evaluator = "rule-based"
evaluator_name = "lstyle_pet_ownership=Multiple pets"
adherence_signal = "The cottages chosen are the pets-welcome ones rather than the no-pets cottages the agency pushes as its premium picks. Ground truth is each item's data-petsok attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_geocaching"
dimension_label = "Hobby: Geocaching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_geocaching=Active"
adherence_signal = "The cottages chosen are the ones with a geocache trail on the doorstep rather than the equally attractive sea-view, hot-tub and breakfast-hamper cottages the agency pushes. Ground truth is each item's data-cache attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
