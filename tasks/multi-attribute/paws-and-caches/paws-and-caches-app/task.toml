version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paws-and-caches-app"
theme = "Pet ownership = Multiple pets · Hobby: Geocaching = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "pet-ownership", "geocaching", "holiday-cottages", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paws-and-caches.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every cottage costs the same, sleeps the same and sits the same distance from the coast; the no-pets cottages are equally comfortable and the non-cache draws are equally attractive — so the picks isolate the persona's own household of animals and its geocaching.
[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
value = "Multiple pets"
evaluator = "rule-based"
evaluator_name = "lstyle_pet_ownership=Multiple pets"
adherence_signal = "The cottages chosen are the pets-welcome ones rather than the no-pets cottages the agency pushes as its premium picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_geocaching"
dimension_label = "Hobby: Geocaching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_geocaching=Active"
adherence_signal = "The cottages chosen are the ones with a geocache trail on the doorstep rather than the equally attractive sea-view, hot-tub and breakfast-hamper cottages the agency pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LetFinder (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LetFinder once the desktop is up so the agent finds it on screen.
command = "/opt/letfinder/start-letfinder.sh"
timeout_sec = 60.0
retries = 5
