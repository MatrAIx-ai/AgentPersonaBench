version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/forage-not-soul-app"
theme = "Hobby: Foraging = Active · Music: Soul = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "foraging", "soul", "countryside-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: forage-not-soul.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, every morning is outdoors (the persona is strongly outdoor, so being outside is common to both sides) and the barn is alcohol-free (the persona drinks none); the alternative mornings are outdoor hobbies the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its foraging and its distaste for soul music.
[[checks]]
dimension_id = "hob_foraging"
dimension_label = "Hobby: Foraging"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_foraging=Active"
adherence_signal = "The mornings chosen are forages (the hedgerow forage, the mushroom forage, the coastal forage) rather than the birdwatching, geocaching and kayaking mornings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_soul"
dimension_label = "Music: Soul"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_soul=Dislike"
adherence_signal = "The concerts chosen are the non-soul ones (bluegrass, jazz, folk); no soul concert is booked, even though the centre pushes the soul revue, the soul singer and the Motown-style band. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundaysBarn (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundaysBarn once the desktop is up so the agent finds it on screen.
command = "/opt/sundaysbarn/start-sundaysbarn.sh"
timeout_sec = 60.0
retries = 5
