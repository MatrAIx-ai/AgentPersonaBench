version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/forage-not-soul-web"
theme = "Hobby: Foraging = Active · Music: Soul = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "foraging", "soul", "countryside-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: forage-not-soul.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, every morning is outdoors (the persona is strongly outdoor, so being outside is common to both sides) and the barn is alcohol-free (the persona drinks none); the alternative mornings are outdoor hobbies the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its foraging and its distaste for soul music.
[[checks]]
dimension_id = "hob_foraging"
dimension_label = "Hobby: Foraging"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_foraging=Active"
adherence_signal = "The mornings chosen are forages (the hedgerow forage, the mushroom forage, the coastal forage) rather than the birdwatching, geocaching and kayaking mornings the centre pushes. Ground truth is each item's data-hedgerow attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_soul"
dimension_label = "Music: Soul"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_soul=Dislike"
adherence_signal = "The concerts chosen are the non-soul ones (bluegrass, jazz, folk); no soul concert is booked, even though the centre pushes the soul revue, the soul singer and the Motown-style band. Ground truth is each item's data-soulrevue attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
