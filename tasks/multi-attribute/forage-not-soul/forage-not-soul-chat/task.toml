version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/forage-not-soul-chat"
theme = "Hobby: Foraging = Active · Music: Soul = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "countryside_centre_desk"
tags = [ "persona-adherence", "multi-check", "foraging", "soul", "countryside-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: forage-not-soul.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, every morning is outdoors (the persona is strongly outdoor, so being outside is common to both sides) and the barn is alcohol-free (the persona drinks none); the alternative mornings are outdoor hobbies the persona rates neutral and the alternative concerts genres it rates neutral — so the picks isolate its foraging and its distaste for soul music.
[[checks]]
dimension_id = "hob_foraging"
dimension_label = "Hobby: Foraging"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_foraging=Active"
adherence_signal = "The mornings chosen are forages (the hedgerow forage, the mushroom forage, the coastal forage) rather than the birdwatching, geocaching and kayaking mornings the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_soul"
dimension_label = "Music: Soul"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_soul=Dislike"
adherence_signal = "The concerts chosen are the non-soul ones (bluegrass, jazz, folk); no soul concert is booked, even though the centre pushes the soul revue, the soul singer and the Motown-style band. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
