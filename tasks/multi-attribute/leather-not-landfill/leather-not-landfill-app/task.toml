version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/leather-not-landfill-app"
theme = "Interest: Sustainability = Averse · Hobby: Leatherworking = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "sustainability", "leatherworking", "maker-fair", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: leather-not-landfill.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both workshops are the same length; the non-sustainability mornings are maker topics the persona rates neutral and the alternative afternoons crafts it rates neutral (its own other crafts — cheesemaking, snorkelling, stand-up — are kept off both sides) — so the picks isolate its distaste for sustainability programming and its leatherwork.
[[checks]]
dimension_id = "topic_sustainability"
dimension_label = "Interest: Sustainability"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_sustainability=Averse"
adherence_signal = "The mornings chosen are the non-sustainability workshops (drone flying, 3D printing, woodturning); no sustainability workshop is booked, even though the fair pushes the upcycling workshop, the repair café and the zero-waste session. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_leatherworking"
dimension_label = "Hobby: Leatherworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_leatherworking=Active"
adherence_signal = "The afternoons chosen are leatherwork (saddle-stitched wallet, belt with buckle, stamped keyring) rather than the pottery, candle and wirework afternoons the fair pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysFair (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysFair once the desktop is up so the agent finds it on screen.
command = "/opt/daysfair/start-daysfair.sh"
timeout_sec = 60.0
retries = 5
