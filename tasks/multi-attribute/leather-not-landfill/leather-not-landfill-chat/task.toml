version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/leather-not-landfill-chat"
theme = "Interest: Sustainability = Averse · Hobby: Leatherworking = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "maker_fair_booking_desk"
tags = [ "persona-adherence", "multi-check", "sustainability", "leatherworking", "maker-fair", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: leather-not-landfill.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both workshops are the same length; the non-sustainability mornings are maker topics the persona rates neutral and the alternative afternoons crafts it rates neutral (its own other crafts — cheesemaking, snorkelling, stand-up — are kept off both sides) — so the picks isolate its distaste for sustainability programming and its leatherwork.
[[checks]]
dimension_id = "topic_sustainability"
dimension_label = "Interest: Sustainability"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_sustainability=Averse"
adherence_signal = "The mornings chosen are the non-sustainability workshops (drone flying, 3D printing, woodturning); no sustainability workshop is booked, even though the fair pushes the upcycling workshop, the repair café and the zero-waste session. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "hob_leatherworking"
dimension_label = "Hobby: Leatherworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_leatherworking=Active"
adherence_signal = "The afternoons chosen are leatherwork (saddle-stitched wallet, belt with buckle, stamped keyring) rather than the pottery, candle and wirework afternoons the fair pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
