version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/coding-not-art-app"
theme = "Subject: Computer science = Passionate · Subject: Visual art = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "computer-science", "visual-art", "museum-lates", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: coding-not-art.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the computing side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of computer science and its distaste for visual art as a subject.
[[checks]]
dimension_id = "acad_computer_science"
dimension_label = "Subject: Computer science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_computer_science=Passionate"
adherence_signal = "The talks chosen are computer science (algorithms, internet routing, a first program) rather than the algebra, economics and physics talks the museum pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_visual_art"
dimension_label = "Subject: Visual art"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_visual_art=Averse"
adherence_signal = "The sessions chosen are the non-art ones (geography, astronomy, philosophy); no visual-art session is booked, even though the museum pushes colour theory, drawing the figure and reading a painting. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TalkLatesMuseum (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TalkLatesMuseum once the desktop is up so the agent finds it on screen.
command = "/opt/talklatesmuseum/start-talklatesmuseum.sh"
timeout_sec = 60.0
retries = 5
