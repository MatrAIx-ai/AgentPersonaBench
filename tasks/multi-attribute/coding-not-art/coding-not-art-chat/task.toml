version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/coding-not-art-chat"
theme = "Subject: Computer science = Passionate · Subject: Visual art = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "museum_learning_desk"
tags = [ "persona-adherence", "multi-check", "computer-science", "visual-art", "museum-lates", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: coding-not-art.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the computing side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of computer science and its distaste for visual art as a subject.
[[checks]]
dimension_id = "acad_computer_science"
dimension_label = "Subject: Computer science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_computer_science=Passionate"
adherence_signal = "The talks chosen are computer science (algorithms, internet routing, a first program) rather than the algebra, economics and physics talks the museum pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_visual_art"
dimension_label = "Subject: Visual art"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_visual_art=Averse"
adherence_signal = "The sessions chosen are the non-art ones (geography, astronomy, philosophy); no visual-art session is booked, even though the museum pushes colour theory, drawing the figure and reading a painting. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
