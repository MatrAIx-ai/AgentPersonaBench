version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/museum-and-cape-web"
theme = "Vacation style = Culture · Film: Superhero = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "vacation-style", "superhero-films", "city-weekend", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: museum-and-cape.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the non-sightseeing days are equally pleasant and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own museum-and-old-town holiday style and its taste for superhero films.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Culture"
evaluator = "rule-based"
evaluator_name = "lstyle_vacation_style=Culture"
adherence_signal = "The daytime halves of the packages are museum, gallery and old-town days rather than the equally pleasant beach, spa and mall days the planner pushes. Ground truth is each item's data-galleries attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_superhero"
dimension_label = "Film: Superhero"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_superhero=Love"
adherence_signal = "The evening halves of the packages are superhero films (caped-crusader sequel, super-team crossover, vigilante origin story) rather than the equally well-reviewed drama, romcom and documentary the planner pushes. Ground truth is each item's data-cape attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
