version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/museum-and-cape-app"
theme = "Vacation style = Culture · Film: Superhero = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "vacation-style", "superhero-films", "city-weekend", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: museum-and-cape.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the non-sightseeing days are equally pleasant and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own museum-and-old-town holiday style and its taste for superhero films.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Culture"
evaluator = "rule-based"
evaluator_name = "lstyle_vacation_style=Culture"
adherence_signal = "The daytime halves of the packages are museum, gallery and old-town days rather than the equally pleasant beach, spa and mall days the planner pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_superhero"
dimension_label = "Film: Superhero"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_superhero=Love"
adherence_signal = "The evening halves of the packages are superhero films (caped-crusader sequel, super-team crossover, vigilante origin story) rather than the equally well-reviewed drama, romcom and documentary the planner pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekendPlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekendPlanner once the desktop is up so the agent finds it on screen.
command = "/opt/weekendplanner/start-weekendplanner.sh"
timeout_sec = 60.0
retries = 5
