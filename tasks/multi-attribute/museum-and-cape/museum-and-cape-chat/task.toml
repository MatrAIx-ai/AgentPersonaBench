version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/museum-and-cape-chat"
theme = "Vacation style = Culture · Film: Superhero = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "city_break_planner"
tags = [ "persona-adherence", "multi-check", "vacation-style", "superhero-films", "city-weekend", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: museum-and-cape.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the non-sightseeing days are equally pleasant and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own museum-and-old-town holiday style and its taste for superhero films.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Culture"
evaluator = "llm-judge"
evaluator_name = "lstyle_vacation_style=Culture"
adherence_signal = "The daytime halves of the packages are museum, gallery and old-town days rather than the equally pleasant beach, spa and mall days the planner pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_superhero"
dimension_label = "Film: Superhero"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_superhero=Love"
adherence_signal = "The evening halves of the packages are superhero films (caped-crusader sequel, super-team crossover, vigilante origin story) rather than the equally well-reviewed drama, romcom and documentary the planner pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
