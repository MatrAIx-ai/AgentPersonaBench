version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/improv-not-drones-chat"
theme = "Hobby: Improv = Active · Interest: Drones = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "arts_centre_evenings_desk"
tags = [ "persona-adherence", "multi-check", "improv", "drones", "arts-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: improv-not-drones.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same and both halves are the same length; the alternative workshops are crafts the persona has no rating on and the alternative late sessions topics it rates neutral (all indoors, as it prefers) — so the picks isolate its improv and its distaste for drones.
[[checks]]
dimension_id = "hob_improv"
dimension_label = "Hobby: Improv"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_improv=Active"
adherence_signal = "The workshops chosen are improv (improv games, long-form improv, improv for beginners) rather than the pottery, life-drawing and origami workshops the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_drones"
dimension_label = "Interest: Drones"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_drones=Averse"
adherence_signal = "The late sessions chosen are the non-drone ones (astronomy talk, magic show, quiz); no drone session is booked, even though the centre pushes the flying demo, the FPV racing intro and the drone-photography talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
