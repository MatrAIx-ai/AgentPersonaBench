version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/improv-not-drones-survey"
theme = "Hobby: Improv = Active · Interest: Drones = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "improv", "drones", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: improv-not-drones.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same and both halves are the same length; the alternative workshops are crafts the persona has no rating on and the alternative late sessions topics it rates neutral (all indoors, as it prefers) — so the picks isolate its improv and its distaste for drones.
[[checks]]
dimension_id = "hob_improv"
dimension_label = "Hobby: Improv"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_improv=Active"
adherence_signal = "The workshops chosen are improv (improv games, long-form improv, improv for beginners) rather than the pottery, life-drawing and origami workshops the centre pushes. Each option id maps to a `improv` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_drones"
dimension_label = "Interest: Drones"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_drones=Averse"
adherence_signal = "The late sessions chosen are the non-drone ones (astronomy talk, magic show, quiz); no drone session is booked, even though the centre pushes the flying demo, the FPV racing intro and the drone-photography talk. Each option id maps to a `dronesession` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
