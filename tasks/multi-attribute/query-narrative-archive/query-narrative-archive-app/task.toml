version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/query-narrative-archive-app"
theme = "Tool: SQL = Power user · Skill: Writing = Advanced"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community-archive"
tags = [ "persona-adherence", "multi-check", "archive-research", "data-query", "editorial-writing", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: query-narrative-archive.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# All routes produce the same verified archive release on the same deadline; query routes trade browser convenience for hands-on SQL control, while editorial routes trade template speed for original prose work.
[[checks]]
dimension_id = "tool_sql"
dimension_label = "Tool: SQL"
category = "Skills: Tools"
value = "Power user"
evaluator = "rule-based"
evaluator_name = "tool_sql=Power user"
adherence_signal = "Every selected work package uses a hands-on SQL console and handwritten queries rather than a browser query builder. Visible app ids, names, descriptions, and notes are joined to the reviewed host-only tests/answer_key.json; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "skill_writing"
dimension_label = "Skill: Writing"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_writing=Advanced"
adherence_signal = "Every selected work package includes an original interpretive narrative drafted and revised by the participant rather than assembled from fixed caption templates. Visible app ids, names, descriptions, and notes are joined to the reviewed host-only tests/answer_key.json; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ArchiveWorkbench (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ArchiveWorkbench once the desktop is up so the agent finds it on screen.
command = "/opt/archiveworkbench/start-archiveworkbench.sh"
timeout_sec = 60.0
retries = 5
