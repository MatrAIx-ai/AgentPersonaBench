version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/classic-hearts-app"
theme = "Film: Romance = Love · Adventurousness = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "romance-films", "adventurousness", "cinema-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: classic-hearts.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with membership and the same length; the alternative genres are ones the persona rates neutral and the novel formats cost nothing extra — so the picks isolate the persona's own taste for romance and its preference for the familiar over the untried.
[[checks]]
dimension_id = "filmg_romance"
dimension_label = "Film: Romance"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_romance=Love"
adherence_signal = "The screenings chosen are romances (the classic re-release, the 90s romance, the restored romantic drama) rather than the equally well-reviewed caper, comedy and biopic the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
value = "Low"
evaluator = "rule-based"
evaluator_name = "big5_adventurousness=Low"
adherence_signal = "The formats chosen are the familiar ones (regular screening, the usual auditorium, standard seats) rather than the audience-vote, secret-screening and dome-headset formats the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenClub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenClub once the desktop is up so the agent finds it on screen.
command = "/opt/screenclub/start-screenclub.sh"
timeout_sec = 60.0
retries = 5
