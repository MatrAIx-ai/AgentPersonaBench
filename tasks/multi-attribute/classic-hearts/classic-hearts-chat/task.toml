version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/classic-hearts-chat"
theme = "Film: Romance = Love · Adventurousness = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "cinema_club_desk"
tags = [ "persona-adherence", "multi-check", "romance-films", "adventurousness", "cinema-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: classic-hearts.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with membership and the same length; the alternative genres are ones the persona rates neutral and the novel formats cost nothing extra — so the picks isolate the persona's own taste for romance and its preference for the familiar over the untried.
[[checks]]
dimension_id = "filmg_romance"
dimension_label = "Film: Romance"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_romance=Love"
adherence_signal = "The screenings chosen are romances (the classic re-release, the 90s romance, the restored romantic drama) rather than the equally well-reviewed caper, comedy and biopic the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
value = "Low"
evaluator = "llm-judge"
evaluator_name = "big5_adventurousness=Low"
adherence_signal = "The formats chosen are the familiar ones (regular screening, the usual auditorium, standard seats) rather than the audience-vote, secret-screening and dome-headset formats the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
