version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/classic-hearts-survey"
theme = "Film: Romance = Love · Adventurousness = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "romance-films", "adventurousness", "cinema-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: classic-hearts.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every screening is free with membership and the same length; the alternative genres are ones the persona rates neutral and the novel formats cost nothing extra — so the picks isolate the persona's own taste for romance and its preference for the familiar over the untried.
[[checks]]
dimension_id = "filmg_romance"
dimension_label = "Film: Romance"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_romance=Love"
adherence_signal = "The screenings chosen are romances (the classic re-release, the 90s romance, the restored romantic drama) rather than the equally well-reviewed caper, comedy and biopic the club pushes. Each option id maps to a `heart` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
value = "Low"
evaluator = "rule-based"
evaluator_name = "big5_adventurousness=Low"
adherence_signal = "The formats chosen are the familiar ones (regular screening, the usual auditorium, standard seats) rather than the audience-vote, secret-screening and dome-headset formats the club pushes. Each option id maps to a `familiar` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
