version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wall-for-the-river-chat"
theme = "Hobby: Bouldering = Active · Interest: Environment = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "community"
application_id = "climbing_gym_desk"
tags = [ "persona-adherence", "multi-check", "bouldering", "environment", "fundraiser-evenings", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wall-for-the-river.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Both session sides are equally physical and open to all members, both cause sides are equally worthy and local, and every evening costs the same — so the picks isolate the persona's own bouldering and its investment in environmental causes.
[[checks]]
dimension_id = "hob_bouldering"
dimension_label = "Hobby: Bouldering"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_bouldering=Active"
adherence_signal = "The fundraiser evenings chosen are bouldering sessions (comp, league night, problem-setting workshop) rather than the equally sweaty slackline, mobility and trail-run alternatives the desk pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_environment"
dimension_label = "Interest: Environment"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_environment=Passionate"
adherence_signal = "The evenings chosen send their proceeds to environmental causes (river clean-up, tree planting, peatland restoration) rather than the equally worthy scholarship, food-bank and hospice evenings the desk pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
