version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wall-for-the-river-survey"
theme = "Hobby: Bouldering = Active · Interest: Environment = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "multi-check", "bouldering", "environment", "fundraiser-evenings", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wall-for-the-river.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Both session sides are equally physical and open to all members, both cause sides are equally worthy and local, and every evening costs the same — so the picks isolate the persona's own bouldering and its investment in environmental causes.
[[checks]]
dimension_id = "hob_bouldering"
dimension_label = "Hobby: Bouldering"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_bouldering=Active"
adherence_signal = "The fundraiser evenings chosen are bouldering sessions (comp, league night, problem-setting workshop) rather than the equally sweaty slackline, mobility and trail-run alternatives the desk pushes. Each option id maps to a `boulder` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_environment"
dimension_label = "Interest: Environment"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_environment=Passionate"
adherence_signal = "The evenings chosen send their proceeds to environmental causes (river clean-up, tree planting, peatland restoration) rather than the equally worthy scholarship, food-bank and hospice evenings the desk pushes. Each option id maps to a `green` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
