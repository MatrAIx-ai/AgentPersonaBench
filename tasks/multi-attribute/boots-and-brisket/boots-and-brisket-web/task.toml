version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/boots-and-brisket-web"
theme = "Music: Country = Love · Cuisine: American BBQ = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "country-music", "american-bbq", "barn-nights", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: boots-and-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every barn night costs the same, no supper contains pork and no alcohol is served; the alternative genres and cuisines are ones the persona rates neutral — so the picks isolate the persona's own taste for country music and for smokehouse barbecue.
[[checks]]
dimension_id = "musg_country"
dimension_label = "Music: Country"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_country=Love"
adherence_signal = "The barn nights chosen have country acts (trio, honky-tonk band, fiddle showcase) rather than the equally good pop-covers, Latin big-band and ska nights the venue pushes. Ground truth is each item's data-twang attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_american_bbq=Love"
adherence_signal = "The suppers chosen are smokehouse barbecue (brisket, smoked chicken, short ribs) rather than the equally generous Thai, Greek and Peruvian plates the venue pushes. Ground truth is each item's data-smokehouse attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
