version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/boots-and-brisket-app"
theme = "Music: Country = Love · Cuisine: American BBQ = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "country-music", "american-bbq", "barn-nights", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: boots-and-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every barn night costs the same, no supper contains pork and no alcohol is served; the alternative genres and cuisines are ones the persona rates neutral — so the picks isolate the persona's own taste for country music and for smokehouse barbecue.
[[checks]]
dimension_id = "musg_country"
dimension_label = "Music: Country"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_country=Love"
adherence_signal = "The barn nights chosen have country acts (trio, honky-tonk band, fiddle showcase) rather than the equally good pop-covers, Latin big-band and ska nights the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_american_bbq=Love"
adherence_signal = "The suppers chosen are smokehouse barbecue (brisket, smoked chicken, short ribs) rather than the equally generous Thai, Greek and Peruvian plates the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BarnTicket (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BarnTicket once the desktop is up so the agent finds it on screen.
command = "/opt/barnticket/start-barnticket.sh"
timeout_sec = 60.0
retries = 5
