version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/boots-and-brisket-chat"
theme = "Music: Country = Love · Cuisine: American BBQ = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "barn_venue_box_office"
tags = [ "persona-adherence", "multi-check", "country-music", "american-bbq", "barn-nights", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: boots-and-brisket.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every barn night costs the same, no supper contains pork and no alcohol is served; the alternative genres and cuisines are ones the persona rates neutral — so the picks isolate the persona's own taste for country music and for smokehouse barbecue.
[[checks]]
dimension_id = "musg_country"
dimension_label = "Music: Country"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_country=Love"
adherence_signal = "The barn nights chosen have country acts (trio, honky-tonk band, fiddle showcase) rather than the equally good pop-covers, Latin big-band and ska nights the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_american_bbq"
dimension_label = "Cuisine: American BBQ"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_american_bbq=Love"
adherence_signal = "The suppers chosen are smokehouse barbecue (brisket, smoked chicken, short ribs) rather than the equally generous Thai, Greek and Peruvian plates the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
