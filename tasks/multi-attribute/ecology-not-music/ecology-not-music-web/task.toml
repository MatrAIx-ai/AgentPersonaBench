version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ecology-not-music-web"
theme = "Subject: Environmental science = Passionate · Subject: Music = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "environmental-science", "music", "festival-day-passes", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ecology-not-music.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the environmental side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of environmental science and its distaste for music as a subject.
[[checks]]
dimension_id = "acad_environmental_science"
dimension_label = "Subject: Environmental science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_environmental_science=Passionate"
adherence_signal = "The talks chosen are environmental science (ecosystems under pressure, rewilding, carbon cycles) rather than the geometry, astronomy and logic talks the festival pushes. Ground truth is each item's data-biosphere attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_music"
dimension_label = "Subject: Music"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_music=Averse"
adherence_signal = "The sessions chosen are the non-music ones (computer science, creative writing, geography); no music session is booked, even though the festival pushes how harmony works, the symphony history and rhythm and the drum. Ground truth is each item's data-harmonyhour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

