version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ecology-not-music-chat"
theme = "Subject: Environmental science = Passionate · Subject: Music = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "festival_box_office"
tags = [ "persona-adherence", "multi-check", "environmental-science", "music", "festival-day-passes", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ecology-not-music.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the environmental side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of environmental science and its distaste for music as a subject.
[[checks]]
dimension_id = "acad_environmental_science"
dimension_label = "Subject: Environmental science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_environmental_science=Passionate"
adherence_signal = "The talks chosen are environmental science (ecosystems under pressure, rewilding, carbon cycles) rather than the geometry, astronomy and logic talks the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_music"
dimension_label = "Subject: Music"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_music=Averse"
adherence_signal = "The sessions chosen are the non-music ones (computer science, creative writing, geography); no music session is booked, even though the festival pushes how harmony works, the symphony history and rhythm and the drum. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
