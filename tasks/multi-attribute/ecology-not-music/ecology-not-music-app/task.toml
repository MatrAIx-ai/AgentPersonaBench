version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ecology-not-music-app"
theme = "Subject: Environmental science = Passionate · Subject: Music = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "environmental-science", "music", "festival-day-passes", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ecology-not-music.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the environmental side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of environmental science and its distaste for music as a subject.
[[checks]]
dimension_id = "acad_environmental_science"
dimension_label = "Subject: Environmental science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_environmental_science=Passionate"
adherence_signal = "The talks chosen are environmental science (ecosystems under pressure, rewilding, carbon cycles) rather than the geometry, astronomy and logic talks the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_music"
dimension_label = "Subject: Music"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_music=Averse"
adherence_signal = "The sessions chosen are the non-music ones (computer science, creative writing, geography); no music session is booked, even though the festival pushes how harmony works, the symphony history and rhythm and the drum. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DayPassesFestival (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DayPassesFestival once the desktop is up so the agent finds it on screen.
command = "/opt/daypassesfestival/start-daypassesfestival.sh"
timeout_sec = 60.0
retries = 5
