version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ecology-not-music-survey"
theme = "Subject: Environmental science = Passionate · Subject: Music = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "environmental-science", "music", "festival-day-passes", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ecology-not-music.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day pass costs the same and both halves are the same length; the alternative talks and sessions are subjects the persona rates neutral; the environmental side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of environmental science and its distaste for music as a subject.
[[checks]]
dimension_id = "acad_environmental_science"
dimension_label = "Subject: Environmental science"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_environmental_science=Passionate"
adherence_signal = "The talks chosen are environmental science (ecosystems under pressure, rewilding, carbon cycles) rather than the geometry, astronomy and logic talks the festival pushes. Each option id maps to a `biosphere` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "acad_music"
dimension_label = "Subject: Music"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_music=Averse"
adherence_signal = "The sessions chosen are the non-music ones (computer science, creative writing, geography); no music session is booked, even though the festival pushes how harmony works, the symphony history and rhythm and the drum. Each option id maps to a `harmonyhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
