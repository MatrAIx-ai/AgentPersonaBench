version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-tacos-app"
theme = "Books: Thriller = Dislike · Cuisine: Mexican = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "thriller", "mexican-cuisine", "book-and-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-tacos.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-Mexican suppers cuisines it rates neutral; every Mexican dish is chicken (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its distaste for thrillers and its distaste for Mexican food.
[[checks]]
dimension_id = "bookg_thriller"
dimension_label = "Books: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_thriller=Dislike"
adherence_signal = "The books chosen are the non-thrillers (the literary novel, the science fiction, the fantasy); no thriller is booked, even though the club pushes the spy thriller, the legal thriller and the psychological thriller. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_mexican=Avoid"
adherence_signal = "The suppers chosen are the non-Mexican ones (Greek, Thai, Korean); no Mexican supper is booked, even though the club pushes the tinga tacos, the enchiladas and the fajitas. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BoardAndBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BoardAndBook once the desktop is up so the agent finds it on screen.
command = "/opt/boardandbook/start-boardandbook.sh"
timeout_sec = 60.0
retries = 5
