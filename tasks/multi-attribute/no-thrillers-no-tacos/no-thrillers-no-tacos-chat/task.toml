version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-tacos-chat"
theme = "Books: Thriller = Dislike · Cuisine: Mexican = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "book_board_club_host"
tags = [ "persona-adherence", "multi-check", "thriller", "mexican-cuisine", "book-and-supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-tacos.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-Mexican suppers cuisines it rates neutral; every Mexican dish is chicken (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its distaste for thrillers and its distaste for Mexican food.
[[checks]]
dimension_id = "bookg_thriller"
dimension_label = "Books: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_thriller=Dislike"
adherence_signal = "The books chosen are the non-thrillers (the literary novel, the science fiction, the fantasy); no thriller is booked, even though the club pushes the spy thriller, the legal thriller and the psychological thriller. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_mexican=Avoid"
adherence_signal = "The suppers chosen are the non-Mexican ones (Greek, Thai, Korean); no Mexican supper is booked, even though the club pushes the tinga tacos, the enchiladas and the fajitas. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
