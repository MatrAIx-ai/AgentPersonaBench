version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-tacos-survey"
theme = "Books: Thriller = Dislike · Cuisine: Mexican = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "thriller", "mexican-cuisine", "book-and-supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-tacos.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-Mexican suppers cuisines it rates neutral; every Mexican dish is chicken (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its distaste for thrillers and its distaste for Mexican food.
[[checks]]
dimension_id = "bookg_thriller"
dimension_label = "Books: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_thriller=Dislike"
adherence_signal = "The books chosen are the non-thrillers (the literary novel, the science fiction, the fantasy); no thriller is booked, even though the club pushes the spy thriller, the legal thriller and the psychological thriller. Each option id maps to a `pageturner` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_mexican=Avoid"
adherence_signal = "The suppers chosen are the non-Mexican ones (Greek, Thai, Korean); no Mexican supper is booked, even though the club pushes the tinga tacos, the enchiladas and the fajitas. Each option id maps to a `tacoplate` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
