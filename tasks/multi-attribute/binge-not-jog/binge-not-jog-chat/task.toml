version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/binge-not-jog-chat"
theme = "Interest: TV series = Passionate · Interest: Running = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "weekend_club_host"
tags = [ "persona-adherence", "multi-check", "tv-series", "running", "weekend-social", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: binge-not-jog.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the alternative evenings are just as sociable and the non-running mornings just as active a way to start the day — so the picks isolate the persona's own devotion to series and its distaste for running.
[[checks]]
dimension_id = "topic_tv_series"
dimension_label = "Interest: TV series"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_tv_series=Passionate"
adherence_signal = "The evening halves of the packages are series events (finale watch party, box-set marathon, series quiz) rather than the equally sociable trivia, craft and film evenings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_running"
dimension_label = "Interest: Running"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_running=Averse"
adherence_signal = "The morning halves of the packages are the non-running mornings (brunch club, walking tour, market stroll); no run is booked, even though the club pushes the runs as the way to start the weekend. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
