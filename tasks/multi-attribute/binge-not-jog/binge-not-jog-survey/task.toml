version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/binge-not-jog-survey"
theme = "Interest: TV series = Passionate · Interest: Running = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "tv-series", "running", "weekend-social", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: binge-not-jog.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the alternative evenings are just as sociable and the non-running mornings just as active a way to start the day — so the picks isolate the persona's own devotion to series and its distaste for running.
[[checks]]
dimension_id = "topic_tv_series"
dimension_label = "Interest: TV series"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_tv_series=Passionate"
adherence_signal = "The evening halves of the packages are series events (finale watch party, box-set marathon, series quiz) rather than the equally sociable trivia, craft and film evenings the club pushes. Each option id maps to a `episodes` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_running"
dimension_label = "Interest: Running"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_running=Averse"
adherence_signal = "The morning halves of the packages are the non-running mornings (brunch club, walking tour, market stroll); no run is booked, even though the club pushes the runs as the way to start the weekend. Each option id maps to a `jog` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
