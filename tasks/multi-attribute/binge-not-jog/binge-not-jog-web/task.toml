version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/binge-not-jog-web"
theme = "Interest: TV series = Passionate · Interest: Running = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "tv-series", "running", "weekend-social", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: binge-not-jog.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the alternative evenings are just as sociable and the non-running mornings just as active a way to start the day — so the picks isolate the persona's own devotion to series and its distaste for running.
[[checks]]
dimension_id = "topic_tv_series"
dimension_label = "Interest: TV series"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_tv_series=Passionate"
adherence_signal = "The evening halves of the packages are series events (finale watch party, box-set marathon, series quiz) rather than the equally sociable trivia, craft and film evenings the club pushes. Ground truth is each item's data-episodes attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_running"
dimension_label = "Interest: Running"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_running=Averse"
adherence_signal = "The morning halves of the packages are the non-running mornings (brunch club, walking tour, market stroll); no run is booked, even though the club pushes the runs as the way to start the weekend. Ground truth is each item's data-jog attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
