version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/oars-not-noir-app"
theme = "Sport: Rowing = Play · Film: Noir = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "rowing", "noir", "riverside-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: oars-not-noir.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its rowing and its distaste for film noir.
[[checks]]
dimension_id = "sport_rowing"
dimension_label = "Sport: Rowing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_rowing=Play"
adherence_signal = "The sessions chosen are rowing (the sweep outing, the sculling session, the erg-and-water session) rather than the swim, cycle and run sessions the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_noir"
dimension_label = "Film: Noir"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_noir=Dislike"
adherence_signal = "The films chosen are the non-noir ones (the space film, the animated feature, the comedy-drama); no noir is booked, even though the club pushes the private-eye picture, the femme-fatale noir and the heist noir. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundaysRiverside (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundaysRiverside once the desktop is up so the agent finds it on screen.
command = "/opt/sundaysriverside/start-sundaysriverside.sh"
timeout_sec = 60.0
retries = 5
