version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/oars-not-noir-chat"
theme = "Sport: Rowing = Play · Film: Noir = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "riverside_club_desk"
tags = [ "persona-adherence", "multi-check", "rowing", "noir", "riverside-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: oars-not-noir.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its rowing and its distaste for film noir.
[[checks]]
dimension_id = "sport_rowing"
dimension_label = "Sport: Rowing"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_rowing=Play"
adherence_signal = "The sessions chosen are rowing (the sweep outing, the sculling session, the erg-and-water session) rather than the swim, cycle and run sessions the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_noir"
dimension_label = "Film: Noir"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_noir=Dislike"
adherence_signal = "The films chosen are the non-noir ones (the space film, the animated feature, the comedy-drama); no noir is booked, even though the club pushes the private-eye picture, the femme-fatale noir and the heist noir. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
