version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/oars-not-noir-web"
theme = "Sport: Rowing = Play · Film: Noir = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "rowing", "noir", "riverside-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: oars-not-noir.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and kit is provided; the alternative sessions are sports the persona rates neutral and the alternative films genres it rates neutral — so the picks isolate its rowing and its distaste for film noir.
[[checks]]
dimension_id = "sport_rowing"
dimension_label = "Sport: Rowing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_rowing=Play"
adherence_signal = "The sessions chosen are rowing (the sweep outing, the sculling session, the erg-and-water session) rather than the swim, cycle and run sessions the club pushes. Ground truth is each item's data-oarsman attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_noir"
dimension_label = "Film: Noir"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_noir=Dislike"
adherence_signal = "The films chosen are the non-noir ones (the space film, the animated feature, the comedy-drama); no noir is booked, even though the club pushes the private-eye picture, the femme-fatale noir and the heist noir. Ground truth is each item's data-noirreel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
