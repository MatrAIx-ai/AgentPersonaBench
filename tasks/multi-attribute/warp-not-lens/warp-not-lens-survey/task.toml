version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/warp-not-lens-survey"
theme = "Film: Sci-fi = Love · Interest: Photography = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "sci-fi", "photography", "community-cinema", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: warp-not-lens.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the alternative hours topics it rates neutral — so the picks isolate its taste for science fiction and its distaste for photography.
[[checks]]
dimension_id = "filmg_sci_fi"
dimension_label = "Film: Sci-fi"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_sci_fi=Love"
adherence_signal = "The films chosen are science fiction (the deep-space colony film, the time-loop film, the android film) rather than the mystery, costume piece and musical the cinema pushes. Each option id maps to a `starfield` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_photography"
dimension_label = "Interest: Photography"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_photography=Averse"
adherence_signal = "The society hours chosen are the non-photography ones (board games, chess, night sky); no camera hour is booked, even though the cinema pushes camera basics, the street-photo walk and portrait lighting. Each option id maps to a `camerahour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
