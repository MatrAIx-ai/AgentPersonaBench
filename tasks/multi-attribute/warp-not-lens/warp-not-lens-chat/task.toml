version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/warp-not-lens-chat"
theme = "Film: Sci-fi = Love · Interest: Photography = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "community_cinema_desk"
tags = [ "persona-adherence", "multi-check", "sci-fi", "photography", "community-cinema", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: warp-not-lens.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the alternative hours topics it rates neutral — so the picks isolate its taste for science fiction and its distaste for photography.
[[checks]]
dimension_id = "filmg_sci_fi"
dimension_label = "Film: Sci-fi"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_sci_fi=Love"
adherence_signal = "The films chosen are science fiction (the deep-space colony film, the time-loop film, the android film) rather than the mystery, costume piece and musical the cinema pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_photography"
dimension_label = "Interest: Photography"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_photography=Averse"
adherence_signal = "The society hours chosen are the non-photography ones (board games, chess, night sky); no camera hour is booked, even though the cinema pushes camera basics, the street-photo walk and portrait lighting. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
