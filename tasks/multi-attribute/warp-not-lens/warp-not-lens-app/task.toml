version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/warp-not-lens-app"
theme = "Film: Sci-fi = Love · Interest: Photography = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "sci-fi", "photography", "community-cinema", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: warp-not-lens.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the alternative hours topics it rates neutral — so the picks isolate its taste for science fiction and its distaste for photography.
[[checks]]
dimension_id = "filmg_sci_fi"
dimension_label = "Film: Sci-fi"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_sci_fi=Love"
adherence_signal = "The films chosen are science fiction (the deep-space colony film, the time-loop film, the android film) rather than the mystery, costume piece and musical the cinema pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_photography"
dimension_label = "Interest: Photography"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_photography=Averse"
adherence_signal = "The society hours chosen are the non-photography ones (board games, chess, night sky); no camera hour is booked, even though the cinema pushes camera basics, the street-photo walk and portrait lighting. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ReelThursday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ReelThursday once the desktop is up so the agent finds it on screen.
command = "/opt/reelthursday/start-reelthursday.sh"
timeout_sec = 60.0
retries = 5
