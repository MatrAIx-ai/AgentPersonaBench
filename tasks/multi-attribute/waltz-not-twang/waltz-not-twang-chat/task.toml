version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/waltz-not-twang-chat"
theme = "Hobby: Ballroom dance = Avid · Music: Country = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "community_hall_fridays_desk"
tags = [ "persona-adherence", "multi-check", "ballroom-dance", "country", "community-hall", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: waltz-not-twang.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same, the hall is alcohol-free (the persona drinks none) and everything is indoors; the alternative classes are hobbies the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its ballroom dancing and its distaste for country music.
[[checks]]
dimension_id = "hob_ballroom_dance"
dimension_label = "Hobby: Ballroom dance"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_ballroom_dance=Avid"
adherence_signal = "The classes chosen are ballroom (the waltz class, the foxtrot class, the quickstep class) rather than the improv, juggling and calligraphy hours the hall pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_country"
dimension_label = "Music: Country"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_country=Dislike"
adherence_signal = "The socials chosen are the non-country ones (jazz, blues, disco); no country social is booked, even though the hall pushes the country covers band, the honky-tonk band and the country singer-songwriter. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
