version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/waltz-not-twang-app"
theme = "Hobby: Ballroom dance = Avid · Music: Country = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "ballroom-dance", "country", "community-hall", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: waltz-not-twang.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same, the hall is alcohol-free (the persona drinks none) and everything is indoors; the alternative classes are hobbies the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its ballroom dancing and its distaste for country music.
[[checks]]
dimension_id = "hob_ballroom_dance"
dimension_label = "Hobby: Ballroom dance"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_ballroom_dance=Avid"
adherence_signal = "The classes chosen are ballroom (the waltz class, the foxtrot class, the quickstep class) rather than the improv, juggling and calligraphy hours the hall pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_country"
dimension_label = "Music: Country"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_country=Dislike"
adherence_signal = "The socials chosen are the non-country ones (jazz, blues, disco); no country social is booked, even though the hall pushes the country covers band, the honky-tonk band and the country singer-songwriter. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FridaysHall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FridaysHall once the desktop is up so the agent finds it on screen.
command = "/opt/fridayshall/start-fridayshall.sh"
timeout_sec = 60.0
retries = 5
