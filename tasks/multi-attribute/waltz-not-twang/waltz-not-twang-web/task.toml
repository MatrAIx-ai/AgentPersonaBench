version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/waltz-not-twang-web"
theme = "Hobby: Ballroom dance = Avid · Music: Country = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "ballroom-dance", "country", "community-hall", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: waltz-not-twang.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same, the hall is alcohol-free (the persona drinks none) and everything is indoors; the alternative classes are hobbies the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its ballroom dancing and its distaste for country music.
[[checks]]
dimension_id = "hob_ballroom_dance"
dimension_label = "Hobby: Ballroom dance"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_ballroom_dance=Avid"
adherence_signal = "The classes chosen are ballroom (the waltz class, the foxtrot class, the quickstep class) rather than the improv, juggling and calligraphy hours the hall pushes. Ground truth is each item's data-ballroom attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_country"
dimension_label = "Music: Country"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_country=Dislike"
adherence_signal = "The socials chosen are the non-country ones (jazz, blues, disco); no country social is booked, even though the hall pushes the country covers band, the honky-tonk band and the country singer-songwriter. Ground truth is each item's data-honkytonk attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
