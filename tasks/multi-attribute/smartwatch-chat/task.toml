version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/smartwatch-chat"
theme = "Smartwatch purchase and setup"

[metadata]
difficulty = "medium"
type = "chat"
domain = "consumer-technology"
tags = ["persona-adherence", "multi-check", "shopping", "payment", "automation", "rule-based"]

[[checks]]
dimension_id = "lstyle_shopping_style"
dimension_label = "Shopping style"
category = "Interests: Culture"
attribute = "Shopping style"
value = "Brand loyal"
evaluator = "llm-judge"
evaluator_name = "shopping_style=Brand loyal"
metric = "final_watch_commitment_in_user_turns"
adherence_signal = "The user's own turns explicitly commit to the familiar Orbit watch despite alternatives."

[[checks]]
dimension_id = "lstyle_payment_pref"
dimension_label = "Payment preference"
category = "Interests: Culture"
attribute = "Payment preference"
value = "Mobile wallet"
evaluator = "llm-judge"
evaluator_name = "payment_preference=Mobile wallet"
metric = "final_payment_commitment_in_user_turns"
adherence_signal = "The user's own turns explicitly choose the mobile-wallet checkout method."

[[checks]]
dimension_id = "att_automation"
dimension_label = "Attitude: Automation"
category = "Worldview: Beliefs"
attribute = "Attitude: Automation"
value = "Positive"
evaluator = "llm-judge"
evaluator_name = "automation_attitude=Positive"
metric = "final_setup_commitment_in_user_turns"
adherence_signal = "The user's own turns choose useful workout and bedtime automations without delegating everything."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
