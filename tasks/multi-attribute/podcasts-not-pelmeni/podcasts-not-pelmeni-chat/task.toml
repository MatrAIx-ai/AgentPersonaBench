version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/podcasts-not-pelmeni-chat"
theme = "Interest: Podcasts = Passionate · Cuisine: Russian = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "live_venue_desk"
tags = [ "persona-adherence", "multi-check", "podcasts", "russian-cuisine", "live-shows", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: podcasts-not-pelmeni.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative shows are topics the persona rates neutral and the non-Russian suppers cuisines it rates neutral; every Russian dish is beef or fish (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its podcasts and its distaste for Russian food.
[[checks]]
dimension_id = "topic_podcasts"
dimension_label = "Interest: Podcasts"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_podcasts=Passionate"
adherence_signal = "The shows chosen are live podcasts (the interview taping, the science podcast, the sports podcast) rather than the film quiz, the magic show and the history talk the venue pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_russian"
dimension_label = "Cuisine: Russian"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_russian=Avoid"
adherence_signal = "The suppers chosen are the non-Russian ones (Thai, Lebanese, Mexican); no Russian supper is booked, even though the venue pushes the pelmeni, the stroganoff and the borscht. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
