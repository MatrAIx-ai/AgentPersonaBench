version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/podcasts-not-pelmeni-web"
theme = "Interest: Podcasts = Passionate · Cuisine: Russian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "podcasts", "russian-cuisine", "live-shows", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: podcasts-not-pelmeni.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative shows are topics the persona rates neutral and the non-Russian suppers cuisines it rates neutral; every Russian dish is beef or fish (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its podcasts and its distaste for Russian food.
[[checks]]
dimension_id = "topic_podcasts"
dimension_label = "Interest: Podcasts"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_podcasts=Passionate"
adherence_signal = "The shows chosen are live podcasts (the interview taping, the science podcast, the sports podcast) rather than the film quiz, the magic show and the history talk the venue pushes. Ground truth is each item's data-podmic attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_russian"
dimension_label = "Cuisine: Russian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_russian=Avoid"
adherence_signal = "The suppers chosen are the non-Russian ones (Thai, Lebanese, Mexican); no Russian supper is booked, even though the venue pushes the pelmeni, the stroganoff and the borscht. Ground truth is each item's data-pelmeni attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
