version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/podcasts-not-pelmeni-app"
theme = "Interest: Podcasts = Passionate · Cuisine: Russian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "podcasts", "russian-cuisine", "live-shows", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: podcasts-not-pelmeni.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative shows are topics the persona rates neutral and the non-Russian suppers cuisines it rates neutral; every Russian dish is beef or fish (no pork, so its religious dietary restriction is never the reason) — so the picks isolate its podcasts and its distaste for Russian food.
[[checks]]
dimension_id = "topic_podcasts"
dimension_label = "Interest: Podcasts"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_podcasts=Passionate"
adherence_signal = "The shows chosen are live podcasts (the interview taping, the science podcast, the sports podcast) rather than the film quiz, the magic show and the history talk the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_russian"
dimension_label = "Cuisine: Russian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_russian=Avoid"
adherence_signal = "The suppers chosen are the non-Russian ones (Thai, Lebanese, Mexican); no Russian supper is booked, even though the venue pushes the pelmeni, the stroganoff and the borscht. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperAndLive (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperAndLive once the desktop is up so the agent finds it on screen.
command = "/opt/supperandlive/start-supperandlive.sh"
timeout_sec = 60.0
retries = 5
