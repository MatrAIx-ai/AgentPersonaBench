version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tapas-and-romance-web"
theme = "Cuisine: Spanish = Love · Books: Romance = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "spanish-cuisine", "romance-books", "book-club-suppers", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tapas-and-romance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pairing costs the same, is alcohol-free and contains no pork; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Spanish food and for romance novels independently.
[[checks]]
dimension_id = "cuis_spanish"
dimension_label = "Cuisine: Spanish"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_spanish=Love"
adherence_signal = "The suppers chosen are Spanish (paella, gambas al ajillo, tortilla and bravas) rather than the equally good risotto, tagine and thali plates the club pushes. Ground truth is each item's data-iberian attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_romance"
dimension_label = "Books: Romance"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_romance=Love"
adherence_signal = "The novels chosen are romances (seaside, regency, second-chance) rather than the equally well-reviewed sci-fi, popular-science and poetry titles the club pushes. Ground truth is each item's data-heart attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
