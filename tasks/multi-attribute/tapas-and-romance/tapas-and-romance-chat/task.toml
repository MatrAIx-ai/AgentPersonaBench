version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tapas-and-romance-chat"
theme = "Cuisine: Spanish = Love · Books: Romance = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "book_club_secretary"
tags = [ "persona-adherence", "multi-check", "spanish-cuisine", "romance-books", "book-club-suppers", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tapas-and-romance.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pairing costs the same, is alcohol-free and contains no pork; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Spanish food and for romance novels independently.
[[checks]]
dimension_id = "cuis_spanish"
dimension_label = "Cuisine: Spanish"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_spanish=Love"
adherence_signal = "The suppers chosen are Spanish (paella, gambas al ajillo, tortilla and bravas) rather than the equally good risotto, tagine and thali plates the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_romance"
dimension_label = "Books: Romance"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_romance=Love"
adherence_signal = "The novels chosen are romances (seaside, regency, second-chance) rather than the equally well-reviewed sci-fi, popular-science and poetry titles the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
