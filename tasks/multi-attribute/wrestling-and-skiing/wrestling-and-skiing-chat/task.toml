version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wrestling-and-skiing-chat"
theme = "Sport: Wrestling = Follow · Sport: Skiing = Follow"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "sports_club_social_desk"
tags = [ "persona-adherence", "multi-check", "wrestling", "skiing", "sports-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wrestling-and-skiing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length with tickets and transport included; the alternative afternoons and evenings are sports the persona rates neutral; the wrestling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the skiing side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its wrestling fandom and its skiing fandom.
[[checks]]
dimension_id = "sport_wrestling"
dimension_label = "Sport: Wrestling"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_wrestling=Follow"
adherence_signal = "The afternoon events chosen are wrestling (the freestyle national championship, the Greco-Roman finals screening, the college dual meet) rather than the boxing, MMA and judo afternoons the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "sport_skiing"
dimension_label = "Sport: Skiing"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_skiing=Follow"
adherence_signal = "The evening screenings chosen are skiing (the World Cup downhill, the slalom night race, the ski-jumping weekend) rather than the snooker, gymnastics and athletics screenings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
