version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wrestling-and-skiing-survey"
theme = "Sport: Wrestling = Follow · Sport: Skiing = Follow"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "wrestling", "skiing", "sports-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wrestling-and-skiing.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length with tickets and transport included; the alternative afternoons and evenings are sports the persona rates neutral; the wrestling side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the skiing side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its wrestling fandom and its skiing fandom.
[[checks]]
dimension_id = "sport_wrestling"
dimension_label = "Sport: Wrestling"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_wrestling=Follow"
adherence_signal = "The afternoon events chosen are wrestling (the freestyle national championship, the Greco-Roman finals screening, the college dual meet) rather than the boxing, MMA and judo afternoons the club pushes. Each option id maps to a `matside` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_skiing"
dimension_label = "Sport: Skiing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_skiing=Follow"
adherence_signal = "The evening screenings chosen are skiing (the World Cup downhill, the slalom night race, the ski-jumping weekend) rather than the snooker, gymnastics and athletics screenings the club pushes. Each option id maps to a `piste` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
