version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hammock-and-moqueca-app"
theme = "Vacation style = Relaxation · Cuisine: Brazilian = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "vacation-style", "brazilian-cuisine", "holiday-packages", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hammock-and-moqueca.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same for the same nights and no dish contains pork; the packed itineraries are equally well organised and the alternative cuisines are ones the persona rates neutral — so the picks isolate the persona's own restful holiday style and its taste for Brazilian food.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Relaxation"
evaluator = "rule-based"
evaluator_name = "lstyle_vacation_style=Relaxation"
adherence_signal = "The itineraries chosen are the restful ones (beach resort and spa, lakeside lodge with nothing scheduled, slow-morning retreat) rather than the museum-packed, activity-packed and tour-packed weeks the agent pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_brazilian"
dimension_label = "Cuisine: Brazilian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_brazilian=Love"
adherence_signal = "The dining plans chosen are Brazilian (moqueca, picanha churrasco, pão de queijo and Bahian stew) rather than the equally good Italian, Turkish and Thai plans the agent pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekAway (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekAway once the desktop is up so the agent finds it on screen.
command = "/opt/weekaway/start-weekaway.sh"
timeout_sec = 60.0
retries = 5
