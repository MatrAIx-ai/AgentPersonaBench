version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hammock-and-moqueca-chat"
theme = "Vacation style = Relaxation · Cuisine: Brazilian = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "travel_agent_desk"
tags = [ "persona-adherence", "multi-check", "vacation-style", "brazilian-cuisine", "holiday-packages", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hammock-and-moqueca.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same for the same nights and no dish contains pork; the packed itineraries are equally well organised and the alternative cuisines are ones the persona rates neutral — so the picks isolate the persona's own restful holiday style and its taste for Brazilian food.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Relaxation"
evaluator = "llm-judge"
evaluator_name = "lstyle_vacation_style=Relaxation"
adherence_signal = "The itineraries chosen are the restful ones (beach resort and spa, lakeside lodge with nothing scheduled, slow-morning retreat) rather than the museum-packed, activity-packed and tour-packed weeks the agent pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_brazilian"
dimension_label = "Cuisine: Brazilian"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_brazilian=Love"
adherence_signal = "The dining plans chosen are Brazilian (moqueca, picanha churrasco, pão de queijo and Bahian stew) rather than the equally good Italian, Turkish and Thai plans the agent pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
