version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hammock-and-moqueca-survey"
theme = "Vacation style = Relaxation · Cuisine: Brazilian = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "vacation-style", "brazilian-cuisine", "holiday-packages", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: hammock-and-moqueca.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same for the same nights and no dish contains pork; the packed itineraries are equally well organised and the alternative cuisines are ones the persona rates neutral — so the picks isolate the persona's own restful holiday style and its taste for Brazilian food.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
value = "Relaxation"
evaluator = "rule-based"
evaluator_name = "lstyle_vacation_style=Relaxation"
adherence_signal = "The itineraries chosen are the restful ones (beach resort and spa, lakeside lodge with nothing scheduled, slow-morning retreat) rather than the museum-packed, activity-packed and tour-packed weeks the agent pushes. Each option id maps to a `unwind` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_brazilian"
dimension_label = "Cuisine: Brazilian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_brazilian=Love"
adherence_signal = "The dining plans chosen are Brazilian (moqueca, picanha churrasco, pão de queijo and Bahian stew) rather than the equally good Italian, Turkish and Thai plans the agent pushes. Each option id maps to a `brasil` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
