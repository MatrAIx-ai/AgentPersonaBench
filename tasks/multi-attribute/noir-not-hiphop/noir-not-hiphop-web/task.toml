version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/noir-not-hiphop-web"
theme = "Film: Noir = Love · Music: Hip-hop = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "noir", "hip-hop", "film-and-gig", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: noir-not-hiphop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and the venue is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for noir and its distaste for hip-hop.
[[checks]]
dimension_id = "filmg_noir"
dimension_label = "Film: Noir"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_noir=Love"
adherence_signal = "The films chosen are noir (the private-eye picture, the femme-fatale noir, the heist noir) rather than the space adventure, western and superhero film the venue pushes. Ground truth is each item's data-shadows attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_hip_hop"
dimension_label = "Music: Hip-hop"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_hip_hop=Dislike"
adherence_signal = "The sets chosen are the non-hip-hop ones (blues, jazz, afrobeats); no hip-hop set is booked, even though the venue pushes the rap showcase, the hip-hop DJ and the boom-bap band. Ground truth is each item's data-rapset attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
