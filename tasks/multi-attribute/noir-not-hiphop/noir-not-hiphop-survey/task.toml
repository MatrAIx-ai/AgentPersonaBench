version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/noir-not-hiphop-survey"
theme = "Film: Noir = Love · Music: Hip-hop = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "noir", "hip-hop", "film-and-gig", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: noir-not-hiphop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and the venue is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for noir and its distaste for hip-hop.
[[checks]]
dimension_id = "filmg_noir"
dimension_label = "Film: Noir"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_noir=Love"
adherence_signal = "The films chosen are noir (the private-eye picture, the femme-fatale noir, the heist noir) rather than the space adventure, western and superhero film the venue pushes. Each option id maps to a `shadows` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_hip_hop"
dimension_label = "Music: Hip-hop"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_hip_hop=Dislike"
adherence_signal = "The sets chosen are the non-hip-hop ones (blues, jazz, afrobeats); no hip-hop set is booked, even though the venue pushes the rap showcase, the hip-hop DJ and the boom-bap band. Each option id maps to a `rapset` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
