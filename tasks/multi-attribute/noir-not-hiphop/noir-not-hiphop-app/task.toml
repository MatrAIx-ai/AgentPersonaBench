version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/noir-not-hiphop-app"
theme = "Film: Noir = Love · Music: Hip-hop = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "noir", "hip-hop", "film-and-gig", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: noir-not-hiphop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same and the venue is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative sets genres it rates neutral — so the picks isolate its taste for noir and its distaste for hip-hop.
[[checks]]
dimension_id = "filmg_noir"
dimension_label = "Film: Noir"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_noir=Love"
adherence_signal = "The films chosen are noir (the private-eye picture, the femme-fatale noir, the heist noir) rather than the space adventure, western and superhero film the venue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_hip_hop"
dimension_label = "Music: Hip-hop"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_hip_hop=Dislike"
adherence_signal = "The sets chosen are the non-hip-hop ones (blues, jazz, afrobeats); no hip-hop set is booked, even though the venue pushes the rap showcase, the hip-hop DJ and the boom-bap band. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RiffAndReel (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RiffAndReel once the desktop is up so the agent finds it on screen.
command = "/opt/riffandreel/start-riffandreel.sh"
timeout_sec = 60.0
retries = 5
