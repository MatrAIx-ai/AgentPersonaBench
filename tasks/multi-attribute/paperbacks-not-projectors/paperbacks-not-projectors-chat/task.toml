version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paperbacks-not-projectors-chat"
theme = "Books: Young adult = Love · Interest: Film = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "book_club_organiser"
tags = [ "persona-adherence", "multi-check", "young-adult-fiction", "film", "book-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paperbacks-not-projectors.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative picks are genres the persona rates neutral and the non-film second halves are just as sociable — so the picks isolate its taste for young-adult fiction and its distaste for film.
[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_young_adult=Love"
adherence_signal = "The picks chosen are young-adult fiction (coming-of-age, dystopia, YA mystery) rather than the literary novel, biography and history book the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_film"
dimension_label = "Interest: Film"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_film=Averse"
adherence_signal = "The second halves chosen are the non-film hours (board games, quiz, open-mic); no film half is booked, even though the club pushes the adaptation screening, the short-film night and the classic screening. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
