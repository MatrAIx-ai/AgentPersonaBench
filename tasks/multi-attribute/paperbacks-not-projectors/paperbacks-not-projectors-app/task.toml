version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paperbacks-not-projectors-app"
theme = "Books: Young adult = Love · Interest: Film = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "young-adult-fiction", "film", "book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paperbacks-not-projectors.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative picks are genres the persona rates neutral and the non-film second halves are just as sociable — so the picks isolate its taste for young-adult fiction and its distaste for film.
[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_young_adult=Love"
adherence_signal = "The picks chosen are young-adult fiction (coming-of-age, dystopia, YA mystery) rather than the literary novel, biography and history book the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_film"
dimension_label = "Interest: Film"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_film=Averse"
adherence_signal = "The second halves chosen are the non-film hours (board games, quiz, open-mic); no film half is booked, even though the club pushes the adaptation screening, the short-film night and the classic screening. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningsClub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningsClub once the desktop is up so the agent finds it on screen.
command = "/opt/eveningsclub/start-eveningsclub.sh"
timeout_sec = 60.0
retries = 5
