version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paperbacks-not-projectors-survey"
theme = "Books: Young adult = Love · Interest: Film = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "young-adult-fiction", "film", "book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: paperbacks-not-projectors.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and both halves are the same length; the alternative picks are genres the persona rates neutral and the non-film second halves are just as sociable — so the picks isolate its taste for young-adult fiction and its distaste for film.
[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_young_adult=Love"
adherence_signal = "The picks chosen are young-adult fiction (coming-of-age, dystopia, YA mystery) rather than the literary novel, biography and history book the club pushes. Each option id maps to a `yashelf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_film"
dimension_label = "Interest: Film"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_film=Averse"
adherence_signal = "The second halves chosen are the non-film hours (board games, quiz, open-mic); no film half is booked, even though the club pushes the adaptation screening, the short-film night and the classic screening. Each option id maps to a `filmhalf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
