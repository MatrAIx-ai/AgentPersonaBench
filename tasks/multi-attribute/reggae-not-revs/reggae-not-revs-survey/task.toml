version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reggae-not-revs-survey"
theme = "Music: Reggae = Love · Interest: Cars = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "reggae", "cars", "showground-saturdays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: reggae-not-revs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the showground is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the alternative attractions topics it rates neutral — so the picks isolate its taste for reggae and its distaste for cars.
[[checks]]
dimension_id = "musg_reggae"
dimension_label = "Music: Reggae"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_reggae=Love"
adherence_signal = "The concerts chosen are reggae (the roots band, the dub sound system, the reggae singer) rather than the afrobeats, blues and jazz nights the showground pushes. Each option id maps to a `skank` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_cars"
dimension_label = "Interest: Cars"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cars=Averse"
adherence_signal = "The attractions chosen are the non-motoring ones (drone racing, the robotics fair, the magic tent); no car attraction is booked, even though the showground pushes the classic-car show, the motor-show tent and the hot-rod meet. Each option id maps to a `motoring` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
