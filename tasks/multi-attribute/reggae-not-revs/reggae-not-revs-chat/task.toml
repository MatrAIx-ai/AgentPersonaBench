version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reggae-not-revs-chat"
theme = "Music: Reggae = Love · Interest: Cars = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "showground_events_desk"
tags = [ "persona-adherence", "multi-check", "reggae", "cars", "showground-saturdays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: reggae-not-revs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the showground is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the alternative attractions topics it rates neutral — so the picks isolate its taste for reggae and its distaste for cars.
[[checks]]
dimension_id = "musg_reggae"
dimension_label = "Music: Reggae"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_reggae=Love"
adherence_signal = "The concerts chosen are reggae (the roots band, the dub sound system, the reggae singer) rather than the afrobeats, blues and jazz nights the showground pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_cars"
dimension_label = "Interest: Cars"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_cars=Averse"
adherence_signal = "The attractions chosen are the non-motoring ones (drone racing, the robotics fair, the magic tent); no car attraction is booked, even though the showground pushes the classic-car show, the motor-show tent and the hot-rod meet. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
