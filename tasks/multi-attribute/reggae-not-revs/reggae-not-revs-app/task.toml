version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reggae-not-revs-app"
theme = "Music: Reggae = Love · Interest: Cars = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "reggae", "cars", "showground-saturdays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: reggae-not-revs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the showground is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the alternative attractions topics it rates neutral — so the picks isolate its taste for reggae and its distaste for cars.
[[checks]]
dimension_id = "musg_reggae"
dimension_label = "Music: Reggae"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_reggae=Love"
adherence_signal = "The concerts chosen are reggae (the roots band, the dub sound system, the reggae singer) rather than the afrobeats, blues and jazz nights the showground pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_cars"
dimension_label = "Interest: Cars"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_cars=Averse"
adherence_signal = "The attractions chosen are the non-motoring ones (drone racing, the robotics fair, the magic tent); no car attraction is booked, even though the showground pushes the classic-car show, the motor-show tent and the hot-rod meet. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysShowground (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysShowground once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysshowground/start-saturdaysshowground.sh"
timeout_sec = 60.0
retries = 5
