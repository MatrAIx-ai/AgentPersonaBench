version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/musicals-not-mantras-web"
theme = "Film: Musical = Love · Interest: Spirituality = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "musical", "spirituality", "cultural-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: musicals-not-mantras.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for musicals and its distaste for spirituality.
[[checks]]
dimension_id = "filmg_musical"
dimension_label = "Film: Musical"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_musical=Love"
adherence_signal = "The films chosen are musicals (the backstage musical, the golden-age musical, the rock-opera film) rather than the adventure, heist and costume films the centre pushes. Ground truth is each item's data-showtune attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_spirituality"
dimension_label = "Interest: Spirituality"
category = "Worldview: Beliefs"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_spirituality=Averse"
adherence_signal = "The sessions chosen are the non-spirituality ones (astronomy, genealogy, coffee); no spirituality session is booked, even though the centre pushes the chakra workshop, the awakening talk and the crystal circle. Ground truth is each item's data-chakra attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
