version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/musicals-not-mantras-survey"
theme = "Film: Musical = Love · Interest: Spirituality = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "musical", "spirituality", "cultural-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: musicals-not-mantras.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for musicals and its distaste for spirituality.
[[checks]]
dimension_id = "filmg_musical"
dimension_label = "Film: Musical"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_musical=Love"
adherence_signal = "The films chosen are musicals (the backstage musical, the golden-age musical, the rock-opera film) rather than the adventure, heist and costume films the centre pushes. Each option id maps to a `showtune` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_spirituality"
dimension_label = "Interest: Spirituality"
category = "Worldview: Beliefs"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_spirituality=Averse"
adherence_signal = "The sessions chosen are the non-spirituality ones (astronomy, genealogy, coffee); no spirituality session is booked, even though the centre pushes the chakra workshop, the awakening talk and the crystal circle. Each option id maps to a `chakra` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
