version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/musicals-not-mantras-app"
theme = "Film: Musical = Love · Interest: Spirituality = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "musical", "spirituality", "cultural-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: musicals-not-mantras.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative films are genres the persona rates neutral and the alternative sessions topics it rates neutral — so the picks isolate its taste for musicals and its distaste for spirituality.
[[checks]]
dimension_id = "filmg_musical"
dimension_label = "Film: Musical"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_musical=Love"
adherence_signal = "The films chosen are musicals (the backstage musical, the golden-age musical, the rock-opera film) rather than the adventure, heist and costume films the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_spirituality"
dimension_label = "Interest: Spirituality"
category = "Worldview: Beliefs"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_spirituality=Averse"
adherence_signal = "The sessions chosen are the non-spirituality ones (astronomy, genealogy, coffee); no spirituality session is booked, even though the centre pushes the chakra workshop, the awakening talk and the crystal circle. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenPairsSunday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenPairsSunday once the desktop is up so the agent finds it on screen.
command = "/opt/screenpairssunday/start-screenpairssunday.sh"
timeout_sec = 60.0
retries = 5
