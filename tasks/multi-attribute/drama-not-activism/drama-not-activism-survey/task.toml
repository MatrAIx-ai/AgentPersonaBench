version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drama-not-activism-survey"
theme = "Subject: Drama = Passionate · Interest: Activism = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "drama", "activism", "learning-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: drama-not-activism.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative lectures are subjects the persona rates neutral and the alternative seminars topics it rates neutral; the drama lectures are waiting-list only, confirmed the day before, while the alternatives come with a guaranteed place confirmed at once, so a chooser with no stake in drama takes the alternatives — so the picks isolate its love of drama and its distaste for activism.
[[checks]]
dimension_id = "acad_drama"
dimension_label = "Subject: Drama"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_drama=Passionate"
adherence_signal = "The lectures chosen are drama (Shakespeare's villains, staging a scene, scene study) rather than the geometry, biology and logic lectures the centre pushes. Each option id maps to a `greasepaint` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_activism"
dimension_label = "Interest: Activism"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_activism=Averse"
adherence_signal = "The seminars chosen are the non-activism ones (photography, oceanography, architecture); no activism seminar is booked, even though the centre pushes the campaign seminar, the protest-movements seminar and the lobbying seminar. Each option id maps to a `placardhour` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
