version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drama-not-activism-app"
theme = "Subject: Drama = Passionate · Interest: Activism = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "drama", "activism", "learning-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: drama-not-activism.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and both halves are the same length; the alternative lectures are subjects the persona rates neutral and the alternative seminars topics it rates neutral; the drama lectures are waiting-list only, confirmed the day before, while the alternatives come with a guaranteed place confirmed at once, so a chooser with no stake in drama takes the alternatives — so the picks isolate its love of drama and its distaste for activism.
[[checks]]
dimension_id = "acad_drama"
dimension_label = "Subject: Drama"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_drama=Passionate"
adherence_signal = "The lectures chosen are drama (Shakespeare's villains, staging a scene, scene study) rather than the geometry, biology and logic lectures the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_activism"
dimension_label = "Interest: Activism"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_activism=Averse"
adherence_signal = "The seminars chosen are the non-activism ones (photography, oceanography, architecture); no activism seminar is booked, even though the centre pushes the campaign seminar, the protest-movements seminar and the lobbying seminar. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LecturesThursday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LecturesThursday once the desktop is up so the agent finds it on screen.
command = "/opt/lecturesthursday/start-lecturesthursday.sh"
timeout_sec = 60.0
retries = 5
