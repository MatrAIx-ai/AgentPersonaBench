version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spiritual-seeker-app"
theme = "Spiritual seeker: spirituality · knowledge-truth · perspective"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE planning session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) chooses
# how to fill a free, open day; the verifier runs an independent rule-based check
# per attribute. Each item carries three hidden ground-truth axes (spir/know/persp,
# 0..3) that are NEVER shown on screen — the agent sees only name + price and must
# judge for itself. A check is HELD iff no selected item scores >= 2 on its axis.
# Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "trait_spirituality"
dimension_label = "Character: Spirituality"
category = "Personality: Character"
attribute = "Character: Spirituality"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_spirituality=Strong"
metric = "spir_axis_max"                     # HELD iff no picked item has spir >= 2
adherence_signal = "The planned day contains no distraction item (hidden spir axis >= 2); a spiritual seeker leans toward reflection, meaning, and stillness."

[[checks]]
dimension_id = "val_knowledge_truth"
dimension_label = "Value: Knowledge & truth"
category = "Values & Motivation"
attribute = "Value: Knowledge & truth"
value = "Important"
evaluator = "rule-based"
evaluator_name = "val_knowledge_truth=Important"
metric = "know_axis_max"                      # HELD iff no picked item has know >= 2
adherence_signal = "The plan contains no shallow-answer item (hidden know axis >= 2); someone who values knowledge & truth seeks genuine understanding over easy answers."

[[checks]]
dimension_id = "trait_perspective"
dimension_label = "Character: Perspective"
category = "Personality: Character"
attribute = "Character: Perspective"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_perspective=Strong"
metric = "persp_axis_max"                     # HELD iff no picked item has persp >= 2
adherence_signal = "The plan contains no shortsighted item (hidden persp axis >= 2); a person of strong perspective takes the wise, big-picture long view."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
