version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lift-for-paws-app"
theme = "Sport: Weightlifting = Play · Interest: Pets = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community"
tags = [ "persona-adherence", "multi-check", "weightlifting", "pets", "charity-month", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lift-for-paws.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event takes the same afternoon and carries the same sponsorship target; the alternative activities (walk, quiz, car wash) are as sociable and the alternative causes (library, youth orchestra, food bank) as worthy; the persona owns no pet, so the picks isolate its lifting and its feeling for animals rather than a pet at home.
[[checks]]
dimension_id = "sport_weightlifting"
dimension_label = "Sport: Weightlifting"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_weightlifting=Play"
adherence_signal = "The events chosen are lifting events (deadlift challenge, lift-a-thon, squat ladder) rather than the sponsored walk, quiz night and car wash the coordinator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_pets=Passionate"
adherence_signal = "The causes chosen are animal causes (dog rescue shelter, cat and kitten rescue, wildlife hospital) rather than the library, youth orchestra and food bank the coordinator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LiftGive (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LiftGive once the desktop is up so the agent finds it on screen.
command = "/opt/liftgive/start-liftgive.sh"
timeout_sec = 60.0
retries = 5
