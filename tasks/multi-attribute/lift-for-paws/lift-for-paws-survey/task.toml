version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lift-for-paws-survey"
theme = "Sport: Weightlifting = Play · Interest: Pets = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "multi-check", "weightlifting", "pets", "charity-month", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: lift-for-paws.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event takes the same afternoon and carries the same sponsorship target; the alternative activities (walk, quiz, car wash) are as sociable and the alternative causes (library, youth orchestra, food bank) as worthy; the persona owns no pet, so the picks isolate its lifting and its feeling for animals rather than a pet at home.
[[checks]]
dimension_id = "sport_weightlifting"
dimension_label = "Sport: Weightlifting"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_weightlifting=Play"
adherence_signal = "The events chosen are lifting events (deadlift challenge, lift-a-thon, squat ladder) rather than the sponsored walk, quiz night and car wash the coordinator pushes. Each option id maps to a `barbell` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_pets"
dimension_label = "Interest: Pets"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_pets=Passionate"
adherence_signal = "The causes chosen are animal causes (dog rescue shelter, cat and kitten rescue, wildlife hospital) rather than the library, youth orchestra and food bank the coordinator pushes. Each option id maps to a `animalcause` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
