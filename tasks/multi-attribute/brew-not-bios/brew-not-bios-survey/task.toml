version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brew-not-bios-survey"
theme = "Hobby: Home brewing = Active · Books: Biography = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "home-brewing", "biography", "hobby-and-book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: brew-not-bios.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the book is posted ahead; the alternative workshops are crafts the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its home brewing and its distaste for biographies.
[[checks]]
dimension_id = "hob_home_brewing"
dimension_label = "Hobby: Home brewing"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_home_brewing=Active"
adherence_signal = "The workshops chosen are brewing (the brew day, the bottling session, the fermentation workshop) rather than the candle, model-building and whittling sessions the club pushes. Each option id maps to a `mashtun` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_biography"
dimension_label = "Books: Biography"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_biography=Dislike"
adherence_signal = "The books chosen are the non-biography ones (the mystery, the science fiction, the city history); no biography is booked, even though the club pushes the statesman, the scientist and the musician. Each option id maps to a `lifestory` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
