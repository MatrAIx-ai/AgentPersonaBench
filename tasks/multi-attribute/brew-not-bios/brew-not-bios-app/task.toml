version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brew-not-bios-app"
theme = "Hobby: Home brewing = Active · Books: Biography = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "home-brewing", "biography", "hobby-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: brew-not-bios.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every meetup costs the same and the book is posted ahead; the alternative workshops are crafts the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its home brewing and its distaste for biographies.
[[checks]]
dimension_id = "hob_home_brewing"
dimension_label = "Hobby: Home brewing"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_home_brewing=Active"
adherence_signal = "The workshops chosen are brewing (the brew day, the bottling session, the fermentation workshop) rather than the candle, model-building and whittling sessions the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_biography"
dimension_label = "Books: Biography"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_biography=Dislike"
adherence_signal = "The books chosen are the non-biography ones (the mystery, the science fiction, the city history); no biography is booked, even though the club pushes the statesman, the scientist and the musician. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ReadAndMake (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ReadAndMake once the desktop is up so the agent finds it on screen.
command = "/opt/readandmake/start-readandmake.sh"
timeout_sec = 60.0
retries = 5
