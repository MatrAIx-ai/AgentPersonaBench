version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ambient-no-ceviche-app"
theme = "Music: Ambient = Dislike · Cuisine: Peruvian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ambient", "peruvian-cuisine", "concert-and-supper", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-ambient-no-ceviche.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative sets are genres the persona rates neutral and the non-Peruvian suppers cuisines it rates neutral — so the picks isolate its distaste for ambient music and its distaste for Peruvian food.
[[checks]]
dimension_id = "musg_ambient"
dimension_label = "Music: Ambient"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_ambient=Dislike"
adherence_signal = "The sets chosen are the non-ambient ones (jazz, country, blues); no ambient set is booked, even though the venue pushes the listening session, the live set and the drone night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_peruvian"
dimension_label = "Cuisine: Peruvian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_peruvian=Avoid"
adherence_signal = "The suppers chosen are the non-Peruvian ones (Italian, Thai, Korean); no Peruvian supper is booked, even though the venue pushes the ceviche, the lomo saltado and the ají de gallina. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperAndSet (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperAndSet once the desktop is up so the agent finds it on screen.
command = "/opt/supperandset/start-supperandset.sh"
timeout_sec = 60.0
retries = 5
