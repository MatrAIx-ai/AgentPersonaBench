version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ambient-no-ceviche-chat"
theme = "Music: Ambient = Dislike · Cuisine: Peruvian = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "set_supper_venue_desk"
tags = [ "persona-adherence", "multi-check", "ambient", "peruvian-cuisine", "concert-and-supper", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-ambient-no-ceviche.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative sets are genres the persona rates neutral and the non-Peruvian suppers cuisines it rates neutral — so the picks isolate its distaste for ambient music and its distaste for Peruvian food.
[[checks]]
dimension_id = "musg_ambient"
dimension_label = "Music: Ambient"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_ambient=Dislike"
adherence_signal = "The sets chosen are the non-ambient ones (jazz, country, blues); no ambient set is booked, even though the venue pushes the listening session, the live set and the drone night. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_peruvian"
dimension_label = "Cuisine: Peruvian"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_peruvian=Avoid"
adherence_signal = "The suppers chosen are the non-Peruvian ones (Italian, Thai, Korean); no Peruvian supper is booked, even though the venue pushes the ceviche, the lomo saltado and the ají de gallina. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
