version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ambient-no-ceviche-survey"
theme = "Music: Ambient = Dislike · Cuisine: Peruvian = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ambient", "peruvian-cuisine", "concert-and-supper", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-ambient-no-ceviche.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative sets are genres the persona rates neutral and the non-Peruvian suppers cuisines it rates neutral — so the picks isolate its distaste for ambient music and its distaste for Peruvian food.
[[checks]]
dimension_id = "musg_ambient"
dimension_label = "Music: Ambient"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_ambient=Dislike"
adherence_signal = "The sets chosen are the non-ambient ones (jazz, country, blues); no ambient set is booked, even though the venue pushes the listening session, the live set and the drone night. Each option id maps to a `drone` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_peruvian"
dimension_label = "Cuisine: Peruvian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_peruvian=Avoid"
adherence_signal = "The suppers chosen are the non-Peruvian ones (Italian, Thai, Korean); no Peruvian supper is booked, even though the venue pushes the ceviche, the lomo saltado and the ají de gallina. Each option id maps to a `ceviche` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
