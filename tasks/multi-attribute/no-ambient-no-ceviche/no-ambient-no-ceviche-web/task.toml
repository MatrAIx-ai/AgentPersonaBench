version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ambient-no-ceviche-web"
theme = "Music: Ambient = Dislike · Cuisine: Peruvian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "ambient", "peruvian-cuisine", "concert-and-supper", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-ambient-no-ceviche.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the venue is alcohol-free (the persona drinks none); the alternative sets are genres the persona rates neutral and the non-Peruvian suppers cuisines it rates neutral — so the picks isolate its distaste for ambient music and its distaste for Peruvian food.
[[checks]]
dimension_id = "musg_ambient"
dimension_label = "Music: Ambient"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_ambient=Dislike"
adherence_signal = "The sets chosen are the non-ambient ones (jazz, country, blues); no ambient set is booked, even though the venue pushes the listening session, the live set and the drone night. Ground truth is each item's data-drone attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_peruvian"
dimension_label = "Cuisine: Peruvian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_peruvian=Avoid"
adherence_signal = "The suppers chosen are the non-Peruvian ones (Italian, Thai, Korean); no Peruvian supper is booked, even though the venue pushes the ceviche, the lomo saltado and the ají de gallina. Ground truth is each item's data-ceviche attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
