version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cuisine-preferences-app"
theme = "Native two-week meal-kit ordering: preferred and avoided cuisines"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food-and-dining"
tags = [ "persona-adherence", "multi-check", "cuisine-preferences", "rule-based", "os-app", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "cuis_korean"
dimension_label = "Cuisine: Korean"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_korean=Love"
adherence_signal = "The submitted native-app order selects the Korean main in both independent weekly main-dish sections."

[[checks]]
dimension_id = "cuis_italian"
dimension_label = "Cuisine: Italian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_italian=Avoid"
adherence_signal = "The submitted native-app order opens both customization dialogs and replaces each Italian default with the sole non-Italian alternative."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
