version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/writing-and-golf-app"
theme = "Subject: Creative writing = Passionate · Sport: Golf = Follow"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "creative-writing", "golf", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: writing-and-golf.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative classes are subjects the persona rates neutral and the alternative outings sports it rates neutral; the writing side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives; the golf side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of creative writing and its golf fandom.
[[checks]]
dimension_id = "acad_creative_writing"
dimension_label = "Subject: Creative writing"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_creative_writing=Passionate"
adherence_signal = "The classes chosen are creative writing (the short story, character and voice, poetry from prompts) rather than the statistics, geography and astronomy classes the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "sport_golf"
dimension_label = "Sport: Golf"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_golf=Follow"
adherence_signal = "The outings chosen are golf (the Open screening, the pro-am, the Ryder Cup screening) rather than the tennis, cricket and swimming outings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MatchdayAndClass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MatchdayAndClass once the desktop is up so the agent finds it on screen.
command = "/opt/matchdayandclass/start-matchdayandclass.sh"
timeout_sec = 60.0
retries = 5
