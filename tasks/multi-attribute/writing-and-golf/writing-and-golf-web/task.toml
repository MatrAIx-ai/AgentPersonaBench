version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/writing-and-golf-web"
theme = "Subject: Creative writing = Passionate · Sport: Golf = Follow"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "creative-writing", "golf", "community-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: writing-and-golf.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative classes are subjects the persona rates neutral and the alternative outings sports it rates neutral; the writing side comes with the annexe across town, 35 minutes away and the alternatives with the main building, right by the station, so a chooser with no stake in the trait takes the alternatives; the golf side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of creative writing and its golf fandom.
[[checks]]
dimension_id = "acad_creative_writing"
dimension_label = "Subject: Creative writing"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_creative_writing=Passionate"
adherence_signal = "The classes chosen are creative writing (the short story, character and voice, poetry from prompts) rather than the statistics, geography and astronomy classes the centre pushes. Ground truth is each item's data-draftpage attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "sport_golf"
dimension_label = "Sport: Golf"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_golf=Follow"
adherence_signal = "The outings chosen are golf (the Open screening, the pro-am, the Ryder Cup screening) rather than the tennis, cricket and swimming outings the centre pushes. Ground truth is each item's data-fairwayfan attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
