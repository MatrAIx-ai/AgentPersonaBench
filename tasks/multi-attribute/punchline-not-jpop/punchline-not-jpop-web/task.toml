version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/punchline-not-jpop-web"
theme = "Hobby: Stand-up comedy = Avid · Music: J-pop = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "stand-up-comedy", "j-pop", "arts-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: punchline-not-jpop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and the centre is alcohol-free (the persona drinks none); the alternative workshops are hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its stand-up comedy and its distaste for J-pop.
[[checks]]
dimension_id = "hob_stand_up_comedy"
dimension_label = "Hobby: Stand-up comedy"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_stand_up_comedy=Avid"
adherence_signal = "The workshops chosen are stand-up (the open-mic slot, the joke-writing workshop, the crowd-work class) rather than the improv, juggling and ballroom hours the centre pushes. Ground truth is each item's data-punchline attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_j_pop"
dimension_label = "Music: J-pop"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_j_pop=Dislike"
adherence_signal = "The gigs chosen are the non-J-pop ones (indie, blues, rock covers); no J-pop gig is booked, even though the centre pushes the idol tribute, the J-pop DJ night and the J-pop covers band. Ground truth is each item's data-idolgig attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
