version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fairs-not-schnitzel-chat"
theme = "Interest: Collecting = Passionate · Cuisine: German = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "city_card_concierge"
tags = [ "persona-adherence", "multi-check", "collecting", "german-cuisine", "saturday-city-card", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fairs-not-schnitzel.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same (the persona is a splurger, so price cannot choose) and every venue is indoors (it leans indoors, so that cannot choose); the alternative mornings are topics the persona rates neutral and the non-German lunches cuisines it rates neutral — so the picks isolate its collecting and its distaste for German food.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_collecting=Passionate"
adherence_signal = "The mornings chosen are collectors' events (collectors' fair, coin-and-stamp fair, vintage-toy fair) rather than the photography exhibition, market hall and languages taster the card pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_german"
dimension_label = "Cuisine: German"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_german=Avoid"
adherence_signal = "The lunches chosen are the non-German ones (Mexican, Peruvian, Chinese); no German lunch is booked, even though the card pushes the schnitzel house, the käsespätzle kitchen and the sauerbraten place. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
