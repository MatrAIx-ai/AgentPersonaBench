version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fairs-not-schnitzel-app"
theme = "Interest: Collecting = Passionate · Cuisine: German = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "collecting", "german-cuisine", "saturday-city-card", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fairs-not-schnitzel.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same (the persona is a splurger, so price cannot choose) and every venue is indoors (it leans indoors, so that cannot choose); the alternative mornings are topics the persona rates neutral and the non-German lunches cuisines it rates neutral — so the picks isolate its collecting and its distaste for German food.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_collecting=Passionate"
adherence_signal = "The mornings chosen are collectors' events (collectors' fair, coin-and-stamp fair, vintage-toy fair) rather than the photography exhibition, market hall and languages taster the card pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_german"
dimension_label = "Cuisine: German"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_german=Avoid"
adherence_signal = "The lunches chosen are the non-German ones (Mexican, Peruvian, Chinese); no German lunch is booked, even though the card pushes the schnitzel house, the käsespätzle kitchen and the sauerbraten place. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysCityCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysCityCard once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayscitycard/start-saturdayscitycard.sh"
timeout_sec = 60.0
retries = 5
