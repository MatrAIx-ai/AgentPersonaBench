version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/yarn-and-blade-web"
theme = "Interest: Knitting = Passionate · Hobby: Whittling = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "knitting", "whittling", "craft-festival", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: yarn-and-blade.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the persona's interest in knitting is an interest rather than a practice (its knitting hobby is 'Never'), so the knitting facet is talks and demos to attend, not needles in hand; the alternative talks and benches are crafts the persona has no rating on (ceramics, watercolour, bookbinding, linocut, leather, mosaic), with its model building and embroidery kept off both sides — so the picks isolate its knitting interest and its whittling.
[[checks]]
dimension_id = "topic_knitting"
dimension_label = "Interest: Knitting"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_knitting=Passionate"
adherence_signal = "The talks chosen are about knitting (knitwear designers in conversation, a history of hand-knitting, the yarn-dyeing demo) rather than the ceramics, watercolour and bookbinding talks the festival pushes. Ground truth is each item's data-knit attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_whittling"
dimension_label = "Hobby: Whittling"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_whittling=Active"
adherence_signal = "The benches chosen are whittling benches (spoon whittling, bird whittling, knife safety and first cuts) rather than the linocut, leather and mosaic benches the festival pushes. Ground truth is each item's data-whittle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
