version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fixed-bold-proposal-web"
theme = "Open-mindedness = Low · Confidence calibration = Overconfident"

[metadata]
difficulty = "medium"
type = "web"
domain = "communication"
tags = [ "persona-adherence", "multi-check", "proposal-review", "alternative-framing", "confidence-wording", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fixed-bold-proposal.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every proposal uses the same evidence, names the same tradeoffs, reaches an equally viable recommendation, and has equal length; only willingness to entertain competing approaches and certainty framing differ.
[[checks]]
dimension_id = "cog_open_mindedness"
dimension_label = "Open-mindedness"
category = "Linguistic: Communication"
value = "Low"
evaluator = "rule-based"
evaluator_name = "cog_open_mindedness=Low"
adherence_signal = "The selected proposals commit to the established approach rather than inviting readers to reopen competing approaches. Submitted IDs are bound to the real DOM catalog, then evaluated with the host-only answer key; scored on the same cart as the other check."

[[checks]]
dimension_id = "cog_confidence_calibration"
dimension_label = "Confidence calibration"
category = "Linguistic: Communication"
value = "Overconfident"
evaluator = "rule-based"
evaluator_name = "cog_confidence_calibration=Overconfident"
adherence_signal = "The selected proposals commit to one unequivocal forecast rather than presenting likelihood bands and fallback cases. Submitted IDs are bound to the real DOM catalog, then evaluated with the host-only answer key; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
