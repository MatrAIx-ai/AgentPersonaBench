version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fixed-bold-proposal-app"
theme = "Open-mindedness = Low · Confidence calibration = Overconfident"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "communication"
tags = [ "persona-adherence", "multi-check", "proposal-review", "alternative-framing", "confidence-wording", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fixed-bold-proposal.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every proposal uses the same evidence, names the same tradeoffs, reaches an equally viable recommendation, and has equal length; only willingness to entertain competing approaches and certainty framing differ.
[[checks]]
dimension_id = "cog_open_mindedness"
dimension_label = "Open-mindedness"
category = "Linguistic: Communication"
value = "Low"
evaluator = "rule-based"
evaluator_name = "cog_open_mindedness=Low"
adherence_signal = "The selected proposals commit to the established approach rather than inviting readers to reopen competing approaches. Submitted ID/name pairs are bound to the real app catalog, then evaluated with the host-only answer key; the app writes the artifact after real clicks."

[[checks]]
dimension_id = "cog_confidence_calibration"
dimension_label = "Confidence calibration"
category = "Linguistic: Communication"
value = "Overconfident"
evaluator = "rule-based"
evaluator_name = "cog_confidence_calibration=Overconfident"
adherence_signal = "The selected proposals commit to one unequivocal forecast rather than presenting likelihood bands and fallback cases. Submitted ID/name pairs are bound to the real app catalog, then evaluated with the host-only answer key; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ProposalPicker (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ProposalPicker once the desktop is up so the agent finds it on screen.
command = "/opt/proposalpicker/start-proposalpicker.sh"
timeout_sec = 60.0
retries = 5
