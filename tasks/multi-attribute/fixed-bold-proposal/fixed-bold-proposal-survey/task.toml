version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fixed-bold-proposal-survey"
theme = "Open-mindedness = Low · Confidence calibration = Overconfident"

[metadata]
difficulty = "easy"
type = "survey"
domain = "communication"
tags = [ "persona-adherence", "multi-check", "proposal-review", "alternative-framing", "confidence-wording", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fixed-bold-proposal.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every proposal uses the same evidence, names the same tradeoffs, reaches an equally viable recommendation, and has equal length; only willingness to entertain competing approaches and certainty framing differ.
[[checks]]
dimension_id = "cog_open_mindedness"
dimension_label = "Open-mindedness"
category = "Linguistic: Communication"
value = "Low"
evaluator = "rule-based"
evaluator_name = "cog_open_mindedness=Low"
adherence_signal = "The selected proposals commit to the established approach rather than inviting readers to reopen competing approaches. Each option id maps to a `altinvite` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cog_confidence_calibration"
dimension_label = "Confidence calibration"
category = "Linguistic: Communication"
value = "Overconfident"
evaluator = "rule-based"
evaluator_name = "cog_confidence_calibration=Overconfident"
adherence_signal = "The selected proposals commit to one unequivocal forecast rather than presenting likelihood bands and fallback cases. Each option id maps to a `boldclaim` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
