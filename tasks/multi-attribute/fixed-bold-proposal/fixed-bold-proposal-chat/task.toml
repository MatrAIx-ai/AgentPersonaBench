version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fixed-bold-proposal-chat"
theme = "Open-mindedness = Low · Confidence calibration = Overconfident"

[metadata]
difficulty = "medium"
type = "chat"
domain = "communication"
application_id = "proposal_board_editor"
tags = [ "persona-adherence", "multi-check", "proposal-review", "alternative-framing", "confidence-wording", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: fixed-bold-proposal.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every proposal uses the same evidence, names the same tradeoffs, reaches an equally viable recommendation, and has equal length; only willingness to entertain competing approaches and certainty framing differ.
[[checks]]
dimension_id = "cog_open_mindedness"
dimension_label = "Open-mindedness"
category = "Linguistic: Communication"
value = "Low"
evaluator = "llm-judge"
evaluator_name = "cog_open_mindedness=Low"
adherence_signal = "The selected proposals commit to the established approach rather than inviting readers to reopen competing approaches. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cog_confidence_calibration"
dimension_label = "Confidence calibration"
category = "Linguistic: Communication"
value = "Overconfident"
evaluator = "llm-judge"
evaluator_name = "cog_confidence_calibration=Overconfident"
adherence_signal = "The selected proposals commit to one unequivocal forecast rather than presenting likelihood bands and fallback cases. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
