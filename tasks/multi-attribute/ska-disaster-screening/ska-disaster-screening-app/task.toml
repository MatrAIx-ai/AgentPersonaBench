version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ska-disaster-screening-app"
theme = "Music genre: Ska = Like · Film genre: Disaster = Like"

[metadata]
difficulty = "hard"
type = "app"
os = "linux"
domain = "community entertainment planning"
tags = [ "persona-adherence", "multi-check", "balanced-tradeoffs", "choice-based", "app",]

# Two checks score independent decisions on one artifact (reward 0..2).
# Every program has the same ticket price, venue quality, accessibility, refreshments, and production quality. Ska openers use an energetic horn-led offbeat set in the standing courtyard; acoustic and ambient alternatives use the seated indoor lounge. Disaster features use an effects-heavy large-scale crisis story that ends at 23:00; comedy and mystery alternatives end at 22:00.
[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Like"
evaluator = "rule-based"
evaluator_name = "musg_ska=Like"
adherence_signal = "The final choices consistently select the ska opening set rather than the non-ska opening set; each check observes its own independent decision on the same artifact."
[[checks]]
dimension_id = "filmg_disaster"
dimension_label = "Film: Disaster"
category = "Interests: Media"
value = "Like"
evaluator = "rule-based"
evaluator_name = "filmg_disaster=Like"
adherence_signal = "The final choices consistently select the disaster feature rather than the non-disaster feature; each check observes its own independent decision on the same artifact."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/choiceapp/start-app.sh"
timeout_sec = 60.0
retries = 5
