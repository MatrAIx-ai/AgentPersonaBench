version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ska-disaster-screening-survey"
theme = "Music genre: Ska = Like · Film genre: Disaster = Like"

[metadata]
difficulty = "hard"
type = "survey"
domain = "community entertainment planning"
tags = [ "persona-adherence", "multi-check", "balanced-tradeoffs", "choice-based", "survey",]

# Two checks score independent decisions on one artifact (reward 0..2).
# Every program has the same ticket price, venue quality, accessibility, refreshments, and production quality. Ska openers use an energetic horn-led offbeat set in the standing courtyard; acoustic and ambient alternatives use the seated indoor lounge. Disaster features use an effects-heavy large-scale crisis story that ends at 23:00; comedy and mystery alternatives end at 22:00.
[[checks]]
dimension_id = "musg_ska"
dimension_label = "Music: Ska"
category = "Interests: Media"
value = "Like"
evaluator = "rule-based"
evaluator_name = "musg_ska=Like"
adherence_signal = "All three final choices select the ska opening set rather than the non-ska opening set; this label is evaluated independently across the shared three-choice artifact."
[[checks]]
dimension_id = "filmg_disaster"
dimension_label = "Film: Disaster"
category = "Interests: Media"
value = "Like"
evaluator = "rule-based"
evaluator_name = "filmg_disaster=Like"
adherence_signal = "All three final choices select the disaster feature rather than the non-disaster feature; this label is evaluated independently across the shared three-choice artifact."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
