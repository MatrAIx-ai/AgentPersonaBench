version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bayou-boil-app"
theme = "Cuisine: Seafood = Love · Cuisine: Cajun = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "seafood", "cajun-cuisine", "lunch-menu", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bayou-boil.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every lunch costs the same, nothing contains pork and no alcohol is served; the seafood is set against equally good chicken plates and the Cajun cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own taste for seafood and for Cajun food independently.
[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_seafood=Love"
adherence_signal = "The lunches chosen are seafood dishes (the boil, the étouffée, the redfish, the sea bass, the prawn curry) rather than the equally good chicken plates the school pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_cajun=Love"
adherence_signal = "The lunches chosen are Cajun dishes (the boil, étouffée, blackened redfish, gumbo, jambalaya, po'boy) rather than the equally good Mediterranean, Thai and Greek plates the school pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ChefCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ChefCard once the desktop is up so the agent finds it on screen.
command = "/opt/chefcard/start-chefcard.sh"
timeout_sec = 60.0
retries = 5
