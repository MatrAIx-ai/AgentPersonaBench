version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bayou-boil-web"
theme = "Cuisine: Seafood = Love · Cuisine: Cajun = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "multi-check", "seafood", "cajun-cuisine", "lunch-menu", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bayou-boil.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every lunch costs the same, nothing contains pork and no alcohol is served; the seafood is set against equally good chicken plates and the Cajun cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own taste for seafood and for Cajun food independently.
[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_seafood=Love"
adherence_signal = "The lunches chosen are seafood dishes (the boil, the étouffée, the redfish, the sea bass, the prawn curry) rather than the equally good chicken plates the school pushes. Ground truth is each item's data-ocean attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_cajun=Love"
adherence_signal = "The lunches chosen are Cajun dishes (the boil, étouffée, blackened redfish, gumbo, jambalaya, po'boy) rather than the equally good Mediterranean, Thai and Greek plates the school pushes. Ground truth is each item's data-bayou attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
