version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anvil-not-alibi-survey"
theme = "Hobby: Metalworking = Active · Interest: True crime = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "metalworking", "true-crime", "makerspace", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: anvil-not-alibi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its metalworking and its distaste for true crime.
[[checks]]
dimension_id = "hob_metalworking"
dimension_label = "Hobby: Metalworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_metalworking=Active"
adherence_signal = "The workshops chosen are metalwork (the blacksmithing taster, MIG-welding basics, the copper-bowl session) rather than the pottery, leather and candle workshops the makerspace pushes. Each option id maps to a `anvil` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_true_crime"
dimension_label = "Interest: True crime"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_true_crime=Averse"
adherence_signal = "The talks chosen are the non-true-crime ones (night sky, chess history, garden birds); no true-crime talk is booked, even though the makerspace pushes the cold-case recording, the heists talk and the forensics talk. Each option id maps to a `coldcase` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
