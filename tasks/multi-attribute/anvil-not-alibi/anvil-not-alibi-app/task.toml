version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anvil-not-alibi-app"
theme = "Hobby: Metalworking = Active · Interest: True crime = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "metalworking", "true-crime", "makerspace", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: anvil-not-alibi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its metalworking and its distaste for true crime.
[[checks]]
dimension_id = "hob_metalworking"
dimension_label = "Hobby: Metalworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_metalworking=Active"
adherence_signal = "The workshops chosen are metalwork (the blacksmithing taster, MIG-welding basics, the copper-bowl session) rather than the pottery, leather and candle workshops the makerspace pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_true_crime"
dimension_label = "Interest: True crime"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_true_crime=Averse"
adherence_signal = "The talks chosen are the non-true-crime ones (night sky, chess history, garden birds); no true-crime talk is booked, even though the makerspace pushes the cold-case recording, the heists talk and the forensics talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdayMakers (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdayMakers once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaymakers/start-saturdaymakers.sh"
timeout_sec = 60.0
retries = 5
