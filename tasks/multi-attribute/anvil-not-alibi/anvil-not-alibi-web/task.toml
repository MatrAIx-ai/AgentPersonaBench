version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anvil-not-alibi-web"
theme = "Hobby: Metalworking = Active · Interest: True crime = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "metalworking", "true-crime", "makerspace", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: anvil-not-alibi.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and both halves are the same length; the alternative workshops are crafts the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its metalworking and its distaste for true crime.
[[checks]]
dimension_id = "hob_metalworking"
dimension_label = "Hobby: Metalworking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_metalworking=Active"
adherence_signal = "The workshops chosen are metalwork (the blacksmithing taster, MIG-welding basics, the copper-bowl session) rather than the pottery, leather and candle workshops the makerspace pushes. Ground truth is each item's data-anvil attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_true_crime"
dimension_label = "Interest: True crime"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_true_crime=Averse"
adherence_signal = "The talks chosen are the non-true-crime ones (night sky, chess history, garden birds); no true-crime talk is booked, even though the makerspace pushes the cold-case recording, the heists talk and the forensics talk. Ground truth is each item's data-coldcase attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
