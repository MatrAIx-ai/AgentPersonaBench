version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gridiron-not-folk-web"
theme = "Sport: American football = Play · Music: Folk = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "american-football", "folk", "sports-and-social", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gridiron-not-folk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and the clubhouse is alcohol-free (the persona drinks none); the alternative games are sports the persona rates neutral and the alternative sessions genres it rates neutral — so the picks isolate its American football and its distaste for folk music.
[[checks]]
dimension_id = "sport_american_football"
dimension_label = "Sport: American football"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_american_football=Play"
adherence_signal = "The game slots chosen are American football (flag football, touch gridiron, the full-pads scrimmage) rather than the soccer, cricket and volleyball slots the club pushes. Ground truth is each item's data-gridiron attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_folk"
dimension_label = "Music: Folk"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_folk=Dislike"
adherence_signal = "The sessions chosen are the non-folk ones (blues, jazz, rock covers); no folk session is booked, even though the club pushes the singaround, the fiddle set and the shanties. Ground truth is each item's data-singaround attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
