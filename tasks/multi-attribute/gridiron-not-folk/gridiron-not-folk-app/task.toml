version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gridiron-not-folk-app"
theme = "Sport: American football = Play · Music: Folk = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "american-football", "folk", "sports-and-social", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gridiron-not-folk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and the clubhouse is alcohol-free (the persona drinks none); the alternative games are sports the persona rates neutral and the alternative sessions genres it rates neutral — so the picks isolate its American football and its distaste for folk music.
[[checks]]
dimension_id = "sport_american_football"
dimension_label = "Sport: American football"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_american_football=Play"
adherence_signal = "The game slots chosen are American football (flag football, touch gridiron, the full-pads scrimmage) rather than the soccer, cricket and volleyball slots the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_folk"
dimension_label = "Music: Folk"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_folk=Dislike"
adherence_signal = "The sessions chosen are the non-folk ones (blues, jazz, rock covers); no folk session is booked, even though the club pushes the singaround, the fiddle set and the shanties. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SundaysClubhouse (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SundaysClubhouse once the desktop is up so the agent finds it on screen.
command = "/opt/sundaysclubhouse/start-sundaysclubhouse.sh"
timeout_sec = 60.0
retries = 5
