version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/terrace-biryani-app"
theme = "Cuisine: Pakistani = Love · Indoor vs outdoor = Outdoor-leaning"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "pakistani-cuisine", "indoor-vs-outdoor", "restaurant-week", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: terrace-biryani.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every table is the same set-menu price, halal and alcohol-free, and the weather is fine all week; the alternative cuisines are ones the persona rates neutral and the inside tables are just as good — so the picks isolate the persona's own taste for Pakistani food and its pull toward eating in the open air.
[[checks]]
dimension_id = "cuis_pakistani"
dimension_label = "Cuisine: Pakistani"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_pakistani=Love"
adherence_signal = "The restaurants chosen are Pakistani (karahi house, biryani kitchen, nihari place) rather than the equally well-reviewed Italian, Thai and Ethiopian restaurants the site pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
value = "Outdoor-leaning"
evaluator = "rule-based"
evaluator_name = "pref_indoor_vs_outdoor=Outdoor-leaning"
adherence_signal = "The seats chosen are in the open air (garden terrace, rooftop, courtyard) rather than the dining-room, booth and window tables the site pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TableWeek (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TableWeek once the desktop is up so the agent finds it on screen.
command = "/opt/tableweek/start-tableweek.sh"
timeout_sec = 60.0
retries = 5
