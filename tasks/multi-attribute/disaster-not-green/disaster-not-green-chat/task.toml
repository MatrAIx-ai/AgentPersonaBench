version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/disaster-not-green-chat"
theme = "Film: Disaster = Love · Interest: Environment = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "sunday_programme_desk"
tags = [ "persona-adherence", "multi-check", "disaster-films", "environment", "sunday-programme", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: disaster-not-green.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every ticket costs the same and both halves are the same length; the alternative screenings are genres the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its taste for disaster films and its distaste for environmental programming.
[[checks]]
dimension_id = "filmg_disaster"
dimension_label = "Film: Disaster"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "filmg_disaster=Love"
adherence_signal = "The screenings chosen are disaster films (tidal wave, earthquake, volcano) rather than the heist film, space adventure and superhero film the programme pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_environment"
dimension_label = "Interest: Environment"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_environment=Averse"
adherence_signal = "The talks chosen are the non-environmental ones (architecture, chess, photography); no environmental talk is booked, even though the programme pushes the climate-action talk, the rewilding talk and the zero-waste talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
