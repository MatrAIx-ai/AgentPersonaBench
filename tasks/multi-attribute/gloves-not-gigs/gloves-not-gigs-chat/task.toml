version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gloves-not-gigs-chat"
theme = "Sport: Boxing = Play · Interest: Live concerts = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "social_app_concierge"
tags = [ "persona-adherence", "multi-check", "boxing", "live-concerts", "friday-packs", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gloves-not-gigs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pack costs the same and no venue serves alcohol; the alternative classes are just as sweaty and the alternative late plans just as sociable — so the picks isolate the persona's own boxing and its distaste for live concerts.
[[checks]]
dimension_id = "sport_boxing"
dimension_label = "Sport: Boxing"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_boxing=Play"
adherence_signal = "The early-evening halves of the packs are boxing sessions (pads, sparring class, heavy-bag circuit) rather than the equally sweaty spin, swim and rowing classes the app pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_live_concerts=Averse"
adherence_signal = "The late-evening halves of the packs are the non-concert plans (diner, film, board-game cafe); no live gig, stadium show or open-air concert is booked, even though the app pushes the concerts as the headline. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
