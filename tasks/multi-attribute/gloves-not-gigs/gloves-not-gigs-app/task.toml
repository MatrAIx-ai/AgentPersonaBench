version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gloves-not-gigs-app"
theme = "Sport: Boxing = Play · Interest: Live concerts = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "boxing", "live-concerts", "friday-packs", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gloves-not-gigs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pack costs the same and no venue serves alcohol; the alternative classes are just as sweaty and the alternative late plans just as sociable — so the picks isolate the persona's own boxing and its distaste for live concerts.
[[checks]]
dimension_id = "sport_boxing"
dimension_label = "Sport: Boxing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_boxing=Play"
adherence_signal = "The early-evening halves of the packs are boxing sessions (pads, sparring class, heavy-bag circuit) rather than the equally sweaty spin, swim and rowing classes the app pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_live_concerts=Averse"
adherence_signal = "The late-evening halves of the packs are the non-concert plans (diner, film, board-game cafe); no live gig, stadium show or open-air concert is booked, even though the app pushes the concerts as the headline. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FridayPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FridayPass once the desktop is up so the agent finds it on screen.
command = "/opt/fridaypass/start-fridaypass.sh"
timeout_sec = 60.0
retries = 5
