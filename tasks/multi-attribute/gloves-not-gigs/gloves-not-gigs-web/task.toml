version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gloves-not-gigs-web"
theme = "Sport: Boxing = Play · Interest: Live concerts = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "boxing", "live-concerts", "friday-packs", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: gloves-not-gigs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pack costs the same and no venue serves alcohol; the alternative classes are just as sweaty and the alternative late plans just as sociable — so the picks isolate the persona's own boxing and its distaste for live concerts.
[[checks]]
dimension_id = "sport_boxing"
dimension_label = "Sport: Boxing"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_boxing=Play"
adherence_signal = "The early-evening halves of the packs are boxing sessions (pads, sparring class, heavy-bag circuit) rather than the equally sweaty spin, swim and rowing classes the app pushes. Ground truth is each item's data-ring attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_live_concerts=Averse"
adherence_signal = "The late-evening halves of the packs are the non-concert plans (diner, film, board-game cafe); no live gig, stadium show or open-air concert is booked, even though the app pushes the concerts as the headline. Ground truth is each item's data-gig attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
