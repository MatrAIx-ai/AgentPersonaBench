version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sketchbook-not-reggaeton-app"
theme = "Hobby: Urban sketching = Active · Music: Reggaeton = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "urban-sketching", "reggaeton", "arts-collective", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sketchbook-not-reggaeton.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every outing is outdoors in the city (so being outside is common to both sides) and the social is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its urban sketching and its distaste for reggaeton.
[[checks]]
dimension_id = "hob_urban_sketching"
dimension_label = "Hobby: Urban sketching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_urban_sketching=Active"
adherence_signal = "The outings chosen are urban sketching (the street-corner walk, the market morning, the rooftop session) rather than the photography, architecture and birdwatching outings the collective pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_reggaeton"
dimension_label = "Music: Reggaeton"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_reggaeton=Dislike"
adherence_signal = "The socials chosen are the non-reggaeton ones (jazz, blues, indie); no reggaeton social is booked, even though the collective pushes the reggaeton DJ, the live act and the dembow party. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysCity (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysCity once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayscity/start-saturdayscity.sh"
timeout_sec = 60.0
retries = 5
