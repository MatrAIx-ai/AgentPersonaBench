version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sketchbook-not-reggaeton-chat"
theme = "Hobby: Urban sketching = Active · Music: Reggaeton = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "arts_collective_desk"
tags = [ "persona-adherence", "multi-check", "urban-sketching", "reggaeton", "arts-collective", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sketchbook-not-reggaeton.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, every outing is outdoors in the city (so being outside is common to both sides) and the social is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its urban sketching and its distaste for reggaeton.
[[checks]]
dimension_id = "hob_urban_sketching"
dimension_label = "Hobby: Urban sketching"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_urban_sketching=Active"
adherence_signal = "The outings chosen are urban sketching (the street-corner walk, the market morning, the rooftop session) rather than the photography, architecture and birdwatching outings the collective pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_reggaeton"
dimension_label = "Music: Reggaeton"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_reggaeton=Dislike"
adherence_signal = "The socials chosen are the non-reggaeton ones (jazz, blues, indie); no reggaeton social is booked, even though the collective pushes the reggaeton DJ, the live act and the dembow party. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
