version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wicks-not-funk-app"
theme = "Hobby: Candle making = Active · Music: Funk = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "candle-making", "funk", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wicks-not-funk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hall is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its candle making and its distaste for funk.
[[checks]]
dimension_id = "hob_candle_making"
dimension_label = "Hobby: Candle making"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_candle_making=Active"
adherence_signal = "The workshops chosen are candle making (the soy pouring session, the taper dipping, the scent blending) rather than the pottery, origami and leather sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_funk"
dimension_label = "Music: Funk"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_funk=Dislike"
adherence_signal = "The socials chosen are the non-funk ones (jazz, house, ska); no funk social is booked, even though the centre pushes the horn-section night, the funk DJ and the funk covers band. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HallAndWick (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HallAndWick once the desktop is up so the agent finds it on screen.
command = "/opt/hallandwick/start-hallandwick.sh"
timeout_sec = 60.0
retries = 5
