version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wicks-not-funk-chat"
theme = "Hobby: Candle making = Active · Music: Funk = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "centre_workshop_social_desk"
tags = [ "persona-adherence", "multi-check", "candle-making", "funk", "community-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: wicks-not-funk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hall is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the alternative socials genres it rates neutral — so the picks isolate its candle making and its distaste for funk.
[[checks]]
dimension_id = "hob_candle_making"
dimension_label = "Hobby: Candle making"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_candle_making=Active"
adherence_signal = "The workshops chosen are candle making (the soy pouring session, the taper dipping, the scent blending) rather than the pottery, origami and leather sessions the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_funk"
dimension_label = "Music: Funk"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_funk=Dislike"
adherence_signal = "The socials chosen are the non-funk ones (jazz, house, ska); no funk social is booked, even though the centre pushes the horn-section night, the funk DJ and the funk covers band. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
