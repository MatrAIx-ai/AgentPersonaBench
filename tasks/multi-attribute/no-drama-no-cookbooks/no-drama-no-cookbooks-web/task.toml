version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-drama-no-cookbooks-web"
theme = "Film: Drama = Dislike · Books: Cookbooks = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "drama", "cookbooks", "film-and-book-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-drama-no-cookbooks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is indoor-leaning) and the book is posted ahead; the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for dramas and its distaste for cookbooks.
[[checks]]
dimension_id = "filmg_drama"
dimension_label = "Film: Drama"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_drama=Dislike"
adherence_signal = "The films chosen are the non-dramas (the space adventure, the mystery, the superhero film); no drama is booked, even though the club pushes the courtroom drama, the inheritance drama and the grief drama. Ground truth is each item's data-dramareel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_cookbooks"
dimension_label = "Books: Cookbooks"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_cookbooks=Dislike"
adherence_signal = "The books chosen are the non-cookbooks (the science fiction, the fantasy, the memoir); no cookbook is booked, even though the club pushes the weeknight suppers, the baking bible and the regional cookbook. Ground truth is each item's data-cookbookshelf attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
