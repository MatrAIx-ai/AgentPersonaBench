version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-drama-no-cookbooks-app"
theme = "Film: Drama = Dislike · Books: Cookbooks = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "drama", "cookbooks", "film-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-drama-no-cookbooks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is indoor-leaning) and the book is posted ahead; the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for dramas and its distaste for cookbooks.
[[checks]]
dimension_id = "filmg_drama"
dimension_label = "Film: Drama"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_drama=Dislike"
adherence_signal = "The films chosen are the non-dramas (the space adventure, the mystery, the superhero film); no drama is booked, even though the club pushes the courtroom drama, the inheritance drama and the grief drama. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_cookbooks"
dimension_label = "Books: Cookbooks"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_cookbooks=Dislike"
adherence_signal = "The books chosen are the non-cookbooks (the science fiction, the fantasy, the memoir); no cookbook is booked, even though the club pushes the weeknight suppers, the baking bible and the regional cookbook. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FolioAndFilm (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FolioAndFilm once the desktop is up so the agent finds it on screen.
command = "/opt/folioandfilm/start-folioandfilm.sh"
timeout_sec = 60.0
retries = 5
