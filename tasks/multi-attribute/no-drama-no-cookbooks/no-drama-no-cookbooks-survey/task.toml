version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-drama-no-cookbooks-survey"
theme = "Film: Drama = Dislike · Books: Cookbooks = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "drama", "cookbooks", "film-and-book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-drama-no-cookbooks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is indoor-leaning) and the book is posted ahead; the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for dramas and its distaste for cookbooks.
[[checks]]
dimension_id = "filmg_drama"
dimension_label = "Film: Drama"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_drama=Dislike"
adherence_signal = "The films chosen are the non-dramas (the space adventure, the mystery, the superhero film); no drama is booked, even though the club pushes the courtroom drama, the inheritance drama and the grief drama. Each option id maps to a `dramareel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_cookbooks"
dimension_label = "Books: Cookbooks"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_cookbooks=Dislike"
adherence_signal = "The books chosen are the non-cookbooks (the science fiction, the fantasy, the memoir); no cookbook is booked, even though the club pushes the weeknight suppers, the baking bible and the regional cookbook. Each option id maps to a `cookbookshelf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
