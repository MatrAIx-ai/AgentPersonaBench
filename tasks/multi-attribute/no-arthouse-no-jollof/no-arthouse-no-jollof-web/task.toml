version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-arthouse-no-jollof-web"
theme = "Film: Art house = Dislike · Cuisine: Nigerian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "art-house", "nigerian-cuisine", "dinner-and-a-movie", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-arthouse-no-jollof.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the cinema is alcohol-free (the persona eats no seafood and drinks none); the alternative films are genres the persona rates neutral and the non-Nigerian suppers cuisines it rates neutral — so the picks isolate its distaste for art-house films and its distaste for Nigerian food.
[[checks]]
dimension_id = "filmg_art_house"
dimension_label = "Film: Art house"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_art_house=Dislike"
adherence_signal = "The films chosen are the non-art-house ones (the heist film, the biopic, the mystery); no art-house film is booked, even though the cinema pushes the slow-cinema film, the black-and-white drama and the experimental feature. Ground truth is each item's data-arthouse attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_nigerian"
dimension_label = "Cuisine: Nigerian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_nigerian=Avoid"
adherence_signal = "The suppers chosen are the non-Nigerian ones (Thai, Chinese, Spanish); no Nigerian supper is booked, even though the cinema pushes the jollof, the egusi and the suya. Ground truth is each item's data-jollof attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
