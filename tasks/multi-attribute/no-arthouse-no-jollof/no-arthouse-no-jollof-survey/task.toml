version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-arthouse-no-jollof-survey"
theme = "Film: Art house = Dislike · Cuisine: Nigerian = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "art-house", "nigerian-cuisine", "dinner-and-a-movie", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-arthouse-no-jollof.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the cinema is alcohol-free (the persona eats no seafood and drinks none); the alternative films are genres the persona rates neutral and the non-Nigerian suppers cuisines it rates neutral — so the picks isolate its distaste for art-house films and its distaste for Nigerian food.
[[checks]]
dimension_id = "filmg_art_house"
dimension_label = "Film: Art house"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_art_house=Dislike"
adherence_signal = "The films chosen are the non-art-house ones (the heist film, the biopic, the mystery); no art-house film is booked, even though the cinema pushes the slow-cinema film, the black-and-white drama and the experimental feature. Each option id maps to a `arthouse` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_nigerian"
dimension_label = "Cuisine: Nigerian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_nigerian=Avoid"
adherence_signal = "The suppers chosen are the non-Nigerian ones (Thai, Chinese, Spanish); no Nigerian supper is booked, even though the cinema pushes the jollof, the egusi and the suya. Each option id maps to a `jollof` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
