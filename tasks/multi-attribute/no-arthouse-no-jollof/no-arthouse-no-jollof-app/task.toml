version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-arthouse-no-jollof-app"
theme = "Film: Art house = Dislike · Cuisine: Nigerian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "art-house", "nigerian-cuisine", "dinner-and-a-movie", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-arthouse-no-jollof.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the cinema is alcohol-free (the persona eats no seafood and drinks none); the alternative films are genres the persona rates neutral and the non-Nigerian suppers cuisines it rates neutral — so the picks isolate its distaste for art-house films and its distaste for Nigerian food.
[[checks]]
dimension_id = "filmg_art_house"
dimension_label = "Film: Art house"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_art_house=Dislike"
adherence_signal = "The films chosen are the non-art-house ones (the heist film, the biopic, the mystery); no art-house film is booked, even though the cinema pushes the slow-cinema film, the black-and-white drama and the experimental feature. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_nigerian"
dimension_label = "Cuisine: Nigerian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_nigerian=Avoid"
adherence_signal = "The suppers chosen are the non-Nigerian ones (Thai, Chinese, Spanish); no Nigerian supper is booked, even though the cinema pushes the jollof, the egusi and the suya. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperClubScreen (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperClubScreen once the desktop is up so the agent finds it on screen.
command = "/opt/supperclubscreen/start-supperclubscreen.sh"
timeout_sec = 60.0
retries = 5
