version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ledgers-not-mala-survey"
theme = "Books: Business = Love · Cuisine: Sichuan = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "business-books", "sichuan-cuisine", "book-and-lunch-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ledgers-not-mala.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative books are genres the persona rates neutral and the non-Sichuan lunches cuisines it rates neutral (every lunch has a meat-free option, as the persona eats flexitarian) — so the picks isolate its taste for business books and its distaste for Sichuan food.
[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_business=Love"
adherence_signal = "The books chosen are business books (building a company, management, negotiation) rather than the science-fiction novel, memoir and popular-science paperback the club pushes. Each option id maps to a `ledger` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_sichuan"
dimension_label = "Cuisine: Sichuan"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_sichuan=Avoid"
adherence_signal = "The lunches chosen are the non-Sichuan ones (Italian, Thai, Korean); no Sichuan lunch is booked, even though the club pushes the mapo tofu, the dan dan noodles and the dry-fried beans. Each option id maps to a `sichuanlunch` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
