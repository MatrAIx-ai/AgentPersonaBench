version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ledgers-not-mala-chat"
theme = "Books: Business = Love · Cuisine: Sichuan = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "book_lunch_club_host"
tags = [ "persona-adherence", "multi-check", "business-books", "sichuan-cuisine", "book-and-lunch-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ledgers-not-mala.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative books are genres the persona rates neutral and the non-Sichuan lunches cuisines it rates neutral (every lunch has a meat-free option, as the persona eats flexitarian) — so the picks isolate its taste for business books and its distaste for Sichuan food.
[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_business=Love"
adherence_signal = "The books chosen are business books (building a company, management, negotiation) rather than the science-fiction novel, memoir and popular-science paperback the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_sichuan"
dimension_label = "Cuisine: Sichuan"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_sichuan=Avoid"
adherence_signal = "The lunches chosen are the non-Sichuan ones (Italian, Thai, Korean); no Sichuan lunch is booked, even though the club pushes the mapo tofu, the dan dan noodles and the dry-fried beans. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
