version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ledgers-not-mala-app"
theme = "Books: Business = Love · Cuisine: Sichuan = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "business-books", "sichuan-cuisine", "book-and-lunch-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ledgers-not-mala.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative books are genres the persona rates neutral and the non-Sichuan lunches cuisines it rates neutral (every lunch has a meat-free option, as the persona eats flexitarian) — so the picks isolate its taste for business books and its distaste for Sichuan food.
[[checks]]
dimension_id = "bookg_business"
dimension_label = "Books: Business"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_business=Love"
adherence_signal = "The books chosen are business books (building a company, management, negotiation) rather than the science-fiction novel, memoir and popular-science paperback the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_sichuan"
dimension_label = "Cuisine: Sichuan"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_sichuan=Avoid"
adherence_signal = "The lunches chosen are the non-Sichuan ones (Italian, Thai, Korean); no Sichuan lunch is booked, even though the club pushes the mapo tofu, the dan dan noodles and the dry-fried beans. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LunchAndBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LunchAndBook once the desktop is up so the agent finds it on screen.
command = "/opt/lunchandbook/start-lunchandbook.sh"
timeout_sec = 60.0
retries = 5
