version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stats-not-physics-app"
theme = "Subject: Statistics = Passionate · Subject: Physics = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "statistics", "physics", "learning-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: stats-not-physics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Tuesday costs the same and both halves are the same length; the alternative lectures and seminars are subjects the persona rates neutral; the statistics side comes with a waiting list, confirmed the day before and the alternatives with a guaranteed place, confirmed at booking, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of statistics and its distaste for physics.
[[checks]]
dimension_id = "acad_statistics"
dimension_label = "Subject: Statistics"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_statistics=Passionate"
adherence_signal = "The lectures chosen are statistics (reading the noise, Bayes for beginners, what the average hides) rather than the economics, architecture and civics lectures the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "acad_physics"
dimension_label = "Subject: Physics"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_physics=Averse"
adherence_signal = "The seminars chosen are the non-physics ones (sociology, foreign languages, logic); no physics seminar is booked, even though the centre pushes why the sky is blue, quantum for the curious and waves and resonance. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LecturesTuesday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LecturesTuesday once the desktop is up so the agent finds it on screen.
command = "/opt/lecturestuesday/start-lecturestuesday.sh"
timeout_sec = 60.0
retries = 5
