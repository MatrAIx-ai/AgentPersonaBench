version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/indoor-joinery-web"
theme = "Indoor vs outdoor = Strongly indoor · Interest: Woodworking = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "indoor-vs-outdoor", "woodworking", "community-workshops", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: indoor-joinery.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every session costs the same, runs the same hours and provides all tools; the open-air sessions are fully equipped and the alternative crafts are just as hands-on — so the picks isolate the persona's own preference for being under a roof and its woodworking.
[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
value = "Strongly indoor"
evaluator = "rule-based"
evaluator_name = "pref_indoor_vs_outdoor=Strongly indoor"
adherence_signal = "The sessions chosen run under a roof (workshop hall, studio, machine shop) rather than in the park, on the meadow or on the outdoor site the programme pushes. Ground truth is each item's data-roofed attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_woodworking"
dimension_label = "Interest: Woodworking"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_woodworking=Passionate"
adherence_signal = "The crafts chosen are woodworking (dovetail joinery, spoon carving, cabinet-making) rather than the equally hands-on pottery, leather and mosaic sessions the programme pushes. Ground truth is each item's data-timber attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
