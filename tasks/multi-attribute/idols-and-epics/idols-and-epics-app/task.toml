version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/idols-and-epics-app"
theme = "Music: K-pop = Love · Film: Historical = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "k-pop", "historical-films", "double-bill", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: idols-and-epics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every double bill costs the same and runs the same length; the alternative music films are genres the persona rates neutral and the alternative features genres it rates neutral (nothing on either side is a drama, which it rates highly); the K-pop films are shown in screen two, the small room at the back, while the alternatives get the main auditorium, and the historical features come with restricted-view seats while the alternatives get the best seats in the house, so a chooser with no stake in either taste takes the alternatives — so the picks isolate its taste for K-pop and for historical films.
[[checks]]
dimension_id = "musg_k_pop"
dimension_label = "Music: K-pop"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_k_pop=Love"
adherence_signal = "The music films chosen are K-pop (tour film, live concert film, comeback showcase) rather than the jazz, classical and reggae concert films the cinema pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_historical"
dimension_label = "Film: Historical"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_historical=Love"
adherence_signal = "The features chosen are historical (the historical epic, the ancient-Rome epic, the 1840s saga) rather than the sci-fi feature, superhero film and animated feature the cinema pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BillDouble (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BillDouble once the desktop is up so the agent finds it on screen.
command = "/opt/billdouble/start-billdouble.sh"
timeout_sec = 60.0
retries = 5
