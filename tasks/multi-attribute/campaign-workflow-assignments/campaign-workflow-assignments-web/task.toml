version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/campaign-workflow-assignments-web"
theme = "Tool: Trello = Power user · Skill: Persuasion = Advanced"

[metadata]
difficulty = "hard"
type = "web"
domain = "community grant campaign planning"
tags = [ "persona-adherence", "multi-check", "balanced-tradeoffs", "choice-based", "web",]

# Two checks score independent decisions on one artifact (reward 0..2).
# Every assignment combines one workflow platform with one campaign role; the two choices are scored independently.
[[checks]]
dimension_id = "tool_trello"
dimension_label = "Tool: Trello"
category = "Skills: Tools"
value = "Power user"
evaluator = "rule-based"
evaluator_name = "tool_trello=Power user"
adherence_signal = "All three submitted assignments use the explicitly Trello-native card/list/checklist/automation workflow."
[[checks]]
dimension_id = "skill_persuasion"
dimension_label = "Skill: Persuasion"
category = "Expertise: Skills"
value = "Advanced"
evaluator = "rule-based"
evaluator_name = "skill_persuasion=Advanced"
adherence_signal = "All three submitted assignments lead a live stakeholder pitch and handle objections in the room."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
