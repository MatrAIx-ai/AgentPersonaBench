version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bollywood-not-blueprints-survey"
theme = "Music: Bollywood = Love · Interest: Architecture = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "bollywood", "architecture", "cultural-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bollywood-not-blueprints.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the centre is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its taste for Bollywood music and its distaste for architecture.
[[checks]]
dimension_id = "musg_bollywood"
dimension_label = "Music: Bollywood"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_bollywood=Love"
adherence_signal = "The concerts chosen are Bollywood (the hits night, the live orchestra, the dance party) rather than the R&B, reggae and gospel concerts the centre pushes. Each option id maps to a `filmi` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_architecture"
dimension_label = "Interest: Architecture"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_architecture=Averse"
adherence_signal = "The talks chosen are the non-architecture ones (local history, photography, night sky); no architecture session is booked, even though the centre pushes the walking tour, the modernist talk and the cathedral lecture. Each option id maps to a `blueprint` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
