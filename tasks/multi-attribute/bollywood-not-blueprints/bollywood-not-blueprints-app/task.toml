version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bollywood-not-blueprints-app"
theme = "Music: Bollywood = Love · Interest: Architecture = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "bollywood", "architecture", "cultural-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: bollywood-not-blueprints.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the centre is alcohol-free (the persona drinks none); the alternative concerts are genres the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its taste for Bollywood music and its distaste for architecture.
[[checks]]
dimension_id = "musg_bollywood"
dimension_label = "Music: Bollywood"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_bollywood=Love"
adherence_signal = "The concerts chosen are Bollywood (the hits night, the live orchestra, the dance party) rather than the R&B, reggae and gospel concerts the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_architecture"
dimension_label = "Interest: Architecture"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_architecture=Averse"
adherence_signal = "The talks chosen are the non-architecture ones (local history, photography, night sky); no architecture session is booked, even though the centre pushes the walking tour, the modernist talk and the cathedral lecture. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ConcertAndTalk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ConcertAndTalk once the desktop is up so the agent finds it on screen.
command = "/opt/concertandtalk/start-concertandtalk.sh"
timeout_sec = 60.0
retries = 5
