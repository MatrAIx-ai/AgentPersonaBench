version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-hides-no-hustle-app"
theme = "Interest: Birdwatching = Averse · Interest: Productivity = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "productivity", "community-hub", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-hides-no-hustle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hub is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative workshops topics it rates neutral — so the picks isolate its distaste for birdwatching and its distaste for productivity culture.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_birdwatching=Averse"
adherence_signal = "The outings chosen are the non-birdwatching ones (local history, night sky, board games); no birdwatching outing is booked, even though the hub pushes the dawn chorus, the wader hide and the garden-birds talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_productivity"
dimension_label = "Interest: Productivity"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_productivity=Averse"
adherence_signal = "The workshops chosen are the non-productivity ones (languages, magic, knitting); no productivity workshop is booked, even though the hub pushes the time-blocking workshop, the app masterclass and the goal-setting seminar. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysHub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysHub once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayshub/start-saturdayshub.sh"
timeout_sec = 60.0
retries = 5
