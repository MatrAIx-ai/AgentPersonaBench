version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-hides-no-hustle-chat"
theme = "Interest: Birdwatching = Averse · Interest: Productivity = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "community_hub_desk"
tags = [ "persona-adherence", "multi-check", "birdwatching", "productivity", "community-hub", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-hides-no-hustle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hub is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative workshops topics it rates neutral — so the picks isolate its distaste for birdwatching and its distaste for productivity culture.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_birdwatching=Averse"
adherence_signal = "The outings chosen are the non-birdwatching ones (local history, night sky, board games); no birdwatching outing is booked, even though the hub pushes the dawn chorus, the wader hide and the garden-birds talk. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_productivity"
dimension_label = "Interest: Productivity"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_productivity=Averse"
adherence_signal = "The workshops chosen are the non-productivity ones (languages, magic, knitting); no productivity workshop is booked, even though the hub pushes the time-blocking workshop, the app masterclass and the goal-setting seminar. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
