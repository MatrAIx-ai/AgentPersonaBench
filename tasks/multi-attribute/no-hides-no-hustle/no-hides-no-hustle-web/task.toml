version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-hides-no-hustle-web"
theme = "Interest: Birdwatching = Averse · Interest: Productivity = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "birdwatching", "productivity", "community-hub", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-hides-no-hustle.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the hub is alcohol-free (the persona drinks none); the alternative outings are topics the persona rates neutral and the alternative workshops topics it rates neutral — so the picks isolate its distaste for birdwatching and its distaste for productivity culture.
[[checks]]
dimension_id = "topic_birdwatching"
dimension_label = "Interest: Birdwatching"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_birdwatching=Averse"
adherence_signal = "The outings chosen are the non-birdwatching ones (local history, night sky, board games); no birdwatching outing is booked, even though the hub pushes the dawn chorus, the wader hide and the garden-birds talk. Ground truth is each item's data-birdhide attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_productivity"
dimension_label = "Interest: Productivity"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_productivity=Averse"
adherence_signal = "The workshops chosen are the non-productivity ones (languages, magic, knitting); no productivity workshop is booked, even though the hub pushes the time-blocking workshop, the app masterclass and the goal-setting seminar. Ground truth is each item's data-timeblock attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
