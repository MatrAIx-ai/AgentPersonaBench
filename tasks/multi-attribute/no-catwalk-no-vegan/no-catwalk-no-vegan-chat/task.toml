version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-catwalk-no-vegan-chat"
theme = "Interest: Fashion = Averse · Cuisine: Vegan = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "cultural_centre_saturday_desk"
tags = [ "persona-adherence", "multi-check", "fashion", "vegan-cuisine", "cultural-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-catwalk-no-vegan.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the non-vegan suppers cuisines it rates neutral — so the picks isolate its distaste for fashion and its distaste for vegan food.
[[checks]]
dimension_id = "topic_fashion"
dimension_label = "Interest: Fashion"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_fashion=Averse"
adherence_signal = "The sessions chosen are the non-fashion ones (photography, local history, board games); no fashion session is booked, even though the centre pushes the runway screening, the styling masterclass and the fashion-history talk. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_vegan"
dimension_label = "Cuisine: Vegan"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_vegan=Avoid"
adherence_signal = "The suppers chosen are the non-vegan ones (Greek, Thai, Lebanese); no vegan supper is booked, even though the centre pushes the tasting menu, the plant-based burger and the vegan bowl. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
