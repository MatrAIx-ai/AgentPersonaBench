version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-catwalk-no-vegan-web"
theme = "Interest: Fashion = Averse · Cuisine: Vegan = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "fashion", "vegan-cuisine", "cultural-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-catwalk-no-vegan.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the non-vegan suppers cuisines it rates neutral — so the picks isolate its distaste for fashion and its distaste for vegan food.
[[checks]]
dimension_id = "topic_fashion"
dimension_label = "Interest: Fashion"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_fashion=Averse"
adherence_signal = "The sessions chosen are the non-fashion ones (photography, local history, board games); no fashion session is booked, even though the centre pushes the runway screening, the styling masterclass and the fashion-history talk. Ground truth is each item's data-catwalk attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_vegan"
dimension_label = "Cuisine: Vegan"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_vegan=Avoid"
adherence_signal = "The suppers chosen are the non-vegan ones (Greek, Thai, Lebanese); no vegan supper is booked, even though the centre pushes the tasting menu, the plant-based burger and the vegan bowl. Ground truth is each item's data-plantplate attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
