version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-catwalk-no-vegan-app"
theme = "Interest: Fashion = Averse · Cuisine: Vegan = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "fashion", "vegan-cuisine", "cultural-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-catwalk-no-vegan.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the centre is alcohol-free (the persona drinks none); the alternative sessions are topics the persona rates neutral and the non-vegan suppers cuisines it rates neutral — so the picks isolate its distaste for fashion and its distaste for vegan food.
[[checks]]
dimension_id = "topic_fashion"
dimension_label = "Interest: Fashion"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_fashion=Averse"
adherence_signal = "The sessions chosen are the non-fashion ones (photography, local history, board games); no fashion session is booked, even though the centre pushes the runway screening, the styling masterclass and the fashion-history talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_vegan"
dimension_label = "Cuisine: Vegan"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_vegan=Avoid"
adherence_signal = "The suppers chosen are the non-vegan ones (Greek, Thai, Lebanese); no vegan supper is booked, even though the centre pushes the tasting menu, the plant-based burger and the vegan bowl. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperAndSession (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperAndSession once the desktop is up so the agent finds it on screen.
command = "/opt/supperandsession/start-supperandsession.sh"
timeout_sec = 60.0
retries = 5
