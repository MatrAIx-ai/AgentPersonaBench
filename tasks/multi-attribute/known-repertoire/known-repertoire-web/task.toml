version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/known-repertoire-web"
theme = "Music: Classical = Love · Adventurousness = Very low"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "classical-music", "adventurousness", "concert-season", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: known-repertoire.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every concert costs the same, seats the same and runs the same length; the alternative genres are ones the persona rates neutral and the novel programmes are by the same performers — so the picks isolate the persona's own taste for classical music and its preference for the familiar over the untried.
[[checks]]
dimension_id = "musg_classical"
dimension_label = "Music: Classical"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_classical=Love"
adherence_signal = "The concerts chosen are classical (symphony orchestra, chamber ensemble, piano recital) rather than the equally good indie, afrobeats and electronic nights the season pushes. Ground truth is each item's data-orchestral attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
value = "Very low"
evaluator = "rule-based"
evaluator_name = "big5_adventurousness=Very low"
adherence_signal = "The programmes chosen are the well-known ones (famous symphonies, best-known quartets, the favourites, greatest hits) rather than the premiere, improvised and surprise programmes the season pushes. Ground truth is each item's data-familiar attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
