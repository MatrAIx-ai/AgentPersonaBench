version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/known-repertoire-chat"
theme = "Music: Classical = Love · Adventurousness = Very low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "concert_hall_box_office"
tags = [ "persona-adherence", "multi-check", "classical-music", "adventurousness", "concert-season", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: known-repertoire.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every concert costs the same, seats the same and runs the same length; the alternative genres are ones the persona rates neutral and the novel programmes are by the same performers — so the picks isolate the persona's own taste for classical music and its preference for the familiar over the untried.
[[checks]]
dimension_id = "musg_classical"
dimension_label = "Music: Classical"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_classical=Love"
adherence_signal = "The concerts chosen are classical (symphony orchestra, chamber ensemble, piano recital) rather than the equally good indie, afrobeats and electronic nights the season pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
value = "Very low"
evaluator = "llm-judge"
evaluator_name = "big5_adventurousness=Very low"
adherence_signal = "The programmes chosen are the well-known ones (famous symphonies, best-known quartets, the favourites, greatest hits) rather than the premiere, improvised and surprise programmes the season pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
