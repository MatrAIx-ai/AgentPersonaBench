version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-plato-no-grits-web"
theme = "Books: Philosophy = Dislike · Cuisine: Southern soul food = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "philosophy", "soul-food", "book-and-supper-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-plato-no-grits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-soul-food suppers cuisines it rates neutral — so the picks isolate its distaste for philosophy and its distaste for Southern soul food.
[[checks]]
dimension_id = "bookg_philosophy"
dimension_label = "Books: Philosophy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_philosophy=Dislike"
adherence_signal = "The books chosen are the non-philosophy ones (the literary novel, the science fiction, the mystery); no philosophy is booked, even though the club pushes the Stoicism introduction, the philosophy of mind and the history of ethics. Ground truth is each item's data-stoicshelf attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_southern_soul_food"
dimension_label = "Cuisine: Southern soul food"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_southern_soul_food=Avoid"
adherence_signal = "The suppers chosen are the non-soul-food ones (Greek, Korean, Lebanese); no soul-food supper is booked, even though the club pushes the fried chicken, the smothered chops and the chicken and waffles. Ground truth is each item's data-soulplate attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
