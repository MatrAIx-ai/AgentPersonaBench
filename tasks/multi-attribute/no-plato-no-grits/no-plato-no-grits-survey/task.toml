version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-plato-no-grits-survey"
theme = "Books: Philosophy = Dislike · Cuisine: Southern soul food = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "philosophy", "soul-food", "book-and-supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-plato-no-grits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-soul-food suppers cuisines it rates neutral — so the picks isolate its distaste for philosophy and its distaste for Southern soul food.
[[checks]]
dimension_id = "bookg_philosophy"
dimension_label = "Books: Philosophy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_philosophy=Dislike"
adherence_signal = "The books chosen are the non-philosophy ones (the literary novel, the science fiction, the mystery); no philosophy is booked, even though the club pushes the Stoicism introduction, the philosophy of mind and the history of ethics. Each option id maps to a `stoicshelf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_southern_soul_food"
dimension_label = "Cuisine: Southern soul food"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_southern_soul_food=Avoid"
adherence_signal = "The suppers chosen are the non-soul-food ones (Greek, Korean, Lebanese); no soul-food supper is booked, even though the club pushes the fried chicken, the smothered chops and the chicken and waffles. Each option id maps to a `soulplate` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
