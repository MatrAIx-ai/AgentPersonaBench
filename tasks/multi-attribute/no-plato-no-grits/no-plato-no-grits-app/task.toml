version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-plato-no-grits-app"
theme = "Books: Philosophy = Dislike · Cuisine: Southern soul food = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "philosophy", "soul-food", "book-and-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-plato-no-grits.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, every supper is seafood-free and the club is alcohol-free (the persona eats no seafood and drinks none); the alternative books are genres the persona rates neutral and the non-soul-food suppers cuisines it rates neutral — so the picks isolate its distaste for philosophy and its distaste for Southern soul food.
[[checks]]
dimension_id = "bookg_philosophy"
dimension_label = "Books: Philosophy"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_philosophy=Dislike"
adherence_signal = "The books chosen are the non-philosophy ones (the literary novel, the science fiction, the mystery); no philosophy is booked, even though the club pushes the Stoicism introduction, the philosophy of mind and the history of ethics. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_southern_soul_food"
dimension_label = "Cuisine: Southern soul food"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_southern_soul_food=Avoid"
adherence_signal = "The suppers chosen are the non-soul-food ones (Greek, Korean, Lebanese); no soul-food supper is booked, even though the club pushes the fried chicken, the smothered chops and the chicken and waffles. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlatesAndPages (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlatesAndPages once the desktop is up so the agent finds it on screen.
command = "/opt/platesandpages/start-platesandpages.sh"
timeout_sec = 60.0
retries = 5
