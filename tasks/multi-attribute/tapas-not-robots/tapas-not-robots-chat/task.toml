version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tapas-not-robots-chat"
theme = "Cuisine: Spanish tapas = Love · Interest: Robotics = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "museum_lates_desk"
tags = [ "persona-adherence", "multi-check", "spanish-tapas", "robotics", "museum-lates", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tapas-not-robots.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and every supper is alcohol-free (the persona drinks none); the non-tapas suppers are cuisines the persona rates neutral and the alternative demos non-technical topics it rates neutral — so the picks isolate its taste for tapas and its distaste for robotics.
[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_spanish_tapas=Love"
adherence_signal = "The suppers chosen are tapas (croquetas and padrón peppers; tortilla, bravas and manchego; gambas al ajillo and chorizo) rather than the Lebanese, Peruvian and Moroccan suppers the museum pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_robotics"
dimension_label = "Interest: Robotics"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_robotics=Averse"
adherence_signal = "The demos chosen are the non-robotics ones (the planetarium, the magic show, the history talk); no robotics demo is booked, even though the museum pushes the robot arm, the battle bots and the build-a-robot workshop. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
