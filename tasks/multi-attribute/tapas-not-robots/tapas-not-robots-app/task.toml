version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tapas-not-robots-app"
theme = "Cuisine: Spanish tapas = Love · Interest: Robotics = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "multi-check", "spanish-tapas", "robotics", "museum-lates", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: tapas-not-robots.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Thursday costs the same and every supper is alcohol-free (the persona drinks none); the non-tapas suppers are cuisines the persona rates neutral and the alternative demos non-technical topics it rates neutral — so the picks isolate its taste for tapas and its distaste for robotics.
[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_spanish_tapas=Love"
adherence_signal = "The suppers chosen are tapas (croquetas and padrón peppers; tortilla, bravas and manchego; gambas al ajillo and chorizo) rather than the Lebanese, Peruvian and Moroccan suppers the museum pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_robotics"
dimension_label = "Interest: Robotics"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_robotics=Averse"
adherence_signal = "The demos chosen are the non-robotics ones (the planetarium, the magic show, the history talk); no robotics demo is booked, even though the museum pushes the robot arm, the battle bots and the build-a-robot workshop. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LatesMuseum (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LatesMuseum once the desktop is up so the agent finds it on screen.
command = "/opt/latesmuseum/start-latesmuseum.sh"
timeout_sec = 60.0
retries = 5
