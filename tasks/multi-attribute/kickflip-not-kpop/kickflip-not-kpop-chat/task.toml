version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kickflip-not-kpop-chat"
theme = "Sport: Skateboarding = Play · Music: K-pop = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "community_park_desk"
tags = [ "persona-adherence", "multi-check", "skateboarding", "k-pop", "park-saturdays", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: kickflip-not-kpop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the park is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative acts genres it rates neutral — so the picks isolate its skateboarding and its distaste for K-pop.
[[checks]]
dimension_id = "sport_skateboarding"
dimension_label = "Sport: Skateboarding"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_skateboarding=Play"
adherence_signal = "The sessions chosen are skateboarding (the coached skatepark session, the mini-ramp session, the street-skate clinic) rather than the climbing, table-tennis and basketball sessions the park pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_k_pop"
dimension_label = "Music: K-pop"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_k_pop=Dislike"
adherence_signal = "The acts chosen are the non-K-pop ones (afrobeats, indie, hip-hop); no K-pop act is booked, even though the park pushes the cover-dance crew, the K-pop DJ and the tribute group. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
