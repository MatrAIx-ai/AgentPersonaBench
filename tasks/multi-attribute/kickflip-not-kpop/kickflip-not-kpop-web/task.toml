version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kickflip-not-kpop-web"
theme = "Sport: Skateboarding = Play · Music: K-pop = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "skateboarding", "k-pop", "park-saturdays", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: kickflip-not-kpop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the park is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative acts genres it rates neutral — so the picks isolate its skateboarding and its distaste for K-pop.
[[checks]]
dimension_id = "sport_skateboarding"
dimension_label = "Sport: Skateboarding"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_skateboarding=Play"
adherence_signal = "The sessions chosen are skateboarding (the coached skatepark session, the mini-ramp session, the street-skate clinic) rather than the climbing, table-tennis and basketball sessions the park pushes. Ground truth is each item's data-kickflip attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_k_pop"
dimension_label = "Music: K-pop"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_k_pop=Dislike"
adherence_signal = "The acts chosen are the non-K-pop ones (afrobeats, indie, hip-hop); no K-pop act is booked, even though the park pushes the cover-dance crew, the K-pop DJ and the tribute group. Ground truth is each item's data-kpopstage attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
