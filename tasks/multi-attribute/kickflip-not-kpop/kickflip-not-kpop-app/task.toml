version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kickflip-not-kpop-app"
theme = "Sport: Skateboarding = Play · Music: K-pop = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "skateboarding", "k-pop", "park-saturdays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: kickflip-not-kpop.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and the park is alcohol-free (the persona drinks none); the alternative sessions are sports the persona rates neutral and the alternative acts genres it rates neutral — so the picks isolate its skateboarding and its distaste for K-pop.
[[checks]]
dimension_id = "sport_skateboarding"
dimension_label = "Sport: Skateboarding"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_skateboarding=Play"
adherence_signal = "The sessions chosen are skateboarding (the coached skatepark session, the mini-ramp session, the street-skate clinic) rather than the climbing, table-tennis and basketball sessions the park pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_k_pop"
dimension_label = "Music: K-pop"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_k_pop=Dislike"
adherence_signal = "The acts chosen are the non-K-pop ones (afrobeats, indie, hip-hop); no K-pop act is booked, even though the park pushes the cover-dance crew, the K-pop DJ and the tribute group. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysPark (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysPark once the desktop is up so the agent finds it on screen.
command = "/opt/saturdayspark/start-saturdayspark.sh"
timeout_sec = 60.0
retries = 5
