version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/synths-not-sagas-survey"
theme = "Music: Synthwave = Love · Interest: Tabletop RPGs = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "synthwave", "tabletop-rpgs", "games-cafe", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: synths-not-sagas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every booking costs the same and every table seats the same number; the alternative soundtracks are genres the persona rates neutral and the non-RPG tables are just as sociable — so the picks isolate its taste for synthwave and its distaste for tabletop role-playing.
[[checks]]
dimension_id = "musg_synthwave"
dimension_label = "Music: Synthwave"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_synthwave=Love"
adherence_signal = "The soundtracks chosen are synthwave (synthwave night, retro-synth set, outrun playlist) rather than the K-pop, Latin and techno nights the café pushes. Each option id maps to a `synth` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_tabletop_rpgs"
dimension_label = "Interest: Tabletop RPGs"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_tabletop_rpgs=Averse"
adherence_signal = "The tables chosen are the non-RPG tables (board games, jigsaw and puzzles, quiz); no role-playing table is booked, even though the café pushes the one-shot, the campaign night and the RPG intro. Each option id maps to a `rpgtable` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
