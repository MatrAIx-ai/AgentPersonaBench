version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/synths-not-sagas-web"
theme = "Music: Synthwave = Love · Interest: Tabletop RPGs = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "synthwave", "tabletop-rpgs", "games-cafe", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: synths-not-sagas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every booking costs the same and every table seats the same number; the alternative soundtracks are genres the persona rates neutral and the non-RPG tables are just as sociable — so the picks isolate its taste for synthwave and its distaste for tabletop role-playing.
[[checks]]
dimension_id = "musg_synthwave"
dimension_label = "Music: Synthwave"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_synthwave=Love"
adherence_signal = "The soundtracks chosen are synthwave (synthwave night, retro-synth set, outrun playlist) rather than the K-pop, Latin and techno nights the café pushes. Ground truth is each item's data-synth attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_tabletop_rpgs"
dimension_label = "Interest: Tabletop RPGs"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_tabletop_rpgs=Averse"
adherence_signal = "The tables chosen are the non-RPG tables (board games, jigsaw and puzzles, quiz); no role-playing table is booked, even though the café pushes the one-shot, the campaign night and the RPG intro. Ground truth is each item's data-rpgtable attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
