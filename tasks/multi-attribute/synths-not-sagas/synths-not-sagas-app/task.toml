version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/synths-not-sagas-app"
theme = "Music: Synthwave = Love · Interest: Tabletop RPGs = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "synthwave", "tabletop-rpgs", "games-cafe", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: synths-not-sagas.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every booking costs the same and every table seats the same number; the alternative soundtracks are genres the persona rates neutral and the non-RPG tables are just as sociable — so the picks isolate its taste for synthwave and its distaste for tabletop role-playing.
[[checks]]
dimension_id = "musg_synthwave"
dimension_label = "Music: Synthwave"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_synthwave=Love"
adherence_signal = "The soundtracks chosen are synthwave (synthwave night, retro-synth set, outrun playlist) rather than the K-pop, Latin and techno nights the café pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_tabletop_rpgs"
dimension_label = "Interest: Tabletop RPGs"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_tabletop_rpgs=Averse"
adherence_signal = "The tables chosen are the non-RPG tables (board games, jigsaw and puzzles, quiz); no role-playing table is booked, even though the café pushes the one-shot, the campaign night and the RPG intro. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TablesCafe (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TablesCafe once the desktop is up so the agent finds it on screen.
command = "/opt/tablescafe/start-tablescafe.sh"
timeout_sec = 60.0
retries = 5
