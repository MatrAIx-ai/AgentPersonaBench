version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/whodunits-not-romances-app"
theme = "Film: Mystery = Love · Books: Romance = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "multi-check", "mystery-films", "romance-books", "book-and-film-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: whodunits-not-romances.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same; the alternative screenings are genres the persona rates neutral (no crime or superhero film, which it dislikes, and no comedy, which it rates highly) and the non-romance novels are genres it rates neutral (its dislike of mystery novels is a different dimension: every mystery here is a screening); the mystery side comes with the small screen in the back room and the alternatives with the big screen in the main lounge, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its taste for mystery films and its distaste for romance novels.
[[checks]]
dimension_id = "filmg_mystery"
dimension_label = "Film: Mystery"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_mystery=Love"
adherence_signal = "The screenings chosen are mysteries (whodunit, missing-person mystery, country-house mystery) rather than the sci-fi feature, war film and animated feature the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_romance"
dimension_label = "Books: Romance"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_romance=Dislike"
adherence_signal = "The novels chosen are the non-romance picks (graphic novel, essay collection, travel-writing collection); no romance is booked, even though the club pushes the second-chance romance, the small-town romance and the historical romance. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenAndPage (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenAndPage once the desktop is up so the agent finds it on screen.
command = "/opt/screenandpage/start-screenandpage.sh"
timeout_sec = 60.0
retries = 5
