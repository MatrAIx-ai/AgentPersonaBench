version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/philosophy-not-drama-chat"
theme = "Subject: Philosophy = Passionate · Subject: Drama = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "learning"
application_id = "learning_centre_monday_desk"
tags = [ "persona-adherence", "multi-check", "philosophy", "drama", "learning-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: philosophy-not-drama.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Monday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the philosophy side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of philosophy and its distaste for drama.
[[checks]]
dimension_id = "acad_philosophy"
dimension_label = "Subject: Philosophy"
category = "Learning: Academic"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "acad_philosophy=Passionate"
adherence_signal = "The lectures chosen are philosophy (Stoicism, free will, ethics in a dilemma) rather than the biology, economics and astronomy lectures the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "acad_drama"
dimension_label = "Subject: Drama"
category = "Learning: Academic"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "acad_drama=Averse"
adherence_signal = "The workshops chosen are the non-drama ones (creative writing, visual art, logic); no drama workshop is booked, even though the centre pushes Shakespeare's villains, staging a scene and improvisation. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
