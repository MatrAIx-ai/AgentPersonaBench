version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/philosophy-not-drama-web"
theme = "Subject: Philosophy = Passionate · Subject: Drama = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "philosophy", "drama", "learning-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: philosophy-not-drama.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Monday costs the same and both halves are the same length; the alternative lectures and workshops are subjects the persona rates neutral; the philosophy side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its love of philosophy and its distaste for drama.
[[checks]]
dimension_id = "acad_philosophy"
dimension_label = "Subject: Philosophy"
category = "Learning: Academic"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "acad_philosophy=Passionate"
adherence_signal = "The lectures chosen are philosophy (Stoicism, free will, ethics in a dilemma) rather than the biology, economics and astronomy lectures the centre pushes. Ground truth is each item's data-socratic attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "acad_drama"
dimension_label = "Subject: Drama"
category = "Learning: Academic"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "acad_drama=Averse"
adherence_signal = "The workshops chosen are the non-drama ones (creative writing, visual art, logic); no drama workshop is booked, even though the centre pushes Shakespeare's villains, staging a scene and improvisation. Ground truth is each item's data-stagehour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
