version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/punchlines-not-posses-app"
theme = "Hobby: Stand-up comedy = Active · Film: Western = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "stand-up-comedy", "western-films", "arts-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: punchlines-not-posses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same and both halves are the same length; the alternative early slots are crafts the persona rates neutral and the alternative screenings genres it rates neutral — so the picks isolate its stand-up and its distaste for westerns.
[[checks]]
dimension_id = "hob_stand_up_comedy"
dimension_label = "Hobby: Stand-up comedy"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_stand_up_comedy=Active"
adherence_signal = "The early slots chosen are stand-up (open-mic spot, stand-up writing workshop, new-material night) rather than the pottery, life-drawing and origami slots the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_western"
dimension_label = "Film: Western"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_western=Dislike"
adherence_signal = "The screenings chosen are the non-westerns (sci-fi feature, superhero film, historical drama); no western is booked, even though the centre pushes the spaghetti western, the frontier western and the modern western. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EarlyAndLate (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EarlyAndLate once the desktop is up so the agent finds it on screen.
command = "/opt/earlyandlate/start-earlyandlate.sh"
timeout_sec = 60.0
retries = 5
