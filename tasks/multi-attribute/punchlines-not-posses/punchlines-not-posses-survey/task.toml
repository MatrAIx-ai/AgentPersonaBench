version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/punchlines-not-posses-survey"
theme = "Hobby: Stand-up comedy = Active · Film: Western = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "stand-up-comedy", "western-films", "arts-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: punchlines-not-posses.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pass costs the same and both halves are the same length; the alternative early slots are crafts the persona rates neutral and the alternative screenings genres it rates neutral — so the picks isolate its stand-up and its distaste for westerns.
[[checks]]
dimension_id = "hob_stand_up_comedy"
dimension_label = "Hobby: Stand-up comedy"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_stand_up_comedy=Active"
adherence_signal = "The early slots chosen are stand-up (open-mic spot, stand-up writing workshop, new-material night) rather than the pottery, life-drawing and origami slots the centre pushes. Each option id maps to a `openmic` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_western"
dimension_label = "Film: Western"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_western=Dislike"
adherence_signal = "The screenings chosen are the non-westerns (sci-fi feature, superhero film, historical drama); no western is booked, even though the centre pushes the spaghetti western, the frontier western and the modern western. Each option id maps to a `western` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
