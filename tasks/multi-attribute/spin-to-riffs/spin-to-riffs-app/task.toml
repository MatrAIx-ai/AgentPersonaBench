version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-to-riffs-app"
theme = "Sport: Cycling = Play · Music: Rock = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "cycling", "rock-music", "studio-classes", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-to-riffs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every class costs the same credit, runs the same length and is coached; the alternative classes are just as hard and the alternative playlists just as energetic — so the picks isolate the persona's own cycling and its taste for rock.
[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_cycling=Play"
adherence_signal = "The classes chosen are indoor cycling (spin sprint, hill climb, endurance ride) rather than the equally hard rowing, circuits and step classes the studio pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_rock=Love"
adherence_signal = "The playlists chosen are rock (rock playlist, classic-rock anthems, stadium-rock set) rather than the equally energetic pop, Latin and hip-hop playlists the studio pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClassCredits (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClassCredits once the desktop is up so the agent finds it on screen.
command = "/opt/classcredits/start-classcredits.sh"
timeout_sec = 60.0
retries = 5
