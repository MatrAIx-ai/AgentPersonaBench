version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-to-riffs-chat"
theme = "Sport: Cycling = Play · Music: Rock = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "fitness_studio_desk"
tags = [ "persona-adherence", "multi-check", "cycling", "rock-music", "studio-classes", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-to-riffs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every class costs the same credit, runs the same length and is coached; the alternative classes are just as hard and the alternative playlists just as energetic — so the picks isolate the persona's own cycling and its taste for rock.
[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Play"
evaluator = "llm-judge"
evaluator_name = "sport_cycling=Play"
adherence_signal = "The classes chosen are indoor cycling (spin sprint, hill climb, endurance ride) rather than the equally hard rowing, circuits and step classes the studio pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_rock=Love"
adherence_signal = "The playlists chosen are rock (rock playlist, classic-rock anthems, stadium-rock set) rather than the equally energetic pop, Latin and hip-hop playlists the studio pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
