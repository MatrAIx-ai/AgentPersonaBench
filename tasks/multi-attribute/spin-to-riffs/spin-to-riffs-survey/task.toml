version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-to-riffs-survey"
theme = "Sport: Cycling = Play · Music: Rock = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "cycling", "rock-music", "studio-classes", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-to-riffs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every class costs the same credit, runs the same length and is coached; the alternative classes are just as hard and the alternative playlists just as energetic — so the picks isolate the persona's own cycling and its taste for rock.
[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_cycling=Play"
adherence_signal = "The classes chosen are indoor cycling (spin sprint, hill climb, endurance ride) rather than the equally hard rowing, circuits and step classes the studio pushes. Each option id maps to a `saddle` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_rock=Love"
adherence_signal = "The playlists chosen are rock (rock playlist, classic-rock anthems, stadium-rock set) rather than the equally energetic pop, Latin and hip-hop playlists the studio pushes. Each option id maps to a `riff` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
