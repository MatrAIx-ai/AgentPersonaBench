version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spin-to-riffs-web"
theme = "Sport: Cycling = Play · Music: Rock = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "fitness"
tags = [ "persona-adherence", "multi-check", "cycling", "rock-music", "studio-classes", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: spin-to-riffs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every class costs the same credit, runs the same length and is coached; the alternative classes are just as hard and the alternative playlists just as energetic — so the picks isolate the persona's own cycling and its taste for rock.
[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_cycling=Play"
adherence_signal = "The classes chosen are indoor cycling (spin sprint, hill climb, endurance ride) rather than the equally hard rowing, circuits and step classes the studio pushes. Ground truth is each item's data-saddle attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_rock=Love"
adherence_signal = "The playlists chosen are rock (rock playlist, classic-rock anthems, stadium-rock set) rather than the equally energetic pop, Latin and hip-hop playlists the studio pushes. Ground truth is each item's data-riff attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
