version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/arias-not-ascents-survey"
theme = "Music: Opera = Love · Interest: Hiking = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "opera", "hiking", "city-break", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: arias-not-ascents.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the alternative evenings are genres the persona rates neutral, and the alternative days are just as outdoor (the persona leans outdoors, so that cannot choose) but are cruises, markets and gardens rather than hikes — so the picks isolate its taste for opera and its distaste for hiking.
[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_opera=Love"
adherence_signal = "The evenings chosen are opera (a gala at the opera house, a full-length opera, an open-air opera night) rather than the K-pop, jazz and reggae nights the operator pushes. Each option id maps to a `aria` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_hiking"
dimension_label = "Interest: Hiking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_hiking=Averse"
adherence_signal = "The days chosen are the non-hike outings (harbour cruise, open-air market, botanical garden); no hike is booked, even though the operator pushes the ridge hike, the waterfall hike and the summit day. Each option id maps to a `hikeday` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
