version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/arias-not-ascents-app"
theme = "Music: Opera = Love · Interest: Hiking = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "opera", "hiking", "city-break", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: arias-not-ascents.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the alternative evenings are genres the persona rates neutral, and the alternative days are just as outdoor (the persona leans outdoors, so that cannot choose) but are cruises, markets and gardens rather than hikes — so the picks isolate its taste for opera and its distaste for hiking.
[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_opera=Love"
adherence_signal = "The evenings chosen are opera (a gala at the opera house, a full-length opera, an open-air opera night) rather than the K-pop, jazz and reggae nights the operator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_hiking"
dimension_label = "Interest: Hiking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_hiking=Averse"
adherence_signal = "The days chosen are the non-hike outings (harbour cruise, open-air market, botanical garden); no hike is booked, even though the operator pushes the ridge hike, the waterfall hike and the summit day. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DaysBreak (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DaysBreak once the desktop is up so the agent finds it on screen.
command = "/opt/daysbreak/start-daysbreak.sh"
timeout_sec = 60.0
retries = 5
