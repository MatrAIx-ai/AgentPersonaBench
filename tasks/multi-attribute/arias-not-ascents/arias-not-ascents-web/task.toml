version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/arias-not-ascents-web"
theme = "Music: Opera = Love · Interest: Hiking = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "opera", "hiking", "city-break", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: arias-not-ascents.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same and both halves are the same length; the alternative evenings are genres the persona rates neutral, and the alternative days are just as outdoor (the persona leans outdoors, so that cannot choose) but are cruises, markets and gardens rather than hikes — so the picks isolate its taste for opera and its distaste for hiking.
[[checks]]
dimension_id = "musg_opera"
dimension_label = "Music: Opera"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_opera=Love"
adherence_signal = "The evenings chosen are opera (a gala at the opera house, a full-length opera, an open-air opera night) rather than the K-pop, jazz and reggae nights the operator pushes. Ground truth is each item's data-aria attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_hiking"
dimension_label = "Interest: Hiking"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_hiking=Averse"
adherence_signal = "The days chosen are the non-hike outings (harbour cruise, open-air market, botanical garden); no hike is booked, even though the operator pushes the ridge hike, the waterfall hike and the summit day. Ground truth is each item's data-hikeday attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
