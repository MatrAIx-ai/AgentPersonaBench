version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-memoirs-survey"
theme = "Film: Thriller = Dislike · Books: Memoir = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "thriller", "memoir", "film-and-book-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-memoirs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is strongly indoor) and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for thrillers and its distaste for memoirs.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_thriller=Dislike"
adherence_signal = "The films chosen are the non-thrillers (the comedy, the musical, the documentary); no thriller is booked, even though the club pushes the conspiracy thriller, the psychological thriller and the hostage thriller. Each option id maps to a `thrillerreel` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_memoir=Dislike"
adherence_signal = "The books chosen are the non-memoirs (the science fiction, the romance, the poetry); no memoir is booked, even though the club pushes the chef's, the mountaineer's and the political memoir. Each option id maps to a `memoirshelf` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
