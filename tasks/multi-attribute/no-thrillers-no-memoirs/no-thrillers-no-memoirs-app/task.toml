version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-memoirs-app"
theme = "Film: Thriller = Dislike · Books: Memoir = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "thriller", "memoir", "film-and-book-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-memoirs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is strongly indoor) and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for thrillers and its distaste for memoirs.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_thriller=Dislike"
adherence_signal = "The films chosen are the non-thrillers (the comedy, the musical, the documentary); no thriller is booked, even though the club pushes the conspiracy thriller, the psychological thriller and the hostage thriller. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_memoir=Dislike"
adherence_signal = "The books chosen are the non-memoirs (the science fiction, the romance, the poetry); no memoir is booked, even though the club pushes the chef's, the mountaineer's and the political memoir. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ReadAndReel (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ReadAndReel once the desktop is up so the agent finds it on screen.
command = "/opt/readandreel/start-readandreel.sh"
timeout_sec = 60.0
retries = 5
