version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-memoirs-web"
theme = "Film: Thriller = Dislike · Books: Memoir = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "entertainment"
tags = [ "persona-adherence", "multi-check", "thriller", "memoir", "film-and-book-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-memoirs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is strongly indoor) and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for thrillers and its distaste for memoirs.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_thriller=Dislike"
adherence_signal = "The films chosen are the non-thrillers (the comedy, the musical, the documentary); no thriller is booked, even though the club pushes the conspiracy thriller, the psychological thriller and the hostage thriller. Ground truth is each item's data-thrillerreel attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "bookg_memoir=Dislike"
adherence_signal = "The books chosen are the non-memoirs (the science fiction, the romance, the poetry); no memoir is booked, even though the club pushes the chef's, the mountaineer's and the political memoir. Ground truth is each item's data-memoirshelf attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
