version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-thrillers-no-memoirs-chat"
theme = "Film: Thriller = Dislike · Books: Memoir = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "entertainment"
application_id = "reel_read_club_host"
tags = [ "persona-adherence", "multi-check", "thriller", "memoir", "film-and-book-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: no-thrillers-no-memoirs.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same, everything is indoors (the persona is strongly indoor) and the club is alcohol-free (the persona drinks none); the alternative films are genres the persona rates neutral and the alternative books genres it rates neutral — so the picks isolate its distaste for thrillers and its distaste for memoirs.
[[checks]]
dimension_id = "filmg_thriller"
dimension_label = "Film: Thriller"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_thriller=Dislike"
adherence_signal = "The films chosen are the non-thrillers (the comedy, the musical, the documentary); no thriller is booked, even though the club pushes the conspiracy thriller, the psychological thriller and the hostage thriller. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "bookg_memoir=Dislike"
adherence_signal = "The books chosen are the non-memoirs (the science fiction, the romance, the poetry); no memoir is booked, even though the club pushes the chef's, the mountaineer's and the political memoir. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
