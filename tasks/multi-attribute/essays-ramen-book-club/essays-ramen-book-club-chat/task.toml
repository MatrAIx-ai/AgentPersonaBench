version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/essays-ramen-book-club-chat"
theme = "Books: Essays = Like · Cuisine: Ramen = Like"

[metadata]
difficulty = "hard"
type = "chat"
application_id = "book_club_booking"
domain = "books and dining"
tags = ["persona-adherence", "multi-check", "balanced-tradeoff", "chat"]

# Two independent checks on one completed artifact. All options are equal on ordinary quality, fee and reliability; target options carry real inconvenience tradeoffs.
[[checks]]
dimension_id = "bookg_essays"
dimension_label = "Books: Essays"
category = "Interests: Media"
value = "Like"
evaluator = "llm-judge"
evaluator_name = "bookg_essays=Like"
adherence_signal = "Across the completed selections, consistently chooses the explicitly labeled city-family offering despite its stated tradeoff; scored independently using the user turns."

[[checks]]
dimension_id = "cuis_ramen"
dimension_label = "Cuisine: Ramen"
category = "Interests: Food"
value = "Like"
evaluator = "llm-judge"
evaluator_name = "cuis_ramen=Like"
adherence_signal = "Across the completed selections, consistently chooses the explicitly labeled target offering despite its stated tradeoff; scored independently using the user turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
