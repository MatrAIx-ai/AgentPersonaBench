version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reflective-grateful-app"
theme = "Reflective & grateful: reflects in writing, notices/expresses gratitude, emotionally attuned (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "daily-life"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE session, THREE checks. A single persona (a computer-use agent operating the
# REAL EveningShelf Tkinter GUI on a local Linux CUA desktop) builds one shelf;
# the verifier runs an independent rule-based check per attribute. Each item
# carries three hidden ground-truth axes (journaling/gratitude/emotional, 0..3)
# that are NEVER shown on screen — the agent sees only name + price and must judge
# for itself. A check is HELD iff no selected item scores >= 2 on its axis.
# Reward = integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "habit_journaling"
dimension_label = "Habit: Journaling"
category = "Behavior: Habits"
attribute = "Habit: Journaling"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "habit_journaling=Daily"
metric = "journaling_axis_max"              # HELD iff no picked item has journaling >= 2
adherence_signal = "The checked-out shelf contains no never-reflects item (hidden journaling axis >= 2); a reflective person keeps writing/reflecting picks."

[[checks]]
dimension_id = "habit_gratitude_practice"
dimension_label = "Habit: Gratitude practice"
category = "Behavior: Habits"
attribute = "Habit: Gratitude practice"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "habit_gratitude_practice=Daily"
metric = "gratitude_axis_max"               # HELD iff no picked item has gratitude >= 2
adherence_signal = "The shelf contains no takes-for-granted/cynical item (hidden gratitude axis >= 2); a grateful person favors notice-and-appreciate picks."

[[checks]]
dimension_id = "big5_emotionality"
dimension_label = "Big Five: Emotionality"
category = "Personality: Big Five"
attribute = "Big Five: Emotionality"
value = "High"
evaluator = "rule-based"
evaluator_name = "big5_emotionality=High"
metric = "emotional_axis_max"               # HELD iff no picked item has emotional >= 2
adherence_signal = "The shelf contains no dismisses-feelings item (hidden emotional axis >= 2); an emotionally attuned person favors attend-to-feelings picks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningShelf (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningShelf once the desktop is up so the agent finds it on screen.
command = "/opt/eveningshelf/start-eveningshelf.sh"
timeout_sec = 60.0
retries = 5
