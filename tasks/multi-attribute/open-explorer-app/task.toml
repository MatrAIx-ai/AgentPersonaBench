version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/open-explorer-app"
theme = "Open explorer: recognition · self-direction · hedonism"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE free-time planning session, THREE checks. A single persona (a computer-use
# agent operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop)
# builds one set of weekend plans; the verifier runs an independent rule-based
# check per attribute. Each plan carries three hidden ground-truth axes
# (recog/self/hedon, 0..3, tier 0 EMBODIES the value, tier 3 its OPPOSITE) that are
# NEVER shown on screen — the agent sees only name + price and must judge for
# itself. A check is HELD iff no selected plan scores >= 2 on its axis. Reward =
# integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "val_recognition"
dimension_label = "Value: Recognition"
category = "Values & Motivation"
attribute = "Value: Recognition"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_recognition=Core value"
metric = "recog_axis_max"                     # HELD iff no picked plan has recog >= 2
adherence_signal = "The checked-out plans contain no stay-anonymous item (hidden recog axis >= 2); a person for whom recognition is a core value seeks to be seen, credited, and acknowledged."

[[checks]]
dimension_id = "schwartz_value_self_direction"
dimension_label = "Schwartz Self-Direction"
category = "Values & Motivation"
attribute = "Schwartz Self-Direction"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_self_direction=High"
metric = "self_axis_max"                      # HELD iff no picked plan has self >= 2
adherence_signal = "The plans contain no follow-others/prescribed item (hidden self axis >= 2); a self-directed person does it their own way rather than deferring to what others plan."

[[checks]]
dimension_id = "schwartz_value_hedonism"
dimension_label = "Schwartz Hedonism"
category = "Values & Motivation"
attribute = "Schwartz Hedonism"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_hedonism=High"
metric = "hedon_axis_max"                     # HELD iff no picked plan has hedon >= 2
adherence_signal = "The plans contain no self-denying/all-duty item (hidden hedon axis >= 2); a hedonic person indulges and prioritizes enjoyment over restraint."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
