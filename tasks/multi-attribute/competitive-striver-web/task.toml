version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/competitive-striver-web"
theme = "Competitive striver: competitiveness · relatedness · achievement"

[metadata]
difficulty = "medium"
type = "web"
domain = "professional"
tags = [ "persona-adherence", "multi-check", "competitive-striver", "rule-based", "playwright", "real-web",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE opportunity-board task, THREE checks. A single persona carrying three
# competitive-striver values commits to 3 opportunities on a live board
# (Playwright); the verifier runs an independent rule-based check per axis,
# reading each card's hidden data-ax1/2/3 tier off index.html (ground truth, NOT
# shown to the chooser). This amortizes one generation across three attributes.
# Reward = integer score (one point per check HELD, 0..3). Each axis: HELD iff no
# picked card is high-tier (axis >= 2).
[[checks]]
dimension_id = "trait_competitiveness"
attribute = "Character: Competitiveness"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_competitiveness=Strong"
# Ground truth: each card's hidden data-ax1 (0 plays to win .. 3 avoids competing) in index.html.
adherence_signal = "Board built from play-to-win options (data-ax1 0-1); no non-competitive pick (>= 2)."

[[checks]]
dimension_id = "sdt_need_relatedness"
attribute = "SDT Relatedness Need"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "sdt_need_relatedness=Very high"
# Ground truth: each card's hidden data-ax2 (0 seeks connection / stays with the group .. 3 detaches / goes it alone).
adherence_signal = "Board favors stay-connected options (data-ax2 0-1); no detached / goes-it-alone pick (>= 2)."

[[checks]]
dimension_id = "schwartz_value_achievement"
attribute = "Schwartz Achievement"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_achievement=High"
# Ground truth: each card's hidden data-ax3 (0 success matters .. 3 accomplishment is irrelevant).
adherence_signal = "Board favors success-matters options (data-ax3 0-1); no achievement-indifferent pick (>= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
