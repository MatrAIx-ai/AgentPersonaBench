version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crowd-and-quest-web"
theme = "Social battery = Strong extrovert · Film: Adventure = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "social-battery", "adventure-films", "watch-parties", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crowd-and-quest.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event is free with membership and the same length; the one-person formats are just as convenient and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own appetite for a crowd and its taste for adventure films.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
value = "Strong extrovert"
evaluator = "rule-based"
evaluator_name = "lstyle_social_battery=Strong extrovert"
adherence_signal = "The formats chosen are the big shared ones (40-person watch party, cinema-room screening, rooftop watch-along) rather than the private-stream, watch-alone and booth formats the club pushes. Ground truth is each item's data-party attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_adventure"
dimension_label = "Film: Adventure"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_adventure=Love"
adherence_signal = "The films chosen are adventure epics (jungle expedition, mountain rescue, treasure hunt) rather than the equally well-reviewed thriller, sci-fi and documentary the club pushes. Ground truth is each item's data-quest attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
