version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crowd-and-quest-survey"
theme = "Social battery = Strong extrovert · Film: Adventure = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "social-battery", "adventure-films", "watch-parties", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crowd-and-quest.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event is free with membership and the same length; the one-person formats are just as convenient and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own appetite for a crowd and its taste for adventure films.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
value = "Strong extrovert"
evaluator = "rule-based"
evaluator_name = "lstyle_social_battery=Strong extrovert"
adherence_signal = "The formats chosen are the big shared ones (40-person watch party, cinema-room screening, rooftop watch-along) rather than the private-stream, watch-alone and booth formats the club pushes. Each option id maps to a `party` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_adventure"
dimension_label = "Film: Adventure"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_adventure=Love"
adherence_signal = "The films chosen are adventure epics (jungle expedition, mountain rescue, treasure hunt) rather than the equally well-reviewed thriller, sci-fi and documentary the club pushes. Each option id maps to a `quest` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
