version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/crowd-and-quest-app"
theme = "Social battery = Strong extrovert · Film: Adventure = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "social-battery", "adventure-films", "watch-parties", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: crowd-and-quest.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every event is free with membership and the same length; the one-person formats are just as convenient and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own appetite for a crowd and its taste for adventure films.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
value = "Strong extrovert"
evaluator = "rule-based"
evaluator_name = "lstyle_social_battery=Strong extrovert"
adherence_signal = "The formats chosen are the big shared ones (40-person watch party, cinema-room screening, rooftop watch-along) rather than the private-stream, watch-alone and booth formats the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_adventure"
dimension_label = "Film: Adventure"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_adventure=Love"
adherence_signal = "The films chosen are adventure epics (jungle expedition, mountain rescue, treasure hunt) rather than the equally well-reviewed thriller, sci-fi and documentary the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WatchClub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WatchClub once the desktop is up so the agent finds it on screen.
command = "/opt/watchclub/start-watchclub.sh"
timeout_sec = 60.0
retries = 5
