version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pages-not-reels-app"
theme = "Books: Popular science = Love · Film: Documentary = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "multi-check", "popular-science", "documentaries", "science-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pages-not-reels.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative authors are genres the persona rates neutral and the feature films are genres it rates neutral; the science side comes with the far marquee, standing room only and the alternatives with the main hall, reserved seats up front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its taste for popular-science books and its distaste for documentaries, two separate things: a reader can devour science books and still not want to sit through a documentary.
[[checks]]
dimension_id = "bookg_popular_science"
dimension_label = "Books: Popular science"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_popular_science=Love"
adherence_signal = "The author events chosen are popular science (a physicist on time, a marine biologist on the deep sea, a neuroscientist on memory) rather than the memoir, travel and essay authors the festival pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_documentary=Dislike"
adherence_signal = "The screenings chosen are the feature films (musical feature, animated feature, western); no documentary is booked, even though the festival pushes the nature, space and scientist documentaries. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningsFestival (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningsFestival once the desktop is up so the agent finds it on screen.
command = "/opt/eveningsfestival/start-eveningsfestival.sh"
timeout_sec = 60.0
retries = 5
