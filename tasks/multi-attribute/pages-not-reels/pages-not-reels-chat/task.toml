version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pages-not-reels-chat"
theme = "Books: Popular science = Love · Film: Documentary = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "science_festival_box_office"
tags = [ "persona-adherence", "multi-check", "popular-science", "documentaries", "science-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pages-not-reels.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative authors are genres the persona rates neutral and the feature films are genres it rates neutral; the science side comes with the far marquee, standing room only and the alternatives with the main hall, reserved seats up front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its taste for popular-science books and its distaste for documentaries, two separate things: a reader can devour science books and still not want to sit through a documentary.
[[checks]]
dimension_id = "bookg_popular_science"
dimension_label = "Books: Popular science"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_popular_science=Love"
adherence_signal = "The author events chosen are popular science (a physicist on time, a marine biologist on the deep sea, a neuroscientist on memory) rather than the memoir, travel and essay authors the festival pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "filmg_documentary=Dislike"
adherence_signal = "The screenings chosen are the feature films (musical feature, animated feature, western); no documentary is booked, even though the festival pushes the nature, space and scientist documentaries. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
