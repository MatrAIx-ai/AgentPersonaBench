version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pages-not-reels-survey"
theme = "Books: Popular science = Love · Film: Documentary = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "multi-check", "popular-science", "documentaries", "science-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: pages-not-reels.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and both halves are the same length; the alternative authors are genres the persona rates neutral and the feature films are genres it rates neutral; the science side comes with the far marquee, standing room only and the alternatives with the main hall, reserved seats up front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its taste for popular-science books and its distaste for documentaries, two separate things: a reader can devour science books and still not want to sit through a documentary.
[[checks]]
dimension_id = "bookg_popular_science"
dimension_label = "Books: Popular science"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_popular_science=Love"
adherence_signal = "The author events chosen are popular science (a physicist on time, a marine biologist on the deep sea, a neuroscientist on memory) rather than the memoir, travel and essay authors the festival pushes. Each option id maps to a `popsci` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_documentary"
dimension_label = "Film: Documentary"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "filmg_documentary=Dislike"
adherence_signal = "The screenings chosen are the feature films (musical feature, animated feature, western); no documentary is booked, even though the festival pushes the nature, space and scientist documentaries. Each option id maps to a `docfilm` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
