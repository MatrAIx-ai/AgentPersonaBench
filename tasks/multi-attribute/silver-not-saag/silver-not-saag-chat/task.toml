version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/silver-not-saag-chat"
theme = "Hobby: Jewelry making = Active · Cuisine: Indian = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "craft_and_lunch_desk"
tags = [ "persona-adherence", "multi-check", "jewelry-making", "indian-cuisine", "craft-and-lunch", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: silver-not-saag.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every lunch is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the non-Indian lunches cuisines it rates neutral — so the picks isolate its jewellery making and its distaste for Indian food.
[[checks]]
dimension_id = "hob_jewelry_making"
dimension_label = "Hobby: Jewelry making"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_jewelry_making=Active"
adherence_signal = "The workshops chosen are jewellery (silver ring, wire-wrapped pendant, loom-beaded bracelet) rather than the pottery, candle and woodturning workshops the scheme pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_indian=Avoid"
adherence_signal = "The lunches chosen are the non-Indian ones (Italian, Thai, Turkish); no Indian lunch is booked, even though the scheme pushes the thali, the dosa lunch and the biryani. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
