version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/silver-not-saag-web"
theme = "Hobby: Jewelry making = Active · Cuisine: Indian = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "jewelry-making", "indian-cuisine", "craft-and-lunch", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: silver-not-saag.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every lunch is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the non-Indian lunches cuisines it rates neutral — so the picks isolate its jewellery making and its distaste for Indian food.
[[checks]]
dimension_id = "hob_jewelry_making"
dimension_label = "Hobby: Jewelry making"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_jewelry_making=Active"
adherence_signal = "The workshops chosen are jewellery (silver ring, wire-wrapped pendant, loom-beaded bracelet) rather than the pottery, candle and woodturning workshops the scheme pushes. Ground truth is each item's data-silverwork attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_indian=Avoid"
adherence_signal = "The lunches chosen are the non-Indian ones (Italian, Thai, Turkish); no Indian lunch is booked, even though the scheme pushes the thali, the dosa lunch and the biryani. Ground truth is each item's data-indianlunch attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
