version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/silver-not-saag-survey"
theme = "Hobby: Jewelry making = Active · Cuisine: Indian = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "jewelry-making", "indian-cuisine", "craft-and-lunch", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: silver-not-saag.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every lunch is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the non-Indian lunches cuisines it rates neutral — so the picks isolate its jewellery making and its distaste for Indian food.
[[checks]]
dimension_id = "hob_jewelry_making"
dimension_label = "Hobby: Jewelry making"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_jewelry_making=Active"
adherence_signal = "The workshops chosen are jewellery (silver ring, wire-wrapped pendant, loom-beaded bracelet) rather than the pottery, candle and woodturning workshops the scheme pushes. Each option id maps to a `silverwork` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_indian=Avoid"
adherence_signal = "The lunches chosen are the non-Indian ones (Italian, Thai, Turkish); no Indian lunch is booked, even though the scheme pushes the thali, the dosa lunch and the biryani. Each option id maps to a `indianlunch` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
