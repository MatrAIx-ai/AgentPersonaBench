version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/silver-not-saag-app"
theme = "Hobby: Jewelry making = Active · Cuisine: Indian = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "jewelry-making", "indian-cuisine", "craft-and-lunch", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: silver-not-saag.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and every lunch is alcohol-free (the persona drinks none); the alternative workshops are crafts the persona rates neutral and the non-Indian lunches cuisines it rates neutral — so the picks isolate its jewellery making and its distaste for Indian food.
[[checks]]
dimension_id = "hob_jewelry_making"
dimension_label = "Hobby: Jewelry making"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_jewelry_making=Active"
adherence_signal = "The workshops chosen are jewellery (silver ring, wire-wrapped pendant, loom-beaded bracelet) rather than the pottery, candle and woodturning workshops the scheme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_indian=Avoid"
adherence_signal = "The lunches chosen are the non-Indian ones (Italian, Thai, Turkish); no Indian lunch is booked, even though the scheme pushes the thali, the dosa lunch and the biryani. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LunchAndCraft (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LunchAndCraft once the desktop is up so the agent finds it on screen.
command = "/opt/lunchandcraft/start-lunchandcraft.sh"
timeout_sec = 60.0
retries = 5
