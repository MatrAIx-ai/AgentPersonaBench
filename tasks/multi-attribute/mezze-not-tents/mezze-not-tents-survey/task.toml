version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mezze-not-tents-survey"
theme = "Cuisine: Lebanese = Love · Interest: Camping = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "lebanese-cuisine", "camping", "weekend-packages", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: mezze-not-tents.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every package includes the same full day outdoors (the persona strongly prefers the outdoors, so that cannot choose between them), and every dinner is alcohol-free; the alternative dinners are cuisines the persona rates neutral and the indoor beds are as comfortable as each other — so the picks isolate its taste for Lebanese food and its distaste for camping.
[[checks]]
dimension_id = "cuis_lebanese"
dimension_label = "Cuisine: Lebanese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_lebanese=Love"
adherence_signal = "The dinners chosen are Lebanese (mezze table, chicken shawarma, lamb kofta) rather than the Italian, Thai and Moroccan dinners the operator pushes. Each option id maps to a `mezze` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_camping"
dimension_label = "Interest: Camping"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_camping=Averse"
adherence_signal = "The nights chosen are indoors (guesthouse, hotel, cabin); no camping night is booked, even though the operator pushes the campsite pitch, the wild camp and the beach bivvy. Each option id maps to a `canvas` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
