version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mezze-not-tents-web"
theme = "Cuisine: Lebanese = Love · Interest: Camping = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "lebanese-cuisine", "camping", "weekend-packages", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: mezze-not-tents.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every package includes the same full day outdoors (the persona strongly prefers the outdoors, so that cannot choose between them), and every dinner is alcohol-free; the alternative dinners are cuisines the persona rates neutral and the indoor beds are as comfortable as each other — so the picks isolate its taste for Lebanese food and its distaste for camping.
[[checks]]
dimension_id = "cuis_lebanese"
dimension_label = "Cuisine: Lebanese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_lebanese=Love"
adherence_signal = "The dinners chosen are Lebanese (mezze table, chicken shawarma, lamb kofta) rather than the Italian, Thai and Moroccan dinners the operator pushes. Ground truth is each item's data-mezze attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_camping"
dimension_label = "Interest: Camping"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_camping=Averse"
adherence_signal = "The nights chosen are indoors (guesthouse, hotel, cabin); no camping night is booked, even though the operator pushes the campsite pitch, the wild camp and the beach bivvy. Ground truth is each item's data-canvas attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
