version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mezze-not-tents-app"
theme = "Cuisine: Lebanese = Love · Interest: Camping = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "multi-check", "lebanese-cuisine", "camping", "weekend-packages", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: mezze-not-tents.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every package includes the same full day outdoors (the persona strongly prefers the outdoors, so that cannot choose between them), and every dinner is alcohol-free; the alternative dinners are cuisines the persona rates neutral and the indoor beds are as comfortable as each other — so the picks isolate its taste for Lebanese food and its distaste for camping.
[[checks]]
dimension_id = "cuis_lebanese"
dimension_label = "Cuisine: Lebanese"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_lebanese=Love"
adherence_signal = "The dinners chosen are Lebanese (mezze table, chicken shawarma, lamb kofta) rather than the Italian, Thai and Moroccan dinners the operator pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_camping"
dimension_label = "Interest: Camping"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_camping=Averse"
adherence_signal = "The nights chosen are indoors (guesthouse, hotel, cabin); no camping night is booked, even though the operator pushes the campsite pitch, the wild camp and the beach bivvy. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with AwayWeekend (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch AwayWeekend once the desktop is up so the agent finds it on screen.
command = "/opt/awayweekend/start-awayweekend.sh"
timeout_sec = 60.0
retries = 5
