version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/culture-outdoor-luxe-web"
theme = "Vacation style: Culture \u00b7 Indoor vs outdoor: Outdoor-leaning \u00b7 Economic motivation: Premium-seeking"

[metadata]
difficulty = "hard"
type = "web"
domain = "travel"
tags = ["persona-adherence", "multi-attribute", "culture-outdoor-luxe", "rule-based", "real-web"]

[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
anchor_value = "Culture"
evaluator = "rule-based"
adherence_signal = "Chooses cultural content as the trip's primary purpose."

[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
anchor_value = "Outdoor-leaning"
evaluator = "rule-based"
adherence_signal = "Chooses an open-air setting over an enclosed setting when content, effort, and conditions are equal."

[[checks]]
dimension_id = "economic_motivation"
dimension_label = "Economic motivation"
category = "Values & Motivation"
anchor_value = "Premium-seeking"
evaluator = "rule-based"
adherence_signal = "Chooses a materially premium service tier despite a stated surcharge."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
