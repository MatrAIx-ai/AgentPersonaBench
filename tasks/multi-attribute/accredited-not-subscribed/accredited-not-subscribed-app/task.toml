version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/accredited-not-subscribed-app"
theme = "Attitude: Higher education = Enthusiast · Attitude: Subscription services = Opposed"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "learning"
tags = [ "persona-adherence", "multi-check", "higher-education", "subscription-services", "evening-courses", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: accredited-not-subscribed.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course costs the same in total, runs the same hours and covers a practical subject outside the persona's rated interests; the accredited modules spread the same hours over two terms and end in an exam while the workshop series finish in one term with none, and the one-off fee is payable in full up front while the monthly plan spreads it, so a chooser with no stake in either trait takes the workshop series on the monthly plan — so the picks isolate the persona's enthusiasm for higher education and its distaste for subscriptions.
[[checks]]
dimension_id = "att_higher_education"
dimension_label = "Attitude: Higher education"
category = "Worldview: Beliefs"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_higher_education=Enthusiast"
adherence_signal = "The courses chosen are the university-accredited modules that carry credits rather than the independent workshop series the catalogue pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "att_subscription_services"
dimension_label = "Attitude: Subscription services"
category = "Worldview: Beliefs"
value = "Opposed"
evaluator = "rule-based"
evaluator_name = "att_subscription_services=Opposed"
adherence_signal = "The courses chosen are the one-off-fee ones; no rolling subscription is booked, even though the catalogue pushes the monthly plan. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CourseTermThree (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CourseTermThree once the desktop is up so the agent finds it on screen.
command = "/opt/coursetermthree/start-coursetermthree.sh"
timeout_sec = 60.0
retries = 5
