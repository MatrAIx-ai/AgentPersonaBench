version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ai-skeptic-dev-survey"
theme = "AI-skeptic developer: wary of AI coding tools · verifies AI output · keeps AI suggest-only"

[metadata]
difficulty = "medium"
type = "survey"
domain = "developer-tools"
tags = [ "persona-adherence", "multi-check", "rule-based", "choice-based",]

# --- Multi-attribute SURVEY task ---------------------------------------------- #
# ONE persona, ONE questionnaire, THREE independent checks (scored k/3). A single
# AI-skeptic developer persona answers 6 everyday questions about working with AI
# coding tools; the verifier scores each chosen option on THREE hidden axes and
# runs one rule-based check per axis. This amortizes one generation across three
# attributes instead of one task per value.
#
# Survey env: each option carries hidden per-axis tiers in tests/answer_key.yaml
# (sentiment{}, outputtrust{}, autonomy{}). The questionnaire never names AI
# sentiment, output trust, or autonomy preference as traits and never says
# anything is measured — it just asks what the developer would actually do. The
# answer key is host-only (tests/ is not mounted), so the agent can't self-score.
# Reward = integer count of HELD checks (0..3).

[[checks]]
dimension_id = "coding_ai_sentiment"
dimension_label = "Coding AI sentiment"
category = "Developer: AI Adoption"
attribute = "Coding AI sentiment"
value = "Somewhat unfavorable"
evaluator = "rule-based"
evaluator_name = "coding_ai_sentiment=Somewhat unfavorable"
# Anchored to a hidden per-option `sentiment` tier (0 = wary/reluctant about AI
# coding tools .. 3 = enthusiastic all-in adopter).
adherence_signal = "No chosen option is an enthusiastic-adoption tier (sentiment >= 2); tier-0/1 wary/measured picks are AI-skeptical."

[[checks]]
dimension_id = "coding_ai_output_trust"
dimension_label = "Coding AI output trust"
category = "Developer: AI Adoption"
attribute = "Coding AI output trust"
value = "Distrusts until proven"
evaluator = "rule-based"
evaluator_name = "coding_ai_output_trust=Distrusts until proven"
# Anchored to a hidden per-option `outputtrust` tier (0 = verifies/reviews AI
# output before trusting .. 3 = trusts AI output blindly, ships unreviewed).
adherence_signal = "No chosen option is a blind-trust tier (outputtrust >= 2); tier-0/1 verify-before-trusting picks distrust until proven."

[[checks]]
dimension_id = "coding_agent_autonomy_preference"
dimension_label = "Coding agent autonomy preference"
category = "Developer: Agent Adoption"
attribute = "Coding agent autonomy preference"
value = "Suggest-only assistant"
evaluator = "rule-based"
evaluator_name = "coding_agent_autonomy_preference=Suggest-only assistant"
# Anchored to a hidden per-option `autonomy` tier (0 = keeps AI suggest-only /
# manual control .. 3 = lets the AI run fully autonomously).
adherence_signal = "No chosen option is a hand-over-control tier (autonomy >= 2); tier-0/1 suggest-only/manual-control picks keep the AI an assistant."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
