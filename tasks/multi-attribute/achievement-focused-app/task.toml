version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/achievement-focused-app"
theme = "Achievement focused: universalism · career-success · achievement-striving"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "professional"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE session, THREE checks. A single persona (a computer-use agent operating the
# REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds one selection;
# the verifier runs an independent rule-based check per attribute. Each item carries
# three hidden ground-truth axes (universalism/career_success/achievement_striving,
# 0..3) that are NEVER shown on screen — the agent sees only name + price and must
# judge for itself. Tier 0 = embodies the persona's value on that axis, tier 3 = its
# opposite. A check is HELD iff no selected item scores >= 2 on its axis. Reward =
# integer score, one point per axis HELD (0..3).
[[checks]]
dimension_id = "schwartz_value_universalism"
dimension_label = "Schwartz Universalism"
category = "Values & Motivation"
attribute = "Schwartz Universalism"
value = "High"
evaluator = "rule-based"
evaluator_name = "schwartz_value_universalism=High"
metric = "universalism_axis_max"            # HELD iff no picked item has universalism >= 2
adherence_signal = "The saved plan contains no self-serving/exploitative item (hidden universalism axis >= 2); high universalism means protecting the welfare of all people and nature — fairness, equality, the environment."

[[checks]]
dimension_id = "val_career_success"
dimension_label = "Value: Career success"
category = "Values & Motivation"
attribute = "Value: Career success"
value = "Important"
evaluator = "rule-based"
evaluator_name = "val_career_success=Important"
metric = "career_success_axis_max"          # HELD iff no picked item has career_success >= 2
adherence_signal = "The plan contains no career-stalling item (hidden career_success axis >= 2); treating career success as important means favoring professional advancement."

[[checks]]
dimension_id = "big5_achievement_striving"
dimension_label = "Achievement-striving"
category = "Personality: Big Five"
attribute = "Achievement-striving"
value = "High"
evaluator = "rule-based"
evaluator_name = "big5_achievement_striving=High"
metric = "achievement_striving_axis_max"    # HELD iff no picked item has achievement_striving >= 2
adherence_signal = "The plan contains no coasting item (hidden achievement_striving axis >= 2); high achievement-striving means choosing hard, driven effort over minimal effort."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
