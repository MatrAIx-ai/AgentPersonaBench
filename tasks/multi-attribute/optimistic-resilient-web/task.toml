version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/optimistic-resilient-web"
theme = "Optimistic resilient: hope · resilience · achievement (hopeful · bounce-back · goal-driven)"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "multi-check", "optimistic-resilient", "rule-based", "playwright", "real-web",]
# axis mix: hope (data-ax1) · resilience (data-ax2) · achievement value (data-ax3)

# --- Multi-attribute task ----------------------------------------------------- #
# ONE task, THREE checks. A single persona carrying three character strengths picks
# 3 things they'd do this week after a rough patch, on a live page (Playwright); the
# verifier runs an independent rule-based check per axis, reading each card's hidden
# data-* tier off index.html (ground truth, NOT shown to the reader). This amortizes
# one generation across three attributes. Reward = integer score (one point per
# check HELD, 0..3). Each axis: HELD iff no picked card is high-tier (axis >= 2).
[[checks]]
dimension_id = "trait_hope_optimism"
attribute = "Character: Hope / optimism"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_hope_optimism=Strong"
# Ground truth: each card's hidden data-ax1 (0 hopeful/looks-forward .. 3 pessimistic) in index.html.
adherence_signal = "Picks are hopeful, bright-side choices (data-ax1 0-1); no pessimistic pick (>= 2)."

[[checks]]
dimension_id = "trait_resilience"
attribute = "Character: Resilience"
value = "Strong"
evaluator = "rule-based"
evaluator_name = "trait_resilience=Strong"
# Ground truth: each card's hidden data-ax2 (0 bounce-back/keep-going .. 3 give-up/quit).
adherence_signal = "Picks are bounce-back, keep-going choices (data-ax2 0-1); no give-up pick (>= 2)."

[[checks]]
dimension_id = "val_achievement"
attribute = "Value: Achievement"
value = "Important"
evaluator = "rule-based"
evaluator_name = "val_achievement=Important"
# Ground truth: each card's hidden data-ax3 (0 goal-driven/wants a result .. 3 indifferent to accomplishing).
adherence_signal = "Picks are goal-driven, results-focused choices (data-ax3 0-1); no achievement-indifferent pick (>= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
