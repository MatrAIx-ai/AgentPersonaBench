version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strikes-not-synths-web"
theme = "Sport: Bowling = Play · Music: Electronic = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "bowling", "electronic", "leisure-complex", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: strikes-not-synths.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its bowling and its distaste for electronic music.
[[checks]]
dimension_id = "sport_bowling"
dimension_label = "Sport: Bowling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_bowling=Play"
adherence_signal = "The slots chosen are bowling (the league night, the coached session, the tournament) rather than the table-tennis, badminton and darts slots the complex pushes. Ground truth is each item's data-tenpin attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_electronic=Dislike"
adherence_signal = "The nights chosen are the non-electronic ones (blues, funk, gospel); no electronic night is booked, even though the complex pushes the electronic DJ, the live-electronics act and the synth-pop night. Ground truth is each item's data-synthnight attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
