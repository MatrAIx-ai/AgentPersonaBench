version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strikes-not-synths-app"
theme = "Sport: Bowling = Play · Music: Electronic = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "bowling", "electronic", "leisure-complex", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: strikes-not-synths.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its bowling and its distaste for electronic music.
[[checks]]
dimension_id = "sport_bowling"
dimension_label = "Sport: Bowling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_bowling=Play"
adherence_signal = "The slots chosen are bowling (the league night, the coached session, the tournament) rather than the table-tennis, badminton and darts slots the complex pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_electronic=Dislike"
adherence_signal = "The nights chosen are the non-electronic ones (blues, funk, gospel); no electronic night is booked, even though the complex pushes the electronic DJ, the live-electronics act and the synth-pop night. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LateAndLanes (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LateAndLanes once the desktop is up so the agent finds it on screen.
command = "/opt/lateandlanes/start-lateandlanes.sh"
timeout_sec = 60.0
retries = 5
