version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strikes-not-synths-survey"
theme = "Sport: Bowling = Play · Music: Electronic = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "bowling", "electronic", "leisure-complex", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: strikes-not-synths.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Friday costs the same and kit is provided; the alternative slots are sports the persona rates neutral and the alternative nights genres it rates neutral — so the picks isolate its bowling and its distaste for electronic music.
[[checks]]
dimension_id = "sport_bowling"
dimension_label = "Sport: Bowling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_bowling=Play"
adherence_signal = "The slots chosen are bowling (the league night, the coached session, the tournament) rather than the table-tennis, badminton and darts slots the complex pushes. Each option id maps to a `tenpin` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_electronic=Dislike"
adherence_signal = "The nights chosen are the non-electronic ones (blues, funk, gospel); no electronic night is booked, even though the complex pushes the electronic DJ, the live-electronics act and the synth-pop night. Each option id maps to a `synthnight` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
