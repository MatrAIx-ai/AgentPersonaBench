version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrillers-not-tagines-survey"
theme = "Books: Thriller = Love · Cuisine: Moroccan = Avoid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "thriller", "moroccan-cuisine", "book-and-supper-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: thrillers-not-tagines.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-Moroccan suppers cuisines it rates neutral — so the picks isolate its taste for thrillers and its distaste for Moroccan food.
[[checks]]
dimension_id = "bookg_thriller"
dimension_label = "Books: Thriller"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_thriller=Love"
adherence_signal = "The books chosen are thrillers (the spy thriller, the legal thriller, the psychological thriller) rather than the literary, memoir and fantasy picks the club pushes. Each option id maps to a `pageturner` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "cuis_moroccan"
dimension_label = "Cuisine: Moroccan"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_moroccan=Avoid"
adherence_signal = "The suppers chosen are the non-Moroccan ones (Greek, Korean, Lebanese); no Moroccan supper is booked, even though the club pushes the tagine, the pastilla and the couscous. Each option id maps to a `tagine` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
