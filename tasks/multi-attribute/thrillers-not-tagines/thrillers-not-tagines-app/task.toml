version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrillers-not-tagines-app"
theme = "Books: Thriller = Love · Cuisine: Moroccan = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "reading"
tags = [ "persona-adherence", "multi-check", "thriller", "moroccan-cuisine", "book-and-supper-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: thrillers-not-tagines.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-Moroccan suppers cuisines it rates neutral — so the picks isolate its taste for thrillers and its distaste for Moroccan food.
[[checks]]
dimension_id = "bookg_thriller"
dimension_label = "Books: Thriller"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_thriller=Love"
adherence_signal = "The books chosen are thrillers (the spy thriller, the legal thriller, the psychological thriller) rather than the literary, memoir and fantasy picks the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_moroccan"
dimension_label = "Cuisine: Moroccan"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_moroccan=Avoid"
adherence_signal = "The suppers chosen are the non-Moroccan ones (Greek, Korean, Lebanese); no Moroccan supper is booked, even though the club pushes the tagine, the pastilla and the couscous. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperAndChapter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperAndChapter once the desktop is up so the agent finds it on screen.
command = "/opt/supperandchapter/start-supperandchapter.sh"
timeout_sec = 60.0
retries = 5
