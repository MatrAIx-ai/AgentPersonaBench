version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrillers-not-tagines-chat"
theme = "Books: Thriller = Love · Cuisine: Moroccan = Avoid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "reading"
application_id = "book_supper_club_secretary"
tags = [ "persona-adherence", "multi-check", "thriller", "moroccan-cuisine", "book-and-supper-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: thrillers-not-tagines.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every evening costs the same and the club is alcohol-free (the persona drinks none); the alternative books are genres the persona rates neutral and the non-Moroccan suppers cuisines it rates neutral — so the picks isolate its taste for thrillers and its distaste for Moroccan food.
[[checks]]
dimension_id = "bookg_thriller"
dimension_label = "Books: Thriller"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "bookg_thriller=Love"
adherence_signal = "The books chosen are thrillers (the spy thriller, the legal thriller, the psychological thriller) rather than the literary, memoir and fantasy picks the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "cuis_moroccan"
dimension_label = "Cuisine: Moroccan"
category = "Interests: Food"
value = "Avoid"
evaluator = "llm-judge"
evaluator_name = "cuis_moroccan=Avoid"
adherence_signal = "The suppers chosen are the non-Moroccan ones (Greek, Korean, Lebanese); no Moroccan supper is booked, even though the club pushes the tagine, the pastilla and the couscous. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
