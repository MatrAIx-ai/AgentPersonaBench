version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sleights-not-shares-web"
theme = "Interest: Magic tricks = Passionate · Interest: Investing = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "magic-tricks", "investing", "community-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sleights-not-shares.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative activities are ones the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its appetite for magic and its distaste for investing.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_magic_tricks=Passionate"
adherence_signal = "The activities chosen are magic (close-up workshop, card-sleight class, stage-illusion build) rather than the pottery, board-games and quiz activities the centre pushes. Ground truth is each item's data-sleight attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_investing"
dimension_label = "Interest: Investing"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_investing=Averse"
adherence_signal = "The talks chosen are the non-investing talks (local history, astronomy, phone photography); no investing talk is booked, even though the centre pushes the index-funds talk, the stock-picking evening and the property-versus-pensions talk. Ground truth is each item's data-portfolio attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
