version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sleights-not-shares-app"
theme = "Interest: Magic tricks = Passionate · Interest: Investing = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "magic-tricks", "investing", "community-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sleights-not-shares.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative activities are ones the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its appetite for magic and its distaste for investing.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_magic_tricks=Passionate"
adherence_signal = "The activities chosen are magic (close-up workshop, card-sleight class, stage-illusion build) rather than the pottery, board-games and quiz activities the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_investing"
dimension_label = "Interest: Investing"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_investing=Averse"
adherence_signal = "The talks chosen are the non-investing talks (local history, astronomy, phone photography); no investing talk is booked, even though the centre pushes the index-funds talk, the stock-picking evening and the property-versus-pensions talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EveningsCentre (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EveningsCentre once the desktop is up so the agent finds it on screen.
command = "/opt/eveningscentre/start-eveningscentre.sh"
timeout_sec = 60.0
retries = 5
