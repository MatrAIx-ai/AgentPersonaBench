version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sleights-not-shares-survey"
theme = "Interest: Magic tricks = Passionate · Interest: Investing = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "magic-tricks", "investing", "community-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sleights-not-shares.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative activities are ones the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its appetite for magic and its distaste for investing.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_magic_tricks=Passionate"
adherence_signal = "The activities chosen are magic (close-up workshop, card-sleight class, stage-illusion build) rather than the pottery, board-games and quiz activities the centre pushes. Each option id maps to a `sleight` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_investing"
dimension_label = "Interest: Investing"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_investing=Averse"
adherence_signal = "The talks chosen are the non-investing talks (local history, astronomy, phone photography); no investing talk is booked, even though the centre pushes the index-funds talk, the stock-picking evening and the property-versus-pensions talk. Each option id maps to a `portfolio` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
