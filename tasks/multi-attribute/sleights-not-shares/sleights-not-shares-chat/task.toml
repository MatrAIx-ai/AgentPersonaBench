version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sleights-not-shares-chat"
theme = "Interest: Magic tricks = Passionate · Interest: Investing = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "community_centre_programme"
tags = [ "persona-adherence", "multi-check", "magic-tricks", "investing", "community-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: sleights-not-shares.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative activities are ones the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its appetite for magic and its distaste for investing.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_magic_tricks=Passionate"
adherence_signal = "The activities chosen are magic (close-up workshop, card-sleight class, stage-illusion build) rather than the pottery, board-games and quiz activities the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_investing"
dimension_label = "Interest: Investing"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_investing=Averse"
adherence_signal = "The talks chosen are the non-investing talks (local history, astronomy, phone photography); no investing talk is booked, even though the centre pushes the index-funds talk, the stock-picking evening and the property-versus-pensions talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
