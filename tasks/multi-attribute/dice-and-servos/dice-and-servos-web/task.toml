version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dice-and-servos-web"
theme = "Interest: Tabletop RPGs = Passionate · Interest: Robotics = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "tabletop-rpgs", "robotics", "maker-weekend", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dice-and-servos.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative tables are just as sociable and the alternative workshops (3D printing, drones, laser cutting) are maker topics the persona rates neutral — so the picks isolate its appetite for tabletop role-playing and for robotics.
[[checks]]
dimension_id = "topic_tabletop_rpgs"
dimension_label = "Interest: Tabletop RPGs"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_tabletop_rpgs=Passionate"
adherence_signal = "The evening tables chosen are tabletop RPG tables (one-shot adventure, campaign opener, game-master's intro) rather than the board-game, trivia and puzzle-room tables the space pushes. Ground truth is each item's data-dice attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_robotics"
dimension_label = "Interest: Robotics"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_robotics=Passionate"
adherence_signal = "The workshops chosen are robotics workshops (robot-arm build, line-following robot, servo-and-sensor lab) rather than the 3D-printing, drone and laser-cutting workshops the space pushes. Ground truth is each item's data-servo attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
