version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dice-and-servos-app"
theme = "Interest: Tabletop RPGs = Passionate · Interest: Robotics = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "tabletop-rpgs", "robotics", "maker-weekend", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dice-and-servos.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative tables are just as sociable and the alternative workshops (3D printing, drones, laser cutting) are maker topics the persona rates neutral — so the picks isolate its appetite for tabletop role-playing and for robotics.
[[checks]]
dimension_id = "topic_tabletop_rpgs"
dimension_label = "Interest: Tabletop RPGs"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_tabletop_rpgs=Passionate"
adherence_signal = "The evening tables chosen are tabletop RPG tables (one-shot adventure, campaign opener, game-master's intro) rather than the board-game, trivia and puzzle-room tables the space pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_robotics"
dimension_label = "Interest: Robotics"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_robotics=Passionate"
adherence_signal = "The workshops chosen are robotics workshops (robot-arm build, line-following robot, servo-and-sensor lab) rather than the 3D-printing, drone and laser-cutting workshops the space pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekendMaker (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekendMaker once the desktop is up so the agent finds it on screen.
command = "/opt/weekendmaker/start-weekendmaker.sh"
timeout_sec = 60.0
retries = 5
