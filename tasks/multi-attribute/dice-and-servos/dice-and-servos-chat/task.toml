version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dice-and-servos-chat"
theme = "Interest: Tabletop RPGs = Passionate · Interest: Robotics = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "maker_space_desk"
tags = [ "persona-adherence", "multi-check", "tabletop-rpgs", "robotics", "maker-weekend", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: dice-and-servos.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every pair costs the same and both halves are the same length; the alternative tables are just as sociable and the alternative workshops (3D printing, drones, laser cutting) are maker topics the persona rates neutral — so the picks isolate its appetite for tabletop role-playing and for robotics.
[[checks]]
dimension_id = "topic_tabletop_rpgs"
dimension_label = "Interest: Tabletop RPGs"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_tabletop_rpgs=Passionate"
adherence_signal = "The evening tables chosen are tabletop RPG tables (one-shot adventure, campaign opener, game-master's intro) rather than the board-game, trivia and puzzle-room tables the space pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_robotics"
dimension_label = "Interest: Robotics"
category = "Interests: Topics"
value = "Passionate"
evaluator = "llm-judge"
evaluator_name = "topic_robotics=Passionate"
adherence_signal = "The workshops chosen are robotics workshops (robot-arm build, line-following robot, servo-and-sensor lab) rather than the 3D-printing, drone and laser-cutting workshops the space pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
