version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/trap-not-trees-app"
theme = "Music: Trap = Love · Interest: Genealogy = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "trap", "genealogy", "saturday-card", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: trap-not-trees.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative nights are genres the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for trap and its distaste for family-history research.
[[checks]]
dimension_id = "musg_trap"
dimension_label = "Music: Trap"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_trap=Love"
adherence_signal = "The nights chosen are trap (trap night, trap showcase, trap DJ set) rather than the pop, rock and afrobeats nights the card pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_genealogy"
dimension_label = "Interest: Genealogy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_genealogy=Averse"
adherence_signal = "The afternoons chosen are the non-genealogy ones (chess, photography walk, languages taster); no family-history session is booked, even though the card pushes the family-history clinic, the DNA-results reading and the parish-records workshop. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CardSaturday (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CardSaturday once the desktop is up so the agent finds it on screen.
command = "/opt/cardsaturday/start-cardsaturday.sh"
timeout_sec = 60.0
retries = 5
