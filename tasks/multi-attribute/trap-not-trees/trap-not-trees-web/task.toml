version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/trap-not-trees-web"
theme = "Music: Trap = Love · Interest: Genealogy = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "trap", "genealogy", "saturday-card", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: trap-not-trees.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same, both halves are the same length, and every venue is alcohol-free (the persona drinks none, so that cannot choose); the alternative nights are genres the persona rates neutral and the alternative afternoons topics it rates neutral — so the picks isolate its taste for trap and its distaste for family-history research.
[[checks]]
dimension_id = "musg_trap"
dimension_label = "Music: Trap"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_trap=Love"
adherence_signal = "The nights chosen are trap (trap night, trap showcase, trap DJ set) rather than the pop, rock and afrobeats nights the card pushes. Ground truth is each item's data-trapnight attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_genealogy"
dimension_label = "Interest: Genealogy"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_genealogy=Averse"
adherence_signal = "The afternoons chosen are the non-genealogy ones (chess, photography walk, languages taster); no family-history session is booked, even though the card pushes the family-history clinic, the DNA-results reading and the parish-records workshop. Ground truth is each item's data-familytree attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
