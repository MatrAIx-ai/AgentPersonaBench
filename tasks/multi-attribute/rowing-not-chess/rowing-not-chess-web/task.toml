version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rowing-not-chess-web"
theme = "Sport: Rowing = Follow · Interest: Chess = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "rowing", "chess", "sports-and-social-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rowing-not-chess.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, both halves are the same length and the clubhouse is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the rowing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its rowing fandom and its distaste for chess.
[[checks]]
dimension_id = "sport_rowing"
dimension_label = "Sport: Rowing"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_rowing=Follow"
adherence_signal = "The outings chosen are rowing (the boat race, the regatta finals, the world rowing screening) rather than the tennis, swimming and volleyball outings the club pushes. Ground truth is each item's data-riverbank attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_chess"
dimension_label = "Interest: Chess"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_chess=Averse"
adherence_signal = "The sessions chosen are the non-chess ones (magic, photography, quiz); no chess session is booked, even though the club pushes the club night, the blitz tournament and the endgame masterclass. Ground truth is each item's data-checkmatehour attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
