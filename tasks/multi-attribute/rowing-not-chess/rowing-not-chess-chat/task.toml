version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rowing-not-chess-chat"
theme = "Sport: Rowing = Follow · Interest: Chess = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "club_regatta_desk"
tags = [ "persona-adherence", "multi-check", "rowing", "chess", "sports-and-social-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rowing-not-chess.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same, both halves are the same length and the clubhouse is alcohol-free (the persona drinks none); the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the rowing side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its rowing fandom and its distaste for chess.
[[checks]]
dimension_id = "sport_rowing"
dimension_label = "Sport: Rowing"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_rowing=Follow"
adherence_signal = "The outings chosen are rowing (the boat race, the regatta finals, the world rowing screening) rather than the tennis, swimming and volleyball outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_chess"
dimension_label = "Interest: Chess"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_chess=Averse"
adherence_signal = "The sessions chosen are the non-chess ones (magic, photography, quiz); no chess session is booked, even though the club pushes the club night, the blitz tournament and the endgame masterclass. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
