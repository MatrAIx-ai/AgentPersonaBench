version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/squash-and-weightlifting-web"
theme = "Sport: Squash = Follow · Sport: Weightlifting = Follow"

[metadata]
difficulty = "medium"
type = "web"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "squash", "weightlifting", "sports-hall", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: squash-and-weightlifting.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every double-header costs the same and both sessions are the same length with tickets and transport included; the alternative afternoons and evenings are sports the persona rates neutral; the squash side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives; the weightlifting side comes with general admission, queue from an hour before and the alternatives with fast-track entry, straight in with no queue, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its squash fandom and its weightlifting fandom.
[[checks]]
dimension_id = "sport_squash"
dimension_label = "Sport: Squash"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_squash=Follow"
adherence_signal = "The afternoon sessions chosen are squash (the glass-court open, the national final from the gallery, the pro exhibition) rather than the badminton, table-tennis and tennis afternoons the hall pushes. Ground truth is each item's data-glasscourt attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "sport_weightlifting"
dimension_label = "Sport: Weightlifting"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_weightlifting=Follow"
adherence_signal = "The evening sessions chosen are weightlifting (the national championships, the world championships clean-and-jerk screening, the junior lifting meet) rather than the CrossFit, rowing and triathlon evenings the hall pushes. Ground truth is each item's data-platform attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
