version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frugal-budgeter-app"
theme = "Frugal budgeter: cost-sensitive shopping, tracks the budget, money-as-a-means not for status (three checks)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "personal-finance"
tags = [ "persona-adherence", "multi-check", "os-app", "computer-use", "rule-based",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE shopping session, THREE checks. A single persona (a computer-use agent
# operating the REAL SmartCart Tkinter GUI on a local Linux CUA desktop) builds
# one cart; the verifier runs an independent rule-based check per attribute. Each
# product carries three hidden ground-truth axes (cost/tracking/wealthmod, 0..3)
# that are NEVER shown on screen — the agent sees only name + price + description
# and must judge value for itself. The three axes are DISTINCT and decorrelated:
# how PRICEY an item is (cost), whether it reflects TRACKING/reviewing the budget
# (tracking), and whether it is a STATUS/wealth-signaling buy (wealthmod). A check
# is HELD iff no selected item scores >= 2 on its axis. Reward = integer score,
# one point per axis HELD (0..3).
[[checks]]
dimension_id = "economic_motivation"
dimension_label = "Economic motivation"
category = "Values & Motivation"
attribute = "Economic motivation"
value = "Cost-sensitive"
evaluator = "rule-based"
evaluator_name = "economic_motivation=Cost-sensitive"
metric = "cost_axis_max"                    # HELD iff no picked item has cost >= 2
adherence_signal = "The checked-out cart contains no splurge item (hidden cost axis >= 2); a cost-sensitive shopper sticks to budget/value picks."

[[checks]]
dimension_id = "habit_budget_tracking"
dimension_label = "Habit: Budget tracking"
category = "Behavior: Habits"
attribute = "Budget-tracking habit"
value = "Weekly"
evaluator = "rule-based"
evaluator_name = "habit_budget_tracking=Weekly"
metric = "tracking_axis_max"                # HELD iff no picked item has tracking >= 2
adherence_signal = "The cart contains no ignore-the-budget item (hidden tracking axis >= 2); a regular budget-tracker favors check-first / budget-aware picks."

[[checks]]
dimension_id = "val_wealth"
dimension_label = "Value: Wealth"
category = "Values & Motivation"
attribute = "Value: Wealth"
value = "Moderate"
evaluator = "rule-based"
evaluator_name = "val_wealth=Moderate"
metric = "wealthmod_axis_max"               # HELD iff no picked item has wealthmod >= 2
adherence_signal = "The cart contains no status-spending item (hidden wealthmod axis >= 2); someone who holds wealth as a moderate value buys for real needs, not to signal status."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
