version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chess-not-checkin-survey"
theme = "Interest: Chess = Passionate · Interest: Travel = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "chess", "travel", "library-saturdays", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: chess-not-checkin.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, both halves are the same length and everything is indoors (the persona is strongly indoor); the alternative club hours are topics the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its chess and its distaste for travel.
[[checks]]
dimension_id = "topic_chess"
dimension_label = "Interest: Chess"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_chess=Passionate"
adherence_signal = "The club hours chosen are chess (the club afternoon, the blitz tournament, the endgame masterclass) rather than the history-book, film-club and sketching hours the library pushes. Each option id maps to a `checkmate` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "topic_travel"
dimension_label = "Interest: Travel"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_travel=Averse"
adherence_signal = "The talks chosen are the non-travel ones (night sky, local history, magic); no travel talk is booked, even though the library pushes the backpacking talk, the rail-journeys talk and the round-the-world talk. Each option id maps to a `passport` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
