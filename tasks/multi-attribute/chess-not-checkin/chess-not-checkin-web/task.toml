version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chess-not-checkin-web"
theme = "Interest: Chess = Passionate · Interest: Travel = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "chess", "travel", "library-saturdays", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: chess-not-checkin.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, both halves are the same length and everything is indoors (the persona is strongly indoor); the alternative club hours are topics the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its chess and its distaste for travel.
[[checks]]
dimension_id = "topic_chess"
dimension_label = "Interest: Chess"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_chess=Passionate"
adherence_signal = "The club hours chosen are chess (the club afternoon, the blitz tournament, the endgame masterclass) rather than the history-book, film-club and sketching hours the library pushes. Ground truth is each item's data-checkmate attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_travel"
dimension_label = "Interest: Travel"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_travel=Averse"
adherence_signal = "The talks chosen are the non-travel ones (night sky, local history, magic); no travel talk is booked, even though the library pushes the backpacking talk, the rail-journeys talk and the round-the-world talk. Ground truth is each item's data-passport attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
