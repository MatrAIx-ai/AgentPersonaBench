version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chess-not-checkin-app"
theme = "Interest: Chess = Passionate · Interest: Travel = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "chess", "travel", "library-saturdays", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: chess-not-checkin.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same, both halves are the same length and everything is indoors (the persona is strongly indoor); the alternative club hours are topics the persona rates neutral and the alternative talks topics it rates neutral — so the picks isolate its chess and its distaste for travel.
[[checks]]
dimension_id = "topic_chess"
dimension_label = "Interest: Chess"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_chess=Passionate"
adherence_signal = "The club hours chosen are chess (the club afternoon, the blitz tournament, the endgame masterclass) rather than the history-book, film-club and sketching hours the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_travel"
dimension_label = "Interest: Travel"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_travel=Averse"
adherence_signal = "The talks chosen are the non-travel ones (night sky, local history, magic); no travel talk is booked, even though the library pushes the backpacking talk, the rail-journeys talk and the round-the-world talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SaturdaysReadingRoom (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SaturdaysReadingRoom once the desktop is up so the agent finds it on screen.
command = "/opt/saturdaysreadingroom/start-saturdaysreadingroom.sh"
timeout_sec = 60.0
retries = 5
