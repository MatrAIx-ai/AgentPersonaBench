version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taverna-strings-web"
theme = "Cuisine: Greek = Love · Music: Folk = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "greek-cuisine", "folk-music", "supper-nights", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: taverna-strings.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is seated, alcohol-free and pork-free; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Greek food and for folk music independently.
[[checks]]
dimension_id = "cuis_greek"
dimension_label = "Cuisine: Greek"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_greek=Love"
adherence_signal = "The suppers chosen are Greek (kleftiko, souvlaki, spanakopita) rather than the equally good parmigiana, green curry and tikka plates the centre pushes. Ground truth is each item's data-taverna attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_folk"
dimension_label = "Music: Folk"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_folk=Love"
adherence_signal = "The bands chosen are folk (fiddle-and-accordion trio, ballad singer, folk-harp duo) rather than the equally good jazz, Latin and rock acts the centre pushes. Ground truth is each item's data-folkband attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
