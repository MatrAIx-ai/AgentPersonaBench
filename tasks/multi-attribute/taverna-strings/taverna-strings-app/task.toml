version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taverna-strings-app"
theme = "Cuisine: Greek = Love · Music: Folk = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "greek-cuisine", "folk-music", "supper-nights", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: taverna-strings.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is seated, alcohol-free and pork-free; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Greek food and for folk music independently.
[[checks]]
dimension_id = "cuis_greek"
dimension_label = "Cuisine: Greek"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_greek=Love"
adherence_signal = "The suppers chosen are Greek (kleftiko, souvlaki, spanakopita) rather than the equally good parmigiana, green curry and tikka plates the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_folk"
dimension_label = "Music: Folk"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "musg_folk=Love"
adherence_signal = "The bands chosen are folk (fiddle-and-accordion trio, ballad singer, folk-harp duo) rather than the equally good jazz, Latin and rock acts the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperSeason (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperSeason once the desktop is up so the agent finds it on screen.
command = "/opt/supperseason/start-supperseason.sh"
timeout_sec = 60.0
retries = 5
