version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taverna-strings-chat"
theme = "Cuisine: Greek = Love · Music: Folk = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "cultural_centre_desk"
tags = [ "persona-adherence", "multi-check", "greek-cuisine", "folk-music", "supper-nights", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: taverna-strings.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every night costs the same, is seated, alcohol-free and pork-free; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Greek food and for folk music independently.
[[checks]]
dimension_id = "cuis_greek"
dimension_label = "Cuisine: Greek"
category = "Interests: Food"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "cuis_greek=Love"
adherence_signal = "The suppers chosen are Greek (kleftiko, souvlaki, spanakopita) rather than the equally good parmigiana, green curry and tikka plates the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_folk"
dimension_label = "Music: Folk"
category = "Interests: Media"
value = "Love"
evaluator = "llm-judge"
evaluator_name = "musg_folk=Love"
adherence_signal = "The bands chosen are folk (fiddle-and-accordion trio, ballad singer, folk-harp duo) rather than the equally good jazz, Latin and rock acts the centre pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
