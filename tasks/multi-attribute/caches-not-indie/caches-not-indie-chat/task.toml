version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/caches-not-indie-chat"
theme = "Hobby: Geocaching = Avid · Music: Indie = Dislike"

[metadata]
difficulty = "medium"
type = "chat"
domain = "hobbies"
application_id = "outdoors_club_desk"
tags = [ "persona-adherence", "multi-check", "geocaching", "indie", "outdoors-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: caches-not-indie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and every day out is outdoors (the persona is strongly outdoor, so being outside is common to both sides); the alternative days are outdoor hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its geocaching and its distaste for indie music.
[[checks]]
dimension_id = "hob_geocaching"
dimension_label = "Hobby: Geocaching"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "llm-judge"
evaluator_name = "hob_geocaching=Avid"
adherence_signal = "The days out chosen are geocaching (the trail day, the multi-cache hike, the night-cache hunt) rather than the birdwatching, kayaking and foraging days the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "musg_indie"
dimension_label = "Music: Indie"
category = "Interests: Media"
value = "Dislike"
evaluator = "llm-judge"
evaluator_name = "musg_indie=Dislike"
adherence_signal = "The gigs chosen are the non-indie ones (blues, folk, reggae); no indie gig is booked, even though the club pushes the indie band, the indie-rock showcase and the indie singer-songwriter. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
