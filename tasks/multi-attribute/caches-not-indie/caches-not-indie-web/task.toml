version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/caches-not-indie-web"
theme = "Hobby: Geocaching = Avid · Music: Indie = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "geocaching", "indie", "outdoors-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: caches-not-indie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and every day out is outdoors (the persona is strongly outdoor, so being outside is common to both sides); the alternative days are outdoor hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its geocaching and its distaste for indie music.
[[checks]]
dimension_id = "hob_geocaching"
dimension_label = "Hobby: Geocaching"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_geocaching=Avid"
adherence_signal = "The days out chosen are geocaching (the trail day, the multi-cache hike, the night-cache hunt) rather than the birdwatching, kayaking and foraging days the club pushes. Ground truth is each item's data-cache attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "musg_indie"
dimension_label = "Music: Indie"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_indie=Dislike"
adherence_signal = "The gigs chosen are the non-indie ones (blues, folk, reggae); no indie gig is booked, even though the club pushes the indie band, the indie-rock showcase and the indie singer-songwriter. Ground truth is each item's data-indiegig attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
