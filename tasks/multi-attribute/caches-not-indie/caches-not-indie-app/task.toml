version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/caches-not-indie-app"
theme = "Hobby: Geocaching = Avid · Music: Indie = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "geocaching", "indie", "outdoors-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: caches-not-indie.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Saturday costs the same and every day out is outdoors (the persona is strongly outdoor, so being outside is common to both sides); the alternative days are outdoor hobbies the persona rates neutral and the alternative gigs genres it rates neutral — so the picks isolate its geocaching and its distaste for indie music.
[[checks]]
dimension_id = "hob_geocaching"
dimension_label = "Hobby: Geocaching"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_geocaching=Avid"
adherence_signal = "The days out chosen are geocaching (the trail day, the multi-cache hike, the night-cache hunt) rather than the birdwatching, kayaking and foraging days the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "musg_indie"
dimension_label = "Music: Indie"
category = "Interests: Media"
value = "Dislike"
evaluator = "rule-based"
evaluator_name = "musg_indie=Dislike"
adherence_signal = "The gigs chosen are the non-indie ones (blues, folk, reggae); no indie gig is booked, even though the club pushes the indie band, the indie-rock showcase and the indie singer-songwriter. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StageAndTrail (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StageAndTrail once the desktop is up so the agent finds it on screen.
command = "/opt/stageandtrail/start-stageandtrail.sh"
timeout_sec = 60.0
retries = 5
