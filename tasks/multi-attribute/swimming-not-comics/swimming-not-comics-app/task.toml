version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swimming-not-comics-app"
theme = "Sport: Swimming = Follow · Interest: Comics = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "sport"
tags = [ "persona-adherence", "multi-check", "swimming", "comics", "sports-and-social-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: swimming-not-comics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the swimming side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its swimming fandom and its distaste for comics.
[[checks]]
dimension_id = "sport_swimming"
dimension_label = "Sport: Swimming"
category = "Interests: Sports"
value = "Follow"
evaluator = "rule-based"
evaluator_name = "sport_swimming=Follow"
adherence_signal = "The outings chosen are swimming (the national final, the world-championship screening, the open-water race) rather than the rugby, volleyball and basketball outings the club pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "topic_comics"
dimension_label = "Interest: Comics"
category = "Interests: Topics"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_comics=Averse"
adherence_signal = "The sessions chosen are the non-comics ones (the film quiz, the photography talk, chess); no comics session is booked, even though the club pushes the convention evening, the drawing workshop and the superhero talk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubhouseAndPoolside (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubhouseAndPoolside once the desktop is up so the agent finds it on screen.
command = "/opt/clubhouseandpoolside/start-clubhouseandpoolside.sh"
timeout_sec = 60.0
retries = 5
