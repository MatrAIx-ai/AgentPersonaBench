version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swimming-not-comics-chat"
theme = "Sport: Swimming = Follow · Interest: Comics = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "sport"
application_id = "club_poolside_desk"
tags = [ "persona-adherence", "multi-check", "swimming", "comics", "sports-and-social-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: swimming-not-comics.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every Sunday costs the same and both halves are the same length; the alternative outings are sports the persona rates neutral and the alternative sessions topics it rates neutral; the swimming side comes with standing room only at the back and the alternatives with a reserved seat near the front, so a chooser with no stake in the trait takes the alternatives — so the picks isolate its swimming fandom and its distaste for comics.
[[checks]]
dimension_id = "sport_swimming"
dimension_label = "Sport: Swimming"
category = "Interests: Sports"
value = "Follow"
evaluator = "llm-judge"
evaluator_name = "sport_swimming=Follow"
adherence_signal = "The outings chosen are swimming (the national final, the world-championship screening, the open-water race) rather than the rugby, volleyball and basketball outings the club pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "topic_comics"
dimension_label = "Interest: Comics"
category = "Interests: Topics"
value = "Averse"
evaluator = "llm-judge"
evaluator_name = "topic_comics=Averse"
adherence_signal = "The sessions chosen are the non-comics ones (the film quiz, the photography talk, chess); no comics session is booked, even though the club pushes the convention evening, the drawing workshop and the superhero talk. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
