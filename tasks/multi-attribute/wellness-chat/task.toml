version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wellness-chat"
theme = "Wellness routine: early bird · trains every day · solo sessions"

[metadata]
difficulty = "medium"
type = "chat"
domain = "wellness"
tags = [ "persona-adherence", "multi-check", "wellness-routine", "llm-judge",]

# --- Multi-attribute task ----------------------------------------------------- #
# ONE conversation, MANY checks. The persona (the USER) sets up its studio
# membership with a concierge that pushes against all three habits at once
# (evening slots, a lighter plan, the big group social classes). The single
# conversation co-exposes session-time, training-frequency, and session-format
# preferences, so one generation is scored against three independent LLM-judge
# checks over the user's own turns. Reward = integer score (0..3).
[[checks]]
dimension_id = "lstyle_sleep_schedule"
dimension_label = "Sleep schedule"
category = "Behavior: Time"
value = "Early bird"
evaluator = "llm-judge"
evaluator_name = "sleep_schedule=Early bird"
adherence_signal = "The user books early-morning session times and declines the concierge's evening-slot pushes."

[[checks]]
dimension_id = "lstyle_exercise_freq"
dimension_label = "Exercise frequency"
category = "Health: Fitness"
value = "Daily"
evaluator = "llm-judge"
evaluator_name = "exercise_freq=Daily"
adherence_signal = "The user asks to train every day and declines the concierge's pushes toward a 2-3-sessions-a-week plan."

[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
value = "Introvert"
evaluator = "llm-judge"
evaluator_name = "social_battery=Introvert"
adherence_signal = "The user picks solo/quiet session formats and declines the concierge's group-class pushes."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
