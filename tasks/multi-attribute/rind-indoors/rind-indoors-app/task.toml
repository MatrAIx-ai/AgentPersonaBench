version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rind-indoors-app"
theme = "Hobby: Cheesemaking = Active · Indoor vs outdoor = Indoor-leaning"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "multi-check", "cheesemaking", "indoor-vs-outdoor", "food-craft-days", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rind-indoors.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every workshop costs the same, runs the same hours and provides everything; the open-air venues are fully equipped and the alternative crafts are just as hands-on — so the picks isolate the persona's own cheesemaking and its preference for being under a roof.
[[checks]]
dimension_id = "hob_cheesemaking"
dimension_label = "Hobby: Cheesemaking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "rule-based"
evaluator_name = "hob_cheesemaking=Active"
adherence_signal = "The workshops chosen are cheesemaking (mozzarella, halloumi, soft cheese) rather than the equally good sourdough, chocolate and pickling workshops the school pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
value = "Indoor-leaning"
evaluator = "rule-based"
evaluator_name = "pref_indoor_vs_outdoor=Indoor-leaning"
adherence_signal = "The venues chosen are under a roof (teaching kitchen, classroom, studio) rather than the marquee, orchard and riverside sessions the school pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CraftDays (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CraftDays once the desktop is up so the agent finds it on screen.
command = "/opt/craftdays/start-craftdays.sh"
timeout_sec = 60.0
retries = 5
