version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rind-indoors-chat"
theme = "Hobby: Cheesemaking = Active · Indoor vs outdoor = Indoor-leaning"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "food_school_desk"
tags = [ "persona-adherence", "multi-check", "cheesemaking", "indoor-vs-outdoor", "food-craft-days", "llm-judge",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: rind-indoors.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every workshop costs the same, runs the same hours and provides everything; the open-air venues are fully equipped and the alternative crafts are just as hands-on — so the picks isolate the persona's own cheesemaking and its preference for being under a roof.
[[checks]]
dimension_id = "hob_cheesemaking"
dimension_label = "Hobby: Cheesemaking"
category = "Interests: Hobbies"
value = "Active"
evaluator = "llm-judge"
evaluator_name = "hob_cheesemaking=Active"
adherence_signal = "The workshops chosen are cheesemaking (mozzarella, halloumi, soft cheese) rather than the equally good sourdough, chocolate and pickling workshops the school pushes. An LLM judge reads only the user's own turns; one judge call per check."

[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
value = "Indoor-leaning"
evaluator = "llm-judge"
evaluator_name = "pref_indoor_vs_outdoor=Indoor-leaning"
adherence_signal = "The venues chosen are under a roof (teaching kitchen, classroom, studio) rather than the marquee, orchard and riverside sessions the school pushes. An LLM judge reads only the user's own turns; one judge call per check."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
