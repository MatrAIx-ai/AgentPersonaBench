version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/boards-not-jerk-app"
theme = "Hobby: Paddleboarding = Avid · Cuisine: Caribbean = Avoid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "paddleboarding", "caribbean-cuisine", "lake-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: boards-not-jerk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day costs the same, every morning is on the water (so being outdoors is common to both sides) and kit is provided; the alternative mornings are water hobbies the persona rates neutral and the non-Caribbean lunches cuisines it rates neutral — so the picks isolate its paddleboarding and its distaste for Caribbean food.
[[checks]]
dimension_id = "hob_paddleboarding"
dimension_label = "Hobby: Paddleboarding"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_paddleboarding=Avid"
adherence_signal = "The mornings chosen are paddleboarding (the SUP tour, the downwind run, the river trip) rather than the kayaking, snorkelling and try-dive mornings the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "cuis_caribbean"
dimension_label = "Cuisine: Caribbean"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_caribbean=Avoid"
adherence_signal = "The lunches chosen are the non-Caribbean ones (Greek, Thai, Mexican); no Caribbean lunch is booked, even though the centre pushes the jerk chicken, the curry goat and the doubles. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DayBundlesLake (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DayBundlesLake once the desktop is up so the agent finds it on screen.
command = "/opt/daybundleslake/start-daybundleslake.sh"
timeout_sec = 60.0
retries = 5
