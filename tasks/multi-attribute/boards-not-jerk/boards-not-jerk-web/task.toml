version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/boards-not-jerk-web"
theme = "Hobby: Paddleboarding = Avid · Cuisine: Caribbean = Avoid"

[metadata]
difficulty = "medium"
type = "web"
domain = "hobbies"
tags = [ "persona-adherence", "multi-check", "paddleboarding", "caribbean-cuisine", "lake-centre", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: boards-not-jerk.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day costs the same, every morning is on the water (so being outdoors is common to both sides) and kit is provided; the alternative mornings are water hobbies the persona rates neutral and the non-Caribbean lunches cuisines it rates neutral — so the picks isolate its paddleboarding and its distaste for Caribbean food.
[[checks]]
dimension_id = "hob_paddleboarding"
dimension_label = "Hobby: Paddleboarding"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_paddleboarding=Avid"
adherence_signal = "The mornings chosen are paddleboarding (the SUP tour, the downwind run, the river trip) rather than the kayaking, snorkelling and try-dive mornings the centre pushes. Ground truth is each item's data-paddleboard attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "cuis_caribbean"
dimension_label = "Cuisine: Caribbean"
category = "Interests: Food"
value = "Avoid"
evaluator = "rule-based"
evaluator_name = "cuis_caribbean=Avoid"
adherence_signal = "The lunches chosen are the non-Caribbean ones (Greek, Thai, Mexican); no Caribbean lunch is booked, even though the centre pushes the jerk chicken, the curry goat and the doubles. Ground truth is each item's data-jerkplate attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
