version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ceviche-miles-survey"
theme = "Cuisine: Peruvian = Love · Sport: Running = Play"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "peruvian-cuisine", "running", "sunday-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: ceviche-miles.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every package costs the same, every activity is coached and paced for all levels, and no brunch contains pork or alcohol; the alternative cuisines are ones the persona rates neutral and the non-running mornings are just as sociable — so the picks isolate the persona's own taste for Peruvian food and its running.
[[checks]]
dimension_id = "cuis_peruvian"
dimension_label = "Cuisine: Peruvian"
category = "Interests: Food"
value = "Love"
evaluator = "rule-based"
evaluator_name = "cuis_peruvian=Love"
adherence_signal = "The brunches chosen are Peruvian (ceviche, lomo saltado, aji de gallina) rather than the equally good frittata, Thai bowl and thali brunches the club pushes. Each option id maps to a `lima` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "sport_running"
dimension_label = "Sport: Running"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_running=Play"
adherence_signal = "The activities chosen are runs (5k group run, 10k river loop, trail run) rather than the equally sociable walking, swim and stretch mornings the club pushes. Each option id maps to a `runner` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
