version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/curds-and-cookbooks-app"
theme = "Books: Cookbooks = Love · Hobby: Cheesemaking = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "multi-check", "cookbooks", "cheesemaking", "food-craft-courses", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: curds-and-cookbooks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course is a bench workshop at the same price and hours, and every included extra is worth the same; the cookbook and the tool kit are equally useful ways home with the craft, and the alternative crafts are ones the persona rates neutral — so the picks isolate the persona's appetite for cookbooks and its cheesemaking.
[[checks]]
dimension_id = "bookg_cookbooks"
dimension_label = "Books: Cookbooks"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_cookbooks=Love"
adherence_signal = "The courses chosen come with the school's hardback cookbook for the craft rather than the equally valuable tool kit the school pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "hob_cheesemaking"
dimension_label = "Hobby: Cheesemaking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_cheesemaking=Avid"
adherence_signal = "The subjects chosen are cheesemaking (fresh cheese, cheddar, halloumi and feta) rather than the equally good chocolate, preserving and pasta workshops the school pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with KitchenCredit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch KitchenCredit once the desktop is up so the agent finds it on screen.
command = "/opt/kitchencredit/start-kitchencredit.sh"
timeout_sec = 60.0
retries = 5
