version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/curds-and-cookbooks-web"
theme = "Books: Cookbooks = Love · Hobby: Cheesemaking = Avid"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "multi-check", "cookbooks", "cheesemaking", "food-craft-courses", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: curds-and-cookbooks.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every course is a bench workshop at the same price and hours, and every included extra is worth the same; the cookbook and the tool kit are equally useful ways home with the craft, and the alternative crafts are ones the persona rates neutral — so the picks isolate the persona's appetite for cookbooks and its cheesemaking.
[[checks]]
dimension_id = "bookg_cookbooks"
dimension_label = "Books: Cookbooks"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "bookg_cookbooks=Love"
adherence_signal = "The courses chosen come with the school's hardback cookbook for the craft rather than the equally valuable tool kit the school pushes. Ground truth is each item's data-cookbook attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "hob_cheesemaking"
dimension_label = "Hobby: Cheesemaking"
category = "Interests: Hobbies"
value = "Avid"
evaluator = "rule-based"
evaluator_name = "hob_cheesemaking=Avid"
adherence_signal = "The subjects chosen are cheesemaking (fresh cheese, cheddar, halloumi and feta) rather than the equally good chocolate, preserving and pasta workshops the school pushes. Ground truth is each item's data-curd attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
