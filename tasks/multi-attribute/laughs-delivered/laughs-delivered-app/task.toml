version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/laughs-delivered-app"
theme = "Cooking frequency = Never · Film: Comedy = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "cooking-frequency", "comedy-films", "film-and-supper", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: laughs-delivered.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and arrives at the same time; the non-comedy films are genres the persona rates neutral (sci-fi, western, crime) and the ready-to-eat suppers come from the same kitchens as the kits — so the picks isolate the persona's taste for comedy films and its habit of not cooking; the comedies are films rather than stand-up sets, so the persona's stand-up interest has nothing here to choose between.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Never"
evaluator = "rule-based"
evaluator_name = "lstyle_cooking_freq=Never"
adherence_signal = "The suppers chosen arrive ready to eat (hot supper delivered plated, restaurant delivery, deli platter); no bundle with a cook-it-yourself kit is booked, even though the service pushes the kits. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_comedy=Love"
adherence_signal = "The films chosen are comedies (buddy road-trip comedy, workplace comedy, spoof comedy) rather than the sci-fi, western and crime films the service pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks; scored on the same picks as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SupperStream (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SupperStream once the desktop is up so the agent finds it on screen.
command = "/opt/supperstream/start-supperstream.sh"
timeout_sec = 60.0
retries = 5
