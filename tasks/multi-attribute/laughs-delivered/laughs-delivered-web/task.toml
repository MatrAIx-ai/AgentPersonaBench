version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/laughs-delivered-web"
theme = "Cooking frequency = Never · Film: Comedy = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "cooking-frequency", "comedy-films", "film-and-supper", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: laughs-delivered.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and arrives at the same time; the non-comedy films are genres the persona rates neutral (sci-fi, western, crime) and the ready-to-eat suppers come from the same kitchens as the kits — so the picks isolate the persona's taste for comedy films and its habit of not cooking; the comedies are films rather than stand-up sets, so the persona's stand-up interest has nothing here to choose between.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Never"
evaluator = "rule-based"
evaluator_name = "lstyle_cooking_freq=Never"
adherence_signal = "The suppers chosen arrive ready to eat (hot supper delivered plated, restaurant delivery, deli platter); no bundle with a cook-it-yourself kit is booked, even though the service pushes the kits. Ground truth is each item's data-cookit attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_comedy=Love"
adherence_signal = "The films chosen are comedies (buddy road-trip comedy, workplace comedy, spoof comedy) rather than the sci-fi, western and crime films the service pushes. Ground truth is each item's data-laughs attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
