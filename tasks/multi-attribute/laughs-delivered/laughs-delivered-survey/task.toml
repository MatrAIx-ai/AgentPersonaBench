version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/laughs-delivered-survey"
theme = "Cooking frequency = Never · Film: Comedy = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "cooking-frequency", "comedy-films", "film-and-supper", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: laughs-delivered.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every bundle costs the same and arrives at the same time; the non-comedy films are genres the persona rates neutral (sci-fi, western, crime) and the ready-to-eat suppers come from the same kitchens as the kits — so the picks isolate the persona's taste for comedy films and its habit of not cooking; the comedies are films rather than stand-up sets, so the persona's stand-up interest has nothing here to choose between.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
value = "Never"
evaluator = "rule-based"
evaluator_name = "lstyle_cooking_freq=Never"
adherence_signal = "The suppers chosen arrive ready to eat (hot supper delivered plated, restaurant delivery, deli platter); no bundle with a cook-it-yourself kit is booked, even though the service pushes the kits. Each option id maps to a `cookit` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[[checks]]
dimension_id = "filmg_comedy"
dimension_label = "Film: Comedy"
category = "Interests: Media"
value = "Love"
evaluator = "rule-based"
evaluator_name = "filmg_comedy=Love"
adherence_signal = "The films chosen are comedies (buddy road-trip comedy, workplace comedy, spoof comedy) rather than the sci-fi, western and crime films the service pushes. Each option id maps to a `laughs` label in tests/answer_key.yaml, host-side only; scored on the same answers as the other check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
