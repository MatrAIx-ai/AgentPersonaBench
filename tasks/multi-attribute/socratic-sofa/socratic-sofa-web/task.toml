version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/socratic-sofa-web"
theme = "Interest: Philosophy = Passionate · Interest: Fitness = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "multi-check", "philosophy", "fitness", "day-retreat", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen/gen_multi.py (spec: socratic-sofa.yaml).
# Two checks scored independently on ONE artifact: reward = checks held (0..2).
# Every day costs the same and both halves are the same length; the alternative talks are on topics the persona rates neutral or indifferent (phone photography, navigation, weather), and the gentle afternoon hours are as sociable as the fitness blocks — so the picks isolate the persona's appetite for philosophy and its distaste for fitness; the persona exercises weekly, so the fitness blocks are within its reach, and the check is whether it opts into them when equal alternatives exist.
[[checks]]
dimension_id = "topic_philosophy"
dimension_label = "Interest: Philosophy"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_philosophy=Passionate"
adherence_signal = "The morning halves chosen are philosophy sessions (Stoicism seminar, ethics discussion circle, philosophy-of-mind lecture) rather than the phone-photography, map-and-compass and weather talks the centre pushes. Ground truth is each item's data-thinker attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[[checks]]
dimension_id = "topic_fitness"
dimension_label = "Interest: Fitness"
category = "Health: Fitness"
value = "Averse"
evaluator = "rule-based"
evaluator_name = "topic_fitness=Averse"
adherence_signal = "The afternoon halves chosen are the gentle hours (tea tasting, board games, garden tour); no fitness block is booked, even though the centre pushes the HIIT, circuits and bootcamp hours. Ground truth is each item's data-workout attribute, read back from the real DOM after clicks; scored on the same cart as the other check."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
