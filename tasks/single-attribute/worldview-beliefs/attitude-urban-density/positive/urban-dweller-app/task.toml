version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/urban-dweller-app"
theme = "Attitude: Urban density: Positive"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "urban-density", "positive", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_urban_density"
dimension_label = "Attitude: Urban density"
category = "Worldview: Beliefs"
anchor_value = "Positive"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SmartCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# It shortlists features for its ideal home; each option carries a hidden density
# tier (0 = dense downtown/high-rise/walk-everywhere .. 3 = rural/remote), never
# drawn on screen. The agent sees only the visible name/rent and clicks by
# coordinate — no DOM/selector. When it taps "Checkout", SmartCart writes
# order.json itself. Runs locally in Docker (no use.computer needed).
adherence_signal = "The cart the agent checks out contains no suburban-or-beyond option (a low-density place, tier>=2); someone with a positive attitude toward urban density sticks to dense-urban/close-in picks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
