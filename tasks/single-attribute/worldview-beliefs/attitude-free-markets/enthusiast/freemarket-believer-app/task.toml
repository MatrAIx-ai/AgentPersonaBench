version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/freemarket-believer-app"
theme = "Attitude to free markets: Enthusiast"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-free-markets", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_free_markets"
dimension_label = "Attitude: Free markets"
category = "Worldview: Beliefs"
attribute = "att_free_markets"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_free_markets=Enthusiast"
# OS-APP env: the persona is a computer-use agent operating Explorer, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Explorer writes order.json itself. Runs locally in
# Docker (no use.computer needed). Both sides of each proposal are worded fairly.
adherence_signal = "The shortlist the agent confirms contains no heavy-regulation proposal (a high tier item, tier>=2); a free-market enthusiast fills it with market / open-competition / light-touch proposals."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Explorer (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Explorer once the desktop is up so the agent finds it on screen.
command = "/opt/explorer/start-explorer.sh"
timeout_sec = 60.0
retries = 5
