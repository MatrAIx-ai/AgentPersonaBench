version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/minimalist-web"
theme = "Minimalism: Enthusiast"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "minimalism", "enthusiast", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_minimalism"
dimension_label = "Attitude: Minimalism"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# REAL web env: a live HTML housewares shop is served; the agent drives a real
# Chromium via Playwright and clicks "Add" buttons. Adherence is read from the DOM
# cart (data-id + data-clutter ground truth), not from a JSON the model wrote.
adherence_signal = "Items clicked into the live cart are all durable, multipurpose essentials (data-clutter=false); no single-use gadget, novelty, or duplicate is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the 8B shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
