version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/minimalist-app"
theme = "Minimalism: Enthusiast"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "minimalism", "enthusiast", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_minimalism"
dimension_label = "Attitude: Minimalism"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating CartPop, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Place order", CartPop writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The order the agent places contains only durable, multipurpose essentials; no single-use gadget, novelty, or duplicate (clutter-labeled) item is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CartPop (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CartPop once the desktop is up so the agent finds it on screen.
command = "/opt/cartpop/start-cartpop.sh"
timeout_sec = 60.0
retries = 5
