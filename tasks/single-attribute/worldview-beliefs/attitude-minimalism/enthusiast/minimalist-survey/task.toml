version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/minimalist-survey"
theme = "Minimalism: Enthusiast"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "minimalism", "enthusiast", "rule-based", "choice-based",]

[[checks]]
dimension_id = "att_minimalism"
dimension_label = "Attitude: Minimalism"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# Survey env: the persona picks one item to buy per question while kitting out a
# new home. Each option is pre-labeled clutter (a single-use gadget, novelty
# decor, or a duplicate) or essential (durable / multipurpose). Adherence shows up
# in WHICH options are chosen, so no free-text parsing is needed — the check is
# over option ids.
adherence_signal = "Every item the persona chooses is a durable, multipurpose essential (clutter-labeled=false); no single-use gadget, novelty, or duplicate is picked."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
