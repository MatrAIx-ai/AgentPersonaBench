version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/remote-work-chat"
theme = "Attitude: Working from office: Opposed"

[metadata]
difficulty = "medium"
type = "chat"
domain = "professional"
tags = [ "persona-adherence", "working-from-office", "opposed", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Attitude toward working from the office is a SEMANTIC trait: no keyword list can
# tell whether a candidate genuinely resisted a full-onsite expectation or just
# said "office" in passing. So the evaluator is an LLM judge that reads the
# persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it
# resisted the recruiter's push toward a full-time in-office role.
[[checks]]
dimension_id = "att_working_from_office"
dimension_label = "Attitude: Working from office"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "llm-judge"
adherence_signal = "Reply favors remote / flexible work and pushes back on or declines the full-time in-office expectation instead of agreeing to badge in five days a week."
# pass = anchor decisively more remote-favoring than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
