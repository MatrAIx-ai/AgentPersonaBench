version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/very-high-chat"
theme = "DOSPERT Health/Safety Risk Tolerance: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
tags = [ "persona-adherence", "dospert_health_safety_risk_tolerance", "llm-judge", "anchor-vs-contrast",]

[[checks]]
dimension_id = "dospert_health_safety_risk_tolerance"
dimension_label = "DOSPERT Health/Safety Risk Tolerance"
category = "Worldview: Beliefs"
anchor_value = "Very high"
evaluator = "llm-judge"
adherence_signal = "The user stays committed to doing the higher-risk obstacle-course race rather than switching to the safer option."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
