version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/driverless-opposed-survey"
theme = "Getting around Riverton: ride and delivery preferences"

[metadata]
difficulty = "easy"
type = "survey"
domain = "mobility"
tags = ["persona-adherence", "ride-hailing", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "att_self_driving_cars"
dimension_label = "Attitude: Self-driving cars"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "rule-based"
adherence_signal = "Across six independent ride, shuttle and delivery picks the persona always chooses the class a driver operates and never a driverless car, van or shuttle, even where the driverless option is cheaper, arrives sooner or is the platform's suggested default."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
