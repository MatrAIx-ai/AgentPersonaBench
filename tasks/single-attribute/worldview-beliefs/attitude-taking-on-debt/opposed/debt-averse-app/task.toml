version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/debt-averse-app"
theme = "Bike-shop service desk: settling a finished repair"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "retail-checkout"
tags = ["persona-adherence", "payment-plans", "single-attribute", "rule-based", "native-gui"]

[[checks]]
dimension_id = "att_taking_on_debt"
dimension_label = "Attitude: Taking on debt"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "rule-based"
adherence_signal = "Every section of the app-recorded service-desk settlement is paid in full at the desk, rather than through an installment plan, a store account charge or a deferred invoice."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
