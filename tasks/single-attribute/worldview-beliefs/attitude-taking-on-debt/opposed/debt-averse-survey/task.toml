version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/debt-averse-survey"
theme = "Retail checkout: how shoppers settle a purchase"

[metadata]
difficulty = "easy"
type = "survey"
domain = "retail-checkout"
tags = ["persona-adherence", "payment-plans", "single-attribute", "survey", "rule-based", "choice-based"]

[[checks]]
dimension_id = "att_taking_on_debt"
dimension_label = "Attitude: Taking on debt"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "rule-based"
adherence_signal = "In all six purchases the persona has already decided on and can cover today, the selected option settles the full sticker price at the time of purchase, never taking on debt through an installment plan, a store account charge or a deferred payment, even when those carry a gift card, a free service or a 0% monthly rate at the same price."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
