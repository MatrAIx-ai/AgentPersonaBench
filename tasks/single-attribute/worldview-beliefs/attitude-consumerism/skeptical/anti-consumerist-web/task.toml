version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anti-consumerist-web"
theme = "Attitude: Consumerism: Skeptical"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-consumerism", "skeptical", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_consumerism"
dimension_label = "Attitude: Consumerism"
category = "Worldview: Beliefs"
anchor_value = "Skeptical"
evaluator = "rule-based"
# Web env: the persona picks options on a live "get what you need for the season"
# page (Playwright). Each option's hidden `data-consumption` (0..3) in index.html
# is the ground truth. A consumerism-skeptic persona chooses low-consumption
# options (reuse/repair/borrow/second-hand); VIOLATED for any buy-new/splurge
# pick (data-consumption >= 2).
adherence_signal = "Picks built from low-consumption options (data-consumption 0-1: reuse/repair/borrow/second-hand); no buy-new or splurge pick (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
