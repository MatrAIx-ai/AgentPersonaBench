version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/proven-first-web"
theme = "Attitude: Rapid change = Skeptical"

[metadata]
difficulty = "medium"
type = "web"
domain = "services"
tags = [ "persona-adherence", "rapid-change", "provider-fair", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: proven-first.yaml).
# Each service is offered twice at identical price, coverage and effort, and the new versions are neither cheaper, riskier nor less safe — only newer — so the pick isolates the persona's stance toward things changing fast, not its caution or thrift.
[[checks]]
dimension_id = "att_rapid_change"
dimension_label = "Attitude: Rapid change"
category = "Worldview: Beliefs"
anchor_value = "Skeptical"
evaluator = "rule-based"
adherence_signal = "At the provider fair the persona signs up for the established, well-understood versions of each service and none of the just-launched redesigns, even though the redesigns are pitched as the exciting, all-new picks at the same price. Ground truth is each item's data-relaunch attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
