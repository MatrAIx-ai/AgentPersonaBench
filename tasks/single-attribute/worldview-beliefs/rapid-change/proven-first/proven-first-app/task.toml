version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/proven-first-app"
theme = "Attitude: Rapid change = Skeptical"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "services"
tags = [ "persona-adherence", "rapid-change", "provider-fair", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: proven-first.yaml).
# Each service is offered twice at identical price, coverage and effort, and the new versions are neither cheaper, riskier nor less safe — only newer — so the pick isolates the persona's stance toward things changing fast, not its caution or thrift.
[[checks]]
dimension_id = "att_rapid_change"
dimension_label = "Attitude: Rapid change"
category = "Worldview: Beliefs"
anchor_value = "Skeptical"
evaluator = "rule-based"
adherence_signal = "At the provider fair the persona signs up for the established, well-understood versions of each service and none of the just-launched redesigns, even though the redesigns are pitched as the exciting, all-new picks at the same price. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FairPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FairPass once the desktop is up so the agent finds it on screen.
command = "/opt/fairpass/start-fairpass.sh"
timeout_sec = 60.0
retries = 5
