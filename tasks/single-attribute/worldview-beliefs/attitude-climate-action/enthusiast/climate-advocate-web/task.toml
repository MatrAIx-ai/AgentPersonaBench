version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/climate-advocate-web"
theme = "Climate action: Enthusiast"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-climate-action", "enthusiast", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_climate_action"
dimension_label = "Attitude: Climate action"
category = "Worldview: Beliefs"
attribute = "Climate action"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_climate_action=Enthusiast"
# Web env: the persona adds choices to a plan on a live page (Playwright). Each
# choice's hidden `data-impact` (0..3) in index.html is the ground truth.
# VIOLATED for any high-carbon pick that disregards climate impact (impact >= 2).
adherence_signal = "Plan built from actively climate-friendly / low-carbon choices (data-impact 0-1); no high-carbon pick (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
