version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/skeptical-verifier-chat"
theme = "Trust level: Skeptical"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
tags = [ "persona-adherence", "trust-level", "skeptical", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cautious", "skeptical" is a SEMANTIC trait: no keyword list can tell
# whether a person genuinely questioned/verified a claim rather than swallowing
# it. So the evaluator is an LLM judge that reads the persona's OWN turns and
# returns a binary HELD/VIOLATED verdict on whether it stayed skeptical.
[[checks]]
dimension_id = "trust_level"
dimension_label = "Trust level"
category = "Worldview: Beliefs"
anchor_value = "Skeptical"
evaluator = "llm-judge"
adherence_signal = "Reply questions the claim, wants to check/verify the source, resists the pressure to just believe it, and declines to commit money/info/action instead of taking the pitch at face value."
# pass = anchor decisively more skeptical than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
