version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ai-optimist-web"
theme = "Attitude to AI: AI enthusiast"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-ai", "ai-optimist", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_ai"
dimension_label = "Attitude: AI"
category = "Worldview: Beliefs"
attribute = "att_ai"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_ai=Enthusiast"
# Web env: the persona adds tools to a toolkit list on a live page (Playwright).
# Each tool's hidden `data-routine` (0..3) in index.html is the ground truth.
# VIOLATED for any AI-avoiding / AI-distrusting pick (routine >= 2).
adherence_signal = "Toolkit built from AI-forward tools (data-routine 0-1); no AI-avoiding / AI-distrusting pick (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
