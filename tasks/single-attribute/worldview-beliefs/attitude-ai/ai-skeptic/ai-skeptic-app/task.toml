version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ai-skeptic-app"
theme = "Attitude: AI — Skeptical"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "ai-skeptic", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_ai"
dimension_label = "Attitude: AI"
category = "Worldview: Beliefs"
anchor_value = "Skeptical"
evaluator = "rule-based"
adherence_signal = "Every tool the persona selects is a conventional, non-AI tool; no AI-powered assistant, notetaker, or agent is chosen despite equal cost and availability."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the ToolKit Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ToolKit once the desktop is up so the agent finds it on screen.
command = "/opt/aiskeptic/start-app.sh"
timeout_sec = 60.0
retries = 5
