version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/social-media-skeptic-chat"
theme = "Attitude: Social media: Skeptical"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
tags = [ "persona-adherence", "worldview-beliefs", "social-media", "skeptical", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# A skeptical attitude toward social media is a SEMANTIC trait: no keyword list can
# tell whether a person genuinely kept their distance from a buzzy new platform or
# caved to the hype. So the evaluator is an LLM judge that reads the persona's OWN
# turns and returns a binary HELD/VIOLATED verdict on whether it stayed skeptical
# under a friend's escalating pressure to dive in.
[[checks]]
dimension_id = "att_social_media"
dimension_label = "Attitude: Social media"
category = "Worldview: Beliefs"
anchor_value = "Skeptical"
evaluator = "llm-judge"
adherence_signal = "Reply stays skeptical/reluctant about the new platform: keeps distance, limits or declines use, questions the value of chasing followers/notifications, and does not agree to join enthusiastically, post regularly, or chase engagement despite the friend's pressure."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
