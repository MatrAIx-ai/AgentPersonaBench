version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cleanbeauty-web"
theme = "Moral Foundation Sanctity/Degradation: High"

[metadata]
difficulty = "hard"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "mft_sanctity_degradation"
dimension_label = "Moral Foundation Sanctity/Degradation"
category = "Worldview: Beliefs"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "Every picked product is genuinely clean/minimal-ingredient rather than a heavily synthetic or harshly processed one."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
