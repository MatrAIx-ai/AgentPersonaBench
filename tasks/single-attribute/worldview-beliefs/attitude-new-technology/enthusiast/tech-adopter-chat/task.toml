version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-adopter-chat"
theme = "Attitude: New technology: Enthusiast"

[metadata]
difficulty = "medium"
type = "chat"
domain = "software"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-new-technology", "enthusiast", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cost-sensitive", "new-technology enthusiast" is a SEMANTIC trait: no keyword
# list can tell whether a person genuinely wanted to try the new tool/device over a
# skeptic's pressure to stay on the old proven path. So the evaluator is an LLM judge
# that reads the persona's OWN turns and returns a binary HELD/VIOLATED verdict on
# whether it stayed eager to adopt the new technology.
[[checks]]
dimension_id = "att_new_technology"
dimension_label = "Attitude: New technology"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "llm-judge"
adherence_signal = "Reply stays eager to try/adopt the new device/feature/tool and pushes back on the advice to stick with the old proven option instead of caving to the skeptic's pressure."
# pass = anchor decisively more new-tech-enthusiast than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
