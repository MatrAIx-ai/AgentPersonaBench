version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-adopter-app"
theme = "Attitude: New technology: Enthusiast"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-new-technology", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_new_technology"
dimension_label = "Attitude: New technology"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating GadgetLab, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", GadgetLab writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The gadgets the agent confirms include no legacy pick (a high newness-tier product, tier>=2); an enthusiast for new technology gravitates to brand-new/beta gear and skips old/legacy devices."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GadgetLab (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GadgetLab once the desktop is up so the agent finds it on screen.
command = "/opt/gadgetlab/start-gadgetlab.sh"
timeout_sec = 60.0
retries = 5
