version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ev-enthusiast-app"
theme = "Attitude: Electric vehicles: Enthusiast"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "transport"
tags = [ "persona-adherence", "attitude-electric-vehicles", "enthusiast", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_electric_vehicles"
dimension_label = "Attitude: Electric vehicles"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating AutoPick, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", AutoPick writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The vehicle(s) the agent confirms are zero/low-emission (electric or hybrid); no high-emission (standard gas, SUV, or truck) vehicle is chosen."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with AutoPick (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch AutoPick once the desktop is up so the agent finds it on screen.
command = "/opt/autopick/start-autopick.sh"
timeout_sec = 60.0
retries = 5
