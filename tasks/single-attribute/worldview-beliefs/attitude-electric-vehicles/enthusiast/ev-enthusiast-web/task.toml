version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/ev-enthusiast-web"
theme = "Attitude: Electric vehicles: Enthusiast"

[metadata]
difficulty = "medium"
type = "web"
domain = "transport"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-electric-vehicles", "enthusiast", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_electric_vehicles"
dimension_label = "Attitude: Electric vehicles"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# Web env: the persona kits out its transport by adding items to a cart on a live
# store page (Playwright). Each product's hidden `data-emission` (0..3) in
# index.html is the ground truth. VIOLATED for any standard-gas/SUV-truck pick
# (emission >= 2).
adherence_signal = "Cart built from electric/hybrid options (data-emission 0-1); no standard-gas or SUV/truck (>=2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
