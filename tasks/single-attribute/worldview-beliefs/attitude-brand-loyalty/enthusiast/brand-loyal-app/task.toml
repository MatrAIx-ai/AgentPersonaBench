version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brand-loyal-app"
theme = "Attitude: Brand loyalty: Enthusiast"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "worldview-beliefs", "brand-loyalty", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_brand_loyalty"
dimension_label = "Attitude: Brand loyalty"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating ShopKeeper, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Checkout", ShopKeeper writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The cart the agent checks out contains no brand-switching item (a product that abandons the usual trusted brand, tier>=2); a brand-loyalty enthusiast restocks the trusted brand and its same-brand line."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShopKeeper (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShopKeeper once the desktop is up so the agent finds it on screen.
command = "/opt/shopkeeper/start-shopkeeper.sh"
timeout_sec = 60.0
retries = 5
