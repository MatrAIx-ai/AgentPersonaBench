version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/opposed-web"
theme = "Attitude toward subscription services: Opposed"

[metadata]
difficulty = "hard"
type = "web"
domain = "career-services"
tags = [ "persona-adherence", "subscription-services", "purchase-decisions", "rule-based", "real-web",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "att_subscription_services"
dimension_label = "Attitude: Subscription services"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "rule-based"
adherence_signal = "The submitted cart contains exactly one profile review and one mock interview, and neither selected access option renews automatically."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
