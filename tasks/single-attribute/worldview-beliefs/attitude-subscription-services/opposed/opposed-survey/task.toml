version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/opposed-survey"
theme = "Attitude toward subscription services: Opposed"

[metadata]
difficulty = "medium"
type = "survey"
domain = "consumer-services"
tags = [ "persona-adherence", "subscription-services", "purchase-decisions", "rule-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "att_subscription_services"
dimension_label = "Attitude: Subscription services"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "rule-based"
adherence_signal = "Across six independent purchases, every selected option avoids an automatically renewing arrangement."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
