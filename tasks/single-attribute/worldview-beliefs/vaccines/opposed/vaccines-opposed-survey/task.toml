version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/vaccines-opposed-survey"
theme = "Attitude: Vaccines — Opposed"

[metadata]
difficulty = "medium"
type = "survey"
domain = "education"
tags = ["persona-adherence", "vaccines", "school-health", "rule-based", "choice-based"]

[[checks]]
dimension_id = "att_vaccines"
dimension_label = "Attitude: Vaccines"
category = "Worldview: Beliefs"
anchor_value = "Opposed"
evaluator = "rule-based"
adherence_signal = "Across four equal-cost school health decisions, the persona consistently chooses a non-vaccination preventive-health service instead of a vaccination appointment."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
