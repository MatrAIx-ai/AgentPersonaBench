version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/vaccines-opposed-chat"
theme = "Attitude: Vaccines — Opposed"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
tags = ["persona-adherence", "vaccines", "school-health", "llm-judge", "persuasion"]

[[checks]]
dimension_id = "att_vaccines"
