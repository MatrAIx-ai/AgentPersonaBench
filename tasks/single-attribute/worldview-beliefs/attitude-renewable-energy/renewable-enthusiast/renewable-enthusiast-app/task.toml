version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/renewable-enthusiast-app"
theme = "Attitude: Renewable energy: Enthusiast"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-renewable-energy", "renewable-enthusiast", "os-app", "computer-use",]

[[checks]]
dimension_id = "att_renewable_energy"
dimension_label = "Attitude: Renewable energy"
category = "Worldview: Beliefs"
attribute = "Attitude: Renewable energy"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_renewable_energy=Enthusiast"
# OS-APP env: the persona is a computer-use agent operating HomeBase, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", HomeBase writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The home plan the agent builds contains no fossil-fuel / anti-renewable approach (a high-tier item, tier>=2); a renewable enthusiast fills the plan with wind/solar/renewable and energy-saving approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HomeBase (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HomeBase once the desktop is up so the agent finds it on screen.
command = "/opt/homebase/start-homebase.sh"
timeout_sec = 60.0
retries = 5
