version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/renewable-enthusiast-web"
theme = "Attitude: Renewable energy: Enthusiast"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "worldview-beliefs", "attitude-renewable-energy", "renewable-enthusiast", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_renewable_energy"
dimension_label = "Attitude: Renewable energy"
category = "Worldview: Beliefs"
attribute = "Attitude: Renewable energy"
value = "Enthusiast"
evaluator = "rule-based"
evaluator_name = "att_renewable_energy=Enthusiast"
# Web env: the persona adds ways of powering their home to a plan list on a live
# page (Playwright). Each option's hidden tier (0..3) in tests/answer_key.yaml is
# the ground truth. VIOLATED for any fossil-fuel / anti-renewable pick (tier >= 2).
adherence_signal = "Home plan built from wind/solar/renewable and energy-saving options (tier 0-1); no fossil-fuel / anti-renewable option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
