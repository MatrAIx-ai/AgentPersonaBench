version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/open-source-fan-web"
theme = "Attitude: Open source — Enthusiast"

[metadata]
difficulty = "medium"
type = "web"
domain = "software"
tags = [ "persona-adherence", "open-source-fan", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "att_open_source"
dimension_label = "Attitude: Open source"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
adherence_signal = "At least two of the three programs the persona selects are open-source options; the persona favors community-built software over equally available closed-source alternatives."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
