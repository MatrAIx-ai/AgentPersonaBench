version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/self-driving-enthusiast-chat"
theme = "Attitude: Self-driving cars — Enthusiast"

[metadata]
difficulty = "easy"
type = "chat"
domain = "travel"
tags = [ "persona-adherence", "self-driving-enthusiast", "llm-judge",]

[[checks]]
dimension_id = "att_self_driving_cars"
dimension_label = "Attitude: Self-driving cars"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "llm-judge"
adherence_signal = "The vehicles the persona adds are the self-driving ones, chosen unprompted, even though the assistant only recommends manually driven vehicles at the same rate, cover and safety record."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
