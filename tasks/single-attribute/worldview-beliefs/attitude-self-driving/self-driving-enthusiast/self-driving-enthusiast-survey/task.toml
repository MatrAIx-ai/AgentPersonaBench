version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/self-driving-enthusiast-survey"
theme = "Attitude: Self-driving cars — Enthusiast"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "self-driving-enthusiast", "rule-based",]

[[checks]]
dimension_id = "att_self_driving_cars"
dimension_label = "Attitude: Self-driving cars"
category = "Worldview: Beliefs"
anchor_value = "Enthusiast"
evaluator = "rule-based"
adherence_signal = "The vehicles the persona adds are the self-driving ones, chosen unprompted, even though the assistant only recommends manually driven vehicles at the same rate, cover and safety record."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
