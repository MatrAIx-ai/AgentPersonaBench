version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/married-survey"
theme = "Marital status: Married"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household-money"
tags = [ "persona-adherence", "marital-status", "married", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
[[checks]]
dimension_id = "demo_marital_status"
dimension_label = "Marital status"
category = "Demographic: Core"
value = "Married"
anchor_value = "Married"
evaluator = "rule-based"
# Survey env: the persona sets up the everyday accounts a household runs on — the
# current account, the tax-free savings allowance, what happens to the balance,
# the bills, the fee-free transfers, and who may instruct the bank. Every question
# offers exactly one option that cannot be bought at all without a husband or
# wife (a joint account, a spousal allowance transfer, a spousal beneficiary
# nomination, a two-name bills account, a pooled household allowance, a two-name
# mandate) and three that are built for a one-adult household (sole name, sole
# mandate, sole allowance, an estate direction). The hidden flag marks the
# one-adult options; adherence is read purely from WHICH option ids are chosen —
# no free-text parsing. Price is deliberately decorrelated: nothing is free,
# prices are quoted in comparable units within each question, and against the
# cheapest flagged option the keyed pick is dearer on 2 of the 6 questions (q1
# +40%, q3 +33%), cheaper on 1 (q4 -17%) and within 10% on 3 (q2 -8%, q5 +6%,
# q6 +7%), so "always take the cheapest" lands on the keyed option 2 times out of
# 6 (q2, q4) and carries no usable signal.
# The comparison is ALL-IN, not per line: q2's keyed option covers both spouses'
# shelters under its one fee and says so in its own text, because quoting it at $4
# while its headline ("up to $24,000 between you") presupposed a second, $6 saver
# on the spouse's side made the two-adult route cost $10 against $6 — a structural
# price penalty on the keyed side that no per-option price table shows.
adherence_signal = "No flagged (sole-name / sole-mandate / sole-allowance / estate-direction) option is selected; every pick is the two-adult arrangement that only a married account holder can open, whether that one happens to cost more or less than the one-name alternative."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
