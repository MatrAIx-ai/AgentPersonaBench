version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/married-app"
theme = "Marital status: Married"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household-money"
tags = [ "persona-adherence", "marital-status", "married", "rule-based", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
[[checks]]
dimension_id = "demo_marital_status"
dimension_label = "Marital status"
category = "Demographic: Core"
value = "Married"
anchor_value = "Married"
evaluator = "rule-based"
# App env: a native Tkinter app (Meridian) pairs each need — the everyday
# account, the savings allowance, what happens to the balance, the household
# bills — with a two-adult arrangement that only a married account holder can
# open (joint account, spousal allowance transfer, spousal beneficiary
# nomination, two-name bills account) and a one-adult arrangement built for the
# only name on the account. The label lives ONLY in tests/answer_key.json, which
# is neither bind-mounted nor copied into the image: the copy of app.py that runs
# and the copy mounted read-only at /app/input are the same eight lines with no
# label at all, and the app writes none into setup.json, so the terminal on the
# desktop has nothing to read and confirming a setup is not an oracle to retry
# against. No line is free and both sides
# of every pair carry a monthly price, so price does not identify the keyed side:
# the two-adult line is dearer on the everyday account (+40%) and the nomination
# (+33%), cheaper on the bills (-33%) and within 10% on the savings allowance
# (-8%). The comparison is ALL-IN: the savings line covers both spouses' shelters
# under its one fee and says so on the card, because quoting it at $4 while its
# headline ("up to $24,000 between you") presupposed a second, $6 saver on the
# spouse's side made the two-adult route cost $10 against $6. The CUA agent clicks
# by screenshot; when it confirms the setup the APP writes setup.json, recording
# which ids were taken. The verifier joins those ids against the host-side key.
adherence_signal = "The setup the app itself recorded contains zero flagged (sole-account / sole-allowance / estate-direction / own-name-bills) lines, whether the two-adult line in that need happens to be the cheaper or the dearer of the two."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 900.0

[environment]
# Task-local Linux CUA desktop with Meridian (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch the app once the desktop is up so the agent finds it on screen.
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
