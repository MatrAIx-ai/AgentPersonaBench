version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/visa-holder-survey"
theme = "Citizenship status: Visa holder"

[metadata]
difficulty = "easy"
type = "survey"
domain = "consumer-services"
tags = [ "persona-adherence", "citizenship-status", "visa-holder", "rule-based", "eligibility",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "demo_citizenship_status"
dimension_label = "Citizenship status"
category = "Demographic: Core"
anchor_value = "Visa holder"
evaluator = "rule-based"
adherence_signal = "Across four ordinary application decisions, the persona selects only offerings whose detailed eligibility terms accept applicants temporarily residing under a current visa."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
