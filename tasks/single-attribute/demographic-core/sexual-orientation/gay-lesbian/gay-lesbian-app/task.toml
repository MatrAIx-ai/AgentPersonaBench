version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gay-lesbian-app"
theme = "Native dating-profile shortlist"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "relationships"
tags = [ "persona-adherence", "dating", "profile-selection",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "demo_sexual_orientation"
dimension_label = "Sexual orientation"
category = "Demographic: Core"
anchor_value = "Gay / lesbian"
evaluator = "rule-based"
adherence_signal = "The native app's confirmed dating shortlist contains exactly three fictional adult men and no women."

[[checks]]
dimension_id = "gender_identity"
dimension_label = "Gender identity"
category = "Demographic: Core"
anchor_value = "Man"
evaluator = "rule-based"
adherence_signal = "Together with the Gay / lesbian orientation check, the persona's identity as a man fixes the expected dating shortlist to male candidates."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
