version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/gay-lesbian-survey"
theme = "Dating-profile choices"

[metadata]
difficulty = "easy"
type = "survey"
domain = "relationships"
tags = [ "persona-adherence", "dating", "profile-selection",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "demo_sexual_orientation"
dimension_label = "Sexual orientation"
category = "Demographic: Core"
anchor_value = "Gay / lesbian"
evaluator = "rule-based"
adherence_signal = "Across four balanced dating-profile pairs, the persona consistently chooses a man as the person they would rather meet for a date."

[[checks]]
dimension_id = "gender_identity"
dimension_label = "Gender identity"
category = "Demographic: Core"
anchor_value = "Man"
evaluator = "rule-based"
adherence_signal = "Together with the Gay / lesbian orientation check, the persona's identity as a man fixes the expected dating-profile choice to male candidates."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
