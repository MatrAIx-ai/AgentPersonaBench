version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/muslim-survey"
theme = "Religious affiliation: Muslim"

[metadata]
difficulty = "medium"
type = "survey"
domain = "food-and-dining"
tags = [ "persona-adherence", "religious-affiliation", "food-choice", "rule-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "demo_religion_affiliation"
dimension_label = "Religious affiliation"
category = "Demographic: Core"
anchor_value = "Muslim"
evaluator = "rule-based"
adherence_signal = "HELD when every selected food and drink avoids explicitly disclosed pork and alcohol; VIOLATED when any selection explicitly contains pork or alcohol."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
