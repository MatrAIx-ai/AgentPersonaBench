version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/non-driver-app"
theme = "Planning a Saturday of errands across the city"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = ["persona-adherence", "driving-status", "single-attribute", "rule-based", "native-gui"]

[[checks]]
dimension_id = "demo_driver_status"
dimension_label = "Driving status"
category = "Demographic: Core"
anchor_value = "Non-driver"
evaluator = "rule-based"
adherence_signal = "Every stop in the confirmed plan is an arrangement in which someone else drives, the goods come to the traveller, or no trip is made - a non-driver never books a car they would have to drive themselves."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
