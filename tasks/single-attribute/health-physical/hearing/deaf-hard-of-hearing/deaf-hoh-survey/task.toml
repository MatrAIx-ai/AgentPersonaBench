version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/deaf-hoh-survey"
theme = "Council services: how residents want to be contacted and informed"

[metadata]
difficulty = "easy"
type = "survey"
domain = "local-services"
tags = ["persona-adherence", "contact-channels", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "health_hearing"
dimension_label = "Hearing"
category = "Health: Physical"
anchor_value = "Deaf / hard of hearing"
evaluator = "rule-based"
adherence_signal = "Across six independent council-service situations the persona always picks the written, captioned or on-screen route and never a phone call, callback, spoken recording or sound-only alert, even where the spoken route is faster, recommended or the default."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
