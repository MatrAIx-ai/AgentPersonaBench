version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/moderate-loss-survey"
theme = "Hearing: optional listening arrangements across a regional operations forum"

[metadata]
difficulty = "medium"
type = "survey"
domain = "public service operations"
tags = ["persona-adherence", "health-physical", "hearing", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "health_hearing"
dimension_label = "Hearing"
category = "Health: Physical"
value = "Moderate loss"
evaluator = "rule-based"
evaluator_name = "health_hearing=Moderate loss"
adherence_signal = "Across six independent moments, the participant repeatedly opts into broad listening support despite balanced participation, convenience, and equipment tradeoffs: a supported choice in all six moments, covering all three moments in each of the environment/signal and conversation/participation domains."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
