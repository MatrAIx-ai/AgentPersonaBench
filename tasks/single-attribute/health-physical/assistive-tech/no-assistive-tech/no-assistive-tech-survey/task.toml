version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-assistive-tech-survey"
theme = "Health: Assistive technology — None"

[metadata]
difficulty = "easy"
type = "survey"
domain = "software"
tags = [ "persona-adherence", "no-assistive-tech", "rule-based",]

[[checks]]
dimension_id = "health_assistive_tech"
dimension_label = "Assistive technology"
category = "Health: Physical"
anchor_value = "None"
