version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/color-blind-survey"
theme = "Transit rider survey: map, screen and timetable display choices"

[metadata]
difficulty = "medium"
type = "survey"
domain = "transport"
tags = ["persona-adherence", "transit", "display-choices", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "health_color_vision"
dimension_label = "Color vision"
category = "Health: Physical"
anchor_value = "Color-blind"
evaluator = "rule-based"
adherence_signal = "In all six display choices the color-blind rider settles on the option whose state is also carried by a printed number, letter, word, symbol, shape or pattern rather than on one told apart by tint alone, even when the tint-only option is the familiar, tidier or quicker-to-scan default."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
