# HOST-SIDE GROUND TRUTH for tests/verifier.py.
#
# The section catalog the app shows, with the hidden per-option fact the verdict
# turns on. It lives in tests/ because tests/ is the only directory the harness
# copies into the environment the verifier runs in; input/ is not there, and on
# the CUA desktop input/ is writable by the agent, so it could never be trusted
# as the source of truth anyway.
#
# The body below is a JSON document (JSON is a subset of YAML, so this file
# parses either way). The verifier strips these '#' lines and reads it with
# json.loads, so it needs no YAML library in the task image.
#
# tests/test_app_headless.py asserts this key is identical to the CATALOG
# literal in input/app/app.py, so the two can never drift apart.
