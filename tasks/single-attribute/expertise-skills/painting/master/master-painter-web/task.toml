version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/master-painter-web"
theme = "Skill: Painting = Master"

[metadata]
difficulty = "medium"
type = "web"
domain = "painting-studio"
tags = [ "persona-adherence", "painting-skill", "studio-decisions", "rule-based", "playwright", "real-web",]

# Stimulus isolation:
# Every option uses the same existing painting, materials budget, and open deadline; the tradeoff is deliberate studio control versus a faster immediately tidy result.
[[checks]]
dimension_id = "skill_painting"
dimension_label = "Skill: Painting"
category = "Expertise: Skills"
anchor_value = "Master"
evaluator = "rule-based"
adherence_signal = "The selected studio decisions consistently use controlled value, color, edge, surface, and revision workflows instead of fast cosmetic shortcuts. Ground truth is each item's data-atelier attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
