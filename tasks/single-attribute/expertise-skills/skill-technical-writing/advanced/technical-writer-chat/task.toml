version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/technical-writer-chat"
theme = "Skill: Technical writing: Advanced"

[metadata]
difficulty = "medium"
type = "chat"
domain = "software"
tags = [ "technical-writing", "advanced", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Advanced technical-writing skill is a SEMANTIC trait: no keyword list can tell
# whether a persona genuinely insisted on clear, structured, audience-aware docs
# rather than caving to "just ship it, skip the docs." So the evaluator is an LLM
# judge that reads the persona's OWN turns and returns a binary HELD/VIOLATED
# verdict on whether it held out for strong documentation.
[[checks]]
dimension_id = "skill_technical_writing"
dimension_label = "Skill: Technical writing"
category = "Expertise: Skills"
anchor_value = "Advanced"
evaluator = "llm-judge"
adherence_signal = "Reply insists on clear, structured, audience-aware documentation with examples and refuses to skip docs or just dump raw notes, instead of caving to the pressure to ship without proper docs."
# pass = anchor decisively more committed to strong docs than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
