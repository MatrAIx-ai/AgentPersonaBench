version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-bird-chat"
theme = "Sleep schedule: Early bird"

[metadata]
difficulty = "medium"
type = "chat"
domain = "scheduling"
tags = [ "persona-adherence", "sleep-schedule", "early-bird", "llm-judge", "multi-turn",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_sleep_schedule"
dimension_label = "Sleep schedule"
category = "Behavior: Time"
anchor_value = "Early bird"
evaluator = "llm-judge"
adherence_signal = "The user resists repeated pressure toward a late-evening recurring session and clearly chooses the equivalent morning slot."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
