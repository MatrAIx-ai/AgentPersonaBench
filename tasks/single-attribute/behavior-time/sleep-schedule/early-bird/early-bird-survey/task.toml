version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-bird-survey"
theme = "Sleep schedule: Early bird"

[metadata]
difficulty = "easy"
type = "survey"
domain = "scheduling"
tags = [ "persona-adherence", "sleep-schedule", "early-bird", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_sleep_schedule"
dimension_label = "Sleep schedule"
category = "Behavior: Time"
value = "Early bird"
evaluator = "rule-based"
adherence_signal = "Every survey answer maps to the persona's Early bird value; any contradictory sleep-schedule value is a violation."
metric = "selected_option_value"

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
