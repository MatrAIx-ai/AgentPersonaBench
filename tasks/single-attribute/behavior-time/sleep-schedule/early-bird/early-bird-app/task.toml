version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-bird-app"
theme = "Sleep schedule: Early bird"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "scheduling"
tags = [ "persona-adherence", "sleep-schedule", "early-bird", "rule-based", "real-app",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_sleep_schedule"
dimension_label = "Sleep schedule"
category = "Behavior: Time"
value = "Early bird"
evaluator = "rule-based"
adherence_signal = "Every app-confirmed scheduling choice maps to the persona's Early bird value; any contradictory sleep-schedule value is a violation."
metric = "selected_option_value"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/timechoice/start-app.sh"
timeout_sec = 60.0
retries = 5
