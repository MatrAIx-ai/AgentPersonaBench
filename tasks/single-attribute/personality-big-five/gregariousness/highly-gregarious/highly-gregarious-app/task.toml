version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-gregarious-app"
theme = "Gregariousness: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "gregariousness", "highly-gregarious", "os-app", "computer-use",]

[[checks]]
dimension_id = "big5_gregariousness"
dimension_label = "Gregariousness"
category = "Personality: Big Five"
attribute = "Gregariousness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_gregariousness=Very high"
# OS-APP env: the persona is a computer-use agent operating Gatherly, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Gatherly writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The weekend the agent plans contains no solitary / keep-to-yourself way to spend it (a high sociability-tier item, tier>=2); a very-gregarious person fills the weekend with being-with-people, group ways to spend it."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Gatherly (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Gatherly once the desktop is up so the agent finds it on screen.
command = "/opt/gatherly/start-gatherly.sh"
timeout_sec = 60.0
retries = 5
