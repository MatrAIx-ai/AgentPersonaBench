version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/small-table-chat"
theme = "Gregariousness = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "retreat_programme_host"
tags = [ "persona-adherence", "gregariousness", "work-retreat", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: small-table.yaml).
# Every option is free, gentle-paced and on the same evenings, with no drinks or exertion implied and equal access to the retreat's people — the pick isolates the persona's appetite for crowds, not its cost, risk or interest in others.
[[checks]]
dimension_id = "big5_gregariousness"
dimension_label = "Gregariousness"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "llm-judge"
adherence_signal = "The retreat's optional bookings are small-scale (a walk-and-talk, a table for two, the reading lounge) with no crowd event booked, even though the crowd events are the pushed 'where the retreat happens' picks at the same times. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
