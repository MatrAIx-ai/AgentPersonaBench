version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/small-table-app"
theme = "Gregariousness = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "gregariousness", "work-retreat", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: small-table.yaml).
# Every option is free, gentle-paced and on the same evenings, with no drinks or exertion implied and equal access to the retreat's people — the pick isolates the persona's appetite for crowds, not its cost, risk or interest in others.
[[checks]]
dimension_id = "big5_gregariousness"
dimension_label = "Gregariousness"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The retreat's optional bookings are small-scale (a walk-and-talk, a table for two, the reading lounge) with no crowd event booked, even though the crowd events are the pushed 'where the retreat happens' picks at the same times. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RetreatApp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RetreatApp once the desktop is up so the agent finds it on screen.
command = "/opt/retreatapp/start-retreatapp.sh"
timeout_sec = 60.0
retries = 5
