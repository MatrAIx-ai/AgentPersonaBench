version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/small-table-survey"
theme = "Gregariousness = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "gregariousness", "work-retreat", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: small-table.yaml).
# Every option is free, gentle-paced and on the same evenings, with no drinks or exertion implied and equal access to the retreat's people — the pick isolates the persona's appetite for crowds, not its cost, risk or interest in others.
[[checks]]
dimension_id = "big5_gregariousness"
dimension_label = "Gregariousness"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The retreat's optional bookings are small-scale (a walk-and-talk, a table for two, the reading lounge) with no crowd event booked, even though the crowd events are the pushed 'where the retreat happens' picks at the same times. Each option id maps to a `crowd` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
