version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-adventurous-chat"
theme = "Adventurousness: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "adventurousness", "highly-adventurous", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Very high adventurousness" is a SEMANTIC trait: no keyword list can tell whether
# a person genuinely reached for the novel, daring, out-of-comfort-zone option over
# the safe, familiar, tried-and-true one. So the evaluator is an LLM judge that reads
# the persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it
# kept seeking the new instead of giving in to the friend's play-it-safe pressure.
[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
attribute = "Adventurousness"
value = "Very high"
evaluator = "llm-judge"
evaluator_name = "big5_adventurousness=Very high"
adherence_signal = "Reply keeps reaching for the novel, daring, out-of-comfort-zone option and resists the friend's push toward the safe, familiar, tried-and-true choice."
# pass = anchor decisively more novelty-seeking than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
