version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-adventurous-app"
theme = "Adventurousness: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "adventurousness", "highly-adventurous", "os-app", "computer-use",]

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
attribute = "Adventurousness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_adventurousness=Very high"
# OS-APP env: the persona is a computer-use agent operating Voyager, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Voyager writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The day the agent plans contains no safe, familiar, tried-and-true option (a high novelty-tier item, tier>=2); a highly-adventurous person fills the day with novel, daring, out-of-comfort-zone plans."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Voyager (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Voyager once the desktop is up so the agent finds it on screen.
command = "/opt/voyager/start-voyager.sh"
timeout_sec = 60.0
retries = 5
