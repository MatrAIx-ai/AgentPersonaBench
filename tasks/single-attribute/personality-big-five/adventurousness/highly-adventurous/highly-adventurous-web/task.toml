version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-adventurous-web"
theme = "Adventurousness: Very high"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "adventurousness", "highly-adventurous", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "big5_adventurousness"
dimension_label = "Adventurousness"
category = "Personality: Big Five"
attribute = "Adventurousness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_adventurousness=Very high"
# Web env: the persona adds plans to a day-plan list on a live page (Playwright).
# Each option's hidden `tier` (0..3) in tests/answer_key.yaml is the ground truth.
# VIOLATED for any safe / familiar / tried-and-true pick (tier >= 2).
adherence_signal = "Day plan built from novel, daring, out-of-comfort-zone options (tier 0-1); no safe, familiar, tried-and-true option (tier >= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
