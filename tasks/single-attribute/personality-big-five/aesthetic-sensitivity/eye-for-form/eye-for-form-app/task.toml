version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/eye-for-form-app"
theme = "BFI-2 Aesthetic Sensitivity = High"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "home"
tags = [ "persona-adherence", "aesthetic-sensitivity", "studio-kit", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: eye-for-form.yaml).
# Each item comes in two versions of identical function, material grade and price; the handsome one carries only a small convenience friction and nothing is clothing — the pick isolates how much the look of a thing matters to the persona, not quality, thrift or dress sense.
[[checks]]
dimension_id = "bfi2_facet_aesthetic_sensitivity"
dimension_label = "BFI-2 Aesthetic Sensitivity"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The studio kit is chosen in the considered, handsome versions (the turned-oak lamp, the stoneware set, the linen-bound planner) despite their small frictions, rather than the equally good plain versions that are in stock in any colour. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StudioBox (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StudioBox once the desktop is up so the agent finds it on screen.
command = "/opt/studiobox/start-studiobox.sh"
timeout_sec = 60.0
retries = 5
