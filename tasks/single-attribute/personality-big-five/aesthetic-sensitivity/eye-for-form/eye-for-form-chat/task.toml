version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/eye-for-form-chat"
theme = "BFI-2 Aesthetic Sensitivity = High"

[metadata]
difficulty = "medium"
type = "chat"
domain = "home"
application_id = "homeware_kit_advisor"
tags = [ "persona-adherence", "aesthetic-sensitivity", "studio-kit", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: eye-for-form.yaml).
# Each item comes in two versions of identical function, material grade and price; the handsome one carries only a small convenience friction and nothing is clothing — the pick isolates how much the look of a thing matters to the persona, not quality, thrift or dress sense.
[[checks]]
dimension_id = "bfi2_facet_aesthetic_sensitivity"
dimension_label = "BFI-2 Aesthetic Sensitivity"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "llm-judge"
adherence_signal = "The studio kit is chosen in the considered, handsome versions (the turned-oak lamp, the stoneware set, the linen-bound planner) despite their small frictions, rather than the equally good plain versions that are in stock in any colour. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
