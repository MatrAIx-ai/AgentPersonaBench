version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/speak-up-app"
theme = "Assertiveness = High"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community"
tags = [ "persona-adherence", "assertiveness", "house-matters", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: speak-up.yaml).
# Each matter is offered two ways that take the same time and are equally reasonable, and neither involves praising oneself — the pick isolates whether the persona speaks up and takes the lead when something matters, not its modesty or sociability.
[[checks]]
dimension_id = "big5_assertiveness"
dimension_label = "Assertiveness"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The month's house matters are handled by raising them directly and in the persona's own name (agenda item, direct request, proposal, refund claim, taking the chair) rather than through the equally reasonable quiet routes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HouseRound (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HouseRound once the desktop is up so the agent finds it on screen.
command = "/opt/houseround/start-houseround.sh"
timeout_sec = 60.0
retries = 5
