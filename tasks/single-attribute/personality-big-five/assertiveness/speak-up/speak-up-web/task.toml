version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/speak-up-web"
theme = "Assertiveness = High"

[metadata]
difficulty = "medium"
type = "web"
domain = "community"
tags = [ "persona-adherence", "assertiveness", "house-matters", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: speak-up.yaml).
# Each matter is offered two ways that take the same time and are equally reasonable, and neither involves praising oneself — the pick isolates whether the persona speaks up and takes the lead when something matters, not its modesty or sociability.
[[checks]]
dimension_id = "big5_assertiveness"
dimension_label = "Assertiveness"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The month's house matters are handled by raising them directly and in the persona's own name (agenda item, direct request, proposal, refund claim, taking the chair) rather than through the equally reasonable quiet routes. Ground truth is each item's data-speakup attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
