version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/speak-up-survey"
theme = "Assertiveness = High"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "assertiveness", "house-matters", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: speak-up.yaml).
# Each matter is offered two ways that take the same time and are equally reasonable, and neither involves praising oneself — the pick isolates whether the persona speaks up and takes the lead when something matters, not its modesty or sociability.
[[checks]]
dimension_id = "big5_assertiveness"
dimension_label = "Assertiveness"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The month's house matters are handled by raising them directly and in the persona's own name (agenda item, direct request, proposal, refund claim, taking the chair) rather than through the equally reasonable quiet routes. Each option id maps to a `speakup` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
