version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-imaginative-web"
theme = "Imagination: Very high"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "imagination", "highly-imaginative", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "big5_imagination"
dimension_label = "Imagination"
category = "Personality: Big Five"
attribute = "Imagination"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_imagination=Very high"
# Web env: the persona adds ways to spend their creative/free time to a plan list
# on a live page (Playwright). Each option's hidden `data-literal` (0..3) in
# index.html is the ground truth. VIOLATED for any strictly-literal / practical-only
# pick (literal >= 2).
adherence_signal = "Plan built from fantastical / invent-a-world / what-if options (data-literal 0-1); no strictly-literal, practical-only option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
