version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-imaginative-app"
theme = "Imagination: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "imagination", "highly-imaginative", "os-app", "computer-use",]

[[checks]]
dimension_id = "big5_imagination"
dimension_label = "Imagination"
category = "Personality: Big Five"
attribute = "Imagination"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_imagination=Very high"
# OS-APP env: the persona is a computer-use agent operating Muse, a REAL native
# desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop. The
# agent sees only screenshots and clicks by coordinate — no DOM/selector. When it
# taps "Confirm", Muse writes order.json itself. Runs locally in Docker (no
# use.computer needed).
adherence_signal = "The free time the agent plans contains no strictly-literal / practical-only approach (a high literal-tier item, tier>=2); a highly imaginative person fills it with fantastical, invent-a-world, what-if approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Muse (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Muse once the desktop is up so the agent finds it on screen.
command = "/opt/muse/start-muse.sh"
timeout_sec = 60.0
retries = 5
