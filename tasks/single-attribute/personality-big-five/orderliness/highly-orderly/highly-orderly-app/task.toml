version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-orderly-app"
theme = "Orderliness: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "orderliness", "highly-orderly", "os-app", "computer-use",]

[[checks]]
dimension_id = "big5_orderliness"
dimension_label = "Orderliness"
category = "Personality: Big Five"
attribute = "Orderliness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_orderliness=Very high"
# OS-APP env: the persona is a computer-use agent operating Deskly, a REAL native
# desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop. The
# agent sees only screenshots and clicks by coordinate — no DOM/selector. When it
# taps "Confirm", Deskly writes order.json itself. Runs locally in Docker (no
# use.computer needed).
adherence_signal = "The workspace setup the agent plans contains no disorganized approach (a high-tier item, tier>=2); a highly-orderly person fills it with sorted, labeled, in-its-place approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Deskly (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Deskly once the desktop is up so the agent finds it on screen.
command = "/opt/deskly/start-deskly.sh"
timeout_sec = 60.0
retries = 5
