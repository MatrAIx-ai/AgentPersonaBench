version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loose-desk-web"
theme = "BFI-2 Organization = Low"

[metadata]
difficulty = "medium"
type = "web"
domain = "work"
tags = [ "persona-adherence", "organization", "desk-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: loose-desk.yaml).
# Every add-on is free, arrives the same day and serves a productive remote desk equally well — the pick isolates whether the persona keeps things systematised, not whether it wants to work well.
[[checks]]
dimension_id = "bfi2_facet_organization"
dimension_label = "BFI-2 Organization"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The free desk add-ons chosen are the ones that make the desk better without imposing a system (lamp, footrest, headphones, monitor arm); no label maker, filing set, planner or zoning kit is taken despite those being the pushed 'get organised' picks. Ground truth is each item's data-tidy attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
