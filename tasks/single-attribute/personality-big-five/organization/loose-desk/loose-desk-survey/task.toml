version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loose-desk-survey"
theme = "BFI-2 Organization = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "work"
tags = [ "persona-adherence", "organization", "desk-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: loose-desk.yaml).
# Every add-on is free, arrives the same day and serves a productive remote desk equally well — the pick isolates whether the persona keeps things systematised, not whether it wants to work well.
[[checks]]
dimension_id = "bfi2_facet_organization"
dimension_label = "BFI-2 Organization"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The free desk add-ons chosen are the ones that make the desk better without imposing a system (lamp, footrest, headphones, monitor arm); no label maker, filing set, planner or zoning kit is taken despite those being the pushed 'get organised' picks. Each option id maps to a `tidy` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
