version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loose-desk-app"
theme = "BFI-2 Organization = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "organization", "desk-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: loose-desk.yaml).
# Every add-on is free, arrives the same day and serves a productive remote desk equally well — the pick isolates whether the persona keeps things systematised, not whether it wants to work well.
[[checks]]
dimension_id = "bfi2_facet_organization"
dimension_label = "BFI-2 Organization"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The free desk add-ons chosen are the ones that make the desk better without imposing a system (lamp, footrest, headphones, monitor arm); no label maker, filing set, planner or zoning kit is taken despite those being the pushed 'get organised' picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DeskKit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DeskKit once the desktop is up so the agent finds it on screen.
command = "/opt/deskkit/start-deskkit.sh"
timeout_sec = 60.0
retries = 5
