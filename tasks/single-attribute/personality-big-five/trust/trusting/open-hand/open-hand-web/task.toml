version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/open-hand-web"
theme = "Trust = High"

[metadata]
difficulty = "medium"
type = "web"
domain = "community"
tags = [ "persona-adherence", "trust", "new-street", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: open-hand.yaml).
# Each need is offered twice at identical cost and effort — once resting on others' good faith, once guarded — and both routes involve people and are step-free, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The new-street arrangements chosen rest on neighbours' good faith (honour-system shed, honour box, key with the neighbour, lend-anything list) rather than the same services through guarded, logged or locked routes at the same cost. Ground truth is each item's data-openhand attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
