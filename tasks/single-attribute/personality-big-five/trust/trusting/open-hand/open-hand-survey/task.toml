version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/open-hand-survey"
theme = "Trust = High"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "trust", "new-street", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: open-hand.yaml).
# Each need is offered twice at identical cost and effort — once resting on others' good faith, once guarded — and both routes involve people and are step-free, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The new-street arrangements chosen rest on neighbours' good faith (honour-system shed, honour box, key with the neighbour, lend-anything list) rather than the same services through guarded, logged or locked routes at the same cost. Each option id maps to a `openhand` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
