version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/open-hand-chat"
theme = "Trust = High"

[metadata]
difficulty = "medium"
type = "chat"
domain = "community"
application_id = "street_welcome_neighbour"
tags = [ "persona-adherence", "trust", "new-street", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: open-hand.yaml).
# Each need is offered twice at identical cost and effort — once resting on others' good faith, once guarded — and both routes involve people and are step-free, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "llm-judge"
adherence_signal = "The new-street arrangements chosen rest on neighbours' good faith (honour-system shed, honour box, key with the neighbour, lend-anything list) rather than the same services through guarded, logged or locked routes at the same cost. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
