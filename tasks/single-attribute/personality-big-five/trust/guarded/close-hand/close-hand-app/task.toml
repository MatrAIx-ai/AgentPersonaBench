version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/close-hand-app"
theme = "Trust = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community"
tags = [ "persona-adherence", "trust", "co-living-hub", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: close-hand.yaml).
# Each need is offered twice at identical cost, effort and access — once resting on strangers' good faith, once guarded — and both routes involve people, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The month's arrangements at the hub run through guarded routes (locker, prepaid card, lockbox, reservation log) and none of the good-faith routes, even though the good-faith routes are the pushed, 'everyone here does it' picks at the same cost. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HubLife (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HubLife once the desktop is up so the agent finds it on screen.
command = "/opt/hublife/start-hublife.sh"
timeout_sec = 60.0
retries = 5
