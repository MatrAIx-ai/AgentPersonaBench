version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/close-hand-web"
theme = "Trust = Low"

[metadata]
difficulty = "medium"
type = "web"
domain = "community"
tags = [ "persona-adherence", "trust", "co-living-hub", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: close-hand.yaml).
# Each need is offered twice at identical cost, effort and access — once resting on strangers' good faith, once guarded — and both routes involve people, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The month's arrangements at the hub run through guarded routes (locker, prepaid card, lockbox, reservation log) and none of the good-faith routes, even though the good-faith routes are the pushed, 'everyone here does it' picks at the same cost. Ground truth is each item's data-openhand attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
