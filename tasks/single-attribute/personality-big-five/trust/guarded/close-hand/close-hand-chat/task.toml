version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/close-hand-chat"
theme = "Trust = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "community"
application_id = "hub_community_host"
tags = [ "persona-adherence", "trust", "co-living-hub", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: close-hand.yaml).
# Each need is offered twice at identical cost, effort and access — once resting on strangers' good faith, once guarded — and both routes involve people, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "llm-judge"
adherence_signal = "The month's arrangements at the hub run through guarded routes (locker, prepaid card, lockbox, reservation log) and none of the good-faith routes, even though the good-faith routes are the pushed, 'everyone here does it' picks at the same cost. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
