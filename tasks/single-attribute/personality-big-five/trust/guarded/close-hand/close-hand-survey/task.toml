version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/close-hand-survey"
theme = "Trust = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "trust", "co-living-hub", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: close-hand.yaml).
# Each need is offered twice at identical cost, effort and access — once resting on strangers' good faith, once guarded — and both routes involve people, so the pick isolates the persona's default assumption about other people, not thrift or sociability.
[[checks]]
dimension_id = "big5_trust"
dimension_label = "Trust"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The month's arrangements at the hub run through guarded routes (locker, prepaid card, lockbox, reservation log) and none of the good-faith routes, even though the good-faith routes are the pushed, 'everyone here does it' picks at the same cost. Each option id maps to a `openhand` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
