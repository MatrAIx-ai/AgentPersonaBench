version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-friendly-app"
theme = "Friendliness: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "friendliness", "highly-friendly", "os-app", "computer-use",]

[[checks]]
dimension_id = "big5_friendliness"
dimension_label = "Friendliness"
category = "Personality: Big Five"
attribute = "Friendliness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_friendliness=Very high"
# OS-APP env: the persona is a computer-use agent operating Mingle, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Mingle writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The plan the agent builds contains no cold / keep-your-distance approach (a high warmth-tier item, tier>=2); a very friendly person fills the plan with warm, approachable, reach-out-to-people approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Mingle (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Mingle once the desktop is up so the agent finds it on screen.
command = "/opt/mingle/start-mingle.sh"
timeout_sec = 60.0
retries = 5
