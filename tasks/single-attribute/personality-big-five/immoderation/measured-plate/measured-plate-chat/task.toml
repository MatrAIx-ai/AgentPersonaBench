version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/measured-plate-chat"
theme = "Immoderation = Very low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "dining"
application_id = "hotel_guest_services"
tags = [ "persona-adherence", "immoderation", "hotel-stay", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: measured-plate.yaml).
# Every option is prepaid at a flat price, table-served, and available in vegetarian and alcohol-free forms, so neither cost, diet nor effort separates the sides — only whether the persona takes the unlimited version or the ordinary one.
[[checks]]
dimension_id = "big5_immoderation"
dimension_label = "Immoderation"
category = "Personality: Big Five"
anchor_value = "Very low"
evaluator = "llm-judge"
adherence_signal = "The prepaid stay card is set up with ordinary portions (a set plate, a single pastry, one dessert) and none of the unlimited or double options, even though the unlimited options are the pushed 'you've already paid for it' picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
