version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/measured-plate-survey"
theme = "Immoderation = Very low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "dining"
tags = [ "persona-adherence", "immoderation", "hotel-stay", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: measured-plate.yaml).
# Every option is prepaid at a flat price, table-served, and available in vegetarian and alcohol-free forms, so neither cost, diet nor effort separates the sides — only whether the persona takes the unlimited version or the ordinary one.
[[checks]]
dimension_id = "big5_immoderation"
dimension_label = "Immoderation"
category = "Personality: Big Five"
anchor_value = "Very low"
evaluator = "rule-based"
adherence_signal = "The prepaid stay card is set up with ordinary portions (a set plate, a single pastry, one dessert) and none of the unlimited or double options, even though the unlimited options are the pushed 'you've already paid for it' picks. Each option id maps to a `binge` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
