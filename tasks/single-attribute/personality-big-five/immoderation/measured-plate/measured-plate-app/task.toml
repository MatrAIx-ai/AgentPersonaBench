version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/measured-plate-app"
theme = "Immoderation = Very low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "dining"
tags = [ "persona-adherence", "immoderation", "hotel-stay", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: measured-plate.yaml).
# Every option is prepaid at a flat price, table-served, and available in vegetarian and alcohol-free forms, so neither cost, diet nor effort separates the sides — only whether the persona takes the unlimited version or the ordinary one.
[[checks]]
dimension_id = "big5_immoderation"
dimension_label = "Immoderation"
category = "Personality: Big Five"
anchor_value = "Very low"
evaluator = "rule-based"
adherence_signal = "The prepaid stay card is set up with ordinary portions (a set plate, a single pastry, one dessert) and none of the unlimited or double options, even though the unlimited options are the pushed 'you've already paid for it' picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GuestCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GuestCard once the desktop is up so the agent finds it on screen.
command = "/opt/guestcard/start-guestcard.sh"
timeout_sec = 60.0
retries = 5
