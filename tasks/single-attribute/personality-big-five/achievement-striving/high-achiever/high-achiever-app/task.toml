version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/high-achiever-app"
theme = "Achievement-striving: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "achievement-striving", "high-achiever", "os-app", "computer-use",]

[[checks]]
dimension_id = "big5_achievement_striving"
dimension_label = "Achievement-striving"
category = "Personality: Big Five"
attribute = "Achievement-striving"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "big5_achievement_striving=Very high"
# OS-APP env: the persona is a computer-use agent operating Aspire, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Aspire writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The plan the agent builds contains no settle-for-the-minimum approach (a high tier item, tier>=2); a very-high achievement-striver fills the plan with aim-high, push-for-more approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Aspire (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Aspire once the desktop is up so the agent finds it on screen.
command = "/opt/aspire/start-aspire.sh"
timeout_sec = 60.0
retries = 5
