version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/high-achiever-chat"
theme = "Achievement-striving: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "personality-big-five", "achievement-striving", "high-achiever", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Very high achievement-striving" is a SEMANTIC trait: no keyword list can tell
# whether a person genuinely insisted on aiming high and pushing for more over
# settling for good-enough. So the evaluator is an LLM judge that reads the
# persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it held
# to aiming high instead of giving in to doing the bare minimum.
[[checks]]
dimension_id = "big5_achievement_striving"
dimension_label = "Achievement-striving"
category = "Personality: Big Five"
attribute = "Achievement-striving"
value = "Very high"
evaluator = "llm-judge"
evaluator_name = "big5_achievement_striving=Very high"
adherence_signal = "Reply insists on aiming high / pushing for an excellent result, refuses to settle for good-enough, and resists the friend's do-the-minimum pressure."
# pass = anchor decisively more ambitious than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
