version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quiet-bio-chat"
theme = "Modesty = High"

[metadata]
difficulty = "medium"
type = "chat"
domain = "work"
application_id = "conference_page_editor"
tags = [ "persona-adherence", "modesty", "speaker-profile", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: quiet-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record, and none concerns colleagues' credit — the pick isolates whether the persona plays down its own standing, not honesty, effort or teamwork.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "llm-judge"
adherence_signal = "The speaker profile is switched on in its understated blocks (awards left off, the plainer title, figures hidden, ribbon declined) rather than the equally true full-record blocks the platform pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
