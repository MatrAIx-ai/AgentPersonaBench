version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quiet-bio-survey"
theme = "Modesty = High"

[metadata]
difficulty = "easy"
type = "survey"
domain = "work"
tags = [ "persona-adherence", "modesty", "speaker-profile", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: quiet-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record, and none concerns colleagues' credit — the pick isolates whether the persona plays down its own standing, not honesty, effort or teamwork.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The speaker profile is switched on in its understated blocks (awards left off, the plainer title, figures hidden, ribbon declined) rather than the equally true full-record blocks the platform pushes. Each option id maps to a `understate` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
