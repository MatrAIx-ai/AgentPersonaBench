version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quiet-bio-app"
theme = "Modesty = High"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "modesty", "speaker-profile", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: quiet-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record, and none concerns colleagues' credit — the pick isolates whether the persona plays down its own standing, not honesty, effort or teamwork.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The speaker profile is switched on in its understated blocks (awards left off, the plainer title, figures hidden, ribbon declined) rather than the equally true full-record blocks the platform pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PagePrep (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PagePrep once the desktop is up so the agent finds it on screen.
command = "/opt/pageprep/start-pageprep.sh"
timeout_sec = 60.0
retries = 5
