version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quiet-bio-web"
theme = "Modesty = High"

[metadata]
difficulty = "medium"
type = "web"
domain = "work"
tags = [ "persona-adherence", "modesty", "speaker-profile", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: quiet-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record, and none concerns colleagues' credit — the pick isolates whether the persona plays down its own standing, not honesty, effort or teamwork.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "The speaker profile is switched on in its understated blocks (awards left off, the plainer title, figures hidden, ribbon declined) rather than the equally true full-record blocks the platform pushes. Ground truth is each item's data-understate attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
