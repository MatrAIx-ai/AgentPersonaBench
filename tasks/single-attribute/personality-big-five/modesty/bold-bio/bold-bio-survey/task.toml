version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bold-bio-survey"
theme = "Modesty = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "work"
tags = [ "persona-adherence", "modesty", "speaker-profile", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: bold-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record — the pick isolates whether the persona plays down its own standing, not honesty or effort.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The speaker profile states the persona's record plainly and in full (awards listed, lead title, numbers shown, badge accepted, own name first) and switches on none of the understated blocks, even though restraint is the pushed, tasteful pick. Each option id maps to a `understate` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
