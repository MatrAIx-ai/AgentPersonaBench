version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bold-bio-app"
theme = "Modesty = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "modesty", "speaker-profile", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: bold-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record — the pick isolates whether the persona plays down its own standing, not honesty or effort.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The speaker profile states the persona's record plainly and in full (awards listed, lead title, numbers shown, badge accepted, own name first) and switches on none of the understated blocks, even though restraint is the pushed, tasteful pick. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ProfileDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ProfileDesk once the desktop is up so the agent finds it on screen.
command = "/opt/profiledesk/start-profiledesk.sh"
timeout_sec = 60.0
retries = 5
