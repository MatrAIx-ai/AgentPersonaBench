version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bold-bio-chat"
theme = "Modesty = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "work"
application_id = "conference_profile_editor"
tags = [ "persona-adherence", "modesty", "speaker-profile", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: bold-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record — the pick isolates whether the persona plays down its own standing, not honesty or effort.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "llm-judge"
adherence_signal = "The speaker profile states the persona's record plainly and in full (awards listed, lead title, numbers shown, badge accepted, own name first) and switches on none of the understated blocks, even though restraint is the pushed, tasteful pick. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
