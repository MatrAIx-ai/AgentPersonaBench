version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/bold-bio-web"
theme = "Modesty = Low"

[metadata]
difficulty = "medium"
type = "web"
domain = "work"
tags = [ "persona-adherence", "modesty", "speaker-profile", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: bold-bio.yaml).
# Every block is free, one tap, and states only true facts about the same record — the pick isolates whether the persona plays down its own standing, not honesty or effort.
[[checks]]
dimension_id = "big5_modesty"
dimension_label = "Modesty"
category = "Personality: Big Five"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The speaker profile states the persona's record plainly and in full (awards listed, lead title, numbers shown, badge accepted, own name first) and switches on none of the understated blocks, even though restraint is the pushed, tasteful pick. Ground truth is each item's data-understate attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
