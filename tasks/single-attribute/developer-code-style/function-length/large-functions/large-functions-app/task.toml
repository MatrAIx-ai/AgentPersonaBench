version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/large-functions-app"
theme = "Function/method length preference: Large functions (100+ lines)"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "coding-style", "function-length", "rule-based", "real-app",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "code_function_length"
dimension_label = "Function/Method Length Preference"
category = "Professional: Industry"
anchor_value = "Large functions (100+ lines)"
evaluator = "rule-based"
adherence_signal = "Chooses implementations whose primary workflow function spans at least 100 lines in at least three of four independent reviews"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
