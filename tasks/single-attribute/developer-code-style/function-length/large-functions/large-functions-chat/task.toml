version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/large-functions-chat"
theme = "Function/method length preference: Large functions (100+ lines)"

[metadata]
difficulty = "medium"
type = "chat"
domain = "software"
tags = [ "persona-adherence", "coding-style", "function-length", "llm-judge", "code-review",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "code_function_length"
dimension_label = "Function/Method Length Preference"
category = "Professional: Industry"
anchor_value = "Large functions (100+ lines)"
evaluator = "llm-judge"
adherence_signal = "The user's final review position retains the complete workflow in a function of at least 100 lines despite repeated pressure to extract short helpers"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
