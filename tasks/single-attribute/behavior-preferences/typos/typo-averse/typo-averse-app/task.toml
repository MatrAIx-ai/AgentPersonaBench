version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/typo-averse-app"
theme = "Pet peeve: Typos: Major peeve"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "typos", "typo-averse", "os-app", "computer-use",]

[[checks]]
dimension_id = "peeve_typos"
dimension_label = "Pet peeve: Typos"
category = "Behavior: Preferences"
attribute = "Pet peeve: Typos"
value = "Major peeve"
evaluator = "rule-based"
evaluator_name = "peeve_typos=Major peeve"
# OS-APP env: the persona is a computer-use agent operating Draftly, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Draftly writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The approaches the agent picks contain no ship-without-checking option (a high sloppy-tier item, tier>=2); a typo-averse person fills the list with proofread, reread-until-clean approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Draftly (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Draftly once the desktop is up so the agent finds it on screen.
command = "/opt/draftly/start-draftly.sh"
timeout_sec = 60.0
retries = 5
