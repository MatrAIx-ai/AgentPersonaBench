version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/typo-averse-chat"
theme = "Pet peeve: Typos: Major peeve"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "typos", "typo-averse", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Typo-averse" is a SEMANTIC trait: no keyword list can tell whether a person
# genuinely insisted on proofreading and refused to ship writing with mistakes in
# it. So the evaluator is an LLM judge that reads the persona's OWN turns and
# returns a binary HELD/VIOLATED verdict on whether it held to checking the
# writing carefully instead of firing it off with typos.
[[checks]]
dimension_id = "peeve_typos"
dimension_label = "Pet peeve: Typos"
category = "Behavior: Preferences"
attribute = "Pet peeve: Typos"
value = "Major peeve"
evaluator = "llm-judge"
evaluator_name = "peeve_typos=Major peeve"
adherence_signal = "Reply insists on proofreading / rereading before sending, wants the writing clean and error-free, and resists the friend's just-send-it-with-typos pressure."
# pass = anchor decisively more careful-about-errors than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
