version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/typo-averse-web"
theme = "Pet peeve: Typos: Major peeve"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "typos", "typo-averse", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "peeve_typos"
dimension_label = "Pet peeve: Typos"
category = "Behavior: Preferences"
attribute = "Pet peeve: Typos"
value = "Major peeve"
evaluator = "rule-based"
evaluator_name = "peeve_typos=Major peeve"
# Web env: the persona adds ways of sending/reviewing writing to a list on a live
# page (Playwright). Each option's hidden `data-sloppy` (0..3) in index.html is the
# ground truth. VIOLATED for any ship-without-checking pick (sloppy >= 2).
adherence_signal = "List built from proofread / reread-until-clean options (data-sloppy 0-1); no ship-without-checking option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
