version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/punctual-chat"
theme = "Pet peeve: Lateness: Major peeve"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "peeve_lateness", "punctual", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Punctual" (lateness a major pet peeve) is a SEMANTIC trait: no keyword list can
# tell whether a person genuinely insisted on being on time and keeping to the plan
# over relaxing and running late. So the evaluator is an LLM judge that reads the
# persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it held
# to being on time instead of giving in to running late / letting deadlines drift.
[[checks]]
dimension_id = "peeve_lateness"
dimension_label = "Pet peeve: Lateness"
category = "Behavior: Preferences"
attribute = "Pet peeve: Lateness"
value = "Major peeve"
evaluator = "llm-judge"
evaluator_name = "peeve_lateness=Major peeve"
adherence_signal = "Reply insists on being on time / leaving a buffer / treating deadlines as firm, and resists the friend's run-late, let-it-slide pressure."
# pass = anchor decisively more on-time than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
