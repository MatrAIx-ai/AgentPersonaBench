version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/every-detail-survey"
theme = "Brief vs full detail = Every detail"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "detail-preference", "rental-briefing", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: every-detail.yaml).
# Every document is free and loads instantly, so reading time is the only lure and the pick isolates depth-of-detail preference.
[[checks]]
dimension_id = "pref_detail_brief_vs_full"
dimension_label = "Brief vs full detail"
category = "Behavior: Preferences"
anchor_value = "Every detail"
evaluator = "rule-based"
adherence_signal = "The loaded briefing pack is the complete documents (full handbook, route dossier, spec sheets) rather than the skim versions, despite the skims being pitched as all-you-need. Each option id maps to a `skim` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
