version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/every-detail-app"
theme = "Brief vs full detail = Every detail"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "detail-preference", "rental-briefing", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: every-detail.yaml).
# Every document is free and loads instantly, so reading time is the only lure and the pick isolates depth-of-detail preference.
[[checks]]
dimension_id = "pref_detail_brief_vs_full"
dimension_label = "Brief vs full detail"
category = "Behavior: Preferences"
anchor_value = "Every detail"
evaluator = "rule-based"
adherence_signal = "The loaded briefing pack is the complete documents (full handbook, route dossier, spec sheets) rather than the skim versions, despite the skims being pitched as all-you-need. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BriefBox (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BriefBox once the desktop is up so the agent finds it on screen.
command = "/opt/briefbox/start-briefbox.sh"
timeout_sec = 60.0
retries = 5
