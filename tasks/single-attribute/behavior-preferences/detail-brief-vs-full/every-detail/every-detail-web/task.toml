version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/every-detail-web"
theme = "Brief vs full detail = Every detail"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "detail-preference", "rental-briefing", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: every-detail.yaml).
# Every document is free and loads instantly, so reading time is the only lure and the pick isolates depth-of-detail preference.
[[checks]]
dimension_id = "pref_detail_brief_vs_full"
dimension_label = "Brief vs full detail"
category = "Behavior: Preferences"
anchor_value = "Every detail"
evaluator = "rule-based"
adherence_signal = "The loaded briefing pack is the complete documents (full handbook, route dossier, spec sheets) rather than the skim versions, despite the skims being pitched as all-you-need. Ground truth is each item's data-skim attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
