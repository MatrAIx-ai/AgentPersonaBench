version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-outdoor-web"
theme = "Indoor vs outdoor = Strongly outdoor"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "indoor-vs-outdoor", "strongly-outdoor", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-outdoor.yaml).
# All options are free and solo-friendly with weather shown as fine, so comfort/effort is the only lure and the pick isolates the indoor/outdoor preference.
[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
anchor_value = "Strongly outdoor"
evaluator = "rule-based"
adherence_signal = "Every pick for the free Saturday is an open-air plan; no all-indoor option is chosen despite the indoor picks being the comfortable, zero-prep path. Ground truth is each item's data-indoor attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
