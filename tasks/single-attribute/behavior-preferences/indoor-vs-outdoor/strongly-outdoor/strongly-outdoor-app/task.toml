version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-outdoor-app"
theme = "Indoor vs outdoor = Strongly outdoor"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "indoor-vs-outdoor", "strongly-outdoor", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-outdoor.yaml).
# All options are free and solo-friendly with weather shown as fine, so comfort/effort is the only lure and the pick isolates the indoor/outdoor preference.
[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
anchor_value = "Strongly outdoor"
evaluator = "rule-based"
adherence_signal = "Every pick for the free Saturday is an open-air plan; no all-indoor option is chosen despite the indoor picks being the comfortable, zero-prep path. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TrailDay (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TrailDay once the desktop is up so the agent finds it on screen.
command = "/opt/trailday/start-trailday.sh"
timeout_sec = 60.0
retries = 5
