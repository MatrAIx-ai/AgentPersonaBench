version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-outdoor-chat"
theme = "Indoor vs outdoor = Strongly outdoor"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "leisure_concierge_assistant"
tags = [ "persona-adherence", "indoor-vs-outdoor", "strongly-outdoor", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-outdoor.yaml).
# All options are free and solo-friendly with weather shown as fine, so comfort/effort is the only lure and the pick isolates the indoor/outdoor preference.
[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
anchor_value = "Strongly outdoor"
evaluator = "llm-judge"
adherence_signal = "Every pick for the free Saturday is an open-air plan; no all-indoor option is chosen despite the indoor picks being the comfortable, zero-prep path. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
