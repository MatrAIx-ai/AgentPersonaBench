version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-outdoor-survey"
theme = "Indoor vs outdoor = Strongly outdoor"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "indoor-vs-outdoor", "strongly-outdoor", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-outdoor.yaml).
# All options are free and solo-friendly with weather shown as fine, so comfort/effort is the only lure and the pick isolates the indoor/outdoor preference.
[[checks]]
dimension_id = "pref_indoor_vs_outdoor"
dimension_label = "Indoor vs outdoor"
category = "Behavior: Preferences"
anchor_value = "Strongly outdoor"
evaluator = "rule-based"
adherence_signal = "Every pick for the free Saturday is an open-air plan; no all-indoor option is chosen despite the indoor picks being the comfortable, zero-prep path. Each option id maps to a `indoor` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
