version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/major-peeve-app"
theme = "Native shopping: reactions to non-blocking promotional windows"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "online-shopping"
tags = ["persona-adherence", "pop-up-ads", "single-attribute", "rule-based", "native-gui"]

[[checks]]
dimension_id = "peeve_pop_up_ads"
dimension_label = "Pet peeve: Pop-up ads"
category = "Behavior: Preferences"
anchor_value = "Major peeve"
evaluator = "rule-based"
adherence_signal = "While completing an otherwise unobstructed native-app purchase, the persona explicitly closes every independently triggered promotional window."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
