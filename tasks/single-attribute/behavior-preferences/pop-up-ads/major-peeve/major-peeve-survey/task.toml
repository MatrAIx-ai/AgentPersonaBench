version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/major-peeve-survey"
theme = "Shopping promotions: display-format choices"

[metadata]
difficulty = "easy"
type = "survey"
domain = "online-shopping"
tags = ["persona-adherence", "pop-up-ads", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "peeve_pop_up_ads"
dimension_label = "Pet peeve: Pop-up ads"
category = "Behavior: Preferences"
anchor_value = "Major peeve"
evaluator = "rule-based"
adherence_signal = "Across six independent shopping scenarios, the persona consistently chooses a non-pop-up format for otherwise equivalent promotional content."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
