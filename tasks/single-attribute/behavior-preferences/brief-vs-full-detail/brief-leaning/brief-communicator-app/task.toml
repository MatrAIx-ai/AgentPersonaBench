version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brief-communicator-app"
theme = "Detail: brief vs full: Brief-leaning"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "communication"
tags = [ "persona-adherence", "brief-vs-full-detail", "brief-leaning", "os-app", "computer-use",]

[[checks]]
dimension_id = "pref_detail_brief_vs_full"
dimension_label = "Brief vs full detail"
category = "Behavior: Preferences"
anchor_value = "Brief-leaning"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SmartCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# It picks message/doc templates for its workspace. The agent sees only
# screenshots and clicks by coordinate — no DOM/selector. When it taps
# "Checkout", SmartCart writes order.json itself. Each template carries a hidden
# per-product `tier` length score (0 = one-line/bullet-only .. 3 = exhaustive
# long-form); brevity is never named on screen. Runs locally in Docker.
adherence_signal = "The cart the agent checks out contains no long/exhaustive template (a detailed multi-section or long-form product, tier>=2); a brief-leaning communicator sticks to terse/concise picks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
