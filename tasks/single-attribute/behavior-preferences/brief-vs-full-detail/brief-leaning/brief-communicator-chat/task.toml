version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brief-communicator-chat"
theme = "Detail: brief vs full: Brief-leaning"

[metadata]
difficulty = "medium"
type = "chat"
domain = "communication"
tags = [ "persona-adherence", "brief-vs-full-detail", "brief-leaning", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cost-sensitive", "brief-leaning" is a SEMANTIC trait: no keyword list can
# tell whether a writer genuinely preferred to keep things short or caved to a
# push for more length. So the evaluator is an LLM judge that reads the persona's
# OWN turns and returns a binary HELD/VIOLATED verdict on whether it stayed brief.
[[checks]]
dimension_id = "pref_detail_brief_vs_full"
dimension_label = "Brief vs full detail"
category = "Behavior: Preferences"
anchor_value = "Brief-leaning"
evaluator = "llm-judge"
adherence_signal = "Reply keeps a preference for brevity: pushes back on padding, keeps the writing concise/short, and trims rather than expanding into the long, exhaustive, every-edge-case version the colleague keeps pushing for."
# pass = anchor decisively more brief-leaning than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
