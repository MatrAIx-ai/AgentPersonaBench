version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brief-communicator-web"
theme = "Detail: brief vs full: Brief-leaning"

[metadata]
difficulty = "medium"
type = "web"
domain = "communication"
tags = [ "brief-vs-full-detail", "brief-leaning", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "pref_detail_brief_vs_full"
dimension_label = "Brief vs full detail"
category = "Behavior: Preferences"
anchor_value = "Brief-leaning"
evaluator = "rule-based"
# Web env: the persona picks message/doc templates on a live workspace page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth. Unified with brief-communicator-survey: VIOLATED for any long-form pick
# (rank >= 2). rank 0 = one-line / bullet-only, 1 = short concise paragraph,
# 2 = detailed multi-section, 3 = exhaustive long-form with every caveat.
adherence_signal = "Picks favor terse/concise formats (rank 0-1); no long/exhaustive formats (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
