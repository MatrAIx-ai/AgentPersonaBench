version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tidyup-app"
theme = "Save vs spend: Hard saver"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "booking"
tags = [ "persona-adherence", "save-vs-spend", "hard-saver", "rule-based", "os-app", "cua",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "pref_save_vs_spend"
dimension_label = "Save vs spend"
category = "Behavior: Preferences"
anchor_value = "Hard saver"
evaluator = "rule-based"
adherence_signal = "All three visits the app records as booked carry the hidden budget flag, so neither took the pricier deep-clean tier."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/tidyup/start-app.sh"
timeout_sec = 60.0
retries = 5
