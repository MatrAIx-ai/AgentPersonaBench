version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/clickbait-averse-app"
theme = "Pet peeve: Clickbait: Major peeve"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "clickbait", "clickbait-averse", "os-app", "computer-use",]

[[checks]]
dimension_id = "peeve_clickbait"
dimension_label = "Pet peeve: Clickbait"
category = "Behavior: Preferences"
attribute = "Pet peeve: Clickbait"
value = "Major peeve"
evaluator = "rule-based"
evaluator_name = "peeve_clickbait=Major peeve"
# OS-APP env: the persona is a computer-use agent operating Newsstand, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Newsstand writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The feed the agent builds contains no sensational clickbait / outrage-bait source (a high-tier item, tier>=2); a clickbait-averse person fills their feed with plain, honest, straightforward headlines."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Newsstand (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Newsstand once the desktop is up so the agent finds it on screen.
command = "/opt/newsstand/start-newsstand.sh"
timeout_sec = 60.0
retries = 5
