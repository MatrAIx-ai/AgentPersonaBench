version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-planned-survey"
theme = "Plan vs spontaneous: Highly planned"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "plan-vs-spontaneous", "highly-planned", "rule-based", "choice-based",]

[[checks]]
dimension_id = "pref_plan_vs_spontaneous"
dimension_label = "Planned vs spontaneous"
category = "Behavior: Preferences"
anchor_value = "Highly planned"
evaluator = "rule-based"
# Survey env: three upcoming occasions, each pairing book-ahead options against
# genuinely appealing keep-it-open options (freedom, serendipity, no lock-in).
# Each option id maps to a `spontaneous` label in tests/answer_key.yaml
# (host-side only) — the check is over option ids.
adherence_signal = "Every selected option is the book-ahead/lock-it-in choice; no keep-it-open/decide-on-the-day option is chosen, despite their genuine appeal."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
