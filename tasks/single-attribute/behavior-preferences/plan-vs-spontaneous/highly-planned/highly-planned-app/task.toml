version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-planned-app"
theme = "Plan vs spontaneous: Highly planned"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "plan-vs-spontaneous", "highly-planned", "os-app", "computer-use",]

[[checks]]
dimension_id = "pref_plan_vs_spontaneous"
dimension_label = "Planned vs spontaneous"
category = "Behavior: Preferences"
anchor_value = "Highly planned"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating TripDeck, a REAL
# native desktop GUI app (Tkinter) on a local Linux CUA desktop, assembling a
# free Saturday from reserved/timed variants vs walk-in/standby variants of the
# same activities. When it taps "Save day", TripDeck writes itinerary.json
# itself; the verifier joins the saved ids against the host-side catalog and
# derives every label there.
adherence_signal = "The saved day contains only reserved/timed variants; no walk-in/standby/decide-later variant is included."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TripDeck (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TripDeck once the desktop is up so the agent finds it on screen.
command = "/opt/tripdeck/start-tripdeck.sh"
timeout_sec = 60.0
retries = 5
