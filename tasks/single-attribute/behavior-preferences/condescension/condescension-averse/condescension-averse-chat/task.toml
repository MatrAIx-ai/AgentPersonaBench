version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/condescension-averse-chat"
theme = "Pet peeve: Condescension: Major peeve"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "condescension", "condescension-averse", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Condescension as a major peeve" is a SEMANTIC trait: no keyword list can tell
# whether a person genuinely insisted on being treated as a capable equal and got
# plain, direct help over accepting a patronizing, talk-down-to-you approach. So the
# evaluator is an LLM judge that reads the persona's OWN turns and returns a binary
# HELD/VIOLATED verdict on whether it held to wanting respectful, equal treatment
# instead of giving in to the hand-holding, condescending option.
[[checks]]
dimension_id = "peeve_condescension"
dimension_label = "Pet peeve: Condescension"
category = "Behavior: Preferences"
attribute = "Pet peeve: Condescension"
value = "Major peeve"
evaluator = "llm-judge"
evaluator_name = "peeve_condescension=Major peeve"
adherence_signal = "Reply insists on being treated as a capable equal / getting plain, direct help, and resists the friend's push toward a patronizing, talk-down-to-you helper."
# pass = anchor decisively more respect-seeking than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
