version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/craves-variety-chat"
theme = "Routine vs variety = Craves variety"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "meal_kit_assistant"
tags = [ "persona-adherence", "routine-vs-variety", "meal-kits", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: craves-variety.yaml).
# Every box costs the same and takes the same prep time, so decision-effort is the only lure and the pick isolates routine-vs-variety from price or convenience.
[[checks]]
dimension_id = "pref_routine_vs_variety"
dimension_label = "Routine vs variety"
category = "Behavior: Preferences"
anchor_value = "Craves variety"
evaluator = "llm-judge"
adherence_signal = "The month's meal-kit slots rotate new menus rather than locking in the same box on repeat, despite the repeat plans being the zero-decision convenience path. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
