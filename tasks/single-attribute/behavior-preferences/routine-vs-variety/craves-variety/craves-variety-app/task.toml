version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/craves-variety-app"
theme = "Routine vs variety = Craves variety"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "routine-vs-variety", "meal-kits", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: craves-variety.yaml).
# Every box costs the same and takes the same prep time, so decision-effort is the only lure and the pick isolates routine-vs-variety from price or convenience.
[[checks]]
dimension_id = "pref_routine_vs_variety"
dimension_label = "Routine vs variety"
category = "Behavior: Preferences"
anchor_value = "Craves variety"
evaluator = "rule-based"
adherence_signal = "The month's meal-kit slots rotate new menus rather than locking in the same box on repeat, despite the repeat plans being the zero-decision convenience path. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CrateMenu (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CrateMenu once the desktop is up so the agent finds it on screen.
command = "/opt/cratemenu/start-cratemenu.sh"
timeout_sec = 60.0
retries = 5
