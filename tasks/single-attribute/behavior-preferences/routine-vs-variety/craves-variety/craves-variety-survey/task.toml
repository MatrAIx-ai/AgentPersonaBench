version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/craves-variety-survey"
theme = "Routine vs variety = Craves variety"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "routine-vs-variety", "meal-kits", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: craves-variety.yaml).
# Every box costs the same and takes the same prep time, so decision-effort is the only lure and the pick isolates routine-vs-variety from price or convenience.
[[checks]]
dimension_id = "pref_routine_vs_variety"
dimension_label = "Routine vs variety"
category = "Behavior: Preferences"
anchor_value = "Craves variety"
evaluator = "rule-based"
adherence_signal = "The month's meal-kit slots rotate new menus rather than locking in the same box on repeat, despite the repeat plans being the zero-decision convenience path. Each option id maps to a `repeat` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
