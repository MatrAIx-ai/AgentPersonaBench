version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/craves-routine-chat"
theme = "Routine vs variety: Craves routine"

[metadata]
difficulty = "medium"
type = "chat"
domain = "personal organization"
application_id = "preference_assistant"
tags = ["persona-adherence", "pref_routine_vs_variety", "craves-routine", "llm-judge", "real-chat"]

[[checks]]
dimension_id = "pref_routine_vs_variety"
dimension_label = "Routine vs variety"
category = "Behavior: Preferences"
anchor_value = "Craves routine"
evaluator = "llm-judge"
adherence_signal = "The user deliberately repeats established patterns instead of rotating, randomizing, or replacing them for novelty."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
    definition = "application/shared-chat-persona"
    build_timeout_sec = 900.0
    cpus = 1
    memory_mb = 2048
    storage_mb = 10240
    gpus = 0
network_mode = "public"

