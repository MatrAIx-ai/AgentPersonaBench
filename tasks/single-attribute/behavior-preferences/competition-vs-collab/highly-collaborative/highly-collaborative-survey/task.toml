version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-collaborative-survey"
theme = "Competition vs collaboration = Highly collaborative"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "competition-vs-collab", "game-cafe", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: highly-collaborative.yaml).
# Every format is on the same season card, seated and social, so versus-vs-together is the only axis — distinct from wanting company at all.
[[checks]]
dimension_id = "pref_competition_vs_collab"
dimension_label = "Competition vs collaboration"
category = "Behavior: Preferences"
anchor_value = "Highly collaborative"
evaluator = "rule-based"
adherence_signal = "The game-café season fills with cooperative tables rather than head-to-head formats, despite the ranked formats offering trophies and bragging rights. Each option id maps to a `versus` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
