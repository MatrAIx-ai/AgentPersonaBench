version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-collaborative-app"
theme = "Competition vs collaboration = Highly collaborative"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "competition-vs-collab", "game-cafe", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: highly-collaborative.yaml).
# Every format is on the same season card, seated and social, so versus-vs-together is the only axis — distinct from wanting company at all.
[[checks]]
dimension_id = "pref_competition_vs_collab"
dimension_label = "Competition vs collaboration"
category = "Behavior: Preferences"
anchor_value = "Highly collaborative"
evaluator = "rule-based"
adherence_signal = "The game-café season fills with cooperative tables rather than head-to-head formats, despite the ranked formats offering trophies and bragging rights. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MeepleDock (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MeepleDock once the desktop is up so the agent finds it on screen.
command = "/opt/meepledock/start-meepledock.sh"
timeout_sec = 60.0
retries = 5
