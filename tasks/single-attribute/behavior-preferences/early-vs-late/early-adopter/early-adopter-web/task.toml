version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-adopter-web"
theme = "Early vs late adopter = Early adopter"

[metadata]
difficulty = "medium"
type = "web"
domain = "tech"
tags = [ "persona-adherence", "early-vs-late", "device-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: early-adopter.yaml).
# All options are free, reversible and privacy-neutral, so polish-vs-freshness is the only axis and the pick isolates adoption timing from cost or privacy concerns.
[[checks]]
dimension_id = "pref_early_vs_late"
dimension_label = "Early vs late adopter"
category = "Behavior: Preferences"
anchor_value = "Early adopter"
evaluator = "rule-based"
adherence_signal = "Every setup slot lands on the ships-today option rather than the wait-for-proven fallback, despite the fallback being pitched as the safe, polished default. Ground truth is each item's data-holdback attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
