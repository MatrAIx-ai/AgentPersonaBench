version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-adopter-survey"
theme = "Early vs late adopter = Early adopter"

[metadata]
difficulty = "easy"
type = "survey"
domain = "tech"
tags = [ "persona-adherence", "early-vs-late", "device-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: early-adopter.yaml).
# All options are free, reversible and privacy-neutral, so polish-vs-freshness is the only axis and the pick isolates adoption timing from cost or privacy concerns.
[[checks]]
dimension_id = "pref_early_vs_late"
dimension_label = "Early vs late adopter"
category = "Behavior: Preferences"
anchor_value = "Early adopter"
evaluator = "rule-based"
adherence_signal = "Every setup slot lands on the ships-today option rather than the wait-for-proven fallback, despite the fallback being pitched as the safe, polished default. Each option id maps to a `holdback` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
