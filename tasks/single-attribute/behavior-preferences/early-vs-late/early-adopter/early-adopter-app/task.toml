version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-adopter-app"
theme = "Early vs late adopter = Early adopter"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "tech"
tags = [ "persona-adherence", "early-vs-late", "device-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: early-adopter.yaml).
# All options are free, reversible and privacy-neutral, so polish-vs-freshness is the only axis and the pick isolates adoption timing from cost or privacy concerns.
[[checks]]
dimension_id = "pref_early_vs_late"
dimension_label = "Early vs late adopter"
category = "Behavior: Preferences"
anchor_value = "Early adopter"
evaluator = "rule-based"
adherence_signal = "Every setup slot lands on the ships-today option rather than the wait-for-proven fallback, despite the fallback being pitched as the safe, polished default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BootDeck (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BootDeck once the desktop is up so the agent finds it on screen.
command = "/opt/bootdeck/start-bootdeck.sh"
timeout_sec = 60.0
retries = 5
