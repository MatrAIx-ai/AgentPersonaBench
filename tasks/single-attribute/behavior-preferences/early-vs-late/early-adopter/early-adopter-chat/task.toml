version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/early-adopter-chat"
theme = "Early vs late adopter = Early adopter"

[metadata]
difficulty = "medium"
type = "chat"
domain = "tech"
application_id = "device_setup_assistant"
tags = [ "persona-adherence", "early-vs-late", "device-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: early-adopter.yaml).
# All options are free, reversible and privacy-neutral, so polish-vs-freshness is the only axis and the pick isolates adoption timing from cost or privacy concerns.
[[checks]]
dimension_id = "pref_early_vs_late"
dimension_label = "Early vs late adopter"
category = "Behavior: Preferences"
anchor_value = "Early adopter"
evaluator = "llm-judge"
adherence_signal = "Every setup slot lands on the ships-today option rather than the wait-for-proven fallback, despite the fallback being pitched as the safe, polished default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
