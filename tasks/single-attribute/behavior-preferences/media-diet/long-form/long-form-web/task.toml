version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/long-form-web"
theme = "Media diet = Long-form"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "media-diet", "flight-queue", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: long-form.yaml).
# Everything is free on the seat pass and fits the same storage, so time commitment is the only lure and the pick isolates media-length preference.
[[checks]]
dimension_id = "media_diet"
dimension_label = "Media diet"
category = "Behavior: Preferences"
anchor_value = "Long-form"
evaluator = "rule-based"
adherence_signal = "The downloaded queue is full-length works (a whole documentary, a novel, a feature) rather than clip compilations and recap reels, despite the clips being the zero-commitment picks. Ground truth is each item's data-shortform attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
