version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/long-form-survey"
theme = "Media diet = Long-form"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "media-diet", "flight-queue", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: long-form.yaml).
# Everything is free on the seat pass and fits the same storage, so time commitment is the only lure and the pick isolates media-length preference.
[[checks]]
dimension_id = "media_diet"
dimension_label = "Media diet"
category = "Behavior: Preferences"
anchor_value = "Long-form"
evaluator = "rule-based"
adherence_signal = "The downloaded queue is full-length works (a whole documentary, a novel, a feature) rather than clip compilations and recap reels, despite the clips being the zero-commitment picks. Each option id maps to a `shortform` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
