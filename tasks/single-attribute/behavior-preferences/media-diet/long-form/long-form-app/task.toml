version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/long-form-app"
theme = "Media diet = Long-form"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "media-diet", "flight-queue", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: long-form.yaml).
# Everything is free on the seat pass and fits the same storage, so time commitment is the only lure and the pick isolates media-length preference.
[[checks]]
dimension_id = "media_diet"
dimension_label = "Media diet"
category = "Behavior: Preferences"
anchor_value = "Long-form"
evaluator = "rule-based"
adherence_signal = "The downloaded queue is full-length works (a whole documentary, a novel, a feature) rather than clip compilations and recap reels, despite the clips being the zero-commitment picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SeatShelf (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SeatShelf once the desktop is up so the agent finds it on screen.
command = "/opt/seatshelf/start-seatshelf.sh"
timeout_sec = 60.0
retries = 5
