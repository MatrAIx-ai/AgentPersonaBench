version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/long-form-chat"
theme = "Media diet = Long-form"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "cabin_entertainment_assistant"
tags = [ "persona-adherence", "media-diet", "flight-queue", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: long-form.yaml).
# Everything is free on the seat pass and fits the same storage, so time commitment is the only lure and the pick isolates media-length preference.
[[checks]]
dimension_id = "media_diet"
dimension_label = "Media diet"
category = "Behavior: Preferences"
anchor_value = "Long-form"
evaluator = "llm-judge"
adherence_signal = "The downloaded queue is full-length works (a whole documentary, a novel, a feature) rather than clip compilations and recap reels, despite the clips being the zero-commitment picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
