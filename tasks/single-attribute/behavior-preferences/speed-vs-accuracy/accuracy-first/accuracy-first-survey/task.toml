version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/accuracy-first-survey"
theme = "Speed vs accuracy = Accuracy first"

[metadata]
difficulty = "easy"
type = "survey"
domain = "services"
tags = [ "persona-adherence", "speed-vs-accuracy", "service-tiers", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: accuracy-first.yaml).
# Both tiers cost the same and nothing is urgent in the brief, so turnaround-vs-care is the only axis and the pick isolates the speed/care preference.
[[checks]]
dimension_id = "pref_speed_vs_accuracy"
dimension_label = "Speed vs accuracy"
category = "Behavior: Preferences"
anchor_value = "Accuracy first"
evaluator = "rule-based"
adherence_signal = "Every commissioned job goes to the triple-checked tier rather than the same-day express tier, despite express being pitched as done-by-tonight at the same price. Each option id maps to a `rushed` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
