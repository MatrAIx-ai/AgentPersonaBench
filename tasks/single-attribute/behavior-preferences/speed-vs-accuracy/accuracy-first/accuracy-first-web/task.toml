version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/accuracy-first-web"
theme = "Speed vs accuracy = Accuracy first"

[metadata]
difficulty = "medium"
type = "web"
domain = "services"
tags = [ "persona-adherence", "speed-vs-accuracy", "service-tiers", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: accuracy-first.yaml).
# Both tiers cost the same and nothing is urgent in the brief, so turnaround-vs-care is the only axis and the pick isolates the speed/care preference.
[[checks]]
dimension_id = "pref_speed_vs_accuracy"
dimension_label = "Speed vs accuracy"
category = "Behavior: Preferences"
anchor_value = "Accuracy first"
evaluator = "rule-based"
adherence_signal = "Every commissioned job goes to the triple-checked tier rather than the same-day express tier, despite express being pitched as done-by-tonight at the same price. Ground truth is each item's data-rushed attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
