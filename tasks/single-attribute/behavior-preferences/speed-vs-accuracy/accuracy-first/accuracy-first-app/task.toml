version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/accuracy-first-app"
theme = "Speed vs accuracy = Accuracy first"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "services"
tags = [ "persona-adherence", "speed-vs-accuracy", "service-tiers", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: accuracy-first.yaml).
# Both tiers cost the same and nothing is urgent in the brief, so turnaround-vs-care is the only axis and the pick isolates the speed/care preference.
[[checks]]
dimension_id = "pref_speed_vs_accuracy"
dimension_label = "Speed vs accuracy"
category = "Behavior: Preferences"
anchor_value = "Accuracy first"
evaluator = "rule-based"
adherence_signal = "Every commissioned job goes to the triple-checked tier rather than the same-day express tier, despite express being pitched as done-by-tonight at the same price. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TierPick (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TierPick once the desktop is up so the agent finds it on screen.
command = "/opt/tierpick/start-tierpick.sh"
timeout_sec = 60.0
retries = 5
