version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nature-lover-chat"
theme = "City vs nature: Prefers nature"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
tags = [ "persona-adherence", "city-vs-nature", "prefers-nature", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cost-sensitive", "prefers nature" is a SEMANTIC trait: no keyword list can
# tell whether someone genuinely steered toward the outdoors against a friend
# pushing an all-city weekend. So the evaluator is an LLM judge that reads the
# persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it
# resisted the city/indoor plan and leaned toward nature.
[[checks]]
dimension_id = "pref_city_vs_nature"
dimension_label = "City vs nature"
category = "Behavior: Preferences"
anchor_value = "Prefers nature"
evaluator = "llm-judge"
adherence_signal = "Reply steers toward nature/the outdoors — wants parks, trails, open green space, a hike or a lake, fresh air — and resists the friend's all-city, all-indoor weekend plan instead of agreeing to it."
# pass = anchor decisively more nature-leaning than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
