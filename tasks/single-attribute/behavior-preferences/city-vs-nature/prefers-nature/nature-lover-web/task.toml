version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nature-lover-web"
theme = "City vs nature: Prefers nature"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "city-vs-nature", "prefers-nature", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "pref_city_vs_nature"
dimension_label = "City vs nature"
category = "Behavior: Preferences"
anchor_value = "Prefers nature"
evaluator = "rule-based"
# Web env: the persona picks 3 weekend spots on a live page (Playwright). Each
# card's hidden `data-rank` (0..3) in index.html is the ground truth. Unified
# with nature-lover-survey: VIOLATED for any city/indoor pick (rank >= 2).
adherence_signal = "Picks favor nature/green settings (rank 0-1); no city/indoor picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
