version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nature-first-app"
theme = "City vs nature = Nature lover"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "city-vs-nature", "nature-first", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: nature-first.yaml).
# All options are outdoor, free with the day pass, food-free, easy-pace and served by the same shuttle line, so neither cost, diet, effort, thrill level nor indoor comfort separates the sides — only the city/nature character of the stop.
[[checks]]
dimension_id = "pref_city_vs_nature"
dimension_label = "City vs nature"
category = "Behavior: Preferences"
anchor_value = "Nature lover"
evaluator = "rule-based"
adherence_signal = "Every stop picked for the day out is a green-space plan; no city-bustle stop is chosen despite those being the glossy, zero-friction picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RoamPlan (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RoamPlan once the desktop is up so the agent finds it on screen.
command = "/opt/roamplan/start-roamplan.sh"
timeout_sec = 60.0
retries = 5
