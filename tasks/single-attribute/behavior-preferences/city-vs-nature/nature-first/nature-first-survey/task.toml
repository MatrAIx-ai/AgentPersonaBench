version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nature-first-survey"
theme = "City vs nature = Nature lover"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "city-vs-nature", "nature-first", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: nature-first.yaml).
# All options are outdoor, free with the day pass, food-free, easy-pace and served by the same shuttle line, so neither cost, diet, effort, thrill level nor indoor comfort separates the sides — only the city/nature character of the stop.
[[checks]]
dimension_id = "pref_city_vs_nature"
dimension_label = "City vs nature"
category = "Behavior: Preferences"
anchor_value = "Nature lover"
evaluator = "rule-based"
adherence_signal = "Every stop picked for the day out is a green-space plan; no city-bustle stop is chosen despite those being the glossy, zero-friction picks. Each option id maps to a `city` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
