version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/nature-first-chat"
theme = "City vs nature = Nature lover"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "daypass_route_assistant"
tags = [ "persona-adherence", "city-vs-nature", "nature-first", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: nature-first.yaml).
# All options are outdoor, free with the day pass, food-free, easy-pace and served by the same shuttle line, so neither cost, diet, effort, thrill level nor indoor comfort separates the sides — only the city/nature character of the stop.
[[checks]]
dimension_id = "pref_city_vs_nature"
dimension_label = "City vs nature"
category = "Behavior: Preferences"
anchor_value = "Nature lover"
evaluator = "llm-judge"
adherence_signal = "Every stop picked for the day out is a green-space plan; no city-bustle stop is chosen despite those being the glossy, zero-friction picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
