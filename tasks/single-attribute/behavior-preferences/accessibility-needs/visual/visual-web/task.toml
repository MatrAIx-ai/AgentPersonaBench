version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/visual-web"
theme = "Accessibility needs: Visual"

[metadata]
difficulty = "medium"
type = "web"
domain = "software"
tags = [ "persona-adherence", "behavior-preferences", "accessibility-needs", "visual", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "accessibility_needs"
dimension_label = "Accessibility needs"
category = "Behavior: Preferences"
anchor_value = "Visual"
evaluator = "rule-based"
# Web env: the persona enables display settings on a live reading-app "display
# options" page (Playwright). Each setting's hidden `data-inaccessibility` (0..3)
# in index.html is the ground truth. VIOLATED for any small-text / low-contrast /
# visual-only-dense pick (inaccessibility >= 2).
adherence_signal = "Enabled only visual-accessible settings (data-inaccessibility 0-1); no small/low-contrast/visual-only option (>=2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
