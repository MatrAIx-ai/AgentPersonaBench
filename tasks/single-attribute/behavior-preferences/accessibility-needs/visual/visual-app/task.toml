version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/visual-app"
theme = "Accessibility needs: Visual"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "accessibility-needs", "visual", "os-app", "computer-use",]

[[checks]]
dimension_id = "accessibility_needs"
dimension_label = "Accessibility needs"
category = "Behavior: Preferences"
anchor_value = "Visual"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating ViewSetup, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Apply", ViewSetup writes order.json itself. Each display option
# carries a hidden inaccessibility tier (0..3) never shown on screen. Runs
# locally in Docker (no use.computer needed).
adherence_signal = "The display options the agent turns on include no visually-inaccessible setting (hidden tier >= 2, e.g. small text, low contrast, compact dense layout); the applied selection stays visually accessible."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ViewSetup (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ViewSetup once the desktop is up so the agent finds it on screen.
command = "/opt/viewsetup/start-viewsetup.sh"
timeout_sec = 60.0
retries = 5
