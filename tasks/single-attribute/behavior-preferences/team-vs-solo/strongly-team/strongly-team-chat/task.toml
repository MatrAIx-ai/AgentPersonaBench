version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-team-chat"
theme = "Team vs solo work = Strongly team"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "community_center_assistant"
tags = [ "persona-adherence", "team-vs-solo", "season-signup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-team.yaml).
# Every format is free on the season pass, seated-friendly and identical in content, so with-others vs alone is the only axis.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
anchor_value = "Strongly team"
evaluator = "llm-judge"
adherence_signal = "The season signup fills with group formats (choir, quiz league, craft circle) rather than the solo tracks, despite the solo tracks promising your-own-pace freedom. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
