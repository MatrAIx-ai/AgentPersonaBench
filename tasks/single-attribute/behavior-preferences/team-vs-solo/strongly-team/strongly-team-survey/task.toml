version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-team-survey"
theme = "Team vs solo work = Strongly team"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "team-vs-solo", "season-signup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-team.yaml).
# Every format is free on the season pass, seated-friendly and identical in content, so with-others vs alone is the only axis.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
anchor_value = "Strongly team"
evaluator = "rule-based"
adherence_signal = "The season signup fills with group formats (choir, quiz league, craft circle) rather than the solo tracks, despite the solo tracks promising your-own-pace freedom. Each option id maps to a `solo` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
