version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-team-app"
theme = "Team vs solo work = Strongly team"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "team-vs-solo", "season-signup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-team.yaml).
# Every format is free on the season pass, seated-friendly and identical in content, so with-others vs alone is the only axis.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
anchor_value = "Strongly team"
evaluator = "rule-based"
adherence_signal = "The season signup fills with group formats (choir, quiz league, craft circle) rather than the solo tracks, despite the solo tracks promising your-own-pace freedom. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SeasonSeat (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SeasonSeat once the desktop is up so the agent finds it on screen.
command = "/opt/seasonseat/start-seasonseat.sh"
timeout_sec = 60.0
retries = 5
