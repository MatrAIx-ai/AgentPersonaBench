version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-team-web"
theme = "Team vs solo work = Strongly team"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "team-vs-solo", "season-signup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-team.yaml).
# Every format is free on the season pass, seated-friendly and identical in content, so with-others vs alone is the only axis.
[[checks]]
dimension_id = "pref_team_vs_solo"
dimension_label = "Team vs solo work"
category = "Behavior: Preferences"
anchor_value = "Strongly team"
evaluator = "rule-based"
adherence_signal = "The season signup fills with group formats (choir, quiz league, craft circle) rather than the solo tracks, despite the solo tracks promising your-own-pace freedom. Ground truth is each item's data-solo attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
