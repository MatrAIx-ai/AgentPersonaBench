version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quality-first-app"
theme = "Quality vs quantity = Quality first"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household"
tags = [ "persona-adherence", "quality-vs-quantity", "kitchen-outfitting", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: quality-first.yaml).
# Every option costs the same flat bundle credit, so piece count is the only lure and the pick isolates quality-vs-quantity from price sensitivity.
[[checks]]
dimension_id = "pref_quality_vs_quantity"
dimension_label = "Quality vs quantity"
category = "Behavior: Preferences"
anchor_value = "Quality first"
evaluator = "rule-based"
adherence_signal = "Every pick is the single well-crafted piece rather than the many-piece bundle at the same price, despite the bundles offering far more items per slot. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PanRack (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PanRack once the desktop is up so the agent finds it on screen.
command = "/opt/panrack/start-panrack.sh"
timeout_sec = 60.0
retries = 5
