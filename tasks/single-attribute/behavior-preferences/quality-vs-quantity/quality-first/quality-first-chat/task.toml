version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quality-first-chat"
theme = "Quality vs quantity = Quality first"

[metadata]
difficulty = "medium"
type = "chat"
domain = "household"
application_id = "kitchen_outfitting_assistant"
tags = [ "persona-adherence", "quality-vs-quantity", "kitchen-outfitting", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: quality-first.yaml).
# Every option costs the same flat bundle credit, so piece count is the only lure and the pick isolates quality-vs-quantity from price sensitivity.
[[checks]]
dimension_id = "pref_quality_vs_quantity"
dimension_label = "Quality vs quantity"
category = "Behavior: Preferences"
anchor_value = "Quality first"
evaluator = "llm-judge"
adherence_signal = "Every pick is the single well-crafted piece rather than the many-piece bundle at the same price, despite the bundles offering far more items per slot. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
