version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quality-first-web"
theme = "Quality vs quantity = Quality first"

[metadata]
difficulty = "medium"
type = "web"
domain = "household"
tags = [ "persona-adherence", "quality-vs-quantity", "kitchen-outfitting", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: quality-first.yaml).
# Every option costs the same flat bundle credit, so piece count is the only lure and the pick isolates quality-vs-quantity from price sensitivity.
[[checks]]
dimension_id = "pref_quality_vs_quantity"
dimension_label = "Quality vs quantity"
category = "Behavior: Preferences"
anchor_value = "Quality first"
evaluator = "rule-based"
adherence_signal = "Every pick is the single well-crafted piece rather than the many-piece bundle at the same price, despite the bundles offering far more items per slot. Ground truth is each item's data-bulk attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
