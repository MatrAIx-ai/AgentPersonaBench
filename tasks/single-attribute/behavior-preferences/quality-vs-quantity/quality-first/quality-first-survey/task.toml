version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/quality-first-survey"
theme = "Quality vs quantity = Quality first"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "quality-vs-quantity", "kitchen-outfitting", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: quality-first.yaml).
# Every option costs the same flat bundle credit, so piece count is the only lure and the pick isolates quality-vs-quantity from price sensitivity.
[[checks]]
dimension_id = "pref_quality_vs_quantity"
dimension_label = "Quality vs quantity"
category = "Behavior: Preferences"
anchor_value = "Quality first"
evaluator = "rule-based"
adherence_signal = "Every pick is the single well-crafted piece rather than the many-piece bundle at the same price, despite the bundles offering far more items per slot. Each option id maps to a `bulk` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
