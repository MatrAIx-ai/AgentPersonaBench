version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/prefers-calls-web"
theme = "Texting vs calling: Prefers calls"

[metadata]
difficulty = "medium"
type = "web"
domain = "communication"
tags = [ "persona-adherence", "behavior-preferences", "texting-vs-calling", "prefers-calls", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "pref_text_vs_call"
dimension_label = "Texting vs calling"
category = "Behavior: Preferences"
anchor_value = "Prefers calls"
evaluator = "rule-based"
# Web env: the persona sets up how they'll reach people on a live contact-setup
# page (Playwright). Each option's hidden `data-notcall` (0..3) in index.html is
# the ground truth: 0 = phone/voice call, 1 = voice-adjacent (video call, voice
# memo), 2 = text/chat, 3 = pure async (email/leave-it). VIOLATED for any
# text/async pick (data-notcall >= 2).
adherence_signal = "Contact plan built from voice options (data-notcall 0-1); no text/async approach (>= 2) chosen."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
