version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/always-leads-chat"
theme = "Lead vs follow = Always leads"

[metadata]
difficulty = "medium"
type = "chat"
domain = "social"
application_id = "trip_planning_assistant"
tags = [ "persona-adherence", "lead-vs-follow", "trip-roles", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: always-leads.yaml).
# Every role costs nothing and the trip happens either way, so appetite for taking charge is the only axis.
[[checks]]
dimension_id = "pref_lead_vs_follow"
dimension_label = "Lead vs follow"
category = "Behavior: Preferences"
anchor_value = "Always leads"
evaluator = "llm-judge"
adherence_signal = "The claimed trip roles are the organizer seats (route, bookings, briefing) rather than the just-show-up seats, despite the passive seats being the zero-work picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
