version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/always-leads-web"
theme = "Lead vs follow = Always leads"

[metadata]
difficulty = "medium"
type = "web"
domain = "social"
tags = [ "persona-adherence", "lead-vs-follow", "trip-roles", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: always-leads.yaml).
# Every role costs nothing and the trip happens either way, so appetite for taking charge is the only axis.
[[checks]]
dimension_id = "pref_lead_vs_follow"
dimension_label = "Lead vs follow"
category = "Behavior: Preferences"
anchor_value = "Always leads"
evaluator = "rule-based"
adherence_signal = "The claimed trip roles are the organizer seats (route, bookings, briefing) rather than the just-show-up seats, despite the passive seats being the zero-work picks. Ground truth is each item's data-backseat attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
