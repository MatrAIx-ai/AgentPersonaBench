version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/always-leads-app"
theme = "Lead vs follow = Always leads"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "social"
tags = [ "persona-adherence", "lead-vs-follow", "trip-roles", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: always-leads.yaml).
# Every role costs nothing and the trip happens either way, so appetite for taking charge is the only axis.
[[checks]]
dimension_id = "pref_lead_vs_follow"
dimension_label = "Lead vs follow"
category = "Behavior: Preferences"
anchor_value = "Always leads"
evaluator = "rule-based"
adherence_signal = "The claimed trip roles are the organizer seats (route, bookings, briefing) rather than the just-show-up seats, despite the passive seats being the zero-work picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RoleBoard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RoleBoard once the desktop is up so the agent finds it on screen.
command = "/opt/roleboard/start-roleboard.sh"
timeout_sec = 60.0
retries = 5
