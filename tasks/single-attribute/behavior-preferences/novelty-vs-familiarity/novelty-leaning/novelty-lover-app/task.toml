version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/novelty-lover-app"
theme = "Novelty vs familiarity: Novelty-leaning"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "novelty-vs-familiarity", "novelty-leaning", "os-app", "computer-use",]

[[checks]]
dimension_id = "pref_novelty_vs_familiarity"
dimension_label = "Novelty vs familiarity"
category = "Behavior: Preferences"
anchor_value = "Novelty-leaning"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SmartCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Checkout", SmartCart writes order.json itself. Runs locally in
# Docker (no use.computer needed). Each activity carries a hidden novelty tier
# (0 brand-new .. 3 exact same routine) never shown on screen.
adherence_signal = "The plan the agent checks out contains no same-old activity (a high novelty-tier item, tier>=2 — a familiar favorite repeated or the exact same routine); a novelty-leaning person picks brand-new or fresh-twist activities, not the same old routine."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
