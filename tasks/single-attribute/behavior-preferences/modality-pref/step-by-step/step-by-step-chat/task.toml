version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/step-by-step-chat"
theme = "Modality preference: Step-by-step"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "behavior-preferences", "modality-pref", "step-by-step", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Step-by-step" is a SEMANTIC trait: no keyword list can tell whether a person
# genuinely insisted on going one instruction at a time and doing each part in
# order over taking it all at once. So the evaluator is an LLM judge that reads the
# persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it held
# to a guided, sequential walkthrough instead of giving in to skipping the steps.
[[checks]]
dimension_id = "modality_pref"
dimension_label = "Modality preference"
category = "Behavior: Preferences"
attribute = "Modality preference"
value = "Step-by-step"
evaluator = "llm-judge"
evaluator_name = "modality_pref=Step-by-step"
adherence_signal = "Reply insists on going one instruction at a time / doing each part in order before the next, and resists the friend's skip-the-steps / all-at-once pressure."
# pass = anchor decisively more step-by-step than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
