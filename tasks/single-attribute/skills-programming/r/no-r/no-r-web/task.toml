version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-r-web"
theme = "Programming: R — None"

[metadata]
difficulty = "medium"
type = "web"
domain = "software"
tags = [ "persona-adherence", "no-r", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "prog_r"
dimension_label = "Programming: R"
category = "Skills: Programming"
anchor_value = "None"
evaluator = "rule-based"
adherence_signal = "None of the templates the persona starts from are R-based, despite equal maintenance, equal capability and repeated recommendation."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
