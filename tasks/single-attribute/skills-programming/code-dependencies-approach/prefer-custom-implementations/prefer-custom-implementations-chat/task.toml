version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/prefer-custom-implementations-chat"
theme = "Code dependencies approach: Prefer custom implementations"

[metadata]
difficulty = "medium"
type = "chat"
domain = "software"
tags = [ "persona-adherence", "code-dependencies-approach", "custom-implementation", "rule-based",]

# --- Single-attribute task ---------------------------------------------------- #
# A developer persona that prefers custom implementations drives an AI coding
# assistant to implement an HTTP data-fetch helper; the LAST code the assistant
# produces is scored by one deterministic rule-based check reading the import
# list. Reward = 1.0/0.0.
[[checks]]
dimension_id = "code_dependencies_approach"
dimension_label = "Dependencies and Library Usage"
category = "Skills: Programming"
anchor_value = "Prefer custom implementations"
evaluator = "rule-based"
evaluator_name = "code_dependencies_approach=Prefer custom implementations"
adherence_signal = "Final code imports stdlib-only (or nothing) — zero third-party dependencies."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
