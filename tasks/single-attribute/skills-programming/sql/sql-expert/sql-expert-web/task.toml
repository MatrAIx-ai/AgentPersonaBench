version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sql-expert-web"
theme = "Programming: SQL — Expert"

[metadata]
difficulty = "medium"
type = "web"
domain = "software"
tags = [ "persona-adherence", "sql-expert", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "prog_sql"
dimension_label = "Programming: SQL"
category = "Skills: Programming"
anchor_value = "Expert"
evaluator = "rule-based"
adherence_signal = "The projects the persona takes on are the query and database ones, chosen unprompted, even though the assistant only pushes front-end and tooling work of the same size and sponsorship."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
