version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/live-concert-devotee-survey"
theme = "Topic: Live concerts — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "events"
tags = [ "persona-adherence", "live-concert-devotee", "rule-based",]

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The options the persona buys are the live-performance ones, chosen unprompted, even though the assistant only recommends at-home options at the same cost."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
