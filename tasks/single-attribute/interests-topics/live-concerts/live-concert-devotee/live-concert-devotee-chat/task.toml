version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/live-concert-devotee-chat"
theme = "Topic: Live concerts — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "events"
tags = [ "persona-adherence", "live-concert-devotee", "llm-judge",]

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The options the persona buys are the live-performance ones, chosen unprompted, even though the assistant only recommends at-home options at the same cost."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
