version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/live-concert-devotee-web"
theme = "Topic: Live concerts — Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "events"
tags = [ "persona-adherence", "live-concert-devotee", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_live_concerts"
dimension_label = "Interest: Live concerts"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The options the persona buys are the live-performance ones, chosen unprompted, even though the assistant only recommends at-home options at the same cost."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
