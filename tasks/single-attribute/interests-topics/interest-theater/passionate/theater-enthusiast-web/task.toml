version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/theater-enthusiast-web"
theme = "Interest: Theater: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "theater", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_theater"
dimension_label = "Interest: Theater"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a free evening" on a live page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth: 0 = live theater, 1 = theater-adjacent, 2 = unrelated leisure, 3 = theater-
# averse stay-in. Unified with theater-enthusiast-survey: VIOLATED for any
# unrelated / theater-averse pick (rank >= 2); theater and theater-adjacent picks
# are adherent.
adherence_signal = "Picks are theater or theater-adjacent (rank 0-1); no unrelated-leisure / theater-averse picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
