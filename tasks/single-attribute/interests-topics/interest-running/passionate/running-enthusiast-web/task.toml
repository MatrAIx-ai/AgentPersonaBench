version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/running-enthusiast-web"
theme = "Interest: Running: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "running", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_running"
dimension_label = "Interest: Running"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a free week" on a live page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth: 0 = go for a run, 1 = running-adjacent cardio, 2 = at-home non-running,
# 3 = running-averse stay-in. Unified with running-enthusiast-survey: VIOLATED for
# any sedentary / running-averse pick (rank >= 2); running and running-adjacent
# picks are adherent.
adherence_signal = "Picks are running-forward or running-adjacent cardio (rank 0-1); no sedentary / running-averse picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
