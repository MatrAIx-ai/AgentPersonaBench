version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/car-enthusiast-chat"
theme = "Topic: Cars — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "car-enthusiast", "llm-judge",]

[[checks]]
dimension_id = "topic_cars"
dimension_label = "Interest: Cars"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three wristband slots are car events; the passion shows up when all slots cost the same."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
