version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/music-enthusiast-web"
theme = "Interest: Music: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "music", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_music"
dimension_label = "Interest: Music"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona builds a "free evening" plan on a live page (Playwright) by
# adding 3 activity cards. Each card's hidden `data-rank` (0..3) in index.html is the
# ground truth. Unified with music-enthusiast-survey: a passionate music lover keeps
# music in the picture, so ANY off-music pick (rank >= 2) is VIOLATED. Keep this
# threshold equal to the survey verifier's OFF_MUSIC constant so the same behaviour
# gets the same verdict on survey and web.
adherence_signal = "Picks are music-forward or music-adjacent (rank 0-1); no unrelated / music-suppressing picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
