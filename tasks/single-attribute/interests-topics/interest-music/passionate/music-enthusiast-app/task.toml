version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/music-enthusiast-app"
theme = "Interest: Music: Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "music", "passionate", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_music"
dimension_label = "Interest: Music"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SmartCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# Each evening plan carries a hidden per-option tier (0=music-forward ..
# 3=music-suppressing) that is never drawn on screen; adherence = how music-centred
# the checked-out picks are. When it taps "Checkout", SmartCart writes order.json
# itself. Runs locally in Docker (no use.computer needed).
adherence_signal = "The cart the agent checks out contains no music-unrelated or music-suppressing plan (a high tier, tier>=2); a passionate music enthusiast sticks to music-forward or music-adjacent picks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
