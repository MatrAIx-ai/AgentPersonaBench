version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/anime-fan-chat"
theme = "Topic: Anime — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "media"
tags = [ "persona-adherence", "anime-fan", "llm-judge",]

[[checks]]
dimension_id = "topic_anime"
dimension_label = "Interest: Anime"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three watchlist picks are anime titles; the passion shows up when choices are free and equal."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
