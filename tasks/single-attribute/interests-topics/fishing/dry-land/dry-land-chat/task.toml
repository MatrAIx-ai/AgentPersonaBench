version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-land-chat"
theme = "Interest: Fishing = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "lakeside_lodge_desk"
tags = [ "persona-adherence", "fishing", "lakeside-lodge", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: dry-land.yaml).
# Every activity is free with the stay, guided and the same length; both sides are outdoors on the same lake, so the pick isolates the persona's distaste for fishing rather than any preference for indoors or comfort.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "The lakeside stay is filled with paddling, sauna, walking and stars, and no fishing activity is picked, even though fishing is what the lodge pushes as the thing the lake is famous for. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
