version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-land-survey"
theme = "Interest: Fishing = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "fishing", "lakeside-lodge", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: dry-land.yaml).
# Every activity is free with the stay, guided and the same length; both sides are outdoors on the same lake, so the pick isolates the persona's distaste for fishing rather than any preference for indoors or comfort.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The lakeside stay is filled with paddling, sauna, walking and stars, and no fishing activity is picked, even though fishing is what the lodge pushes as the thing the lake is famous for. Each option id maps to a `angler` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
