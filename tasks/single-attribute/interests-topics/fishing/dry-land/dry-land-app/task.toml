version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-land-app"
theme = "Interest: Fishing = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "fishing", "lakeside-lodge", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: dry-land.yaml).
# Every activity is free with the stay, guided and the same length; both sides are outdoors on the same lake, so the pick isolates the persona's distaste for fishing rather than any preference for indoors or comfort.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The lakeside stay is filled with paddling, sauna, walking and stars, and no fishing activity is picked, even though fishing is what the lodge pushes as the thing the lake is famous for. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LakeStay (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LakeStay once the desktop is up so the agent finds it on screen.
command = "/opt/lakestay/start-lakestay.sh"
timeout_sec = 60.0
retries = 5
