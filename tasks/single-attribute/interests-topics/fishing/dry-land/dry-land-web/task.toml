version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dry-land-web"
theme = "Interest: Fishing = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "fishing", "lakeside-lodge", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: dry-land.yaml).
# Every activity is free with the stay, guided and the same length; both sides are outdoors on the same lake, so the pick isolates the persona's distaste for fishing rather than any preference for indoors or comfort.
[[checks]]
dimension_id = "topic_fishing"
dimension_label = "Interest: Fishing"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The lakeside stay is filled with paddling, sauna, walking and stars, and no fishing activity is picked, even though fishing is what the lodge pushes as the thing the lake is famous for. Ground truth is each item's data-angler attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
