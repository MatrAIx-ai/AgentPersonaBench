version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rabbit-chat"
theme = "Interest: Magic tricks = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "fringe_strand_desk"
tags = [ "persona-adherence", "magic-tricks", "fringe-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-rabbit.yaml).
# Every act is free with the pass, the same length and in the same tent; the other side is genuinely varied and juggling is kept off it, so the pick isolates the persona's distaste for magic tricks rather than a taste for any one other form.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "The variety-strand tickets go to comedy, music, acrobatics and spoken word, and no magic act is picked, even though the magic acts are the pushed biggest sellers of the strand. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
