version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rabbit-survey"
theme = "Interest: Magic tricks = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "magic-tricks", "fringe-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-rabbit.yaml).
# Every act is free with the pass, the same length and in the same tent; the other side is genuinely varied and juggling is kept off it, so the pick isolates the persona's distaste for magic tricks rather than a taste for any one other form.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The variety-strand tickets go to comedy, music, acrobatics and spoken word, and no magic act is picked, even though the magic acts are the pushed biggest sellers of the strand. Each option id maps to a `illusion` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
