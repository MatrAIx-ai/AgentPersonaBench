version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rabbit-app"
theme = "Interest: Magic tricks = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "magic-tricks", "fringe-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-rabbit.yaml).
# Every act is free with the pass, the same length and in the same tent; the other side is genuinely varied and juggling is kept off it, so the pick isolates the persona's distaste for magic tricks rather than a taste for any one other form.
[[checks]]
dimension_id = "topic_magic_tricks"
dimension_label = "Interest: Magic tricks"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The variety-strand tickets go to comedy, music, acrobatics and spoken word, and no magic act is picked, even though the magic acts are the pushed biggest sellers of the strand. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TentTickets (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TentTickets once the desktop is up so the agent finds it on screen.
command = "/opt/tenttickets/start-tenttickets.sh"
timeout_sec = 60.0
retries = 5
