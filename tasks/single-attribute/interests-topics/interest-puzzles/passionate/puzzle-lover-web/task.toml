version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/puzzle-lover-web"
theme = "Interest: Puzzles: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "puzzles", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_puzzles"
dimension_label = "Interest: Puzzles"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a rainy afternoon" on a live page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth: 0 = puzzles proper, 1 = puzzle-adjacent strategy, 2 = unrelated leisure,
# 3 = puzzle-averse brain-off. Unified with puzzle-lover-survey: VIOLATED for any
# unrelated / brain-off pick (rank >= 2); puzzle and puzzle-adjacent picks are
# adherent.
adherence_signal = "Picks are puzzles or puzzle-adjacent (rank 0-1); no unrelated-leisure / brain-off picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
