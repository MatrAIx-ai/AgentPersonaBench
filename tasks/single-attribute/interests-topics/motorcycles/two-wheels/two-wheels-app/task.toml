version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/two-wheels-app"
theme = "Interest: Motorcycles = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "motorcycles", "weekend-planner", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: two-wheels.yaml).
# Every pick is free or the same small fee, in the same city and spectator-friendly; nothing requires riding, and both sides suit small groups — the pick isolates the persona's interest in motorcycles from risk appetite, sociability or cost.
[[checks]]
dimension_id = "topic_motorcycles"
dimension_label = "Interest: Motorcycles"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The free weekend goes to bikes — the classic-bike museum, the custom-build show, the touring-routes talk — rather than the equally appealing planetarium, cruise and market picks the planner pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlanMyWeekend (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlanMyWeekend once the desktop is up so the agent finds it on screen.
command = "/opt/planmyweekend/start-planmyweekend.sh"
timeout_sec = 60.0
retries = 5
