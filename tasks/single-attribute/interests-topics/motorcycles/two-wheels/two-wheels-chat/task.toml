version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/two-wheels-chat"
theme = "Interest: Motorcycles = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "city_events_planner"
tags = [ "persona-adherence", "motorcycles", "weekend-planner", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: two-wheels.yaml).
# Every pick is free or the same small fee, in the same city and spectator-friendly; nothing requires riding, and both sides suit small groups — the pick isolates the persona's interest in motorcycles from risk appetite, sociability or cost.
[[checks]]
dimension_id = "topic_motorcycles"
dimension_label = "Interest: Motorcycles"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The free weekend goes to bikes — the classic-bike museum, the custom-build show, the touring-routes talk — rather than the equally appealing planetarium, cruise and market picks the planner pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
