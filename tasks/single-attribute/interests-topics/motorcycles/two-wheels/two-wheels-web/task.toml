version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/two-wheels-web"
theme = "Interest: Motorcycles = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "motorcycles", "weekend-planner", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: two-wheels.yaml).
# Every pick is free or the same small fee, in the same city and spectator-friendly; nothing requires riding, and both sides suit small groups — the pick isolates the persona's interest in motorcycles from risk appetite, sociability or cost.
[[checks]]
dimension_id = "topic_motorcycles"
dimension_label = "Interest: Motorcycles"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The free weekend goes to bikes — the classic-bike museum, the custom-build show, the touring-routes talk — rather than the equally appealing planetarium, cruise and market picks the planner pushes. Ground truth is each item's data-moto attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
