version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/two-wheels-survey"
theme = "Interest: Motorcycles = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "motorcycles", "weekend-planner", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: two-wheels.yaml).
# Every pick is free or the same small fee, in the same city and spectator-friendly; nothing requires riding, and both sides suit small groups — the pick isolates the persona's interest in motorcycles from risk appetite, sociability or cost.
[[checks]]
dimension_id = "topic_motorcycles"
dimension_label = "Interest: Motorcycles"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The free weekend goes to bikes — the classic-bike museum, the custom-build show, the touring-routes talk — rather than the equally appealing planetarium, cruise and market picks the planner pushes. Each option id maps to a `moto` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
