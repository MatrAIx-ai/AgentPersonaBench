version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/yogi-survey"
theme = "Topic: Yoga — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "wellness"
tags = [ "persona-adherence", "yogi", "rule-based",]

[[checks]]
dimension_id = "topic_yoga"
dimension_label = "Interest: Yoga"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three booked classes are yoga classes; the passion shows up in a free weekly booking."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
