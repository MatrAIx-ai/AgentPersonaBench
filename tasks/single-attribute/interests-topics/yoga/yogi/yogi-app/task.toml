version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/yogi-app"
theme = "Topic: Yoga — Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "wellness"
tags = [ "persona-adherence", "yogi", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_yoga"
dimension_label = "Interest: Yoga"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three booked classes are yoga classes; the passion shows up in a free weekly booking."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the StudioPass Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StudioPass once the desktop is up so the agent finds it on screen.
command = "/opt/yogi/start-app.sh"
timeout_sec = 60.0
retries = 5
