version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-dice-app"
theme = "Interest: Board games = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "board-games", "community-social", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-dice.yaml).
# Every activity is free, the same length and sociable; the board-game side is boxed tabletop games only, and the other side avoids the karaoke, dance floor and comedy the persona has strong feelings about, so the pick isolates the persona's distaste for board games.
[[checks]]
dimension_id = "topic_board_games"
dimension_label = "Interest: Board games"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The Saturday social is spent on the quiz, table tennis, the film, darts or pottery, and no board game is picked, even though the tables are what the centre pushes as the thing the evening is known for. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CentreNight (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CentreNight once the desktop is up so the agent finds it on screen.
command = "/opt/centrenight/start-centrenight.sh"
timeout_sec = 60.0
retries = 5
