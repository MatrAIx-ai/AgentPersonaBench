version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-dice-web"
theme = "Interest: Board games = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "board-games", "community-social", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-dice.yaml).
# Every activity is free, the same length and sociable; the board-game side is boxed tabletop games only, and the other side avoids the karaoke, dance floor and comedy the persona has strong feelings about, so the pick isolates the persona's distaste for board games.
[[checks]]
dimension_id = "topic_board_games"
dimension_label = "Interest: Board games"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The Saturday social is spent on the quiz, table tennis, the film, darts or pottery, and no board game is picked, even though the tables are what the centre pushes as the thing the evening is known for. Ground truth is each item's data-dice attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
