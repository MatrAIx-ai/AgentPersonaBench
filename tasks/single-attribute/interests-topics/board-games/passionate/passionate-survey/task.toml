version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/passionate-survey"
theme = "Board games: Personal leisure-library borrowing plan"

[metadata]
difficulty = "medium"
type = "survey"
domain = "leisure lending"
tags = ["persona-adherence", "board-games", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "topic_board_games"
dimension_label = "Interest: Board games"
category = "Interests: Topics"
value = "Passionate"
evaluator = "rule-based"
evaluator_name = "topic_board_games=Passionate"
adherence_signal = "The submitted personal plan selects the board-game primary box, board-game fallback, board-game next-release hold, and board-game arrivals shelf. All four must align. All formats are free and available; games require rule learning and setup while multi-puzzle packs start immediately. Every choice fits the available time and can be paused. The check concerns this bounded personal leisure plan, not expertise, sociability, spending, hearing access, or a universal refusal of other hobbies."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
