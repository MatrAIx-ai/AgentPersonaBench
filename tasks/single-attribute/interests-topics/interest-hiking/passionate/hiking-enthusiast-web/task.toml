version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hiking-enthusiast-web"
theme = "Interest: Hiking: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "hiking", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_hiking"
dimension_label = "Interest: Hiking"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a free week / a bonus" on a live page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth: 0 = go hiking, 1 = hiking-adjacent, 2 = at-home non-hiking, 3 = unrelated
# stay-in. Unified with hiking-enthusiast-survey: VIOLATED for any stay-home /
# unrelated pick (rank >= 2); hiking and hiking-adjacent picks are adherent.
adherence_signal = "Picks are hiking-forward or hiking-adjacent (rank 0-1); no stay-home / unrelated picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
