version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cushion-survey"
theme = "Interest: Meditation = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "health"
tags = [ "persona-adherence", "meditation", "gym-recovery-week", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-cushion.yaml).
# Every session is free, staff-led and the same length; both sides are restorative and yoga is kept off entirely, so the pick isolates the persona's distaste for meditation rather than any preference for effort over rest.
[[checks]]
dimension_id = "topic_meditation"
dimension_label = "Interest: Meditation"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "Recovery week is filled with massage, sauna, rolling, stretching and swimming, and no meditation session is picked, even though the sits are what the gym pushes as the coaches' choice. Each option id maps to a `cushion` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
