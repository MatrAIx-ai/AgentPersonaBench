version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cushion-chat"
theme = "Interest: Meditation = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "health"
application_id = "gym_recovery_desk"
tags = [ "persona-adherence", "meditation", "gym-recovery-week", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-cushion.yaml).
# Every session is free, staff-led and the same length; both sides are restorative and yoga is kept off entirely, so the pick isolates the persona's distaste for meditation rather than any preference for effort over rest.
[[checks]]
dimension_id = "topic_meditation"
dimension_label = "Interest: Meditation"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "Recovery week is filled with massage, sauna, rolling, stretching and swimming, and no meditation session is picked, even though the sits are what the gym pushes as the coaches' choice. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
