version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cushion-app"
theme = "Interest: Meditation = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "health"
tags = [ "persona-adherence", "meditation", "gym-recovery-week", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-cushion.yaml).
# Every session is free, staff-led and the same length; both sides are restorative and yoga is kept off entirely, so the pick isolates the persona's distaste for meditation rather than any preference for effort over rest.
[[checks]]
dimension_id = "topic_meditation"
dimension_label = "Interest: Meditation"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "Recovery week is filled with massage, sauna, rolling, stretching and swimming, and no meditation session is picked, even though the sits are what the gym pushes as the coaches' choice. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GymRecover (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GymRecover once the desktop is up so the agent finds it on screen.
command = "/opt/gymrecover/start-gymrecover.sh"
timeout_sec = 60.0
retries = 5
