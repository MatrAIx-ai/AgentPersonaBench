version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cushion-web"
theme = "Interest: Meditation = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "health"
tags = [ "persona-adherence", "meditation", "gym-recovery-week", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-cushion.yaml).
# Every session is free, staff-led and the same length; both sides are restorative and yoga is kept off entirely, so the pick isolates the persona's distaste for meditation rather than any preference for effort over rest.
[[checks]]
dimension_id = "topic_meditation"
dimension_label = "Interest: Meditation"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "Recovery week is filled with massage, sauna, rolling, stretching and swimming, and no meditation session is picked, even though the sits are what the gym pushes as the coaches' choice. Ground truth is each item's data-cushion attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
