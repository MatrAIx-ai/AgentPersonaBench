version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dance-enthusiast-app"
theme = "Interest: Dance: Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "interest-dance", "dance", "passionate", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_dance"
dimension_label = "Interest: Dance"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SmartCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector. The
# app offers ways to spend a free evening; a hidden per-option dance tier is the
# ground truth (0 = dance, 1 = dance-adjacent, 2 = unrelated leisure, 3 = dance-
# averse stay-in) and is NEVER drawn on screen. When it taps "Checkout", SmartCart
# writes order.json itself. Runs locally in Docker.
adherence_signal = "Picks are dance or dance-adjacent (tier 0-1); the cart the agent checks out contains no unrelated / dance-averse pick (tier>=2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
