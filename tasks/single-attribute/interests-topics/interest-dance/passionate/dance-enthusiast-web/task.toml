version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dance-enthusiast-web"
theme = "Interest: Dance: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "dance", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_dance"
dimension_label = "Interest: Dance"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a free evening / a bonus" on a live
# page (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the
# ground truth: 0 = dance, 1 = dance-adjacent, 2 = unrelated leisure, 3 = dance-
# averse stay-in. Unified with dance-enthusiast-survey: VIOLATED for any unrelated
# / dance-averse pick (rank >= 2); dance and dance-adjacent picks are adherent.
adherence_signal = "Picks are dance or dance-adjacent (rank 0-1); no unrelated / dance-averse picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
