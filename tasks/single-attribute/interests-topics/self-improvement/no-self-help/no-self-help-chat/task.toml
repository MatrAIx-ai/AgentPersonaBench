version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-self-help-chat"
theme = "Interest: Self-improvement = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "college_enrolment_desk"
tags = [ "persona-adherence", "self-improvement", "evening-classes", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-self-help.yaml).
# Every taster is free, the same evening length and beginner-friendly; the practical side teaches a skill and the other side teaches a better you, so the pick isolates the persona's distaste for the self-improvement genre rather than any dislike of classes.
[[checks]]
dimension_id = "topic_self_improvement"
dimension_label = "Interest: Self-improvement"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "The three free tasters are practical skills (bike maintenance, local history, phone photography, first aid) and no self-improvement class is picked, even though those are the pushed, most-enrolled options. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
