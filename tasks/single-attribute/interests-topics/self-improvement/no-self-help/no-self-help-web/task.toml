version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-self-help-web"
theme = "Interest: Self-improvement = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "self-improvement", "evening-classes", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-self-help.yaml).
# Every taster is free, the same evening length and beginner-friendly; the practical side teaches a skill and the other side teaches a better you, so the pick isolates the persona's distaste for the self-improvement genre rather than any dislike of classes.
[[checks]]
dimension_id = "topic_self_improvement"
dimension_label = "Interest: Self-improvement"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The three free tasters are practical skills (bike maintenance, local history, phone photography, first aid) and no self-improvement class is picked, even though those are the pushed, most-enrolled options. Ground truth is each item's data-uplift attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
