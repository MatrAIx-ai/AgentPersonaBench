version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-self-help-survey"
theme = "Interest: Self-improvement = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "self-improvement", "evening-classes", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-self-help.yaml).
# Every taster is free, the same evening length and beginner-friendly; the practical side teaches a skill and the other side teaches a better you, so the pick isolates the persona's distaste for the self-improvement genre rather than any dislike of classes.
[[checks]]
dimension_id = "topic_self_improvement"
dimension_label = "Interest: Self-improvement"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The three free tasters are practical skills (bike maintenance, local history, phone photography, first aid) and no self-improvement class is picked, even though those are the pushed, most-enrolled options. Each option id maps to a `uplift` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
