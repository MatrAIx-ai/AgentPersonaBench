version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/art-lover-chat"
theme = "Topic: Visual art — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "art-lover", "llm-judge",]

[[checks]]
dimension_id = "topic_visual_art"
dimension_label = "Interest: Visual art"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three credit bookings are visual-art outings; the passion shows up when every outing costs the same."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
