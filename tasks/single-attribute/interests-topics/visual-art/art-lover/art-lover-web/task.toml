version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/art-lover-web"
theme = "Topic: Visual art — Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "art-lover", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_visual_art"
dimension_label = "Interest: Visual art"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three credit bookings are visual-art outings; the passion shows up when every outing costs the same."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
