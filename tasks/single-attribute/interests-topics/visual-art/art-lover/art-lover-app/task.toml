version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/art-lover-app"
theme = "Topic: Visual art — Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "art-lover", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_visual_art"
dimension_label = "Interest: Visual art"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three credit bookings are visual-art outings; the passion shows up when every outing costs the same."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the CultureCard Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CultureCard once the desktop is up so the agent finds it on screen.
command = "/opt/artlover/start-app.sh"
timeout_sec = 60.0
retries = 5
