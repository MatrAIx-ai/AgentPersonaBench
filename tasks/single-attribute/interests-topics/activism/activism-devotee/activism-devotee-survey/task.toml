version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/activism-devotee-survey"
theme = "Topic: Activism — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "activism-devotee", "rule-based",]

[[checks]]
dimension_id = "topic_activism"
dimension_label = "Interest: Activism"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The events the persona signs up for are the campaigning and organising sessions, chosen unprompted, even though the assistant only pushes social events in the same building."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
