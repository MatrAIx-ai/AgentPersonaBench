version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/activism-devotee-chat"
theme = "Topic: Activism — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "community"
tags = [ "persona-adherence", "activism-devotee", "llm-judge",]

[[checks]]
dimension_id = "topic_activism"
dimension_label = "Interest: Activism"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The events the persona signs up for are the campaigning and organising sessions, chosen unprompted, even though the assistant only pushes social events in the same building."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
