version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/civic-turnout-chat"
theme = "Interest: Activism = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "community"
application_id = "town_weekend_coordinator"
tags = [ "persona-adherence", "activism", "community-weekend", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: civic-turnout.yaml).
# Every slot is free, on the same weekend, in the same square, and each side mixes quiet and crowded formats; none of the causes is environmental — the pick isolates the persona's pull toward civic action from its sociability and its green values.
[[checks]]
dimension_id = "topic_activism"
dimension_label = "Interest: Activism"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The community-weekend slots go to organising and speaking up (the crosswalk petition table, the transit speak-out, the tenants' workshop) rather than to the equally free and sociable fair, film and market on the same schedule. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
