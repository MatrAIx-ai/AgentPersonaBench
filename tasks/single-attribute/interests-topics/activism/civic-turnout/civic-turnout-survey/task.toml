version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/civic-turnout-survey"
theme = "Interest: Activism = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "activism", "community-weekend", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: civic-turnout.yaml).
# Every slot is free, on the same weekend, in the same square, and each side mixes quiet and crowded formats; none of the causes is environmental — the pick isolates the persona's pull toward civic action from its sociability and its green values.
[[checks]]
dimension_id = "topic_activism"
dimension_label = "Interest: Activism"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The community-weekend slots go to organising and speaking up (the crosswalk petition table, the transit speak-out, the tenants' workshop) rather than to the equally free and sociable fair, film and market on the same schedule. Each option id maps to a `civic` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
