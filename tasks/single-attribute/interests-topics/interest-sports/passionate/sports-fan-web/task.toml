version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sports-fan-web"
theme = "Interest: Sports: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "sports", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_sports"
dimension_label = "Interest: Sports"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a free week / a bonus" on a live page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth: 0 = play/watch sports, 1 = sports-adjacent (active/outdoor/training),
# 2 = at-home non-sport, 3 = unrelated stay-in. Unified with sports-fan-survey:
# VIOLATED for any unrelated / sports-averse pick (rank >= 2); sports and sports-
# adjacent picks are adherent.
adherence_signal = "Picks are sports-forward or sports-adjacent (rank 0-1); no unrelated / stay-in picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
