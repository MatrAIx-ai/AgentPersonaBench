version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cooking-enthusiast-web"
theme = "Interest: Cooking: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "interests-topics", "cooking", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_cooking"
dimension_label = "Interest: Cooking"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 ways to handle meals / a free evening on a live
# page (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the
# ground truth. Unified with cooking-enthusiast-survey: VIOLATED for any pick
# that eats out / orders delivery / is unrelated to food (rank >= 2).
adherence_signal = "Picks are cook-from-scratch or cooking-adjacent (rank 0-1); no eat-out / unrelated picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
