version = "1.0"
artifacts = ["/app/output"]
[task]
name = "personabench/theater-content-choice-survey"
theme = "Interest: Theater = Interested"
[metadata]
difficulty = "medium"
type = "survey"
domain = "leisure-content-selection"
tags = ["persona-adherence", "rule-based", "content-preference"]
[[checks]]
dimension_id = "topic_theater"
dimension_label = "Interest: Theater"
category = "Interests: Topics"
value = "Interested"
evaluator = "rule-based"
adherence_signal = "Select content in the declared subject on at least five of six occasions, against three available lower-interest subjects in this complete persona."
[verifier]
timeout_sec = 30.0
[agent]
timeout_sec = 300.0
[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
