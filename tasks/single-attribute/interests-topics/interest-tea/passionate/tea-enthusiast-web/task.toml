version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tea-enthusiast-web"
theme = "Interest: Tea: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "tea", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_tea"
dimension_label = "Interest: Tea"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a slow afternoon / a bonus" on a
# live page (Playwright). Each card's hidden `data-rank` (0..3) in index.html is
# the ground truth: 0 = tea-forward, 1 = tea-adjacent, 2 = unrelated, 3 = tea-
# averse. Unified with tea-enthusiast-survey: VIOLATED for any unrelated /
# tea-averse pick (rank >= 2); tea and tea-adjacent picks are adherent.
adherence_signal = "Picks are tea-forward or tea-adjacent (rank 0-1); no unrelated / tea-averse picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
