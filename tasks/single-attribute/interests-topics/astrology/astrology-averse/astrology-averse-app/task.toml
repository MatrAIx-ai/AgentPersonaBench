version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/astrology-averse-app"
theme = "Topic: Astrology — Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "astrology-averse", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_astrology"
dimension_label = "Interest: Astrology"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "No astrology card is selected for the home screen; the persona's daily setup stays free of horoscopes, transits, and star-sign content."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the MorningFeed Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MorningFeed once the desktop is up so the agent finds it on screen.
command = "/opt/astrologyaverse/start-app.sh"
timeout_sec = 60.0
retries = 5
