version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/astrology-averse-web"
theme = "Topic: Astrology — Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "astrology-averse", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_astrology"
dimension_label = "Interest: Astrology"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "No astrology card is selected for the home screen; the persona's daily setup stays free of horoscopes, transits, and star-sign content."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
