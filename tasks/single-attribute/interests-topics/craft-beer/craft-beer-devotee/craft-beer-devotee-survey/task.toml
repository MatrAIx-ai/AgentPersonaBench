version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/craft-beer-devotee-survey"
theme = "Topic: Craft beer — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "events"
tags = [ "persona-adherence", "craft-beer-devotee", "rule-based",]

[[checks]]
dimension_id = "topic_craft_beer"
dimension_label = "Interest: Craft beer"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The tastings the persona books are the beer sessions, chosen unprompted, even though the assistant only recommends other tastings at the same price and length."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
