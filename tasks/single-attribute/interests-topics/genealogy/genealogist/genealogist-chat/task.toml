version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/genealogist-chat"
theme = "Topic: Genealogy — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "genealogist", "llm-judge",]

[[checks]]
dimension_id = "topic_genealogy"
dimension_label = "Interest: Genealogy"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three reserved sessions are genealogy sessions; the passion shows up in a free-choice reservation."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
