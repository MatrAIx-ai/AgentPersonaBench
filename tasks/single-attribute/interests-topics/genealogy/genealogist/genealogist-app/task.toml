version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/genealogist-app"
theme = "Topic: Genealogy — Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "genealogist", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_genealogy"
dimension_label = "Interest: Genealogy"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three reserved sessions are genealogy sessions; the passion shows up in a free-choice reservation."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the ArchiveDay Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ArchiveDay once the desktop is up so the agent finds it on screen.
command = "/opt/genealogist/start-app.sh"
timeout_sec = 60.0
retries = 5
