version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swap-table-survey"
theme = "Interest: Collecting = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "collecting", "hobby-hall-open-day", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: swap-table.yaml).
# Every session is free, forty minutes, sociable and ends with something to take home, and all run in the same hall; textiles, stargazing, recording, planning, sport, antiques and metal detecting are kept off both sides so none of the persona's other pastimes can answer for the pin, and the alternatives are drawn only from topics this persona is indifferent to; no keyed session is described as sorting, storing or keeping anything findable, so this persona's High orderliness and Important order-structure value cannot answer for it either, and every keyed session turns on acquiring or completing a run instead; option length, word count and alphabetical order are all balanced across the two sides, so no shortest, longest, wordiest, sparsest or alphabetically-extreme policy picks the keyed side in every question.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The three free taster sessions go to keeping a run of things — a swap table, a hunt for the missing pieces, a display case, a starter run — rather than the equally free one-off sessions the hall pushes. Each option id maps to a `runlot` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
