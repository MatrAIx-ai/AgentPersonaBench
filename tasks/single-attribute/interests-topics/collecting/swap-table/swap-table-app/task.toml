version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/swap-table-app"
theme = "Interest: Collecting = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community"
tags = [ "persona-adherence", "collecting", "hobby-hall-open-day", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: swap-table.yaml).
# Every session is free, forty minutes, sociable and ends with something to take home, and all run in the same hall; textiles, stargazing, recording, planning, sport, antiques and metal detecting are kept off both sides so none of the persona's other pastimes can answer for the pin, and the alternatives are drawn only from topics this persona is indifferent to; no keyed session is described as sorting, storing or keeping anything findable, so this persona's High orderliness and Important order-structure value cannot answer for it either, and every keyed session turns on acquiring or completing a run instead; option length, word count and alphabetical order are all balanced across the two sides, so no shortest, longest, wordiest, sparsest or alphabetically-extreme policy picks the keyed side in every question.
[[checks]]
dimension_id = "topic_collecting"
dimension_label = "Interest: Collecting"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The three free taster sessions go to keeping a run of things — a swap table, a hunt for the missing pieces, a display case, a starter run — rather than the equally free one-off sessions the hall pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SwapDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SwapDesk once the desktop is up so the agent finds it on screen.
command = "/opt/swapdesk/start-swapdesk.sh"
timeout_sec = 60.0
retries = 5
