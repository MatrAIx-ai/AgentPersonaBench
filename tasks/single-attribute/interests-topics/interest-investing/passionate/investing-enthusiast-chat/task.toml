version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/investing-enthusiast-chat"
theme = "Interest: Investing: Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
tags = [ "persona-adherence", "interests-topics", "investing", "passionate", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cautious", passion for investing is a SEMANTIC trait: no keyword list can
# tell whether someone genuinely stayed drawn to investing over a friend's push to
# just spend. So the evaluator is an LLM judge that reads the persona's OWN turns
# and returns a binary HELD/VIOLATED verdict on whether it stayed engaged with
# investing.
[[checks]]
dimension_id = "topic_investing"
dimension_label = "Interest: Investing"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "Reply stays engaged with investing — wants to invest / grow the money and resists blowing it all on spending — instead of agreeing with the friend to abandon investing and just spend it now."
# pass = anchor decisively more investing-engaged than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
