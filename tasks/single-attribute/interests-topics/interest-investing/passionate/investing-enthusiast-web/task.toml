version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/investing-enthusiast-web"
theme = "Interest: Investing: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "finance"
tags = [ "persona-adherence", "interests-topics", "investing", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_investing"
dimension_label = "Interest: Investing"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 ways to use a windfall / free time on a live page
# (Playwright). Each option's hidden `data-rank` (0..3) in index.html is the ground
# truth. Unified with investing-enthusiast-survey: 0 = invest it, 1 = savings-adjacent,
# 2 = spend it now, 3 = totally unrelated leisure. VIOLATED for any pick that leads
# away from investing (rank >= 2), matching the survey's not_invest tier semantics.
adherence_signal = "Picks are investing or savings-adjacent (rank 0-1); no spend-now / unrelated picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
