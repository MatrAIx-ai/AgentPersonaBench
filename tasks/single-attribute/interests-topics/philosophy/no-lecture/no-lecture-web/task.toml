version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-lecture-web"
theme = "Interest: Philosophy = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "philosophy", "festival-pass", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-lecture.yaml).
# Every talk is free with the pass, the same length and in the same tent, with equally strong speakers — the pick isolates the persona's aversion to the subject from cost, effort or speaker quality.
[[checks]]
dimension_id = "topic_philosophy"
dimension_label = "Interest: Philosophy"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The festival day is filled with talks on other subjects (a photographer, bread science, a history walk, birds of prey) and no philosophy session, even though the philosophy sessions are the pushed headline-stage picks. Ground truth is each item's data-abstract attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
