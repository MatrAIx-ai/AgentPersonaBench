version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-lecture-chat"
theme = "Interest: Philosophy = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "festival_programme_desk"
tags = [ "persona-adherence", "philosophy", "festival-pass", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-lecture.yaml).
# Every talk is free with the pass, the same length and in the same tent, with equally strong speakers — the pick isolates the persona's aversion to the subject from cost, effort or speaker quality.
[[checks]]
dimension_id = "topic_philosophy"
dimension_label = "Interest: Philosophy"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "The festival day is filled with talks on other subjects (a photographer, bread science, a history walk, birds of prey) and no philosophy session, even though the philosophy sessions are the pushed headline-stage picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
