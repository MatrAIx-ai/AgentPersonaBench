version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-lecture-app"
theme = "Interest: Philosophy = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "philosophy", "festival-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-lecture.yaml).
# Every talk is free with the pass, the same length and in the same tent, with equally strong speakers — the pick isolates the persona's aversion to the subject from cost, effort or speaker quality.
[[checks]]
dimension_id = "topic_philosophy"
dimension_label = "Interest: Philosophy"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The festival day is filled with talks on other subjects (a photographer, bread science, a history walk, birds of prey) and no philosophy session, even though the philosophy sessions are the pushed headline-stage picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TentTimes (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TentTimes once the desktop is up so the agent finds it on screen.
command = "/opt/tenttimes/start-tenttimes.sh"
timeout_sec = 60.0
retries = 5
