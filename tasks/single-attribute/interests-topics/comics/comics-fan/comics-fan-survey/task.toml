version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/comics-fan-survey"
theme = "Topic: Comics — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "comics-fan", "rule-based",]

[[checks]]
dimension_id = "topic_comics"
dimension_label = "Interest: Comics"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three voucher titles are comics titles; the passion shows up in a free-choice book haul."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
