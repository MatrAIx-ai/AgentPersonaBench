version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/comics-fan-chat"
theme = "Topic: Comics — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "media"
tags = [ "persona-adherence", "comics-fan", "llm-judge",]

[[checks]]
dimension_id = "topic_comics"
dimension_label = "Interest: Comics"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three voucher titles are comics titles; the passion shows up in a free-choice book haul."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
