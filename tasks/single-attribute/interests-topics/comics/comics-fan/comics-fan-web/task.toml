version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/comics-fan-web"
theme = "Topic: Comics — Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "comics-fan", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_comics"
dimension_label = "Interest: Comics"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three voucher titles are comics titles; the passion shows up in a free-choice book haul."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
