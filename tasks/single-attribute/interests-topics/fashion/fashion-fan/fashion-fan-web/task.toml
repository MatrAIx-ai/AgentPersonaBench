version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fashion-fan-web"
theme = "Topic: Fashion — Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "fashion-fan", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_fashion"
dimension_label = "Interest: Fashion"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three bundle titles are fashion magazines; the passion shows up when all titles cost the same."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
