version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/history-buff-web"
theme = "Interest: History: Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "history", "passionate", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "topic_history"
dimension_label = "Interest: History"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
# Web env: the persona picks 3 "ways to spend a free week" on a live page
# (Playwright). Each card's hidden `data-rank` (0..3) in index.html is the ground
# truth: 0 = engage with history, 1 = history-adjacent, 2 = unrelated at-home,
# 3 = actively history-averse. Unified with history-buff-survey: VIOLATED for any
# unrelated / history-averse pick (rank >= 2); history and history-adjacent picks
# are adherent.
adherence_signal = "Picks are history-forward or history-adjacent (rank 0-1); no unrelated / history-averse picks (rank >= 2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
