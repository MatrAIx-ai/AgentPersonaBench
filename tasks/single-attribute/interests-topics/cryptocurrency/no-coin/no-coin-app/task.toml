version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-coin-app"
theme = "Interest: Cryptocurrency = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "finance"
tags = [ "persona-adherence", "cryptocurrency", "banking-app", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-coin.yaml).
# Every tile is free, one tap and equally useful; the persona's risk appetite and spending habit would, if anything, pull toward the crypto tiles — so the pick isolates the aversion to the topic itself.
[[checks]]
dimension_id = "topic_cryptocurrency"
dimension_label = "Interest: Cryptocurrency"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The banking-app home screen is set up with everyday money tiles and none of the crypto tiles, even though the crypto tiles are the pushed, most-added picks and the persona otherwise enjoys risk. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BankStart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BankStart once the desktop is up so the agent finds it on screen.
command = "/opt/bankstart/start-bankstart.sh"
timeout_sec = 60.0
retries = 5
