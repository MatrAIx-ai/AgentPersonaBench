version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-coin-survey"
theme = "Interest: Cryptocurrency = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "finance"
tags = [ "persona-adherence", "cryptocurrency", "banking-app", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-coin.yaml).
# Every tile is free, one tap and equally useful; the persona's risk appetite and spending habit would, if anything, pull toward the crypto tiles — so the pick isolates the aversion to the topic itself.
[[checks]]
dimension_id = "topic_cryptocurrency"
dimension_label = "Interest: Cryptocurrency"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The banking-app home screen is set up with everyday money tiles and none of the crypto tiles, even though the crypto tiles are the pushed, most-added picks and the persona otherwise enjoys risk. Each option id maps to a `coin` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
