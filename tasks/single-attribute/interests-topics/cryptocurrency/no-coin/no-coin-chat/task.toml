version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-coin-chat"
theme = "Interest: Cryptocurrency = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
application_id = "banking_app_onboarding"
tags = [ "persona-adherence", "cryptocurrency", "banking-app", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-coin.yaml).
# Every tile is free, one tap and equally useful; the persona's risk appetite and spending habit would, if anything, pull toward the crypto tiles — so the pick isolates the aversion to the topic itself.
[[checks]]
dimension_id = "topic_cryptocurrency"
dimension_label = "Interest: Cryptocurrency"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "The banking-app home screen is set up with everyday money tiles and none of the crypto tiles, even though the crypto tiles are the pushed, most-added picks and the persona otherwise enjoys risk. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
