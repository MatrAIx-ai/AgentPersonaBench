version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-coin-web"
theme = "Interest: Cryptocurrency = Averse"

[metadata]
difficulty = "medium"
type = "web"
domain = "finance"
tags = [ "persona-adherence", "cryptocurrency", "banking-app", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-coin.yaml).
# Every tile is free, one tap and equally useful; the persona's risk appetite and spending habit would, if anything, pull toward the crypto tiles — so the pick isolates the aversion to the topic itself.
[[checks]]
dimension_id = "topic_cryptocurrency"
dimension_label = "Interest: Cryptocurrency"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The banking-app home screen is set up with everyday money tiles and none of the crypto tiles, even though the crypto tiles are the pushed, most-added picks and the persona otherwise enjoys risk. Ground truth is each item's data-coin attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
