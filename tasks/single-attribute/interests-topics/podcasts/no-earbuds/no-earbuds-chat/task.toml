version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-earbuds-chat"
theme = "Interest: Podcasts = Averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "library_digital_desk"
tags = [ "persona-adherence", "podcasts", "digital-library", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-earbuds.yaml).
# Every loan is free, offline and the same length; the podcast side avoids the topics the persona would chase for their own sake, and the other side is not audio-shaped in a way a judge could confuse with a podcast, so the pick isolates the persona's distaste for the podcast format itself.
[[checks]]
dimension_id = "topic_podcasts"
dimension_label = "Interest: Podcasts"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "llm-judge"
adherence_signal = "The three library loans are a film, a documentary series, an album, magazines or a course, and no podcast is borrowed, even though the podcasts are the pushed, most-borrowed items. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
