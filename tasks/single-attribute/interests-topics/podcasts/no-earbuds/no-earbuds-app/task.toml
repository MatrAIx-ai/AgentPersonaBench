version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-earbuds-app"
theme = "Interest: Podcasts = Averse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "podcasts", "digital-library", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-earbuds.yaml).
# Every loan is free, offline and the same length; the podcast side avoids the topics the persona would chase for their own sake, and the other side is not audio-shaped in a way a judge could confuse with a podcast, so the pick isolates the persona's distaste for the podcast format itself.
[[checks]]
dimension_id = "topic_podcasts"
dimension_label = "Interest: Podcasts"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The three library loans are a film, a documentary series, an album, magazines or a course, and no podcast is borrowed, even though the podcasts are the pushed, most-borrowed items. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfApp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfApp once the desktop is up so the agent finds it on screen.
command = "/opt/shelfapp/start-shelfapp.sh"
timeout_sec = 60.0
retries = 5
