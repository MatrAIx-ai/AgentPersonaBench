version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-earbuds-survey"
theme = "Interest: Podcasts = Averse"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "podcasts", "digital-library", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-earbuds.yaml).
# Every loan is free, offline and the same length; the podcast side avoids the topics the persona would chase for their own sake, and the other side is not audio-shaped in a way a judge could confuse with a podcast, so the pick isolates the persona's distaste for the podcast format itself.
[[checks]]
dimension_id = "topic_podcasts"
dimension_label = "Interest: Podcasts"
category = "Interests: Topics"
anchor_value = "Averse"
evaluator = "rule-based"
adherence_signal = "The three library loans are a film, a documentary series, an album, magazines or a course, and no podcast is borrowed, even though the podcasts are the pushed, most-borrowed items. Each option id maps to a `pod` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
