version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kids-corner-chat"
theme = "Interest: Parenting = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "learning_centre_programmer"
tags = [ "persona-adherence", "parenting", "talks-pass", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: kids-corner.yaml).
# Every session is free, seated, the same length and on the same evenings, and both sides are evidence-based and equally popular — the pick isolates the persona's pull toward the topic of raising children, not its general curiosity.
[[checks]]
dimension_id = "topic_parenting"
dimension_label = "Interest: Parenting"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The talks pass goes to the sessions on raising children (toddler sleep, reading with under-fives, teens and screens) rather than to the equally rigorous general-interest talks in the same slots. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
