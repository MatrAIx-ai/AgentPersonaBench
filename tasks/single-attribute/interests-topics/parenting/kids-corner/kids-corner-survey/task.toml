version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/kids-corner-survey"
theme = "Interest: Parenting = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "parenting", "talks-pass", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: kids-corner.yaml).
# Every session is free, seated, the same length and on the same evenings, and both sides are evidence-based and equally popular — the pick isolates the persona's pull toward the topic of raising children, not its general curiosity.
[[checks]]
dimension_id = "topic_parenting"
dimension_label = "Interest: Parenting"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The talks pass goes to the sessions on raising children (toddler sleep, reading with under-fives, teens and screens) rather than to the equally rigorous general-interest talks in the same slots. Each option id maps to a `kids` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
