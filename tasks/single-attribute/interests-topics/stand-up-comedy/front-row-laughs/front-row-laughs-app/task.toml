version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/front-row-laughs-app"
theme = "Interest: Stand-up comedy = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "stand-up-comedy", "theatre-season", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: front-row-laughs.yaml).
# Every slot is free with the pass, the same length and in the same hall; the comedy is clean and warm to match the persona's wholesome humour, the other side is drawn from forms the persona rates neutral, and no magic act appears, so the pick isolates the persona's own appetite for stand-up.
[[checks]]
dimension_id = "topic_stand_up_comedy"
dimension_label = "Interest: Stand-up comedy"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The season-pass slots go to the stand-up nights — a touring comic's hour, new material, the gala — rather than the equally strong drama, musical and recital the box office pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StallsApp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StallsApp once the desktop is up so the agent finds it on screen.
command = "/opt/stallsapp/start-stallsapp.sh"
timeout_sec = 60.0
retries = 5
