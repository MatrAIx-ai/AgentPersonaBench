version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/built-form-web"
theme = "Interest: Architecture = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "culture"
tags = [ "persona-adherence", "architecture", "culture-card", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: built-form.yaml).
# Every entry is free with the card, small-group or self-paced, and on the same weekend; both sides are quiet, unhurried culture — the pick isolates the persona's pull toward architecture from crowd size, cost or general cultural appetite.
[[checks]]
dimension_id = "topic_architecture"
dimension_label = "Interest: Architecture"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The culture card's three free entries go to buildings — a brutalism walk, a cathedral roof space, a modernist house — rather than the equally good recital, workshop and museum late the card pushes. Ground truth is each item's data-built attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
