version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/built-form-chat"
theme = "Interest: Architecture = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "culture"
application_id = "culture_card_concierge"
tags = [ "persona-adherence", "architecture", "culture-card", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: built-form.yaml).
# Every entry is free with the card, small-group or self-paced, and on the same weekend; both sides are quiet, unhurried culture — the pick isolates the persona's pull toward architecture from crowd size, cost or general cultural appetite.
[[checks]]
dimension_id = "topic_architecture"
dimension_label = "Interest: Architecture"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The culture card's three free entries go to buildings — a brutalism walk, a cathedral roof space, a modernist house — rather than the equally good recital, workshop and museum late the card pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
