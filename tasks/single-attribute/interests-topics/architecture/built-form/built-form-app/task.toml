version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/built-form-app"
theme = "Interest: Architecture = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "architecture", "culture-card", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: built-form.yaml).
# Every entry is free with the card, small-group or self-paced, and on the same weekend; both sides are quiet, unhurried culture — the pick isolates the persona's pull toward architecture from crowd size, cost or general cultural appetite.
[[checks]]
dimension_id = "topic_architecture"
dimension_label = "Interest: Architecture"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The culture card's three free entries go to buildings — a brutalism walk, a cathedral roof space, a modernist house — rather than the equally good recital, workshop and museum late the card pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CityCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CityCard once the desktop is up so the agent finds it on screen.
command = "/opt/citycard/start-citycard.sh"
timeout_sec = 60.0
retries = 5
