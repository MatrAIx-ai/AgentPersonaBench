version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/mandarin-speaker-chat"
theme = "Language: Mandarin — Fluent"

[metadata]
difficulty = "easy"
type = "chat"
domain = "community"
tags = [ "persona-adherence", "mandarin-speaker", "llm-judge",]

[[checks]]
dimension_id = "lang_mandarin"
dimension_label = "Language: Mandarin"
category = "Linguistic: Language"
anchor_value = "Fluent"
evaluator = "llm-judge"
adherence_signal = "The persona volunteers for the Mandarin-language shifts, offering that capability unprompted, even though the assistant only ever pushes the general shifts."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
