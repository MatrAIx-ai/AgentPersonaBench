version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hindi-speaker-web"
theme = "Language: Hindi — Fluent"

[metadata]
difficulty = "medium"
type = "web"
domain = "community"
tags = [ "persona-adherence", "hindi-speaker", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lang_hindi"
dimension_label = "Language: Hindi"
category = "Linguistic: Language"
anchor_value = "Fluent"
evaluator = "rule-based"
adherence_signal = "The persona enrols in the Hindi-language tracks, volunteering that capability unprompted, even though the coordinator only pushes the operational tracks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
