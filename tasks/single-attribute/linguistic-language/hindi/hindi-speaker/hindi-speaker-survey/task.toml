version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hindi-speaker-survey"
theme = "Language: Hindi — Fluent"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "hindi-speaker", "rule-based",]

[[checks]]
dimension_id = "lang_hindi"
dimension_label = "Language: Hindi"
category = "Linguistic: Language"
anchor_value = "Fluent"
evaluator = "rule-based"
adherence_signal = "The persona enrols in the Hindi-language tracks, volunteering that capability unprompted, even though the coordinator only pushes the operational tracks."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
