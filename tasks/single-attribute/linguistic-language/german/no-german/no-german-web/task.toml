version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-german-web"
theme = "Language: German — None"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "no-german", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lang_german"
dimension_label = "Language: German"
category = "Linguistic: Language"
anchor_value = "None"
evaluator = "rule-based"
adherence_signal = "None of the titles the persona queues are German-language originals without subtitles, despite equal cost, equal acclaim and repeated recommendation."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
