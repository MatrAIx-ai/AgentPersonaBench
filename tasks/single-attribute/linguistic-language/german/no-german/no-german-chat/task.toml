version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-german-chat"
theme = "Language: German — None"

[metadata]
difficulty = "easy"
type = "chat"
domain = "media"
tags = [ "persona-adherence", "no-german", "llm-judge",]

[[checks]]
dimension_id = "lang_german"
dimension_label = "Language: German"
category = "Linguistic: Language"
anchor_value = "None"
