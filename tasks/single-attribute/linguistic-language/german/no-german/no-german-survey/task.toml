version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-german-survey"
theme = "Language: German — None"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "no-german", "rule-based",]

[[checks]]
dimension_id = "lang_german"
dimension_label = "Language: German"
category = "Linguistic: Language"
anchor_value = "None"
evaluator = "rule-based"
adherence_signal = "None of the titles the persona queues are German-language originals without subtitles, despite equal cost, equal acclaim and repeated recommendation."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
