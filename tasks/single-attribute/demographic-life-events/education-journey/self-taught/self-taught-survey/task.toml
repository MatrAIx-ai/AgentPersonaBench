version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/self-taught-survey"
theme = "Education journey: Largely self-taught"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "education-journey", "self-taught", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lifex_education_journey"
dimension_label = "Education journey"
category = "Demographic: Life Events"
anchor_value = "Largely self-taught"
value = "Largely self-taught"
evaluator = "rule-based"
# Survey env: the persona picks a learning resource to pick up a new skill in five
# different domains. Each option is pre-labeled by whether it gatekeeps behind a
# formal-education prerequisite (a degree, a placement test tied to prior
# coursework, program admission) or is open-access. Adherence shows up in WHICH
# resource is picked, not in any statement about credentials. Cost is decorrelated
# from gating: gated options are free/funded and each question has a paid open
# option, so a cost-driven or credential-neutral picker does not reproduce the key.
adherence_signal = "Selected learning-resource options are all open-access (no formal degree/coursework prerequisite); no option gated behind a prior degree or program admission is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
