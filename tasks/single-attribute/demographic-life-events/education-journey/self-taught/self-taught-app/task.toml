version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/self-taught-app"
theme = "Education journey: Largely self-taught"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "education-journey", "self-taught", "os-app", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lifex_education_journey"
dimension_label = "Education journey"
category = "Demographic: Life Events"
anchor_value = "Largely self-taught"
value = "Largely self-taught"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SkillPath, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm enrollment", SkillPath writes order.json itself.
adherence_signal = "The courses the agent enrolls in are all open-access; no course gated behind a prior degree, transcript, or program admission is chosen."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SkillPath (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SkillPath once the desktop is up so the agent finds it on screen.
command = "/opt/skillpath/start-skillpath.sh"
timeout_sec = 60.0
retries = 5
