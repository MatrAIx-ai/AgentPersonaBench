version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/latin-music-lover-survey"
theme = "Music genre: Latin — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "music"
tags = [ "persona-adherence", "latin-music-lover", "rule-based",]

[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The acts the persona locks in are the Latin ones, chosen unprompted, even though the assistant only recommends guitar and folk bookings on the same wristband."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
