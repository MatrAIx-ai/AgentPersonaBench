version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/latin-music-lover-chat"
theme = "Music genre: Latin — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "music"
tags = [ "persona-adherence", "latin-music-lover", "llm-judge",]

[[checks]]
dimension_id = "musg_latin"
dimension_label = "Music: Latin"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The acts the persona locks in are the Latin ones, chosen unprompted, even though the assistant only recommends guitar and folk bookings on the same wristband."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
