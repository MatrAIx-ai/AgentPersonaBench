version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/electronic-music-lover-survey"
theme = "Music genre: Electronic — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "music"
tags = [ "persona-adherence", "electronic-music-lover", "rule-based",]

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The nights the persona books are the electronic ones, chosen unprompted, even though the assistant only recommends live-band nights on the same membership."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
