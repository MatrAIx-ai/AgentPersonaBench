version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/electronic-music-lover-chat"
theme = "Music genre: Electronic — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "music"
tags = [ "persona-adherence", "electronic-music-lover", "llm-judge",]

[[checks]]
dimension_id = "musg_electronic"
dimension_label = "Music: Electronic"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The nights the persona books are the electronic ones, chosen unprompted, even though the assistant only recommends live-band nights on the same membership."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
