version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/horror-film-lover-chat"
theme = "Film genre: Horror — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "film"
tags = [ "persona-adherence", "horror-film-lover", "llm-judge",]

[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The films the persona picks are the horror titles, chosen unprompted, even though the assistant only recommends the competition strand on the same pass."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
