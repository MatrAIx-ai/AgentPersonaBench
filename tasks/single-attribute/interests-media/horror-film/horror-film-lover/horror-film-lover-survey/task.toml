version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/horror-film-lover-survey"
theme = "Film genre: Horror — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "film"
tags = [ "persona-adherence", "horror-film-lover", "rule-based",]

[[checks]]
dimension_id = "filmg_horror"
dimension_label = "Film: Horror"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The films the persona picks are the horror titles, chosen unprompted, even though the assistant only recommends the competition strand on the same pass."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
