version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/period-screen-app"
theme = "Film: Historical = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "historical-films", "monthly-picks", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: period-screen.yaml).
# Every title is new this month, included in the plan and in the same length band with equal acclaim — the pick isolates the persona's pull toward films set in the past from cost, length or hype.
[[checks]]
dimension_id = "filmg_historical"
dimension_label = "Film: Historical"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The month's three film picks are historical dramas and epics rather than the equally acclaimed thriller, comedy, sci-fi and animation the service pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WatchList (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WatchList once the desktop is up so the agent finds it on screen.
command = "/opt/watchlist/start-watchlist.sh"
timeout_sec = 60.0
retries = 5
