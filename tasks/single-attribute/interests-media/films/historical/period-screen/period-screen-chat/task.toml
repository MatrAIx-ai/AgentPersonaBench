version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/period-screen-chat"
theme = "Film: Historical = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "streaming_picks_curator"
tags = [ "persona-adherence", "historical-films", "monthly-picks", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: period-screen.yaml).
# Every title is new this month, included in the plan and in the same length band with equal acclaim — the pick isolates the persona's pull toward films set in the past from cost, length or hype.
[[checks]]
dimension_id = "filmg_historical"
dimension_label = "Film: Historical"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The month's three film picks are historical dramas and epics rather than the equally acclaimed thriller, comedy, sci-fi and animation the service pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
