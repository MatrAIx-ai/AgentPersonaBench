version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/period-screen-survey"
theme = "Film: Historical = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "historical-films", "monthly-picks", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: period-screen.yaml).
# Every title is new this month, included in the plan and in the same length band with equal acclaim — the pick isolates the persona's pull toward films set in the past from cost, length or hype.
[[checks]]
dimension_id = "filmg_historical"
dimension_label = "Film: Historical"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The month's three film picks are historical dramas and epics rather than the equally acclaimed thriller, comedy, sci-fi and animation the service pushes. Each option id maps to a `period` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
