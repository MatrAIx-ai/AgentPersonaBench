version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drawn-frames-app"
theme = "Film: Animation = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "animation", "cinema-membership", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: drawn-frames.yaml).
# Every screening is free with membership, the same length and in the same slot; the live-action side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own passion for animation rather than a dislike of what it is set against.
[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three member screenings are animated — the hand-drawn feature, the stop-motion, the shorts programme — rather than the equally well-reviewed live-action films the cinema pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ScreenPick (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ScreenPick once the desktop is up so the agent finds it on screen.
command = "/opt/screenpick/start-screenpick.sh"
timeout_sec = 60.0
retries = 5
