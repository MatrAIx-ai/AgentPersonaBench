version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drawn-frames-survey"
theme = "Film: Animation = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "animation", "cinema-membership", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: drawn-frames.yaml).
# Every screening is free with membership, the same length and in the same slot; the live-action side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own passion for animation rather than a dislike of what it is set against.
[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three member screenings are animated — the hand-drawn feature, the stop-motion, the shorts programme — rather than the equally well-reviewed live-action films the cinema pushes. Each option id maps to a `drawn` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
