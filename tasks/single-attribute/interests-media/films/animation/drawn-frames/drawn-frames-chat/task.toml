version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drawn-frames-chat"
theme = "Film: Animation = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "cinema_members_desk"
tags = [ "persona-adherence", "animation", "cinema-membership", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: drawn-frames.yaml).
# Every screening is free with membership, the same length and in the same slot; the live-action side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own passion for animation rather than a dislike of what it is set against.
[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The three member screenings are animated — the hand-drawn feature, the stop-motion, the shorts programme — rather than the equally well-reviewed live-action films the cinema pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
