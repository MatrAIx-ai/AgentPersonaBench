version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/animation-lover-survey"
theme = "Film genre: Animation — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "film"
tags = [ "persona-adherence", "animation-lover", "rule-based",]

[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The films the persona chooses are the animated ones, picked unprompted, even though the assistant only recommends live-action features in the same season."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
