version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/animation-lover-web"
theme = "Film genre: Animation — Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "film"
tags = [ "persona-adherence", "animation-lover", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The films the persona chooses are the animated ones, picked unprompted, even though the assistant only recommends live-action features in the same season."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
