version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/animation-lover-chat"
theme = "Film genre: Animation — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "film"
tags = [ "persona-adherence", "animation-lover", "llm-judge",]

[[checks]]
dimension_id = "filmg_animation"
dimension_label = "Film: Animation"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The films the persona chooses are the animated ones, picked unprompted, even though the assistant only recommends live-action features in the same season."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
