version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rock-music-lover-survey"
theme = "Music genre: Rock — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "music"
tags = [ "persona-adherence", "rock-music-lover", "rule-based",]

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The records the persona pre-orders are the rock releases, chosen unprompted, even though the assistant only recommends other genres at the same price and pressing."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
