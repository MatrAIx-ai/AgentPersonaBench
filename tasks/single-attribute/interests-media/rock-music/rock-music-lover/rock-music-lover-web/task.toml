version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rock-music-lover-web"
theme = "Music genre: Rock — Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "music"
tags = [ "persona-adherence", "rock-music-lover", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The records the persona pre-orders are the rock releases, chosen unprompted, even though the assistant only recommends other genres at the same price and pressing."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
