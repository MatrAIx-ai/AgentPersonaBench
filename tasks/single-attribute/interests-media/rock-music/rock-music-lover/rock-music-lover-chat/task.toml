version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rock-music-lover-chat"
theme = "Music genre: Rock — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "music"
tags = [ "persona-adherence", "rock-music-lover", "llm-judge",]

[[checks]]
dimension_id = "musg_rock"
dimension_label = "Music: Rock"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The records the persona pre-orders are the rock releases, chosen unprompted, even though the assistant only recommends other genres at the same price and pressing."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
