version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hall-locker-web"
theme = "Books: Young adult = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "books"
tags = [ "persona-adherence", "young-adult", "donated-books-table", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: hall-locker.yaml).
# Every book is free, in the same good condition and donated in the same batch off one table; mystery, biography, literary fiction, fantasy, travel writing, cookbooks and popular science are kept off both sides so none of this reader's neighbouring genre tastes can answer for the pin, every alternative is drawn from a genre this reader is recorded neutral on, and description length alternates which side runs longer so no wordiest-option heuristic can pick the keyed title.
[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three books taken off the donated table are the young-adult titles — school years, teenage narrators, coming-of-age — rather than the equally free grown-up shelf the library pushes. Ground truth is each item's data-lantern attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
