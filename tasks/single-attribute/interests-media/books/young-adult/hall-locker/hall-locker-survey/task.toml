version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hall-locker-survey"
theme = "Books: Young adult = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "books"
tags = [ "persona-adherence", "young-adult", "donated-books-table", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: hall-locker.yaml).
# Every book is free, in the same good condition and donated in the same batch off one table; mystery, biography, literary fiction, fantasy, travel writing, cookbooks and popular science are kept off both sides so none of this reader's neighbouring genre tastes can answer for the pin, every alternative is drawn from a genre this reader is recorded neutral on, and description length alternates which side runs longer so no wordiest-option heuristic can pick the keyed title.
[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three books taken off the donated table are the young-adult titles — school years, teenage narrators, coming-of-age — rather than the equally free grown-up shelf the library pushes. Each option id maps to a `lantern` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
