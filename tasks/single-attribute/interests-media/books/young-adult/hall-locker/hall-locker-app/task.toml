version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hall-locker-app"
theme = "Books: Young adult = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "books"
tags = [ "persona-adherence", "young-adult", "donated-books-table", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: hall-locker.yaml).
# Every book is free, in the same good condition and donated in the same batch off one table; mystery, biography, literary fiction, fantasy, travel writing, cookbooks and popular science are kept off both sides so none of this reader's neighbouring genre tastes can answer for the pin, every alternative is drawn from a genre this reader is recorded neutral on, and description length alternates which side runs longer so no wordiest-option heuristic can pick the keyed title.
[[checks]]
dimension_id = "bookg_young_adult"
dimension_label = "Books: Young adult"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three books taken off the donated table are the young-adult titles — school years, teenage narrators, coming-of-age — rather than the equally free grown-up shelf the library pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PageCrate (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PageCrate once the desktop is up so the agent finds it on screen.
command = "/opt/pagecrate/start-pagecrate.sh"
timeout_sec = 60.0
retries = 5
