version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/case-files-chat"
theme = "Books: True crime = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "bookshop_front_table"
tags = [ "persona-adherence", "true-crime", "bookshop-table", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: case-files.yaml).
# Every title is a new release on the same table at the same price with equal review buzz — the pick isolates the persona's pull toward true crime from cost, format or hype.
[[checks]]
dimension_id = "bookg_true_crime"
dimension_label = "Books: True crime"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The three-for-two picks are true crime (a cold case, a forger's trial, a detective's casebook) rather than the equally reviewed space opera, fantasy and pop-science on the same table. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
