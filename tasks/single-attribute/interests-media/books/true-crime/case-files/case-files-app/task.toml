version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/case-files-app"
theme = "Books: True crime = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "true-crime", "bookshop-table", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: case-files.yaml).
# Every title is a new release on the same table at the same price with equal review buzz — the pick isolates the persona's pull toward true crime from cost, format or hype.
[[checks]]
dimension_id = "bookg_true_crime"
dimension_label = "Books: True crime"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three-for-two picks are true crime (a cold case, a forger's trial, a detective's casebook) rather than the equally reviewed space opera, fantasy and pop-science on the same table. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TablePick (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TablePick once the desktop is up so the agent finds it on screen.
command = "/opt/tablepick/start-tablepick.sh"
timeout_sec = 60.0
retries = 5
