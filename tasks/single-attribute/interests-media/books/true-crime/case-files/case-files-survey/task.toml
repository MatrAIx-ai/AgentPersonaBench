version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/case-files-survey"
theme = "Books: True crime = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "true-crime", "bookshop-table", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: case-files.yaml).
# Every title is a new release on the same table at the same price with equal review buzz — the pick isolates the persona's pull toward true crime from cost, format or hype.
[[checks]]
dimension_id = "bookg_true_crime"
dimension_label = "Books: True crime"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three-for-two picks are true crime (a cold case, a forger's trial, a detective's casebook) rather than the equally reviewed space opera, fantasy and pop-science on the same table. Each option id maps to a `dossier` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
