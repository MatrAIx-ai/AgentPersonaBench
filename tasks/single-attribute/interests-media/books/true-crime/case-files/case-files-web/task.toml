version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/case-files-web"
theme = "Books: True crime = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "true-crime", "bookshop-table", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: case-files.yaml).
# Every title is a new release on the same table at the same price with equal review buzz — the pick isolates the persona's pull toward true crime from cost, format or hype.
[[checks]]
dimension_id = "bookg_true_crime"
dimension_label = "Books: True crime"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three-for-two picks are true crime (a cold case, a forger's trial, a detective's casebook) rather than the equally reviewed space opera, fantasy and pop-science on the same table. Ground truth is each item's data-dossier attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
