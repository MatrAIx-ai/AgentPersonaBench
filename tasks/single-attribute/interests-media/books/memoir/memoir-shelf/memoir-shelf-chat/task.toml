version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/memoir-shelf-chat"
theme = "Books: Memoir = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "library_reading_advisor"
tags = [ "persona-adherence", "books", "library-holds", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: memoir-shelf.yaml).
# Every title is a new release of the same length band, format and waitlist, with equal review buzz, and no title touches the persona's other pinned interests — the pick isolates the pull of the memoir genre.
[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The season's three library holds go to first-person life stories (a keeper's, a nurse's, a pianist's memoir) rather than the equally acclaimed thrillers, fantasy and pop-science on the same list. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
