version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/memoir-shelf-web"
theme = "Books: Memoir = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "books", "library-holds", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: memoir-shelf.yaml).
# Every title is a new release of the same length band, format and waitlist, with equal review buzz, and no title touches the persona's other pinned interests — the pick isolates the pull of the memoir genre.
[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The season's three library holds go to first-person life stories (a keeper's, a nurse's, a pianist's memoir) rather than the equally acclaimed thrillers, fantasy and pop-science on the same list. Ground truth is each item's data-firsthand attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
