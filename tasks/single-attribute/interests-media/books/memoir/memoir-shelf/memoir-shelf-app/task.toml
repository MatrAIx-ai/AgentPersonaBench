version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/memoir-shelf-app"
theme = "Books: Memoir = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "books", "library-holds", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: memoir-shelf.yaml).
# Every title is a new release of the same length band, format and waitlist, with equal review buzz, and no title touches the persona's other pinned interests — the pick isolates the pull of the memoir genre.
[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The season's three library holds go to first-person life stories (a keeper's, a nurse's, a pianist's memoir) rather than the equally acclaimed thrillers, fantasy and pop-science on the same list. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfMate (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfMate once the desktop is up so the agent finds it on screen.
command = "/opt/shelfmate/start-shelfmate.sh"
timeout_sec = 60.0
retries = 5
