version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/memoir-shelf-survey"
theme = "Books: Memoir = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "books", "library-holds", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: memoir-shelf.yaml).
# Every title is a new release of the same length band, format and waitlist, with equal review buzz, and no title touches the persona's other pinned interests — the pick isolates the pull of the memoir genre.
[[checks]]
dimension_id = "bookg_memoir"
dimension_label = "Books: Memoir"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The season's three library holds go to first-person life stories (a keeper's, a nurse's, a pianist's memoir) rather than the equally acclaimed thrillers, fantasy and pop-science on the same list. Each option id maps to a `firsthand` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
