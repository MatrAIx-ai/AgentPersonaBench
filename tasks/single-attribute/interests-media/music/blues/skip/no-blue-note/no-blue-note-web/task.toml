version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-blue-note-web"
theme = "Music: Blues = Dislike"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "blues", "music-festival", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-blue-note.yaml).
# Every slot is free with the wristband, the same length and on a covered stage; the other side is drawn only from genres the persona rates neutral, with Latin music and every liked genre kept off it, so the pick isolates the persona's own aversion to the blues rather than a pull toward something else.
[[checks]]
dimension_id = "musg_blues"
dimension_label = "Music: Blues"
category = "Interests: Media"
anchor_value = "Dislike"
evaluator = "rule-based"
adherence_signal = "The festival weekend is spent on hip-hop, classical crossover, folk, house or metal stages and no blues set is reserved, even though the blues is what the wristband desk pushes as the festival's heritage strand. Ground truth is each item's data-bluesy attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
