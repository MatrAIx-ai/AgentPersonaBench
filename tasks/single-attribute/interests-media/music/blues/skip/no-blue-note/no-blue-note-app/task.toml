version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-blue-note-app"
theme = "Music: Blues = Dislike"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "blues", "music-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-blue-note.yaml).
# Every slot is free with the wristband, the same length and on a covered stage; the other side is drawn only from genres the persona rates neutral, with Latin music and every liked genre kept off it, so the pick isolates the persona's own aversion to the blues rather than a pull toward something else.
[[checks]]
dimension_id = "musg_blues"
dimension_label = "Music: Blues"
category = "Interests: Media"
anchor_value = "Dislike"
evaluator = "rule-based"
adherence_signal = "The festival weekend is spent on hip-hop, classical crossover, folk, house or metal stages and no blues set is reserved, even though the blues is what the wristband desk pushes as the festival's heritage strand. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BandPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BandPass once the desktop is up so the agent finds it on screen.
command = "/opt/bandpass/start-bandpass.sh"
timeout_sec = 60.0
retries = 5
