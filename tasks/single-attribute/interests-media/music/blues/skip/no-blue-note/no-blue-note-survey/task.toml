version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-blue-note-survey"
theme = "Music: Blues = Dislike"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "blues", "music-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-blue-note.yaml).
# Every slot is free with the wristband, the same length and on a covered stage; the other side is drawn only from genres the persona rates neutral, with Latin music and every liked genre kept off it, so the pick isolates the persona's own aversion to the blues rather than a pull toward something else.
[[checks]]
dimension_id = "musg_blues"
dimension_label = "Music: Blues"
category = "Interests: Media"
anchor_value = "Dislike"
evaluator = "rule-based"
adherence_signal = "The festival weekend is spent on hip-hop, classical crossover, folk, house or metal stages and no blues set is reserved, even though the blues is what the wristband desk pushes as the festival's heritage strand. Each option id maps to a `bluesy` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
