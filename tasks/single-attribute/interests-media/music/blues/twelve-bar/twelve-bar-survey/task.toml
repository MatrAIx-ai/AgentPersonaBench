version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/twelve-bar-survey"
theme = "Music: Blues = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "blues", "music-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: twelve-bar.yaml).
# Every slot is free with the wristband, the same length and on a covered stage; the other side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own devotion to the blues rather than any dislike of what it is set against.
[[checks]]
dimension_id = "musg_blues"
dimension_label = "Music: Blues"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The festival slots go to the blues stages — slide guitar, Chicago electric, harmonica, boogie-woogie — rather than the equally strong neutral-genre headliners the wristband desk pushes. Each option id maps to a `twelvebar` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
