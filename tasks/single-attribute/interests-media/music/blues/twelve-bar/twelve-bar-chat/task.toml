version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/twelve-bar-chat"
theme = "Music: Blues = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "festival_slot_desk"
tags = [ "persona-adherence", "blues", "music-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: twelve-bar.yaml).
# Every slot is free with the wristband, the same length and on a covered stage; the other side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own devotion to the blues rather than any dislike of what it is set against.
[[checks]]
dimension_id = "musg_blues"
dimension_label = "Music: Blues"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The festival slots go to the blues stages — slide guitar, Chicago electric, harmonica, boogie-woogie — rather than the equally strong neutral-genre headliners the wristband desk pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
