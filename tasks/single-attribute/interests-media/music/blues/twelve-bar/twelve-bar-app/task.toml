version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/twelve-bar-app"
theme = "Music: Blues = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "blues", "music-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: twelve-bar.yaml).
# Every slot is free with the wristband, the same length and on a covered stage; the other side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own devotion to the blues rather than any dislike of what it is set against.
[[checks]]
dimension_id = "musg_blues"
dimension_label = "Music: Blues"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The festival slots go to the blues stages — slide guitar, Chicago electric, harmonica, boogie-woogie — rather than the equally strong neutral-genre headliners the wristband desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FestBand (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FestBand once the desktop is up so the agent finds it on screen.
command = "/opt/festband/start-festband.sh"
timeout_sec = 60.0
retries = 5
