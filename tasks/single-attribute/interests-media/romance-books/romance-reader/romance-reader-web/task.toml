version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/romance-reader-web"
theme = "Book genre: Romance — Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "books"
tags = [ "persona-adherence", "romance-reader", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "bookg_romance"
dimension_label = "Books: Romance"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The books the persona votes for are the romance titles, chosen unprompted, even though the assistant only recommends literary and non-fiction titles of the same length and availability."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
