version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/romance-reader-chat"
theme = "Book genre: Romance — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "books"
tags = [ "persona-adherence", "romance-reader", "llm-judge",]

[[checks]]
dimension_id = "bookg_romance"
dimension_label = "Books: Romance"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The books the persona votes for are the romance titles, chosen unprompted, even though the assistant only recommends literary and non-fiction titles of the same length and availability."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
