version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/romance-reader-survey"
theme = "Book genre: Romance — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "books"
tags = [ "persona-adherence", "romance-reader", "rule-based",]

[[checks]]
dimension_id = "bookg_romance"
dimension_label = "Books: Romance"
category = "Interests: Media"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The books the persona votes for are the romance titles, chosen unprompted, even though the assistant only recommends literary and non-fiction titles of the same length and availability."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
