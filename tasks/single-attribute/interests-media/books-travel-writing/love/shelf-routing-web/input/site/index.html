<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelfmark · Shared reading draft</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="bar">
      <span class="logo" aria-hidden="true">
        <svg width="34" height="40" viewBox="0 0 34 40"><rect x="2" y="2" width="30" height="36" rx="3" fill="#fbf7f0" stroke="#fbf7f0" stroke-width="1.5"/><rect x="6" y="2" width="1.6" height="36" fill="#c9b99d"/><path d="M19 0 H27 V20 L23 16.5 L19 20 Z" fill="#c8384f"/><path d="M11 26 H27 M11 30.5 H23" stroke="#b9a98c" stroke-width="1.6"/></svg>
      </span>
      <strong id="brand">Shelfmark</strong>
      <span class="sep" aria-hidden="true"></span>
      <span id="subtitle"></span>
      <span id="progress"></span>
    </div>
  </header>
  <div class="shell">
    <nav class="rail" aria-label="Library sections">
      <div class="rail-h">Library</div>
      <div class="rail-i">Reading now</div>
      <div class="rail-i">My shelves</div>
      <div class="rail-i on">Shared drafts</div>
      <div class="rail-i">Gifts sent</div>
      <div class="rail-h">Plan</div>
      <div class="rail-card">Household reading plan<br><span>2 readers · all titles included</span></div>
    </nav>
    <main id="workspace" aria-live="polite"><p>Opening your workspace…</p></main>
  </div>
  <footer class="foot">Shelfmark ebooks · Titles are delivered to each reader's own library · Help centre · Accessibility</footer>
  <p id="error" role="alert" hidden></p>
</body>
</html>
