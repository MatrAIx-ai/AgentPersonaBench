version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/career-core-app"
theme = "Value: Career success: Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "career-success", "career-core", "os-app", "computer-use",]

[[checks]]
dimension_id = "val_career_success"
dimension_label = "Value: Career success"
category = "Values & Motivation"
attribute = "Value: Career success"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_career_success=Core value"
# OS-APP env: the persona is a computer-use agent operating CareerPath, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", CareerPath writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The year the agent plans contains no coast / opt-out move (a high career-tier item, tier>=2); a career-as-core-value persona fills the year with ambitious, career-advancing moves."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CareerPath (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CareerPath once the desktop is up so the agent finds it on screen.
command = "/opt/careerpath/start-careerpath.sh"
timeout_sec = 60.0
retries = 5
