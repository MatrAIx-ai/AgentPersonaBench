version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/career-core-chat"
theme = "Value: Career success: Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "career-success", "career-core", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Career success as a core value" is a SEMANTIC trait: no keyword list can tell
# whether a person genuinely stayed career-driven and kept chasing advancement
# over coasting and stepping back. So the evaluator is an LLM judge that reads the
# persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it held
# to going after the bigger role and advancing instead of giving in and coasting.
[[checks]]
dimension_id = "val_career_success"
dimension_label = "Value: Career success"
category = "Values & Motivation"
attribute = "Value: Career success"
value = "Core value"
evaluator = "llm-judge"
evaluator_name = "val_career_success=Core value"
adherence_signal = "Reply stays career-driven / wants to go after the bigger role and keep advancing, and resists the friend's take-it-easy, coast-where-you-are pressure."
# pass = anchor decisively more career-driven than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
