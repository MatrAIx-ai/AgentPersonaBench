version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/premium-seeking-app"
theme = "Economic motivation: Premium-seeking"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "economic-motivation", "premium-seeking", "os-app", "computer-use",]

[[checks]]
dimension_id = "economic_motivation"
dimension_label = "Economic motivation"
category = "Values & Motivation"
anchor_value = "Premium-seeking"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating LuxeCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Checkout", LuxeCart writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The cart the agent checks out contains no budget/bargain item (a low price-tier product, tier>=2); a premium-seeking shopper sticks to top-tier/premium picks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LuxeCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LuxeCart once the desktop is up so the agent finds it on screen.
command = "/opt/luxecart/start-luxecart.sh"
timeout_sec = 60.0
retries = 5
