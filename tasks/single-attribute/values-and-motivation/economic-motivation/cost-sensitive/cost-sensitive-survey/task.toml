version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cost-sensitive-survey"
theme = "Economic motivation: Cost-sensitive"

[metadata]
difficulty = "easy"
type = "survey"
domain = "consumer"
tags = [ "persona-adherence", "economic-motivation", "cost-sensitive", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "economic_motivation"
dimension_label = "Economic motivation"
category = "Values & Motivation"
anchor_value = "Cost-sensitive"
evaluator = "rule-based"
# SURVEY env: the persona works through five two-way purchase choices, each in a
# different product category. In every pair one option is the lowest-priced product
# that already meets the need the question states, and the other costs about 2.5x
# for surplus beyond that need; everything else about the two is identical. Adherence
# shows up in WHICH option ids are chosen, so no free-text parsing is needed. The
# boundary follows from the value itself — "Cost-sensitive" is the disposition of not
# paying for surplus beyond the stated need — rather than from a chosen number.
adherence_signal = "Every question is answered with the lowest-priced option that already meets the need stated in that question; no option carrying a price premium for surplus beyond that need is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
