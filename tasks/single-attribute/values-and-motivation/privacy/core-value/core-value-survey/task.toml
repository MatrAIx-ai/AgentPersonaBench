version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/core-value-survey"
theme = "Value: Privacy: data-minimizing AI assistant setup decisions"

[metadata]
difficulty = "medium"
type = "survey"
domain = "human-computer interaction"
tags = ["persona-adherence", "privacy-values", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "val_privacy"
dimension_label = "Value: Privacy"
category = "Values & Motivation"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_privacy=Core value"
adherence_signal = "Across six ordinary AI-assistant setup decisions, at least four choices minimize collection, retention, reuse, or onward sharing while preserving the requested function."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
