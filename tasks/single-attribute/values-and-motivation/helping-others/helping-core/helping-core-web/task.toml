version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/helping-core-web"
theme = "Value: Helping others: Core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "helping-others", "helping-core", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "val_helping_others"
dimension_label = "Value: Helping others"
category = "Values & Motivation"
attribute = "Value: Helping others"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_helping_others=Core value"
# Web env: the persona builds a Saturday plan from a list on a live page
# (Playwright). Each option's hidden tier (0..3) in tests/answer_key.yaml is the
# ground truth. VIOLATED for any purely self-interested pick (tier >= 2).
adherence_signal = "Saturday plan built from give-back / lend-a-hand options (tier 0-1); no purely self-interested option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
