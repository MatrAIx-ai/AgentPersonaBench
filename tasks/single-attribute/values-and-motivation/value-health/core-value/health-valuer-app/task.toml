version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-valuer-app"
theme = "Value: Health: Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "health"
tags = [ "persona-adherence", "values-and-motivation", "health", "core-value", "os-app", "computer-use",]

[[checks]]
dimension_id = "val_health"
dimension_label = "Value: Health"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SmartCart, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Checkout", SmartCart writes order.json itself. Runs locally in
# Docker (no use.computer needed). Each daily-routine choice carries a hidden
# per-option tier (0 = clearly health-supporting .. 3 = clearly harmful); valuing
# health is made checkable by pre-scoring the choices. Nothing on screen mentions
# health as a value or that anything is being tested.
adherence_signal = "The plan the agent checks out contains no unhealthy choice (a harmful daily-routine option, tier>=2); someone for whom health is a core value picks health-supporting / mostly-healthy options."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SmartCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SmartCart once the desktop is up so the agent finds it on screen.
command = "/opt/smartcart/start-smartcart.sh"
timeout_sec = 60.0
retries = 5
