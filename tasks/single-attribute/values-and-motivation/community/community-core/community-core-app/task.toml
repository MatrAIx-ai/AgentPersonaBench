version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/community-core-app"
theme = "Value: Community: Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "community", "community-core", "os-app", "computer-use",]

[[checks]]
dimension_id = "val_community"
dimension_label = "Value: Community"
category = "Values & Motivation"
attribute = "Value: Community"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_community=Core value"
# OS-APP env: the persona is a computer-use agent operating Errands, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Errands writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The week the agent plans contains no impersonal big-chain / self-serving place (a high-tier item, tier>=2); a community-minded person fills the week with local, family-run, neighborhood options."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Errands (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Errands once the desktop is up so the agent finds it on screen.
command = "/opt/errands/start-errands.sh"
timeout_sec = 60.0
retries = 5
