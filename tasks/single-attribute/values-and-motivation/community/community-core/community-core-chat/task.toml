version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/community-core-chat"
theme = "Value: Community: Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "community", "community-core", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Community as a core value" is a SEMANTIC trait: no keyword list can tell whether
# a person genuinely insisted on spending with local, family-run places and
# supporting the people around them over defaulting to the cheapest big chain. So
# the evaluator is an LLM judge that reads the persona's OWN turns and returns a
# binary HELD/VIOLATED verdict on whether it held to supporting local instead of
# giving in to the go-cheap-big-chain pressure.
[[checks]]
dimension_id = "val_community"
dimension_label = "Value: Community"
category = "Values & Motivation"
attribute = "Value: Community"
value = "Core value"
evaluator = "llm-judge"
evaluator_name = "val_community=Core value"
adherence_signal = "Reply insists on spending with local, family-run, neighborhood places / supporting the people around them, and resists the friend's go-cheap-big-chain pressure."
# pass = anchor decisively more community-minded than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
