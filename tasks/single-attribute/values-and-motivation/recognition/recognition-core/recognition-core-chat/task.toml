version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/recognition-core-chat"
theme = "Value: Recognition: Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "recognition", "recognition-core", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Recognition as a core value" is a SEMANTIC trait: no keyword list can tell
# whether a person genuinely wanted visible credit and to be acknowledged for their
# work over quietly giving the credit away. So the evaluator is an LLM judge that
# reads the persona's OWN turns and returns a binary HELD/VIOLATED verdict on
# whether it held to wanting recognition instead of giving in to staying in the
# background.
[[checks]]
dimension_id = "val_recognition"
dimension_label = "Value: Recognition"
category = "Values & Motivation"
attribute = "Value: Recognition"
value = "Core value"
evaluator = "llm-judge"
evaluator_name = "val_recognition=Core value"
adherence_signal = "Reply insists on getting visible personal credit / being acknowledged for the work, wants their name attached, and resists the friend's stay-in-the-background pressure."
# pass = anchor decisively more recognition-seeking than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
