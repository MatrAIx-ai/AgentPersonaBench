version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/aesthete-web"
theme = "Beauty & aesthetics: A core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "beauty-aesthetics", "core-value", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "val_beauty_aesthetics"
dimension_label = "Beauty / aesthetics"
category = "Values & Motivation"
attribute = "val_beauty_aesthetics"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_beauty_aesthetics=Core value"
# Web env: the persona adds items to a shopping list on a live page (Playwright).
# Each item's hidden `data-utility` (0..3) in index.html is the ground truth.
# VIOLATED for any purely utilitarian pick that ignores looks (utility >= 2).
adherence_signal = "Shopping list built from beautiful/well-designed items (data-utility 0-1); no purely utilitarian pick that ignores looks (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
