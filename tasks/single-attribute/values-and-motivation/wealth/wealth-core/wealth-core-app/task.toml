version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/wealth-core-app"
theme = "Value: Wealth: Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "wealth", "wealth-core", "os-app", "computer-use",]

[[checks]]
dimension_id = "val_wealth"
dimension_label = "Value: Wealth"
category = "Values & Motivation"
attribute = "Value: Wealth"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_wealth=Core value"
# OS-APP env: the persona is a computer-use agent operating NextMove, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", NextMove writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The moves the agent shortlists contain no give-up-money-for-comfort option (a high money-tier item, tier>=2); a wealth-core persona fills the shortlist with money-building, high-earning, financial-gain moves."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NextMove (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NextMove once the desktop is up so the agent finds it on screen.
command = "/opt/nextmove/start-nextmove.sh"
timeout_sec = 60.0
retries = 5
