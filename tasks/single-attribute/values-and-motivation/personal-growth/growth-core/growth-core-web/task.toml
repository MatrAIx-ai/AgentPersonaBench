version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/growth-core-web"
theme = "Value: Personal growth: Core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "personal-growth", "growth-core", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "val_personal_growth"
dimension_label = "Value: Personal growth"
category = "Values & Motivation"
attribute = "Value: Personal growth"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_personal_growth=Core value"
# Web env: the persona adds ways to spend their free evenings to a plan on a live
# page (Playwright). Each option's hidden tier (0..3) in tests/answer_key.yaml is
# the ground truth. VIOLATED for any stay-put / purely-passive / no-growth pick
# (tier >= 2).
adherence_signal = "Plan built from options that keep learning / build a skill / improve (tier 0-1); no stay-put, purely-passive, no-growth option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
