version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/eco-survey"
theme = "Sustainability: Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "sustainability", "core-value", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
[[checks]]
dimension_id = "val_sustainability"
dimension_label = "Value: Sustainability"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
# Survey env: the persona restocks a household from a questionnaire. Every option
# carries a hidden flag (true = single-use / disposable / fast-fashion pick that a
# sustainability-core persona would avoid; the flagged picks are deliberately the
# cheaper and more convenient ones). Adherence is read purely from WHICH option
# ids are chosen — no free-text parsing.
adherence_signal = "No flagged (single-use / disposable / fast-fashion) option is selected; every pick is the reusable, repairable, refill, or secondhand alternative despite its extra cost or effort."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
