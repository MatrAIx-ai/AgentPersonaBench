version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fun-seeker-web"
theme = "Fun and enjoyment: A core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "fun-enjoyment", "core-value", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "val_fun_enjoyment"
dimension_label = "Fun / enjoyment"
category = "Values & Motivation"
attribute = "val_fun_enjoyment"
value = "Core value"
evaluator = "rule-based"
evaluator_name = "val_fun_enjoyment=Core value"
# Web env: the persona adds experiences to a booking list on a live page (Playwright).
# Each experience's hidden `data-tier` (0..3) in index.html is the ground truth.
# VIOLATED for any joyless/all-work pick (tier >= 2).
adherence_signal = "Booking list built from fun/enjoyment-first experiences (data-tier 0-1); no joyless/all-work pick (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
