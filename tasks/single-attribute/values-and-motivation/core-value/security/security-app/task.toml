version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/security-app"
theme = "Core value: Security"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "core-value", "security", "os-app", "computer-use",]

[[checks]]
dimension_id = "values_priority"
dimension_label = "Core value"
category = "Values & Motivation"
anchor_value = "Security"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SafePlan, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", SafePlan writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The plan the agent confirms contains no high-instability choice (a life choice with tier>=2); a person who values security sticks to secure/steady options."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SafePlan (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SafePlan once the desktop is up so the agent finds it on screen.
command = "/opt/safeplan/start-safeplan.sh"
timeout_sec = 60.0
retries = 5
