version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/very-high-chat"
theme = "Schwartz Benevolence: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "social"
tags = [ "persona-adherence", "schwartz_value_benevolence", "llm-judge", "anchor-vs-contrast",]

[[checks]]
dimension_id = "schwartz_value_benevolence"
dimension_label = "Schwartz Benevolence"
category = "Values & Motivation"
anchor_value = "Very high"
evaluator = "llm-judge"
adherence_signal = "The user offers real help (a ride, money, calling someone, etc.) rather than accepting that it's not their problem."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
