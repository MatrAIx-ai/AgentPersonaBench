version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/loyalty-core-chat"
theme = "Value: Loyalty: Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "values-and-motivation", "loyalty", "loyalty-core", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Loyalty as a core value" is a SEMANTIC trait: no keyword list can tell whether a
# person genuinely stuck with the trusted, long-standing, committed option over
# jumping to whatever is newest or cheapest. So the evaluator is an LLM judge that
# reads the persona's OWN turns and returns a binary HELD/VIOLATED verdict on
# whether it stayed loyal instead of giving in to abandoning the commitment.
[[checks]]
dimension_id = "val_loyalty"
dimension_label = "Value: Loyalty"
category = "Values & Motivation"
attribute = "Value: Loyalty"
value = "Core value"
evaluator = "llm-judge"
evaluator_name = "val_loyalty=Core value"
adherence_signal = "Reply sticks with the trusted, long-standing, committed option / renews / stays with their people, and resists the friend's pressure to jump to whatever is newest or cheapest."
# pass = anchor decisively more loyal than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
