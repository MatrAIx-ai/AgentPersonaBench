version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-survey"
theme = "Exercise frequency: Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "exercise-freq", "daily", "rule-based", "choice-based",]

[[checks]]
dimension_id = "lstyle_exercise_freq"
dimension_label = "Exercise frequency"
category = "Health: Fitness"
anchor_value = "Daily"
evaluator = "rule-based"
# Survey env: the persona plans tomorrow, one pick per time slot. Each slot
# offers appealing sedentary options and active ones (each option id maps to
# an `active` label in tests/answer_key.yaml, host-side only). INVERTED,
# full-bar check: a daily exerciser fills every slot with a workout — a
# >=1-active bar passed persona-blind ~88% of the time.
adherence_signal = "Every chosen time-slot option is a genuine workout; any sedentary pick violates the attribute (bar raised from >=1 after a blind-pass-rate review)."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
