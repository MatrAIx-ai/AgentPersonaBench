version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fitness-passionate-app"
theme = "Interest: Fitness: Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "health"
tags = [ "persona-adherence", "interest-fitness", "passionate", "os-app", "computer-use",]

[[checks]]
dimension_id = "topic_fitness"
dimension_label = "Interest: Fitness"
category = "Health: Fitness"
anchor_value = "Passionate"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating FitPlan, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", FitPlan writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The weekly plan the agent confirms contains no sedentary activity (a high activity-tier item, tier>=2); a fitness-passionate person fills their week with active exercise."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FitPlan (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FitPlan once the desktop is up so the agent finds it on screen.
command = "/opt/fitplan/start-fitplan.sh"
timeout_sec = 60.0
retries = 5
