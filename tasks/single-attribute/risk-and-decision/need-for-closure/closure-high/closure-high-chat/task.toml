version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-high-chat"
theme = "Need for Closure = High"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
application_id = "plans_desk_assistant"
tags = [ "persona-adherence", "need-for-closure", "pending-plans", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: closure-high.yaml).
# Locking now and deciding later cost the same and neither risks losing the plan, so settled-vs-open is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "High"
evaluator = "llm-judge"
adherence_signal = "Each pending plan gets settled and locked now rather than held open, despite the open options promising maximum flexibility at no cost. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
