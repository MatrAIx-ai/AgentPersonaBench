version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-high-app"
theme = "Need for Closure = High"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "need-for-closure", "pending-plans", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: closure-high.yaml).
# Locking now and deciding later cost the same and neither risks losing the plan, so settled-vs-open is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "Each pending plan gets settled and locked now rather than held open, despite the open options promising maximum flexibility at no cost. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SettleUp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SettleUp once the desktop is up so the agent finds it on screen.
command = "/opt/settleup/start-settleup.sh"
timeout_sec = 60.0
retries = 5
