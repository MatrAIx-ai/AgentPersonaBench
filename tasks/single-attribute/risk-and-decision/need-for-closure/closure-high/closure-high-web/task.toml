version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-high-web"
theme = "Need for Closure = High"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "need-for-closure", "pending-plans", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: closure-high.yaml).
# Locking now and deciding later cost the same and neither risks losing the plan, so settled-vs-open is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "Each pending plan gets settled and locked now rather than held open, despite the open options promising maximum flexibility at no cost. Ground truth is each item's data-openended attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
