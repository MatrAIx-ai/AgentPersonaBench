version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-high-survey"
theme = "Need for Closure = High"

[metadata]
difficulty = "easy"
type = "survey"
domain = "lifestyle"
tags = [ "persona-adherence", "need-for-closure", "pending-plans", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: closure-high.yaml).
# Locking now and deciding later cost the same and neither risks losing the plan, so settled-vs-open is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "High"
evaluator = "rule-based"
adherence_signal = "Each pending plan gets settled and locked now rather than held open, despite the open options promising maximum flexibility at no cost. Each option id maps to a `openended` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
