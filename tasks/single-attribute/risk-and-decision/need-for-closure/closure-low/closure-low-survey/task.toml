version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-low-survey"
theme = "Need for Closure = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "need-for-closure", "studio-build", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: closure-low.yaml).
# The budget and timeline allow either path equally, so comfort-with-openness is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The studio build stays in exploration (parallel quotes, a comparison pilot, both layouts prototyped) rather than snapping to the first committed answer, despite committing today being pitched as a weight off the mind. Each option id maps to a `hasty` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
