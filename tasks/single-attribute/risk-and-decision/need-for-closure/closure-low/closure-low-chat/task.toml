version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-low-chat"
theme = "Need for Closure = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "household"
application_id = "studio_build_coordinator"
tags = [ "persona-adherence", "need-for-closure", "studio-build", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: closure-low.yaml).
# The budget and timeline allow either path equally, so comfort-with-openness is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "Low"
evaluator = "llm-judge"
adherence_signal = "The studio build stays in exploration (parallel quotes, a comparison pilot, both layouts prototyped) rather than snapping to the first committed answer, despite committing today being pitched as a weight off the mind. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
