version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-low-web"
theme = "Need for Closure = Low"

[metadata]
difficulty = "medium"
type = "web"
domain = "household"
tags = [ "persona-adherence", "need-for-closure", "studio-build", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: closure-low.yaml).
# The budget and timeline allow either path equally, so comfort-with-openness is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The studio build stays in exploration (parallel quotes, a comparison pilot, both layouts prototyped) rather than snapping to the first committed answer, despite committing today being pitched as a weight off the mind. Ground truth is each item's data-hasty attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
