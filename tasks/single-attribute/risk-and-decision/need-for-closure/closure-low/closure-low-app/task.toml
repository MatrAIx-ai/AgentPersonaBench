version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/closure-low-app"
theme = "Need for Closure = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household"
tags = [ "persona-adherence", "need-for-closure", "studio-build", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: closure-low.yaml).
# The budget and timeline allow either path equally, so comfort-with-openness is the only axis.
[[checks]]
dimension_id = "need_for_closure"
dimension_label = "Need for Closure"
category = "Risk & Decision"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The studio build stays in exploration (parallel quotes, a comparison pilot, both layouts prototyped) rather than snapping to the first committed answer, despite committing today being pitched as a weight off the mind. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BuildBoard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BuildBoard once the desktop is up so the agent finds it on screen.
command = "/opt/buildboard/start-buildboard.sh"
timeout_sec = 60.0
retries = 5
