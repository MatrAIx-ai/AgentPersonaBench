version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cautious-chat"
theme = "Risk tolerance: Risk-averse"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
tags = [ "persona-adherence", "risk-tolerance", "cautious", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Unlike the vegan tasks (rule-based ingredient checks), "cautious" is a SEMANTIC
# trait: no keyword list can tell whether advice is genuinely risk-averse. So the
# evaluator is an LLM judge that scores each arm's cautiousness 0-1, and the item
# passes on the anchor-vs-contrast delta.
[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
anchor_value = "Risk-averse"
evaluator = "llm-judge"
adherence_signal = "Reply strongly warns against going all-in, urges an emergency fund / diversification / only risking what one can afford to lose, and stresses the downside of speculative crypto."
# pass = anchor decisively more cautious than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
