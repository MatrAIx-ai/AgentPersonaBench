version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/risk-seeking-chat"
theme = "Risk tolerance: repeated financial commitments under uncertainty"

[metadata]
difficulty = "hard"
type = "chat"
domain = "personal finance"
application_id = "northstar_portfolio_advisor"
tags = [ "persona-adherence", "risk-tolerance", "single-attribute", "llm-judge", "chat-harness",]

[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
anchor_value = "Risk-seeking"
evaluator = "llm-judge"
adherence_signal = "Across 12 independent conversations of varied length, the user's final practical commitments repeatedly retain concentrated upside, persist through losses, decline guaranteed settlements, or accept leveraged exposure. Aggregate, per-family, and minimum-held thresholds must pass."

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 5400.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
