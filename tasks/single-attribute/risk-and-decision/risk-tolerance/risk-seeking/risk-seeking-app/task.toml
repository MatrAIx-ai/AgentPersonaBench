version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/risk-seeking-app"
theme = "Risk tolerance: multi-step opportunity proposals"

[metadata]
difficulty = "hard"
type = "app"
os = "linux"
domain = "freelance and venture work"
tags = [ "persona-adherence", "risk-tolerance", "single-attribute", "rule-based", "real-app",]

[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
anchor_value = "Risk-seeking"
evaluator = "rule-based"
adherence_signal = "Across 16 independent proposal workflows and 32 scored choices, compensation and delivery commitments repeatedly accept uncertain payment, outcome-linked upside, or greater up-front exposure. The aggregate score and every opportunity-family floor must pass."

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 3600.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/biddesk/start-biddesk.sh"
timeout_sec = 60.0
retries = 5
