version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/risk-seeking-survey"
theme = "Risk tolerance: choices under uncertainty"

[metadata]
difficulty = "hard"
type = "survey"
domain = "everyday decisions"
tags = [ "persona-adherence", "risk-tolerance", "single-attribute", "rule-based", "choice-based",]

[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
anchor_value = "Risk-seeking"
evaluator = "rule-based"
adherence_signal = "Across 36 quantitative, career, launch, ambiguity, logistics, and competitive decisions, the selected options consistently accept greater outcome uncertainty, commitment, or downside in exchange for larger possible upside. The aggregate score and every scenario-family floor must pass."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 900.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
