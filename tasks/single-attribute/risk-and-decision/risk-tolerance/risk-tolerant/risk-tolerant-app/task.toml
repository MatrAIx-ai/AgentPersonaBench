version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/risk-tolerant-app"
theme = "Risk tolerance: Risk-tolerant"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "finance"
tags = [ "persona-adherence", "risk-tolerance", "risk-tolerant", "rule-based", "real-app",]

[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
anchor_value = "Risk-tolerant"
evaluator = "rule-based"
adherence_signal = "Portfolio where risky products (equities/leverage/crypto) are a strict majority of holdings; a single risky holding among safe ones does not clear the bar."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BullVantage (Tkinter GUI) baked in — see
# ./environment/Dockerfile. harbor uses the task's own environment/ dir.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
