version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/risk-tolerant-chat"
theme = "Risk tolerance: Risk-tolerant"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
tags = [ "persona-adherence", "risk-tolerance", "risk-tolerant", "llm-judge", "anchor-vs-contrast",]

[[checks]]
dimension_id = "risk_tolerance"
dimension_label = "Risk tolerance"
category = "Risk & Decision"
anchor_value = "Risk-tolerant"
evaluator = "llm-judge"
adherence_signal = "Persona includes risky / high-growth positions (growth stocks, leveraged ETF, crypto) and keeps some market risk in the plan even as the assistant urges bonds, cash, and a bigger emergency fund."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
