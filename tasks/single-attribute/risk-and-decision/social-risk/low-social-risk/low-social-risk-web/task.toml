version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-social-risk-web"
theme = "DOSPERT Social Risk Tolerance = Very low"

[metadata]
difficulty = "medium"
type = "web"
domain = "work"
tags = [ "persona-adherence", "social-risk", "retreat-sessions", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: low-social-risk.yaml).
# Every session earns the same retreat credit and takes the same hour, so social exposure is the only axis.
[[checks]]
dimension_id = "dospert_social_risk_tolerance"
dimension_label = "DOSPERT Social Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very low"
evaluator = "rule-based"
adherence_signal = "The retreat sessions chosen are the low-exposure seats (workshop table, gallery walk, panel audience) rather than the on-stage slots, despite the stage slots being pitched as career-makers. Ground truth is each item's data-spotlight attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
