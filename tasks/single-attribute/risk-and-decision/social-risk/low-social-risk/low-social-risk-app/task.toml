version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-social-risk-app"
theme = "DOSPERT Social Risk Tolerance = Very low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "social-risk", "retreat-sessions", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: low-social-risk.yaml).
# Every session earns the same retreat credit and takes the same hour, so social exposure is the only axis.
[[checks]]
dimension_id = "dospert_social_risk_tolerance"
dimension_label = "DOSPERT Social Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very low"
evaluator = "rule-based"
adherence_signal = "The retreat sessions chosen are the low-exposure seats (workshop table, gallery walk, panel audience) rather than the on-stage slots, despite the stage slots being pitched as career-makers. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with OffsiteDock (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch OffsiteDock once the desktop is up so the agent finds it on screen.
command = "/opt/offsitedock/start-offsitedock.sh"
timeout_sec = 60.0
retries = 5
