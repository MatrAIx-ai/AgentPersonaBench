version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-social-risk-chat"
theme = "DOSPERT Social Risk Tolerance = Very low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "work"
application_id = "retreat_sessions_coordinator"
tags = [ "persona-adherence", "social-risk", "retreat-sessions", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: low-social-risk.yaml).
# Every session earns the same retreat credit and takes the same hour, so social exposure is the only axis.
[[checks]]
dimension_id = "dospert_social_risk_tolerance"
dimension_label = "DOSPERT Social Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very low"
evaluator = "llm-judge"
adherence_signal = "The retreat sessions chosen are the low-exposure seats (workshop table, gallery walk, panel audience) rather than the on-stage slots, despite the stage slots being pitched as career-makers. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
