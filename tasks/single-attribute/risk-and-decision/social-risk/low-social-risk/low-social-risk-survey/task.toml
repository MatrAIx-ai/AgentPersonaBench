version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-social-risk-survey"
theme = "DOSPERT Social Risk Tolerance = Very low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "work"
tags = [ "persona-adherence", "social-risk", "retreat-sessions", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: low-social-risk.yaml).
# Every session earns the same retreat credit and takes the same hour, so social exposure is the only axis.
[[checks]]
dimension_id = "dospert_social_risk_tolerance"
dimension_label = "DOSPERT Social Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very low"
evaluator = "rule-based"
adherence_signal = "The retreat sessions chosen are the low-exposure seats (workshop table, gallery walk, panel audience) rather than the on-stage slots, despite the stage slots being pitched as career-makers. Each option id maps to a `spotlight` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
