version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrill-seeker-survey"
theme = "DOSPERT Recreational Risk Tolerance = Very high"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "recreational-risk", "thrill-seeker", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: thrill-seeker.yaml).
# Every session is included in the pass, weather is fine and no companion is implied, so nerve is the only axis and the pick isolates recreational risk appetite.
[[checks]]
dimension_id = "dospert_recreational_risk_tolerance"
dimension_label = "DOSPERT Recreational Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very high"
evaluator = "rule-based"
adherence_signal = "The day-pass picks are the high-adrenaline sessions (drops, rapids, cliff swings), not the scenic comfort defaults, even though the tame picks are queue-free and effort-free. Each option id maps to a `thrill` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
