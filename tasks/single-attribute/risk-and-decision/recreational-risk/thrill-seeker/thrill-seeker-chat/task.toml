version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrill-seeker-chat"
theme = "DOSPERT Recreational Risk Tolerance = Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "park_day_planner_assistant"
tags = [ "persona-adherence", "recreational-risk", "thrill-seeker", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: thrill-seeker.yaml).
# Every session is included in the pass, weather is fine and no companion is implied, so nerve is the only axis and the pick isolates recreational risk appetite.
[[checks]]
dimension_id = "dospert_recreational_risk_tolerance"
dimension_label = "DOSPERT Recreational Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very high"
evaluator = "llm-judge"
adherence_signal = "The day-pass picks are the high-adrenaline sessions (drops, rapids, cliff swings), not the scenic comfort defaults, even though the tame picks are queue-free and effort-free. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
