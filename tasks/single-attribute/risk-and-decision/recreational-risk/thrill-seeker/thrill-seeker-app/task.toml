version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrill-seeker-app"
theme = "DOSPERT Recreational Risk Tolerance = Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "recreational-risk", "thrill-seeker", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: thrill-seeker.yaml).
# Every session is included in the pass, weather is fine and no companion is implied, so nerve is the only axis and the pick isolates recreational risk appetite.
[[checks]]
dimension_id = "dospert_recreational_risk_tolerance"
dimension_label = "DOSPERT Recreational Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very high"
evaluator = "rule-based"
adherence_signal = "The day-pass picks are the high-adrenaline sessions (drops, rapids, cliff swings), not the scenic comfort defaults, even though the tame picks are queue-free and effort-free. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RidgeBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RidgeBook once the desktop is up so the agent finds it on screen.
command = "/opt/ridgebook/start-ridgebook.sh"
timeout_sec = 60.0
retries = 5
