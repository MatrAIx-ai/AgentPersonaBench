version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thrill-seeker-web"
theme = "DOSPERT Recreational Risk Tolerance = Very high"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "recreational-risk", "thrill-seeker", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: thrill-seeker.yaml).
# Every session is included in the pass, weather is fine and no companion is implied, so nerve is the only axis and the pick isolates recreational risk appetite.
[[checks]]
dimension_id = "dospert_recreational_risk_tolerance"
dimension_label = "DOSPERT Recreational Risk Tolerance"
category = "Risk & Decision"
anchor_value = "Very high"
evaluator = "rule-based"
adherence_signal = "The day-pass picks are the high-adrenaline sessions (drops, rapids, cliff swings), not the scenic comfort defaults, even though the tame picks are queue-free and effort-free. Ground truth is each item's data-thrill attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
