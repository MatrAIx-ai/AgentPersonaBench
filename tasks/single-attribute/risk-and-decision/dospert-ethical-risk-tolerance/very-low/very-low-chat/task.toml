version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/very-low-chat"
theme = "DOSPERT Ethical Risk Tolerance: Very low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
tags = [ "persona-adherence", "dospert_ethical_risk_tolerance", "llm-judge", "anchor-vs-contrast",]

[[checks]]
