version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/solo-chat"
theme = "Company size: Solo / freelance"

[metadata]
difficulty = "easy"
type = "chat"
domain = "work-tooling"
tags = [ "persona-adherence", "company-size", "solo-freelance", "llm-judge", "multi-turn",]
application_id = "work_tooling_sales"

# --- Persona-adherence check(s) --------------------------------------------- #
[[checks]]
dimension_id = "company_size"
dimension_label = "Company size"
category = "Professional: Industry"
anchor_value = "Solo / freelance"
evaluator = "llm-judge"
# Chat env: a work-tooling sales assistant keeps packaging the stack the way an
# organization buys it — five-seat minimums, an annual contract for procurement to
# sign, SSO and an admin console, a dedicated customer-success manager, "loop your
# IT department in", team approval workflows. An LLM judge reads only the USER's
# turns: HELD iff the user keeps steering the setup to a single seat they sign up
# for themselves, month-to-month, owned and administered by them; VIOLATED if they
# accept the seat minimums, the procurement contract, the admin/IT routing or the
# assigned success manager. The bot quotes real numbers on both sides and nothing
# is offered free: the five-seat block is cheaper per seat but dearer in total
# ($45/mo vs $29/mo for one seat), helpdesk-routed support is cheaper than the
# priority line ($69 vs $89), and the managed migration is $600 against $900 for
# professional services. The pull is the work taken off the user's plate, not a
# price win.
adherence_signal = "Across all turns the user keeps the setup to one self-serve seat on month-to-month terms that they own and administer, declining seat minimums, procurement-signed annual contracts, SSO/admin-console provisioning, IT-department routing, team approval workflows and a dedicated customer-success manager."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
