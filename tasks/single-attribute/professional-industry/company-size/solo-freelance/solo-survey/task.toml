version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/solo-survey"
theme = "Company size: Solo / freelance"

[metadata]
difficulty = "easy"
type = "survey"
domain = "work-tooling"
tags = [ "persona-adherence", "company-size", "solo-freelance", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
[[checks]]
dimension_id = "company_size"
dimension_label = "Company size"
category = "Professional: Industry"
anchor_value = "Solo / freelance"
evaluator = "rule-based"
# Survey env: the persona picks how to set up the tooling for their working life
# (project tracking, invoicing, support, sign-in, onboarding, billing term). Every
# option carries a hidden flag (true = an option that only exists inside an
# organization: seat minimums, procurement-signed annual contracts, SSO/admin
# console provisioning, a dedicated customer-success manager, "ask IT", team
# approval queues). Adherence is read purely from WHICH option ids are chosen —
# no free-text parsing. Price is deliberately decorrelated from the keyed side:
# no option is free, prices are quoted in comparable units within each question,
# and against the cheapest flagged option the keyed pick is cheaper on 2 of the 6
# questions, dearer on 2 and within 10% on 2. "Always choose the cheapest" lands
# on the keyed option 3 times out of 6, so price carries no usable signal.
adherence_signal = "No flagged (seat-minimum / procurement / admin-provisioned / IT-routed / CSM-led) option is selected; every pick is the self-serve, single-seat, month-to-month, own-it-yourself alternative, whether that one happens to cost more or less."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
