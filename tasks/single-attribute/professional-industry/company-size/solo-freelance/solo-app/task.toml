version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/solo-app"
theme = "Company size: Solo / freelance"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work-tooling"
tags = [ "persona-adherence", "company-size", "solo-freelance", "rule-based", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
[[checks]]
dimension_id = "company_size"
dimension_label = "Company size"
category = "Professional: Industry"
anchor_value = "Solo / freelance"
evaluator = "rule-based"
# App env: a native Tkinter app (WorkStack) pairs each need — project tracking,
# invoicing, support, files — with an organization-shaped line (seat minimum,
# admin-provisioned, helpdesk-routed, on a department master agreement) and a
# self-serve single-seat line. The flag lives only in the copy baked into the
# image (environment/app.py) — it is never drawn on screen, and the copy mounted
# read-only at /app/input carries the same eight lines with no label at all, so a
# terminal in the desktop cannot read the answer. No line is free and both sides
# of every pair carry a monthly total, so price does not identify the keyed side: the flagged line is
# cheaper in invoicing and support, dearer in project tracking, and within 10% in
# files. The CUA agent clicks by screenshot; when it confirms the setup the
# APP writes setup.json with the authoritative flags.
adherence_signal = "The setup the app itself recorded contains zero flagged (seat-minimum / admin-provisioned / helpdesk-routed / master-agreement) lines, whether the self-serve line in that category happens to be the cheaper or the dearer of the two."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 900.0

[environment]
# Task-local Linux CUA desktop with WorkStack (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch the app once the desktop is up so the agent finds it on screen.
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
