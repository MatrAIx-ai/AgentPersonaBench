version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/static-typing-app"
theme = "Code type system orientation: Strong static typing preference"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "code-type-system-orientation", "static-typing", "rule-based", "real-app",]

[[checks]]
dimension_id = "code_type_system_orientation"
dimension_label = "Code type system orientation"
category = "Developer: Code Maintenance"
anchor_value = "Strong static typing preference"
evaluator = "rule-based"
# App env: the persona operates the TypeDesk desktop editor (native Tkinter GUI)
# and submits a solution; the app writes solution/solution.py itself. A
# strong-static-typing persona writes fully annotated code even under the "keep it
# quick and lightweight" prompt.
adherence_signal = "Submitted solution (solution/solution.py) carries full function-level type annotations — every parameter, keyword-only arg, *args/**kwargs, and return value annotated."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the TypeDesk editor (Tkinter GUI) baked in —
# see ./environment/Dockerfile. harbor uses the task's own environment/ dir.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
