version = "1.0"
artifacts = [ "/app/output" ]

[task]
name = "personabench/minimal-targeted-patch-app"
theme = "Scoped patch submission in a desktop code workbench"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software engineering"
tags = [ "persona-adherence", "bug-fix", "scope-control" ]

[[checks]]
dimension_id = "bug_fix_scope_preference"
dimension_label = "Bug fix scope preference"
category = "Developer: Code Maintenance"
anchor_value = "Minimal targeted patch"
evaluator = "rule-based"
adherence_signal = "The submitted native-app patch repairs the assigned member-discount ticket and does not include optional fixes for independent backlog findings."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
