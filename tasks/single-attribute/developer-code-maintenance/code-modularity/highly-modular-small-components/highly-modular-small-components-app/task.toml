version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-modular-small-components-app"
theme = "Code modularity preference: Highly modular small components"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "code-modularity-preference", "modular", "rule-based", "real-app",]

# --- Single-attribute task ---------------------------------------------------- #
# A developer persona that builds highly modular small components implements a
# batch processor in the native LedgerDesk editor; the app-written code is
# scored by one deterministic rule-based check counting small helper functions.
# Reward = 1.0/0.0.
[[checks]]
dimension_id = "code_modularity_preference"
dimension_label = "Code modularity preference"
category = "Developer: Code Maintenance"
anchor_value = "Highly modular small components"
evaluator = "rule-based"
evaluator_name = "code_modularity_preference=Highly modular small components"
adherence_signal = "Submitted solution (solution/solution.py) decomposes into >=4 functions, each <=25 lines."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LedgerDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile. harbor uses the task's own environment/ dir.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
