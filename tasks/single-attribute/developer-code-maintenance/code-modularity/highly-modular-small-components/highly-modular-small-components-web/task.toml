version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-modular-small-components-web"
theme = "Code modularity preference: Highly modular small components"

[metadata]
difficulty = "medium"
type = "web"
domain = "software"
tags = [ "persona-adherence", "code-modularity-preference", "modular", "rule-based", "playwright", "real-web",]

# --- Single-attribute task ---------------------------------------------------- #
# A developer persona that builds highly modular small components implements a
# batch processor in a live browser editor; the DOM-submitted code is scored by
# one deterministic rule-based check counting small helper functions.
# Reward = 1.0/0.0.
[[checks]]
dimension_id = "code_modularity_preference"
dimension_label = "Code modularity preference"
category = "Developer: Code Maintenance"
anchor_value = "Highly modular small components"
evaluator = "rule-based"
evaluator_name = "code_modularity_preference=Highly modular small components"
adherence_signal = "Submitted solution (solution/solution.py) decomposes into >=4 functions, each <=25 lines."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
