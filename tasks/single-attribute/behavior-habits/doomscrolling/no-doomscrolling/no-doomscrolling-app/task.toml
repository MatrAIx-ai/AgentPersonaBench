version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-doomscrolling-app"
theme = "Habit: Doomscrolling = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "tech"
tags = [ "persona-adherence", "doomscrolling", "evening-modes", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-doomscrolling.yaml).
# All modes are free and keep the device in hand, so bounded-vs-endless is the only axis — the pick isolates feed habits from general screen use.
[[checks]]
dimension_id = "habit_doomscrolling"
dimension_label = "Habit: Doomscrolling"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The tablet's evening slots are bounded sessions (a chapter, a timed podcast, a puzzle) rather than bottomless feed modes, despite the feeds being the zero-decision default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DuskDial (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DuskDial once the desktop is up so the agent finds it on screen.
command = "/opt/duskdial/start-duskdial.sh"
timeout_sec = 60.0
retries = 5
