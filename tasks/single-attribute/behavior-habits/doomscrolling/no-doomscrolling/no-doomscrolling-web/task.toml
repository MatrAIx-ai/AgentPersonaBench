version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-doomscrolling-web"
theme = "Habit: Doomscrolling = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "tech"
tags = [ "persona-adherence", "doomscrolling", "evening-modes", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-doomscrolling.yaml).
# All modes are free and keep the device in hand, so bounded-vs-endless is the only axis — the pick isolates feed habits from general screen use.
[[checks]]
dimension_id = "habit_doomscrolling"
dimension_label = "Habit: Doomscrolling"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The tablet's evening slots are bounded sessions (a chapter, a timed podcast, a puzzle) rather than bottomless feed modes, despite the feeds being the zero-decision default. Ground truth is each item's data-doomscroll attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
