version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-skip-breakfast-survey"
theme = "Habit: Skipping breakfast = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "skipping-breakfast", "hotel-morning", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-skip-breakfast.yaml).
# Everything on the card is included in the room rate and the schedule allows any path, so whether breakfast happens is the only axis.
[[checks]]
dimension_id = "habit_skipping_breakfast"
dimension_label = "Habit: Skipping breakfast"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The hotel morning card anchors a real breakfast rather than trading it for extra sleep or a coffee-only dash, despite the trade-aways being pitched as the smarter morning. Each option id maps to a `skip` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
