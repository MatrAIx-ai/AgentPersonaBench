version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-skip-breakfast-app"
theme = "Habit: Skipping breakfast = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "skipping-breakfast", "hotel-morning", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-skip-breakfast.yaml).
# Everything on the card is included in the room rate and the schedule allows any path, so whether breakfast happens is the only axis.
[[checks]]
dimension_id = "habit_skipping_breakfast"
dimension_label = "Habit: Skipping breakfast"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The hotel morning card anchors a real breakfast rather than trading it for extra sleep or a coffee-only dash, despite the trade-aways being pitched as the smarter morning. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MorningCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MorningCard once the desktop is up so the agent finds it on screen.
command = "/opt/morningcard/start-morningcard.sh"
timeout_sec = 60.0
retries = 5
