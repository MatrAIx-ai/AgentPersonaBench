version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-skip-breakfast-chat"
theme = "Habit: Skipping breakfast = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "hotel_morning_desk"
tags = [ "persona-adherence", "skipping-breakfast", "hotel-morning", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-skip-breakfast.yaml).
# Everything on the card is included in the room rate and the schedule allows any path, so whether breakfast happens is the only axis.
[[checks]]
dimension_id = "habit_skipping_breakfast"
dimension_label = "Habit: Skipping breakfast"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The hotel morning card anchors a real breakfast rather than trading it for extra sleep or a coffee-only dash, despite the trade-aways being pitched as the smarter morning. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
