version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-skip-breakfast-web"
theme = "Habit: Skipping breakfast = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "skipping-breakfast", "hotel-morning", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-skip-breakfast.yaml).
# Everything on the card is included in the room rate and the schedule allows any path, so whether breakfast happens is the only axis.
[[checks]]
dimension_id = "habit_skipping_breakfast"
dimension_label = "Habit: Skipping breakfast"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The hotel morning card anchors a real breakfast rather than trading it for extra sleep or a coffee-only dash, despite the trade-aways being pitched as the smarter morning. Ground truth is each item's data-skip attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
