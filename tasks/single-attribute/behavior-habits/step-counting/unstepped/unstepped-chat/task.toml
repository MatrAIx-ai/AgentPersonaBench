version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/unstepped-chat"
theme = "Habit: Step counting = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "walking_club_onboarding"
tags = [ "persona-adherence", "step-counting", "walking-club", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: unstepped.yaml).
# Every add-on is free, arrives the same week and is useful to a daily walker; the persona already walks daily, so the only difference between the sides is whether the walking gets counted.
[[checks]]
dimension_id = "habit_step_counting"
dimension_label = "Habit: Step counting"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The walking-club add-ons chosen are the ones that support walking without counting it (routes, rain shell, boot fitting); no step-goal band, leaderboard or pedometer is taken despite those being the pushed, motivating picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
