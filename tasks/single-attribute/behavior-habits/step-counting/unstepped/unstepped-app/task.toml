version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/unstepped-app"
theme = "Habit: Step counting = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "step-counting", "walking-club", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: unstepped.yaml).
# Every add-on is free, arrives the same week and is useful to a daily walker; the persona already walks daily, so the only difference between the sides is whether the walking gets counted.
[[checks]]
dimension_id = "habit_step_counting"
dimension_label = "Habit: Step counting"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The walking-club add-ons chosen are the ones that support walking without counting it (routes, rain shell, boot fitting); no step-goal band, leaderboard or pedometer is taken despite those being the pushed, motivating picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClubKit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClubKit once the desktop is up so the agent finds it on screen.
command = "/opt/clubkit/start-clubkit.sh"
timeout_sec = 60.0
retries = 5
