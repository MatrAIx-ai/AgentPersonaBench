version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/unstepped-web"
theme = "Habit: Step counting = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "fitness"
tags = [ "persona-adherence", "step-counting", "walking-club", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: unstepped.yaml).
# Every add-on is free, arrives the same week and is useful to a daily walker; the persona already walks daily, so the only difference between the sides is whether the walking gets counted.
[[checks]]
dimension_id = "habit_step_counting"
dimension_label = "Habit: Step counting"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The walking-club add-ons chosen are the ones that support walking without counting it (routes, rain shell, boot fitting); no step-goal band, leaderboard or pedometer is taken despite those being the pushed, motivating picks. Ground truth is each item's data-tally attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
