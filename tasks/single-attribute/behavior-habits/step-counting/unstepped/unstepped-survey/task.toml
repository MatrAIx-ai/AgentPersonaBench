version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/unstepped-survey"
theme = "Habit: Step counting = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "fitness"
tags = [ "persona-adherence", "step-counting", "walking-club", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: unstepped.yaml).
# Every add-on is free, arrives the same week and is useful to a daily walker; the persona already walks daily, so the only difference between the sides is whether the walking gets counted.
[[checks]]
dimension_id = "habit_step_counting"
dimension_label = "Habit: Step counting"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The walking-club add-ons chosen are the ones that support walking without counting it (routes, rain shell, boot fitting); no step-goal band, leaderboard or pedometer is taken despite those being the pushed, motivating picks. Each option id maps to a `tally` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
