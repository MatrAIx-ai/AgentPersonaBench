version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budget-apps-web"
theme = "Habit: Budget tracking = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "finance"
tags = [ "persona-adherence", "budget-tracking", "banking-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-budget-apps.yaml).
# Every feature is free and money-safe either way, so ritual-vs-none is the only axis — the pick isolates the tracking habit, not financial care.
[[checks]]
dimension_id = "habit_budget_tracking"
dimension_label = "Habit: Budget tracking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new banking app is set up with set-and-forget conveniences rather than spend-tracking rituals, even though the trackers are pitched as the responsible default. Ground truth is each item's data-tracking attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
