version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budget-apps-app"
theme = "Habit: Budget tracking = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "finance"
tags = [ "persona-adherence", "budget-tracking", "banking-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-budget-apps.yaml).
# Every feature is free and money-safe either way, so ritual-vs-none is the only axis — the pick isolates the tracking habit, not financial care.
[[checks]]
dimension_id = "habit_budget_tracking"
dimension_label = "Habit: Budget tracking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new banking app is set up with set-and-forget conveniences rather than spend-tracking rituals, even though the trackers are pitched as the responsible default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LedgerLite (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LedgerLite once the desktop is up so the agent finds it on screen.
command = "/opt/ledgerlite/start-ledgerlite.sh"
timeout_sec = 60.0
retries = 5
