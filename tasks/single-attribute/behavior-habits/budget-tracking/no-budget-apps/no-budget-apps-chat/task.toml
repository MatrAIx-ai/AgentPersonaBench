version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budget-apps-chat"
theme = "Habit: Budget tracking = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
application_id = "banking_onboarding_assistant"
tags = [ "persona-adherence", "budget-tracking", "banking-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-budget-apps.yaml).
# Every feature is free and money-safe either way, so ritual-vs-none is the only axis — the pick isolates the tracking habit, not financial care.
[[checks]]
dimension_id = "habit_budget_tracking"
dimension_label = "Habit: Budget tracking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The new banking app is set up with set-and-forget conveniences rather than spend-tracking rituals, even though the trackers are pitched as the responsible default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
