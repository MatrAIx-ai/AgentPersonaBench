version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-budget-apps-survey"
theme = "Habit: Budget tracking = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "finance"
tags = [ "persona-adherence", "budget-tracking", "banking-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-budget-apps.yaml).
# Every feature is free and money-safe either way, so ritual-vs-none is the only axis — the pick isolates the tracking habit, not financial care.
[[checks]]
dimension_id = "habit_budget_tracking"
dimension_label = "Habit: Budget tracking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new banking app is set up with set-and-forget conveniences rather than spend-tracking rituals, even though the trackers are pitched as the responsible default. Each option id maps to a `tracking` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
