version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lean-packer-survey"
theme = "Habit: Pre-trip overpacking = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "packing", "trip-prep", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: lean-packer.yaml).
# Every line is free to add, roughly the same weight and fits the same bag, and both sides are practical for the same one-week trip — the pick isolates whether the persona pads a bag against what-ifs.
[[checks]]
dimension_id = "habit_pre_trip_overpacking"
dimension_label = "Habit: Pre-trip overpacking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The packing list is finalised with right-sized kit and none of the just-in-case extras, even though the extras are the reassuring, zero-cost additions the service keeps recommending. Each option id maps to a `extra` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
