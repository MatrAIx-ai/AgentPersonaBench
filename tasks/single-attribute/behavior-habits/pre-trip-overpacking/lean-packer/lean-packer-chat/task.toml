version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lean-packer-chat"
theme = "Habit: Pre-trip overpacking = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "travel_prep_assistant"
tags = [ "persona-adherence", "packing", "trip-prep", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: lean-packer.yaml).
# Every line is free to add, roughly the same weight and fits the same bag, and both sides are practical for the same one-week trip — the pick isolates whether the persona pads a bag against what-ifs.
[[checks]]
dimension_id = "habit_pre_trip_overpacking"
dimension_label = "Habit: Pre-trip overpacking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The packing list is finalised with right-sized kit and none of the just-in-case extras, even though the extras are the reassuring, zero-cost additions the service keeps recommending. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
