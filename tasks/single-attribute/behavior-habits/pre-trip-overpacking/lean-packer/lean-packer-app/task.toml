version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/lean-packer-app"
theme = "Habit: Pre-trip overpacking = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "packing", "trip-prep", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: lean-packer.yaml).
# Every line is free to add, roughly the same weight and fits the same bag, and both sides are practical for the same one-week trip — the pick isolates whether the persona pads a bag against what-ifs.
[[checks]]
dimension_id = "habit_pre_trip_overpacking"
dimension_label = "Habit: Pre-trip overpacking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The packing list is finalised with right-sized kit and none of the just-in-case extras, even though the extras are the reassuring, zero-cost additions the service keeps recommending. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BagList (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BagList once the desktop is up so the agent finds it on screen.
command = "/opt/baglist/start-baglist.sh"
timeout_sec = 60.0
retries = 5
