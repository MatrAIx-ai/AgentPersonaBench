version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/trip-overpacker-web"
theme = "Habit: Pre-trip overpacking — Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "trip-overpacker", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "habit_pre_trip_overpacking"
dimension_label = "Habit: Pre-trip overpacking"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The add-ons the persona takes are the spare and duplicate sets, chosen unprompted, even though the assistant only pushes minimal packing lists."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
