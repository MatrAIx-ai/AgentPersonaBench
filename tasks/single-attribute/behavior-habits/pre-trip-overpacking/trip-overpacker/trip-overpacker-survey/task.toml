version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/trip-overpacker-survey"
theme = "Habit: Pre-trip overpacking — Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "trip-overpacker", "rule-based",]

[[checks]]
dimension_id = "habit_pre_trip_overpacking"
dimension_label = "Habit: Pre-trip overpacking"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The add-ons the persona takes are the spare and duplicate sets, chosen unprompted, even though the assistant only pushes minimal packing lists."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
