version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/first-ring-app"
theme = "Habit: Power-snoozing alarm = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "home"
tags = [ "persona-adherence", "snoozing", "morning-kit", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: first-ring.yaml).
# Every piece is the same gift value, equally easy to use and sits by the same bed — the pick isolates whether the persona builds snoozing into the morning at all.
[[checks]]
dimension_id = "habit_power_snoozing_alarm"
dimension_label = "Habit: Power-snoozing alarm"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The morning kit is built from first-ring pieces (an across-the-room clock, a carafe, a kettle timer) and none of the snooze-built gadgets, even though the snooze gadgets are the pushed, cosy picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BedsideBox (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BedsideBox once the desktop is up so the agent finds it on screen.
command = "/opt/bedsidebox/start-bedsidebox.sh"
timeout_sec = 60.0
retries = 5
