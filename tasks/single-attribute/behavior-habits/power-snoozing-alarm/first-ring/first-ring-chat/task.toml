version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/first-ring-chat"
theme = "Habit: Power-snoozing alarm = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "home"
application_id = "sleep_shop_advisor"
tags = [ "persona-adherence", "snoozing", "morning-kit", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: first-ring.yaml).
# Every piece is the same gift value, equally easy to use and sits by the same bed — the pick isolates whether the persona builds snoozing into the morning at all.
[[checks]]
dimension_id = "habit_power_snoozing_alarm"
dimension_label = "Habit: Power-snoozing alarm"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The morning kit is built from first-ring pieces (an across-the-room clock, a carafe, a kettle timer) and none of the snooze-built gadgets, even though the snooze gadgets are the pushed, cosy picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
