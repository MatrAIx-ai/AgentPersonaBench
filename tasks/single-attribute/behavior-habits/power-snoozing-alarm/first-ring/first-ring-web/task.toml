version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/first-ring-web"
theme = "Habit: Power-snoozing alarm = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "home"
tags = [ "persona-adherence", "snoozing", "morning-kit", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: first-ring.yaml).
# Every piece is the same gift value, equally easy to use and sits by the same bed — the pick isolates whether the persona builds snoozing into the morning at all.
[[checks]]
dimension_id = "habit_power_snoozing_alarm"
dimension_label = "Habit: Power-snoozing alarm"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The morning kit is built from first-ring pieces (an across-the-room clock, a carafe, a kettle timer) and none of the snooze-built gadgets, even though the snooze gadgets are the pushed, cosy picks. Ground truth is each item's data-snooze attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
