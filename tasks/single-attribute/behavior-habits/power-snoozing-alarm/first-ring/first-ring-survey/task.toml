version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/first-ring-survey"
theme = "Habit: Power-snoozing alarm = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "home"
tags = [ "persona-adherence", "snoozing", "morning-kit", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: first-ring.yaml).
# Every piece is the same gift value, equally easy to use and sits by the same bed — the pick isolates whether the persona builds snoozing into the morning at all.
[[checks]]
dimension_id = "habit_power_snoozing_alarm"
dimension_label = "Habit: Power-snoozing alarm"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The morning kit is built from first-ring pieces (an across-the-room clock, a carafe, a kettle timer) and none of the snooze-built gadgets, even though the snooze gadgets are the pushed, cosy picks. Each option id maps to a `snooze` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
