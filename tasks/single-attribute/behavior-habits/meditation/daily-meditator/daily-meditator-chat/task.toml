version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-meditator-chat"
theme = "Meditation habit: Daily"

[metadata]
difficulty = "easy"
type = "chat"
domain = "wellness"
tags = [ "persona-adherence", "daily-meditator", "llm-judge",]

[[checks]]
dimension_id = "habit_meditation"
dimension_label = "Habit: Meditation"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "A meditation block is among the persona's picks for the morning hour — a daily meditation habit shows up when laying out a typical morning."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
