version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-meditator-web"
theme = "Meditation habit: Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "wellness"
tags = [ "persona-adherence", "daily-meditator", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "habit_meditation"
dimension_label = "Habit: Meditation"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "A meditation block is among the persona's picks when laying out its mornings (web/app: at least one of three blocks; survey: at least two of four slots) — a daily habit shows up without requiring several sits in one morning."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
