version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/phone-free-evenings-chat"
theme = "Phone-free downtime: Daily"

[metadata]
difficulty = "easy"
type = "chat"
domain = "lifestyle"
tags = [ "persona-adherence", "phone-free-evenings", "llm-judge",]

[[checks]]
dimension_id = "habit_phone_free_downtime"
dimension_label = "Habit: Phone-free downtime"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "At least two of the three wind-down blocks the persona picks are phone-free activities; the daily device-free downtime habit shows up in the plan."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
