version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/phone-free-evenings-app"
theme = "Phone-free downtime: Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "phone-free-evenings", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "habit_phone_free_downtime"
dimension_label = "Habit: Phone-free downtime"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "At least two of the three wind-down blocks the persona picks are phone-free activities; the daily device-free downtime habit shows up in the plan."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the WindDown Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WindDown once the desktop is up so the agent finds it on screen.
command = "/opt/phonefreeevenings/start-app.sh"
timeout_sec = 60.0
retries = 5
