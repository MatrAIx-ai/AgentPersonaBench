version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/digital-minimalist-web"
theme = "Phone-free downtime: protects it daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "behavior-habits", "phone-free-downtime", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "habit_phone_free_downtime"
dimension_label = "Phone-free downtime"
category = "Behavior: Habits"
attribute = "Phone-free downtime"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "habit_phone_free_downtime=Daily"
# Web env: the persona adds ways to spend the week's downtime to a plan on a live
# page (Playwright). Each activity's hidden `data-screen` (0..3) in index.html is
# the ground truth. VIOLATED for any always-on / never-unplugs pick (screen >= 2).
adherence_signal = "Plan built from phone-away / offline downtime (data-screen 0-1); no always-on pick (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
