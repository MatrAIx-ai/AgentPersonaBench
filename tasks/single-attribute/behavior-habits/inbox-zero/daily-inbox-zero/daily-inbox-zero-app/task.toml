version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-inbox-zero-app"
theme = "Habit: Inbox-zero discipline: Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "behavior-habits", "inbox-zero", "daily-inbox-zero", "os-app", "computer-use",]

[[checks]]
dimension_id = "habit_inbox_zero_discipline"
dimension_label = "Habit: Inbox-zero discipline"
category = "Behavior: Habits"
attribute = "Habit: Inbox-zero discipline"
value = "Daily"
evaluator = "rule-based"
evaluator_name = "habit_inbox_zero_discipline=Daily"
# OS-APP env: the persona is a computer-use agent operating Inboxly, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Inboxly writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The email setup the agent picks contains no let-it-pile-up approach (a high tier item, tier>=2); a daily inbox-zero person fills it with clear-to-empty, archive-as-you-go approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Inboxly (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Inboxly once the desktop is up so the agent finds it on screen.
command = "/opt/inboxly/start-inboxly.sh"
timeout_sec = 60.0
retries = 5
