version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-napper-chat"
theme = "Habit: Naps — Daily"

[metadata]
difficulty = "easy"
type = "chat"
domain = "wellness"
tags = [ "persona-adherence", "daily-napper", "llm-judge",]

[[checks]]
dimension_id = "habit_naps"
dimension_label = "Habit: Naps"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "The blocks the persona locks in include sleeping in the afternoon, chosen unprompted, even though the assistant only pushes active blocks of the same length."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
