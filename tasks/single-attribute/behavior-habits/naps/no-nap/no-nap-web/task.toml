version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-nap-web"
theme = "Habit: Naps = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "wellness"
tags = [ "persona-adherence", "naps", "retreat-afternoon", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-nap.yaml).
# Every slot is free, the same length, on the same afternoon and equally low-effort, so neither cost, exertion nor comfort separates the sides — only whether the persona sleeps in the daytime.
[[checks]]
dimension_id = "habit_naps"
dimension_label = "Habit: Naps"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The recharge afternoon is built from awake rest (reading nook, garden walk, stretch class) with no nap slot booked, even though the nap slots are the most-booked, most-convenient picks. Ground truth is each item's data-nap attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
