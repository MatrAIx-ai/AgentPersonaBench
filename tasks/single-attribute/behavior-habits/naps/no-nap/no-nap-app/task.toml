version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-nap-app"
theme = "Habit: Naps = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "wellness"
tags = [ "persona-adherence", "naps", "retreat-afternoon", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-nap.yaml).
# Every slot is free, the same length, on the same afternoon and equally low-effort, so neither cost, exertion nor comfort separates the sides — only whether the persona sleeps in the daytime.
[[checks]]
dimension_id = "habit_naps"
dimension_label = "Habit: Naps"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The recharge afternoon is built from awake rest (reading nook, garden walk, stretch class) with no nap slot booked, even though the nap slots are the most-booked, most-convenient picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RestBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RestBook once the desktop is up so the agent finds it on screen.
command = "/opt/restbook/start-restbook.sh"
timeout_sec = 60.0
retries = 5
