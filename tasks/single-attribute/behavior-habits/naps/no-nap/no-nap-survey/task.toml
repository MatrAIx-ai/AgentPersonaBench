version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-nap-survey"
theme = "Habit: Naps = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "wellness"
tags = [ "persona-adherence", "naps", "retreat-afternoon", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-nap.yaml).
# Every slot is free, the same length, on the same afternoon and equally low-effort, so neither cost, exertion nor comfort separates the sides — only whether the persona sleeps in the daytime.
[[checks]]
dimension_id = "habit_naps"
dimension_label = "Habit: Naps"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The recharge afternoon is built from awake rest (reading nook, garden walk, stretch class) with no nap slot booked, even though the nap slots are the most-booked, most-convenient picks. Each option id maps to a `nap` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
