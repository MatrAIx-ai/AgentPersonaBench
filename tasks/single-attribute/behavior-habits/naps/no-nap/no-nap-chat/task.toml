version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-nap-chat"
theme = "Habit: Naps = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "wellness"
application_id = "retreat_rest_concierge"
tags = [ "persona-adherence", "naps", "retreat-afternoon", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-nap.yaml).
# Every slot is free, the same length, on the same afternoon and equally low-effort, so neither cost, exertion nor comfort separates the sides — only whether the persona sleeps in the daytime.
[[checks]]
dimension_id = "habit_naps"
dimension_label = "Habit: Naps"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The recharge afternoon is built from awake rest (reading nook, garden walk, stretch class) with no nap slot booked, even though the nap slots are the most-booked, most-convenient picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
