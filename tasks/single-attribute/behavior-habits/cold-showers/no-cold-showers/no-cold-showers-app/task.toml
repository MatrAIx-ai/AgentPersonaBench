version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cold-showers-app"
theme = "Habit: Cold showers = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "cold-showers", "spa-day", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-cold-showers.yaml).
# Every session is on the same day pass with the same duration, so warm-vs-cold is the only axis.
[[checks]]
dimension_id = "habit_cold_showers"
dimension_label = "Habit: Cold showers"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The recovery-day picks are the warm therapies rather than the cold-exposure sessions, despite the cold circuit being pitched as what everyone's doing now. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WarmWell (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WarmWell once the desktop is up so the agent finds it on screen.
command = "/opt/warmwell/start-warmwell.sh"
timeout_sec = 60.0
retries = 5
