version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-cold-showers-web"
theme = "Habit: Cold showers = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "cold-showers", "spa-day", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-cold-showers.yaml).
# Every session is on the same day pass with the same duration, so warm-vs-cold is the only axis.
[[checks]]
dimension_id = "habit_cold_showers"
dimension_label = "Habit: Cold showers"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The recovery-day picks are the warm therapies rather than the cold-exposure sessions, despite the cold circuit being pitched as what everyone's doing now. Ground truth is each item's data-coldplunge attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
