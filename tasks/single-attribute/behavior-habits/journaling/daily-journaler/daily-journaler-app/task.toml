version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-journaler-app"
theme = "Journaling habit: Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "daily-journaler", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "habit_journaling"
dimension_label = "Habit: Journaling"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three picks are journaling items (notebook, guided journal refill, journaling pens); a daily journaling habit shows up in what gets restocked."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the PaperTrail Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PaperTrail once the desktop is up so the agent finds it on screen.
command = "/opt/dailyjournaler/start-app.sh"
timeout_sec = 60.0
retries = 5
