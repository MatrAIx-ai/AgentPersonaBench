version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-journaler-web"
theme = "Journaling habit: Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "daily-journaler", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "habit_journaling"
dimension_label = "Habit: Journaling"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three picks are journaling items (notebook, guided journal refill, journaling pens); a daily journaling habit shows up in what gets restocked."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
