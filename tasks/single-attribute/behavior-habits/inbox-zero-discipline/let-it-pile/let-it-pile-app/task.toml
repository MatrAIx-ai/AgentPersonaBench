version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/let-it-pile-app"
theme = "Habit: Inbox-zero discipline = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "technology"
tags = [ "persona-adherence", "inbox-zero", "mail-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: let-it-pile.yaml).
# Every preference is free, one tap and equally screen-light, and both sides are sensible for the same account — the pick isolates whether the persona runs an empty-inbox discipline at all.
[[checks]]
dimension_id = "habit_inbox_zero_discipline"
dimension_label = "Habit: Inbox-zero discipline"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new mail account is set up with comfortable, let-it-sit settings and none of the inbox-clearing regimes, even though the clearing options are the pushed 'stay on top of it' picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with InboxSetup (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch InboxSetup once the desktop is up so the agent finds it on screen.
command = "/opt/inboxsetup/start-inboxsetup.sh"
timeout_sec = 60.0
retries = 5
