version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-meal-prep-web"
theme = "Habit: Meal prepping = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "meal-prepping", "weekend-kitchen", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-meal-prep.yaml).
# The same food budget covers either path, so batch-vs-fresh is the only axis — the pick isolates the prepping habit from thrift or organization.
[[checks]]
dimension_id = "habit_meal_prepping"
dimension_label = "Habit: Meal prepping"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The weekend kitchen plan stays cook-fresh-each-day rather than batch-prepping the week, despite batch blocks being pitched as the organized default. Ground truth is each item's data-mealprep attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
