version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-meal-prep-app"
theme = "Habit: Meal prepping = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "meal-prepping", "weekend-kitchen", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-meal-prep.yaml).
# The same food budget covers either path, so batch-vs-fresh is the only axis — the pick isolates the prepping habit from thrift or organization.
[[checks]]
dimension_id = "habit_meal_prepping"
dimension_label = "Habit: Meal prepping"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The weekend kitchen plan stays cook-fresh-each-day rather than batch-prepping the week, despite batch blocks being pitched as the organized default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PanPlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PanPlanner once the desktop is up so the agent finds it on screen.
command = "/opt/panplanner/start-panplanner.sh"
timeout_sec = 60.0
retries = 5
