version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-meal-prep-chat"
theme = "Habit: Meal prepping = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "kitchen_weekend_assistant"
tags = [ "persona-adherence", "meal-prepping", "weekend-kitchen", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-meal-prep.yaml).
# The same food budget covers either path, so batch-vs-fresh is the only axis — the pick isolates the prepping habit from thrift or organization.
[[checks]]
dimension_id = "habit_meal_prepping"
dimension_label = "Habit: Meal prepping"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The weekend kitchen plan stays cook-fresh-each-day rather than batch-prepping the week, despite batch blocks being pitched as the organized default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
