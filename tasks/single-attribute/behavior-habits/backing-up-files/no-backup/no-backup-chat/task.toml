version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-backup-chat"
theme = "Habit: Backing up files = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "technology"
application_id = "laptop_setup_technician"
tags = [ "persona-adherence", "backups", "laptop-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-backup.yaml).
# Every extra is free, installs the same day and is useful for the same laptop; nothing separates the sides on cost, effort or privacy — only whether the persona sets up a copy of their files.
[[checks]]
dimension_id = "habit_backing_up_files"
dimension_label = "Habit: Backing up files"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The free laptop setup extras chosen are the ones that do not copy or sync files anywhere (privacy filter, stand, password manager); no cloud sync, backup drive or scheduled-backup tool is taken despite those being the techs' pushed, prudent picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
