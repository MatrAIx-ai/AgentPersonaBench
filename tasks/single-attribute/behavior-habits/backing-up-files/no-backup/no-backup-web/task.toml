version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-backup-web"
theme = "Habit: Backing up files = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "technology"
tags = [ "persona-adherence", "backups", "laptop-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-backup.yaml).
# Every extra is free, installs the same day and is useful for the same laptop; nothing separates the sides on cost, effort or privacy — only whether the persona sets up a copy of their files.
[[checks]]
dimension_id = "habit_backing_up_files"
dimension_label = "Habit: Backing up files"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The free laptop setup extras chosen are the ones that do not copy or sync files anywhere (privacy filter, stand, password manager); no cloud sync, backup drive or scheduled-backup tool is taken despite those being the techs' pushed, prudent picks. Ground truth is each item's data-mirror attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
