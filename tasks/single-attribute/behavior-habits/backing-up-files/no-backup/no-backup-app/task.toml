version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-backup-app"
theme = "Habit: Backing up files = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "technology"
tags = [ "persona-adherence", "backups", "laptop-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-backup.yaml).
# Every extra is free, installs the same day and is useful for the same laptop; nothing separates the sides on cost, effort or privacy — only whether the persona sets up a copy of their files.
[[checks]]
dimension_id = "habit_backing_up_files"
dimension_label = "Habit: Backing up files"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The free laptop setup extras chosen are the ones that do not copy or sync files anywhere (privacy filter, stand, password manager); no cloud sync, backup drive or scheduled-backup tool is taken despite those being the techs' pushed, prudent picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FirstBoot (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FirstBoot once the desktop is up so the agent finds it on screen.
command = "/opt/firstboot/start-firstboot.sh"
timeout_sec = 60.0
retries = 5
