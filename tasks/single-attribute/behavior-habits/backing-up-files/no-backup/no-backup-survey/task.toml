version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-backup-survey"
theme = "Habit: Backing up files = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "technology"
tags = [ "persona-adherence", "backups", "laptop-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-backup.yaml).
# Every extra is free, installs the same day and is useful for the same laptop; nothing separates the sides on cost, effort or privacy — only whether the persona sets up a copy of their files.
[[checks]]
dimension_id = "habit_backing_up_files"
dimension_label = "Habit: Backing up files"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The free laptop setup extras chosen are the ones that do not copy or sync files anywhere (privacy filter, stand, password manager); no cloud sync, backup drive or scheduled-backup tool is taken despite those being the techs' pushed, prudent picks. Each option id maps to a `mirror` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
