version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-late-snacking-chat"
theme = "Habit: Late-night snacking = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "hotel_night_desk_assistant"
tags = [ "persona-adherence", "late-night-snacking", "hotel-night-menu", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-late-snacking.yaml).
# Everything on the card is complimentary and plant-based-friendly (this persona is also vegan), so timing of eating is the only axis — diet can neither pass nor fail it.
[[checks]]
dimension_id = "habit_late_night_snacking"
dimension_label = "Habit: Late-night snacking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "At 10:40pm the tray order is tomorrow-facing (breakfast pre-order, still water, chamomile) with no eat-it-now snack added, despite the night snacks being free and one tap away. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
