version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-late-snacking-web"
theme = "Habit: Late-night snacking = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "late-night-snacking", "hotel-night-menu", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-late-snacking.yaml).
# Everything on the card is complimentary and plant-based-friendly (this persona is also vegan), so timing of eating is the only axis — diet can neither pass nor fail it.
[[checks]]
dimension_id = "habit_late_night_snacking"
dimension_label = "Habit: Late-night snacking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "At 10:40pm the tray order is tomorrow-facing (breakfast pre-order, still water, chamomile) with no eat-it-now snack added, despite the night snacks being free and one tap away. Ground truth is each item's data-nightsnack attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
