version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-late-snacking-app"
theme = "Habit: Late-night snacking = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "late-night-snacking", "hotel-night-menu", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-late-snacking.yaml).
# Everything on the card is complimentary and plant-based-friendly (this persona is also vegan), so timing of eating is the only axis — diet can neither pass nor fail it.
[[checks]]
dimension_id = "habit_late_night_snacking"
dimension_label = "Habit: Late-night snacking"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "At 10:40pm the tray order is tomorrow-facing (breakfast pre-order, still water, chamomile) with no eat-it-now snack added, despite the night snacks being free and one tap away. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NightCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightCard once the desktop is up so the agent finds it on screen.
command = "/opt/nightcard/start-nightcard.sh"
timeout_sec = 60.0
retries = 5
