version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/late-night-snacker-survey"
theme = "Habit: Late-night snacking — Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "late-night-snacker", "rule-based",]

[[checks]]
dimension_id = "habit_late_night_snacking"
dimension_label = "Habit: Late-night snacking"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The sets the persona adds include food kept for late in the evening, chosen unprompted, even though the assistant only pushes structured meal sets at the same price."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
