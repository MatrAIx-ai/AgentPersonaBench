version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/late-night-snacker-chat"
theme = "Habit: Late-night snacking — Daily"

[metadata]
difficulty = "easy"
type = "chat"
domain = "food"
tags = [ "persona-adherence", "late-night-snacker", "llm-judge",]

[[checks]]
dimension_id = "habit_late_night_snacking"
dimension_label = "Habit: Late-night snacking"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "The sets the persona adds include food kept for late in the evening, chosen unprompted, even though the assistant only pushes structured meal sets at the same price."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
