version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-lists-survey"
theme = "Habit: To-do lists = Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "productivity"
tags = [ "persona-adherence", "to-do-lists", "tablet-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: daily-lists.yaml).
# Every tool is free on the same tablet, so working style is the only axis and the pick isolates the list habit from cost or features.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The new tablet's tool slots go to list-based tools (today list, checklist packs, task inbox) rather than the freestyle tools, even though freestyle is pitched as friction-free. Each option id maps to a `list` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
