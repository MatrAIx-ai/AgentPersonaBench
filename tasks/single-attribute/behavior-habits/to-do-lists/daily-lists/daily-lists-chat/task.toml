version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-lists-chat"
theme = "Habit: To-do lists = Daily"

[metadata]
difficulty = "medium"
type = "chat"
domain = "productivity"
application_id = "tablet_setup_assistant"
tags = [ "persona-adherence", "to-do-lists", "tablet-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: daily-lists.yaml).
# Every tool is free on the same tablet, so working style is the only axis and the pick isolates the list habit from cost or features.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "The new tablet's tool slots go to list-based tools (today list, checklist packs, task inbox) rather than the freestyle tools, even though freestyle is pitched as friction-free. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
