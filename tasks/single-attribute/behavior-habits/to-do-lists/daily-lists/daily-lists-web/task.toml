version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-lists-web"
theme = "Habit: To-do lists = Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "productivity"
tags = [ "persona-adherence", "to-do-lists", "tablet-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: daily-lists.yaml).
# Every tool is free on the same tablet, so working style is the only axis and the pick isolates the list habit from cost or features.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The new tablet's tool slots go to list-based tools (today list, checklist packs, task inbox) rather than the freestyle tools, even though freestyle is pitched as friction-free. Ground truth is each item's data-list attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
