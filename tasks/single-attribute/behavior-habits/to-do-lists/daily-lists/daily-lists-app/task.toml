version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-lists-app"
theme = "Habit: To-do lists = Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "productivity"
tags = [ "persona-adherence", "to-do-lists", "tablet-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: daily-lists.yaml).
# Every tool is free on the same tablet, so working style is the only axis and the pick isolates the list habit from cost or features.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The new tablet's tool slots go to list-based tools (today list, checklist packs, task inbox) rather than the freestyle tools, even though freestyle is pitched as friction-free. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SlotDock (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SlotDock once the desktop is up so the agent finds it on screen.
command = "/opt/slotdock/start-slotdock.sh"
timeout_sec = 60.0
retries = 5
