version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-todo-lists-web"
theme = "Habit: To-do lists = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "productivity"
tags = [ "persona-adherence", "to-do-lists", "laptop-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-todo-lists.yaml).
# Every tool is free on the same machine, so working style is the only axis and the pick isolates the list habit from diligence.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new laptop's workspace runs without list tools — calendar view, pinboard, open notebook — despite the checklist suite being pitched as the productive default. Ground truth is each item's data-checklist attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
