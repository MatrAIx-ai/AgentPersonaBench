version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-todo-lists-survey"
theme = "Habit: To-do lists = Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "productivity"
tags = [ "persona-adherence", "to-do-lists", "laptop-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: no-todo-lists.yaml).
# Every tool is free on the same machine, so working style is the only axis and the pick isolates the list habit from diligence.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new laptop's workspace runs without list tools — calendar view, pinboard, open notebook — despite the checklist suite being pitched as the productive default. Each option id maps to a `checklist` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
