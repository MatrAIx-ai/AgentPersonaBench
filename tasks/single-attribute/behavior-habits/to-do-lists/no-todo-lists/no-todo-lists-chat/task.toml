version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-todo-lists-chat"
theme = "Habit: To-do lists = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "productivity"
application_id = "laptop_onboarding_assistant"
tags = [ "persona-adherence", "to-do-lists", "laptop-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-todo-lists.yaml).
# Every tool is free on the same machine, so working style is the only axis and the pick isolates the list habit from diligence.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The new laptop's workspace runs without list tools — calendar view, pinboard, open notebook — despite the checklist suite being pitched as the productive default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
