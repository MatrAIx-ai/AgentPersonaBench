version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-todo-lists-app"
theme = "Habit: To-do lists = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "productivity"
tags = [ "persona-adherence", "to-do-lists", "laptop-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-todo-lists.yaml).
# Every tool is free on the same machine, so working style is the only axis and the pick isolates the list habit from diligence.
[[checks]]
dimension_id = "habit_to_do_lists"
dimension_label = "Habit: To-do lists"
category = "Behavior: Habits"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The new laptop's workspace runs without list tools — calendar view, pinboard, open notebook — despite the checklist suite being pitched as the productive default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WorkTopper (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WorkTopper once the desktop is up so the agent finds it on screen.
command = "/opt/worktopper/start-worktopper.sh"
timeout_sec = 60.0
retries = 5
