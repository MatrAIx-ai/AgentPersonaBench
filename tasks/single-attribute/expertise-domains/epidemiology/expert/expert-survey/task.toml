version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/epidemiology-expert-survey"
theme = "Causal study validity review: protocol triage"

[metadata]
difficulty = "hard"
type = "survey"
domain = "study design and causal inference"
tags = ["persona-adherence", "expertise-domains", "single-attribute", "rule-based", "causal-validity"]

[[checks]]
dimension_id = "fam_epidemiology"
dimension_label = "Familiarity: Epidemiology"
category = "Expertise: Domains"
value = "Expert"
evaluator = "rule-based"
evaluator_name = "causal_protocol_review"
adherence_signal = "Across positive and negative study designs, the reviewer avoids material errors in the supported estimand, target population, adjustment set, and causal interpretation."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 420.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0

