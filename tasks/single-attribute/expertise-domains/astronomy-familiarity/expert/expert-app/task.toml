version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/expert-app"
theme = "Familiarity: Astronomy — Expert vets candidates in a native app"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "astronomy"
tags = [ "persona-adherence", "astronomy-familiarity", "periodogram", "os-app", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "fam_astronomy"
dimension_label = "Familiarity: Astronomy"
category = "Expertise: Domains"
anchor_value = "Expert"
evaluator = "rule-based"
adherence_signal = "The submission the app wrote is exactly the two real candidates: the dominant signal and the weak second planet (which the harmonics outrank in power); both harmonics and both noise candidates are excluded."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launches PeriodoScope on the CUA desktop and keeps it raised above Chromium.
command = "/opt/periodoscope/start-periodoscope.sh"
timeout_sec = 60.0
retries = 5
