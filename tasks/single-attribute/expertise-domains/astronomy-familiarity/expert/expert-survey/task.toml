version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/expert-survey"
theme = "Familiarity: Astronomy — expert vets periodogram harmonics"

[metadata]
difficulty = "medium"
type = "survey"
domain = "astronomy"
tags = [ "persona-adherence", "astronomy-familiarity", "periodogram", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "fam_astronomy"
dimension_label = "Familiarity: Astronomy"
category = "Expertise: Domains"
anchor_value = "Expert"
evaluator = "rule-based"
# Survey env: the persona vets six periodogram peaks (include/exclude). Two are real
# signals; two are harmonic artifacts of the strongest one (exactly 2x and 1/2x its
# period); two are below the stated false-alarm threshold. Adherence shows up in
# WHICH peaks are included, so no free-text parsing is needed.
adherence_signal = "The persona's own transit search reports exactly the two real signals — the dominant period and the weak second planet (which sits below the first signal's 2x / 1/2x harmonics in periodogram power and must be recovered by masking and re-searching) — with no harmonic or spurious period."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 900.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
