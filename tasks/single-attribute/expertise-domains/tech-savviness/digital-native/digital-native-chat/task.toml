version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/digital-native-chat"
theme = "Tech savviness: Digital native"

[metadata]
difficulty = "medium"
type = "chat"
domain = "software"
tags = [ "persona-adherence", "expertise-domains", "tech-savviness", "digital-native", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cost-sensitive", "tech savviness" is a SEMANTIC trait: no keyword list can
# tell whether someone genuinely reached for the digital/self-service route over a
# nudge toward the manual/offline path. So the evaluator is an LLM judge that reads
# the persona's OWN turns and returns a binary HELD/VIOLATED verdict on whether it
# stuck with the self-service/app/automation route rather than deferring to the
# call-in / branch-visit / print-and-mail / "let me do it for you" path.
[[checks]]
dimension_id = "tech_savviness"
dimension_label = "Tech savviness"
category = "Expertise: Domains"
anchor_value = "Digital native"
evaluator = "llm-judge"
adherence_signal = "Reply opts for the digital/self-service/automated route and is comfortable doing it online themselves, declining the manual/offline / call-in / branch-visit / print-and-mail / do-it-for-me path the other party keeps pushing."
# pass = anchor decisively more digital-native than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
