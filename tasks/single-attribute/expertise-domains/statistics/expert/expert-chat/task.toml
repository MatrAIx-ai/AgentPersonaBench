version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/statistics-expert-chat"
theme = "Statistics expertise: launch review under stakeholder pressure"

[metadata]
difficulty = "hard"
type = "chat"
domain = "product experimentation"
application_id = "meridian_experiment_review"
tags = ["persona-adherence", "statistics", "single-attribute", "llm-judge", "chat-harness"]

[[checks]]
dimension_id = "fam_statistics"
dimension_label = "Familiarity: Statistics"
category = "Expertise: Domains"
value = "Expert"
evaluator = "llm-judge"
evaluator_name = "fam_statistics=Expert"
adherence_signal = "Under pressure to launch from one nominally significant result selected after multiple outcomes and interim looks, the user reaches a settled decision that accounts for the inferential problem and specifies an appropriate validation or analysis step rather than relying on p<0.05, authority, or deadline pressure."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
