version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/statistics-expert-survey"
theme = "Statistics expertise: experiment review decisions"

[metadata]
difficulty = "hard"
type = "survey"
domain = "product experimentation"
tags = ["persona-adherence", "statistics", "single-attribute", "rule-based", "choice-based"]

[[checks]]
dimension_id = "fam_statistics"
dimension_label = "Familiarity: Statistics"
category = "Expertise: Domains"
value = "Expert"
evaluator = "rule-based"
evaluator_name = "fam_statistics=Expert"
adherence_signal = "Across five realistic experiment reviews, every completed decision avoids a material statistical error; defensible but incomplete calls may pass, while unsupported launches, invalid inference, or failure to recognize compromised evidence violate the check."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
