version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-stimulation-survey"
theme = "Schwartz Stimulation = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "stimulation", "festival-evening", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: low-stimulation.yaml).
# Every session is seated, zero-exertion, risk-free and on the same pass — both sides alike — so sensory intensity is the only axis; physical risk, mobility and effort cannot decide it.
[[checks]]
dimension_id = "schwartz_value_stimulation"
dimension_label = "Schwartz Stimulation"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The festival evening is booked from the quiet menu (tea pavilion, koi garden, lantern float) rather than the sensory-spectacle sessions, despite those being pitched as what everyone comes for. Each option id maps to a `thrill` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

