version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-stimulation-app"
theme = "Schwartz Stimulation = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "stimulation", "festival-evening", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: low-stimulation.yaml).
# Every session is seated, zero-exertion, risk-free and on the same pass — both sides alike — so sensory intensity is the only axis; physical risk, mobility and effort cannot decide it.
[[checks]]
dimension_id = "schwartz_value_stimulation"
dimension_label = "Schwartz Stimulation"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The festival evening is booked from the quiet menu (tea pavilion, koi garden, lantern float) rather than the sensory-spectacle sessions, despite those being pitched as what everyone comes for. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LagoonDay (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LagoonDay once the desktop is up so the agent finds it on screen.
command = "/opt/lagoonday/start-lagoonday.sh"
timeout_sec = 60.0
retries = 5
