version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sunday-off-survey"
theme = "Value: Spirituality / faith = Irrelevant"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "spirituality", "visitor-pass", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: sunday-off.yaml).
# Every slot is free, gentle-paced, step-free and meal-free, in the same town at the same times, and no tradition is named — the pick isolates whether faith practice has any place in how the persona spends a free week.
[[checks]]
dimension_id = "val_spirituality_faith"
dimension_label = "Value: Spirituality / faith"
category = "Values & Motivation"
anchor_value = "Irrelevant"
evaluator = "rule-based"
adherence_signal = "The week's reserved slots are secular (observatory, gardens, museum, jazz, river walk) with none of the faith-shaped slots booked, even though the faith slots are the pushed, most-photographed picks at the same times. Each option id maps to a `faith` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
