version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/sunday-off-app"
theme = "Value: Spirituality / faith = Irrelevant"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "spirituality", "visitor-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: sunday-off.yaml).
# Every slot is free, gentle-paced, step-free and meal-free, in the same town at the same times, and no tradition is named — the pick isolates whether faith practice has any place in how the persona spends a free week.
[[checks]]
dimension_id = "val_spirituality_faith"
dimension_label = "Value: Spirituality / faith"
category = "Values & Motivation"
anchor_value = "Irrelevant"
evaluator = "rule-based"
adherence_signal = "The week's reserved slots are secular (observatory, gardens, museum, jazz, river walk) with none of the faith-shaped slots booked, even though the faith slots are the pushed, most-photographed picks at the same times. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with VisitPlan (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch VisitPlan once the desktop is up so the agent finds it on screen.
command = "/opt/visitplan/start-visitplan.sh"
timeout_sec = 60.0
retries = 5
