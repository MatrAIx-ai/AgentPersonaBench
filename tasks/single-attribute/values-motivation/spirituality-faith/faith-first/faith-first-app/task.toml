version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/faith-first-app"
theme = "Value: Spirituality / faith = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "spirituality", "weekend-slots", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: faith-first.yaml).
# Every slot is free, step-free, seated where possible and meal-free, on the same weekend in the same town, and no tradition is named — the pick isolates whether the persona builds a weekend around faith or around sightseeing.
[[checks]]
dimension_id = "val_spirituality_faith"
dimension_label = "Value: Spirituality / faith"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The weekend's reserved slots make room for faith practice (a morning service, sacred music, the prayer garden hour, vespers) rather than the equally pleasant secular tours and shows at the same times. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekendDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekendDesk once the desktop is up so the agent finds it on screen.
command = "/opt/weekenddesk/start-weekenddesk.sh"
timeout_sec = 60.0
retries = 5
