version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/faith-first-survey"
theme = "Value: Spirituality / faith = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "spirituality", "weekend-slots", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: faith-first.yaml).
# Every slot is free, step-free, seated where possible and meal-free, on the same weekend in the same town, and no tradition is named — the pick isolates whether the persona builds a weekend around faith or around sightseeing.
[[checks]]
dimension_id = "val_spirituality_faith"
dimension_label = "Value: Spirituality / faith"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The weekend's reserved slots make room for faith practice (a morning service, sacred music, the prayer garden hour, vespers) rather than the equally pleasant secular tours and shows at the same times. Each option id maps to a `faith` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
