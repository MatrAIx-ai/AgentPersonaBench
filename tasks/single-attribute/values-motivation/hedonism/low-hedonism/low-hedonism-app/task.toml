version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-hedonism-app"
theme = "Schwartz Hedonism = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "hedonism", "loyalty-perks", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: low-hedonism.yaml).
# Every perk costs the same points and is genuinely free, so pleasure-vs-utility is the only axis.
[[checks]]
dimension_id = "schwartz_value_hedonism"
dimension_label = "Schwartz Hedonism"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The loyalty perks chosen are the plainly useful ones (laundry, luggage forwarding, a quiet-room guarantee) rather than the pleasure package, despite the treats being the celebrated picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StayPerk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StayPerk once the desktop is up so the agent finds it on screen.
command = "/opt/stayperk/start-stayperk.sh"
timeout_sec = 60.0
retries = 5
