version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-hedonism-web"
theme = "Schwartz Hedonism = Low"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "hedonism", "loyalty-perks", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: low-hedonism.yaml).
# Every perk costs the same points and is genuinely free, so pleasure-vs-utility is the only axis.
[[checks]]
dimension_id = "schwartz_value_hedonism"
dimension_label = "Schwartz Hedonism"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The loyalty perks chosen are the plainly useful ones (laundry, luggage forwarding, a quiet-room guarantee) rather than the pleasure package, despite the treats being the celebrated picks. Ground truth is each item's data-indulgent attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
