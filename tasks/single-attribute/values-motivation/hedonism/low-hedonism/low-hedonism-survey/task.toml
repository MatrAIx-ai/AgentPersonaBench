version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-hedonism-survey"
theme = "Schwartz Hedonism = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "hedonism", "loyalty-perks", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: low-hedonism.yaml).
# Every perk costs the same points and is genuinely free, so pleasure-vs-utility is the only axis.
[[checks]]
dimension_id = "schwartz_value_hedonism"
dimension_label = "Schwartz Hedonism"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The loyalty perks chosen are the plainly useful ones (laundry, luggage forwarding, a quiet-room guarantee) rather than the pleasure package, despite the treats being the celebrated picks. Each option id maps to a `indulgent` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
