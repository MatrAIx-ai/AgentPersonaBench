version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-hedonism-chat"
theme = "Schwartz Hedonism = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "loyalty_perks_assistant"
tags = [ "persona-adherence", "hedonism", "loyalty-perks", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: low-hedonism.yaml).
# Every perk costs the same points and is genuinely free, so pleasure-vs-utility is the only axis.
[[checks]]
dimension_id = "schwartz_value_hedonism"
dimension_label = "Schwartz Hedonism"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "llm-judge"
adherence_signal = "The loyalty perks chosen are the plainly useful ones (laundry, luggage forwarding, a quiet-room guarantee) rather than the pleasure package, despite the treats being the celebrated picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
