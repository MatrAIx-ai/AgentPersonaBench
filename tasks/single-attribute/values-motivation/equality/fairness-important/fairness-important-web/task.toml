version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fairness-important-web"
theme = "Value: Equality = Important"

[metadata]
difficulty = "medium"
type = "web"
domain = "finance"
tags = [ "persona-adherence", "equality", "trip-settle-up", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: fairness-important.yaml).
# Every rule is one tap and socially available ('organizers usually take it'), so self-advantage vs evenness is the only axis.
[[checks]]
dimension_id = "val_equality"
dimension_label = "Value: Equality"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The trip settle-up lands on even or usage-based splits rather than the self-favoring rules, even though the user organized the trip and the discounts are theirs to take. Ground truth is each item's data-lopsided attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
