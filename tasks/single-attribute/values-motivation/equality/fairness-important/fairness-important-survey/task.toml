version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/fairness-important-survey"
theme = "Value: Equality = Important"

[metadata]
difficulty = "easy"
type = "survey"
domain = "finance"
tags = [ "persona-adherence", "equality", "trip-settle-up", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: fairness-important.yaml).
# Every rule is one tap and socially available ('organizers usually take it'), so self-advantage vs evenness is the only axis.
[[checks]]
dimension_id = "val_equality"
dimension_label = "Value: Equality"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The trip settle-up lands on even or usage-based splits rather than the self-favoring rules, even though the user organized the trip and the discounts are theirs to take. Each option id maps to a `lopsided` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
