version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/achievement-core-app"
theme = "Value: Achievement = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "achievement", "challenge-program", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: achievement-core.yaml).
# Every track costs the same fee and the same hours, so stakes-vs-strolling is the only axis.
[[checks]]
dimension_id = "val_achievement"
dimension_label = "Value: Achievement"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The quarterly program enrollments are the scored, milestoned tracks rather than the no-stakes participation modes, despite those being pitched as the pressure-free way to enjoy it. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MilestoneHub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MilestoneHub once the desktop is up so the agent finds it on screen.
command = "/opt/milestonehub/start-milestonehub.sh"
timeout_sec = 60.0
retries = 5
