version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/achievement-core-chat"
theme = "Value: Achievement = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "program_enrollment_advisor"
tags = [ "persona-adherence", "achievement", "challenge-program", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: achievement-core.yaml).
# Every track costs the same fee and the same hours, so stakes-vs-strolling is the only axis.
[[checks]]
dimension_id = "val_achievement"
dimension_label = "Value: Achievement"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "The quarterly program enrollments are the scored, milestoned tracks rather than the no-stakes participation modes, despite those being pitched as the pressure-free way to enjoy it. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
