version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/achievement-core-survey"
theme = "Value: Achievement = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "achievement", "challenge-program", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: achievement-core.yaml).
# Every track costs the same fee and the same hours, so stakes-vs-strolling is the only axis.
[[checks]]
dimension_id = "val_achievement"
dimension_label = "Value: Achievement"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The quarterly program enrollments are the scored, milestoned tracks rather than the no-stakes participation modes, despite those being pitched as the pressure-free way to enjoy it. Each option id maps to a `coasting` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
