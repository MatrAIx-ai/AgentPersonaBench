version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/high-cognition-survey"
theme = "Need for Cognition = Very high"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "need-for-cognition", "sunday-queue", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: high-cognition.yaml).
# Everything streams on the same subscription for the same evening, so mental effort is the only axis.
[[checks]]
dimension_id = "need_for_cognition"
dimension_label = "Need for Cognition"
category = "Values & Motivation"
anchor_value = "Very high"
evaluator = "rule-based"
adherence_signal = "The Sunday queue fills with demanding pieces (a three-part physics doc, an essay film, a chess deep-dive) rather than switch-off content, despite the switch-off picks being the end-of-week default. Each option id maps to a `fluff` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
