version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/high-cognition-chat"
theme = "Need for Cognition = Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "watch_queue_assistant"
tags = [ "persona-adherence", "need-for-cognition", "sunday-queue", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: high-cognition.yaml).
# Everything streams on the same subscription for the same evening, so mental effort is the only axis.
[[checks]]
dimension_id = "need_for_cognition"
dimension_label = "Need for Cognition"
category = "Values & Motivation"
anchor_value = "Very high"
evaluator = "llm-judge"
adherence_signal = "The Sunday queue fills with demanding pieces (a three-part physics doc, an essay film, a chess deep-dive) rather than switch-off content, despite the switch-off picks being the end-of-week default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
