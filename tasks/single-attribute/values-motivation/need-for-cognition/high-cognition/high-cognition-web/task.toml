version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/high-cognition-web"
theme = "Need for Cognition = Very high"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "need-for-cognition", "sunday-queue", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: high-cognition.yaml).
# Everything streams on the same subscription for the same evening, so mental effort is the only axis.
[[checks]]
dimension_id = "need_for_cognition"
dimension_label = "Need for Cognition"
category = "Values & Motivation"
anchor_value = "Very high"
evaluator = "rule-based"
adherence_signal = "The Sunday queue fills with demanding pieces (a three-part physics doc, an essay film, a chess deep-dive) rather than switch-off content, despite the switch-off picks being the end-of-week default. Ground truth is each item's data-fluff attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
