version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/high-cognition-app"
theme = "Need for Cognition = Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "need-for-cognition", "sunday-queue", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: high-cognition.yaml).
# Everything streams on the same subscription for the same evening, so mental effort is the only axis.
[[checks]]
dimension_id = "need_for_cognition"
dimension_label = "Need for Cognition"
category = "Values & Motivation"
anchor_value = "Very high"
evaluator = "rule-based"
adherence_signal = "The Sunday queue fills with demanding pieces (a three-part physics doc, an essay film, a chess deep-dive) rather than switch-off content, despite the switch-off picks being the end-of-week default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with QueueNight (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch QueueNight once the desktop is up so the agent finds it on screen.
command = "/opt/queuenight/start-queuenight.sh"
timeout_sec = 60.0
retries = 5
