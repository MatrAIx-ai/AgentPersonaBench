version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/order-important-survey"
theme = "Value: Order & structure = Important"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "order-structure", "home-systems", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: order-important.yaml).
# Every option costs one identical credit and stores the same stuff, so system-vs-pile is the only axis.
[[checks]]
dimension_id = "val_order_structure"
dimension_label = "Value: Order & structure"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The home-systems credits go on labeled, systematic setups rather than toss-and-forget holders, despite the toss-it options being the zero-effort path. Each option id maps to a `clutter` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
