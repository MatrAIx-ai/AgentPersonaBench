version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/order-important-app"
theme = "Value: Order & structure = Important"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household"
tags = [ "persona-adherence", "order-structure", "home-systems", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: order-important.yaml).
# Every option costs one identical credit and stores the same stuff, so system-vs-pile is the only axis.
[[checks]]
dimension_id = "val_order_structure"
dimension_label = "Value: Order & structure"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The home-systems credits go on labeled, systematic setups rather than toss-and-forget holders, despite the toss-it options being the zero-effort path. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfSort (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfSort once the desktop is up so the agent finds it on screen.
command = "/opt/shelfsort/start-shelfsort.sh"
timeout_sec = 60.0
retries = 5
