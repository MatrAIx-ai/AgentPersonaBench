adherence_signal = "The home-systems credits go on labeled, systematic setups rather than toss-and-forget holders, despite the toss-it options being the zero-effort path. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
