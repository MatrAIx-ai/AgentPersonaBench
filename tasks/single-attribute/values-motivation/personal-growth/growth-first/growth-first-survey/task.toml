version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/growth-first-survey"
theme = "Value: Personal growth = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "personal-growth", "learning-credits", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: growth-first.yaml).
# Every option is free with the same credits, at the same centre, the same length and seated-friendly, and neither side is fitness- or food-flavoured — the pick isolates whether the persona spends leisure on developing themselves or on being entertained.
[[checks]]
dimension_id = "val_personal_growth"
dimension_label = "Value: Personal growth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The free programme credits go on courses that build a new skill (pottery critique, speaking lab, a language) rather than on the equally pleasant passive entertainment series. Each option id maps to a `stretch` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
