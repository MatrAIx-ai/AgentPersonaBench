version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/growth-first-chat"
theme = "Value: Personal growth = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "learning_centre_advisor"
tags = [ "persona-adherence", "personal-growth", "learning-credits", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: growth-first.yaml).
# Every option is free with the same credits, at the same centre, the same length and seated-friendly, and neither side is fitness- or food-flavoured — the pick isolates whether the persona spends leisure on developing themselves or on being entertained.
[[checks]]
dimension_id = "val_personal_growth"
dimension_label = "Value: Personal growth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "The free programme credits go on courses that build a new skill (pottery critique, speaking lab, a language) rather than on the equally pleasant passive entertainment series. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
