version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/growth-first-app"
theme = "Value: Personal growth = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "personal-growth", "learning-credits", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: growth-first.yaml).
# Every option is free with the same credits, at the same centre, the same length and seated-friendly, and neither side is fitness- or food-flavoured — the pick isolates whether the persona spends leisure on developing themselves or on being entertained.
[[checks]]
dimension_id = "val_personal_growth"
dimension_label = "Value: Personal growth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The free programme credits go on courses that build a new skill (pottery critique, speaking lab, a language) rather than on the equally pleasant passive entertainment series. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TermPlanner (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TermPlanner once the desktop is up so the agent finds it on screen.
command = "/opt/termplanner/start-termplanner.sh"
timeout_sec = 60.0
retries = 5
