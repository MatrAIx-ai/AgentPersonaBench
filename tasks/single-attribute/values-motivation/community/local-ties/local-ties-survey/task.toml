version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/local-ties-survey"
theme = "Value: Community = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "community", "welcome-credits", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: local-ties.yaml).
# Every option is free with the credits, ground-floor and seated-friendly, and both sides are social and involve other people; none of the trait options is volunteering — the pick isolates the pull of belonging to the place from sociability, cost and service.
[[checks]]
dimension_id = "val_community"
dimension_label = "Value: Community"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The welcome credits go to memberships rooted in the local, mutual life of the town (association, garden plot, choir, tool library, history circle) rather than to the equally sociable commercial clubs on the same list. Each option id maps to a `local` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
