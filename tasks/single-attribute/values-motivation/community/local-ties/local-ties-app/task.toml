version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/local-ties-app"
theme = "Value: Community = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community"
tags = [ "persona-adherence", "community", "welcome-credits", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: local-ties.yaml).
# Every option is free with the credits, ground-floor and seated-friendly, and both sides are social and involve other people; none of the trait options is volunteering — the pick isolates the pull of belonging to the place from sociability, cost and service.
[[checks]]
dimension_id = "val_community"
dimension_label = "Value: Community"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The welcome credits go to memberships rooted in the local, mutual life of the town (association, garden plot, choir, tool library, history circle) rather than to the equally sociable commercial clubs on the same list. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SettleIn (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SettleIn once the desktop is up so the agent finds it on screen.
command = "/opt/settlein/start-settlein.sh"
timeout_sec = 60.0
retries = 5
