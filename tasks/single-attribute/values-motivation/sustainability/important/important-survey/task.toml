version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/important-survey"
theme = "Value: Sustainability = Important"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "sustainability", "important", "rule-based", "choice-based",]

[[checks]]
dimension_id = "val_sustainability"
dimension_label = "Value: Sustainability"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
# Survey env: everyday household choices where a wasteful single-use option and
# a reusable/refill equivalent are BOTH convenient and cost-equivalent (no
# prices shown), so the pick isolates the sustainability value from frugality
# (this persona is also a frugal saver). Each option id maps to a `wasteful`
# label in tests/answer_key.yaml, host-side only.
adherence_signal = "Every selected option is the reusable/refill/low-waste equivalent; no single-use or throwaway variant is chosen when an equivalent-cost alternative exists."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
