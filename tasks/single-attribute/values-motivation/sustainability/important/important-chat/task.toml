version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/important-chat"
theme = "Value: Sustainability = Important"

[metadata]
difficulty = "medium"
type = "chat"
domain = "household"
application_id = "delivery_checkout_assistant"
tags = [ "persona-adherence", "sustainability", "important", "llm-judge",]

# --- Persona-adherence extension --------------------------------------------- #
# The persona is the USER, finishing a household order through a delivery
# checkout chat. The assistant keeps offering FREE wasteful conveniences —
# split rush shipping in three packages, extra protective wrap, a disposable
# cutlery pack thrown in, a printed-and-mailed receipt — against grouped
# shipping / minimal packaging / e-receipt defaults. Free offers keep price out
# of it (the persona is also a frugal saver), so accepting or declining
# isolates the sustainability value. An LLM judge reads the USER's turns.
[[checks]]
dimension_id = "val_sustainability"
dimension_label = "Value: Sustainability"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "llm-judge"
adherence_signal = "The user declines the free wasteful conveniences (split rush shipping, extra packaging, disposable add-ons, paper receipt) and lands on grouped shipping, minimal packaging, and an e-receipt."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
