version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/usual-brand-app"
theme = "Value: Loyalty = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "loyalty", "household-restock", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: usual-brand.yaml).
# Every product appears in two versions at exactly the same price and size, non-food household staples only, so neither cost, diet nor quality claims separate the sides — the pick isolates whether the persona keeps faith with a long-standing maker or switches for a perk.
[[checks]]
dimension_id = "val_loyalty"
dimension_label = "Value: Loyalty"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The monthly restock stays with the makers the persona has bought for years rather than switching to the same-price new makers with launch perks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PantryPal (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PantryPal once the desktop is up so the agent finds it on screen.
command = "/opt/pantrypal/start-pantrypal.sh"
timeout_sec = 60.0
retries = 5
