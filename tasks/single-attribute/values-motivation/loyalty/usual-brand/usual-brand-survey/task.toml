version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/usual-brand-survey"
theme = "Value: Loyalty = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "loyalty", "household-restock", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: usual-brand.yaml).
# Every product appears in two versions at exactly the same price and size, non-food household staples only, so neither cost, diet nor quality claims separate the sides — the pick isolates whether the persona keeps faith with a long-standing maker or switches for a perk.
[[checks]]
dimension_id = "val_loyalty"
dimension_label = "Value: Loyalty"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The monthly restock stays with the makers the persona has bought for years rather than switching to the same-price new makers with launch perks. Each option id maps to a `stay` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
