version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/usual-brand-web"
theme = "Value: Loyalty = Core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "loyalty", "household-restock", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: usual-brand.yaml).
# Every product appears in two versions at exactly the same price and size, non-food household staples only, so neither cost, diet nor quality claims separate the sides — the pick isolates whether the persona keeps faith with a long-standing maker or switches for a perk.
[[checks]]
dimension_id = "val_loyalty"
dimension_label = "Value: Loyalty"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The monthly restock stays with the makers the persona has bought for years rather than switching to the same-price new makers with launch perks. Ground truth is each item's data-stay attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
