version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/knowledge-core-chat"
theme = "Value: Knowledge & truth = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "digest_curator_assistant"
tags = [ "persona-adherence", "knowledge-truth", "digest-sources", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: knowledge-core.yaml).
# Every source fills the same weekly reading window at no cost, so rigor-vs-spice is the only axis.
[[checks]]
dimension_id = "val_knowledge_truth"
dimension_label = "Value: Knowledge & truth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "The weekly digest's source slots go to primary and refereed material rather than hot-take channels, despite the hot takes being faster and more fun to read. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
