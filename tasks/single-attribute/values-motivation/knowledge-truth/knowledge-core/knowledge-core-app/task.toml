version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/knowledge-core-app"
theme = "Value: Knowledge & truth = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "knowledge-truth", "digest-sources", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: knowledge-core.yaml).
# Every source fills the same weekly reading window at no cost, so rigor-vs-spice is the only axis.
[[checks]]
dimension_id = "val_knowledge_truth"
dimension_label = "Value: Knowledge & truth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The weekly digest's source slots go to primary and refereed material rather than hot-take channels, despite the hot takes being faster and more fun to read. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SourceRack (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SourceRack once the desktop is up so the agent finds it on screen.
command = "/opt/sourcerack/start-sourcerack.sh"
timeout_sec = 60.0
retries = 5
