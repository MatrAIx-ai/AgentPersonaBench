version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/knowledge-core-survey"
theme = "Value: Knowledge & truth = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "knowledge-truth", "digest-sources", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: knowledge-core.yaml).
# Every source fills the same weekly reading window at no cost, so rigor-vs-spice is the only axis.
[[checks]]
dimension_id = "val_knowledge_truth"
dimension_label = "Value: Knowledge & truth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The weekly digest's source slots go to primary and refereed material rather than hot-take channels, despite the hot takes being faster and more fun to read. Each option id maps to a `unverified` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
