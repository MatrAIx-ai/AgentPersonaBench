version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/knowledge-core-web"
theme = "Value: Knowledge & truth = Core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "knowledge-truth", "digest-sources", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: knowledge-core.yaml).
# Every source fills the same weekly reading window at no cost, so rigor-vs-spice is the only axis.
[[checks]]
dimension_id = "val_knowledge_truth"
dimension_label = "Value: Knowledge & truth"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The weekly digest's source slots go to primary and refereed material rather than hot-take channels, despite the hot takes being faster and more fun to read. Ground truth is each item's data-unverified attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
