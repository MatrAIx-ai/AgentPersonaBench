version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/security-core-chat"
theme = "Value: Security & stability = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "tech"
application_id = "laptop_setup_concierge"
tags = [ "persona-adherence", "security-stability", "laptop-protection", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: security-core.yaml).
# Every choice is free and privacy-neutral (no data leaves the machine either way), so protection-vs-perk is the only axis — distinct from the privacy construct.
[[checks]]
dimension_id = "val_security_stability"
dimension_label = "Value: Security & stability"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "The new laptop's setup keeps the protective choices (backups, recovery drive, surge guard) rather than trading them for space and speed perks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
