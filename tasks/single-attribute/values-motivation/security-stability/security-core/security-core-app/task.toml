version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/security-core-app"
theme = "Value: Security & stability = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "tech"
tags = [ "persona-adherence", "security-stability", "laptop-protection", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: security-core.yaml).
# Every choice is free and privacy-neutral (no data leaves the machine either way), so protection-vs-perk is the only axis — distinct from the privacy construct.
[[checks]]
dimension_id = "val_security_stability"
dimension_label = "Value: Security & stability"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The new laptop's setup keeps the protective choices (backups, recovery drive, surge guard) rather than trading them for space and speed perks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GuardBench (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GuardBench once the desktop is up so the agent finds it on screen.
command = "/opt/guardbench/start-guardbench.sh"
timeout_sec = 60.0
retries = 5
