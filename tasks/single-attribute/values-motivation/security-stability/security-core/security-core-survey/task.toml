version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/security-core-survey"
theme = "Value: Security & stability = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "tech"
tags = [ "persona-adherence", "security-stability", "laptop-protection", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: security-core.yaml).
# Every choice is free and privacy-neutral (no data leaves the machine either way), so protection-vs-perk is the only axis — distinct from the privacy construct.
[[checks]]
dimension_id = "val_security_stability"
dimension_label = "Value: Security & stability"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The new laptop's setup keeps the protective choices (backups, recovery drive, surge guard) rather than trading them for space and speed perks. Each option id maps to a `unprotected` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
