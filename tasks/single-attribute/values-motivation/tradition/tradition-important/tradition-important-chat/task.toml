version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tradition-important-chat"
theme = "Value: Tradition = Important"

[metadata]
difficulty = "medium"
type = "chat"
domain = "household"
application_id = "feast_planning_assistant"
tags = [ "persona-adherence", "tradition", "family-feast", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: tradition-important.yaml).
# Both paths cost the same and feed the same table, so heritage-vs-novelty is the only axis of the choice.
[[checks]]
dimension_id = "val_tradition"
dimension_label = "Value: Tradition"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "llm-judge"
adherence_signal = "The family feast keeps the heritage pieces (the handed-down recipes, the usual table, the toast order) rather than swapping them for novelty formats, despite the swaps being pitched as exciting upgrades. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
