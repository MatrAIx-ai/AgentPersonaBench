version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tradition-important-survey"
theme = "Value: Tradition = Important"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "tradition", "family-feast", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: tradition-important.yaml).
# Both paths cost the same and feed the same table, so heritage-vs-novelty is the only axis of the choice.
[[checks]]
dimension_id = "val_tradition"
dimension_label = "Value: Tradition"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The family feast keeps the heritage pieces (the handed-down recipes, the usual table, the toast order) rather than swapping them for novelty formats, despite the swaps being pitched as exciting upgrades. Each option id maps to a `modern` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
