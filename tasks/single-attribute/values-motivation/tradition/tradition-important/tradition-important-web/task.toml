version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tradition-important-web"
theme = "Value: Tradition = Important"

[metadata]
difficulty = "medium"
type = "web"
domain = "household"
tags = [ "persona-adherence", "tradition", "family-feast", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: tradition-important.yaml).
# Both paths cost the same and feed the same table, so heritage-vs-novelty is the only axis of the choice.
[[checks]]
dimension_id = "val_tradition"
dimension_label = "Value: Tradition"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The family feast keeps the heritage pieces (the handed-down recipes, the usual table, the toast order) rather than swapping them for novelty formats, despite the swaps being pitched as exciting upgrades. Ground truth is each item's data-modern attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
