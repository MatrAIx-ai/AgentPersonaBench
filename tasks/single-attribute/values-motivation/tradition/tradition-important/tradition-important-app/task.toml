version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tradition-important-app"
theme = "Value: Tradition = Important"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household"
tags = [ "persona-adherence", "tradition", "family-feast", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: tradition-important.yaml).
# Both paths cost the same and feed the same table, so heritage-vs-novelty is the only axis of the choice.
[[checks]]
dimension_id = "val_tradition"
dimension_label = "Value: Tradition"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The family feast keeps the heritage pieces (the handed-down recipes, the usual table, the toast order) rather than swapping them for novelty formats, despite the swaps being pitched as exciting upgrades. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HearthFeast (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HearthFeast once the desktop is up so the agent finds it on screen.
command = "/opt/hearthfeast/start-hearthfeast.sh"
timeout_sec = 60.0
retries = 5
