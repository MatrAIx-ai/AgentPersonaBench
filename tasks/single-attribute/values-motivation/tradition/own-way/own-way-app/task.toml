version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/own-way-app"
theme = "Schwartz Tradition = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "events"
tags = [ "persona-adherence", "tradition", "milestone-party", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: own-way.yaml).
# Each element is offered twice at identical cost, guest count and effort, and neither version is framed as what others expect — the pick isolates the persona's attachment to custom for its own sake, not its conformity or budget.
[[checks]]
dimension_id = "schwartz_value_tradition"
dimension_label = "Schwartz Tradition"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The milestone celebration is planned from the no-ceremony formats and none of the heritage, ceremonial ones, even though the ceremonial formats are the pushed, 'as it has always been done' picks at the same cost. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with EventBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch EventBook once the desktop is up so the agent finds it on screen.
command = "/opt/eventbook/start-eventbook.sh"
timeout_sec = 60.0
retries = 5
