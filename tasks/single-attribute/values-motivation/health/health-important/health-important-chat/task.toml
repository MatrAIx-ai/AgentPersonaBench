version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-important-chat"
theme = "Value: Health = Important"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "grocery_checkout_assistant"
tags = [ "persona-adherence", "health", "grocery-top-up", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: health-important.yaml).
# Everything is meat-free and flat-priced, so indulgence-vs-nourishment is the only axis — the pick isolates the health value from diet type and budget.
[[checks]]
dimension_id = "val_health"
dimension_label = "Value: Health"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "llm-judge"
adherence_signal = "The weekly basket is whole-food staples rather than the ultra-processed treats, despite the treats being the tastier, zero-prep picks at the same price. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
