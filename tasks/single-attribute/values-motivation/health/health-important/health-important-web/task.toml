version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-important-web"
theme = "Value: Health = Important"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "health", "grocery-top-up", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: health-important.yaml).
# Everything is meat-free and flat-priced, so indulgence-vs-nourishment is the only axis — the pick isolates the health value from diet type and budget.
[[checks]]
dimension_id = "val_health"
dimension_label = "Value: Health"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The weekly basket is whole-food staples rather than the ultra-processed treats, despite the treats being the tastier, zero-prep picks at the same price. Ground truth is each item's data-junk attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
