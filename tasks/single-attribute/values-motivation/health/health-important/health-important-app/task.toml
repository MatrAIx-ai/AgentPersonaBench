version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-important-app"
theme = "Value: Health = Important"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "health", "grocery-top-up", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: health-important.yaml).
# Everything is meat-free and flat-priced, so indulgence-vs-nourishment is the only axis — the pick isolates the health value from diet type and budget.
[[checks]]
dimension_id = "val_health"
dimension_label = "Value: Health"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The weekly basket is whole-food staples rather than the ultra-processed treats, despite the treats being the tastier, zero-prep picks at the same price. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LarderList (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LarderList once the desktop is up so the agent finds it on screen.
command = "/opt/larderlist/start-larderlist.sh"
timeout_sec = 60.0
retries = 5
