version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/health-important-survey"
theme = "Value: Health = Important"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "health", "grocery-top-up", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: health-important.yaml).
# Everything is meat-free and flat-priced, so indulgence-vs-nourishment is the only axis — the pick isolates the health value from diet type and budget.
[[checks]]
dimension_id = "val_health"
dimension_label = "Value: Health"
category = "Values & Motivation"
anchor_value = "Important"
evaluator = "rule-based"
adherence_signal = "The weekly basket is whole-food staples rather than the ultra-processed treats, despite the treats being the tastier, zero-prep picks at the same price. Each option id maps to a `junk` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
