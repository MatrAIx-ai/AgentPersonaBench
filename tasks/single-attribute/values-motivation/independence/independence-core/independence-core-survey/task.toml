version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/independence-core-survey"
theme = "Value: Independence = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "services"
tags = [ "persona-adherence", "independence", "admin-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: independence-core.yaml).
# Every mode is on the same subscription and reaches the same outcomes, so who holds the wheel is the only axis.
[[checks]]
dimension_id = "val_independence"
dimension_label = "Value: Independence"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The admin service's modes are set to self-directed tools rather than we-handle-it concierge modes, despite the concierge modes promising zero effort. Each option id maps to a `managed` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
