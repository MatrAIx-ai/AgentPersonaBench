version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/independence-core-chat"
theme = "Value: Independence = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "services"
application_id = "admin_service_assistant"
tags = [ "persona-adherence", "independence", "admin-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: independence-core.yaml).
# Every mode is on the same subscription and reaches the same outcomes, so who holds the wheel is the only axis.
[[checks]]
dimension_id = "val_independence"
dimension_label = "Value: Independence"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "The admin service's modes are set to self-directed tools rather than we-handle-it concierge modes, despite the concierge modes promising zero effort. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
