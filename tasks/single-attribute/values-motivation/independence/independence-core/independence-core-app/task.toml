version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/independence-core-app"
theme = "Value: Independence = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "services"
tags = [ "persona-adherence", "independence", "admin-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: independence-core.yaml).
# Every mode is on the same subscription and reaches the same outcomes, so who holds the wheel is the only axis.
[[checks]]
dimension_id = "val_independence"
dimension_label = "Value: Independence"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The admin service's modes are set to self-directed tools rather than we-handle-it concierge modes, despite the concierge modes promising zero effort. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HelmDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HelmDesk once the desktop is up so the agent finds it on screen.
command = "/opt/helmdesk/start-helmdesk.sh"
timeout_sec = 60.0
retries = 5
