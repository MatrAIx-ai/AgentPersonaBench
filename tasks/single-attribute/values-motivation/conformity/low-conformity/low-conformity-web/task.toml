version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-conformity-web"
theme = "Schwartz Conformity = Low"

[metadata]
difficulty = "medium"
type = "web"
domain = "household"
tags = [ "persona-adherence", "conformity", "study-nook", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: low-conformity.yaml).
# Each pair is functionally identical at the same price — the popularity tag is the only differentiator, so following-the-crowd is the only axis.
[[checks]]
dimension_id = "schwartz_value_conformity"
dimension_label = "Schwartz Conformity"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The study-nook picks are the odd-one-out equivalents rather than the everyone-gets-this defaults, when the popularity tag is the only difference between the pairs. Ground truth is each item's data-bandwagon attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
