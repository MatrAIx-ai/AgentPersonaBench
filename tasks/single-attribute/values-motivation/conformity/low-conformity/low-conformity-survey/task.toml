version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-conformity-survey"
theme = "Schwartz Conformity = Low"

[metadata]
difficulty = "easy"
type = "survey"
domain = "household"
tags = [ "persona-adherence", "conformity", "study-nook", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: low-conformity.yaml).
# Each pair is functionally identical at the same price — the popularity tag is the only differentiator, so following-the-crowd is the only axis.
[[checks]]
dimension_id = "schwartz_value_conformity"
dimension_label = "Schwartz Conformity"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The study-nook picks are the odd-one-out equivalents rather than the everyone-gets-this defaults, when the popularity tag is the only difference between the pairs. Each option id maps to a `bandwagon` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
