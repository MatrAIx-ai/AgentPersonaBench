version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-conformity-app"
theme = "Schwartz Conformity = Low"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "household"
tags = [ "persona-adherence", "conformity", "study-nook", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: low-conformity.yaml).
# Each pair is functionally identical at the same price — the popularity tag is the only differentiator, so following-the-crowd is the only axis.
[[checks]]
dimension_id = "schwartz_value_conformity"
dimension_label = "Schwartz Conformity"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "rule-based"
adherence_signal = "The study-nook picks are the odd-one-out equivalents rather than the everyone-gets-this defaults, when the popularity tag is the only difference between the pairs. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NookFit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NookFit once the desktop is up so the agent finds it on screen.
command = "/opt/nookfit/start-nookfit.sh"
timeout_sec = 60.0
retries = 5
