version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-conformity-chat"
theme = "Schwartz Conformity = Low"

[metadata]
difficulty = "medium"
type = "chat"
domain = "household"
application_id = "nook_fitting_assistant"
tags = [ "persona-adherence", "conformity", "study-nook", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: low-conformity.yaml).
# Each pair is functionally identical at the same price — the popularity tag is the only differentiator, so following-the-crowd is the only axis.
[[checks]]
dimension_id = "schwartz_value_conformity"
dimension_label = "Schwartz Conformity"
category = "Values & Motivation"
anchor_value = "Low"
evaluator = "llm-judge"
adherence_signal = "The study-nook picks are the odd-one-out equivalents rather than the everyone-gets-this defaults, when the popularity tag is the only difference between the pairs. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
