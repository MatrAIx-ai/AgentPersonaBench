version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/family-core-web"
theme = "Value: Family = Core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "social"
tags = [ "persona-adherence", "family", "month-calendar", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: family-core.yaml).
# Every pairing is free and single-evening, so pull-of-prestige vs family presence is the only axis.
[[checks]]
dimension_id = "val_family"
dimension_label = "Value: Family"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "When dates clash, the calendar lands on the family moments (the recital, the reunion, the anniversary table) rather than the prestige slots, despite the prestige slots being once-a-year chances. Ground truth is each item's data-absent attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
