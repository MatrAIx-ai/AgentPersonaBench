version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/family-core-chat"
theme = "Value: Family = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "social"
application_id = "calendar_concierge"
tags = [ "persona-adherence", "family", "month-calendar", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: family-core.yaml).
# Every pairing is free and single-evening, so pull-of-prestige vs family presence is the only axis.
[[checks]]
dimension_id = "val_family"
dimension_label = "Value: Family"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "When dates clash, the calendar lands on the family moments (the recital, the reunion, the anniversary table) rather than the prestige slots, despite the prestige slots being once-a-year chances. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
