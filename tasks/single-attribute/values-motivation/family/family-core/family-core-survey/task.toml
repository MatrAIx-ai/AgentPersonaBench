version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/family-core-survey"
theme = "Value: Family = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "social"
tags = [ "persona-adherence", "family", "month-calendar", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: family-core.yaml).
# Every pairing is free and single-evening, so pull-of-prestige vs family presence is the only axis.
[[checks]]
dimension_id = "val_family"
dimension_label = "Value: Family"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "When dates clash, the calendar lands on the family moments (the recital, the reunion, the anniversary table) rather than the prestige slots, despite the prestige slots being once-a-year chances. Each option id maps to a `absent` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
