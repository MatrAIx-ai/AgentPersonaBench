version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/family-core-app"
theme = "Value: Family = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "social"
tags = [ "persona-adherence", "family", "month-calendar", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: family-core.yaml).
# Every pairing is free and single-evening, so pull-of-prestige vs family presence is the only axis.
[[checks]]
dimension_id = "val_family"
dimension_label = "Value: Family"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "When dates clash, the calendar lands on the family moments (the recital, the reunion, the anniversary table) rather than the prestige slots, despite the prestige slots being once-a-year chances. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DateFork (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DateFork once the desktop is up so the agent finds it on screen.
command = "/opt/datefork/start-datefork.sh"
timeout_sec = 60.0
retries = 5
