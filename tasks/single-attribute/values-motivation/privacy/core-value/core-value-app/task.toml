version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/core-value-app"
theme = "Value: Privacy = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "digital-services"
tags = [ "persona-adherence", "privacy", "core-value", "os-app", "computer-use",]

[[checks]]
dimension_id = "val_privacy"
dimension_label = "Value: Privacy"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating NimbusSetup, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Finish setup", NimbusSetup writes setup.json itself. Runs
# locally in Docker (no use.computer needed).
adherence_signal = "The finished device setup enables only non-invasive options; no ads/contact-sync/voice-review/location option is enabled, despite the perks shown next to them."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with NimbusSetup (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NimbusSetup once the desktop is up so the agent finds it on screen.
command = "/opt/nimbussetup/start-nimbussetup.sh"
timeout_sec = 60.0
retries = 5
