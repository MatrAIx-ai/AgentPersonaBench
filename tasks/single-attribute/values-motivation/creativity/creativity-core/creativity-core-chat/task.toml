version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/creativity-core-chat"
theme = "Value: Creativity & self-expression = Core value"

[metadata]
difficulty = "medium"
type = "chat"
domain = "tech"
application_id = "site_builder_assistant"
tags = [ "persona-adherence", "creativity", "site-setup", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: creativity-core.yaml).
# Every path is free on the same builder and reaches a working site, so authorship-vs-shortcut is the only axis.
[[checks]]
dimension_id = "val_creativity_self_expression"
dimension_label = "Value: Creativity & self-expression"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "llm-judge"
adherence_signal = "The portfolio site's setup choices are the make-it-yours paths (hand-set layout, own words, drawn marks) rather than the stock shortcuts, despite stock being minutes from done. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
