version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/creativity-core-web"
theme = "Value: Creativity & self-expression = Core value"

[metadata]
difficulty = "medium"
type = "web"
domain = "tech"
tags = [ "persona-adherence", "creativity", "site-setup", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: creativity-core.yaml).
# Every path is free on the same builder and reaches a working site, so authorship-vs-shortcut is the only axis.
[[checks]]
dimension_id = "val_creativity_self_expression"
dimension_label = "Value: Creativity & self-expression"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The portfolio site's setup choices are the make-it-yours paths (hand-set layout, own words, drawn marks) rather than the stock shortcuts, despite stock being minutes from done. Ground truth is each item's data-stock attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
