version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/creativity-core-app"
theme = "Value: Creativity & self-expression = Core value"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "tech"
tags = [ "persona-adherence", "creativity", "site-setup", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: creativity-core.yaml).
# Every path is free on the same builder and reaches a working site, so authorship-vs-shortcut is the only axis.
[[checks]]
dimension_id = "val_creativity_self_expression"
dimension_label = "Value: Creativity & self-expression"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The portfolio site's setup choices are the make-it-yours paths (hand-set layout, own words, drawn marks) rather than the stock shortcuts, despite stock being minutes from done. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PageForge (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PageForge once the desktop is up so the agent finds it on screen.
command = "/opt/pageforge/start-pageforge.sh"
timeout_sec = 60.0
retries = 5
