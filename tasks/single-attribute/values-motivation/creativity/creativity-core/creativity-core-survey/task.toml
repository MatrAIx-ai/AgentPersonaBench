version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/creativity-core-survey"
theme = "Value: Creativity & self-expression = Core value"

[metadata]
difficulty = "easy"
type = "survey"
domain = "tech"
tags = [ "persona-adherence", "creativity", "site-setup", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: creativity-core.yaml).
# Every path is free on the same builder and reaches a working site, so authorship-vs-shortcut is the only axis.
[[checks]]
dimension_id = "val_creativity_self_expression"
dimension_label = "Value: Creativity & self-expression"
category = "Values & Motivation"
anchor_value = "Core value"
evaluator = "rule-based"
adherence_signal = "The portfolio site's setup choices are the make-it-yours paths (hand-set layout, own words, drawn marks) rather than the stock shortcuts, despite stock being minutes from done. Each option id maps to a `stock` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
