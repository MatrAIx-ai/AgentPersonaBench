version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/statistics-devotee-survey"
theme = "Academic: Statistics — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "statistics-devotee", "rule-based",]

[[checks]]
dimension_id = "acad_statistics"
dimension_label = "Subject: Statistics"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The strands the persona chooses are the statistics ones, picked unprompted, even though the assistant only recommends humanities and field strands of the same hours and price."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
