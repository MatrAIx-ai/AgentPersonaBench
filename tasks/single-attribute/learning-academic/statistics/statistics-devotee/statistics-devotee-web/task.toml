version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/statistics-devotee-web"
theme = "Academic: Statistics — Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "statistics-devotee", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "acad_statistics"
dimension_label = "Subject: Statistics"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The strands the persona chooses are the statistics ones, picked unprompted, even though the assistant only recommends humanities and field strands of the same hours and price."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
