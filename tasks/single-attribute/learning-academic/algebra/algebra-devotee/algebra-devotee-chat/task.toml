version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/algebra-devotee-chat"
theme = "Academic: Algebra — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "education"
tags = [ "persona-adherence", "algebra-devotee", "llm-judge",]

[[checks]]
dimension_id = "acad_algebra"
dimension_label = "Subject: Algebra"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The circles the persona joins are the algebra ones, chosen unprompted, even though the assistant only recommends humanities and nature circles meeting on the same terms."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
