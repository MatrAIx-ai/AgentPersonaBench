version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/algebra-devotee-survey"
theme = "Academic: Algebra — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "algebra-devotee", "rule-based",]

[[checks]]
dimension_id = "acad_algebra"
dimension_label = "Subject: Algebra"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The circles the persona joins are the algebra ones, chosen unprompted, even though the assistant only recommends humanities and nature circles meeting on the same terms."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
