version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/literature-devotee-survey"
theme = "Academic: Literature — Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "literature-devotee", "rule-based",]

[[checks]]
dimension_id = "acad_literature"
dimension_label = "Subject: Literature"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The courses the persona enrols in are the literature ones, chosen unprompted, even though the assistant only recommends practical and science courses of the same length and price."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
