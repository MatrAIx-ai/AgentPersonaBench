version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/literature-devotee-chat"
theme = "Academic: Literature — Passionate"

[metadata]
difficulty = "easy"
type = "chat"
domain = "education"
tags = [ "persona-adherence", "literature-devotee", "llm-judge",]

[[checks]]
dimension_id = "acad_literature"
dimension_label = "Subject: Literature"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The courses the persona enrols in are the literature ones, chosen unprompted, even though the assistant only recommends practical and science courses of the same length and price."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
