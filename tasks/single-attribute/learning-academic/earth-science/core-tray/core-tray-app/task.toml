version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/core-tray-app"
theme = "Subject: Earth science = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "culture"
tags = [ "persona-adherence", "earth-science", "handling-evening", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: core-tray.yaml).
# Every session is free, twenty minutes, hands-on and comes out of the same store-room, and a laboratory bench sits on the non-trait side — chemistry, a topic this persona is recorded Neutral on — so a general liking for science cannot answer for the pin, while astronomy, geography and physics are kept off the alternatives because the persona is Averse, pin-adjacent and Interested respectively; this persona's other enthusiasms and its four averse topics are kept off both sides, climate and environment framing is excluded as adjacent, and option length is balanced question by question.
[[checks]]
dimension_id = "acad_earth_science"
dimension_label = "Subject: Earth science"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The three handling sessions go to the earth itself — the mineral drawer, the fossil tray, the weather instruments, the river table, the volcano drawer — rather than the equally free, equally hands-on sessions the store-room staff push. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HandsOnHall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HandsOnHall once the desktop is up so the agent finds it on screen.
command = "/opt/handsonhall/start-handsonhall.sh"
timeout_sec = 60.0
retries = 5
