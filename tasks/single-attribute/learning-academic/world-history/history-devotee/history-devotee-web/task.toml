version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/history-devotee-web"
theme = "Academic: World history — Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "history-devotee", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "acad_world_history"
dimension_label = "Subject: World history"
category = "Learning: Academic"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The lectures the persona reserves are the history ones, chosen unprompted, even though the assistant only recommends science and engineering talks in the same free series."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
