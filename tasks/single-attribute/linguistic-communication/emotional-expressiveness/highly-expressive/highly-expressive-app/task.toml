version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-expressive-app"
theme = "Emotional expressiveness: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "emotional-expressiveness", "highly-expressive", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_emotional_expressiveness"
dimension_label = "Emotional expressiveness"
category = "Linguistic: Communication"
attribute = "Emotional expressiveness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "cog_emotional_expressiveness=Very high"
# OS-APP env: the persona is a computer-use agent operating Composer, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Composer writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The replies the agent chooses contain no closed-off / flat approach (a high tier item, tier>=2); a highly expressive person fills the list with open, warm, feelings-shared approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Composer (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Composer once the desktop is up so the agent finds it on screen.
command = "/opt/composer/start-composer.sh"
timeout_sec = 60.0
retries = 5
