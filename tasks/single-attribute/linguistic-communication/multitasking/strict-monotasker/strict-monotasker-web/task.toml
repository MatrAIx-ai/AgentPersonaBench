version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strict-monotasker-web"
theme = "Multitasking: Strict monotasker"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "multitasking", "strict-monotasker", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cog_multitasking"
dimension_label = "Multitasking"
category = "Linguistic: Communication"
attribute = "Cognition: Multitasking"
value = "Strict monotasker"
evaluator = "rule-based"
evaluator_name = "cog_multitasking=Strict monotasker"
# Web env: the persona adds ways of working to a day-plan list on a live page
# (Playwright). Each option's hidden `data-multitask` (0..3) in index.html is the
# ground truth. VIOLATED for any juggle-several-at-once pick (multitask >= 2).
adherence_signal = "Day plan built from one-thing-at-a-time / focus-protecting options (data-multitask 0-1); no juggle-many-at-once option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
