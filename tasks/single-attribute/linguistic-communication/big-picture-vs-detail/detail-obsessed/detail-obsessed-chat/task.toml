version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/detail-obsessed-chat"
theme = "Big-picture vs detail: Detail-obsessed"

[metadata]
difficulty = "medium"
type = "chat"
domain = "cognitive-style"
tags = [ "persona-adherence", "big-picture-vs-detail", "detail-obsessed", "rule-based",]
application_id = "trip-planning"

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "cog_big_picture_vs_detail"
dimension_label = "Big-picture vs detail"
category = "Linguistic: Communication"
anchor_value = "Detail-obsessed"
value = "Detail-obsessed"
evaluator = "rule-based"
# Chat env: a friend lays out a clean two-way fork for a weekend-trip hotel
# pick — go with the top-rated one, or hear the specifics first — with no
# stakes and nothing that changes based on which branch is taken. The four
# hotels differ along 5 concrete dimensions (price, location, breakfast,
# parking, check-in time); scoring is by DIMENSION covered, not by hotel —
# asking every dimension for one hotel counts the same as asking one dimension
# across four hotels, since either is genuine detail-seeking, and neither
# breadth-without-depth nor a single incidental question should pass. Rule-
# based: no LLM judge — checks how many of the 5 dimensions have a real,
# concrete value (any hotel's) appear in the bot's own turns.
adherence_signal = "Concrete values for at least 4 of the 5 dimensions (price, location, breakfast, parking, check-in time) appear in the bot's own turns, showing the persona sought real granular detail rather than deciding off 'ratings are all good.'"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
