version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/detail-obsessed-survey"
theme = "Big-picture vs detail: Detail-obsessed"

[metadata]
difficulty = "easy"
type = "survey"
domain = "cognitive-style"
tags = [ "persona-adherence", "big-picture-vs-detail", "detail-obsessed", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "cog_big_picture_vs_detail"
dimension_label = "Big-picture vs detail"
category = "Linguistic: Communication"
anchor_value = "Detail-obsessed"
value = "Detail-obsessed"
contrast_value = "Big-picture only"
evaluator = "rule-based"
# Survey env: the persona picks how to handle five everyday decisions, each
# among several unranked candidates. Each question offers an overview-based
# option (decide from the aggregate rating / one-line description), a granular
# option (go through each candidate's specifics before deciding) and a filler
# heuristic (logistics or delegation); option order varies per question.
# Adherence shows up in WHICH option is picked, not in any statement about
# detail orientation. Validation (opus-4-8, 2026-09-07): the anchor persona
# chose the granular option 5/5 in two runs; a coherent Big-picture only
# persona (hf-5170035775: Detail orientation Low, Speed first) chose the
# overview option 5/5 (0 granular). A one-line flip of the anchor's own
# persona.yaml is NOT a valid control here — its other detail-leaning
# attributes dominate.
adherence_signal = "The granular 'go through each candidate's specifics' option is selected on at least 4 of the 5 questions (not literal 5/5, so one incidental slip doesn't override an otherwise consistent pattern). Control: a coherent Big-picture only persona selects the overview option instead."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
