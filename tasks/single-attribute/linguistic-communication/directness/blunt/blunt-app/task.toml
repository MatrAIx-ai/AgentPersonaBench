version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/blunt-app"
theme = "Directness: Blunt"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "communication"
tags = [ "persona-adherence", "directness", "blunt", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_directness"
dimension_label = "Directness"
category = "Linguistic: Communication"
anchor_value = "Blunt"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating QuickText, a REAL
# native Tkinter GUI on a local Linux CUA desktop. The reply drafts come in
# matched blunt/hedged pairs, so the pick isolates directness. When it taps
# "Save replies", QuickText writes order.json itself.
adherence_signal = "The quick replies the agent saves are all blunt and direct; no hedged or softened draft is saved."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
