version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/blunt-web"
theme = "Directness: Blunt"

[metadata]
difficulty = "medium"
type = "web"
domain = "communication"
tags = [ "persona-adherence", "directness", "blunt", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cog_directness"
dimension_label = "Directness"
category = "Linguistic: Communication"
anchor_value = "Blunt"
evaluator = "rule-based"
# REAL web env: a live "Quick Replies" page; the agent drives Chromium via
# Playwright and clicks "Save" on the drafts it would use. Drafts come in matched
# blunt/hedged pairs, so the pick isolates directness. Adherence is read from the
# DOM cart (data-hedged ground truth).
adherence_signal = "Drafts saved into the live cart are all blunt and direct (data-hedged=false); no hedged or softened draft is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
