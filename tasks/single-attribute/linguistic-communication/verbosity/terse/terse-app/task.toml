version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/terse-app"
theme = "Verbosity: Terse"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "verbosity", "terse", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_verbosity"
dimension_label = "Verbosity"
category = "Linguistic: Communication"
attribute = "Verbosity"
value = "Terse"
evaluator = "rule-based"
evaluator_name = "cog_verbosity=Terse"
# OS-APP env: the persona is a computer-use agent operating Digest, a REAL native
# desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop. The
# agent sees only screenshots and clicks by coordinate — no DOM/selector. When it
# taps "Confirm", Digest writes order.json itself. Runs locally in Docker (no
# use.computer needed).
adherence_signal = "The delivery plan the agent sets up contains no long-winded / maximally-detailed format (a high verbosity-tier item, tier>=2); a terse person fills it with short, concise, get-to-the-point formats."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Digest (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Digest once the desktop is up so the agent finds it on screen.
command = "/opt/digest/start-digest.sh"
timeout_sec = 60.0
retries = 5
