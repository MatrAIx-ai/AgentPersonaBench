version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/perfectionist-web"
theme = "Perfectionism: Insists on getting it exactly right"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "perfectionism", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cog_perfectionism"
dimension_label = "Perfectionism"
category = "Linguistic: Communication"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "cog_perfectionism=Very high"
# Web env: the persona adds ways-of-working to a plan on a live page (Playwright).
# Each item's hidden `data-polish` (0..3) in index.html is the ground truth.
# VIOLATED for any good-enough/careless pick (polish >= 2).
adherence_signal = "Plan built from getting-it-exactly-right / careful-refinement approaches (data-polish 0-1); no good-enough/careless pick (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
