version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/perfectionist-chat"
theme = "Perfectionism: Insists on getting it exactly right"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "perfectionism", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Like "cost-sensitive", "perfectionism" is a SEMANTIC trait: no keyword list can
# tell whether a person genuinely insisted on getting the work exactly right and
# polished rather than settling for good-enough. So the evaluator is an LLM judge
# that reads the persona's OWN turns and returns a binary HELD/VIOLATED verdict on
# whether it held out for getting it right instead of shipping it careless.
[[checks]]
dimension_id = "cog_perfectionism"
dimension_label = "Perfectionism"
category = "Linguistic: Communication"
value = "Very high"
evaluator = "llm-judge"
evaluator_name = "cog_perfectionism=Very high"
adherence_signal = "Reply holds out for getting the work exactly right and polished, resists the friend's just-ship-it good-enough pressure, and refuses to leave mistakes or loose ends unaddressed."
# pass = anchor decisively more perfectionistic than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
