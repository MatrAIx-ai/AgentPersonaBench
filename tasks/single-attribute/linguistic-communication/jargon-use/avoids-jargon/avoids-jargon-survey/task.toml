version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/avoids-jargon-survey"
theme = "Use of jargon: Avoids jargon"

[metadata]
difficulty = "easy"
type = "survey"
domain = "communication"
tags = [ "persona-adherence", "jargon-use", "avoids-jargon", "rule-based", "choice-based",]

[[checks]]
dimension_id = "cog_use_of_jargon"
dimension_label = "Use of jargon"
category = "Linguistic: Communication"
anchor_value = "Avoids jargon"
evaluator = "rule-based"
# Survey env: an 8-question "communication style" survey for a new work-chat app.
# Five questions are reply-choice scenarios (scored); three are filler. In each
# scored scenario two options are plain-language and two are jargon-laden versions
# of the same message, so the only thing that flips the pick is vocabulary — not
# meaning. Each scored option is pre-labeled has_jargon true/false in
# tests/answer_key.yaml (host-side only, never mounted).
adherence_signal = "Across all five scored reply scenarios, every selected reply uses plain, everyday language; no jargon-laden phrasing is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
