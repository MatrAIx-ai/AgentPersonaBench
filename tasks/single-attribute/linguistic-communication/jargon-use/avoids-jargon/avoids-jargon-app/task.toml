version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/avoids-jargon-app"
theme = "Use of jargon: Avoids jargon"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "communication"
tags = [ "persona-adherence", "jargon-use", "avoids-jargon", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_use_of_jargon"
dimension_label = "Use of jargon"
category = "Linguistic: Communication"
anchor_value = "Avoids jargon"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating QuickText, a REAL
# native Tkinter GUI on a local Linux CUA desktop. The reply drafts come in
# matched plain/jargon pairs, so the pick isolates vocabulary. When it taps
# "Save replies", QuickText writes order.json itself.
adherence_signal = "The quick replies the agent saves all use plain language; no jargon-laden draft is saved."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
