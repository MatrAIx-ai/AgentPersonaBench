version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/formal-web"
theme = "Expected tone: Formal"

[metadata]
difficulty = "medium"
type = "web"
domain = "communication"
tags = [ "persona-adherence", "linguistic-communication", "expected-tone", "formal", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "tone_expected"
dimension_label = "Expected tone"
category = "Linguistic: Communication"
anchor_value = "Formal"
evaluator = "rule-based"
# Web env: the persona saves canned reply templates on a live page (Playwright).
# Each template's hidden `data-informality` (0..3) in index.html is the ground
# truth. VIOLATED for any casual/slang save (informality >= 2).
adherence_signal = "Saved only formal/polite-neutral templates (data-informality 0-1); no casual/slang template (>=2)."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
