version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/playful-app"
theme = "Expected tone: Playful"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "communication"
tags = [ "persona-adherence", "expected-tone", "playful", "os-app", "computer-use",]

[[checks]]
dimension_id = "tone_expected"
dimension_label = "Expected tone"
category = "Linguistic: Communication"
anchor_value = "Playful"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating ChatComposer, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Send", ChatComposer writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The reply the agent sends is written in a playful or friendly-casual register; no flat or stiff/formal wording (stiffness tier >= 2) is chosen."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ChatComposer (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ChatComposer once the desktop is up so the agent finds it on screen.
command = "/opt/chatcomposer/start-chatcomposer.sh"
timeout_sec = 60.0
retries = 5
