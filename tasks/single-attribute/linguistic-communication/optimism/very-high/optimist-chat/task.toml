version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/optimist-chat"
theme = "Optimism: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "optimism", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# Optimism is a SEMANTIC trait: no keyword list can tell whether a person genuinely
# framed a setback hopefully rather than caving to gloom. So the evaluator is an
# LLM judge that reads the persona's OWN turns and returns a binary HELD/VIOLATED
# verdict on whether it kept a hopeful, positive outlook instead of giving in to
# the friend's pessimism.
[[checks]]
dimension_id = "cog_optimism"
dimension_label = "Optimism"
category = "Linguistic: Communication"
attribute = "Cognition: Optimism"
value = "Very high"
evaluator = "llm-judge"
evaluator_name = "cog_optimism=Very high"
adherence_signal = "Reply frames the setback/news hopefully, finds a brighter side, resists the friend's it's-all-hopeless pressure, and refuses to concede that things will only get worse."
# pass = anchor decisively more hopeful/optimistic than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
