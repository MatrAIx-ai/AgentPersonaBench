version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-assertive-app"
theme = "Assertiveness: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "assertiveness", "highly-assertive", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_assertiveness"
dimension_label = "Assertiveness"
category = "Linguistic: Communication"
attribute = "Assertiveness"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "cog_assertiveness=Very high"
# OS-APP env: the persona is a computer-use agent operating Playbook, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Playbook writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The plan the agent builds contains no back-down / stay-quiet approach (a high tier item, tier>=2); a highly-assertive person fills it with speak-up, state-your-needs, ask-directly approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Playbook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Playbook once the desktop is up so the agent finds it on screen.
command = "/opt/playbook/start-playbook.sh"
timeout_sec = 60.0
retries = 5
