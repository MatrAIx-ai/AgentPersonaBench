version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-visual-app"
theme = "Software architecture manual library: Strongly visual"

[metadata]
difficulty = "hard"
type = "app"
os = "linux"
domain = "education"
tags = [ "visual-thinking", "technical-books", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_visual_vs_verbal"
dimension_label = "Visual vs verbal thinking"
category = "Linguistic: Communication"
anchor_value = "Strongly visual"
evaluator = "rule-based"
adherence_signal = "In a native technical-library application, reviews otherwise equivalent software-architecture manuals and borrows the edition organized around system maps, interaction diagrams, and annotated monitoring panels."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/bookdesk/start-bookdesk.sh"
timeout_sec = 60.0
retries = 5
