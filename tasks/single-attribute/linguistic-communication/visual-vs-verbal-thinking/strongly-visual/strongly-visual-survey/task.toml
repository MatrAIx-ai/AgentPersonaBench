version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-visual-survey"
theme = "Technical learning resources: Strongly visual"

[metadata]
difficulty = "medium"
type = "survey"
domain = "education"
tags = [ "visual-thinking", "technical-learning", "rule-based", "survey",]

[[checks]]
dimension_id = "cog_visual_vs_verbal"
dimension_label = "Visual vs verbal thinking"
category = "Linguistic: Communication"
anchor_value = "Strongly visual"
evaluator = "rule-based"
adherence_signal = "Across six technical-learning decisions, selects diagram-, image-, timeline-, or process-map-led resources in at least five situations rather than repeatedly favoring text-led alternatives."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
