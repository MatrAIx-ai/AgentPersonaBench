version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-visual-chat"
theme = "Technical book consultation: Strongly visual"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "technical_book_adviser"
tags = [ "visual-thinking", "technical-books", "rule-based", "chat",]

[[checks]]
dimension_id = "cog_visual_vs_verbal"
dimension_label = "Visual vs verbal thinking"
category = "Linguistic: Communication"
anchor_value = "Strongly visual"
evaluator = "llm-judge"
adherence_signal = "After hearing equivalent presentation formats and a recommendation for a text-led edition, confirms the edition whose teaching is organized around architecture maps, sequence diagrams, and annotated screenshots."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
