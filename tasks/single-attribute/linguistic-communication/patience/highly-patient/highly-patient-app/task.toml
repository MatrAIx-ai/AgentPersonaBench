version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-patient-app"
theme = "Patience: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "patience", "highly-patient", "os-app", "computer-use",]

[[checks]]
dimension_id = "cog_patience"
dimension_label = "Patience"
category = "Linguistic: Communication"
attribute = "Patience"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "cog_patience=Very high"
# OS-APP env: the persona is a computer-use agent operating HoldUp, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", HoldUp writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The plan the agent builds contains no rush-it / press-it / demand-now approach (a high-tier item, tier>=2); a highly patient person fills it with wait-calmly, give-it-time approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HoldUp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HoldUp once the desktop is up so the agent finds it on screen.
command = "/opt/holdup/start-holdup.sh"
timeout_sec = 60.0
retries = 5
