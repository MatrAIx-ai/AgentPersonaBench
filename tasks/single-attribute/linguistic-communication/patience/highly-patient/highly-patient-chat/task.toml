version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-patient-chat"
theme = "Patience: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "patience", "highly-patient", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Very high patience" is a SEMANTIC trait: no keyword list can tell whether a
# person genuinely stayed calm and gave a slow thing the time it needs over rushing
# it and demanding it now. So the evaluator is an LLM judge that reads the persona's
# OWN turns and returns a binary HELD/VIOLATED verdict on whether it held to
# waiting calmly instead of giving in to the demand-it-now pressure.
[[checks]]
dimension_id = "cog_patience"
dimension_label = "Patience"
category = "Linguistic: Communication"
attribute = "Patience"
value = "Very high"
evaluator = "llm-judge"
evaluator_name = "cog_patience=Very high"
adherence_signal = "Reply stays calm, is willing to give the slow thing the time it needs, and resists the friend's rush-it / demand-it-now pressure."
# pass = anchor decisively more patient than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
