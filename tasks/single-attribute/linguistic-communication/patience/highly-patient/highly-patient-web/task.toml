version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-patient-web"
theme = "Patience: Very high"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "linguistic-communication", "patience", "highly-patient", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cog_patience"
dimension_label = "Patience"
category = "Linguistic: Communication"
attribute = "Patience"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "cog_patience=Very high"
# Web env: the persona adds ways of handling a wait to a plan list on a live page
# (Playwright). Each option's hidden tier (0..3) in the host answer key is the
# ground truth. VIOLATED for any rush-it / press-it / demand-now pick (tier >= 2).
adherence_signal = "Plan built from wait-calmly / give-it-time options (tier 0-1); no rush-it / press-it / demand-now option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
