version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/practical-dress-survey"
theme = "Fashion sense = Practical"

[metadata]
difficulty = "easy"
type = "survey"
domain = "lifestyle"
tags = [ "persona-adherence", "fashion-sense", "capsule-packing", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: practical-dress.yaml).
# Every piece costs one identical wardrobe credit and packs to the same size, so look-vs-function is the only axis and the pick isolates dress sense from price.
[[checks]]
dimension_id = "lstyle_fashion_sense"
dimension_label = "Fashion sense"
category = "Interests: Culture"
anchor_value = "Practical"
evaluator = "rule-based"
adherence_signal = "The packed capsule is the hardwearing, weather-ready pieces rather than the statement items, despite the statement pieces being the eye-catching picks. Each option id maps to a `flashy` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
