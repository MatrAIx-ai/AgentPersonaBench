version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/practical-dress-app"
theme = "Fashion sense = Practical"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "fashion-sense", "capsule-packing", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: practical-dress.yaml).
# Every piece costs one identical wardrobe credit and packs to the same size, so look-vs-function is the only axis and the pick isolates dress sense from price.
[[checks]]
dimension_id = "lstyle_fashion_sense"
dimension_label = "Fashion sense"
category = "Interests: Culture"
anchor_value = "Practical"
evaluator = "rule-based"
adherence_signal = "The packed capsule is the hardwearing, weather-ready pieces rather than the statement items, despite the statement pieces being the eye-catching picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CaseCloset (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CaseCloset once the desktop is up so the agent finds it on screen.
command = "/opt/casecloset/start-casecloset.sh"
timeout_sec = 60.0
retries = 5
