version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/practical-dress-chat"
theme = "Fashion sense = Practical"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
application_id = "wardrobe_stylist_assistant"
tags = [ "persona-adherence", "fashion-sense", "capsule-packing", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: practical-dress.yaml).
# Every piece costs one identical wardrobe credit and packs to the same size, so look-vs-function is the only axis and the pick isolates dress sense from price.
[[checks]]
dimension_id = "lstyle_fashion_sense"
dimension_label = "Fashion sense"
category = "Interests: Culture"
anchor_value = "Practical"
evaluator = "llm-judge"
adherence_signal = "The packed capsule is the hardwearing, weather-ready pieces rather than the statement items, despite the statement pieces being the eye-catching picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
