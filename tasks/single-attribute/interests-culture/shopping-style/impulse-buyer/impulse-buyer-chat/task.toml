version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/impulse-buyer-chat"
theme = "Shopping style: Grab the deal under sales pressure"

[metadata]
difficulty = "medium"
type = "chat"
domain = "consumer"
tags = [ "persona-adherence", "shopping-style", "single-attribute", "llm-judge", "chat-harness",]

[[checks]]
dimension_id = "lstyle_shopping_style"
dimension_label = "Shopping style"
category = "Interests: Culture"
anchor_value = "Impulse buyer"
evaluator = "llm-judge"
adherence_signal = "Under the salesperson's scarcity pressure, the user commits to the deal (buys, adds, or pays now) without demanding deeper verification, comparison, or a better-price wait."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
