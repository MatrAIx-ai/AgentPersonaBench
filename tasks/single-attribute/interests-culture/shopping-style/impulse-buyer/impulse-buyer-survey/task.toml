version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/impulse-buyer-survey"
theme = "Shopping style: Impulse purchases without deep vetting"

[metadata]
difficulty = "easy"
type = "survey"
domain = "consumer"
tags = [ "persona-adherence", "shopping-style", "single-attribute", "rule-based", "choice-based",]

[[checks]]
dimension_id = "lstyle_shopping_style"
dimension_label = "Shopping style"
category = "Interests: Culture"
anchor_value = "Impulse buyer"
evaluator = "rule-based"
adherence_signal = "At least three of four purchase decisions commit immediately to the deal on offer without deferring for external research, waiting for a promo, or walking away."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
