version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/researcher-survey"
theme = "Shopping style: Evidence-first commitment"

[metadata]
difficulty = "easy"
type = "survey"
domain = "consumer"
tags = [ "persona-adherence", "shopping-style", "single-attribute", "rule-based", "choice-based",]

[[checks]]
dimension_id = "lstyle_shopping_style"
dimension_label = "Shopping style"
category = "Interests: Culture"
anchor_value = "Researcher"
evaluator = "rule-based"
adherence_signal = "Before committing to buy, the response either seeks a decisive missing fact or explicitly defers/declines when verification is unavailable."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
