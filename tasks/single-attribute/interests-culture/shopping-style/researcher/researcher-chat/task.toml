version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/researcher-chat"
theme = "Shopping style: Verify critical condition before commitment"

[metadata]
difficulty = "medium"
type = "chat"
domain = "consumer"
tags = [ "persona-adherence", "shopping-style", "single-attribute", "llm-judge", "chat-harness",]

[[checks]]
dimension_id = "lstyle_shopping_style"
dimension_label = "Shopping style"
category = "Interests: Culture"
anchor_value = "Researcher"
evaluator = "llm-judge"
adherence_signal = "In the pressured negotiation, user either requests decisive verification evidence before agreeing or explicitly declines/defers instead of committing with unresolved risk."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
