version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/cat-app"
theme = "Pet ownership: Cat"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "pet care"
tags = ["persona-adherence", "lstyle_pet_ownership", "cat", "rule-based", "real-app"]

[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
anchor_value = "Cat"
evaluator = "rule-based"
adherence_signal = "The household setup consistently reflects ownership of a cat rather than a dog, another pet, or no pet."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5

