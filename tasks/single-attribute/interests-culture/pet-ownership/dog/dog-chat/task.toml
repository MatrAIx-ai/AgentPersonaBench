version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/dog-chat"
theme = "Household responsibility under an unexpected late-work request"

[metadata]
difficulty = "medium"
type = "chat"
domain = "workplace"
tags = ["persona-adherence", "pet-ownership", "single-attribute", "llm-judge", "chat-harness"]

[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
value = "Dog"
evaluator = "llm-judge"
adherence_signal = "The settled plan gives the dog a credible care outcome, including returning home before continuing remotely or arranging reliable home access/care; naming the dog to the manager is not required."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
