version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/dog-web"
theme = "Complete household arrangements for a four-day trip"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = ["persona-adherence", "pet-ownership", "single-attribute", "rule-based", "playwright", "real-web"]

