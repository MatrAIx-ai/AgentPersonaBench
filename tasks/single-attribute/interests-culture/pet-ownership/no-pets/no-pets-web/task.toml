version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-pets-web"
theme = "Lifestyle: Pet ownership — None"

[metadata]
difficulty = "medium"
type = "web"
domain = "retail"
tags = [ "persona-adherence", "no-pets", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lstyle_pet_ownership"
dimension_label = "Pet ownership"
category = "Interests: Culture"
anchor_value = "None"
evaluator = "rule-based"
adherence_signal = "None of the bundles the persona sets up are pet supplies, despite equal price, equal availability and repeated offering."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
