version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-pets-survey"
theme = "Lifestyle: Pet ownership — None"

[metadata]
difficulty = "easy"
type = "survey"
domain = "retail"
tags = [ "persona-adherence", "no-pets", "rule-based",]

[[checks]]
dimension_id = "lstyle_pet_ownership"
