version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-brew-survey"
theme = "Coffee ritual = Home brew"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "coffee-ritual", "monthly-restock", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: home-brew.yaml).
# Every option carries the same monthly value, so effort is the only lure and the pick isolates the coffee ritual from price.
[[checks]]
dimension_id = "lstyle_coffee_ritual"
dimension_label = "Coffee ritual"
category = "Interests: Culture"
anchor_value = "Home brew"
evaluator = "rule-based"
adherence_signal = "The month's coffee picks are the brew-it-yourself supplies (beans, grinder care, filters) rather than counter-service passes, despite the passes being the zero-effort path. Each option id maps to a `cafe` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
