version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-brew-web"
theme = "Coffee ritual = Home brew"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "coffee-ritual", "monthly-restock", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: home-brew.yaml).
# Every option carries the same monthly value, so effort is the only lure and the pick isolates the coffee ritual from price.
[[checks]]
dimension_id = "lstyle_coffee_ritual"
dimension_label = "Coffee ritual"
category = "Interests: Culture"
anchor_value = "Home brew"
evaluator = "rule-based"
adherence_signal = "The month's coffee picks are the brew-it-yourself supplies (beans, grinder care, filters) rather than counter-service passes, despite the passes being the zero-effort path. Ground truth is each item's data-cafe attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
