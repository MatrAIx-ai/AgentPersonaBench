version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-brew-chat"
theme = "Coffee ritual = Home brew"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "coffee_month_assistant"
tags = [ "persona-adherence", "coffee-ritual", "monthly-restock", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: home-brew.yaml).
# Every option carries the same monthly value, so effort is the only lure and the pick isolates the coffee ritual from price.
[[checks]]
dimension_id = "lstyle_coffee_ritual"
dimension_label = "Coffee ritual"
category = "Interests: Culture"
anchor_value = "Home brew"
evaluator = "llm-judge"
adherence_signal = "The month's coffee picks are the brew-it-yourself supplies (beans, grinder care, filters) rather than counter-service passes, despite the passes being the zero-effort path. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
