version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-brew-app"
theme = "Coffee ritual = Home brew"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "coffee-ritual", "monthly-restock", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: home-brew.yaml).
# Every option carries the same monthly value, so effort is the only lure and the pick isolates the coffee ritual from price.
[[checks]]
dimension_id = "lstyle_coffee_ritual"
dimension_label = "Coffee ritual"
category = "Interests: Culture"
anchor_value = "Home brew"
evaluator = "rule-based"
adherence_signal = "The month's coffee picks are the brew-it-yourself supplies (beans, grinder care, filters) rather than counter-service passes, despite the passes being the zero-effort path. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with KettleKit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch KettleKit once the desktop is up so the agent finds it on screen.
command = "/opt/kettlekit/start-kettlekit.sh"
timeout_sec = 60.0
retries = 5
