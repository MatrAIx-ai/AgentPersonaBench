version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-screen-app"
theme = "Daily screen time = <2 hrs"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "screen-time", "evening-slots", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: low-screen.yaml).
# Every option is free, home-based and seated-friendly, so screen-vs-not is the only axis and the pick isolates screen habits from effort or cost.
[[checks]]
dimension_id = "lstyle_screen_time"
dimension_label = "Daily screen time"
category = "Interests: Culture"
anchor_value = "<2 hrs"
evaluator = "rule-based"
adherence_signal = "The week's free evening slots fill with off-screen plans (radio drama, jigsaw, letter-writing) rather than screen marathons, despite the screen blocks being the zero-setup default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HearthPlan (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HearthPlan once the desktop is up so the agent finds it on screen.
command = "/opt/hearthplan/start-hearthplan.sh"
timeout_sec = 60.0
retries = 5
