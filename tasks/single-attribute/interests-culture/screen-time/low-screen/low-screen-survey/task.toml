version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-screen-survey"
theme = "Daily screen time = <2 hrs"

[metadata]
difficulty = "easy"
type = "survey"
domain = "lifestyle"
tags = [ "persona-adherence", "screen-time", "evening-slots", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: low-screen.yaml).
# Every option is free, home-based and seated-friendly, so screen-vs-not is the only axis and the pick isolates screen habits from effort or cost.
[[checks]]
dimension_id = "lstyle_screen_time"
dimension_label = "Daily screen time"
category = "Interests: Culture"
anchor_value = "<2 hrs"
evaluator = "rule-based"
adherence_signal = "The week's free evening slots fill with off-screen plans (radio drama, jigsaw, letter-writing) rather than screen marathons, despite the screen blocks being the zero-setup default. Each option id maps to a `screen` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
