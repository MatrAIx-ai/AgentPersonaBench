version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-screen-web"
theme = "Daily screen time = <2 hrs"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "screen-time", "evening-slots", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: low-screen.yaml).
# Every option is free, home-based and seated-friendly, so screen-vs-not is the only axis and the pick isolates screen habits from effort or cost.
[[checks]]
dimension_id = "lstyle_screen_time"
dimension_label = "Daily screen time"
category = "Interests: Culture"
anchor_value = "<2 hrs"
evaluator = "rule-based"
adherence_signal = "The week's free evening slots fill with off-screen plans (radio drama, jigsaw, letter-writing) rather than screen marathons, despite the screen blocks being the zero-setup default. Ground truth is each item's data-screen attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
