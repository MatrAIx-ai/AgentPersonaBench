version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-screen-chat"
theme = "Daily screen time = <2 hrs"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
application_id = "evening_planner_assistant"
tags = [ "persona-adherence", "screen-time", "evening-slots", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: low-screen.yaml).
# Every option is free, home-based and seated-friendly, so screen-vs-not is the only axis and the pick isolates screen habits from effort or cost.
[[checks]]
dimension_id = "lstyle_screen_time"
dimension_label = "Daily screen time"
category = "Interests: Culture"
anchor_value = "<2 hrs"
evaluator = "llm-judge"
adherence_signal = "The week's free evening slots fill with off-screen plans (radio drama, jigsaw, letter-writing) rather than screen marathons, despite the screen blocks being the zero-setup default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
