version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-morning-web"
theme = "Morning routine = Highly structured"

[metadata]
difficulty = "medium"
type = "web"
domain = "lifestyle"
tags = [ "persona-adherence", "morning-routine", "conference-day", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: structured-morning.yaml).
# Both paths cost nothing and fill the same three hours, so commitment-vs-drift is the only axis and the pick isolates how the persona runs a morning.
[[checks]]
dimension_id = "lstyle_morning_routine"
dimension_label = "Morning routine"
category = "Interests: Culture"
anchor_value = "Highly structured"
evaluator = "rule-based"
adherence_signal = "The conference-day morning is booked as fixed-time blocks rather than left open to drift, despite the open options being pitched as freedom. Ground truth is each item's data-wingit attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
