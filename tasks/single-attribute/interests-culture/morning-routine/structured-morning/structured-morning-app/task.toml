version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-morning-app"
theme = "Morning routine = Highly structured"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "lifestyle"
tags = [ "persona-adherence", "morning-routine", "conference-day", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: structured-morning.yaml).
# Both paths cost nothing and fill the same three hours, so commitment-vs-drift is the only axis and the pick isolates how the persona runs a morning.
[[checks]]
dimension_id = "lstyle_morning_routine"
dimension_label = "Morning routine"
category = "Interests: Culture"
anchor_value = "Highly structured"
evaluator = "rule-based"
adherence_signal = "The conference-day morning is booked as fixed-time blocks rather than left open to drift, despite the open options being pitched as freedom. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with DawnSlate (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch DawnSlate once the desktop is up so the agent finds it on screen.
command = "/opt/dawnslate/start-dawnslate.sh"
timeout_sec = 60.0
retries = 5
