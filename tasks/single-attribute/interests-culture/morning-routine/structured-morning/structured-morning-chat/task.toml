version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-morning-chat"
theme = "Morning routine = Highly structured"

[metadata]
difficulty = "medium"
type = "chat"
domain = "lifestyle"
application_id = "morning_setup_assistant"
tags = [ "persona-adherence", "morning-routine", "conference-day", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: structured-morning.yaml).
# Both paths cost nothing and fill the same three hours, so commitment-vs-drift is the only axis and the pick isolates how the persona runs a morning.
[[checks]]
dimension_id = "lstyle_morning_routine"
dimension_label = "Morning routine"
category = "Interests: Culture"
anchor_value = "Highly structured"
evaluator = "llm-judge"
adherence_signal = "The conference-day morning is booked as fixed-time blocks rather than left open to drift, despite the open options being pitched as freedom. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
