version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-morning-survey"
theme = "Morning routine = Highly structured"

[metadata]
difficulty = "easy"
type = "survey"
domain = "lifestyle"
tags = [ "persona-adherence", "morning-routine", "conference-day", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: structured-morning.yaml).
# Both paths cost nothing and fill the same three hours, so commitment-vs-drift is the only axis and the pick isolates how the persona runs a morning.
[[checks]]
dimension_id = "lstyle_morning_routine"
dimension_label = "Morning routine"
category = "Interests: Culture"
anchor_value = "Highly structured"
evaluator = "rule-based"
adherence_signal = "The conference-day morning is booked as fixed-time blocks rather than left open to drift, despite the open options being pitched as freedom. Each option id maps to a `wingit` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
