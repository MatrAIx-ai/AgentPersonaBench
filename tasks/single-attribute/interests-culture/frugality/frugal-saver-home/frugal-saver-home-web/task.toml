version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frugal-saver-home-web"
theme = "Spending vs saving: Frugal saver"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "frugality", "frugal-saver", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
anchor_value = "Frugal saver"
evaluator = "rule-based"
adherence_signal = "The DOM cart contains only sensibly-priced items (data-splurge false); no luxury/designer-priced variant is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
