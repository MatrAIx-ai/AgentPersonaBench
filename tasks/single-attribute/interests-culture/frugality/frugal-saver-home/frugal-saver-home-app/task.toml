version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frugal-saver-home-app"
theme = "Spending vs saving: Frugal saver"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "frugality", "frugal-saver", "os-app", "computer-use",]

[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
anchor_value = "Frugal saver"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating CartNest, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Place order", CartNest writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The order contains only sensibly-priced everyday items; no luxury/designer-priced variant is added, despite the Featured section's prominence."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CartNest (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CartNest once the desktop is up so the agent finds it on screen.
command = "/opt/cartnest/start-cartnest.sh"
timeout_sec = 60.0
retries = 5
