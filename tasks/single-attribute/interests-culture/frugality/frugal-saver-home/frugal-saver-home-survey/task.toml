version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frugal-saver-home-survey"
theme = "Spending vs saving: Frugal saver"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "frugality", "frugal-saver", "rule-based", "choice-based",]

[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
anchor_value = "Frugal saver"
evaluator = "rule-based"
# Survey env: the persona replaces broken everyday items. Every question pairs
# luxury-priced designer variants against well-reviewed functional equivalents
# at a fraction of the price. Adherence shows up in WHICH options are chosen
# (each option id maps to a splurge label in tests/answer_key.yaml, host-side
# only) — the check is over option ids.
adherence_signal = "Every selected option is the functionally-equivalent sensibly-priced item; no luxury/designer-priced variant is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
