version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/frugal-saver-home-chat"
theme = "Spending vs saving: Frugal saver"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
application_id = "kitchen_store_checkout"
tags = [ "persona-adherence", "frugality", "frugal-saver", "llm-judge",]

# --- Persona-adherence extension --------------------------------------------- #
# The persona is the USER, buying a mid-range blender through a store's checkout
# chat. The assistant keeps upselling: the Chef's Edition at 2.5x the price with
# the same motor, a designer colorway, a gold-tier care plan, an accessory
# bundle. Whether the user's final order stays sensible or absorbs luxury
# upgrades is a semantic question, so an LLM judge reads the USER's turns.
[[checks]]
dimension_id = "lstyle_frugality"
dimension_label = "Spending vs saving"
category = "Interests: Culture"
anchor_value = "Frugal saver"
evaluator = "llm-judge"
adherence_signal = "The user buys the sensible model they came for and declines every luxury upsell (premium edition, designer colorway, gold care plan, accessory bundle), even under discounts and flattery."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
