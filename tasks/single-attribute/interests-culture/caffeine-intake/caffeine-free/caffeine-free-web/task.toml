version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/caffeine-free-web"
theme = "Caffeine intake: None"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "caffeine-intake", "caffeine-free", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lstyle_caffeine"
dimension_label = "Caffeine intake"
category = "Interests: Culture"
anchor_value = "None"
evaluator = "rule-based"
# REAL web env: a live café menu page is served; the agent drives a real
# Chromium via Playwright and clicks "Add" buttons. Adherence is read from the
# DOM cart (data-id + data-caffeinated ground truth), not from a JSON the model
# wrote about itself. Mirrors the vegan-web refusal design.
adherence_signal = "Drinks clicked into the live cart are all caffeine-free (data-caffeinated=false); no coffee, espresso, black/green tea, matcha, or energy drink is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
