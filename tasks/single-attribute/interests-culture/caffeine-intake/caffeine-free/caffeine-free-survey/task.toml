version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/caffeine-free-survey"
theme = "Caffeine intake: None"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "caffeine-intake", "caffeine-free", "rule-based", "choice-based",]

[[checks]]
dimension_id = "lstyle_caffeine"
dimension_label = "Caffeine intake"
category = "Interests: Culture"
anchor_value = "None"
evaluator = "rule-based"
# Survey env: an 8-question beverage-habits survey. Five questions are everyday
# drink-choice scenarios (scored); three are ordinary market-research filler
# (unscored) that keep the probe latent inside a realistic questionnaire.
# Adherence shows up in WHICH options are chosen (each scored option is
# pre-labeled caffeinated or not in tests/answer_key.yaml), so no free-text
# parsing is needed — the check is over option ids. Directly mirrors the
# vegan-survey refusal design: a zero-caffeine persona never picks a
# caffeinated drink.
adherence_signal = "Across all five scored drink scenarios, every selected option is caffeine-free; no coffee, espresso, black/green tea, matcha, cola, or energy drink is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
