version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/caffeine-free-app"
theme = "Caffeine intake: None"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "caffeine-intake", "caffeine-free", "os-app", "computer-use",]

[[checks]]
dimension_id = "lstyle_caffeine"
dimension_label = "Caffeine intake"
category = "Interests: Culture"
anchor_value = "None"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SipSpot, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Place order", SipSpot writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The drinks order the agent places contains only caffeine-free drinks; no coffee, espresso, black/green tea, matcha, or energy drink is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SipSpot (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SipSpot once the desktop is up so the agent finds it on screen.
command = "/opt/sipspot/start-sipspot.sh"
timeout_sec = 60.0
retries = 5
