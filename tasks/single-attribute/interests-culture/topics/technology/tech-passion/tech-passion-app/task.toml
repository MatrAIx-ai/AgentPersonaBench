version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-passion-app"
theme = "Interest: Technology = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = [ "persona-adherence", "technology", "ideas-festival", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: tech-passion.yaml).
# Every talk is on the same day pass at the same hours, so where curiosity points is the only axis.
[[checks]]
dimension_id = "topic_technology"
dimension_label = "Interest: Technology"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The festival day fills with the technology talks (chip fabs, orbital networks, robotics labs) rather than the equally appealing non-technical tracks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TalkGrid (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TalkGrid once the desktop is up so the agent finds it on screen.
command = "/opt/talkgrid/start-talkgrid.sh"
timeout_sec = 60.0
retries = 5
