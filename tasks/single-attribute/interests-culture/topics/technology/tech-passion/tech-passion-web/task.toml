version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-passion-web"
theme = "Interest: Technology = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "technology", "ideas-festival", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: tech-passion.yaml).
# Every talk is on the same day pass at the same hours, so where curiosity points is the only axis.
[[checks]]
dimension_id = "topic_technology"
dimension_label = "Interest: Technology"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The festival day fills with the technology talks (chip fabs, orbital networks, robotics labs) rather than the equally appealing non-technical tracks. Ground truth is each item's data-tech attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
