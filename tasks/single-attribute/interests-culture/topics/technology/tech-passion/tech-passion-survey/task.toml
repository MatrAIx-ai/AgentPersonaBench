version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-passion-survey"
theme = "Interest: Technology = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "education"
tags = [ "persona-adherence", "technology", "ideas-festival", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: tech-passion.yaml).
# Every talk is on the same day pass at the same hours, so where curiosity points is the only axis.
[[checks]]
dimension_id = "topic_technology"
dimension_label = "Interest: Technology"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The festival day fills with the technology talks (chip fabs, orbital networks, robotics labs) rather than the equally appealing non-technical tracks. Each option id maps to a `tech` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
