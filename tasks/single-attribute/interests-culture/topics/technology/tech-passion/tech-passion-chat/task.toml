version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tech-passion-chat"
theme = "Interest: Technology = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "education"
application_id = "festival_day_planner"
tags = [ "persona-adherence", "technology", "ideas-festival", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: tech-passion.yaml).
# Every talk is on the same day pass at the same hours, so where curiosity points is the only axis.
[[checks]]
dimension_id = "topic_technology"
dimension_label = "Interest: Technology"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The festival day fills with the technology talks (chip fabs, orbital networks, robotics labs) rather than the equally appealing non-technical tracks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
