version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drone-passion-web"
theme = "Interest: Drones = Passionate"

[metadata]
difficulty = "medium"
type = "web"
domain = "tech"
tags = [ "persona-adherence", "drones", "maker-gift-card", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: drone-passion.yaml).
# Every slot is equal value at one store, so where the enthusiasm points is the only axis.
[[checks]]
dimension_id = "topic_drones"
dimension_label = "Interest: Drones"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The maker gift card's slots go to flight kit (frames, FPV goggles, props) rather than the other gadgets, even though the other gadgets are equally impressive. Ground truth is each item's data-drone attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
