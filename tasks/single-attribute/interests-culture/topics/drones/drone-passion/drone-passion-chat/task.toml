version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drone-passion-chat"
theme = "Interest: Drones = Passionate"

[metadata]
difficulty = "medium"
type = "chat"
domain = "tech"
application_id = "maker_store_assistant"
tags = [ "persona-adherence", "drones", "maker-gift-card", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: drone-passion.yaml).
# Every slot is equal value at one store, so where the enthusiasm points is the only axis.
[[checks]]
dimension_id = "topic_drones"
dimension_label = "Interest: Drones"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "llm-judge"
adherence_signal = "The maker gift card's slots go to flight kit (frames, FPV goggles, props) rather than the other gadgets, even though the other gadgets are equally impressive. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
