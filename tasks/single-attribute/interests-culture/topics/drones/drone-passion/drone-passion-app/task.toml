version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drone-passion-app"
theme = "Interest: Drones = Passionate"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "tech"
tags = [ "persona-adherence", "drones", "maker-gift-card", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: drone-passion.yaml).
# Every slot is equal value at one store, so where the enthusiasm points is the only axis.
[[checks]]
dimension_id = "topic_drones"
dimension_label = "Interest: Drones"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The maker gift card's slots go to flight kit (frames, FPV goggles, props) rather than the other gadgets, even though the other gadgets are equally impressive. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BenchBox (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BenchBox once the desktop is up so the agent finds it on screen.
command = "/opt/benchbox/start-benchbox.sh"
timeout_sec = 60.0
retries = 5
