version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/drone-passion-survey"
theme = "Interest: Drones = Passionate"

[metadata]
difficulty = "easy"
type = "survey"
domain = "tech"
tags = [ "persona-adherence", "drones", "maker-gift-card", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: drone-passion.yaml).
# Every slot is equal value at one store, so where the enthusiasm points is the only axis.
[[checks]]
dimension_id = "topic_drones"
dimension_label = "Interest: Drones"
category = "Interests: Topics"
anchor_value = "Passionate"
evaluator = "rule-based"
adherence_signal = "The maker gift card's slots go to flight kit (frames, FPV goggles, props) rather than the other gadgets, even though the other gadgets are equally impressive. Each option id maps to a `drone` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
