version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-volunteer-chat"
theme = "Volunteering = Daily"

[metadata]
difficulty = "medium"
type = "chat"
domain = "community"
application_id = "neighborhood_board_assistant"
tags = [ "persona-adherence", "volunteering", "saturday-board", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: daily-volunteer.yaml).
# Every block is free, seated-friendly and the same length, so how the persona spends given time is the only axis.
[[checks]]
dimension_id = "lstyle_volunteering"
dimension_label = "Volunteering"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "The Saturday blocks fill with help-out shifts (front desk, sorting table, reading hour) rather than the leisure blocks, even though the leisure blocks are pitched as well-earned rest. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
