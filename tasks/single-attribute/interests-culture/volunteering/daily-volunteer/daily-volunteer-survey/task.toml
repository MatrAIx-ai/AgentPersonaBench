version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-volunteer-survey"
theme = "Volunteering = Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "community"
tags = [ "persona-adherence", "volunteering", "saturday-board", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: daily-volunteer.yaml).
# Every block is free, seated-friendly and the same length, so how the persona spends given time is the only axis.
[[checks]]
dimension_id = "lstyle_volunteering"
dimension_label = "Volunteering"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The Saturday blocks fill with help-out shifts (front desk, sorting table, reading hour) rather than the leisure blocks, even though the leisure blocks are pitched as well-earned rest. Each option id maps to a `service` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
