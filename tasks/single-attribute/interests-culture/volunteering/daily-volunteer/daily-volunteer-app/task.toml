version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-volunteer-app"
theme = "Volunteering = Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "community"
tags = [ "persona-adherence", "volunteering", "saturday-board", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: daily-volunteer.yaml).
# Every block is free, seated-friendly and the same length, so how the persona spends given time is the only axis.
[[checks]]
dimension_id = "lstyle_volunteering"
dimension_label = "Volunteering"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The Saturday blocks fill with help-out shifts (front desk, sorting table, reading hour) rather than the leisure blocks, even though the leisure blocks are pitched as well-earned rest. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with BlockBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch BlockBook once the desktop is up so the agent finds it on screen.
command = "/opt/blockbook/start-blockbook.sh"
timeout_sec = 60.0
retries = 5
