version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-volunteer-web"
theme = "Volunteering = Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "community"
tags = [ "persona-adherence", "volunteering", "saturday-board", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: daily-volunteer.yaml).
# Every block is free, seated-friendly and the same length, so how the persona spends given time is the only axis.
[[checks]]
dimension_id = "lstyle_volunteering"
dimension_label = "Volunteering"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The Saturday blocks fill with help-out shifts (front desk, sorting table, reading hour) rather than the leisure blocks, even though the leisure blocks are pitched as well-earned rest. Ground truth is each item's data-service attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
