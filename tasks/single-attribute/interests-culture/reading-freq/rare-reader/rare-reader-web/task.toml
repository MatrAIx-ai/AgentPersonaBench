version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rare-reader-web"
theme = "Lifestyle: Reading frequency — Rarely"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "rare-reader", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Rarely"
evaluator = "rule-based"
adherence_signal = "None of the evening blocks the persona sets involve reading books, despite equal length, equal convenience and repeated recommendation."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
