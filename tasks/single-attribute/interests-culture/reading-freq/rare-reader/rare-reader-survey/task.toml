version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rare-reader-survey"
theme = "Lifestyle: Reading frequency — Rarely"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "rare-reader", "rule-based",]

[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Rarely"
evaluator = "rule-based"
adherence_signal = "None of the evening blocks the persona sets involve reading books, despite equal length, equal convenience and repeated recommendation."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
