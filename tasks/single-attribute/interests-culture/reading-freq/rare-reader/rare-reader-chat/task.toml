version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/rare-reader-chat"
theme = "Lifestyle: Reading frequency — Rarely"

[metadata]
difficulty = "easy"
type = "chat"
domain = "media"
tags = [ "persona-adherence", "rare-reader", "llm-judge",]

[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Rarely"
evaluator = "llm-judge"
adherence_signal = "None of the evening blocks the persona sets involve reading books, despite equal length, equal convenience and repeated recommendation."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
