version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-reader-app"
theme = "Reading frequency = Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "reading-freq", "bedside-month", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: daily-reader.yaml).
# Every option is free in the month box and lives on the same nightstand, so what the persona reaches for at day's end is the only axis.
[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The bedside month box fills with reading stock rather than the audio-visual comforts, even though the comforts ask nothing of tired eyes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ShelfSide (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ShelfSide once the desktop is up so the agent finds it on screen.
command = "/opt/shelfside/start-shelfside.sh"
timeout_sec = 60.0
retries = 5
