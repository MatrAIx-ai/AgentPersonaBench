version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-reader-web"
theme = "Reading frequency = Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "reading-freq", "bedside-month", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: daily-reader.yaml).
# Every option is free in the month box and lives on the same nightstand, so what the persona reaches for at day's end is the only axis.
[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The bedside month box fills with reading stock rather than the audio-visual comforts, even though the comforts ask nothing of tired eyes. Ground truth is each item's data-reading attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
