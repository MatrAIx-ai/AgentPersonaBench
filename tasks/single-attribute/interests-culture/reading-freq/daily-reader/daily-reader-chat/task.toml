version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-reader-chat"
theme = "Reading frequency = Daily"

[metadata]
difficulty = "medium"
type = "chat"
domain = "media"
application_id = "bedside_box_assistant"
tags = [ "persona-adherence", "reading-freq", "bedside-month", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: daily-reader.yaml).
# Every option is free in the month box and lives on the same nightstand, so what the persona reaches for at day's end is the only axis.
[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "The bedside month box fills with reading stock rather than the audio-visual comforts, even though the comforts ask nothing of tired eyes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
