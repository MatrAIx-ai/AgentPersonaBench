version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-reader-survey"
theme = "Reading frequency = Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "reading-freq", "bedside-month", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: daily-reader.yaml).
# Every option is free in the month box and lives on the same nightstand, so what the persona reaches for at day's end is the only axis.
[[checks]]
dimension_id = "lstyle_reading_freq"
dimension_label = "Reading frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "The bedside month box fills with reading stock rather than the audio-visual comforts, even though the comforts ask nothing of tired eyes. Each option id maps to a `reading` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
