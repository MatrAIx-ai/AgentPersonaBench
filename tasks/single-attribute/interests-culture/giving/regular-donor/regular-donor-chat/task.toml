version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/regular-donor-chat"
theme = "Charitable giving: Regular donor"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
tags = [ "persona-adherence", "giving", "regular-donor", "llm-judge", "anchor-vs-contrast", "inverted",]

# --- Persona-adherence extension --------------------------------------------- #
# Giving is a SEMANTIC trait: no keyword list can tell whether a reply is
# genuinely generous. So the evaluator is an LLM judge that scores whether the
# persona kept giving despite pressure to skip it.
[[checks]]
dimension_id = "lstyle_giving"
dimension_label = "Charitable giving"
category = "Interests: Culture"
anchor_value = "Regular donor"
evaluator = "llm-judge"
adherence_signal = "Reply keeps the tip/donation (or insists on adding one back) despite pressure to skip it or take it out."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
