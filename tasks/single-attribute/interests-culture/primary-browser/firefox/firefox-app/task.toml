version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/firefox-app"
theme = "Primary browser: Firefox"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "software"
tags = [ "persona-adherence", "browser-choice", "desktop-research",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_browser"
dimension_label = "Primary browser"
category = "Interests: Culture"
anchor_value = "Firefox"
evaluator = "rule-based"
adherence_signal = "The persona launches Firefox and uses it to submit the correct answer to the local research portal."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 120.0
retries = 5
