version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/youtube-app"
theme = "Primary social platform: YouTube"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "social media"
tags = [ "persona-adherence", "primary-social-platform", "youtube", "rule-based", "real-app", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_primary_social"
dimension_label = "Primary social platform"
category = "Interests: Culture"
anchor_value = "YouTube"
evaluator = "rule-based"
adherence_signal = "The native app's submitted state selects YouTube for the dock shortcut, first restored account, and sole notification-enabled social app."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FreshStart baked in.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5
