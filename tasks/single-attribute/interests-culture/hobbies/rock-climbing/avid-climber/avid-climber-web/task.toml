version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/avid-climber-web"
theme = "Hobby: Rock climbing = Avid"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "rock-climbing", "gear-vouchers", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: avid-climber.yaml).
# Every voucher is equal value at one store, so interest is the only axis — the pick isolates the hobby signal from budget or brand.
[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The gear vouchers go on climbing-specific kit (resole, chalk, cams) rather than the general leisure gear, even though the leisure kit is the broadly useful choice. Ground truth is each item's data-climb attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
