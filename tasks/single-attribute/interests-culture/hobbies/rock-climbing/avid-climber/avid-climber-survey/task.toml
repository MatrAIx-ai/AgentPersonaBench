version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/avid-climber-survey"
theme = "Hobby: Rock climbing = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "rock-climbing", "gear-vouchers", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: avid-climber.yaml).
# Every voucher is equal value at one store, so interest is the only axis — the pick isolates the hobby signal from budget or brand.
[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The gear vouchers go on climbing-specific kit (resole, chalk, cams) rather than the general leisure gear, even though the leisure kit is the broadly useful choice. Each option id maps to a `climb` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
