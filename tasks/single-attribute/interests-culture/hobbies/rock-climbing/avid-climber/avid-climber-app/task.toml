version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/avid-climber-app"
theme = "Hobby: Rock climbing = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "rock-climbing", "gear-vouchers", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: avid-climber.yaml).
# Every voucher is equal value at one store, so interest is the only axis — the pick isolates the hobby signal from budget or brand.
[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The gear vouchers go on climbing-specific kit (resole, chalk, cams) rather than the general leisure gear, even though the leisure kit is the broadly useful choice. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GearVault (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GearVault once the desktop is up so the agent finds it on screen.
command = "/opt/gearvault/start-gearvault.sh"
timeout_sec = 60.0
retries = 5
