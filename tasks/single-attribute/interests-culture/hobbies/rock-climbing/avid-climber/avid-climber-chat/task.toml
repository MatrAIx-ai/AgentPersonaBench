version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/avid-climber-chat"
theme = "Hobby: Rock climbing = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "gear_store_assistant"
tags = [ "persona-adherence", "rock-climbing", "gear-vouchers", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: avid-climber.yaml).
# Every voucher is equal value at one store, so interest is the only axis — the pick isolates the hobby signal from budget or brand.
[[checks]]
dimension_id = "hob_rock_climbing"
dimension_label = "Hobby: Rock climbing"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "llm-judge"
adherence_signal = "The gear vouchers go on climbing-specific kit (resole, chalk, cams) rather than the general leisure gear, even though the leisure kit is the broadly useful choice. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
