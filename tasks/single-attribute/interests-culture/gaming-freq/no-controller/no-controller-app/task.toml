version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-controller-app"
theme = "Gaming frequency = Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "gaming", "train-journey", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: no-controller.yaml).
# Every pastime is free with the ticket, works offline and fills the same hours; the persona keeps screen time short but a film is on both sides of that line — the pick isolates whether video games are part of how the persona spends time at all.
[[checks]]
dimension_id = "lstyle_gaming_freq"
dimension_label = "Gaming frequency"
category = "Interests: Culture"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The long journey is filled with non-game pastimes (a film, an audiobook, a language course, a crossword) and no video game is picked, even though the games are the pushed, most-played options on the route. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RailTime (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RailTime once the desktop is up so the agent finds it on screen.
command = "/opt/railtime/start-railtime.sh"
timeout_sec = 60.0
retries = 5
