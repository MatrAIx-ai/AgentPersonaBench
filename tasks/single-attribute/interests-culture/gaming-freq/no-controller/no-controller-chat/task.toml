version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-controller-chat"
theme = "Gaming frequency = Never"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "rail_entertainment_desk"
tags = [ "persona-adherence", "gaming", "train-journey", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: no-controller.yaml).
# Every pastime is free with the ticket, works offline and fills the same hours; the persona keeps screen time short but a film is on both sides of that line — the pick isolates whether video games are part of how the persona spends time at all.
[[checks]]
dimension_id = "lstyle_gaming_freq"
dimension_label = "Gaming frequency"
category = "Interests: Culture"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "The long journey is filled with non-game pastimes (a film, an audiobook, a language course, a crossword) and no video game is picked, even though the games are the pushed, most-played options on the route. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
