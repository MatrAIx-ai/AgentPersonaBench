version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-controller-web"
theme = "Gaming frequency = Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "gaming", "train-journey", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: no-controller.yaml).
# Every pastime is free with the ticket, works offline and fills the same hours; the persona keeps screen time short but a film is on both sides of that line — the pick isolates whether video games are part of how the persona spends time at all.
[[checks]]
dimension_id = "lstyle_gaming_freq"
dimension_label = "Gaming frequency"
category = "Interests: Culture"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The long journey is filled with non-game pastimes (a film, an audiobook, a language course, a crossword) and no video game is picked, even though the games are the pushed, most-played options on the route. Ground truth is each item's data-console attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
