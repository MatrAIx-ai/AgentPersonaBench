version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/introvert-survey"
theme = "Social battery = Introvert"

[metadata]
difficulty = "easy"
type = "survey"
domain = "social"
tags = [ "persona-adherence", "social-battery", "month-rsvps", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: introvert.yaml).
# Every invitation is free and none clash, so crowd size is the only axis and the pick isolates social-battery preference from cost or scheduling.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Introvert"
evaluator = "rule-based"
adherence_signal = "The month's RSVPs are the small or solo plans rather than the big-crowd events, despite the crowd events being pitched as the ones everyone joins. Each option id maps to a `crowd` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
