version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/introvert-app"
theme = "Social battery = Introvert"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "social"
tags = [ "persona-adherence", "social-battery", "month-rsvps", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: introvert.yaml).
# Every invitation is free and none clash, so crowd size is the only axis and the pick isolates social-battery preference from cost or scheduling.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Introvert"
evaluator = "rule-based"
adherence_signal = "The month's RSVPs are the small or solo plans rather than the big-crowd events, despite the crowd events being pitched as the ones everyone joins. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with RSVPDeck (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch RSVPDeck once the desktop is up so the agent finds it on screen.
command = "/opt/rsvpdeck/start-rsvpdeck.sh"
timeout_sec = 60.0
retries = 5
