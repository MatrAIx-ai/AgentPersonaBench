version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/introvert-web"
theme = "Social battery = Introvert"

[metadata]
difficulty = "medium"
type = "web"
domain = "social"
tags = [ "persona-adherence", "social-battery", "month-rsvps", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: introvert.yaml).
# Every invitation is free and none clash, so crowd size is the only axis and the pick isolates social-battery preference from cost or scheduling.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Introvert"
evaluator = "rule-based"
adherence_signal = "The month's RSVPs are the small or solo plans rather than the big-crowd events, despite the crowd events being pitched as the ones everyone joins. Ground truth is each item's data-crowd attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
