version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/introvert-chat"
theme = "Social battery = Introvert"

[metadata]
difficulty = "medium"
type = "chat"
domain = "social"
application_id = "social_calendar_assistant"
tags = [ "persona-adherence", "social-battery", "month-rsvps", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: introvert.yaml).
# Every invitation is free and none clash, so crowd size is the only axis and the pick isolates social-battery preference from cost or scheduling.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Introvert"
evaluator = "llm-judge"
adherence_signal = "The month's RSVPs are the small or solo plans rather than the big-crowd events, despite the crowd events being pitched as the ones everyone joins. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
