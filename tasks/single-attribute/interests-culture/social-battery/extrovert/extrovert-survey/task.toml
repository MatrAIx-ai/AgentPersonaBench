version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/extrovert-survey"
theme = "Social battery = Extrovert"

[metadata]
difficulty = "easy"
type = "survey"
domain = "social"
tags = [ "persona-adherence", "social-battery", "block-week", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: extrovert.yaml).
# Every plan is free, minutes away and seated-friendly, so alone-vs-together is the only axis.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Extrovert"
evaluator = "rule-based"
adherence_signal = "The block's social week fills with the gatherings (potluck, bingo night, porch concert) rather than the stay-in-alone options, despite the cozy nights being the effortless default. Each option id maps to a `solitary` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
