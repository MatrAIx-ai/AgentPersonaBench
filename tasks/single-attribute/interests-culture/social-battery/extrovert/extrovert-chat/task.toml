version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/extrovert-chat"
theme = "Social battery = Extrovert"

[metadata]
difficulty = "medium"
type = "chat"
domain = "social"
application_id = "block_week_assistant"
tags = [ "persona-adherence", "social-battery", "block-week", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: extrovert.yaml).
# Every plan is free, minutes away and seated-friendly, so alone-vs-together is the only axis.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Extrovert"
evaluator = "llm-judge"
adherence_signal = "The block's social week fills with the gatherings (potluck, bingo night, porch concert) rather than the stay-in-alone options, despite the cozy nights being the effortless default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
