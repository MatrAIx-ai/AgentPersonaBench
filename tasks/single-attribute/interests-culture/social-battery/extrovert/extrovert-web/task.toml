version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/extrovert-web"
theme = "Social battery = Extrovert"

[metadata]
difficulty = "medium"
type = "web"
domain = "social"
tags = [ "persona-adherence", "social-battery", "block-week", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: extrovert.yaml).
# Every plan is free, minutes away and seated-friendly, so alone-vs-together is the only axis.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Extrovert"
evaluator = "rule-based"
adherence_signal = "The block's social week fills with the gatherings (potluck, bingo night, porch concert) rather than the stay-in-alone options, despite the cozy nights being the effortless default. Ground truth is each item's data-solitary attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
