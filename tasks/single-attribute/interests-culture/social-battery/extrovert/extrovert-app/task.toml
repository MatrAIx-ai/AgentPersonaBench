version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/extrovert-app"
theme = "Social battery = Extrovert"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "social"
tags = [ "persona-adherence", "social-battery", "block-week", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: extrovert.yaml).
# Every plan is free, minutes away and seated-friendly, so alone-vs-together is the only axis.
[[checks]]
dimension_id = "lstyle_social_battery"
dimension_label = "Social battery"
category = "Interests: Culture"
anchor_value = "Extrovert"
evaluator = "rule-based"
adherence_signal = "The block's social week fills with the gatherings (potluck, bingo night, porch concert) rather than the stay-in-alone options, despite the cozy nights being the effortless default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with MingleWeek (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch MingleWeek once the desktop is up so the agent finds it on screen.
command = "/opt/mingleweek/start-mingleweek.sh"
timeout_sec = 60.0
retries = 5
