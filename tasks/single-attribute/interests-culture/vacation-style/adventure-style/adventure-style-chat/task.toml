version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/adventure-style-chat"
theme = "Vacation style = Adventure"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "shore_day_concierge"
tags = [ "persona-adherence", "vacation-style", "shore-day", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: adventure-style.yaml).
# Every session is included in the shore pass with the same duration, so comfort-vs-effort is the only axis and the pick isolates vacation style from cost.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
anchor_value = "Adventure"
evaluator = "llm-judge"
adherence_signal = "The shore-day picks are the active exploration sessions (sea-cave paddle, ridge trek, drift snorkel) rather than the pampered lounge program, despite the lounge picks being the effortless comfort path. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
