version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/adventure-style-survey"
theme = "Vacation style = Adventure"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "vacation-style", "shore-day", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: adventure-style.yaml).
# Every session is included in the shore pass with the same duration, so comfort-vs-effort is the only axis and the pick isolates vacation style from cost.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
anchor_value = "Adventure"
evaluator = "rule-based"
adherence_signal = "The shore-day picks are the active exploration sessions (sea-cave paddle, ridge trek, drift snorkel) rather than the pampered lounge program, despite the lounge picks being the effortless comfort path. Each option id maps to a `lounge` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
