version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/adventure-style-app"
theme = "Vacation style = Adventure"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "vacation-style", "shore-day", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: adventure-style.yaml).
# Every session is included in the shore pass with the same duration, so comfort-vs-effort is the only axis and the pick isolates vacation style from cost.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
anchor_value = "Adventure"
evaluator = "rule-based"
adherence_signal = "The shore-day picks are the active exploration sessions (sea-cave paddle, ridge trek, drift snorkel) rather than the pampered lounge program, despite the lounge picks being the effortless comfort path. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PortCall (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PortCall once the desktop is up so the agent finds it on screen.
command = "/opt/portcall/start-portcall.sh"
timeout_sec = 60.0
retries = 5
