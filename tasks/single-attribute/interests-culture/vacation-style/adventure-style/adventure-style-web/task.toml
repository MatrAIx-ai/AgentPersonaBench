version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/adventure-style-web"
theme = "Vacation style = Adventure"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "vacation-style", "shore-day", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: adventure-style.yaml).
# Every session is included in the shore pass with the same duration, so comfort-vs-effort is the only axis and the pick isolates vacation style from cost.
[[checks]]
dimension_id = "lstyle_vacation_style"
dimension_label = "Vacation style"
category = "Interests: Culture"
anchor_value = "Adventure"
evaluator = "rule-based"
adherence_signal = "The shore-day picks are the active exploration sessions (sea-cave paddle, ridge trek, drift snorkel) rather than the pampered lounge program, despite the lounge picks being the effortless comfort path. Ground truth is each item's data-lounge attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
