version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/news-avoider-app"
theme = "News consumption: Avoids news"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "media"
tags = [ "persona-adherence", "news-avoider", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "lstyle_news_freq"
dimension_label = "News consumption"
category = "Interests: Culture"
anchor_value = "Avoids news"
evaluator = "rule-based"
adherence_signal = "No news, headlines, politics, or current-affairs show is selected for any listening slot; every subscription is a news-free show."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the PodShelf Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PodShelf once the desktop is up so the agent finds it on screen.
command = "/opt/newsavoider/start-app.sh"
timeout_sec = 60.0
retries = 5
