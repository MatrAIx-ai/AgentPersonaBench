version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/news-avoider-web"
theme = "News consumption: Avoids news"

[metadata]
difficulty = "medium"
type = "web"
domain = "media"
tags = [ "persona-adherence", "news-avoider", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "lstyle_news_freq"
dimension_label = "News consumption"
category = "Interests: Culture"
anchor_value = "Avoids news"
evaluator = "rule-based"
adherence_signal = "No news, headlines, politics, or current-affairs show is selected for any listening slot; every subscription is a news-free show."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
