version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/news-avoider-survey"
theme = "News consumption: Avoids news"

[metadata]
difficulty = "easy"
type = "survey"
domain = "media"
tags = [ "persona-adherence", "news-avoider", "rule-based",]

[[checks]]
dimension_id = "lstyle_news_freq"
dimension_label = "News consumption"
category = "Interests: Culture"
anchor_value = "Avoids news"
evaluator = "rule-based"
adherence_signal = "No news, headlines, politics, or current-affairs show is selected for any listening slot; every subscription is a news-free show."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
