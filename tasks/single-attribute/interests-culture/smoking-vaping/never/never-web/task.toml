version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/never-web"
theme = "Smoking / vaping: Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "smoking-vaping", "never-smoker", "web", "rule-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_smoking"
dimension_label = "Smoking / vaping"
category = "Interests: Culture"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The three items added to the attendee pack contain no cigarettes, cigars, tobacco, or vaping products."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
