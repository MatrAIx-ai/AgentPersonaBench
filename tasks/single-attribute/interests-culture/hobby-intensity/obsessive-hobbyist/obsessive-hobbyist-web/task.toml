version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/obsessive-hobbyist-web"
theme = "Hobby intensity = Obsessive"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "hobby-intensity", "society-renewal", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: obsessive-hobbyist.yaml).
# Every tier costs the same fee, so depth of involvement is the only axis.
[[checks]]
dimension_id = "lstyle_hobby_intensity"
dimension_label = "Hobby intensity"
category = "Interests: Culture"
anchor_value = "Obsessive"
evaluator = "rule-based"
adherence_signal = "The society renewal picks the deep-involvement tracks (archive shifts, journal contributions, exhibition team) rather than the casual tiers, despite the casual tiers being the no-pressure default. Ground truth is each item's data-dabble attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
