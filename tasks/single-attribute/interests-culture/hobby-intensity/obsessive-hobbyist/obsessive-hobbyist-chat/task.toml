version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/obsessive-hobbyist-chat"
theme = "Hobby intensity = Obsessive"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "society_renewal_assistant"
tags = [ "persona-adherence", "hobby-intensity", "society-renewal", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: obsessive-hobbyist.yaml).
# Every tier costs the same fee, so depth of involvement is the only axis.
[[checks]]
dimension_id = "lstyle_hobby_intensity"
dimension_label = "Hobby intensity"
category = "Interests: Culture"
anchor_value = "Obsessive"
evaluator = "llm-judge"
adherence_signal = "The society renewal picks the deep-involvement tracks (archive shifts, journal contributions, exhibition team) rather than the casual tiers, despite the casual tiers being the no-pressure default. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
