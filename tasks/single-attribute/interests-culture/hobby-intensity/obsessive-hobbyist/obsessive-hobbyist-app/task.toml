version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/obsessive-hobbyist-app"
theme = "Hobby intensity = Obsessive"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "hobby-intensity", "society-renewal", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: obsessive-hobbyist.yaml).
# Every tier costs the same fee, so depth of involvement is the only axis.
[[checks]]
dimension_id = "lstyle_hobby_intensity"
dimension_label = "Hobby intensity"
category = "Interests: Culture"
anchor_value = "Obsessive"
evaluator = "rule-based"
adherence_signal = "The society renewal picks the deep-involvement tracks (archive shifts, journal contributions, exhibition team) rather than the casual tiers, despite the casual tiers being the no-pressure default. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GuildDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GuildDesk once the desktop is up so the agent finds it on screen.
command = "/opt/guilddesk/start-guilddesk.sh"
timeout_sec = 60.0
retries = 5
