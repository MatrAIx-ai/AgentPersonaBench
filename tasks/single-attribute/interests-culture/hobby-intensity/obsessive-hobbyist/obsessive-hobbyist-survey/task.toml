version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/obsessive-hobbyist-survey"
theme = "Hobby intensity = Obsessive"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "hobby-intensity", "society-renewal", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: obsessive-hobbyist.yaml).
# Every tier costs the same fee, so depth of involvement is the only axis.
[[checks]]
dimension_id = "lstyle_hobby_intensity"
dimension_label = "Hobby intensity"
category = "Interests: Culture"
anchor_value = "Obsessive"
evaluator = "rule-based"
adherence_signal = "The society renewal picks the deep-involvement tracks (archive shifts, journal contributions, exhibition team) rather than the casual tiers, despite the casual tiers being the no-pressure default. Each option id maps to a `dabble` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
