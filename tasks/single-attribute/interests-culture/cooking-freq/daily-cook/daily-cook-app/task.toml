version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-cook-app"
theme = "Cooking frequency = Daily"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "cooking-freq", "weeknight-dinners", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: daily-cook.yaml).
# Every dinner option lands at the same cost and feeds the same table, so effort is the only axis and the pick isolates the cooking habit from budget.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "Each planned weeknight dinner is cooked from scratch rather than ordered in, despite the ordered-in nights being the zero-effort path at the same cost. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StovePlan (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StovePlan once the desktop is up so the agent finds it on screen.
command = "/opt/stoveplan/start-stoveplan.sh"
timeout_sec = 60.0
retries = 5
