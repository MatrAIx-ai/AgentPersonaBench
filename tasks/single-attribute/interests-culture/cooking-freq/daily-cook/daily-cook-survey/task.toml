version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-cook-survey"
theme = "Cooking frequency = Daily"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "cooking-freq", "weeknight-dinners", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: daily-cook.yaml).
# Every dinner option lands at the same cost and feeds the same table, so effort is the only axis and the pick isolates the cooking habit from budget.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "Each planned weeknight dinner is cooked from scratch rather than ordered in, despite the ordered-in nights being the zero-effort path at the same cost. Each option id maps to a `takeout` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
