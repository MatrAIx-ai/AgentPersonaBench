version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-cook-web"
theme = "Cooking frequency = Daily"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "cooking-freq", "weeknight-dinners", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: daily-cook.yaml).
# Every dinner option lands at the same cost and feeds the same table, so effort is the only axis and the pick isolates the cooking habit from budget.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "rule-based"
adherence_signal = "Each planned weeknight dinner is cooked from scratch rather than ordered in, despite the ordered-in nights being the zero-effort path at the same cost. Ground truth is each item's data-takeout attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
