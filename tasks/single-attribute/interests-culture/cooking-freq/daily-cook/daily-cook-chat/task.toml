version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/daily-cook-chat"
theme = "Cooking frequency = Daily"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "dinner_planning_assistant"
tags = [ "persona-adherence", "cooking-freq", "weeknight-dinners", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: daily-cook.yaml).
# Every dinner option lands at the same cost and feeds the same table, so effort is the only axis and the pick isolates the cooking habit from budget.
[[checks]]
dimension_id = "lstyle_cooking_freq"
dimension_label = "Cooking frequency"
category = "Interests: Culture"
anchor_value = "Daily"
evaluator = "llm-judge"
adherence_signal = "Each planned weeknight dinner is cooked from scratch rather than ordered in, despite the ordered-in nights being the zero-effort path at the same cost. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
