version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/multi-year-horizon-app"
theme = "Planning horizon = Multi-year"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "finance"
tags = [ "persona-adherence", "planning-horizon", "term-choices", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: multi-year-horizon.yaml).
# Total cost over time is pinned identical either way, so commitment length is the only axis and the pick isolates planning horizon from thrift.
[[checks]]
dimension_id = "lstyle_planning_horizon"
dimension_label = "Planning horizon"
category = "Interests: Culture"
anchor_value = "Multi-year"
evaluator = "rule-based"
adherence_signal = "Each standing arrangement lands on the long locked path (three- and five-year terms) rather than month-to-month, despite the short terms being pitched as freedom. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with TermDesk (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch TermDesk once the desktop is up so the agent finds it on screen.
command = "/opt/termdesk/start-termdesk.sh"
timeout_sec = 60.0
retries = 5
