version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/multi-year-horizon-chat"
theme = "Planning horizon = Multi-year"

[metadata]
difficulty = "medium"
type = "chat"
domain = "finance"
application_id = "terms_advisor_assistant"
tags = [ "persona-adherence", "planning-horizon", "term-choices", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: multi-year-horizon.yaml).
# Total cost over time is pinned identical either way, so commitment length is the only axis and the pick isolates planning horizon from thrift.
[[checks]]
dimension_id = "lstyle_planning_horizon"
dimension_label = "Planning horizon"
category = "Interests: Culture"
anchor_value = "Multi-year"
evaluator = "llm-judge"
adherence_signal = "Each standing arrangement lands on the long locked path (three- and five-year terms) rather than month-to-month, despite the short terms being pitched as freedom. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
