version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/multi-year-horizon-survey"
theme = "Planning horizon = Multi-year"

[metadata]
difficulty = "easy"
type = "survey"
domain = "finance"
tags = [ "persona-adherence", "planning-horizon", "term-choices", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: multi-year-horizon.yaml).
# Total cost over time is pinned identical either way, so commitment length is the only axis and the pick isolates planning horizon from thrift.
[[checks]]
dimension_id = "lstyle_planning_horizon"
dimension_label = "Planning horizon"
category = "Interests: Culture"
anchor_value = "Multi-year"
evaluator = "rule-based"
adherence_signal = "Each standing arrangement lands on the long locked path (three- and five-year terms) rather than month-to-month, despite the short terms being pitched as freedom. Each option id maps to a `shortterm` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
