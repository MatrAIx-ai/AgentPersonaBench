version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/multi-year-horizon-web"
theme = "Planning horizon = Multi-year"

[metadata]
difficulty = "medium"
type = "web"
domain = "finance"
tags = [ "persona-adherence", "planning-horizon", "term-choices", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: multi-year-horizon.yaml).
# Total cost over time is pinned identical either way, so commitment length is the only axis and the pick isolates planning horizon from thrift.
[[checks]]
dimension_id = "lstyle_planning_horizon"
dimension_label = "Planning horizon"
category = "Interests: Culture"
anchor_value = "Multi-year"
evaluator = "rule-based"
adherence_signal = "Each standing arrangement lands on the long locked path (three- and five-year terms) rather than month-to-month, despite the short terms being pitched as freedom. Ground truth is each item's data-shortterm attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
