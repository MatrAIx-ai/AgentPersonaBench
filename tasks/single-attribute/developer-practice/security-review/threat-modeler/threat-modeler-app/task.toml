version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/threat-modeler-app"
theme = "Code security review habit = Always reviews threat model"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "security-review", "launch-checklist", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: threat-modeler.yaml).
# The launch date holds on either path, so diligence-vs-waiver is the only axis.
[[checks]]
dimension_id = "code_security_review_habit"
dimension_label = "Code security review habit"
category = "Developer: Code Maintenance"
anchor_value = "Always reviews threat model"
evaluator = "rule-based"
adherence_signal = "The upload feature's launch checklist carries the threat-model session and abuse-case pass rather than the waivers, despite the waivers being pitched as schedule-savers. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GateList (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GateList once the desktop is up so the agent finds it on screen.
command = "/opt/gatelist/start-gatelist.sh"
timeout_sec = 60.0
retries = 5
