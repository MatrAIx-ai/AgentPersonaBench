version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/threat-modeler-chat"
theme = "Code security review habit = Always reviews threat model"

[metadata]
difficulty = "medium"
type = "chat"
domain = "work"
application_id = "delivery_lead_bot"
tags = [ "persona-adherence", "security-review", "launch-checklist", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: threat-modeler.yaml).
# The launch date holds on either path, so diligence-vs-waiver is the only axis.
[[checks]]
dimension_id = "code_security_review_habit"
dimension_label = "Code security review habit"
category = "Developer: Code Maintenance"
anchor_value = "Always reviews threat model"
evaluator = "llm-judge"
adherence_signal = "The upload feature's launch checklist carries the threat-model session and abuse-case pass rather than the waivers, despite the waivers being pitched as schedule-savers. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
