version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/regression-tester-chat"
theme = "Bug fix test behavior = Always adds regression tests"

[metadata]
difficulty = "medium"
type = "chat"
domain = "work"
application_id = "release_manager_bot"
tags = [ "persona-adherence", "bug-fix-tests", "release-week", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: regression-tester.yaml).
# The release window fits either path (the tested plan still lands by Friday), so discipline-vs-shortcut is the only axis.
[[checks]]
dimension_id = "bug_fix_test_behavior"
dimension_label = "Bug fix test behavior"
category = "Developer: Code Maintenance"
anchor_value = "Always adds regression tests"
evaluator = "llm-judge"
adherence_signal = "The bugfix plan anchors on a failing repro and a committed regression test rather than shipping the fix bare, despite the bare path being pitched as making the release window. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
