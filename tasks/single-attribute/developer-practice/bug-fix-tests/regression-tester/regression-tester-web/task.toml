version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/regression-tester-web"
theme = "Bug fix test behavior = Always adds regression tests"

[metadata]
difficulty = "medium"
type = "web"
domain = "work"
tags = [ "persona-adherence", "bug-fix-tests", "release-week", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: regression-tester.yaml).
# The release window fits either path (the tested plan still lands by Friday), so discipline-vs-shortcut is the only axis.
[[checks]]
dimension_id = "bug_fix_test_behavior"
dimension_label = "Bug fix test behavior"
category = "Developer: Code Maintenance"
anchor_value = "Always adds regression tests"
evaluator = "rule-based"
adherence_signal = "The bugfix plan anchors on a failing repro and a committed regression test rather than shipping the fix bare, despite the bare path being pitched as making the release window. Ground truth is each item's data-untested attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
