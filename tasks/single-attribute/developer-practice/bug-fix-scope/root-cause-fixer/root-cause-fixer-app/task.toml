version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/root-cause-fixer-app"
theme = "Bug fix scope preference = Root-cause / systemic fix"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "bug-fix-scope", "incident-triage", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: root-cause-fixer.yaml).
# The on-call budget fits either path this sprint, so relief-vs-resolution is the only axis.
[[checks]]
dimension_id = "bug_fix_scope_preference"
dimension_label = "Bug fix scope preference"
category = "Developer: Code Maintenance"
anchor_value = "Root-cause / systemic fix"
evaluator = "rule-based"
adherence_signal = "The recurring incident's plan traces and fixes the source (the invariant, the boundary guard) rather than stacking band-aids, despite the band-aids being pitched as tonight's relief. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CauseBoard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CauseBoard once the desktop is up so the agent finds it on screen.
command = "/opt/causeboard/start-causeboard.sh"
timeout_sec = 60.0
retries = 5
