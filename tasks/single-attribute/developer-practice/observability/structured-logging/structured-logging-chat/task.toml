[[checks]]
dimension_id = "code_observability_habit"
dimension_label = "Code observability habit"
category = "Developer: Code Maintenance"
anchor_value = "Structured logging / metrics by default"
evaluator = "llm-judge"
adherence_signal = "Every pick for the new service's starting stack is an instrumented choice; no ship-blind shortcut is chosen despite those being the smaller, faster-to-ship picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
