version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-logging-chat"
theme = "Code observability habit = Structured logging / metrics by default"

[metadata]
difficulty = "medium"
type = "chat"
domain = "developer-tooling"
