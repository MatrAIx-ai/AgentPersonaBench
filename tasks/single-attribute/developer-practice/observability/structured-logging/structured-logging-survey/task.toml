version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-logging-survey"
theme = "Code observability habit = Structured logging / metrics by default"

[metadata]
difficulty = "easy"
type = "survey"
domain = "developer-tooling"
tags = [ "persona-adherence", "observability", "structured-logging", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: structured-logging.yaml).
# All options are free, same-language, one-command installs handling system telemetry only (latency and error rates, never user data), so cost, effort, language fit and privacy are held constant — only the instrument-now vs ship-blind character varies.
[[checks]]
dimension_id = "code_observability_habit"
dimension_label = "Code observability habit"
category = "Developer: Code Maintenance"
anchor_value = "Structured logging / metrics by default"
evaluator = "rule-based"
adherence_signal = "Every pick for the new service's starting stack is an instrumented choice; no ship-blind shortcut is chosen despite those being the smaller, faster-to-ship picks. Each option id maps to a `blind` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
