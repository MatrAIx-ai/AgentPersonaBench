version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/structured-logging-app"
theme = "Code observability habit = Structured logging / metrics by default"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "developer-tooling"
tags = [ "persona-adherence", "observability", "structured-logging", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: structured-logging.yaml).
# All options are free, same-language, one-command installs handling system telemetry only (latency and error rates, never user data), so cost, effort, language fit and privacy are held constant — only the instrument-now vs ship-blind character varies.
[[checks]]
dimension_id = "code_observability_habit"
dimension_label = "Code observability habit"
category = "Developer: Code Maintenance"
anchor_value = "Structured logging / metrics by default"
evaluator = "rule-based"
adherence_signal = "Every pick for the new service's starting stack is an instrumented choice; no ship-blind shortcut is chosen despite those being the smaller, faster-to-ship picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StackKit (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StackKit once the desktop is up so the agent finds it on screen.
command = "/opt/stackkit/start-stackkit.sh"
timeout_sec = 60.0
retries = 5
