version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thank-you-first-web"
theme = "Character: Gratitude = Signature"

[metadata]
difficulty = "medium"
type = "web"
domain = "travel"
tags = [ "persona-adherence", "gratitude", "guest-portal", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: thank-you-first.yaml).
# Every action is free and takes a minute; none of the thanks involves money, volunteering or future benefit to the guest — the pick isolates whether expressing gratitude comes first for the persona, not thrift, helpfulness or planning.
[[checks]]
dimension_id = "trait_gratitude"
dimension_label = "Character: Gratitude"
category = "Personality: Character"
anchor_value = "Signature"
evaluator = "rule-based"
adherence_signal = "The free follow-up actions after the stay go to thanking the people who helped (a note to the hosts, a named review for the porter, a message to the driver) rather than to the equally reasonable self-serving admin the portal pushes. Ground truth is each item's data-thanks attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
