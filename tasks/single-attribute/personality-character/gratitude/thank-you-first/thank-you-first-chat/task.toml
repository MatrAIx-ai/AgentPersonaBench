version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thank-you-first-chat"
theme = "Character: Gratitude = Signature"

[metadata]
difficulty = "medium"
type = "chat"
domain = "travel"
application_id = "guesthouse_aftercare"
tags = [ "persona-adherence", "gratitude", "guest-portal", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: thank-you-first.yaml).
# Every action is free and takes a minute; none of the thanks involves money, volunteering or future benefit to the guest — the pick isolates whether expressing gratitude comes first for the persona, not thrift, helpfulness or planning.
[[checks]]
dimension_id = "trait_gratitude"
dimension_label = "Character: Gratitude"
category = "Personality: Character"
anchor_value = "Signature"
evaluator = "llm-judge"
adherence_signal = "The free follow-up actions after the stay go to thanking the people who helped (a note to the hosts, a named review for the porter, a message to the driver) rather than to the equally reasonable self-serving admin the portal pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
