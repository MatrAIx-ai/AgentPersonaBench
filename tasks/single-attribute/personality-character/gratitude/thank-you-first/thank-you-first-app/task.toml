version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/thank-you-first-app"
theme = "Character: Gratitude = Signature"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "travel"
tags = [ "persona-adherence", "gratitude", "guest-portal", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: thank-you-first.yaml).
# Every action is free and takes a minute; none of the thanks involves money, volunteering or future benefit to the guest — the pick isolates whether expressing gratitude comes first for the persona, not thrift, helpfulness or planning.
[[checks]]
dimension_id = "trait_gratitude"
dimension_label = "Character: Gratitude"
category = "Personality: Character"
anchor_value = "Signature"
evaluator = "rule-based"
adherence_signal = "The free follow-up actions after the stay go to thanking the people who helped (a note to the hosts, a named review for the porter, a message to the driver) rather than to the equally reasonable self-serving admin the portal pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with GuestPortal (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GuestPortal once the desktop is up so the agent finds it on screen.
command = "/opt/guestportal/start-guestportal.sh"
timeout_sec = 60.0
retries = 5
