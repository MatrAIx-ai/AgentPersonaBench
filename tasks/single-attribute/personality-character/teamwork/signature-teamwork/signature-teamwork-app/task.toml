version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/signature-teamwork-app"
theme = "Character: Teamwork: Signature"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-character", "teamwork", "signature-teamwork", "os-app", "computer-use",]

[[checks]]
dimension_id = "trait_teamwork"
dimension_label = "Character: Teamwork"
category = "Personality: Character"
attribute = "Character: Teamwork"
value = "Signature"
evaluator = "rule-based"
evaluator_name = "trait_teamwork=Signature"
# OS-APP env: the persona is a computer-use agent operating Crewboard, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Crewboard writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The plan the agent builds contains no go-solo / grab-the-credit approach (a high tier item, tier>=2); a signature team player fills the plan with collaborate-and-share, support-the-group approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Crewboard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Crewboard once the desktop is up so the agent finds it on screen.
command = "/opt/crewboard/start-crewboard.sh"
timeout_sec = 60.0
retries = 5
