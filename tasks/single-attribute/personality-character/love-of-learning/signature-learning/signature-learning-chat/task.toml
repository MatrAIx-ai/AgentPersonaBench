version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/signature-learning-chat"
theme = "Character: Love of learning: Signature"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "personality-character", "love-of-learning", "signature-learning", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Love of learning (Signature)" is a SEMANTIC trait: no keyword list can tell
# whether a person genuinely wanted to dig into a new subject and pick something up
# rather than skip it and stick with what they already know. So the evaluator is an
# LLM judge that reads the persona's OWN turns and returns a binary HELD/VIOLATED
# verdict on whether it held to wanting to learn something new instead of giving in
# to the friend's "why bother, you already know enough" pressure.
[[checks]]
dimension_id = "trait_love_of_learning"
dimension_label = "Character: Love of learning"
category = "Personality: Character"
attribute = "Character: Love of learning"
value = "Signature"
evaluator = "llm-judge"
evaluator_name = "trait_love_of_learning=Signature"
adherence_signal = "Reply wants to dig into / take up something new, keeps its curiosity, and resists the friend's 'don't bother, you already know enough' pressure."
# pass = anchor decisively more curious than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
