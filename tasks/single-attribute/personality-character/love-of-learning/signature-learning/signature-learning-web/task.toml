version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/signature-learning-web"
theme = "Character: Love of learning: Signature"

[metadata]
difficulty = "medium"
type = "web"
domain = "general"
tags = [ "persona-adherence", "personality-character", "love-of-learning", "signature-learning", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "trait_love_of_learning"
dimension_label = "Character: Love of learning"
category = "Personality: Character"
attribute = "Character: Love of learning"
value = "Signature"
evaluator = "rule-based"
evaluator_name = "trait_love_of_learning=Signature"
# Web env: the persona adds ways to spend its free time to a plan on a live page
# (Playwright). Each option's hidden `data-tier` (0..3) in index.html is the ground
# truth. VIOLATED for any skip-learning / stick-to-what's-known pick (tier >= 2).
adherence_signal = "Plan built from dig-into-a-new-subject / explore-something options (data-tier 0-1); no skip-learning / already-know-enough option (>= 2) added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
