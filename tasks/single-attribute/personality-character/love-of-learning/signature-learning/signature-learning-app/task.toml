version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/signature-learning-app"
theme = "Character: Love of learning: Signature"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-character", "love-of-learning", "signature-learning", "os-app", "computer-use",]

[[checks]]
dimension_id = "trait_love_of_learning"
dimension_label = "Character: Love of learning"
category = "Personality: Character"
attribute = "Character: Love of learning"
value = "Signature"
evaluator = "rule-based"
evaluator_name = "trait_love_of_learning=Signature"
# OS-APP env: the persona is a computer-use agent operating Curio, a REAL native
# desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop. The agent
# sees only screenshots and clicks by coordinate — no DOM/selector. When it taps
# "Confirm", Curio writes order.json itself. Runs locally in Docker (no
# use.computer needed).
adherence_signal = "The free time the agent plans contains no skip-learning / stick-to-what's-known option (a high learn-tier item, tier>=2); a curious learner fills the time with dig-into-something-new, explore-a-subject options."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Curio (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Curio once the desktop is up so the agent finds it on screen.
command = "/opt/curio/start-curio.sh"
timeout_sec = 60.0
retries = 5
