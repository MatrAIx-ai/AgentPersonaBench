version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/signature-bravery-app"
theme = "Character: Bravery: Signature"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-character", "bravery", "signature-bravery", "os-app", "computer-use",]

[[checks]]
dimension_id = "trait_bravery"
dimension_label = "Character: Bravery"
category = "Personality: Character"
attribute = "Character: Bravery"
value = "Signature"
evaluator = "rule-based"
evaluator_name = "trait_bravery=Signature"
# OS-APP env: the persona is a computer-use agent operating Crossroads, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm", Crossroads writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The approaches the agent plans contain no back-down / avoid / stay-silent option (a high bravery-tier item, tier>=2); a person of signature bravery fills the plan with facing-it, speaking-up approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Crossroads (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Crossroads once the desktop is up so the agent finds it on screen.
command = "/opt/crossroads/start-crossroads.sh"
timeout_sec = 60.0
retries = 5
