version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/yoga-slot-app"
theme = "Sport: Yoga = Play"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "yoga", "studio-pass", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: yoga-slot.yaml).
# Every class is the same length, in the same time slots, included in the same pass and led by staff instructors; the yoga side spans vigorous and restorative styles — the pick isolates the persona's practice, not its fitness level or calm-seeking.
[[checks]]
dimension_id = "sport_yoga"
dimension_label = "Sport: Yoga"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The three weekly class slots on the studio pass go to yoga classes (flow, ashtanga, hatha, yin) rather than to the equally strong spin, reformer, swim and circuit sessions in the same slots. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with ClassBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch ClassBook once the desktop is up so the agent finds it on screen.
command = "/opt/classbook/start-classbook.sh"
timeout_sec = 60.0
retries = 5
