version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/yoga-slot-survey"
theme = "Sport: Yoga = Play"

[metadata]
difficulty = "easy"
type = "survey"
domain = "fitness"
tags = [ "persona-adherence", "yoga", "studio-pass", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: yoga-slot.yaml).
# Every class is the same length, in the same time slots, included in the same pass and led by staff instructors; the yoga side spans vigorous and restorative styles — the pick isolates the persona's practice, not its fitness level or calm-seeking.
[[checks]]
dimension_id = "sport_yoga"
dimension_label = "Sport: Yoga"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The three weekly class slots on the studio pass go to yoga classes (flow, ashtanga, hatha, yin) rather than to the equally strong spin, reformer, swim and circuit sessions in the same slots. Each option id maps to a `mat` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
