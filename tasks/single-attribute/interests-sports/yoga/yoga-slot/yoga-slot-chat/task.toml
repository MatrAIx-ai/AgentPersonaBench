version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/yoga-slot-chat"
theme = "Sport: Yoga = Play"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "studio_front_desk"
tags = [ "persona-adherence", "yoga", "studio-pass", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: yoga-slot.yaml).
# Every class is the same length, in the same time slots, included in the same pass and led by staff instructors; the yoga side spans vigorous and restorative styles — the pick isolates the persona's practice, not its fitness level or calm-seeking.
[[checks]]
dimension_id = "sport_yoga"
dimension_label = "Sport: Yoga"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "llm-judge"
adherence_signal = "The three weekly class slots on the studio pass go to yoga classes (flow, ashtanga, hatha, yin) rather than to the equally strong spin, reformer, swim and circuit sessions in the same slots. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
