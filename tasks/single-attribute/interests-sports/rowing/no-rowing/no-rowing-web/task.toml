version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-rowing-web"
theme = "Sport: Rowing — None"

[metadata]
difficulty = "medium"
type = "web"
domain = "campus"
tags = [ "persona-adherence", "no-rowing", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "sport_rowing"
dimension_label = "Sport: Rowing"
category = "Interests: Sports"
anchor_value = "None"
