version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/set-sail-survey"
theme = "Sport: Sailing = Play"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "sailing", "marina-weekend", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: set-sail.yaml).
# Every slot is free with the pass, the same length, weather-checked and outdoors; both sides are active, so the pick isolates the persona's own sailing from its general appetite for activity or thrill.
[[checks]]
dimension_id = "sport_sailing"
dimension_label = "Sport: Sailing"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The marina-weekend slots go on the water — dinghy morning, keelboat crew, sunset sail — rather than the equally appealing shore activities the visitor desk pushes. Each option id maps to a `sail` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
