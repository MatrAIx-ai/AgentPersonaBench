version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/set-sail-chat"
theme = "Sport: Sailing = Play"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "marina_visitor_desk"
tags = [ "persona-adherence", "sailing", "marina-weekend", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: set-sail.yaml).
# Every slot is free with the pass, the same length, weather-checked and outdoors; both sides are active, so the pick isolates the persona's own sailing from its general appetite for activity or thrill.
[[checks]]
dimension_id = "sport_sailing"
dimension_label = "Sport: Sailing"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "llm-judge"
adherence_signal = "The marina-weekend slots go on the water — dinghy morning, keelboat crew, sunset sail — rather than the equally appealing shore activities the visitor desk pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
