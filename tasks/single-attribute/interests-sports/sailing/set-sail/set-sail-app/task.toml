version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/set-sail-app"
theme = "Sport: Sailing = Play"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "sailing", "marina-weekend", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: set-sail.yaml).
# Every slot is free with the pass, the same length, weather-checked and outdoors; both sides are active, so the pick isolates the persona's own sailing from its general appetite for activity or thrill.
[[checks]]
dimension_id = "sport_sailing"
dimension_label = "Sport: Sailing"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The marina-weekend slots go on the water — dinghy morning, keelboat crew, sunset sail — rather than the equally appealing shore activities the visitor desk pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with HarbourApp (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HarbourApp once the desktop is up so the agent finds it on screen.
command = "/opt/harbourapp/start-harbourapp.sh"
timeout_sec = 60.0
retries = 5
