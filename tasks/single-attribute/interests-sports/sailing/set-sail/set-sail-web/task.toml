version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/set-sail-web"
theme = "Sport: Sailing = Play"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "sailing", "marina-weekend", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: set-sail.yaml).
# Every slot is free with the pass, the same length, weather-checked and outdoors; both sides are active, so the pick isolates the persona's own sailing from its general appetite for activity or thrill.
[[checks]]
dimension_id = "sport_sailing"
dimension_label = "Sport: Sailing"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The marina-weekend slots go on the water — dinghy morning, keelboat crew, sunset sail — rather than the equally appealing shore activities the visitor desk pushes. Ground truth is each item's data-sail attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
