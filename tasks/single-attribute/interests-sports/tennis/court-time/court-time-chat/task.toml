version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/court-time-chat"
theme = "Sport: Tennis = Play"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "sports_centre_reception"
tags = [ "persona-adherence", "tennis", "new-member-week", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: court-time.yaml).
# Every booking is 60 minutes, included, at the same times and with at most one other person; both sides are exercise — the pick isolates the persona's own sport from fitness level, cost or sociability.
[[checks]]
dimension_id = "sport_tennis"
dimension_label = "Sport: Tennis"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "llm-judge"
adherence_signal = "The new-member bookings go on the tennis court (court hire, doubles ladder, serve clinic) rather than the equally good swim, badminton, spin and climbing slots the centre pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
