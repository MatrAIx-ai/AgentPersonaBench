version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/court-time-web"
theme = "Sport: Tennis = Play"

[metadata]
difficulty = "medium"
type = "web"
domain = "fitness"
tags = [ "persona-adherence", "tennis", "new-member-week", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: court-time.yaml).
# Every booking is 60 minutes, included, at the same times and with at most one other person; both sides are exercise — the pick isolates the persona's own sport from fitness level, cost or sociability.
[[checks]]
dimension_id = "sport_tennis"
dimension_label = "Sport: Tennis"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The new-member bookings go on the tennis court (court hire, doubles ladder, serve clinic) rather than the equally good swim, badminton, spin and climbing slots the centre pushes. Ground truth is each item's data-court attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
