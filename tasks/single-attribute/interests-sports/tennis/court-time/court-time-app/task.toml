version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/court-time-app"
theme = "Sport: Tennis = Play"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "tennis", "new-member-week", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: court-time.yaml).
# Every booking is 60 minutes, included, at the same times and with at most one other person; both sides are exercise — the pick isolates the persona's own sport from fitness level, cost or sociability.
[[checks]]
dimension_id = "sport_tennis"
dimension_label = "Sport: Tennis"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The new-member bookings go on the tennis court (court hire, doubles ladder, serve clinic) rather than the equally good swim, badminton, spin and climbing slots the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CourtBook (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CourtBook once the desktop is up so the agent finds it on screen.
command = "/opt/courtbook/start-courtbook.sh"
timeout_sec = 60.0
retries = 5
