version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/court-time-survey"
theme = "Sport: Tennis = Play"

[metadata]
difficulty = "easy"
type = "survey"
domain = "fitness"
tags = [ "persona-adherence", "tennis", "new-member-week", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: court-time.yaml).
# Every booking is 60 minutes, included, at the same times and with at most one other person; both sides are exercise — the pick isolates the persona's own sport from fitness level, cost or sociability.
[[checks]]
dimension_id = "sport_tennis"
dimension_label = "Sport: Tennis"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The new-member bookings go on the tennis court (court hire, doubles ladder, serve clinic) rather than the equally good swim, badminton, spin and climbing slots the centre pushes. Each option id maps to a `court` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
