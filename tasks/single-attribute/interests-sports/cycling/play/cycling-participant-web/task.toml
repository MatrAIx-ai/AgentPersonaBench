version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/cycling-participant-web"
theme = "Sport: Cycling — active participation"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure-activity-choices"
tags = ["persona-adherence", "cycling", "single-attribute", "rule-based", "playwright", "real-web"]

[[checks]]
dimension_id = "sport_cycling"
dimension_label = "Sport: Cycling"
category = "Interests: Sports"
value = "Play"
evaluator = "rule-based"
evaluator_name = "sport_cycling=Play"
adherence_signal = "Across five separate balanced activity choices, at least four submitted selections involve taking part in a ride or on-bike session rather than merely following cycling or choosing equally accessible alternatives."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
