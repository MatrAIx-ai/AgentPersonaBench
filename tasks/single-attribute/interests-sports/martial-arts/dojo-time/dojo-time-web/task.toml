version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dojo-time-web"
theme = "Sport: Martial arts = Play"

[metadata]
difficulty = "medium"
type = "web"
domain = "fitness"
tags = [ "persona-adherence", "martial-arts", "open-week", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: dojo-time.yaml).
# Every session is free, coached, the same length and light-contact at most; boxing, basketball, cycling and yoga are kept off both sides so the persona's other strong sport pins cannot answer for it, and the pick isolates the persona's own martial-arts practice rather than general fitness.
[[checks]]
dimension_id = "sport_martial_arts"
dimension_label = "Sport: Martial arts"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The open-week sessions go to the mats — judo, karate pads, taekwondo drills, jiu-jitsu — rather than the equally sweaty racket, pool and gym sessions the centre pushes. Ground truth is each item's data-dojo attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
