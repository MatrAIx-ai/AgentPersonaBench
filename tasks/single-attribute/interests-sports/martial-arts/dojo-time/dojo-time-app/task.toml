version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dojo-time-app"
theme = "Sport: Martial arts = Play"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "fitness"
tags = [ "persona-adherence", "martial-arts", "open-week", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: dojo-time.yaml).
# Every session is free, coached, the same length and light-contact at most; boxing, basketball, cycling and yoga are kept off both sides so the persona's other strong sport pins cannot answer for it, and the pick isolates the persona's own martial-arts practice rather than general fitness.
[[checks]]
dimension_id = "sport_martial_arts"
dimension_label = "Sport: Martial arts"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The open-week sessions go to the mats — judo, karate pads, taekwondo drills, jiu-jitsu — rather than the equally sweaty racket, pool and gym sessions the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CentreWeek (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CentreWeek once the desktop is up so the agent finds it on screen.
command = "/opt/centreweek/start-centreweek.sh"
timeout_sec = 60.0
retries = 5
