version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dojo-time-survey"
theme = "Sport: Martial arts = Play"

[metadata]
difficulty = "easy"
type = "survey"
domain = "fitness"
tags = [ "persona-adherence", "martial-arts", "open-week", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: dojo-time.yaml).
# Every session is free, coached, the same length and light-contact at most; boxing, basketball, cycling and yoga are kept off both sides so the persona's other strong sport pins cannot answer for it, and the pick isolates the persona's own martial-arts practice rather than general fitness.
[[checks]]
dimension_id = "sport_martial_arts"
dimension_label = "Sport: Martial arts"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "rule-based"
adherence_signal = "The open-week sessions go to the mats — judo, karate pads, taekwondo drills, jiu-jitsu — rather than the equally sweaty racket, pool and gym sessions the centre pushes. Each option id maps to a `dojo` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
