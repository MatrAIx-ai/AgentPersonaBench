version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/dojo-time-chat"
theme = "Sport: Martial arts = Play"

[metadata]
difficulty = "medium"
type = "chat"
domain = "fitness"
application_id = "sports_centre_desk"
tags = [ "persona-adherence", "martial-arts", "open-week", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: dojo-time.yaml).
# Every session is free, coached, the same length and light-contact at most; boxing, basketball, cycling and yoga are kept off both sides so the persona's other strong sport pins cannot answer for it, and the pick isolates the persona's own martial-arts practice rather than general fitness.
[[checks]]
dimension_id = "sport_martial_arts"
dimension_label = "Sport: Martial arts"
category = "Interests: Sports"
anchor_value = "Play"
evaluator = "llm-judge"
adherence_signal = "The open-week sessions go to the mats — judo, karate pads, taekwondo drills, jiu-jitsu — rather than the equally sweaty racket, pool and gym sessions the centre pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
