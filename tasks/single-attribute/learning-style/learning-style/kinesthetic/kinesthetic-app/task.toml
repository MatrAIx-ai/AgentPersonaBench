version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/kinesthetic-app"
theme = "Learning style: Kinesthetic"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "education"
tags = ["persona-adherence", "learning_style", "kinesthetic", "rule-based", "real-app"]

[[checks]]
dimension_id = "learning_style"
dimension_label = "Learning style"
category = "Learning: Style"
anchor_value = "Kinesthetic"
evaluator = "rule-based"
adherence_signal = "The learner consistently chooses hands-on guided practice rather than text, video, or audio-only instruction."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
command = "/opt/app/start-app.sh"
timeout_sec = 60.0
retries = 5

