version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/reading-writing-web"
theme = "Learning style = Reading / writing"

[metadata]
difficulty = "medium"
type = "web"
domain = "education"
tags = [ "persona-adherence", "learning-style", "course-formats", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: reading-writing.yaml).
# Every format covers the same syllabus at the same price and pace, so format is the only axis and the pick isolates learning-style preference.
[[checks]]
dimension_id = "learning_style"
dimension_label = "Learning style"
category = "Learning: Style"
anchor_value = "Reading / writing"
evaluator = "rule-based"
adherence_signal = "The chosen course formats are the text-and-notes tracks (workbook, annotated transcripts, written cases) rather than the watch/listen tracks, despite those being the lean-back path. Ground truth is each item's data-nontext attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
