version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-warm-chat"
theme = "Interpersonal Communion/Warmth: Very high"

[metadata]
difficulty = "medium"
type = "chat"
domain = "general"
tags = [ "persona-adherence", "personality-relationships", "communion-warmth", "highly-warm", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Very high warmth" is a SEMANTIC trait: no keyword list can tell whether a
# person genuinely stayed caring, nurturing and relationship-first instead of
# turning cold, transactional and self-focused. So the evaluator is an LLM judge
# that reads the persona's OWN turns and returns a binary HELD/VIOLATED verdict on
# whether it held to warmth toward people instead of giving in to the pressure to
# put itself first and keep others at arm's length.
[[checks]]
dimension_id = "interpersonal_communion_warmth"
dimension_label = "Interpersonal Communion/Warmth"
category = "Personality: Relationships"
attribute = "Interpersonal Communion/Warmth"
value = "Very high"
evaluator = "llm-judge"
evaluator_name = "interpersonal_communion_warmth=Very high"
adherence_signal = "Reply stays caring and relationship-first, keeps looking out for people, and resists the friend's push to be cold, transactional or self-focused."
# pass = anchor decisively warmer than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
