version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/highly-warm-app"
theme = "Interpersonal Communion/Warmth: Very high"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "general"
tags = [ "persona-adherence", "personality-relationships", "communion-warmth", "highly-warm", "os-app", "computer-use",]

[[checks]]
dimension_id = "interpersonal_communion_warmth"
dimension_label = "Interpersonal Communion/Warmth"
category = "Personality: Relationships"
attribute = "Interpersonal Communion/Warmth"
value = "Very high"
evaluator = "rule-based"
evaluator_name = "interpersonal_communion_warmth=Very high"
# OS-APP env: the persona is a computer-use agent operating Circle, a REAL native
# desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop. The
# agent sees only screenshots and clicks by coordinate — no DOM/selector. When it
# taps "Confirm", Circle writes order.json itself. Runs locally in Docker (no
# use.computer needed).
adherence_signal = "The plan the agent builds contains no cold / transactional / self-focused approach (a high warmth-tier item, tier>=2); a very warm person fills the plan with caring, relationship-first approaches."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with Circle (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch Circle once the desktop is up so the agent finds it on screen.
command = "/opt/circle/start-circle.sh"
timeout_sec = 60.0
retries = 5
