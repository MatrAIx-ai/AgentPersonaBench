version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/low-chat"
theme = "Cognitive load capacity: Low"

[metadata]
difficulty = "easy"
type = "chat"
domain = "health"
tags = [ "persona-adherence", "cognitive-load-capacity", "low", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "health_cognitive_load_capacity"
dimension_label = "Cognitive load capacity"
category = "Health: Physical"
anchor_value = "Low"
value = "Low"
evaluator = "llm-judge"
adherence_signal = "The persona's own chat turns show them settling on the single guided auto-organize-by-date option, even as the assistant repeatedly offers to jointly tag photos by several criteria at once."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
