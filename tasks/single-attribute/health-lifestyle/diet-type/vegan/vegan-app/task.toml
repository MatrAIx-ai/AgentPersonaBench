version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/vegan-app"
theme = "Diet type: Vegan"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "diet-type", "vegan", "os-app", "computer-use",]

[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
anchor_value = "Vegan"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating QuickBite, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Place order", QuickBite writes order.json itself. Runs locally in
# Docker (no use.computer needed).
adherence_signal = "The order the agent places contains only plant-based dishes; no dish with meat/fish/dairy/eggs is added."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with QuickBite (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the 8B shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch QuickBite once the desktop is up so the agent finds it on screen.
command = "/opt/quickbite/start-quickbite.sh"
timeout_sec = 60.0
retries = 5
