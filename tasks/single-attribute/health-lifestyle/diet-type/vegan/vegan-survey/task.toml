version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/vegan-survey"
theme = "Diet type: Vegan"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "diet-type", "vegan", "rule-based", "choice-based",]

[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
anchor_value = "Vegan"
evaluator = "rule-based"
# Survey env: the persona picks meal options from a questionnaire. Adherence
# shows up in WHICH options are chosen (each option is pre-labeled vegan or not),
# so no free-text parsing is needed — the check is over option ids.
adherence_signal = "Selected meal options are all plant-based (vegan-labeled); no option containing meat/fish/dairy/eggs is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
