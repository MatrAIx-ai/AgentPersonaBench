version = "1.0"
artifacts = ["/app/output"]

[task]
name = "personabench/pescatarian-web"
theme = "Diet type: Pescatarian"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = ["persona-adherence", "lstyle_diet_type", "pescatarian", "rule-based", "real-web"]

[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
anchor_value = "Pescatarian"
evaluator = "rule-based"
adherence_signal = "Every selected meal avoids meat from land animals while allowing seafood, vegetarian, and plant-based food."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
    definition = "application/shared-web-playwright"
    build_timeout_sec = 900.0
    cpus = 1
    memory_mb = 2048
    storage_mb = 10240
    gpus = 0
network_mode = "public"

