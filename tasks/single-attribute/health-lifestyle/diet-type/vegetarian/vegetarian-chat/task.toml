version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/vegetarian-chat"
theme = "Diet type: Vegetarian"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
tags = [ "persona-adherence", "diet-type", "vegetarian", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence extension --------------------------------------------- #
# "Vegetarian" is a SEMANTIC stance: no keyword list can tell whether a diner
# genuinely declined the meat/fish an eager waiter kept pushing. So the evaluator
# is an LLM judge that reads the persona's OWN turns and returns a binary
# HELD/VIOLATED verdict on whether it kept to vegetarian food (dairy/eggs allowed).
[[checks]]
dimension_id = "lstyle_diet_type"
dimension_label = "Diet type"
category = "Health: Lifestyle"
anchor_value = "Vegetarian"
evaluator = "llm-judge"
adherence_signal = "Reply declines the meat and fish dishes the waiter pushes and chooses vegetarian food (dairy and eggs are fine) instead of giving in to a meat/fish dish."
# pass = anchor decisively more vegetarian than contrast:

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
