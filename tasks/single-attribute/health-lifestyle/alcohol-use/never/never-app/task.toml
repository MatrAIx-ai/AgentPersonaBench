version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/never-app"
theme = "Alcohol use: Never"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "alcohol-use", "never", "rule-based", "os-app", "cua",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "lstyle_alcohol_use"
dimension_label = "Alcohol use"
category = "Health: Lifestyle"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "The order the app itself records contains no item whose hidden flag marks an alcoholic beverage."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with your GUI baked in — see ./environment/Dockerfile.
# No `definition` key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CanteenOrder once the desktop is up so the agent finds it.
command = "/opt/canteenorder/start-canteenorder.sh"
timeout_sec = 60.0
retries = 5
