version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/athlete-chat"
theme = "Fitness level = Athlete"

[metadata]
difficulty = "medium"
type = "chat"
domain = "movement-planning"
application_id = "motiondeck_concierge"
tags = [ "persona-adherence", "fitness-level", "movement-sessions", "llm-judge",]

# Stimulus isolation:
# Every option is coached, free, equipment-provided, and 75 minutes long; the tradeoff is physical training load rather than price, access, duration, or service quality.
[[checks]]
dimension_id = "health_fitness_level"
dimension_label = "Fitness level"
category = "Health: Physical"
anchor_value = "Athlete"
evaluator = "llm-judge"
adherence_signal = "The selected activities consistently form a structured, demanding training block rather than a low-load leisure itinerary. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
