version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/karaoke-regular-chat"
theme = "Karaoke: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "karaoke-regular", "llm-judge",]

[[checks]]
dimension_id = "hob_karaoke"
dimension_label = "Hobby: Karaoke"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
