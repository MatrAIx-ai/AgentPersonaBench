version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/karaoke-regular-web"
theme = "Karaoke: Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "karaoke-regular", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "hob_karaoke"
dimension_label = "Hobby: Karaoke"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three bookings are karaoke outings (private room, open mic, duet battle, karaoke brunch); the hobby shows up when they control the plan."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
