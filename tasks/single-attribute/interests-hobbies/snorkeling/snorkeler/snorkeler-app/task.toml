version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkeler-app"
theme = "Snorkeling: Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "snorkeler", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three included-activity picks are snorkeling activities; an active snorkeler at a coastal resort heads for the water."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the GetawayGo Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch GetawayGo once the desktop is up so the agent finds it on screen.
command = "/opt/snorkeler/start-app.sh"
timeout_sec = 60.0
retries = 5
