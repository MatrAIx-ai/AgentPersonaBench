version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkeler-chat"
theme = "Snorkeling: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "snorkeler", "llm-judge",]

[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three included-activity picks are snorkeling activities; an active snorkeler at a coastal resort heads for the water."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
