version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/snorkeler-survey"
theme = "Snorkeling: Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "snorkeler", "rule-based",]

[[checks]]
dimension_id = "hob_snorkeling"
dimension_label = "Hobby: Snorkeling"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three included-activity picks are snorkeling activities; an active snorkeler at a coastal resort heads for the water."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
