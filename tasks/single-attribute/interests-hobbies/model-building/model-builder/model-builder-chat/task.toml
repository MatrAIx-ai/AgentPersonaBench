version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/model-builder-chat"
theme = "Model building: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "model-builder", "llm-judge",]

[[checks]]
dimension_id = "hob_model_building"
dimension_label = "Hobby: Model building"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three gift-card picks are model-building supplies; an active builder restocks the bench first."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
