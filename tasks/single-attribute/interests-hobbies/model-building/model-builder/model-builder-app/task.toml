version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/model-builder-app"
theme = "Model building: Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "model-builder", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "hob_model_building"
dimension_label = "Hobby: Model building"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three gift-card picks are model-building supplies; an active builder restocks the bench first."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the HobbyHall Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch HobbyHall once the desktop is up so the agent finds it on screen.
command = "/opt/modelbuilder/start-app.sh"
timeout_sec = 60.0
retries = 5
