version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/model-builder-survey"
theme = "Model building: Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "model-builder", "rule-based",]

[[checks]]
dimension_id = "hob_model_building"
dimension_label = "Hobby: Model building"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three gift-card picks are model-building supplies; an active builder restocks the bench first."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
