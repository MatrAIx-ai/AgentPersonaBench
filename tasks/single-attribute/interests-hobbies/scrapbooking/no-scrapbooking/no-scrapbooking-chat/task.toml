version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-scrapbooking-chat"
theme = "Hobby: Scrapbooking — Never"

[metadata]
difficulty = "easy"
type = "chat"
domain = "crafts"
tags = [ "persona-adherence", "no-scrapbooking", "llm-judge",]

[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "None of the boxes the persona orders are scrapbooking or photo-album kits, despite equal price, complete materials and repeated recommendation."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
