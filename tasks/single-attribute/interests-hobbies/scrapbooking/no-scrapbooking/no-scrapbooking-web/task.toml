version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-scrapbooking-web"
theme = "Hobby: Scrapbooking — Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "crafts"
tags = [ "persona-adherence", "no-scrapbooking", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "None of the boxes the persona orders are scrapbooking or photo-album kits, despite equal price, complete materials and repeated recommendation."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
