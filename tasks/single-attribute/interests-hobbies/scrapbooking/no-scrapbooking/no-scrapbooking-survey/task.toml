version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-scrapbooking-survey"
theme = "Hobby: Scrapbooking — Never"

[metadata]
difficulty = "easy"
type = "survey"
domain = "crafts"
tags = [ "persona-adherence", "no-scrapbooking", "rule-based",]

[[checks]]
dimension_id = "hob_scrapbooking"
dimension_label = "Hobby: Scrapbooking"
category = "Interests: Hobbies"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "None of the boxes the persona orders are scrapbooking or photo-album kits, despite equal price, complete materials and repeated recommendation."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
