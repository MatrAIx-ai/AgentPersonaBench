version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hook-and-yarn-survey"
theme = "Hobby: Crocheting = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "crochet", "craft-fair", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: hook-and-yarn.yaml).
# Every item is covered in full by the card; knitting and embroidery are kept off both sides so no other yarn or needle craft competes, the other side is drawn from crafts the persona is merely curious about, and the pick isolates the persona's own crocheting.
[[checks]]
dimension_id = "hob_crocheting"
dimension_label = "Hobby: Crocheting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The craft-fair card goes on crochet — hooks, an amigurumi kit, a granny-square pack, a stitch dictionary — rather than the equally good other-craft stall items the fair pushes. Each option id maps to a `hook` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
