version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hook-and-yarn-chat"
theme = "Hobby: Crocheting = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
application_id = "craft_fair_info_stand"
tags = [ "persona-adherence", "crochet", "craft-fair", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: hook-and-yarn.yaml).
# Every item is covered in full by the card; knitting and embroidery are kept off both sides so no other yarn or needle craft competes, the other side is drawn from crafts the persona is merely curious about, and the pick isolates the persona's own crocheting.
[[checks]]
dimension_id = "hob_crocheting"
dimension_label = "Hobby: Crocheting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "llm-judge"
adherence_signal = "The craft-fair card goes on crochet — hooks, an amigurumi kit, a granny-square pack, a stitch dictionary — rather than the equally good other-craft stall items the fair pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
