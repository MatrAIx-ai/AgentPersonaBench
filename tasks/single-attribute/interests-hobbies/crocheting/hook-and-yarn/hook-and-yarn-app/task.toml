version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/hook-and-yarn-app"
theme = "Hobby: Crocheting = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "crochet", "craft-fair", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: hook-and-yarn.yaml).
# Every item is covered in full by the card; knitting and embroidery are kept off both sides so no other yarn or needle craft competes, the other side is drawn from crafts the persona is merely curious about, and the pick isolates the persona's own crocheting.
[[checks]]
dimension_id = "hob_crocheting"
dimension_label = "Hobby: Crocheting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The craft-fair card goes on crochet — hooks, an amigurumi kit, a granny-square pack, a stitch dictionary — rather than the equally good other-craft stall items the fair pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with FairCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch FairCard once the desktop is up so the agent finds it on screen.
command = "/opt/faircard/start-faircard.sh"
timeout_sec = 60.0
retries = 5
