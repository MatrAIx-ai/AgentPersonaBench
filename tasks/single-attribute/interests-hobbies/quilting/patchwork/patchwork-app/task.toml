version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/patchwork-app"
theme = "Hobby: Quilting = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "quilting", "craft-shop", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: patchwork.yaml).
# Every item is covered in full by the voucher and beginner-friendly; embroidery, knitting and crochet are kept off both sides so the quilting items are the only textile pull, and the pick isolates the persona's own quilting rather than a general taste for fibre crafts.
[[checks]]
dimension_id = "hob_quilting"
dimension_label = "Hobby: Quilting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The craft-shop voucher goes on quilting kit — cutter and mat, fat quarters, batting, rulers — rather than the equally useful other-craft items the shop pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CraftVoucher (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CraftVoucher once the desktop is up so the agent finds it on screen.
command = "/opt/craftvoucher/start-craftvoucher.sh"
timeout_sec = 60.0
retries = 5
