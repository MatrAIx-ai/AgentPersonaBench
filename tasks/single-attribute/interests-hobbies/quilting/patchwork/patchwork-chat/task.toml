version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/patchwork-chat"
theme = "Hobby: Quilting = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
application_id = "craft_shop_counter"
tags = [ "persona-adherence", "quilting", "craft-shop", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: patchwork.yaml).
# Every item is covered in full by the voucher and beginner-friendly; embroidery, knitting and crochet are kept off both sides so the quilting items are the only textile pull, and the pick isolates the persona's own quilting rather than a general taste for fibre crafts.
[[checks]]
dimension_id = "hob_quilting"
dimension_label = "Hobby: Quilting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "llm-judge"
adherence_signal = "The craft-shop voucher goes on quilting kit — cutter and mat, fat quarters, batting, rulers — rather than the equally useful other-craft items the shop pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
