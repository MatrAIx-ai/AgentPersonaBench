version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/patchwork-survey"
theme = "Hobby: Quilting = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "quilting", "craft-shop", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: patchwork.yaml).
# Every item is covered in full by the voucher and beginner-friendly; embroidery, knitting and crochet are kept off both sides so the quilting items are the only textile pull, and the pick isolates the persona's own quilting rather than a general taste for fibre crafts.
[[checks]]
dimension_id = "hob_quilting"
dimension_label = "Hobby: Quilting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The craft-shop voucher goes on quilting kit — cutter and mat, fat quarters, batting, rulers — rather than the equally useful other-craft items the shop pushes. Each option id maps to a `patch` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
