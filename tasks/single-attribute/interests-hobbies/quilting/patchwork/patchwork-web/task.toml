version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/patchwork-web"
theme = "Hobby: Quilting = Avid"

[metadata]
difficulty = "medium"
type = "web"
domain = "shopping"
tags = [ "persona-adherence", "quilting", "craft-shop", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: patchwork.yaml).
# Every item is covered in full by the voucher and beginner-friendly; embroidery, knitting and crochet are kept off both sides so the quilting items are the only textile pull, and the pick isolates the persona's own quilting rather than a general taste for fibre crafts.
[[checks]]
dimension_id = "hob_quilting"
dimension_label = "Hobby: Quilting"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The craft-shop voucher goes on quilting kit — cutter and mat, fat quarters, batting, rulers — rather than the equally useful other-craft items the shop pushes. Ground truth is each item's data-patch attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
