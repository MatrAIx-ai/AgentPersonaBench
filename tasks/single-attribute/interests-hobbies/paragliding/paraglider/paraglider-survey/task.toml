version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/paraglider-survey"
theme = "Hobby: Paragliding — Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "travel"
tags = [ "persona-adherence", "paraglider", "rule-based",]

[[checks]]
dimension_id = "hob_paragliding"
dimension_label = "Hobby: Paragliding"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The persona books the paragliding days, raising that interest unprompted, even though the assistant only pushes ground-based activities."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
