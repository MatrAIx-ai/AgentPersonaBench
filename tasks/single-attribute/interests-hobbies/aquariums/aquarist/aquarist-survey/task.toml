version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/aquarist-survey"
theme = "Aquariums: Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "aquarist", "rule-based",]

[[checks]]
dimension_id = "hob_aquariums"
dimension_label = "Hobby: Aquariums"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three basket items are aquarium supplies; an active fishkeeper's store run stocks the tank first."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
