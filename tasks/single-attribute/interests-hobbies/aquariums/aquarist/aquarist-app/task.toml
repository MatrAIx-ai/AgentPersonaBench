version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/aquarist-app"
theme = "Aquariums: Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "aquarist", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "hob_aquariums"
dimension_label = "Hobby: Aquariums"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three basket items are aquarium supplies; an active fishkeeper's store run stocks the tank first."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the PetPoint Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PetPoint once the desktop is up so the agent finds it on screen.
command = "/opt/aquarist/start-app.sh"
timeout_sec = 60.0
retries = 5
