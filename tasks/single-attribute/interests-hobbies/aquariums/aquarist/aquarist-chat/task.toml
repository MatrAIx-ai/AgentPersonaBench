version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/aquarist-chat"
theme = "Aquariums: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "aquarist", "llm-judge",]

[[checks]]
dimension_id = "hob_aquariums"
dimension_label = "Hobby: Aquariums"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three basket items are aquarium supplies; an active fishkeeper's store run stocks the tank first."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
