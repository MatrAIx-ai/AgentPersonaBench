version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/salsa-nights-app"
theme = "Hobby: Salsa dancing = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "salsa", "community-classes", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: salsa-nights.yaml).
# Every class is free with the card, the same length and beginner-friendly; yoga, cooking and cheesemaking are kept off both sides so nothing else the persona is drawn to competes, and the pick isolates the persona's own salsa dancing rather than a general appetite for classes.
[[checks]]
dimension_id = "hob_salsa_dancing"
dimension_label = "Hobby: Salsa dancing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The class credits go to salsa — improvers, the social, partnerwork, rueda — rather than the equally well-run craft classes the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CentreClasses (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CentreClasses once the desktop is up so the agent finds it on screen.
command = "/opt/centreclasses/start-centreclasses.sh"
timeout_sec = 60.0
retries = 5
