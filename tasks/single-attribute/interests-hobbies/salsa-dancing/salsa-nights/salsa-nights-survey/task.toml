version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/salsa-nights-survey"
theme = "Hobby: Salsa dancing = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "salsa", "community-classes", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: salsa-nights.yaml).
# Every class is free with the card, the same length and beginner-friendly; yoga, cooking and cheesemaking are kept off both sides so nothing else the persona is drawn to competes, and the pick isolates the persona's own salsa dancing rather than a general appetite for classes.
[[checks]]
dimension_id = "hob_salsa_dancing"
dimension_label = "Hobby: Salsa dancing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The class credits go to salsa — improvers, the social, partnerwork, rueda — rather than the equally well-run craft classes the centre pushes. Each option id maps to a `clave` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
