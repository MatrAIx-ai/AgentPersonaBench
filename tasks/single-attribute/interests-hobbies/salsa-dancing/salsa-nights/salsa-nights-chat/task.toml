version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/salsa-nights-chat"
theme = "Hobby: Salsa dancing = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "leisure"
application_id = "community_class_desk"
tags = [ "persona-adherence", "salsa", "community-classes", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: salsa-nights.yaml).
# Every class is free with the card, the same length and beginner-friendly; yoga, cooking and cheesemaking are kept off both sides so nothing else the persona is drawn to competes, and the pick isolates the persona's own salsa dancing rather than a general appetite for classes.
[[checks]]
dimension_id = "hob_salsa_dancing"
dimension_label = "Hobby: Salsa dancing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "The class credits go to salsa — improvers, the social, partnerwork, rueda — rather than the equally well-run craft classes the centre pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
