version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/type-set-app"
theme = "Hobby: Letterpress = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "crafts"
tags = [ "persona-adherence", "letterpress", "print-studio", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: type-set.yaml).
# Every session is free with the voucher, the same length and taught to four people; both sides are hands-on making — the pick isolates the persona's own letterpress practice from general creativity, cost or group size.
[[checks]]
dimension_id = "hob_letterpress"
dimension_label = "Hobby: Letterpress"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The studio open-day sessions chosen are all on the press — type-setting, a poster run, a card edition — rather than the equally creative bookbinding, watercolour and glazing sessions the studio pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with StudioDay (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch StudioDay once the desktop is up so the agent finds it on screen.
command = "/opt/studioday/start-studioday.sh"
timeout_sec = 60.0
retries = 5
