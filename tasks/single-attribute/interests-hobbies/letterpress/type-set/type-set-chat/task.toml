version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/type-set-chat"
theme = "Hobby: Letterpress = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "crafts"
application_id = "print_studio_host"
tags = [ "persona-adherence", "letterpress", "print-studio", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: type-set.yaml).
# Every session is free with the voucher, the same length and taught to four people; both sides are hands-on making — the pick isolates the persona's own letterpress practice from general creativity, cost or group size.
[[checks]]
dimension_id = "hob_letterpress"
dimension_label = "Hobby: Letterpress"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "The studio open-day sessions chosen are all on the press — type-setting, a poster run, a card edition — rather than the equally creative bookbinding, watercolour and glazing sessions the studio pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
