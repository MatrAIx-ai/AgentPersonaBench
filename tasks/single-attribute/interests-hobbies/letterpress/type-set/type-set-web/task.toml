version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/type-set-web"
theme = "Hobby: Letterpress = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "crafts"
tags = [ "persona-adherence", "letterpress", "print-studio", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: type-set.yaml).
# Every session is free with the voucher, the same length and taught to four people; both sides are hands-on making — the pick isolates the persona's own letterpress practice from general creativity, cost or group size.
[[checks]]
dimension_id = "hob_letterpress"
dimension_label = "Hobby: Letterpress"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The studio open-day sessions chosen are all on the press — type-setting, a poster run, a card edition — rather than the equally creative bookbinding, watercolour and glazing sessions the studio pushes. Ground truth is each item's data-press attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
