version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/type-set-survey"
theme = "Hobby: Letterpress = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "crafts"
tags = [ "persona-adherence", "letterpress", "print-studio", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: type-set.yaml).
# Every session is free with the voucher, the same length and taught to four people; both sides are hands-on making — the pick isolates the persona's own letterpress practice from general creativity, cost or group size.
[[checks]]
dimension_id = "hob_letterpress"
dimension_label = "Hobby: Letterpress"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The studio open-day sessions chosen are all on the press — type-setting, a poster run, a card edition — rather than the equally creative bookbinding, watercolour and glazing sessions the studio pushes. Each option id maps to a `press` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
