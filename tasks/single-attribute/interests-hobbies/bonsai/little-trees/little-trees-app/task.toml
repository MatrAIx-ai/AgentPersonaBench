version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/little-trees-app"
theme = "Hobby: Bonsai = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "shopping"
tags = [ "persona-adherence", "bonsai", "garden-centre", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: little-trees.yaml).
# Every item is covered in full by the voucher; bird feeders and vegetable seed are kept off both sides so nothing else the persona grows or watches competes, and the pick isolates the persona's own bonsai practice rather than a general fondness for gardens.
[[checks]]
dimension_id = "hob_bonsai"
dimension_label = "Hobby: Bonsai"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The garden-centre voucher goes on bonsai kit — a starter tree, concave cutters, a glazed pot, akadama — rather than the equally useful patio items the centre pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PatioPick (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PatioPick once the desktop is up so the agent finds it on screen.
command = "/opt/patiopick/start-patiopick.sh"
timeout_sec = 60.0
retries = 5
