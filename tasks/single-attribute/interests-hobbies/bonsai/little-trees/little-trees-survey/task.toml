version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/little-trees-survey"
theme = "Hobby: Bonsai = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "shopping"
tags = [ "persona-adherence", "bonsai", "garden-centre", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: little-trees.yaml).
# Every item is covered in full by the voucher; bird feeders and vegetable seed are kept off both sides so nothing else the persona grows or watches competes, and the pick isolates the persona's own bonsai practice rather than a general fondness for gardens.
[[checks]]
dimension_id = "hob_bonsai"
dimension_label = "Hobby: Bonsai"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The garden-centre voucher goes on bonsai kit — a starter tree, concave cutters, a glazed pot, akadama — rather than the equally useful patio items the centre pushes. Each option id maps to a `dwarf` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
