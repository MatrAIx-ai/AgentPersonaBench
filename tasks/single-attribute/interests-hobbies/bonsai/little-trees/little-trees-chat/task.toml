version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/little-trees-chat"
theme = "Hobby: Bonsai = Avid"

[metadata]
difficulty = "medium"
type = "chat"
domain = "shopping"
application_id = "garden_centre_desk"
tags = [ "persona-adherence", "bonsai", "garden-centre", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: little-trees.yaml).
# Every item is covered in full by the voucher; bird feeders and vegetable seed are kept off both sides so nothing else the persona grows or watches competes, and the pick isolates the persona's own bonsai practice rather than a general fondness for gardens.
[[checks]]
dimension_id = "hob_bonsai"
dimension_label = "Hobby: Bonsai"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "llm-judge"
adherence_signal = "The garden-centre voucher goes on bonsai kit — a starter tree, concave cutters, a glazed pot, akadama — rather than the equally useful patio items the centre pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
