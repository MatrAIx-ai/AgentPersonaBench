version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stamp-collector-chat"
theme = "Hobby: Stamp collecting — Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "market"
tags = [ "persona-adherence", "stamp-collector", "llm-judge",]

[[checks]]
dimension_id = "hob_stamp_collecting"
dimension_label = "Hobby: Stamp collecting"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "The persona books the stamp and postal-history tables, raising that interest unprompted, even though the assistant only pushes other collecting fields."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
