version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stamp-collector-survey"
theme = "Hobby: Stamp collecting — Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "market"
tags = [ "persona-adherence", "stamp-collector", "rule-based",]

[[checks]]
dimension_id = "hob_stamp_collecting"
dimension_label = "Hobby: Stamp collecting"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The persona books the stamp and postal-history tables, raising that interest unprompted, even though the assistant only pushes other collecting fields."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
