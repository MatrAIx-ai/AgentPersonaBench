version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stamp-collector-web"
theme = "Hobby: Stamp collecting — Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "market"
tags = [ "persona-adherence", "stamp-collector", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "hob_stamp_collecting"
dimension_label = "Hobby: Stamp collecting"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The persona books the stamp and postal-history tables, raising that interest unprompted, even though the assistant only pushes other collecting fields."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
