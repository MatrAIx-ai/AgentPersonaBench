version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/birdwatcher-chat"
theme = "Birdwatching: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "birdwatcher", "llm-judge",]

[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three chosen activities are birdwatching ones (dawn walk, hide pass, migration talk, nestbox workshop); the hobby shows up in how a free day gets planned."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
