version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/birdwatcher-survey"
theme = "Birdwatching: Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "birdwatcher", "rule-based",]

[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three chosen activities are birdwatching ones (dawn walk, hide pass, migration talk, nestbox workshop); the hobby shows up in how a free day gets planned."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
