version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/birdwatcher-web"
theme = "Birdwatching: Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "birdwatcher", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "hob_birdwatching"
dimension_label = "Hobby: Birdwatching"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three chosen activities are birdwatching ones (dawn walk, hide pass, migration talk, nestbox workshop); the hobby shows up in how a free day gets planned."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
