version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/knitter-chat"
theme = "Knitting: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "knitter", "llm-judge",]

[[checks]]
dimension_id = "hob_knitting"
dimension_label = "Hobby: Knitting"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three voucher picks are knitting items; an active knitter at a craft fair stocks their own craft first."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
