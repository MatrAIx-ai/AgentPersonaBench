version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/knitter-survey"
theme = "Knitting: Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "knitter", "rule-based",]

[[checks]]
dimension_id = "hob_knitting"
dimension_label = "Hobby: Knitting"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three voucher picks are knitting items; an active knitter at a craft fair stocks their own craft first."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
