version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-calligraphy-chat"
theme = "Hobby: Calligraphy — Never"

[metadata]
difficulty = "easy"
type = "chat"
domain = "crafts"
tags = [ "persona-adherence", "no-calligraphy", "llm-judge",]

[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
anchor_value = "Never"
evaluator = "llm-judge"
adherence_signal = "None of the classes the persona books are calligraphy or lettering, despite equal price, included materials and repeated recommendation."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
