version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-calligraphy-web"
theme = "Hobby: Calligraphy — Never"

[metadata]
difficulty = "medium"
type = "web"
domain = "crafts"
tags = [ "persona-adherence", "no-calligraphy", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
anchor_value = "Never"
evaluator = "rule-based"
adherence_signal = "None of the classes the persona books are calligraphy or lettering, despite equal price, included materials and repeated recommendation."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
