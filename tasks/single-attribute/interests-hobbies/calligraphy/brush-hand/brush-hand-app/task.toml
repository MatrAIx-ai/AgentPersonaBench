version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brush-hand-app"
theme = "Hobby: Calligraphy = Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "crafts"
tags = [ "persona-adherence", "calligraphy", "craft-voucher", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: brush-hand.yaml).
# Every item costs one voucher, ships together and suits the same desk; both sides are attractive craft goods — the pick isolates the persona's own lettering practice from general taste, cost or usefulness.
[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The craft vouchers go on lettering kit (nibs, ink stone, brush pens, guideline pad) rather than the equally good general stationery the store pushes as the safe choice. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with CraftCart (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch CraftCart once the desktop is up so the agent finds it on screen.
command = "/opt/craftcart/start-craftcart.sh"
timeout_sec = 60.0
retries = 5
