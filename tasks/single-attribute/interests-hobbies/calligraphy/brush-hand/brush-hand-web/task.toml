version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brush-hand-web"
theme = "Hobby: Calligraphy = Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "crafts"
tags = [ "persona-adherence", "calligraphy", "craft-voucher", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: brush-hand.yaml).
# Every item costs one voucher, ships together and suits the same desk; both sides are attractive craft goods — the pick isolates the persona's own lettering practice from general taste, cost or usefulness.
[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The craft vouchers go on lettering kit (nibs, ink stone, brush pens, guideline pad) rather than the equally good general stationery the store pushes as the safe choice. Ground truth is each item's data-nib attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
