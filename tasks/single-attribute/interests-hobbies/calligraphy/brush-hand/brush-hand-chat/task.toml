version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brush-hand-chat"
theme = "Hobby: Calligraphy = Active"

[metadata]
difficulty = "medium"
type = "chat"
domain = "crafts"
application_id = "craft_store_assistant"
tags = [ "persona-adherence", "calligraphy", "craft-voucher", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: brush-hand.yaml).
# Every item costs one voucher, ships together and suits the same desk; both sides are attractive craft goods — the pick isolates the persona's own lettering practice from general taste, cost or usefulness.
[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "The craft vouchers go on lettering kit (nibs, ink stone, brush pens, guideline pad) rather than the equally good general stationery the store pushes as the safe choice. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
