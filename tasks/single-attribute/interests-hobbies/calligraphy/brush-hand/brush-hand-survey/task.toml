version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/brush-hand-survey"
theme = "Hobby: Calligraphy = Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "crafts"
tags = [ "persona-adherence", "calligraphy", "craft-voucher", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: brush-hand.yaml).
# Every item costs one voucher, ships together and suits the same desk; both sides are attractive craft goods — the pick isolates the persona's own lettering practice from general taste, cost or usefulness.
[[checks]]
dimension_id = "hob_calligraphy"
dimension_label = "Hobby: Calligraphy"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The craft vouchers go on lettering kit (nibs, ink stone, brush pens, guideline pad) rather than the equally good general stationery the store pushes as the safe choice. Each option id maps to a `nib` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
