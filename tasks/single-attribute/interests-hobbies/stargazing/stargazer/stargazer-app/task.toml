version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stargazer-app"
theme = "Stargazing: Active"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "leisure"
tags = [ "persona-adherence", "stargazer", "rule-based", "os-app", "computer-use",]

[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three Friday picks are stargazing plans (dark-sky drive, observatory night, meteor watch, star party) on a clear night when both kinds of plans are free."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with the NightOut Tkinter GUI baked in —
# see ./environment/Dockerfile. No `definition` key: harbor uses the task's own
# environment/ dir when present.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch NightOut once the desktop is up so the agent finds it on screen.
command = "/opt/stargazer/start-app.sh"
timeout_sec = 60.0
retries = 5
