version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stargazer-chat"
theme = "Stargazing: Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "leisure"
tags = [ "persona-adherence", "stargazer", "llm-judge",]

[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "At least two of the persona's three Friday picks are stargazing plans (dark-sky drive, observatory night, meteor watch, star party) on a clear night when both kinds of plans are free."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
