version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stargazer-survey"
theme = "Stargazing: Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "leisure"
tags = [ "persona-adherence", "stargazer", "rule-based",]

[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three Friday picks are stargazing plans (dark-sky drive, observatory night, meteor watch, star party) on a clear night when both kinds of plans are free."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
