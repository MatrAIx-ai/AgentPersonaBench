version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/stargazer-web"
theme = "Stargazing: Active"

[metadata]
difficulty = "medium"
type = "web"
domain = "leisure"
tags = [ "persona-adherence", "stargazer", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "hob_stargazing"
dimension_label = "Hobby: Stargazing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "At least two of the persona's three Friday picks are stargazing plans (dark-sky drive, observatory night, meteor watch, star party) on a clear night when both kinds of plans are free."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
