version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/whittler-survey"
theme = "Hobby: Whittling — Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "crafts"
tags = [ "persona-adherence", "whittler", "rule-based",]

[[checks]]
dimension_id = "hob_whittling"
dimension_label = "Hobby: Whittling"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The persona books the wood-carving sessions, raising that interest unprompted, even though the assistant only pushes household crafts."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
