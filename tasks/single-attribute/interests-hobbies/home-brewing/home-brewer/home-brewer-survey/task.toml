version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-brewer-survey"
theme = "Hobby: Home brewing — Active"

[metadata]
difficulty = "easy"
type = "survey"
domain = "market"
tags = [ "persona-adherence", "home-brewer", "rule-based",]

[[checks]]
dimension_id = "hob_home_brewing"
dimension_label = "Hobby: Home brewing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "rule-based"
adherence_signal = "The persona reserves the home-brewing supply stalls, raising that interest unprompted, even though the assistant only pushes food stalls."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
