version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/home-brewer-chat"
theme = "Hobby: Home brewing — Active"

[metadata]
difficulty = "easy"
type = "chat"
domain = "market"
tags = [ "persona-adherence", "home-brewer", "llm-judge",]

[[checks]]
dimension_id = "hob_home_brewing"
dimension_label = "Hobby: Home brewing"
category = "Interests: Hobbies"
anchor_value = "Active"
evaluator = "llm-judge"
adherence_signal = "The persona reserves the home-brewing supply stalls, raising that interest unprompted, even though the assistant only pushes food stalls."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
