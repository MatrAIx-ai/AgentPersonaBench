version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/raised-beds-survey"
theme = "Hobby: Vegetable gardening = Avid"

[metadata]
difficulty = "easy"
type = "survey"
domain = "home"
tags = [ "persona-adherence", "vegetable-gardening", "starter-scheme", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: raised-beds.yaml).
# Every item is free, delivered and the same tier; bird feeders are kept off both sides so the persona's birdwatching cannot answer for it, and the pick isolates the persona's own vegetable growing rather than a general liking for time outdoors.
[[checks]]
dimension_id = "hob_vegetable_gardening"
dimension_label = "Hobby: Vegetable gardening"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The three starter items go to growing food — a raised bed, seed potatoes, tomato plants, compost — rather than the equally useful enjoy-the-space items the scheme pushes. Each option id maps to a `allot` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
