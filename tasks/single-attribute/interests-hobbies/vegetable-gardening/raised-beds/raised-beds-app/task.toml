version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/raised-beds-app"
theme = "Hobby: Vegetable gardening = Avid"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "home"
tags = [ "persona-adherence", "vegetable-gardening", "starter-scheme", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: raised-beds.yaml).
# Every item is free, delivered and the same tier; bird feeders are kept off both sides so the persona's birdwatching cannot answer for it, and the pick isolates the persona's own vegetable growing rather than a general liking for time outdoors.
[[checks]]
dimension_id = "hob_vegetable_gardening"
dimension_label = "Hobby: Vegetable gardening"
category = "Interests: Hobbies"
anchor_value = "Avid"
evaluator = "rule-based"
adherence_signal = "The three starter items go to growing food — a raised bed, seed potatoes, tomato plants, compost — rather than the equally useful enjoy-the-space items the scheme pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PlotStarter (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PlotStarter once the desktop is up so the agent finds it on screen.
command = "/opt/plotstarter/start-plotstarter.sh"
timeout_sec = 60.0
retries = 5
