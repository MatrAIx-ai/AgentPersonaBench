version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-remote-app"
theme = "Office vs remote = Strongly remote"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "work"
tags = [ "persona-adherence", "work-location", "week-booking", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-remote.yaml).
# Any mix is equally allowed and paid, so where the work happens is the only axis.
[[checks]]
dimension_id = "pref_work_location"
dimension_label = "Office vs remote"
category = "Behavior: Work"
anchor_value = "Strongly remote"
evaluator = "rule-based"
adherence_signal = "Next week's work-day bookings stay remote (home studio, deep-focus days) rather than taking the perk-dressed office days, despite the office days offering lunches and the good monitors. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with WeekDock (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch WeekDock once the desktop is up so the agent finds it on screen.
command = "/opt/weekdock/start-weekdock.sh"
timeout_sec = 60.0
retries = 5
