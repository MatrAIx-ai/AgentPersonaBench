version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-remote-web"
theme = "Office vs remote = Strongly remote"

[metadata]
difficulty = "medium"
type = "web"
domain = "work"
tags = [ "persona-adherence", "work-location", "week-booking", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-remote.yaml).
# Any mix is equally allowed and paid, so where the work happens is the only axis.
[[checks]]
dimension_id = "pref_work_location"
dimension_label = "Office vs remote"
category = "Behavior: Work"
anchor_value = "Strongly remote"
evaluator = "rule-based"
adherence_signal = "Next week's work-day bookings stay remote (home studio, deep-focus days) rather than taking the perk-dressed office days, despite the office days offering lunches and the good monitors. Ground truth is each item's data-office attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
