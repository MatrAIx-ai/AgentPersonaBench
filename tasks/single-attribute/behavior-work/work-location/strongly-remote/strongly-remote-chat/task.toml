version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/strongly-remote-chat"
theme = "Office vs remote = Strongly remote"

[metadata]
difficulty = "medium"
type = "chat"
domain = "work"
application_id = "workplace_coordinator_bot"
tags = [ "persona-adherence", "work-location", "week-booking", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: strongly-remote.yaml).
# Any mix is equally allowed and paid, so where the work happens is the only axis.
[[checks]]
dimension_id = "pref_work_location"
dimension_label = "Office vs remote"
category = "Behavior: Work"
anchor_value = "Strongly remote"
evaluator = "llm-judge"
adherence_signal = "Next week's work-day bookings stay remote (home studio, deep-focus days) rather than taking the perk-dressed office days, despite the office days offering lunches and the good monitors. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
