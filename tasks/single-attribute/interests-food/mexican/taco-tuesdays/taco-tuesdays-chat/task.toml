version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taco-tuesdays-chat"
theme = "Cuisine: Mexican = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "delivery_app_concierge"
tags = [ "persona-adherence", "mexican-cuisine", "delivery-promo", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: taco-tuesdays.yaml).
# Every dish is free on the promotion, the same portion size and delivered hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Mexican food.
[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The three promo lunches are Mexican — tinga tacos, enchiladas, mole — rather than the equally good neutral-cuisine plates the app pushes as its kitchen-of-the-week picks. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
