version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taco-tuesdays-survey"
theme = "Cuisine: Mexican = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "mexican-cuisine", "delivery-promo", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: taco-tuesdays.yaml).
# Every dish is free on the promotion, the same portion size and delivered hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Mexican food.
[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three promo lunches are Mexican — tinga tacos, enchiladas, mole — rather than the equally good neutral-cuisine plates the app pushes as its kitchen-of-the-week picks. Each option id maps to a `cantina` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
