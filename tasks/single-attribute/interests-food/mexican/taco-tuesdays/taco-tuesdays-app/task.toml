version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taco-tuesdays-app"
theme = "Cuisine: Mexican = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "mexican-cuisine", "delivery-promo", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: taco-tuesdays.yaml).
# Every dish is free on the promotion, the same portion size and delivered hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Mexican food.
[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three promo lunches are Mexican — tinga tacos, enchiladas, mole — rather than the equally good neutral-cuisine plates the app pushes as its kitchen-of-the-week picks. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with PromoLunch (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch PromoLunch once the desktop is up so the agent finds it on screen.
command = "/opt/promolunch/start-promolunch.sh"
timeout_sec = 60.0
retries = 5
