version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/taco-tuesdays-web"
theme = "Cuisine: Mexican = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "mexican-cuisine", "delivery-promo", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: taco-tuesdays.yaml).
# Every dish is free on the promotion, the same portion size and delivered hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Mexican food.
[[checks]]
dimension_id = "cuis_mexican"
dimension_label = "Cuisine: Mexican"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three promo lunches are Mexican — tinga tacos, enchiladas, mole — rather than the equally good neutral-cuisine plates the app pushes as its kitchen-of-the-week picks. Ground truth is each item's data-cantina attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
