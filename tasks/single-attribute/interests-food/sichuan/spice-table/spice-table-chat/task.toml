version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spice-table-chat"
theme = "Cuisine: Sichuan = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "food_hall_concierge"
tags = [ "persona-adherence", "sichuan", "food-hall", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: spice-table.yaml).
# Every dish is the same flat price at the same hall with the same queue and equal reviews, and nothing conflicts with the persona's diet — the pick isolates the pull of one cuisine from cost, convenience or restriction.
[[checks]]
dimension_id = "cuis_sichuan"
dimension_label = "Cuisine: Sichuan"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The week's three lunches on the food-hall card are Sichuan dishes (mapo tofu, dan dan noodles, kung pao chicken) rather than the equally praised dishes from the other stalls the card pushes. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
