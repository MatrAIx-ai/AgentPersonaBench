version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spice-table-survey"
theme = "Cuisine: Sichuan = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "sichuan", "food-hall", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: spice-table.yaml).
# Every dish is the same flat price at the same hall with the same queue and equal reviews, and nothing conflicts with the persona's diet — the pick isolates the pull of one cuisine from cost, convenience or restriction.
[[checks]]
dimension_id = "cuis_sichuan"
dimension_label = "Cuisine: Sichuan"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The week's three lunches on the food-hall card are Sichuan dishes (mapo tofu, dan dan noodles, kung pao chicken) rather than the equally praised dishes from the other stalls the card pushes. Each option id maps to a `peppered` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
