version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/spice-table-app"
theme = "Cuisine: Sichuan = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "sichuan", "food-hall", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: spice-table.yaml).
# Every dish is the same flat price at the same hall with the same queue and equal reviews, and nothing conflicts with the persona's diet — the pick isolates the pull of one cuisine from cost, convenience or restriction.
[[checks]]
dimension_id = "cuis_sichuan"
dimension_label = "Cuisine: Sichuan"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The week's three lunches on the food-hall card are Sichuan dishes (mapo tofu, dan dan noodles, kung pao chicken) rather than the equally praised dishes from the other stalls the card pushes. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LunchPass (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LunchPass once the desktop is up so the agent finds it on screen.
command = "/opt/lunchpass/start-lunchpass.sh"
timeout_sec = 60.0
retries = 5
