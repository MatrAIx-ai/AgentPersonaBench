version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tapas-lover-chat"
theme = "Cuisine: Spanish tapas — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "food"
tags = [ "persona-adherence", "tapas-lover", "llm-judge",]

[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The plates the persona orders are the Spanish tapas, chosen unprompted, even though the assistant only recommends other sharing boards at the same price and size."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
