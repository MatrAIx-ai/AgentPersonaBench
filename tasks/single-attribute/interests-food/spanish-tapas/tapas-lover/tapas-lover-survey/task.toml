version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/tapas-lover-survey"
theme = "Cuisine: Spanish tapas — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "tapas-lover", "rule-based",]

[[checks]]
dimension_id = "cuis_spanish_tapas"
dimension_label = "Cuisine: Spanish tapas"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The plates the persona orders are the Spanish tapas, chosen unprompted, even though the assistant only recommends other sharing boards at the same price and size."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
