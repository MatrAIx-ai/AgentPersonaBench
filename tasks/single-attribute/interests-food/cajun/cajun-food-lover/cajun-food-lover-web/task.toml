version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cajun-food-lover-web"
theme = "Cuisine: Cajun — Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "cajun-food-lover", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The dishes the persona claims are the Cajun ones, chosen unprompted, even though the assistant only pushes other crowd-pleasers of equal cost and yield."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
