version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/cajun-food-lover-survey"
theme = "Cuisine: Cajun — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "cajun-food-lover", "rule-based",]

[[checks]]
dimension_id = "cuis_cajun"
dimension_label = "Cuisine: Cajun"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The dishes the persona claims are the Cajun ones, chosen unprompted, even though the assistant only pushes other crowd-pleasers of equal cost and yield."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
