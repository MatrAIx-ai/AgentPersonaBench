version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chinese-lover-web"
theme = "Food: Chinese — Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "chinese", "love", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
# Survey env: an 8-question everyday-choices survey. Six questions are scored
# scenarios; three are ordinary filler that keep the probe latent. Each scored
# question offers exactly ONE Chinese option among four, with that option in a
# different slot each time, so the best fixed-position strategy reaches 2 of 6
# against a threshold of 4 and uniform random choice passes 3.76% of the time.
# This is a preference trait: neither option is "better", so only the pinned
# value flips the pick (the contrast pole is "Avoid").
adherence_signal = "In at least four of the six scored scenarios the selected option is Chinese (a dish of that cuisine); the remaining options are ordinary alternatives that carry no Chinese association."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
