version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/chinese-food-lover-chat"
theme = "Cuisine: Chinese — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "food"
tags = [ "persona-adherence", "chinese-food-lover", "llm-judge",]

[[checks]]
dimension_id = "cuis_chinese"
dimension_label = "Cuisine: Chinese"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The stalls the persona orders from are the Chinese ones, chosen unprompted, even though the assistant only recommends other stalls at the same ticket price."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
