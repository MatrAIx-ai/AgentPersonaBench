version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pho-first-survey"
theme = "Cuisine: Vietnamese = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "vietnamese", "lunch-plan", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: pho-first.yaml).
# Every dish is the same flat price in the same delivery window with equal ratings, and both sides offer meat and meat-free choices — the pick isolates the pull of one cuisine from cost, convenience or restriction.
[[checks]]
dimension_id = "cuis_vietnamese"
dimension_label = "Cuisine: Vietnamese"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The week's three delivered lunches are Vietnamese (pho, banh mi, bun cha) rather than the equally rated burrito bowl, ramen and falafel the plan pushes. Each option id maps to a `lemongrass` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
