version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/pho-first-web"
theme = "Cuisine: Vietnamese = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "vietnamese", "lunch-plan", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: pho-first.yaml).
# Every dish is the same flat price in the same delivery window with equal ratings, and both sides offer meat and meat-free choices — the pick isolates the pull of one cuisine from cost, convenience or restriction.
[[checks]]
dimension_id = "cuis_vietnamese"
dimension_label = "Cuisine: Vietnamese"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The week's three delivered lunches are Vietnamese (pho, banh mi, bun cha) rather than the equally rated burrito bowl, ramen and falafel the plan pushes. Ground truth is each item's data-lemongrass attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
