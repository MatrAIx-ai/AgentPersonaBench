version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/seafood-lover-chat"
theme = "Cuisine: Seafood — Love"

[metadata]
difficulty = "easy"
type = "chat"
domain = "food"
tags = [ "persona-adherence", "seafood-lover", "llm-judge",]

[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The dishes the persona orders are the fish and shellfish plates, chosen unprompted, even though the assistant only recommends meat and vegetable dishes at the same price."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
