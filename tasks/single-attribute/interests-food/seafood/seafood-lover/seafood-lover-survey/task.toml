version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/seafood-lover-survey"
theme = "Cuisine: Seafood — Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "seafood-lover", "rule-based",]

[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The dishes the persona orders are the fish and shellfish plates, chosen unprompted, even though the assistant only recommends meat and vegetable dishes at the same price."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
