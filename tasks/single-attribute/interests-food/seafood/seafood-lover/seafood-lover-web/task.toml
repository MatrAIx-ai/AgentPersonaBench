version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/seafood-lover-web"
theme = "Cuisine: Seafood — Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "seafood-lover", "rule-based", "playwright", "real-web",]

[[checks]]
dimension_id = "cuis_seafood"
dimension_label = "Cuisine: Seafood"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The dishes the persona orders are the fish and shellfish plates, chosen unprompted, even though the assistant only recommends meat and vegetable dishes at the same price."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
# Reuses the shared Playwright image (Chromium + playwright python).
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
