version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/masala-menu-app"
theme = "Cuisine: Indian = Love"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "food"
tags = [ "persona-adherence", "indian-cuisine", "food-hall", "os-app", "computer-use",]

# Generated by evaluation/src/tools/task_gen (spec: masala-menu.yaml).
# Every dish is covered by the card, the same portion size and served hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Indian food.
[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three meal-card lunches are Indian — chana masala, dosa, biryani — rather than the equally good neutral-cuisine plates the food hall pushes as its weekly specials. Labels derive from the app's own host-side catalog; the app writes the artifact after real clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with LunchCard (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch LunchCard once the desktop is up so the agent finds it on screen.
command = "/opt/lunchcard/start-lunchcard.sh"
timeout_sec = 60.0
retries = 5
