version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/masala-menu-chat"
theme = "Cuisine: Indian = Love"

[metadata]
difficulty = "medium"
type = "chat"
domain = "food"
application_id = "food_hall_concierge"
tags = [ "persona-adherence", "indian-cuisine", "food-hall", "llm-judge",]

# Generated by evaluation/src/tools/task_gen (spec: masala-menu.yaml).
# Every dish is covered by the card, the same portion size and served hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Indian food.
[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "llm-judge"
adherence_signal = "The three meal-card lunches are Indian — chana masala, dosa, biryani — rather than the equally good neutral-cuisine plates the food hall pushes as its weekly specials. An LLM judge reads only the user's own turns."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
