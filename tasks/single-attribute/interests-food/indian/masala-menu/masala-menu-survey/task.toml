version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/masala-menu-survey"
theme = "Cuisine: Indian = Love"

[metadata]
difficulty = "easy"
type = "survey"
domain = "food"
tags = [ "persona-adherence", "indian-cuisine", "food-hall", "rule-based", "choice-based",]

# Generated by evaluation/src/tools/task_gen (spec: masala-menu.yaml).
# Every dish is covered by the card, the same portion size and served hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Indian food.
[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three meal-card lunches are Indian — chana masala, dosa, biryani — rather than the equally good neutral-cuisine plates the food hall pushes as its weekly specials. Each option id maps to a `cardamom` label in tests/answer_key.yaml, host-side only."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
