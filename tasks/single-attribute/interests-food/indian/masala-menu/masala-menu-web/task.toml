version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/masala-menu-web"
theme = "Cuisine: Indian = Love"

[metadata]
difficulty = "medium"
type = "web"
domain = "food"
tags = [ "persona-adherence", "indian-cuisine", "food-hall", "rule-based", "playwright", "real-web",]

# Generated by evaluation/src/tools/task_gen (spec: masala-menu.yaml).
# Every dish is covered by the card, the same portion size and served hot, and nothing on either side contains pork or alcohol; the other side is drawn only from cuisines the persona rates neutral, so the pick isolates the persona's own taste for Indian food.
[[checks]]
dimension_id = "cuis_indian"
dimension_label = "Cuisine: Indian"
category = "Interests: Food"
anchor_value = "Love"
evaluator = "rule-based"
adherence_signal = "The three meal-card lunches are Indian — chana masala, dosa, biryani — rather than the equally good neutral-cuisine plates the food hall pushes as its weekly specials. Ground truth is each item's data-cardamom attribute, read back from the real DOM after clicks."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
definition = "application/shared-web-playwright"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
network_mode = "public"
