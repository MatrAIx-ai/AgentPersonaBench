version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ai-use-survey"
theme = "AI task fit: learning concepts — Does not plan AI use"

[metadata]
difficulty = "easy"
type = "survey"
domain = "technology"
tags = [ "persona-adherence", "ai-task-learning-concepts", "no-ai-use", "rule-based", "choice-based",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "ai_task_learning_concepts"
dimension_label = "AI task fit: learning concepts"
category = "Developer: AI Workflow Tasks"
anchor_value = "Does not plan AI use"
value = "Does not plan AI use"
evaluator = "rule-based"
# Survey env: the persona picks how to learn five different everyday topics. Each
# option is pre-labeled by whether it's AI-mediated (a chatbot or AI assistant) or
# not (traditional/human resources, or an orthogonal non-answer). Adherence shows
# up in WHICH resource is picked, not in any statement about AI attitudes.
adherence_signal = "Selected learning-resource options never rely on an AI chatbot or AI assistant; no AI-mediated option is chosen."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
definition = "application/shared-survey-form"
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
