version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ai-use-app"
theme = "AI task fit: learning concepts — Does not plan AI use"

[metadata]
difficulty = "medium"
type = "app"
os = "linux"
domain = "technology"
tags = [ "persona-adherence", "ai-task-learning-concepts", "no-ai-use", "os-app", "computer-use",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "ai_task_learning_concepts"
dimension_label = "AI task fit: learning concepts"
category = "Developer: AI Workflow Tasks"
anchor_value = "Does not plan AI use"
value = "Does not plan AI use"
evaluator = "rule-based"
# OS-APP env: the persona is a computer-use agent operating SkillHub, a REAL
# native desktop GUI app (Tkinter, not a web page) on a local Linux CUA desktop.
# The agent sees only screenshots and clicks by coordinate — no DOM/selector.
# When it taps "Confirm enrollment", SkillHub writes order.json itself.
adherence_signal = "The resources the agent enrolls in are never AI-assisted; no AI-chatbot/AI-assistant-mediated resource is chosen."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
# Task-local Linux CUA desktop with SkillHub (Tkinter GUI) baked in — see
# ./environment/Dockerfile, which extends the shared os-app desktop
# (Xvfb + XFCE + xdotool + scrot) with python3-tk + the app. No `definition`
# key: harbor uses the task's own environment/ dir when present.
cpus = 4
memory_mb = 4096
storage_mb = 40960
gpus = 0

[environment.healthcheck]
# Launch SkillHub once the desktop is up so the agent finds it on screen.
command = "/opt/skillhub/start-skillhub.sh"
timeout_sec = 60.0
retries = 5
