version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "personabench/no-ai-use-chat"
theme = "AI task fit: learning concepts — Does not plan AI use"

[metadata]
difficulty = "easy"
type = "chat"
domain = "technology"
tags = [ "persona-adherence", "ai-task-learning-concepts", "no-ai-use", "llm-judge", "anchor-vs-contrast",]

# --- Persona-adherence check(s) --------------------------------------------- #
# Each check isolates one (attribute = value) pair the task measures. The persona
# carries the value; the evaluator returns HELD / VIOLATED from the agent's behavior.
[[checks]]
dimension_id = "ai_task_learning_concepts"
dimension_label = "AI task fit: learning concepts"
category = "Developer: AI Workflow Tasks"
anchor_value = "Does not plan AI use"
value = "Does not plan AI use"
evaluator = "llm-judge"
adherence_signal = "The persona's own chat turns show them settling on human-authored course materials to learn a new topic, even as the concierge repeatedly recommends its AI Tutor feature."

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
definition = "application/shared-chat-persona"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
