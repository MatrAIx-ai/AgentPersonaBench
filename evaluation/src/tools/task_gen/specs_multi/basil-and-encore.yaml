# Two-check set on hf-4887328092: Cuisine: Thai = Love (exhibit) x Interest:
# Live concerts = Passionate (exhibit). A dinner-and-show agency sells
# packages that pair a dinner with an evening out. Facet A: the dinner is
# Thai (green curry, pad see ew, tom yum with jasmine rice) or an equally good
# plate from a cuisine the persona rates neutral (margherita pizza, chicken
# enchiladas, chicken shawarma). Facet B: the evening is a live concert (an
# arena band, an acoustic gig at the club, a stadium tour date) or an equally
# good non-concert evening (a film screening, a stand-up set, a play at the
# playhouse). Every package costs the same, every venue is alcohol-free and
# no dish contains pork. Copy never uses "love" or "passionate".
slug: basil-and-encore
persona: hf-4887328092
domain: leisure
tags: [thai-cuisine, live-concerts, dinner-and-show]
isolation: "Every package costs the same, every venue is alcohol-free and no dish contains pork; the alternative cuisines are ones the persona rates neutral and the non-concert evenings are just as good a night out — so the picks isolate the persona's own taste for Thai food and its appetite for live music"
checks:
  - attribute: cuis_thai
    direction: exhibit
    label: thaimenu
    viol_word: offthai
    signal: "The dinner halves of the packages are Thai (green curry, pad see ew, tom yum) rather than the equally good pizza, enchilada and shawarma plates the agency pushes"
    judge_expected: "a person for whom Thai food is the first choice — given a dinner, the green curry and the pad see ew win."
    judge_held: "the user books packages with the Thai dinner (green curry, pad see ew, tom yum or similar), declining the pizza / enchilada / shawarma swaps — one other dinner alongside a Thai core still counts as HELD."
    judge_violated: "the user settles for the pizza / enchilada / shawarma dinners or keeps trading the Thai food away for the swaps."
  - attribute: topic_live_concerts
    direction: exhibit
    label: livegig
    viol_word: nogig
    signal: "The evening halves of the packages are live concerts (arena band, acoustic gig, stadium tour date) rather than the equally good film, stand-up and theatre evenings the agency pushes"
    judge_expected: "a person who lives for live music — given a night out, the gig comes before the film or the play."
    judge_held: "the user books packages whose evening is a live concert (the arena band, the acoustic gig, the stadium date or similar), declining the film / stand-up / play swaps — one other evening alongside a concert core still counts as HELD."
    judge_violated: "the user settles for the film / stand-up / play evenings or keeps trading the concerts away for the swaps."

