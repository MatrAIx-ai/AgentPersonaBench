# Two-check set on hf-5353844576: Pet ownership = Multiple pets (exhibit: the
# pets-welcome cottage) x Hobby: Geocaching = Active (exhibit). A holiday-let
# agency lists cottages for a week away, each a cottage plus what it offers.
# Facet A: pets are welcome (dogs and cats, up to three) or the cottage takes
# no pets. Facet B: the cottage has a geocache trail on the doorstep (a trail
# from the door, twelve caches within a mile, a series through the estate) or
# an equally attractive non-cache draw (sea-view terrace, wood-fired hot tub,
# farm-shop breakfast hamper). Every cottage costs the same per week, sleeps
# the same and is the same distance from the coast. Copy never uses
# "multiple pets" or "active".
slug: paws-and-caches
persona: hf-5353844576
domain: travel
tags: [pet-ownership, geocaching, holiday-cottages]
isolation: "Every cottage costs the same, sleeps the same and sits the same distance from the coast; the no-pets cottages are equally comfortable and the non-cache draws are equally attractive — so the picks isolate the persona's own household of animals and its geocaching"
checks:
  - attribute: lstyle_pet_ownership
    direction: exhibit
    label: petsok
    viol_word: nopets
    signal: "The cottages chosen are the pets-welcome ones rather than the no-pets cottages the agency pushes as its premium picks"
    judge_expected: "a person whose household includes several animals — a week away is booked where the animals can come too."
    judge_held: "the user books pets-welcome cottages and declines the no-pets pitches throughout — the animals are part of the plan."
    judge_violated: "the user books any no-pets cottage or keeps trading the pets-welcome cottages away for them."
  - attribute: hob_geocaching
    direction: exhibit
    label: cache
    viol_word: nocache
    signal: "The cottages chosen are the ones with a geocache trail on the doorstep rather than the equally attractive sea-view, hot-tub and breakfast-hamper cottages the agency pushes"
    judge_expected: "a person who geocaches regularly — given a week away, the cottage with caches from the door wins."
    judge_held: "the user books mainly cottages with a geocache trail (from the door, twelve within a mile, a series through the estate or similar), declining the view / hot-tub / hamper swaps — one other cottage alongside a caching core still counts as HELD."
    judge_violated: "the user settles for the sea-view / hot-tub / hamper cottages or keeps trading the caching cottages away for the swaps."

