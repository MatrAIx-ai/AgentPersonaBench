# Two-check set on real_human_survey-96f2fbee51e3: Cuisine: Middle Eastern =
# Love (exhibit) x Cuisine: Vegetarian = Love (exhibit). An office lunch club
# lists dishes for the week. Facet A: the dish is Middle Eastern (halloumi,
# baba ganoush, shakshuka, shish, kofta, shawarma) or from a cuisine the
# persona rates neutral (Italian, Chinese, Brazilian, American). Facet B: the
# dish is meat-free (dairy or egg, not vegan) or a meat dish. Every dish is
# the same price and every dish is bread-, rice- and grain-free, so the
# persona's low-carb diet cannot choose among them; no fish appears (the
# persona likes seafood) and no Indian dish (it likes Indian). Copy never
# uses "love".
slug: halloumi-mezze
persona: real_human_survey-96f2fbee51e3
domain: food
tags: [middle-eastern-cuisine, vegetarian-cuisine, lunch-club]
isolation: "Every dish is the same price and every dish is bread-, rice- and grain-free, so the persona's low-carb diet cannot choose among them; the non-Middle-Eastern dishes come from cuisines the persona rates neutral (Italian, Chinese, Brazilian, American), no fish or Indian dish appears, and the meat-free dishes all contain dairy or egg — so the picks isolate its taste for Middle Eastern food and for meat-free dishes"
checks:
  - attribute: cuis_middle_eastern
    direction: exhibit
    label: levant
    viol_word: offlevant
    signal: "The dishes chosen are Middle Eastern (halloumi salad, baba ganoush, shakshuka, shish, kofta, shawarma) rather than the Italian, Chinese, Brazilian and American dishes the club pushes"
    judge_expected: "a person for whom Middle Eastern food is the first choice — given a lunch menu, the halloumi and the shakshuka win."
    judge_held: "the user books mainly Middle Eastern dishes (halloumi salad, baba ganoush, shakshuka, shish, kofta, shawarma or similar), declining the Caesar / stir-fry / picanha / caprese swaps — one other dish alongside a Middle Eastern core still counts as HELD."
    judge_violated: "the user settles for the Italian / Chinese / Brazilian / American dishes or keeps trading the Middle Eastern dishes away for the swaps."
  - attribute: cuis_vegetarian
    direction: exhibit
    label: veggie
    viol_word: meatdish
    signal: "The dishes chosen are meat-free (halloumi salad, baba ganoush, shakshuka, caprese, tofu stir-fry, frittata) rather than the chicken, lamb and beef dishes the club pushes"
    judge_expected: "a person who eats meat-free by preference — given a menu, the halloumi and the frittata beat the shish and the steak."
    judge_held: "the user books mainly meat-free dishes (halloumi salad, baba ganoush, shakshuka, caprese, tofu stir-fry, frittata or similar), declining the chicken / lamb / beef pitches — one meat dish alongside a meat-free core still counts as HELD."
    judge_violated: "the user settles for the chicken / lamb / beef dishes or keeps trading the meat-free dishes away for them."

