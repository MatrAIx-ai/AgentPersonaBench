# Two-check set on hf-5170042772: Hobby: Bouldering = Avid (exhibit) x Hobby:
# Metalworking = Avid (exhibit). A maker-and-movement centre sells evening
# passes that bundle a fitness slot with a workshop slot. Facet A: the fitness
# slot is bouldering (open bouldering, problem clinic, bouldering hour) or an
# equally sweaty alternative the persona rates neutral (rowing-machine class,
# swim session, circuits). Facet B: the workshop slot is metalworking
# (blacksmithing intro, welding taster, knife-forging bench) or an equally
# hands-on craft the persona rates neutral (pottery wheel, screen printing,
# woodturning). Every pass costs the same and both slots are the same length.
# Copy never uses "avid".
slug: forge-and-wall
persona: hf-5170042772
domain: leisure
tags: [bouldering, metalworking, maker-evenings]
isolation: "Every evening pass costs the same and both slots are the same length; the alternative fitness slots are just as physical and the alternative crafts just as hands-on — so the picks isolate the persona's own bouldering and its metalworking"
checks:
  - attribute: hob_bouldering
    direction: exhibit
    label: boulder
    viol_word: offwall
    signal: "The fitness halves of the evening passes are bouldering slots (open bouldering, problem clinic, bouldering hour) rather than the equally sweaty rowing, swim and circuits slots the centre pushes"
    judge_expected: "a person who boulders as often as they can — offered a fitness slot, the wall wins."
    judge_held: "the user books passes whose fitness slot is bouldering (open bouldering, the problem clinic, the bouldering hour or similar), declining the rowing / swim / circuits swaps — one other slot alongside a bouldering core still counts as HELD."
    judge_violated: "the user settles for the rowing / swim / circuits slots or keeps trading the bouldering away for the swaps."
  - attribute: hob_metalworking
    direction: exhibit
    label: forge
    viol_word: offforge
    signal: "The workshop halves of the evening passes are metalworking (blacksmithing, welding, knife forging) rather than the equally hands-on pottery, screen-printing and woodturning slots the centre pushes"
    judge_expected: "a person who works metal every chance they get — offered a workshop slot, the forge wins."
    judge_held: "the user books passes whose workshop slot is metalworking (blacksmithing, welding, knife forging or similar), declining the pottery / printing / woodturning swaps — one other craft alongside a metalworking core still counts as HELD."
    judge_violated: "the user settles for the pottery / printing / woodturning slots or keeps trading the metalworking away for the swaps."

