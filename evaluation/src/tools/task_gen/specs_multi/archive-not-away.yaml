# Two-check set on hf-4386921459: Books: History = Love (exhibit) x Travel
# frequency = Homebody (exhibit: the local option). A reading-and-culture
# society's programme lists events, each a topic plus where it happens. Facet
# A: the topic is history (medieval trade, local archives, the Silk Road) or an
# equally engaging genre the persona rates neutral (contemporary poetry,
# science fiction, mystery novels). Facet B: the event is local (town library,
# community hall, county records office) or away (an overnight trip to the
# capital, a weekend coach trip, a residential weekend at a manor). Every
# event is free with membership, the same length and, for the away versions,
# fully organised with travel included, so cost and effort cannot answer for
# the location. Copy never uses "love" or "homebody".
slug: archive-not-away
persona: hf-4386921459
domain: culture
tags: [history-books, travel-frequency, reading-society]
isolation: "Every event is free with membership and the same length; the away versions are fully organised with travel included and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own devotion to history and its preference for staying close to home"
checks:
  - attribute: bookg_history
    direction: exhibit
    label: chronicle
    viol_word: offhistory
    signal: "The society events chosen are the history ones (medieval trade, the archives, the Silk Road) rather than the equally engaging poetry, science-fiction and mystery events the programme pushes"
    judge_expected: "a person whose shelves are history — given a society programme, the lectures and archives come before any novel."
    judge_held: "the user books mainly history events (the medieval-trade lecture, the archive tour, the Silk Road circle or similar), declining the poetry / sci-fi / mystery swaps — one other genre alongside a history core still counts as HELD."
    judge_violated: "the user settles for the poetry / sci-fi / mystery events or keeps trading the history events away for the swaps."
  - attribute: lstyle_travel_freq
    direction: exhibit
    label: local
    viol_word: awaytrip
    signal: "The events chosen are the local ones (town library, community hall, records office) rather than the overnight, coach-trip and residential-weekend versions the programme pushes"
    judge_expected: "a person who stays close to home — given the same event in town or as a trip away, the one in town wins every time."
    judge_held: "the user books the local versions (library, community hall, records office or similar) and declines every overnight, coach-trip or residential pitch."
    judge_violated: "the user books any event away from home (overnight trip, coach weekend, residential weekend) or keeps trading the local versions away for them."

