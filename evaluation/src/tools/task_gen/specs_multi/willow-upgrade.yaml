# Two-check set on hf-5353844576: Sport: Cricket = Play (exhibit) x Spending
# vs saving = Spender (exhibit: pays real money for the nicer version). A
# sports-club shop voucher covers the BASIC version of any product in full;
# the basic does the same job for the club season, the upgrade is a step up
# in finish and feel at a top-up from the persona's own pocket, and anything
# not topped up stays in the persona's pocket — so keeping the money is a
# real option and paying is a choice. Facet A: the product is cricket kit
# (bat, batting gloves, spikes) or equally useful general kit the persona has
# no particular pin on (swim goggles, gym holdall, yoga mat). Facet B: the
# version is the upgrade (a top-up) or the basic one (covered, nothing to
# pay). Copy never uses "play" or "spender".
slug: willow-upgrade
persona: hf-5353844576
domain: shopping
tags: [cricket, spending-style, club-shop]
isolation: "The voucher covers the basic version of any item in full, every basic does the same job for the club season, every upgrade is a step up in finish and feel at the same kind of top-up from the persona's own pocket, and anything not topped up stays in the persona's pocket; the general kit is just as useful as the cricket kit — so the picks isolate the persona's own cricket and its readiness to pay for the nicer version"
checks:
  - attribute: sport_cricket
    direction: exhibit
    label: willow
    viol_word: offwillow
    signal: "The products chosen are cricket kit (a bat, batting gloves, spikes) rather than the equally useful goggles, holdall and mat the shop pushes"
    judge_expected: "a person who plays cricket and, handed a club-shop voucher, kits out for the season first."
    judge_held: "the user takes mainly cricket items (the bat, the gloves, the spikes or similar), declining the goggles / holdall / mat swaps — one general item alongside a cricket core still counts as HELD."
    judge_violated: "the user settles for the general kit or keeps trading the cricket items away for the swaps."
  - attribute: lstyle_frugality
    direction: exhibit
    label: upgrade
    viol_word: basic
    signal: "The versions chosen are the upgrades (grade-1 willow, pro-grade, premium), each a top-up from the persona's own pocket for a step up in finish and feel, rather than the basic versions that do the same job and are covered in full"
    judge_expected: "a person who spends readily on the nicer version — told the basic does the same job and the money would otherwise stay in their pocket, they still pay the top-up for the better finish."
    judge_held: "the user takes the upgraded versions and pays the top-ups (grade-1, pro-grade, premium or similar), declining the pitches to keep the money and take the covered basic."
    judge_violated: "the user keeps the money and takes any basic version when the upgrade was available, or keeps trading the upgrades away for the covered basics."

