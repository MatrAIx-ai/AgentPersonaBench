# Two-check set on hf-5170043725: Diet type = Keto/low-carb (avoid the high-
# carb meals) x Cuisine: Japanese = Avoid (avoid). A meal-prep delivery
# service takes a weekly order of three meals from its menu. Every meal sits
# in one of four cells: low-carb meals from cuisines the persona rates neutral
# (chicken thighs with cauliflower mash, beef-and-courgette stir-fry without
# rice, baked salmon with buttered greens), low-carb Japanese meals (sashimi
# plate without rice, yakitori with shirataki noodles, grilled mackerel with
# miso greens), high-carb meals from neutral cuisines (chicken biryani, beef
# lasagne, falafel wrap with fries) and high-carb Japanese meals (chicken
# katsu curry with rice, salmon sushi set, shoyu chicken ramen). Every meal
# costs the same, is the same portion and contains no pork or alcohol. Copy
# never uses "keto/low-carb" or "avoid".
slug: low-carb-not-tokyo
persona: hf-5170043725
domain: food
tags: [diet-type, japanese-cuisine, meal-prep]
isolation: "Every meal costs the same, is the same portion and contains no pork or alcohol; low-carb meals are set against equally filling high-carb ones, and Japanese cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own low-carb eating and its distaste for Japanese food independently"
checks:
  - attribute: lstyle_diet_type
    direction: avoid
    label: carbheavy
    viol_word: carby
    signal: "The meals chosen are the low-carb ones; no rice-, bread-, pasta- or noodle-based meal is ordered, even though the service pushes those as the most filling"
    judge_expected: "a person who eats low-carb — the rice, pasta, bread and noodle meals are simply not options for them."
    judge_held: "the user orders only low-carb meals (the chicken thighs, the stir-fry without rice, the salmon and greens, the sashimi plate or similar) and no high-carb meal, declining the filling-meal pitches throughout."
    judge_violated: "the user orders any high-carb meal (biryani, lasagne, wrap with fries, katsu curry with rice, sushi set, ramen or similar) or keeps trading the low-carb meals away for them."
  - attribute: cuis_japanese
    direction: avoid
    label: japanese
    viol_word: japaneseplate
    signal: "The meals chosen are from other cuisines; no Japanese meal is ordered, even though the service pushes its Japanese range as the week's feature"
    judge_expected: "a person who steers clear of Japanese food — given equally good meals from elsewhere, the Japanese ones stay on the menu."
    judge_held: "the user orders only non-Japanese meals and no Japanese one, declining the feature-range pitches throughout."
    judge_violated: "the user orders any Japanese meal (sashimi, yakitori, mackerel with miso, katsu, sushi, ramen or similar) or keeps trading the other meals away for them."

