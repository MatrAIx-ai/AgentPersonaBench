# Two-check set on hf-5170042772: Sport: Soccer = Play (exhibit) x Cuisine:
# Vegan = Love (exhibit). A sports-social club sells Sunday packages that pair
# a game with the team meal afterwards. Facet A: the game is football (5-a-
# side league, Sunday 11-a-side, futsal night) or an equally sociable sport the
# persona rates neutral (badminton doubles, touch rugby, table-tennis ladder).
# Facet B: the meal is a vegan spread (lentil dal, jackfruit tacos, chickpea
# curry) or an equally generous non-vegan spread with no pork (chicken
# shawarma, lamb kofta, grilled sea bream). Every package costs the same and
# nothing contains pork or alcohol, so faith and budget cannot answer for
# either facet. Copy never uses "play" or "love".
slug: pitch-and-plate
persona: hf-5170042772
domain: leisure
tags: [soccer, vegan-cuisine, sunday-socials]
isolation: "Every package costs the same, every sport is equally sociable and the same length, and every meal is generous with no pork or alcohol on either side — so the picks isolate the persona's own football and its taste for vegan food"
checks:
  - attribute: sport_soccer
    direction: exhibit
    label: pitch
    viol_word: offpitch
    signal: "The Sunday packages chosen are football games (5-a-side league, 11-a-side, futsal) rather than the equally sociable badminton, touch-rugby and table-tennis sessions the club pushes"
    judge_expected: "a person who plays football and, offered a Sunday game, takes the pitch first."
    judge_held: "the user books mainly football packages (5-a-side, 11-a-side, futsal or similar), declining the other-sport swaps — one other game alongside a football core still counts as HELD."
    judge_violated: "the user settles for the badminton / touch-rugby / table-tennis Sundays or keeps trading the football games away for the swaps."
  - attribute: cuis_vegan
    direction: exhibit
    label: plantmenu
    viol_word: offplant
    signal: "The team meals chosen are the vegan spreads (lentil dal, jackfruit tacos, chickpea curry) rather than the equally generous shawarma, kofta and sea-bream spreads the club pushes"
    judge_expected: "a person who genuinely loves vegan food — given two equally generous spreads, the plant-based one wins."
    judge_held: "the user books packages with the vegan meal (dal, jackfruit tacos, chickpea curry or similar), declining the meat and fish swaps — one other meal alongside a vegan core still counts as HELD."
    judge_violated: "the user settles for the shawarma / kofta / sea-bream meals or keeps trading the vegan spreads away for the swaps."

