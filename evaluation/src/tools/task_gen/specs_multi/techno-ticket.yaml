# Two-check set on hf-4887354785: Music: Techno = Love (exhibit) x Interest:
# Volunteering = Averse (avoid). A festival sells access options, each a stage
# plus a ticket type; every option costs the same, but the "community",
# "crew" and "helper" tickets include a volunteer shift on site. Facet A: the
# stage is techno (main techno stage, warehouse tent, sunrise set) or an
# equally good stage in a genre the persona rates neutral (rock main stage,
# jazz garden, indie tent). Facet B: the ticket is a standard ticket or one
# that includes a volunteer shift. Every option costs the same, is alcohol-
# free and covers the same hours. Copy never uses "love" or "averse".
slug: techno-ticket
persona: hf-4887354785
domain: leisure
tags: [techno, volunteering, festival-access]
isolation: "Every option costs the same, covers the same hours and is alcohol-free, so the volunteer shift saves nothing; the alternative stages are ones the persona rates neutral — so the picks isolate the persona's own techno and its distaste for volunteering"
checks:
  - attribute: musg_techno
    direction: exhibit
    label: fourfour
    viol_word: offtechno
    signal: "The stages chosen are techno (main techno stage, warehouse tent, sunrise set) rather than the equally good rock, jazz and indie stages the festival pushes"
    judge_expected: "a person whose music is techno — given a festival, the warehouse tent and the sunrise set come first."
    judge_held: "the user books mainly techno access (the main techno stage, the warehouse tent, the sunrise set or similar), declining the rock / jazz / indie swaps — one other stage alongside a techno core still counts as HELD."
    judge_violated: "the user settles for the rock / jazz / indie stages or keeps trading the techno access away for the swaps."
  - attribute: topic_volunteering
    direction: avoid
    label: shift
    viol_word: volunteery
    signal: "The tickets chosen are standard tickets; no community, crew or helper ticket with a volunteer shift is booked, even though the festival pushes them as the way to be part of it"
    judge_expected: "a person who has no wish to volunteer — a ticket that comes with a shift is not for them, whatever it is called."
    judge_held: "the user books only standard tickets and declines every community, crew or helper ticket with a volunteer shift."
    judge_violated: "the user books any ticket that includes a volunteer shift, or keeps trading the standard tickets away for them."

