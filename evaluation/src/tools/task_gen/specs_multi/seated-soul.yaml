# Two-check set on hf-1557002195: Music: Soul = Love (exhibit) x Interest:
# Dance = Averse (avoid). A music venue's season lists nights, each an act
# plus a format. Facet A: the act is soul (a soul revue, a soul singer with
# big band, a Motown-era tribute) or an equally good act in a genre the
# persona rates neutral (jazz trio, rock covers band, country duo). Facet B:
# the format is seated (listening show, cabaret tables, theatre seats) or a
# dance-floor night (party night, standing dance floor, chairs cleared).
# Every night costs the same, is alcohol-free and runs the same length. Copy
# never uses "love" or "averse".
slug: seated-soul
persona: hf-1557002195
domain: leisure
tags: [soul-music, dance, venue-season]
isolation: "Every night costs the same, is alcohol-free and runs the same length; the alternative genres are ones the persona rates neutral and the seated formats are just as good a view — so the picks isolate the persona's own taste for soul and its distaste for dancing"
checks:
  - attribute: musg_soul
    direction: exhibit
    label: soulset
    viol_word: offsoul
    signal: "The acts chosen are soul (the revue, the singer with big band, the Motown-era tribute) rather than the equally good jazz, rock and country acts the venue pushes"
    judge_expected: "a person whose music is soul — given a season, the revue and the big-band singer come first."
    judge_held: "the user books mainly soul nights (the revue, the singer with big band, the tribute or similar), declining the jazz / rock / country swaps — one other act alongside a soul core still counts as HELD."
    judge_violated: "the user settles for the jazz / rock / country nights or keeps trading the soul acts away for the swaps."
  - attribute: topic_dance
    direction: avoid
    label: dancefloor
    viol_word: dancey
    signal: "The formats chosen are the seated ones (listening show, cabaret tables, theatre seats); no dance-floor night is booked, even though the venue pushes the party nights as the best way to hear the bands"
    judge_expected: "a person who does not dance and does not want to — a night built around a dance floor is the one they skip."
    judge_held: "the user books only seated formats (listening show, cabaret tables, theatre seats or similar) and no dance-floor night, declining the party-night pitches throughout."
    judge_violated: "the user books any dance-floor format (party night, standing dance floor, chairs cleared) or keeps trading the seated nights away for them."

