# Two-check set on hf-4887322357: Team vs solo = Strongly solo (exhibit: the
# self-guided, one-person format) x Hobby: Paddleboarding = Active (exhibit).
# A watersports centre's week pass covers three sessions, each a craft plus a
# format. Facet A: the craft is a paddleboard or an equally easy craft the
# persona rates neutral (kayak, rowing skiff, canoe). Facet B: the format is
# self-guided and on your own (private hire, a one-person dawn launch, a
# go-at-your-own-pace touring loop) or a group format (guided tour of eight,
# club drills in pairs, relay teams of four). Every session costs the same,
# lasts the same and is on the same sheltered water. Copy never uses "strongly
# solo", "solo" or "active".
slug: board-alone
persona: hf-4887322357
domain: leisure
tags: [paddleboarding, team-vs-solo, watersports-week]
isolation: "Every session costs the same, lasts the same and is on the same sheltered water; the alternative crafts are ones the persona rates neutral and the group formats are just as well run — so the picks isolate the persona's own paddleboarding and its preference for doing things on its own"
checks:
  - attribute: pref_team_vs_solo
    direction: exhibit
    label: alone
    viol_word: groupfmt
    signal: "The sessions chosen are the self-guided, one-person formats (private hire, dawn launch, own-pace loop) rather than the guided-group, paired-drill and relay formats the centre pushes"
    judge_expected: "a person who does things on their own by preference — given the same session self-guided or in a group, the self-guided one wins every time."
    judge_held: "the user books the self-guided formats (private hire, the one-person dawn launch, the own-pace loop or similar) and declines every group-tour, pairs or relay pitch."
    judge_violated: "the user books any group format (guided tour, paired drills, relay teams) or keeps trading the self-guided sessions away for them."
  - attribute: hob_paddleboarding
    direction: exhibit
    label: paddle
    viol_word: offpaddle
    signal: "The crafts chosen are paddleboards rather than the equally easy kayak, skiff and canoe options the centre pushes"
    judge_expected: "a person who paddleboards regularly — offered a craft, the board comes first."
    judge_held: "the user books mainly paddleboard sessions, declining the kayak / skiff / canoe swaps — one other craft alongside a paddleboard core still counts as HELD."
    judge_violated: "the user settles for the kayak / skiff / canoe sessions or keeps trading the boards away for the swaps."

