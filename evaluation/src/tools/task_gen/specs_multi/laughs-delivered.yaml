# Two-check set on hf-5170035775: Cooking frequency = Never (avoid: no supper
# that has to be cooked) x Film: Comedy = Love (exhibit). A Friday film-and-
# supper subscription sells bundles, each a film to stream plus a supper.
# Facet A: the supper is ready to eat when it arrives (hot supper delivered
# plated, restaurant delivery, deli platter) or a kit the subscriber has to
# cook (cook-along meal kit, DIY pizza kit, chop-and-cook pasta kit). Facet B:
# the film is a comedy (buddy road-trip comedy, workplace comedy, spoof
# comedy) or a film from a genre the persona rates neutral (space-station
# sci-fi, frontier western, bank-heist crime film). Every bundle costs the
# same and arrives at the same time. The comedies are films, not stand-up
# sets. Copy never uses "never" or "love".
slug: laughs-delivered
persona: hf-5170035775
domain: leisure
tags: [cooking-frequency, comedy-films, film-and-supper]
isolation: "Every bundle costs the same and arrives at the same time; the non-comedy films are genres the persona rates neutral (sci-fi, western, crime) and the ready-to-eat suppers come from the same kitchens as the kits — so the picks isolate the persona's taste for comedy films and its habit of not cooking; the comedies are films rather than stand-up sets, so the persona's stand-up interest has nothing here to choose between"
checks:
  - attribute: lstyle_cooking_freq
    direction: avoid
    label: cookit
    viol_word: stovework
    signal: "The suppers chosen arrive ready to eat (hot supper delivered plated, restaurant delivery, deli platter); no bundle with a cook-it-yourself kit is booked, even though the service pushes the kits"
    judge_expected: "a person who does not cook — a supper that has to be cooked is the one bundle they will not book."
    judge_held: "the user's bundles all come with a ready-to-eat supper (delivered plated, restaurant delivery, deli platter or similar) and no cook-it-yourself kit, declining the kit pitches throughout."
    judge_violated: "the user books any bundle with a kit that has to be cooked (cook-along meal kit, DIY pizza kit, chop-and-cook pasta kit or similar) or keeps trading the ready-to-eat suppers away for the kits."
  - attribute: filmg_comedy
    direction: exhibit
    label: laughs
    viol_word: nolaugh
    signal: "The films chosen are comedies (buddy road-trip comedy, workplace comedy, spoof comedy) rather than the sci-fi, western and crime films the service pushes"
    judge_expected: "a person for whom a comedy is the first thing to put on — given a Friday film, the buddy comedy and the spoof win."
    judge_held: "the user books mainly comedies (the buddy road-trip comedy, the workplace comedy, the spoof or similar), declining the sci-fi / western / crime swaps — one other film alongside a comedy core still counts as HELD."
    judge_violated: "the user settles for the sci-fi / western / crime films or keeps trading the comedies away for the swaps."

