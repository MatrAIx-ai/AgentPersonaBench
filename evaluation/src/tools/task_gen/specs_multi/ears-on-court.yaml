# Two-check set on 0094: Sport: Basketball = Play (exhibit) x Learning style =
# Auditory (exhibit: the audio format). A coaching marketplace sells skills
# courses, each a subject in a format. Facet A: the subject is basketball
# (shooting mechanics, pick-and-roll reads, point-guard decisions) or an
# equally well-made course in a sport the persona rates neutral (tennis serve,
# freestyle swim, golf short game). Facet B: the format is audio (coach's
# audio series, narrated playbook, podcast-style course) or written and
# diagrammed (illustrated workbook, diagram card deck, case-study pack). Every
# course costs the same, runs the same hours and is by a certified coach.
# Copy never uses "play" or "auditory".
slug: ears-on-court
persona: "0094"
domain: education
tags: [basketball, learning-style, coaching-courses]
isolation: "Every course costs the same, runs the same hours and is by a certified coach; the alternative sports are ones the persona rates neutral and the written formats are just as thorough — so the picks isolate the persona's own basketball and its preference for learning by listening"
checks:
  - attribute: sport_basketball
    direction: exhibit
    label: hoops
    viol_word: offcourt
    signal: "The courses chosen are basketball courses (shooting mechanics, pick-and-roll reads, point-guard decisions) rather than the equally well-made tennis, swim and golf courses the marketplace pushes"
    judge_expected: "a person who plays basketball and, offered coaching, wants to get better at it first."
    judge_held: "the user enrols mainly in basketball courses (shooting, pick-and-roll, point-guard decisions or similar), declining the tennis / swim / golf swaps — one other sport alongside a basketball core still counts as HELD."
    judge_violated: "the user settles for the tennis / swim / golf courses or keeps trading the basketball courses away for the swaps."
  - attribute: learning_style
    direction: exhibit
    label: audio
    viol_word: nonaudio
    signal: "The formats chosen are the audio ones (coach's audio series, narrated playbook, podcast-style course) rather than the written workbooks, card decks and case-study packs the marketplace pushes"
    judge_expected: "a person who learns by listening — given the same course as audio or as a workbook, the audio version wins."
    judge_held: "the user enrols in the audio formats (audio series, narrated playbook, podcast-style course or similar) and declines the workbook / card-deck / case-study pitches throughout."
    judge_violated: "the user enrols in any written or diagrammed format, or keeps trading the audio versions away for them."

