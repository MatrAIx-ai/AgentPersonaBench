# Two-check set on hf-5353844576: Music: Hip hop = Love (exhibit) x Music:
# Trance = Love (exhibit). A festival's wristband lets you reserve two-slot
# evenings, each a main-stage set plus a tent set. Facet A: the main stage is
# hip hop (headliner, rap collective, legends revue) or an equally big act in
# a genre the persona rates neutral (pop headliner, reggae legend, Latin big
# band). Facet B: the tent is trance (trance tent, sunrise trance tent, trance
# arena) or an equally good tent in a genre the persona rates neutral (disco,
# reggaeton, lo-fi chill). Every evening is free with the wristband and both
# slots are the same length. Copy never uses "love".
slug: two-stage-pass
persona: hf-5353844576
domain: leisure
tags: [hip-hop, trance, festival-wristband]
isolation: "Every evening is free with the wristband and both slots are the same length; the alternative main-stage and tent genres are ones the persona rates neutral — so the picks isolate the persona's own taste for hip hop and for trance independently"
checks:
  - attribute: musg_hip_hop
    direction: exhibit
    label: hiphop
    viol_word: offhiphop
    signal: "The main-stage halves of the evenings are hip hop (headliner, rap collective, legends revue) rather than the equally big pop, reggae and Latin sets the wristband desk pushes"
    judge_expected: "a person whose music is hip hop — given a festival evening, the rap headliner comes first."
    judge_held: "the user reserves evenings whose main-stage set is hip hop (the headliner, the collective, the legends revue or similar), declining the pop / reggae / Latin swaps — one other main stage alongside a hip-hop core still counts as HELD."
    judge_violated: "the user settles for the pop / reggae / Latin main stages or keeps trading the hip-hop sets away for the swaps."
  - attribute: musg_trance
    direction: exhibit
    label: tranceset
    viol_word: offtrance
    signal: "The tent halves of the evenings are trance (trance tent, sunrise trance, trance arena) rather than the equally good disco, reggaeton and lo-fi tents the desk pushes"
    judge_expected: "a person who lives for trance — given a late tent, the trance one wins."
    judge_held: "the user reserves evenings whose tent set is trance (the trance tent, the sunrise tent, the arena or similar), declining the disco / reggaeton / lo-fi swaps — one other tent alongside a trance core still counts as HELD."
    judge_violated: "the user settles for the disco / reggaeton / lo-fi tents or keeps trading the trance sets away for the swaps."

