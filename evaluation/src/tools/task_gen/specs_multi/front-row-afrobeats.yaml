# Two-check set on hf-4887322357: Spending vs saving = Splurger (exhibit:
# pays the top-up for the treat) x Music: Afrobeats = Love (exhibit). A
# season pass covers the STANDARD tier of any concert in full; the premium
# tier of each costs a top-up from the persona's own pocket (shown), so the
# premium seat is a real trade-off, not a free dominant choice. Facet A: the
# tier is premium (front row with lounge, VIP deck, stage-side table; a
# top-up) or standard (rear stalls, general admission, standing; covered,
# nothing to pay). Facet B: the act is afrobeats or a genre the persona rates
# neutral (jazz, indie, classical). Every venue is alcohol-free. Copy never
# uses "splurger" or "love".
slug: front-row-afrobeats
persona: hf-4887322357
domain: leisure
tags: [spending-style, afrobeats, concert-tickets]
isolation: "The season pass covers the standard tier of every concert in full and every premium tier costs the same kind of top-up from the persona's own pocket; every venue is alcohol-free; the alternative genres are ones the persona rates neutral and the standard tiers are perfectly good seats — so the picks isolate the persona's readiness to pay for the treat and its afrobeats"
checks:
  - attribute: lstyle_frugality
    direction: exhibit
    label: premium
    viol_word: basictier
    signal: "The tickets chosen are the premium tiers (front row with lounge, VIP deck, stage-side table), each a top-up from the persona's own pocket, rather than the perfectly good standard tiers the pass covers in full"
    judge_expected: "a person who happily pays for the treat — when the standard seat is covered and the premium tier costs a top-up, they take the premium tier."
    judge_held: "the user books the premium tiers and pays the top-ups (front row with lounge, VIP deck, stage-side table or similar), declining the covered-standard pitches throughout."
    judge_violated: "the user books any standard tier to avoid the top-up when a premium one was available, or keeps trading the premium tiers away for the covered seats."
  - attribute: musg_afrobeats
    direction: exhibit
    label: afrobeats
    viol_word: offbeat
    signal: "The acts chosen are afrobeats (headliner, festival day, live-band night) rather than the equally good jazz, indie and classical acts the agent pushes"
    judge_expected: "a person whose music is afrobeats — given a season of concerts, the afrobeats nights come first."
    judge_held: "the user books mainly afrobeats acts (the headliner, the festival day, the live-band night or similar), declining the jazz / indie / classical swaps — one other act alongside an afrobeats core still counts as HELD."
    judge_violated: "the user settles for the jazz / indie / classical nights or keeps trading the afrobeats acts away for the swaps."

