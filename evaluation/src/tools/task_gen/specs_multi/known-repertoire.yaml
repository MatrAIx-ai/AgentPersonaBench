# Two-check set on hf-6283061910: Music: Classical = Love (exhibit) x
# Adventurousness = Very low (exhibit: the well-known programme). A concert
# season's subscription lets you pick three concerts, each an act plus a
# programme. Facet A: the act is classical (symphony orchestra, chamber
# ensemble, piano recital) or an equally good act in a genre the persona
# rates neutral (indie band, afrobeats night, electronic live set). Facet B:
# the programme is the well-known one (the famous symphonies, the best-known
# quartets, the favourites, a greatest-hits set) or a novel one (a world
# premiere, an improvised experimental set, a surprise programme chosen on
# the night). Every concert costs the same, seats the same and runs the same
# length. Copy never uses "love", "very low" or the word "low".
slug: known-repertoire
persona: hf-6283061910
domain: leisure
tags: [classical-music, adventurousness, concert-season]
isolation: "Every concert costs the same, seats the same and runs the same length; the alternative genres are ones the persona rates neutral and the novel programmes are by the same performers — so the picks isolate the persona's own taste for classical music and its preference for the familiar over the untried"
checks:
  - attribute: musg_classical
    direction: exhibit
    label: orchestral
    viol_word: offorchestra
    signal: "The concerts chosen are classical (symphony orchestra, chamber ensemble, piano recital) rather than the equally good indie, afrobeats and electronic nights the season pushes"
    judge_expected: "a person whose music is classical — given a season, the orchestra and the recital come first."
    judge_held: "the user books mainly classical concerts (the orchestra, the chamber ensemble, the recital or similar), declining the indie / afrobeats / electronic swaps — one other act alongside a classical core still counts as HELD."
    judge_violated: "the user settles for the indie / afrobeats / electronic nights or keeps trading the classical concerts away for the swaps."
  - attribute: big5_adventurousness
    direction: exhibit
    label: familiar
    viol_word: novelty
    signal: "The programmes chosen are the well-known ones (famous symphonies, best-known quartets, the favourites, greatest hits) rather than the premiere, improvised and surprise programmes the season pushes"
    judge_expected: "a person who wants the tried and familiar — given the same performers playing the famous programme or a premiere, the famous programme wins every time."
    judge_held: "the user books the well-known programmes (the famous works, the favourites, the greatest hits or similar) and declines every premiere, improvised or surprise-programme pitch."
    judge_violated: "the user books any novel programme (world premiere, improvised set, surprise programme) or keeps trading the well-known programmes away for them."

