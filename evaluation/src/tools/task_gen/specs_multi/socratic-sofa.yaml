# Two-check set on hf-5170035775: Interest: Philosophy = Passionate (exhibit)
# x Interest: Fitness = Averse (avoid: no fitness block). A day-retreat
# centre sells days, each a morning session plus an afternoon hour. Facet A:
# the morning is a philosophy session (Stoicism seminar, ethics discussion
# circle, philosophy-of-mind lecture) or a talk on a topic the persona rates
# neutral or indifferent (phone photography, map and compass, cloud-spotting
# and weather). Facet B: the afternoon is a fitness block (HIIT class,
# circuits session, bootcamp hour) or an equally sociable gentle hour (tea
# tasting, board games, garden tour). Every day costs the same and both
# halves are the same length. Copy never uses "passionate" or "averse".
slug: socratic-sofa
persona: hf-5170035775
domain: leisure
tags: [philosophy, fitness, day-retreat]
isolation: "Every day costs the same and both halves are the same length; the alternative talks are on topics the persona rates neutral or indifferent (phone photography, navigation, weather), and the gentle afternoon hours are as sociable as the fitness blocks — so the picks isolate the persona's appetite for philosophy and its distaste for fitness; the persona exercises weekly, so the fitness blocks are within its reach, and the check is whether it opts into them when equal alternatives exist"
checks:
  - attribute: topic_philosophy
    direction: exhibit
    label: thinker
    viol_word: offtopic
    signal: "The morning halves chosen are philosophy sessions (Stoicism seminar, ethics discussion circle, philosophy-of-mind lecture) rather than the phone-photography, map-and-compass and weather talks the centre pushes"
    judge_expected: "a person who lives for ideas — given a morning at a retreat, the Stoicism seminar and the ethics circle come first."
    judge_held: "the user books days whose morning is a philosophy session (the Stoicism seminar, the ethics circle, the philosophy-of-mind lecture or similar), declining the photography / navigation / weather swaps — one other morning alongside a philosophy core still counts as HELD."
    judge_violated: "the user settles for the photography / navigation / weather talks or keeps trading the philosophy sessions away for the swaps."
  - attribute: topic_fitness
    direction: avoid
    label: workout
    viol_word: sweatslot
    signal: "The afternoon halves chosen are the gentle hours (tea tasting, board games, garden tour); no fitness block is booked, even though the centre pushes the HIIT, circuits and bootcamp hours"
    judge_expected: "a person who wants nothing to do with fitness — a HIIT class or a bootcamp hour is the one afternoon they will not book."
    judge_held: "the user's days all end with a gentle hour (tea tasting, board games, garden tour or similar) and no fitness block, declining the HIIT / circuits / bootcamp pitches throughout."
    judge_violated: "the user books any fitness block (HIIT class, circuits session, bootcamp hour or similar) or keeps trading the gentle hours away for them."

