# Two-check set on hf-4887354785: Pet ownership = Cat (exhibit: picks the
# extras only a home with cats wants) x Hobby: Bonsai = Active (exhibit). A
# plant-shop voucher covers a plant plus one included extra, all worth the
# same. Facet A: the extra is made for a home with cats (a weighted tip-proof
# planter, a wall bracket that keeps the plant out of reach of paws, a pot of
# catnip) or is an equally attractive general extra (a hand-glazed pot, a
# self-watering pot, a year's slow-release feed with moss top-dressing). No
# plant carries a toxicity label and every species is one that is fine
# around pets, so nothing but the household with cats favours the pet
# extras. Facet B: the plant is a bonsai or an ordinary houseplant of the
# same size and price. Copy never uses "cat" or "active".
slug: safe-for-whiskers
persona: hf-4887354785
domain: shopping
tags: [pet-ownership, bonsai, plant-shop]
isolation: "Every plant is covered in full, the same size and potted, and every included extra is worth the same; the extras on one side (a tip-proof planter, an out-of-reach bracket, a pot of catnip) matter only to a home with cats and the others (a glazed pot, a self-watering pot, a year's feed) to anyone, no plant carries a toxicity label — so the picks isolate the household with cats and the bonsai habit"
checks:
  - attribute: lstyle_pet_ownership
    direction: exhibit
    label: pawproof
    viol_word: plainextra
    signal: "The plants chosen come with the extras made for a home with cats (the tip-proof planter, the bracket out of reach of paws, the pot of catnip) rather than the equally attractive glazed pot, self-watering pot and year's feed the shop pushes"
    judge_expected: "a person who shares the home with cats — the tip-proof planter, the bracket that keeps a plant out of reach of paws and the pot of catnip are the extras they want; a glazed pot means nothing to them."
    judge_held: "the user takes the extras made for a home with cats (tip-proof planter, out-of-reach bracket, catnip or similar) and declines the glazed-pot / self-watering / feed pitches."
    judge_violated: "the user takes the glazed pot, self-watering pot or feed extras when the pet extras were available, or keeps trading the pet extras away for them."
  - attribute: hob_bonsai
    direction: exhibit
    label: dwarftree
    viol_word: offtree
    signal: "The plants chosen are bonsai rather than the equally healthy ordinary houseplants the shop pushes"
    judge_expected: "a person who keeps and trains bonsai — handed a plant voucher, the little trees come first."
    judge_held: "the user takes mainly bonsai (elm, money tree, ponytail palm or similar), declining the houseplant swaps — one houseplant alongside a bonsai core still counts as HELD."
    judge_violated: "the user settles for the ordinary houseplants or keeps trading the bonsai away for the swaps."

