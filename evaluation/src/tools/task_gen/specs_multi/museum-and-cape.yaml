# Two-check set on hf-4887328092: Vacation style = Culture (exhibit: the
# museum-and-old-town day) x Film: Superhero = Love (exhibit). A city-weekend
# planner sells packages that pair a daytime plan with an evening film. Facet
# A: the day is museums, galleries and old towns (museum-pass day, old-town
# architecture walk, gallery-and-cathedral day) or an equally pleasant non-
# sightseeing day (beach club, spa and pool, shopping mall). Facet B: the
# evening film is a superhero picture (caped-crusader sequel, super-team
# crossover, masked-vigilante origin) or an equally well-reviewed film from a
# genre the persona rates neutral (courtroom drama, romantic comedy, space
# documentary). Every package costs the same. Copy never uses "culture" or
# "love".
slug: museum-and-cape
persona: hf-4887328092
domain: travel
tags: [vacation-style, superhero-films, city-weekend]
isolation: "Every package costs the same and both halves are the same length; the non-sightseeing days are equally pleasant and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own museum-and-old-town holiday style and its taste for superhero films"
checks:
  - attribute: lstyle_vacation_style
    direction: exhibit
    label: galleries
    viol_word: offgallery
    signal: "The daytime halves of the packages are museum, gallery and old-town days rather than the equally pleasant beach, spa and mall days the planner pushes"
    judge_expected: "a person who travels for museums, galleries and old towns — given a city day, the museum pass wins over the beach club."
    judge_held: "the user books packages whose day is a museum, gallery or old-town day (the museum pass, the architecture walk, the gallery-and-cathedral day or similar), declining the beach / spa / mall swaps — one other day alongside a sightseeing core still counts as HELD."
    judge_violated: "the user settles for the beach / spa / mall days or keeps trading the sightseeing days away for the swaps."
  - attribute: filmg_superhero
    direction: exhibit
    label: cape
    viol_word: offcape
    signal: "The evening halves of the packages are superhero films (caped-crusader sequel, super-team crossover, vigilante origin story) rather than the equally well-reviewed drama, romcom and documentary the planner pushes"
    judge_expected: "a person whose film of choice is the superhero picture — given an evening, the capes come first."
    judge_held: "the user books packages whose film is a superhero picture (the sequel, the crossover, the origin story or similar), declining the drama / romcom / documentary swaps — one other film alongside a superhero core still counts as HELD."
    judge_violated: "the user settles for the drama / romcom / documentary evenings or keeps trading the superhero films away for the swaps."

