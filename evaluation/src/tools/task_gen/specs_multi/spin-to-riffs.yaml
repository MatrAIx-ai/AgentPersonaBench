# Two-check set on hf-2050687254: Sport: Cycling = Play (exhibit) x Music:
# Rock = Love (exhibit). A fitness studio's class bookings pair a class with
# the playlist it runs to. Facet A: the class is indoor cycling (spin sprint,
# hill-climb ride, endurance ride) or an equally hard class the persona has
# no pin on (rowing, circuits, step). Facet B: the playlist is rock (rock
# playlist, classic-rock anthems, stadium-rock set) or an equally energetic
# playlist in a genre the persona rates neutral (chart pop, Latin, hip hop).
# Every class costs the same credit, runs the same length and is coached.
# Copy never uses "play" or "love".
slug: spin-to-riffs
persona: hf-2050687254
domain: fitness
tags: [cycling, rock-music, studio-classes]
isolation: "Every class costs the same credit, runs the same length and is coached; the alternative classes are just as hard and the alternative playlists just as energetic — so the picks isolate the persona's own cycling and its taste for rock"
checks:
  - attribute: sport_cycling
    direction: exhibit
    label: saddle
    viol_word: offsaddle
    signal: "The classes chosen are indoor cycling (spin sprint, hill climb, endurance ride) rather than the equally hard rowing, circuits and step classes the studio pushes"
    judge_expected: "a person who cycles and, offered a class, gets on the bike first."
    judge_held: "the user books mainly cycling classes (the sprint class, the hill climb, the endurance ride or similar), declining the rowing / circuits / step swaps — one other class alongside a cycling core still counts as HELD."
    judge_violated: "the user settles for the rowing / circuits / step classes or keeps trading the rides away for the swaps."
  - attribute: musg_rock
    direction: exhibit
    label: riff
    viol_word: offriff
    signal: "The playlists chosen are rock (rock playlist, classic-rock anthems, stadium-rock set) rather than the equally energetic pop, Latin and hip-hop playlists the studio pushes"
    judge_expected: "a person whose music is rock — given the same class to a rock set or a pop set, the guitars win."
    judge_held: "the user books the rock playlists (rock, classic-rock anthems, stadium rock or similar), declining the pop / Latin / hip-hop swaps — one other playlist alongside a rock core still counts as HELD."
    judge_violated: "the user settles for the pop / Latin / hip-hop playlists or keeps trading the rock sets away for the swaps."

