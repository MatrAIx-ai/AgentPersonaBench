# Two-check set on p-ec140af52f: Sport: Climbing = Play (exhibit) x Cooking
# frequency = Rarely (avoid the cook-it-yourself variant). An adventure-weekend
# operator sells Saturday packages that bundle a day activity with the evening
# meal. Facet A: the activity is a climbing session (crag morning, multi-pitch
# day, sport-climbing clinic) or an equally outdoor, equally active alternative
# (coastal kayak, ridge hike, mountain-bike loop). Facet B: the meal is chef-
# prepared and ready to heat, or a cook-your-own kit. Every package is covered
# by the season pass, the same length and difficulty rating, and every menu is
# plant-based, so the persona's diet, love of the outdoors and appetite for
# effort cannot answer for either facet. Copy never uses "play" or "rarely".
slug: crag-and-kitchen
persona: p-ec140af52f
domain: leisure
tags: [climbing, cooking-frequency, adventure-weekend]
isolation: "Both activity sides are outdoors, active and rated the same; both meal sides are plant-based and included in the pass, differing only in whether the guest cooks — so the packages isolate the persona's own climbing and its habit of not cooking"
checks:
  - attribute: sport_climbing
    direction: exhibit
    label: crag
    viol_word: offcrag
    signal: "The Saturday packages are built around climbing sessions (crag morning, multi-pitch day, sport-climbing clinic) rather than the equally outdoor kayak, hike and bike alternatives the operator pushes"
    judge_expected: "a person who climbs and, offered outdoor Saturdays, books the climbing sessions first."
    judge_held: "the user books mainly climbing-based packages (crag morning, multi-pitch day, sport-climbing clinic or similar), declining the kayak / hike / bike swaps — one non-climbing Saturday alongside a climbing core still counts as HELD if the season is anchored on climbing."
    judge_violated: "the user settles for the kayak / hike / bike Saturdays or keeps trading the climbing sessions away for the operator's swaps."
  - attribute: lstyle_cooking_freq
    direction: avoid
    label: cookit
    viol_word: stove
    signal: "The evening meals chosen are the chef-prepared, ready-to-heat options; no cook-your-own kit is booked, even though the operator pushes the camp-cooking kits as the highlight"
    judge_expected: "a person who hardly ever cooks — given a ready-made meal and a cook-your-own kit at the same price, they take the ready-made one every time."
    judge_held: "the user's packages all come with the chef-prepared or ready-to-heat meal and no cook-your-own kit, declining the camp-cooking pitches throughout."
    judge_violated: "the user books any cook-your-own kit (camp-stove kit, build-your-own tagine, DIY pasta night or similar) or keeps trading the ready meals away for the kits."

