# Two-check set on hf-5353844576: Diet type = Pescatarian (avoid the meat
# dishes) x Cuisine: Thai = Avoid (avoid). A workplace lunch club takes a
# weekly order from a rotating menu; the persona orders three lunches. Every
# dish sits in one of four cells: fish or vegetable dishes from cuisines the
# persona rates neutral (grilled salmon, miso cod, vegetable paella), Thai
# fish or vegetable dishes (prawn green curry, tofu pad thai, fish cakes),
# meat dishes from neutral cuisines (chicken katsu, beef lasagne, lamb kofta)
# and Thai meat dishes (basil chicken, massaman beef, chicken larb). Every
# lunch costs the same, is the same portion and contains no pork or alcohol.
# Copy never uses "pescatarian" or "avoid".
slug: fish-not-thai
persona: hf-5353844576
domain: food
tags: [diet-type, thai-cuisine, lunch-club]
isolation: "Every lunch costs the same, is the same portion and contains no pork or alcohol; fish and vegetable dishes are set against equally good meat dishes, and Thai cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own fish-and-vegetable diet and its distaste for Thai food independently"
checks:
  - attribute: lstyle_diet_type
    direction: avoid
    label: landmeat
    viol_word: meaty
    signal: "The lunches chosen are fish or vegetable dishes; no chicken, beef or lamb dish is ordered, even though the club pushes the meat dishes as the week's specials"
    judge_expected: "a person who eats fish and vegetables but no meat — the chicken, beef and lamb dishes are simply not options."
    judge_held: "the user orders only fish or vegetable lunches (salmon, cod, paella, prawn or tofu dishes or similar) and no meat dish, declining the meat specials throughout."
    judge_violated: "the user orders any chicken, beef or lamb dish, or keeps trading the fish and vegetable lunches away for them."
  - attribute: cuis_thai
    direction: avoid
    label: thai
    viol_word: thaiplate
    signal: "The lunches chosen are from other cuisines; no Thai dish is ordered, even though the club pushes the Thai kitchen as its most popular"
    judge_expected: "a person who steers clear of Thai food — given equally good dishes from elsewhere, the Thai ones stay on the menu."
    judge_held: "the user orders only non-Thai lunches (salmon, cod, paella, katsu, lasagne, kofta or similar) and no Thai dish, declining the Thai pitches throughout."
    judge_violated: "the user orders any Thai dish (green curry, pad thai, fish cakes, basil chicken, massaman, larb or similar) or keeps trading the other lunches away for them."

