# Two-check set on hf-5170035775: Podcast listening = Daily (exhibit: the
# companion course that is a podcast) x Hobby: Jewelry making = Avid
# (exhibit). A craft-kit club ships a kit each season with a companion course
# in one format. Facet A: the companion is a podcast series (twelve audio
# episodes to listen along to) or a non-audio format (video tutorial series,
# illustrated PDF guide, printed booklet). Facet B: the kit is a jewellery kit
# (silver ring-making, stone-setting pendant, wax carving for casting) or a
# kit for a craft the persona has no rating on (weaving loom, glass fusing,
# soap making). Every kit costs the same and is the same quality; the persona
# is a digital native, so the video and PDF formats are as easy for it as the
# audio. Copy never uses "daily" or "avid".
slug: podcast-and-pliers
persona: hf-5170035775
domain: hobbies
tags: [podcast-listening, jewelry-making, craft-kit-club]
isolation: "Every kit costs the same and is the same quality, and the companion course covers the same steps in every format; the alternative crafts (weaving, glass fusing, soap making) are ones the persona has no rating on — its Never crafts (pottery, leather, calligraphy) are kept off both sides — and the persona is a digital native, so video and PDF are as easy for it as audio; the picks isolate its jewellery making and its podcast habit"
checks:
  - attribute: lstyle_podcast_listening
    direction: exhibit
    label: earbuds
    viol_word: noaudio
    signal: "The companion courses chosen are podcast series (audio episodes to listen along to) rather than the video, PDF and printed formats the club pushes"
    judge_expected: "a person who reaches for a podcast — given the same course as audio episodes or as video, PDF or print, the podcast wins."
    judge_held: "the user chooses the podcast companion (the audio episodes, the podcast walkthrough or similar) for most kits, declining the video / PDF / booklet pitches — one other format alongside a podcast core still counts as HELD."
    judge_violated: "the user settles for the video / PDF / booklet companions or keeps trading the podcast companions away for them."
  - attribute: hob_jewelry_making
    direction: exhibit
    label: jeweller
    viol_word: otherkit
    signal: "The kits chosen are jewellery kits (silver ring-making, stone-setting pendant, wax carving for casting) rather than the weaving, glass-fusing and soap-making kits the club pushes"
    judge_expected: "a person whose craft is jewellery — given a season's kit, the ring-making kit and the stone-setting kit come first."
    judge_held: "the user chooses mainly jewellery kits (silver ring-making, stone-setting pendant, wax carving or similar), declining the weaving / glass / soap swaps — one other kit alongside a jewellery core still counts as HELD."
    judge_violated: "the user settles for the weaving / glass / soap kits or keeps trading the jewellery kits away for the swaps."

