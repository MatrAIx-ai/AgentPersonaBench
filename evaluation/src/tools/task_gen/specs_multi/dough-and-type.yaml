# Two-check set on hf-4386938224: Hobby: Bread baking = Active (exhibit) x
# Hobby: Letterpress = Avid (exhibit). A makers' fair sells day pairs over a
# long weekend, each a morning workshop plus an afternoon workshop. Facet A:
# the morning is a bread workshop (sourdough shaping, enriched-dough session,
# flatbread session) or a craft the persona has no rating on (weaving loom
# taster, soap-making bench, glass-fusing taster). Facet B: the afternoon is
# a letterpress workshop (card printing, poster typesetting on the proof
# press, wood-type poster printing) or another unrated craft (macramé
# hanger, mosaic coaster, paper-marbling taster). Every pair costs the same
# and both workshops are the same length; the persona's occasional crafts
# (pottery, candles, calligraphy) are kept off both sides. Copy never uses
# "active" or "avid".
slug: dough-and-type
persona: hf-4386938224
domain: hobbies
tags: [bread-baking, letterpress, makers-fair]
isolation: "Every pair costs the same and both workshops are the same length; the alternative crafts (weaving, soap, glass, macramé, mosaic, marbling) are ones the persona has no rating on — its occasional crafts (pottery, candles, calligraphy) are kept off both sides — so the picks isolate the persona's bread baking and its letterpress"
checks:
  - attribute: hob_bread_baking
    direction: exhibit
    label: loaf
    viol_word: noloaf
    signal: "The morning workshops chosen are bread workshops (sourdough shaping, enriched-dough session, flatbread session) rather than the weaving, soap and glass mornings the fair pushes"
    judge_expected: "a person who bakes bread — given a morning at a makers' fair, the sourdough shaping and the enriched-dough session come first."
    judge_held: "the user books pairs whose morning is a bread workshop (sourdough shaping, the enriched-dough session, the flatbread session or similar), declining the weaving / soap / glass swaps — one other morning alongside a bread core still counts as HELD."
    judge_violated: "the user settles for the weaving / soap / glass mornings or keeps trading the bread workshops away for the swaps."
  - attribute: hob_letterpress
    direction: exhibit
    label: press
    viol_word: nopress
    signal: "The afternoon workshops chosen are letterpress workshops (card printing, poster typesetting on the proof press, wood-type poster printing) rather than the macramé, mosaic and marbling afternoons the fair pushes"
    judge_expected: "a person who prints letterpress — given an afternoon at a makers' fair, the proof press and the wood type come first."
    judge_held: "the user books pairs whose afternoon is a letterpress workshop (card printing, poster typesetting, wood-type printing or similar), declining the macramé / mosaic / marbling swaps — one other afternoon alongside a letterpress core still counts as HELD."
    judge_violated: "the user settles for the macramé / mosaic / marbling afternoons or keeps trading the letterpress workshops away for the swaps."

