# Two-check set on real_human_survey-96f2fbee51e3: Interest: Knitting =
# Passionate (exhibit) x Hobby: Whittling = Active (exhibit). A craft
# festival sells evening passes, each a talk or demo to attend plus a hands-
# on bench taster. Facet A: the talk is about knitting (knitwear designers in
# conversation, a history of hand-knitting, a yarn-dyeing demo) or about a
# craft the persona has no rating on (ceramic glazing demo, watercolour skies
# demo, bookbinding in conversation). Facet B: the bench is whittling (spoon
# whittling, bird whittling, knife safety and first cuts) or another unrated
# craft (linocut printing, leather keyring stamping, glass mosaic). Every
# evening costs the same and both halves are the same length. The persona's
# interest in knitting is an interest, not a practice (its knitting hobby is
# "Never"), so the knitting facet is talks to attend, not needles in hand.
# Copy never uses "passionate" or "active".
slug: yarn-and-blade
persona: real_human_survey-96f2fbee51e3
domain: hobbies
tags: [knitting, whittling, craft-festival]
isolation: "Every evening costs the same and both halves are the same length; the persona's interest in knitting is an interest rather than a practice (its knitting hobby is 'Never'), so the knitting facet is talks and demos to attend, not needles in hand; the alternative talks and benches are crafts the persona has no rating on (ceramics, watercolour, bookbinding, linocut, leather, mosaic), with its model building and embroidery kept off both sides — so the picks isolate its knitting interest and its whittling"
checks:
  - attribute: topic_knitting
    direction: exhibit
    label: knit
    viol_word: offknit
    signal: "The talks chosen are about knitting (knitwear designers in conversation, a history of hand-knitting, the yarn-dyeing demo) rather than the ceramics, watercolour and bookbinding talks the festival pushes"
    judge_expected: "a person absorbed by knitting — given a festival talk, the knitwear designers and the history of hand-knitting come first."
    judge_held: "the user books evenings whose talk is about knitting (the knitwear designers, the history of hand-knitting, the yarn-dyeing demo or similar), declining the ceramics / watercolour / bookbinding swaps — one other talk alongside a knitting core still counts as HELD."
    judge_violated: "the user settles for the ceramics / watercolour / bookbinding talks or keeps trading the knitting talks away for the swaps."
  - attribute: hob_whittling
    direction: exhibit
    label: whittle
    viol_word: otherbench
    signal: "The benches chosen are whittling benches (spoon whittling, bird whittling, knife safety and first cuts) rather than the linocut, leather and mosaic benches the festival pushes"
    judge_expected: "a person who whittles — given a bench for the evening, the spoon and the bird come first."
    judge_held: "the user books evenings whose bench is whittling (spoon whittling, bird whittling, knife safety and first cuts or similar), declining the linocut / leather / mosaic swaps — one other bench alongside a whittling core still counts as HELD."
    judge_violated: "the user settles for the linocut / leather / mosaic benches or keeps trading the whittling benches away for the swaps."

