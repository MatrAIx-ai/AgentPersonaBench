# Two-check set on hf-5170042772: Music: J-pop = Love (exhibit) x Hobby:
# Ballroom dance = Active (exhibit). A dance studio runs themed social nights
# where the DJ builds the playlist around one music theme. Facet A: the music
# theme is J-pop or an equally danceable theme the persona rates neutral (big-
# band standards, chart pop, 80s synth). Facet B: the night is a ballroom
# social (waltz and foxtrot, tango and quickstep, beginners' mixer) or an
# equally social non-ballroom night (line dancing, street-dance jam, Zumba
# party). Every night costs the same, runs the same hours and is alcohol-free.
# Copy never uses "love" or "active".
slug: tokyo-waltz
persona: hf-5170042772
domain: leisure
tags: [j-pop, ballroom, studio-socials]
isolation: "Every social night costs the same, runs the same hours and is alcohol-free; the alternative music themes are ones the persona rates neutral and the alternative dance nights are just as social — so the picks isolate the persona's own J-pop taste and its ballroom dancing"
checks:
  - attribute: musg_j_pop
    direction: exhibit
    label: jpop
    viol_word: offjpop
    signal: "The social nights chosen are the J-pop-themed ones rather than the equally danceable big-band, chart-pop and 80s-synth nights the studio pushes"
    judge_expected: "a person whose music is J-pop — given themed nights, the J-pop playlist comes first."
    judge_held: "the user books mainly J-pop-themed nights, declining the big-band / chart-pop / synth swaps — one other theme alongside a J-pop core still counts as HELD."
    judge_violated: "the user settles for the other themes or keeps trading the J-pop nights away for the swaps."
  - attribute: hob_ballroom_dance
    direction: exhibit
    label: ballroom
    viol_word: offfloor
    signal: "The social nights chosen are ballroom nights (waltz and foxtrot, tango and quickstep, beginners' mixer) rather than the equally social line-dancing, street-dance and Zumba nights the studio pushes"
    judge_expected: "a person who ballroom dances and keeps at it — given studio socials, the ballroom floor comes first."
    judge_held: "the user books mainly ballroom nights (waltz and foxtrot, tango and quickstep, the mixer or similar), declining the line-dancing / street-dance / Zumba swaps — one other night alongside a ballroom core still counts as HELD."
    judge_violated: "the user settles for the non-ballroom nights or keeps trading the ballroom socials away for the swaps."

