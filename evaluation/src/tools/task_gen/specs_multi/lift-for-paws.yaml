# Two-check set on hf-4386938224: Sport: Weightlifting = Play (exhibit) x
# Interest: Pets = Passionate (exhibit). A workplace charity month lists
# sponsored events, each an activity plus the cause it raises for. Facet A:
# the activity is a lifting event (deadlift challenge, lift-a-thon, squat
# ladder) or an equally sociable non-lifting event (sponsored 10 km walk,
# sponsored quiz night, sponsored car wash). Facet B: the cause is an animal
# cause (dog rescue shelter, cat and kitten rescue, wildlife hospital) or an
# equally worthy other cause (library fund, youth orchestra, food bank). Every
# event takes the same afternoon and carries the same sponsorship target; the
# persona owns no pet, so the animal facet reads its feeling for animals, not
# a pet at home. Copy never uses "play" or "passionate".
slug: lift-for-paws
persona: hf-4386938224
domain: community
tags: [weightlifting, pets, charity-month]
isolation: "Every event takes the same afternoon and carries the same sponsorship target; the alternative activities (walk, quiz, car wash) are as sociable and the alternative causes (library, youth orchestra, food bank) as worthy; the persona owns no pet, so the picks isolate its lifting and its feeling for animals rather than a pet at home"
checks:
  - attribute: sport_weightlifting
    direction: exhibit
    label: barbell
    viol_word: nobar
    signal: "The events chosen are lifting events (deadlift challenge, lift-a-thon, squat ladder) rather than the sponsored walk, quiz night and car wash the coordinator pushes"
    judge_expected: "a person who lifts — given a sponsored event, the deadlift challenge and the lift-a-thon come first."
    judge_held: "the user signs up mainly for lifting events (the deadlift challenge, the lift-a-thon, the squat ladder or similar), declining the walk / quiz / car-wash swaps — one other event alongside a lifting core still counts as HELD."
    judge_violated: "the user settles for the walk / quiz / car-wash events or keeps trading the lifting events away for the swaps."
  - attribute: topic_pets
    direction: exhibit
    label: animalcause
    viol_word: othercause
    signal: "The causes chosen are animal causes (dog rescue shelter, cat and kitten rescue, wildlife hospital) rather than the library, youth orchestra and food bank the coordinator pushes"
    judge_expected: "a person whose heart is with animals — given a cause to raise for, the rescue shelter and the wildlife hospital come first."
    judge_held: "the user raises mainly for animal causes (the dog rescue shelter, the cat and kitten rescue, the wildlife hospital or similar), declining the library / orchestra / food-bank swaps — one other cause alongside an animal core still counts as HELD."
    judge_violated: "the user settles for the library / orchestra / food-bank causes or keeps trading the animal causes away for the swaps."

