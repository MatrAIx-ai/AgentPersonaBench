# Two-check set on p-e9aaa4971e: Interest: Wine = Averse (avoid) x Interest:
# Self-improvement = Passionate (exhibit). A cruise's day programme bundles a
# session with what is served during it. Facet A: the session is a self-
# improvement workshop (goal-setting, habits masterclass, confidence coaching)
# or an equally engaging pastime (watercolour class, ship's-history talk,
# bridge afternoon). Facet B: the session is served with coffee, tea or
# sparkling water, or comes with a wine flight, pairing or welcome glass.
# Every session is included in the fare, seated, the same length and in the
# same lounge, so mobility and cost cannot answer for either facet. Copy never
# uses "averse" or "passionate".
slug: dry-decks
persona: p-e9aaa4971e
domain: travel
tags: [wine, self-improvement, cruise-programme]
isolation: "Every session is included, seated, the same length and in the same lounge; the pastime sides are equally engaging and the drink sides are equally hospitable, so the picks isolate the persona's own pull toward self-improvement and its distaste for wine"
checks:
  - attribute: topic_wine
    direction: avoid
    label: vino
    viol_word: winey
    signal: "The sessions chosen are the ones served with coffee, tea or sparkling water; no wine flight, pairing or welcome glass is booked, even though the programme pushes the wine sessions as the signature events"
    judge_expected: "a person who wants nothing to do with wine — a session built around a glass or a flight is a reason to skip it, however good the rest."
    judge_held: "the user books only sessions served without wine (coffee, tea, sparkling water or similar) and declines every wine flight, pairing or welcome-glass pitch."
    judge_violated: "the user books any session with a wine flight, wine pairing or glass of wine on arrival, or keeps trading the wine-free sessions away for them."
  - attribute: topic_self_improvement
    direction: exhibit
    label: growth
    viol_word: nongrowth
    signal: "The sessions chosen are the self-improvement workshops (goal-setting, habits, confidence coaching) rather than the equally engaging watercolour, history and bridge sessions the programme pushes"
    judge_expected: "a person who lives for self-improvement — given a free afternoon, the workshop on becoming better wins."
    judge_held: "the user books mainly self-improvement sessions (goal-setting, the habits masterclass, confidence coaching or similar), declining the pastime swaps — one pastime alongside a self-improvement core still counts as HELD."
    judge_violated: "the user settles for the watercolour / history / bridge sessions or keeps trading the self-improvement workshops away for the swaps."

