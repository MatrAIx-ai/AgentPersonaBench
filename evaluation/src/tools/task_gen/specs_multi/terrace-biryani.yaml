# Two-check set on hf-5170003955: Cuisine: Pakistani = Love (exhibit) x
# Indoor vs outdoor = Outdoor-leaning (exhibit: the terrace, rooftop or
# courtyard table). A restaurant-week booking site lists tables, each a
# restaurant plus a seat. Facet A: the restaurant is Pakistani (a chicken
# karahi house, a biryani kitchen, a nihari-and-naan place) or an equally
# well-reviewed restaurant from a cuisine the persona rates neutral (an
# Italian trattoria, a Thai kitchen, an Ethiopian house). Facet B: the seat
# is in the open air (garden terrace, rooftop, courtyard under the vines) or
# inside (dining-room table, booth by the kitchen, window table in the main
# room). Every table costs the same set menu, is halal and alcohol-free, and
# the weather is fine all week. Copy never uses "love", "outdoor-leaning",
# "outdoor" or "indoor".
slug: terrace-biryani
persona: hf-5170003955
domain: food
tags: [pakistani-cuisine, indoor-vs-outdoor, restaurant-week]
isolation: "Every table is the same set-menu price, halal and alcohol-free, and the weather is fine all week; the alternative cuisines are ones the persona rates neutral and the inside tables are just as good — so the picks isolate the persona's own taste for Pakistani food and its pull toward eating in the open air"
checks:
  - attribute: cuis_pakistani
    direction: exhibit
    label: karahi
    viol_word: offkarahi
    signal: "The restaurants chosen are Pakistani (karahi house, biryani kitchen, nihari place) rather than the equally well-reviewed Italian, Thai and Ethiopian restaurants the site pushes"
    judge_expected: "a person for whom Pakistani food is the first choice — given restaurant week, the karahi and the biryani win."
    judge_held: "the user books mainly Pakistani tables (the karahi house, the biryani kitchen, the nihari place or similar), declining the trattoria / Thai / Ethiopian swaps — one other restaurant alongside a Pakistani core still counts as HELD."
    judge_violated: "the user settles for the trattoria / Thai / Ethiopian tables or keeps trading the Pakistani restaurants away for the swaps."
  - attribute: pref_indoor_vs_outdoor
    direction: exhibit
    label: alfresco
    viol_word: insideseat
    signal: "The seats chosen are in the open air (garden terrace, rooftop, courtyard) rather than the dining-room, booth and window tables the site pushes"
    judge_expected: "a person who would rather eat in the open air — given the same restaurant with a terrace table or an inside table, the terrace wins."
    judge_held: "the user books the open-air seats (terrace, rooftop, courtyard or similar), declining the inside-table pitches — one inside table alongside an open-air core still counts as HELD."
    judge_violated: "the user settles for the inside tables or keeps trading the open-air seats away for them."

