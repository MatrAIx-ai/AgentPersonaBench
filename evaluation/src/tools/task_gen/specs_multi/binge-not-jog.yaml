# Two-check set on hf-6283061910: Interest: TV series = Passionate (exhibit) x
# Interest: Running = Averse (avoid). A weekend social club sells packages
# that pair an evening event with a morning event. Facet A: the evening is a
# series event (season-finale watch party, box-set marathon, series quiz) or
# an equally sociable evening the persona has no pin on (trivia night, craft-
# and-chat evening, film night). Facet B: the morning is a run (5k fun run,
# parkrun, trail-run club) or an equally sociable non-running morning (brunch
# club, walking tour, market stroll). Every package costs the same and both
# halves are the same length. Copy never uses "passionate" or "averse".
slug: binge-not-jog
persona: hf-6283061910
domain: leisure
tags: [tv-series, running, weekend-social]
isolation: "Every package costs the same and both halves are the same length; the alternative evenings are just as sociable and the non-running mornings just as active a way to start the day — so the picks isolate the persona's own devotion to series and its distaste for running"
checks:
  - attribute: topic_tv_series
    direction: exhibit
    label: episodes
    viol_word: offseries
    signal: "The evening halves of the packages are series events (finale watch party, box-set marathon, series quiz) rather than the equally sociable trivia, craft and film evenings the club pushes"
    judge_expected: "a person who lives for series — given a club evening, the finale party and the marathon come first."
    judge_held: "the user books packages whose evening is a series event (the finale party, the marathon, the series quiz or similar), declining the trivia / craft / film swaps — one other evening alongside a series core still counts as HELD."
    judge_violated: "the user settles for the trivia / craft / film evenings or keeps trading the series events away for the swaps."
  - attribute: topic_running
    direction: avoid
    label: jog
    viol_word: runny
    signal: "The morning halves of the packages are the non-running mornings (brunch club, walking tour, market stroll); no run is booked, even though the club pushes the runs as the way to start the weekend"
    judge_expected: "a person who wants nothing to do with running — a fun run or parkrun is the one morning they will not book."
    judge_held: "the user's packages all start with a non-running morning (brunch, walking tour, market stroll or similar) and no run, declining the run pitches throughout."
    judge_violated: "the user books any run (5k fun run, parkrun, trail-run club or similar) or keeps trading the other mornings away for them."

