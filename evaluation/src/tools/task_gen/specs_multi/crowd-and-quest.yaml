# Two-check set on real-human-survey-e8ec306b9cdb: Social battery = Strong
# extrovert (exhibit: the big watch-party format) x Film: Adventure = Love
# (exhibit). A streaming club's monthly events pair a film with a viewing
# format. Facet A: the format is a big shared one (a 40-person watch party
# with live chat, the club's cinema-room screening, a 60-member rooftop
# watch-along) or a one-person one (private stream, watch alone, viewing
# booth). Facet B: the film is an adventure epic (jungle expedition, mountain
# rescue, treasure hunt) or an equally well-reviewed film from a genre the
# persona rates neutral (slow-burn thriller, space-station sci-fi, coral-reef
# documentary). Every event is free with membership and the same length.
# Copy never uses "strong extrovert", "extrovert" or "love".
slug: crowd-and-quest
persona: real-human-survey-e8ec306b9cdb
domain: leisure
tags: [social-battery, adventure-films, watch-parties]
isolation: "Every event is free with membership and the same length; the one-person formats are just as convenient and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own appetite for a crowd and its taste for adventure films"
checks:
  - attribute: lstyle_social_battery
    direction: exhibit
    label: party
    viol_word: solofmt
    signal: "The formats chosen are the big shared ones (40-person watch party, cinema-room screening, rooftop watch-along) rather than the private-stream, watch-alone and booth formats the club pushes"
    judge_expected: "a person who comes alive in a crowd — given the same film alone or with forty people, the crowd wins every time."
    judge_held: "the user books the big shared formats (watch party, cinema-room screening, rooftop watch-along or similar) and declines the private / alone / booth pitches throughout."
    judge_violated: "the user books any one-person format (private stream, watch alone, viewing booth) or keeps trading the shared formats away for them."
  - attribute: filmg_adventure
    direction: exhibit
    label: quest
    viol_word: offquest
    signal: "The films chosen are adventure epics (jungle expedition, mountain rescue, treasure hunt) rather than the equally well-reviewed thriller, sci-fi and documentary the club pushes"
    judge_expected: "a person whose film of choice is adventure — expeditions, rescues and treasure hunts come before anything slower."
    judge_held: "the user books mainly adventure films (the expedition epic, the rescue saga, the treasure hunt or similar), declining the thriller / sci-fi / documentary swaps — one other film alongside an adventure core still counts as HELD."
    judge_violated: "the user settles for the thriller / sci-fi / documentary events or keeps trading the adventure films away for the swaps."

