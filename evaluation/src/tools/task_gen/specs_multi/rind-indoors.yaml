# Two-check set on hf-4887328092: Hobby: Cheesemaking = Active (exhibit) x
# Indoor vs outdoor = Indoor-leaning (exhibit: the under-a-roof venue). A
# food-craft school's day-out programme lists workshops, each a subject plus
# where it runs. Facet A: the subject is cheesemaking (mozzarella stretching,
# a halloumi day, a soft-cheese workshop) or an equally good food craft the
# persona has no pin on (sourdough, chocolate tempering, pickling). Facet B:
# the venue is under a roof (a teaching kitchen, a classroom, the food-school
# studio) or in the open air (a farm-field marquee, an orchard session, a
# riverside camp kitchen). Every workshop costs the same, runs the same hours
# and provides everything. Copy never uses "active", "indoor-leaning",
# "indoor" or "indoors".
slug: rind-indoors
persona: hf-4887328092
domain: education
tags: [cheesemaking, indoor-vs-outdoor, food-craft-days]
isolation: "Every workshop costs the same, runs the same hours and provides everything; the open-air venues are fully equipped and the alternative crafts are just as hands-on — so the picks isolate the persona's own cheesemaking and its preference for being under a roof"
checks:
  - attribute: hob_cheesemaking
    direction: exhibit
    label: curdcraft
    viol_word: offcurd
    signal: "The workshops chosen are cheesemaking (mozzarella, halloumi, soft cheese) rather than the equally good sourdough, chocolate and pickling workshops the school pushes"
    judge_expected: "a person who makes cheese regularly — offered a food-craft day, the curds come first."
    judge_held: "the user books mainly cheesemaking workshops (mozzarella, halloumi, soft cheese or similar), declining the sourdough / chocolate / pickling swaps — one other craft alongside a cheese core still counts as HELD."
    judge_violated: "the user settles for the sourdough / chocolate / pickling workshops or keeps trading the cheesemaking away for the swaps."
  - attribute: pref_indoor_vs_outdoor
    direction: exhibit
    label: roofed
    viol_word: openair
    signal: "The venues chosen are under a roof (teaching kitchen, classroom, studio) rather than the marquee, orchard and riverside sessions the school pushes"
    judge_expected: "a person who would rather be inside — given the same workshop under a roof or in the open air, the roof wins."
    judge_held: "the user books the roofed venues (teaching kitchen, classroom, studio or similar) and declines every marquee, orchard or riverside pitch."
    judge_violated: "the user books any open-air venue (farm-field marquee, orchard session, riverside camp kitchen) or keeps trading the roofed venues away for them."

