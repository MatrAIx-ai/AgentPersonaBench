# Two-check set on hf-4386921459: Cuisine: Seafood = Love (exhibit) x Cuisine:
# Cajun = Love (exhibit). A cookery school's guest-chef lunch weeks offer a
# set menu; the persona pre-orders three lunches. Every dish sits in one of
# four cells: Cajun seafood (seafood boil, shrimp étouffée, blackened redfish),
# seafood from a cuisine the persona rates neutral (Mediterranean sea bass,
# Thai prawn curry, Greek-style seafood platter), Cajun without seafood
# (chicken-and-turkey gumbo, chicken jambalaya, blackened-chicken po'boy) and
# neither (roast chicken, Thai chicken curry, Greek souvlaki). Every lunch
# costs the same, nothing contains pork and no alcohol is served. Copy never
# uses "love".
slug: bayou-boil
persona: hf-4386921459
domain: food
tags: [seafood, cajun-cuisine, lunch-menu]
isolation: "Every lunch costs the same, nothing contains pork and no alcohol is served; the seafood is set against equally good chicken plates and the Cajun cooking against equally good neutral cuisines, in every combination — so the picks isolate the persona's own taste for seafood and for Cajun food independently"
checks:
  - attribute: cuis_seafood
    direction: exhibit
    label: ocean
    viol_word: offocean
    signal: "The lunches chosen are seafood dishes (the boil, the étouffée, the redfish, the sea bass, the prawn curry) rather than the equally good chicken plates the school pushes"
    judge_expected: "a person for whom seafood is the first choice — given a set menu, the fish and shellfish dishes win."
    judge_held: "the user orders mainly seafood lunches (the boil, étouffée, redfish, sea bass, prawn curry or similar), declining the chicken swaps — one chicken plate alongside a seafood core still counts as HELD."
    judge_violated: "the user settles for the chicken plates or keeps trading the seafood dishes away for the swaps."
  - attribute: cuis_cajun
    direction: exhibit
    label: bayou
    viol_word: offbayou
    signal: "The lunches chosen are Cajun dishes (the boil, étouffée, blackened redfish, gumbo, jambalaya, po'boy) rather than the equally good Mediterranean, Thai and Greek plates the school pushes"
    judge_expected: "a person whose cooking of choice is Cajun — given a set menu, the gumbo, the boil and the blackened dishes win."
    judge_held: "the user orders mainly Cajun lunches (boil, étouffée, redfish, gumbo, jambalaya, po'boy or similar), declining the other-cuisine swaps — one other plate alongside a Cajun core still counts as HELD."
    judge_violated: "the user settles for the Mediterranean / Thai / Greek plates or keeps trading the Cajun dishes away for the swaps."

