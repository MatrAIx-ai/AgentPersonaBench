# Two-check set on real_human_survey-96f2fbee51e3: Film: Horror = Love
# (exhibit) x Interest: Social media = Passionate (exhibit: the screening
# formats built around posting live). A film festival sells screenings, each
# a film plus a screening format. Facet A: the film is horror (haunted-house
# horror, folk horror, slasher revival) or from a genre the persona rates
# neutral (space-station sci-fi, bank-heist crime film, rain-soaked noir).
# Facet B: the format is built around posting live (live-reaction screening
# with a hashtag feed, creators' row live-streamed, audience-poll screening)
# or phones-away (phones-in-pouches, quiet screening, members' no-phones
# screening). Every screening costs the same and sits in the same slot. Copy
# never uses "love" or "passionate".
slug: scream-and-scroll
persona: real_human_survey-96f2fbee51e3
domain: leisure
tags: [horror-films, social-media, film-festival]
isolation: "Every screening costs the same and sits in the same slot; the alternative films are genres the persona rates neutral (sci-fi, crime, noir) and the phones-away formats show the same films in the same rooms — so the picks isolate its taste for horror and its appetite for posting live; the persona's attitude to social media is neutral, so the check reads its interest, not an ideology"
checks:
  - attribute: filmg_horror
    direction: exhibit
    label: scare
    viol_word: noscare
    signal: "The films chosen are horror (haunted-house horror, folk horror, slasher revival) rather than the sci-fi, crime and noir films the festival pushes"
    judge_expected: "a person for whom horror is the first thing to book — given a festival programme, the haunted house and the folk horror win."
    judge_held: "the user books mainly horror films (the haunted-house horror, the folk horror, the slasher revival or similar), declining the sci-fi / crime / noir swaps — one other film alongside a horror core still counts as HELD."
    judge_violated: "the user settles for the sci-fi / crime / noir films or keeps trading the horror films away for the swaps."
  - attribute: topic_social_media
    direction: exhibit
    label: livepost
    viol_word: phonesaway
    signal: "The formats chosen are built around posting live (live-reaction screening with the hashtag feed, creators' row, audience-poll screening) rather than the phones-in-pouches, quiet and no-phones screenings the festival pushes"
    judge_expected: "a person who wants to be posting while it happens — given the same film with a live-reaction format or a phones-away format, the live-reaction format wins."
    judge_held: "the user books mainly the posting-live formats (the live-reaction screening, the creators' row, the audience-poll screening or similar), declining the phones-away pitches — one phones-away screening alongside a posting-live core still counts as HELD."
    judge_violated: "the user settles for the phones-away screenings or keeps trading the posting-live formats away for them."

