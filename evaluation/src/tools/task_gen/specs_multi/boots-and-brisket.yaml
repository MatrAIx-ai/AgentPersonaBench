# Two-check set on hf-4386921459: Music: Country = Love (exhibit) x Cuisine:
# American BBQ = Love (exhibit). A barn venue runs supper-and-music nights,
# each a band plus a supper. Facet A: the band is country (trio, honky-tonk
# band, fiddle showcase) or an equally good act in a genre the persona rates
# neutral (pop covers, Latin big band, ska brass). Facet B: the supper is
# smokehouse barbecue (brisket, smoked chicken, beef short ribs) or an equally
# generous plate from a cuisine the persona rates neutral (Thai green curry,
# Greek chicken grill, Peruvian roast chicken). Every night costs the same,
# no supper contains pork and no alcohol is served. Copy never uses "love".
slug: boots-and-brisket
persona: hf-4386921459
domain: leisure
tags: [country-music, american-bbq, barn-nights]
isolation: "Every barn night costs the same, no supper contains pork and no alcohol is served; the alternative genres and cuisines are ones the persona rates neutral — so the picks isolate the persona's own taste for country music and for smokehouse barbecue"
checks:
  - attribute: musg_country
    direction: exhibit
    label: twang
    viol_word: offtwang
    signal: "The barn nights chosen have country acts (trio, honky-tonk band, fiddle showcase) rather than the equally good pop-covers, Latin big-band and ska nights the venue pushes"
    judge_expected: "a person whose music is country — given a run of barn nights, the fiddles and the honky-tonk come first."
    judge_held: "the user books mainly country nights (the trio, the honky-tonk band, the fiddle showcase or similar), declining the pop / Latin / ska swaps — one other act alongside a country core still counts as HELD."
    judge_violated: "the user settles for the pop / Latin / ska nights or keeps trading the country acts away for the swaps."
  - attribute: cuis_american_bbq
    direction: exhibit
    label: smokehouse
    viol_word: offsmoke
    signal: "The suppers chosen are smokehouse barbecue (brisket, smoked chicken, short ribs) rather than the equally generous Thai, Greek and Peruvian plates the venue pushes"
    judge_expected: "a person for whom barbecue is the food — offered a supper, the smoker wins."
    judge_held: "the user books nights with the barbecue supper (brisket, smoked chicken, short ribs or similar), declining the curry / grill / roast swaps — one other supper alongside a barbecue core still counts as HELD."
    judge_violated: "the user settles for the Thai / Greek / Peruvian suppers or keeps trading the barbecue away for the swaps."

