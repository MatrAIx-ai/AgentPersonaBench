# Two-check set on real-human-survey-e8ec306b9cdb: Music: Latin = Love
# (exhibit) x Interest: Yoga = Averse (avoid). A resort's day passes pair a
# morning session with an evening music set. Facet A: the evening is Latin
# (salsa band, bossa nova trio, cumbia dance night) or an equally good set in
# a genre the persona rates neutral (house DJ, acoustic folk duo, classical
# quartet). Facet B: the morning is yoga (sunrise yoga, yin session, poolside
# vinyasa) or an equally gentle non-yoga morning (beach volleyball, aqua
# aerobics, coastal walk). Every pass is included in the stay, alcohol-free
# and the same length on both halves. Copy never uses "love" or "averse".
slug: salsa-no-sunrise
persona: real-human-survey-e8ec306b9cdb
domain: travel
tags: [latin-music, yoga, resort-day-pass]
isolation: "Every day pass is included in the stay, alcohol-free and the same length on both halves; the alternative genres are ones the persona rates neutral and the non-yoga mornings are just as gentle — so the picks isolate the persona's own Latin music and its distaste for yoga"
checks:
  - attribute: musg_latin
    direction: exhibit
    label: clave
    viol_word: offclave
    signal: "The evening halves of the day passes are Latin sets (salsa band, bossa nova trio, cumbia night) rather than the equally good house, folk and classical sets the resort pushes"
    judge_expected: "a person whose music is Latin — given a resort evening, the salsa band and the bossa nova come first."
    judge_held: "the user books passes whose evening is Latin (the salsa band, the bossa nova trio, the cumbia night or similar), declining the house / folk / classical swaps — one other set alongside a Latin core still counts as HELD."
    judge_violated: "the user settles for the house / folk / classical evenings or keeps trading the Latin sets away for the swaps."
  - attribute: topic_yoga
    direction: avoid
    label: mat
    viol_word: yogic
    signal: "The morning halves of the day passes are the non-yoga mornings (volleyball, aqua aerobics, coastal walk); no yoga session is booked, even though the resort pushes the yoga mornings as its signature"
    judge_expected: "a person who wants nothing to do with yoga — a sunrise session on the mat is the one thing they will not book, however gentle."
    judge_held: "the user's passes all start with a non-yoga morning (volleyball, aqua aerobics, coastal walk or similar) and no yoga session, declining the yoga pitches throughout."
    judge_violated: "the user books any yoga morning (sunrise, yin, vinyasa or similar) or keeps trading the other mornings away for them."

