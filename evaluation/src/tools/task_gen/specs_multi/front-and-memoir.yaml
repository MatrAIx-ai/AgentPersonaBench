# Two-check set on real-human-survey-e8ec306b9cdb: Film: War = Love (exhibit)
# x Books: Biography = Love (exhibit). A film-and-book club issues monthly
# pairings, each a film plus a book. Facet A: the film is a war film (WWII
# submarine drama, trench epic, resistance thriller) or an equally well-
# reviewed film from a genre the persona rates neutral (courtroom thriller,
# Mars-colony sci-fi, deep-sea documentary). Facet B: the book is a biography
# (a general's, an aviator's, a field nurse's) or an equally well-reviewed
# title from a genre the persona rates neutral (a sci-fi novel, a poetry
# collection, a business strategy book). Every pairing is free with
# membership and the same reading length. Copy never uses "love".
slug: front-and-memoir
persona: real-human-survey-e8ec306b9cdb
domain: media
tags: [war-films, biography, film-and-book-club]
isolation: "Every pairing is free with membership and the same reading length; the alternative film and book genres are ones the persona rates neutral — so the picks isolate the persona's own taste for war films and for biographies independently"
checks:
  - attribute: filmg_war
    direction: exhibit
    label: frontline
    viol_word: offfront
    signal: "The film halves of the pairings are war films (submarine drama, trench epic, resistance thriller) rather than the equally well-reviewed courtroom, sci-fi and documentary films the club pushes"
    judge_expected: "a person whose film of choice is the war film — given a month's pairings, the submarine drama and the trench epic come first."
    judge_held: "the user takes pairings whose film is a war film (the submarine drama, the trench epic, the resistance thriller or similar), declining the courtroom / sci-fi / documentary swaps — one other film alongside a war-film core still counts as HELD."
    judge_violated: "the user settles for the courtroom / sci-fi / documentary films or keeps trading the war films away for the swaps."
  - attribute: bookg_biography
    direction: exhibit
    label: lifestory
    viol_word: offlife
    signal: "The book halves of the pairings are biographies (a general's, an aviator's, a nurse's) rather than the equally well-reviewed sci-fi novel, poetry collection and business book the club pushes"
    judge_expected: "a person whose reading is biography — given a pairing, the life of a real person wins."
    judge_held: "the user takes pairings whose book is a biography (the general's, the aviator's, the nurse's or similar), declining the novel / poetry / business swaps — one other book alongside a biography core still counts as HELD."
    judge_violated: "the user settles for the novel / poetry / business books or keeps trading the biographies away for the swaps."

