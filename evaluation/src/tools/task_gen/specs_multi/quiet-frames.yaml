# Two-check set on 0094: Film: Art house = Love (exhibit) x Social battery =
# Strong introvert (exhibit: the small, quiet format). A film society offers
# members three screenings a season, each a film in a particular format. Facet
# A: the film is art house (slow-cinema retrospective, restored New Wave
# print, experimental shorts) or an equally well-reviewed mainstream release
# from a genre the persona rates neutral (action sequel, romantic comedy,
# family animation). Facet B: the format is small and quiet (20-seat studio,
# members' quiet matinee, solo booth) or a big social occasion (opening-night
# party, 300-seat gala with crowd Q&A, festival tent with live vote). Every
# screening is free with membership and the same length. Copy never uses
# "love" or "strong introvert".
slug: quiet-frames
persona: "0094"
domain: leisure
tags: [art-house, social-battery, film-society]
isolation: "Every screening is free with membership and the same length; the mainstream alternatives are from genres the persona rates neutral and the social formats are equally convenient — so the picks isolate the persona's own taste for art house and its need for a small, quiet setting"
checks:
  - attribute: filmg_art_house
    direction: exhibit
    label: arthouse
    viol_word: mainstream
    signal: "The screenings chosen are art-house films (slow-cinema retrospective, restored New Wave print, experimental shorts) rather than the equally well-reviewed action sequel, romantic comedy and family animation the society pushes"
    judge_expected: "a person whose cinema is art house — given a season, the retrospective and the restored print come before the multiplex releases."
    judge_held: "the user books mainly art-house screenings (the retrospective, the New Wave print, the shorts programme or similar), declining the mainstream swaps — one mainstream film alongside an art-house core still counts as HELD."
    judge_violated: "the user settles for the action / romcom / animation screenings or keeps trading the art-house films away for the swaps."
  - attribute: lstyle_social_battery
    direction: exhibit
    label: quiet
    viol_word: crowd
    signal: "The formats chosen are the small, quiet ones (20-seat studio, quiet matinee, solo booth) rather than the opening-night party, gala crowd and festival-tent formats the society pushes"
    judge_expected: "a person who is drained by crowds and recharges alone — given the same film in a party format or a quiet one, the quiet one wins every time."
    judge_held: "the user books the small, quiet formats (studio screening, quiet matinee, solo booth or similar) and declines the party / gala / tent pitches throughout."
    judge_violated: "the user books any opening-night party, gala crowd or festival-tent format, or keeps trading the quiet formats away for them."

