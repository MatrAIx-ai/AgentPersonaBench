# Two-check set on real-human-survey-e8ec306b9cdb: Vacation style =
# Relaxation (exhibit) x Cuisine: Brazilian = Love (exhibit). A travel agent's
# packages pair an itinerary style with a dining plan. Facet A: the style is
# restful (a beach resort week with hammocks and spa, a lakeside lodge with
# nothing scheduled, a spa retreat with slow mornings) or packed (a culture
# city break with museums dawn to dusk, an activity week with a full
# itinerary, a food-and-markets tour with every hour scheduled). Facet B: the
# dining plan is Brazilian (moqueca dinners, picanha churrasco nights, pão de
# queijo brunches with Bahian fish stew) or an equally good plan from a
# cuisine the persona rates neutral (Italian trattoria, Turkish grill, Thai
# kitchen). Every package costs the same for the same number of nights, and
# no dish contains pork. Copy never uses "relaxation" or "love".
slug: hammock-and-moqueca
persona: real-human-survey-e8ec306b9cdb
domain: travel
tags: [vacation-style, brazilian-cuisine, holiday-packages]
isolation: "Every package costs the same for the same nights and no dish contains pork; the packed itineraries are equally well organised and the alternative cuisines are ones the persona rates neutral — so the picks isolate the persona's own restful holiday style and its taste for Brazilian food"
checks:
  - attribute: lstyle_vacation_style
    direction: exhibit
    label: unwind
    viol_word: packed
    signal: "The itineraries chosen are the restful ones (beach resort and spa, lakeside lodge with nothing scheduled, slow-morning retreat) rather than the museum-packed, activity-packed and tour-packed weeks the agent pushes"
    judge_expected: "a person whose holiday is for unwinding — given the same week restful or scheduled to the hour, the restful one wins."
    judge_held: "the user books the restful itineraries (resort and spa, lakeside lodge, slow-morning retreat or similar) and declines every packed-itinerary pitch."
    judge_violated: "the user books any packed itinerary (museums dawn to dusk, full activity schedule, hourly tour) or keeps trading the restful weeks away for them."
  - attribute: cuis_brazilian
    direction: exhibit
    label: brasil
    viol_word: offbrasil
    signal: "The dining plans chosen are Brazilian (moqueca, picanha churrasco, pão de queijo and Bahian stew) rather than the equally good Italian, Turkish and Thai plans the agent pushes"
    judge_expected: "a person for whom Brazilian food is the first choice — given a dining plan, moqueca and picanha win."
    judge_held: "the user books packages with the Brazilian dining plan (moqueca, churrasco, pão de queijo or similar), declining the trattoria / grill / Thai swaps — one other plan alongside a Brazilian core still counts as HELD."
    judge_violated: "the user settles for the Italian / Turkish / Thai dining plans or keeps trading the Brazilian food away for the swaps."

