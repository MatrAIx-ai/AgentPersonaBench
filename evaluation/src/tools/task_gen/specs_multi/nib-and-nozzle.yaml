# Two-check set on hf-1557002195: Hobby: Calligraphy = Avid (exhibit) x
# Interest: 3D printing = Passionate (exhibit). A makerspace's open evenings
# sell passes that bundle two stations. Facet A: the first station is
# calligraphy (broad-nib lettering, brush lettering, illuminated capitals) or
# an equally hands-on craft the persona has no pin on (pottery wheel, linocut
# table, leather-stitching bench). Facet B: the second station is 3D printing
# (print-bay induction, design-and-print a bracket, resin-printer session) or
# an equally hands-on non-digital station (woodturning lathe, screen-printing
# table, candle-making bench). Every pass costs the same and both stations
# run the same length with a tutor. Copy never uses "avid" or "passionate".
slug: nib-and-nozzle
persona: hf-1557002195
domain: leisure
tags: [calligraphy, 3d-printing, makerspace-evenings]
isolation: "Every pass costs the same and both stations run the same length with a tutor; the alternative crafts are just as hands-on and the non-digital second stations just as absorbing — so the picks isolate the persona's own calligraphy and its fascination with 3D printing"
checks:
  - attribute: hob_calligraphy
    direction: exhibit
    label: nib
    viol_word: offnib
    signal: "The first stations chosen are calligraphy (broad-nib lettering, brush lettering, illuminated capitals) rather than the equally hands-on pottery, linocut and leather stations the makerspace pushes"
    judge_expected: "a devoted calligrapher who, offered a craft station, picks up the nib first."
    judge_held: "the user books passes whose first station is calligraphy (broad nib, brush lettering, illuminated capitals or similar), declining the pottery / linocut / leather swaps — one other craft alongside a calligraphy core still counts as HELD."
    judge_violated: "the user settles for the pottery / linocut / leather stations or keeps trading the calligraphy away for the swaps."
  - attribute: topic_3d_printing
    direction: exhibit
    label: printer
    viol_word: offprinter
    signal: "The second stations chosen are 3D printing (print-bay induction, design-and-print, resin printer) rather than the equally absorbing woodturning, screen-printing and candle stations the makerspace pushes"
    judge_expected: "a person fascinated by 3D printing — offered a second station, the print bay comes first."
    judge_held: "the user books passes whose second station is 3D printing (the induction, the bracket print, the resin session or similar), declining the lathe / screen-print / candle swaps — one other station alongside a printing core still counts as HELD."
    judge_violated: "the user settles for the lathe / screen-print / candle stations or keeps trading the 3D printing away for the swaps."

