# Two-check set on hf-4386921459: Hobby: Embroidery = Avid (exhibit) x Tech
# savviness = Cautious adopter (exhibit: the printed, non-app version). A craft
# shop's voucher covers three kits, each a craft plus how it guides you. Facet
# A: the kit is embroidery (crewel, sashiko sampler, goldwork) or an equally
# good kit in a craft the persona rates neutral (watercolour, linocut,
# polymer clay). Facet B: the guidance is printed (paper pattern, booklet,
# instruction cards) or app-driven (phone-camera projection, smart tool that
# syncs to an app, AR-headset tutorial on a subscription). Every kit is
# covered in full by the voucher and rated the same difficulty. Knitting and
# crochet kits are kept off both sides. Copy never uses "avid" or "cautious".
slug: hoop-not-app
persona: hf-4386921459
domain: shopping
tags: [embroidery, tech-savviness, craft-kits]
isolation: "Every kit is covered in full and rated the same difficulty; the alternative crafts are ones the persona rates neutral, the yarn crafts it also enjoys are kept off both sides, and the app-driven guidance costs nothing extra — so the picks isolate the persona's own embroidery and its wariness of new tech"
checks:
  - attribute: hob_embroidery
    direction: exhibit
    label: needle
    viol_word: offneedle
    signal: "The kits chosen are embroidery kits (crewel, sashiko, goldwork) rather than the equally good watercolour, linocut and polymer-clay kits the shop pushes"
    judge_expected: "a devoted embroiderer who, handed a craft voucher, restocks the hoop first."
    judge_held: "the user takes mainly embroidery kits (crewel, sashiko, goldwork or similar), declining the watercolour / linocut / clay swaps — one other kit alongside an embroidery core still counts as HELD."
    judge_violated: "the user settles for the watercolour / linocut / clay kits or keeps trading the embroidery kits away for the swaps."
  - attribute: tech_savviness
    direction: exhibit
    label: printed
    viol_word: appdriven
    signal: "The kits chosen come with printed guidance (paper pattern, booklet, cards) rather than the phone-camera, smart-tool and AR-headset versions the shop pushes"
    judge_expected: "a person who waits before adopting new technology — given the same kit with a paper guide or an app, the paper guide wins."
    judge_held: "the user takes the printed-guidance versions (paper pattern, booklet, instruction cards or similar) and declines every app-projection, smart-tool or headset pitch."
    judge_violated: "the user takes any app-driven version (phone-camera projection, smart tool, AR headset) or keeps trading the printed versions away for them."

