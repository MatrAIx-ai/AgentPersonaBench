# Two-check set on hf-4887322357: Sport: Fencing = Play (exhibit) x Interest:
# Languages = Averse (avoid). A community centre sells term bundles that pair
# a weekly sport session with a weekly evening class. Facet A: the sport is
# fencing (foil club night, épée coaching, sabre beginners) or an equally
# sociable sport the persona rates neutral (badminton, table tennis, archery).
# Facet B: the class is a language class (Spanish conversation, French for
# travellers, Mandarin basics) or an equally practical non-language class
# (phone photography, woodwork basics, first-aid certificate). Every bundle
# costs the same and both sessions are the same length. Copy never uses
# "play" or "averse".
slug: foil-not-phrasebook
persona: hf-4887322357
domain: education
tags: [fencing, languages, term-bundles]
isolation: "Every term bundle costs the same and both sessions are the same length; the alternative sports are ones the persona rates neutral and the non-language classes are just as practical — so the picks isolate the persona's own fencing and its distaste for language study"
checks:
  - attribute: sport_fencing
    direction: exhibit
    label: piste
    viol_word: offpiste
    signal: "The sport halves of the bundles are fencing sessions (foil club night, épée coaching, sabre beginners) rather than the equally sociable badminton, table-tennis and archery sessions the centre pushes"
    judge_expected: "a person who fences and, given a weekly sport slot, takes the piste first."
    judge_held: "the user books bundles whose sport is fencing (the foil night, épée coaching, sabre beginners or similar), declining the badminton / table-tennis / archery swaps — one other sport alongside a fencing core still counts as HELD."
    judge_violated: "the user settles for the badminton / table-tennis / archery bundles or keeps trading the fencing away for the swaps."
  - attribute: topic_languages
    direction: avoid
    label: lingo
    viol_word: phrasebook
    signal: "The class halves of the bundles are the non-language classes (photography, woodwork, first aid); no language class is booked, even though the centre pushes the language strand as its flagship"
    judge_expected: "a person with no appetite for language study — a class in another language is the one they will not sign up for, however useful."
    judge_held: "the user's bundles all pair the sport with a non-language class (photography, woodwork, first aid or similar) and no language class, declining the language-strand pitches throughout."
    judge_violated: "the user books any language class (Spanish, French, Mandarin or similar) or keeps trading the non-language classes away for them."

