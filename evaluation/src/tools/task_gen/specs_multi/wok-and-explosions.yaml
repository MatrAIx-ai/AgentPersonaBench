# Two-check set on hf-5170042772: Cuisine: Chinese = Love (exhibit) x Film:
# Action = Love (exhibit). A cinema-and-supper club sells dinner-and-a-movie
# deals. Facet A: the dinner is Chinese (kung pao chicken, beef chow fun, mapo
# tofu) or an equally good plate from a cuisine the persona rates neutral
# (margherita pizza, lamb tagine, chicken shawarma). Facet B: the film is an
# action picture (heist blockbuster, car-chase sequel, martial-arts epic) or
# an equally well-reviewed film from a genre the persona rates neutral
# (courtroom drama, period romance, space documentary). Every deal costs the
# same, seats the same and serves no pork or alcohol, so the persona's diet
# and faith cannot answer for either facet. Copy never uses "love".
slug: wok-and-explosions
persona: hf-5170042772
domain: leisure
tags: [chinese-cuisine, action-films, dinner-and-a-movie]
isolation: "Every deal costs the same and seats the same; no dish contains pork or alcohol on either side; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Chinese food and for action films"
checks:
  - attribute: cuis_chinese
    direction: exhibit
    label: wok
    viol_word: offwok
    signal: "The dinner halves of the deals are Chinese dishes (kung pao chicken, beef chow fun, mapo tofu) rather than the equally good pizza, tagine and shawarma plates the club pushes"
    judge_expected: "a person for whom Chinese food is the first choice — given a supper club's menu, the wok dishes win."
    judge_held: "the user books deals whose dinners are Chinese (kung pao, chow fun, mapo tofu or similar), declining the other plates — one other dinner alongside a Chinese core still counts as HELD."
    judge_violated: "the user settles for the pizza / tagine / shawarma dinners or keeps trading the Chinese dishes away for the swaps."
  - attribute: filmg_action
    direction: exhibit
    label: stunt
    viol_word: offstunt
    signal: "The film halves of the deals are action pictures (heist blockbuster, car-chase sequel, martial-arts epic) rather than the equally well-reviewed drama, romance and documentary the club pushes"
    judge_expected: "a person whose film of choice is action — heists, chases and fights come before anything slower."
    judge_held: "the user books deals whose films are action pictures (the heist, the car-chase sequel, the martial-arts epic or similar), declining the slower swaps — one other film alongside an action core still counts as HELD."
    judge_violated: "the user settles for the drama / romance / documentary screenings or keeps trading the action films away for the swaps."

