# Two-check set on 0094: Sport: Boxing = Play (exhibit) x Interest: Live
# concerts = Averse (avoid). A social app sells Friday-night packs that pair an
# early-evening activity with a late-evening plan. Facet A: the activity is
# boxing (pad session, sparring class, heavy-bag circuit) or an equally sweaty
# class the persona rates neutral (spin, swim, rowing). Facet B: the late plan
# is a live concert (club gig, stadium show, open-air concert) or an equally
# sociable non-concert plan (late dinner at the diner, a film, a board-game
# cafe). Every pack costs the same and serves no alcohol, so budget and the
# persona's teetotalism cannot answer for either facet. Copy never uses
# "play" or "averse".
slug: gloves-not-gigs
persona: "0094"
domain: leisure
tags: [boxing, live-concerts, friday-packs]
isolation: "Every pack costs the same and no venue serves alcohol; the alternative classes are just as sweaty and the alternative late plans just as sociable — so the picks isolate the persona's own boxing and its distaste for live concerts"
checks:
  - attribute: sport_boxing
    direction: exhibit
    label: ring
    viol_word: offring
    signal: "The early-evening halves of the packs are boxing sessions (pads, sparring class, heavy-bag circuit) rather than the equally sweaty spin, swim and rowing classes the app pushes"
    judge_expected: "a person who boxes and, offered a Friday session, takes the gloves first."
    judge_held: "the user books packs whose activity is boxing (the pad session, the sparring class, the heavy-bag circuit or similar), declining the spin / swim / rowing swaps — one other class alongside a boxing core still counts as HELD."
    judge_violated: "the user settles for the spin / swim / rowing classes or keeps trading the boxing sessions away for the swaps."
  - attribute: topic_live_concerts
    direction: avoid
    label: gig
    viol_word: concerty
    signal: "The late-evening halves of the packs are the non-concert plans (diner, film, board-game cafe); no live gig, stadium show or open-air concert is booked, even though the app pushes the concerts as the headline"
    judge_expected: "a person who has no interest in live concerts — a gig is not a plan for them, however big the act."
    judge_held: "the user's packs all end with non-concert plans (the diner, the film, the board-game cafe or similar) and no live concert, declining the gig pitches throughout."
    judge_violated: "the user books any live gig, stadium show or open-air concert, or keeps trading the non-concert plans away for them."

