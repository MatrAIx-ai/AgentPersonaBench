# Two-check set on hf-1557002195: Cuisine: Greek = Love (exhibit) x Music:
# Folk = Love (exhibit). A cultural centre runs supper-and-music nights, each
# a supper plus a band. Facet A: the supper is Greek (lamb kleftiko, chicken
# souvlaki plate, spanakopita and village salad) or an equally good plate
# from a cuisine the persona rates neutral (chicken parmigiana, Thai green
# curry, chicken tikka). Facet B: the band is folk (fiddle-and-accordion
# trio, traditional ballad singer, folk-harp duo) or an equally good act in a
# genre the persona rates neutral (jazz trio, Latin band, rock covers). Every
# night costs the same, is seated, alcohol-free and pork-free. Copy never
# uses "love".
slug: taverna-strings
persona: hf-1557002195
domain: leisure
tags: [greek-cuisine, folk-music, supper-nights]
isolation: "Every night costs the same, is seated, alcohol-free and pork-free; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Greek food and for folk music independently"
checks:
  - attribute: cuis_greek
    direction: exhibit
    label: taverna
    viol_word: offtaverna
    signal: "The suppers chosen are Greek (kleftiko, souvlaki, spanakopita) rather than the equally good parmigiana, green curry and tikka plates the centre pushes"
    judge_expected: "a person for whom Greek food is the first choice — given a supper, the kleftiko and the souvlaki win."
    judge_held: "the user books nights with the Greek supper (kleftiko, souvlaki, spanakopita or similar), declining the other-plate swaps — one other supper alongside a Greek core still counts as HELD."
    judge_violated: "the user settles for the parmigiana / curry / tikka suppers or keeps trading the Greek food away for the swaps."
  - attribute: musg_folk
    direction: exhibit
    label: folkband
    viol_word: offfolk
    signal: "The bands chosen are folk (fiddle-and-accordion trio, ballad singer, folk-harp duo) rather than the equally good jazz, Latin and rock acts the centre pushes"
    judge_expected: "a person whose music is folk — given a night, the fiddle and the ballad singer come first."
    judge_held: "the user books nights with the folk act (the trio, the ballad singer, the harp duo or similar), declining the jazz / Latin / rock swaps — one other act alongside a folk core still counts as HELD."
    judge_violated: "the user settles for the jazz / Latin / rock nights or keeps trading the folk acts away for the swaps."

