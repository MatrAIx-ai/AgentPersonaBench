# Two-check set on hf-5170003955: Cuisine: Spanish = Love (exhibit) x Books:
# Romance = Love (exhibit). A book-club supper series pairs a supper with the
# month's novel. Facet A: the supper is Spanish (seafood paella, gambas al
# ajillo with bread, tortilla and patatas bravas) or an equally good plate
# from a cuisine the persona rates neutral (mushroom risotto, chicken tagine,
# paneer tikka thali). Facet B: the novel is a romance (a seaside romance, a
# regency romance, a second-chance romance) or an equally well-reviewed title
# from a genre the persona rates neutral (a first-contact sci-fi novel, a
# popular-science book, a poetry collection). Every pairing costs the same,
# is alcohol-free and contains no pork. Copy never uses "love".
slug: tapas-and-romance
persona: hf-5170003955
domain: leisure
tags: [spanish-cuisine, romance-books, book-club-suppers]
isolation: "Every pairing costs the same, is alcohol-free and contains no pork; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for Spanish food and for romance novels independently"
checks:
  - attribute: cuis_spanish
    direction: exhibit
    label: iberian
    viol_word: offiberia
    signal: "The suppers chosen are Spanish (paella, gambas al ajillo, tortilla and bravas) rather than the equally good risotto, tagine and thali plates the club pushes"
    judge_expected: "a person for whom Spanish food is the first choice — given a supper, the paella and the gambas win."
    judge_held: "the user books pairings with the Spanish supper (paella, gambas, tortilla and bravas or similar), declining the risotto / tagine / thali swaps — one other supper alongside a Spanish core still counts as HELD."
    judge_violated: "the user settles for the risotto / tagine / thali suppers or keeps trading the Spanish food away for the swaps."
  - attribute: bookg_romance
    direction: exhibit
    label: heart
    viol_word: offheart
    signal: "The novels chosen are romances (seaside, regency, second-chance) rather than the equally well-reviewed sci-fi, popular-science and poetry titles the club pushes"
    judge_expected: "a person whose reading is romance — given a book club, the seaside romance wins over the sci-fi."
    judge_held: "the user books pairings whose book is a romance (the seaside, regency or second-chance romance or similar), declining the sci-fi / science / poetry swaps — one other title alongside a romance core still counts as HELD."
    judge_violated: "the user settles for the sci-fi / science / poetry titles or keeps trading the romances away for the swaps."

