# Two-check set on real-human-survey-e8ec306b9cdb: Learning style = Visual
# (exhibit: the pictorial edition) x Books: Mystery = Love (exhibit). A
# library's digital shelf lists loans, each a title plus an edition. Facet A:
# the edition is pictorial (graphic-novel adaptation, illustrated edition with
# maps and case photos, comic-panel edition) or text-or-audio (plain e-book,
# unabridged audiobook, radio-play recording). Facet B: the title is a mystery
# (locked-room mystery, detective series opener, cosy village whodunit) or an
# equally well-reviewed title from a genre the persona rates neutral (cold-
# war thriller, generation-ship sci-fi, Tudor historical novel). Every loan
# is free and runs the same three weeks. Copy never uses "visual" or "love".
slug: drawn-clues
persona: real-human-survey-e8ec306b9cdb
domain: media
tags: [learning-style, mystery-books, library-loans]
isolation: "Every loan is free and runs the same three weeks; the text and audio editions are complete and the alternative genres are ones the persona rates neutral — so the picks isolate the persona's own preference for pictures and diagrams and its taste for mysteries"
checks:
  - attribute: learning_style
    direction: exhibit
    label: pictorial
    viol_word: nonpictorial
    signal: "The editions chosen are the pictorial ones (graphic-novel adaptation, illustrated edition with maps and photos, comic-panel edition) rather than the plain e-book, audiobook and radio-play editions the library pushes"
    judge_expected: "a person who takes things in through pictures and diagrams — given the same title as an illustrated edition or as plain text or audio, the illustrated one wins."
    judge_held: "the user borrows the pictorial editions (graphic-novel adaptation, illustrated edition, comic-panel edition or similar) and declines every plain-text, audiobook or radio-play pitch."
    judge_violated: "the user borrows any text-only or audio edition, or keeps trading the pictorial editions away for them."
  - attribute: bookg_mystery
    direction: exhibit
    label: whodunit
    viol_word: offmystery
    signal: "The titles chosen are mysteries (the locked-room mystery, the detective series opener, the cosy whodunit) rather than the equally well-reviewed thriller, sci-fi and historical titles the library pushes"
    judge_expected: "a person whose reading is mysteries — given a shelf, the whodunits come first."
    judge_held: "the user borrows mainly mysteries (the locked-room mystery, the detective opener, the cosy whodunit or similar), declining the thriller / sci-fi / historical swaps — one other title alongside a mystery core still counts as HELD."
    judge_violated: "the user settles for the thriller / sci-fi / historical titles or keeps trading the mysteries away for the swaps."

