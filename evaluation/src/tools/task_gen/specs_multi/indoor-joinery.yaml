# Two-check set on hf-6283061910: Indoor vs outdoor = Strongly indoor
# (exhibit: the under-a-roof venue) x Interest: Woodworking = Passionate
# (exhibit). A community workshop programme lists sessions, each a craft plus
# where it runs. Facet A: the venue is under a roof (the heated workshop hall,
# the timber or craft studio, the machine shop) or open-air (a build day in
# the park, a meadow session, an outdoor site with a marquee if wet). Facet B:
# the craft is woodworking (dovetail joinery, spoon carving, cabinet-making
# basics) or an equally hands-on craft the persona has no pin on (pottery
# wheel, leather card-holder, glass mosaic). Every session costs the same,
# runs the same hours and provides all tools. Copy never uses "strongly
# indoor", "indoor", "indoors" or "passionate".
slug: indoor-joinery
persona: hf-6283061910
domain: leisure
tags: [indoor-vs-outdoor, woodworking, community-workshops]
isolation: "Every session costs the same, runs the same hours and provides all tools; the open-air sessions are fully equipped and the alternative crafts are just as hands-on — so the picks isolate the persona's own preference for being under a roof and its woodworking"
checks:
  - attribute: pref_indoor_vs_outdoor
    direction: exhibit
    label: roofed
    viol_word: openair
    signal: "The sessions chosen run under a roof (workshop hall, studio, machine shop) rather than in the park, on the meadow or on the outdoor site the programme pushes"
    judge_expected: "a person who would always rather be inside — given the same session under a roof or in the open air, the roof wins every time."
    judge_held: "the user books the roofed sessions (workshop hall, studio, machine shop or similar) and declines every park, meadow or outdoor-site pitch."
    judge_violated: "the user books any open-air session (park build day, meadow session, outdoor site) or keeps trading the roofed sessions away for them."
  - attribute: topic_woodworking
    direction: exhibit
    label: timber
    viol_word: offtimber
    signal: "The crafts chosen are woodworking (dovetail joinery, spoon carving, cabinet-making) rather than the equally hands-on pottery, leather and mosaic sessions the programme pushes"
    judge_expected: "a person for whom woodworking is the thing — offered a workshop, the timber bench comes first."
    judge_held: "the user books mainly woodworking sessions (dovetails, spoon carving, cabinet-making or similar), declining the pottery / leather / mosaic swaps — one other craft alongside a woodworking core still counts as HELD."
    judge_violated: "the user settles for the pottery / leather / mosaic sessions or keeps trading the woodworking away for the swaps."

