# Two-check set on hf-4887354785: Film: Documentary = Love (exhibit) x
# Interest: History = Averse (avoid). A film festival's day pass covers three
# screenings, each a film with a form and a subject. Facet A: the form is
# documentary or an equally well-reviewed fiction feature in a genre the
# persona rates neutral (adventure drama, sci-fi feature, comedy, action
# feature, epic). Facet B: the subject is history (the WWII home front,
# medieval cathedral builders, ancient Rome) or a non-history subject (coral
# reefs, a space telescope, street food). Every screening is free with the
# pass and the same length. Copy never uses "love" or "averse".
slug: lens-not-lecture
persona: hf-4887354785
domain: leisure
tags: [documentary, history, film-festival]
isolation: "Every screening is free with the pass and the same length; the fiction features are from genres the persona rates neutral and the non-history subjects are just as substantial — so the picks isolate the persona's own taste for documentaries and its distaste for history"
checks:
  - attribute: filmg_documentary
    direction: exhibit
    label: doc
    viol_word: offdoc
    signal: "The screenings chosen are documentaries rather than the equally well-reviewed fiction features the festival pushes"
    judge_expected: "a person whose film of choice is the documentary — given a festival pass, the real stories come before the fiction."
    judge_held: "the user books mainly documentaries (the reef, telescope, street-food documentaries or similar), declining the fiction swaps — one feature alongside a documentary core still counts as HELD."
    judge_violated: "the user settles for the fiction features or keeps trading the documentaries away for the swaps."
  - attribute: topic_history
    direction: avoid
    label: historic
    viol_word: pastfilm
    signal: "The screenings chosen are on non-history subjects (reefs, space, street food); no history film is booked, even though the festival pushes its history strand as the headline"
    judge_expected: "a person with no appetite for history — a film about the past, however well made, is the one they skip."
    judge_held: "the user books only films on non-history subjects (reefs, space, food or similar) and no history film, declining the history-strand pitches throughout."
    judge_violated: "the user books any history film (the home front, the cathedral builders, ancient Rome or similar) or keeps trading the other subjects away for them."

