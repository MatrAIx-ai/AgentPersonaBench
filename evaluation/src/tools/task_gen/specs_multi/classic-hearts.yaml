# Two-check set on hf-4386921459: Film: Romance = Love (exhibit) x
# Adventurousness = Low (exhibit: the familiar format). A cinema club's month
# offers screenings, each a film plus the format it is shown in. Facet A: the
# film is a romance (classic re-release, well-known 90s romance, restored
# romantic drama) or an equally well-reviewed film from a genre the persona
# rates neutral (crime caper, gentle comedy, musician's biopic). Facet B: the
# format is the familiar one (regular screening, the usual auditorium,
# standard seats) or a novel one (audience-vote alternate ending, secret-
# screening title revealed at the door, 360-degree dome with headset). Every
# screening is free with membership and the same length. Copy never uses
# "love" or the word "low".
slug: classic-hearts
persona: hf-4386921459
domain: leisure
tags: [romance-films, adventurousness, cinema-club]
isolation: "Every screening is free with membership and the same length; the alternative genres are ones the persona rates neutral and the novel formats cost nothing extra — so the picks isolate the persona's own taste for romance and its preference for the familiar over the untried"
checks:
  - attribute: filmg_romance
    direction: exhibit
    label: heart
    viol_word: offheart
    signal: "The screenings chosen are romances (the classic re-release, the 90s romance, the restored romantic drama) rather than the equally well-reviewed caper, comedy and biopic the club pushes"
    judge_expected: "a person whose film of choice is romance — given a club month, the classic romances come first."
    judge_held: "the user books mainly romance screenings (the re-release, the 90s romance, the restored drama or similar), declining the caper / comedy / biopic swaps — one other film alongside a romance core still counts as HELD."
    judge_violated: "the user settles for the caper / comedy / biopic screenings or keeps trading the romances away for the swaps."
  - attribute: big5_adventurousness
    direction: exhibit
    label: familiar
    viol_word: novelty
    signal: "The formats chosen are the familiar ones (regular screening, the usual auditorium, standard seats) rather than the audience-vote, secret-screening and dome-headset formats the club pushes"
    judge_expected: "a person who prefers the tried and familiar — given the same film in the usual format or an experimental one, the usual one wins every time."
    judge_held: "the user books the familiar formats (regular screening, usual auditorium, standard seats or similar) and declines every audience-vote, secret-screening or dome-headset pitch."
    judge_violated: "the user books any novel format (alternate-ending vote, secret screening, 360-degree dome) or keeps trading the familiar formats away for them."

