  web_task_line: "Your cinema-club membership gives you three free screenings this month, each listed as a film plus the format it is shown in. Add the **3 screenings** you'd genuinely book from the ClubMonth page."
  web_prefix: cm
  web_addendum: "You are booking your own three free cinema-club screenings this month, each a film plus its format. Add the 3 you'd genuinely book."
  app_name: ScreenClub
