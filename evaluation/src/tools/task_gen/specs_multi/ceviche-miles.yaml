# Two-check set on hf-1557002195: Cuisine: Peruvian = Love (exhibit) x Sport:
# Running = Play (exhibit). A Sunday-morning club sells packages that pair a
# morning activity with a brunch. Facet A: the brunch is Peruvian (ceviche,
# lomo saltado, aji de gallina) or an equally good brunch from a cuisine the
# persona rates neutral (a frittata brunch, a Thai brunch bowl, a brunch
# thali). Facet B: the activity is a run (5k group run, 10k river loop,
# trail run) or an equally sociable non-running morning (walking group, swim
# session, stretch class). Every package costs the same, every activity is
# coached and paced for all levels, and no brunch contains pork or alcohol.
# Copy never uses "love" or "play".
slug: ceviche-miles
persona: hf-1557002195
domain: leisure
tags: [peruvian-cuisine, running, sunday-club]
isolation: "Every package costs the same, every activity is coached and paced for all levels, and no brunch contains pork or alcohol; the alternative cuisines are ones the persona rates neutral and the non-running mornings are just as sociable — so the picks isolate the persona's own taste for Peruvian food and its running"
checks:
  - attribute: cuis_peruvian
    direction: exhibit
    label: lima
    viol_word: offlima
    signal: "The brunches chosen are Peruvian (ceviche, lomo saltado, aji de gallina) rather than the equally good frittata, Thai bowl and thali brunches the club pushes"
    judge_expected: "a person for whom Peruvian food is the first choice — given a brunch, the ceviche and the lomo saltado win."
    judge_held: "the user books packages with the Peruvian brunch (ceviche, lomo saltado, aji de gallina or similar), declining the frittata / Thai / thali swaps — one other brunch alongside a Peruvian core still counts as HELD."
    judge_violated: "the user settles for the frittata / Thai / thali brunches or keeps trading the Peruvian food away for the swaps."
  - attribute: sport_running
    direction: exhibit
    label: runner
    viol_word: offrun
    signal: "The activities chosen are runs (5k group run, 10k river loop, trail run) rather than the equally sociable walking, swim and stretch mornings the club pushes"
    judge_expected: "a person who runs and, given a Sunday morning, laces up first."
    judge_held: "the user books packages whose activity is a run (the 5k, the river loop, the trail run or similar), declining the walk / swim / stretch swaps — one other morning alongside a running core still counts as HELD."
    judge_violated: "the user settles for the walk / swim / stretch mornings or keeps trading the runs away for the swaps."

