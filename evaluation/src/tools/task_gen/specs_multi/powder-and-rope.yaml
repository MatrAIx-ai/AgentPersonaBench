# Two-check set on hf-4386921459: Sport: Snowboarding = Play (exhibit) x
# Hobby: Rock climbing = Active (exhibit). A mountain resort sells day passes
# that pair a morning session with an afternoon session. Facet A: the morning
# is snowboarding (park session, guided off-piste, freestyle clinic) or an
# equally outdoor snow activity the persona rates neutral (snowshoe trek,
# cross-country loop, sledging run). Facet B: the afternoon is climbing (top-
# rope wall, lead clinic, bouldering cave) or an equally good indoor session
# (sauna and plunge, curling taster, photography walk). Every pass costs the
# same and both sessions are the same length and coached. Copy never uses
# "play" or "active".
slug: powder-and-rope
persona: hf-4386921459
domain: leisure
tags: [snowboarding, rock-climbing, resort-day-pass]
isolation: "Every day pass costs the same and both sessions are the same length and coached; the alternative mornings are equally outdoor and the alternative afternoons equally restorative — so the picks isolate the persona's own snowboarding and its climbing"
checks:
  - attribute: sport_snowboarding
    direction: exhibit
    label: board
    viol_word: offboard
    signal: "The morning halves of the day passes are snowboarding sessions (park, guided off-piste, freestyle clinic) rather than the equally outdoor snowshoe, cross-country and sledging mornings the resort pushes"
    judge_expected: "a person who snowboards and, given a mountain morning, is on the board first."
    judge_held: "the user books passes whose morning is snowboarding (the park session, the off-piste morning, the freestyle clinic or similar), declining the snowshoe / cross-country / sledging swaps — one other morning alongside a boarding core still counts as HELD."
    judge_violated: "the user settles for the snowshoe / cross-country / sledging mornings or keeps trading the boarding away for the swaps."
  - attribute: hob_rock_climbing
    direction: exhibit
    label: rope
    viol_word: offrope
    signal: "The afternoon halves of the day passes are climbing sessions (top-rope wall, lead clinic, bouldering cave) rather than the equally good sauna, curling and photography afternoons the resort pushes"
    judge_expected: "a person who climbs regularly — offered an afternoon session, the wall comes first."
    judge_held: "the user books passes whose afternoon is climbing (the top-rope hour, the lead clinic, the bouldering cave or similar), declining the sauna / curling / photography swaps — one other afternoon alongside a climbing core still counts as HELD."
    judge_violated: "the user settles for the sauna / curling / photography afternoons or keeps trading the climbing away for the swaps."

