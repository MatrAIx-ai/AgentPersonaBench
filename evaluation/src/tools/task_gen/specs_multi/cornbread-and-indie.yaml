# Two-check set on hf-2050687254: Cuisine: Southern soul food = Love
# (exhibit) x Music: Indie = Love (exhibit). A supper club runs nights that
# pair a menu with a band. Facet A: the menu is Southern soul food (smothered
# chicken and cornbread, catfish and cheese grits, chicken and waffles) or an
# equally good plate from a cuisine the persona rates neutral (chicken
# parmigiana, chicken souvlaki plate, chicken tikka masala). Facet B: the
# band is indie (an indie four-piece, an indie singer-songwriter, a jangle-
# pop indie trio) or an equally good act in a genre the persona rates
# neutral (jazz quartet, country duo, pop covers band). Every night costs the
# same, is alcohol-free and serves no beef or pork. Copy never uses "love".
slug: cornbread-and-indie
persona: hf-2050687254
domain: leisure
tags: [soul-food, indie-music, supper-club]
isolation: "Every night costs the same, is alcohol-free and serves no beef or pork; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own taste for soul food and for indie music independently"
checks:
  - attribute: cuis_southern_soul_food
    direction: exhibit
    label: soulfood
    viol_word: offsoulfood
    signal: "The menus chosen are Southern soul food (smothered chicken, catfish and grits, chicken and waffles) rather than the equally good parmigiana, souvlaki and tikka plates the club pushes"
    judge_expected: "a person for whom Southern soul food is the first choice — given a supper, the catfish and the cornbread win."
    judge_held: "the user books nights with the soul-food menu (smothered chicken, catfish and grits, chicken and waffles or similar), declining the parmigiana / souvlaki / tikka swaps — one other menu alongside a soul-food core still counts as HELD."
    judge_violated: "the user settles for the parmigiana / souvlaki / tikka menus or keeps trading the soul food away for the swaps."
  - attribute: musg_indie
    direction: exhibit
    label: indieband
    viol_word: offindie
    signal: "The bands chosen are indie (the four-piece, the singer-songwriter, the jangle-pop trio) rather than the equally good jazz, country and pop acts the club pushes"
    judge_expected: "a person whose music is indie — given a night, the four-piece and the singer-songwriter come first."
    judge_held: "the user books nights with the indie act (the four-piece, the singer-songwriter, the jangle-pop trio or similar), declining the jazz / country / pop swaps — one other act alongside an indie core still counts as HELD."
    judge_violated: "the user settles for the jazz / country / pop nights or keeps trading the indie acts away for the swaps."

