# Two-check set on hf-5170043725: Tech savviness = Avoidant (exhibit: the
# paper, in-person format) x Hobby: Stamp collecting = Active (exhibit). A
# collectors' fair day pass covers three sessions, each a session plus how it
# runs. Facet A: the session runs on paper and in person (printed catalogue,
# trades at the table, paper price lists, an appraiser at a desk) or through
# the fair's app (QR-code trading, app-only auction, photo upload and
# valuation by message). Facet B: the session is stamps (swap table, first-
# day-cover dealers, philatelic appraisal) or an equally good session in a
# collecting field the persona has no pin on (vintage postcards, enamel
# badges, film cameras). Every session is free with the pass and the same
# length. Copy never uses "avoidant" or "active".
slug: paper-philately
persona: hf-5170043725
domain: leisure
tags: [tech-savviness, stamp-collecting, collectors-fair]
isolation: "Every session is free with the pass and the same length; the app-run sessions are just as well organised and the other collecting fields are just as lively — so the picks isolate the persona's own avoidance of apps and screens and its stamp collecting"
checks:
  - attribute: tech_savviness
    direction: exhibit
    label: paperbased
    viol_word: appbased
    signal: "The sessions chosen are the paper, in-person formats (printed catalogue, trades at the table, an appraiser at a desk) rather than the QR-code, app-auction and photo-upload formats the fair pushes"
    judge_expected: "a person who keeps technology at arm's length — given the same session on paper or through an app, the paper version wins every time."
    judge_held: "the user books the paper, in-person formats (printed catalogue, table trades, desk appraisal or similar) and declines every app, QR-code or upload pitch."
    judge_violated: "the user books any app-run format (QR trading, app auction, photo upload) or keeps trading the paper formats away for them."
  - attribute: hob_stamp_collecting
    direction: exhibit
    label: philately
    viol_word: offstamps
    signal: "The sessions chosen are stamp sessions (swap table, first-day-cover dealers, philatelic appraisal) rather than the equally lively postcard, badge and camera sessions the fair pushes"
    judge_expected: "a person who collects stamps and keeps at it — given a fair, the stamp tables come first."
    judge_held: "the user books mainly stamp sessions (the swap table, the cover dealers, the appraisal or similar), declining the postcard / badge / camera swaps — one other field alongside a stamp core still counts as HELD."
    judge_violated: "the user settles for the postcard / badge / camera sessions or keeps trading the stamp sessions away for the swaps."

