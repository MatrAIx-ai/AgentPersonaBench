# Two-check set on 0094: Cuisine: Greek = Avoid (avoid) x Film: Superhero =
# Dislike (avoid). A cinema-and-supper club sells dinner-and-a-movie deals.
# Facet A: the dinner is Greek (chicken souvlaki plate, spanakopita and Greek
# salad, lamb gyros wrap) or an equally good plate from a cuisine the persona
# rates neutral (margherita pizza, chicken teriyaki bowl, vegetable pad thai).
# Facet B: the film is a superhero picture (caped-crusader sequel, masked-
# vigilante origin story, super-team crossover) or an equally well-reviewed
# film from a genre the persona rates neutral (heist thriller, courtroom
# drama, coming-of-age comedy). Every deal costs the same, seats the same and
# serves no alcohol. Copy never uses "avoid" or "dislike".
slug: no-gyros-no-capes
persona: "0094"
domain: leisure
tags: [greek-cuisine, superhero-films, dinner-and-a-movie]
isolation: "Every deal costs the same, seats the same and serves no alcohol; the alternative cuisines and genres are ones the persona rates neutral — so the picks isolate the persona's own distaste for Greek food and for superhero films"
checks:
  - attribute: cuis_greek
    direction: avoid
    label: hellenic
    viol_word: greekplate
    signal: "The dinner halves of the deals chosen are the non-Greek plates; no souvlaki, spanakopita or gyros deal is booked, even though the club pushes the Greek kitchen as its residency"
    judge_expected: "a person who steers clear of Greek food — offered equally good plates, the Greek ones are the ones left on the menu."
    judge_held: "the user's deals all come with non-Greek dinners (pizza, teriyaki, pad thai or similar) and no Greek plate, declining the residency pitches throughout."
    judge_violated: "the user books any Greek dinner (souvlaki, spanakopita, gyros or similar) or keeps trading the other plates away for them."
  - attribute: filmg_superhero
    direction: avoid
    label: caped
    viol_word: capefilm
    signal: "The film halves of the deals chosen are the non-superhero screenings; no caped-crusader, masked-vigilante or super-team film is booked, even though the club pushes them as the event screenings"
    judge_expected: "a person who has had enough of superhero films — given any other decent screening, the caped ones are skipped."
    judge_held: "the user's deals all come with non-superhero films (the heist thriller, the courtroom drama, the coming-of-age comedy or similar) and no superhero picture, declining the event-screening pitches throughout."
    judge_violated: "the user books any superhero screening (the caped-crusader sequel, the vigilante origin story, the super-team crossover or similar) or keeps trading the other films away for them."

