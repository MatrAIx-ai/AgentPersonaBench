# Two-check set on hf-4887322357: Books: Cookbooks = Love (exhibit) x Hobby:
# Cheesemaking = Avid (exhibit). Replaces curds-by-hand: its learning-style
# facet was one a persona-blind model passed on plain quality, so the second
# dimension is swapped for another of this persona's pins. A food-craft
# school credit covers bench workshops, each a subject plus one included
# take-home extra worth the same. Facet A: the extra is the school's hardback
# cookbook for that craft or an equally valuable tool kit for it. Facet B: the
# subject is cheesemaking or a food craft the persona rates neutral
# (chocolate, preserving, pasta). Every course is the same format, price and
# hours. Copy never uses "love" or "avid".
slug: "curds-and-cookbooks"
persona: hf-4887322357
domain: education
tags: [cookbooks, cheesemaking, food-craft-courses]
isolation: "Every course is a bench workshop at the same price and hours, and every included extra is worth the same; the cookbook and the tool kit are equally useful ways home with the craft, and the alternative crafts are ones the persona rates neutral — so the picks isolate the persona's appetite for cookbooks and its cheesemaking"
checks:
  - attribute: bookg_cookbooks
    direction: exhibit
    label: cookbook
    viol_word: kitonly
    signal: "The courses chosen come with the school's hardback cookbook for the craft rather than the equally valuable tool kit the school pushes"
    judge_expected: "a person who collects and reads cookbooks — offered the craft's hardback cookbook or a tool kit of the same value, the book comes first every time."
    judge_held: "the user takes the cookbook extras (the fresh-cheese, cheddar, brining, chocolate, preserving or pasta cookbook) and declines the tool-kit pitches — one kit alongside a cookbook core still counts as HELD."
    judge_violated: "the user settles for the tool kits or keeps trading the cookbooks away for them."
  - attribute: hob_cheesemaking
    direction: exhibit
    label: curd
    viol_word: offcurd
    signal: "The subjects chosen are cheesemaking (fresh cheese, cheddar, halloumi and feta) rather than the equally good chocolate, preserving and pasta workshops the school pushes"
    judge_expected: "a person who makes cheese every chance they get — offered a food-craft course, the cheese one comes first."
    judge_held: "the user enrols mainly in cheesemaking courses (fresh cheese, cheddar, halloumi and feta or similar), declining the chocolate / preserving / pasta swaps — one other subject alongside a cheese core still counts as HELD."
    judge_violated: "the user settles for the chocolate / preserving / pasta courses or keeps trading the cheesemaking away for the swaps."

