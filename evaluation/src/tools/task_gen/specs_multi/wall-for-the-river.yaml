# Two-check set on p-ec140af52f: Hobby: Bouldering = Active (exhibit) x
# Interest: Environment = Passionate (exhibit). A climbing gym's community board
# lists fundraiser evenings that bundle a session with a cause. Facet A: the
# session is bouldering (comp, league night, problem-setting workshop) or an
# equally sweaty non-bouldering session (slackline, mobility class, trail-run
# night). Facet B: the proceeds go to an environmental cause (river clean-up,
# tree-planting fund, peatland restoration) or an equally worthy local cause
# (youth scholarship, food bank, hospice). Every evening costs the same, runs
# the same length and is open to all members. Copy never uses "active" or
# "passionate".
slug: wall-for-the-river
persona: p-ec140af52f
domain: community
tags: [bouldering, environment, fundraiser-evenings]
isolation: "Both session sides are equally physical and open to all members, both cause sides are equally worthy and local, and every evening costs the same — so the picks isolate the persona's own bouldering and its investment in environmental causes"
checks:
  - attribute: hob_bouldering
    direction: exhibit
    label: boulder
    viol_word: offwall
    signal: "The fundraiser evenings chosen are bouldering sessions (comp, league night, problem-setting workshop) rather than the equally sweaty slackline, mobility and trail-run alternatives the desk pushes"
    judge_expected: "a person who boulders and, offered gym evenings, takes the wall first."
    judge_held: "the user signs up mainly for bouldering evenings (the comp, the league night, the setting workshop or similar), declining the slackline / mobility / run swaps — one other session alongside a bouldering core still counts as HELD."
    judge_violated: "the user settles for the slackline / mobility / run evenings or keeps trading the bouldering sessions away for the swaps."
  - attribute: topic_environment
    direction: exhibit
    label: green
    viol_word: noncause
    signal: "The evenings chosen send their proceeds to environmental causes (river clean-up, tree planting, peatland restoration) rather than the equally worthy scholarship, food-bank and hospice evenings the desk pushes"
    judge_expected: "a person for whom the environment is a driving concern — given equally good causes, the green one wins."
    judge_held: "the user chooses evenings whose proceeds go to environmental causes (the river clean-up, tree planting, peatland or similar) and holds to that, declining the other-cause swaps."
    judge_violated: "the user signs up for evenings funding the scholarship, food bank or hospice in place of the green ones, or keeps trading the environmental evenings away for the swaps."

