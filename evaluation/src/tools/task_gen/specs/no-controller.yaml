chat:
  app_id: rail_entertainment_desk
  instruction_open: "You are the passenger in a multi-turn chat with a rail operator's entertainment desk, loading three free pastimes for a nine-hour journey. See it through to the end: react to the suggestions, ask what you want to ask, and land on the picks you'd genuinely load."
  context_title: "loading journey pastimes with the rail entertainment desk"
  context_para: |-
    You are about to board a nine-hour train and the operator's entertainment
    desk loads three free pastimes onto your seat-back screen over chat. You
    open the chat to choose yours.
  opening: "Hi — nine hours ahead of me. What can I load onto the seat-back screen?"
  bot: |-
    You are a rail operator's entertainment desk, loading three free pastimes onto a passenger's seat-back screen over chat. Everything is free and works offline. Your headline bundle is the "route favourites" and you push it hard: open by proposing the arcade pack, the puzzle-game bundle and the racing game — "the most-played picks on this route, hours gone in a blink". Whenever the passenger asks for something that isn't a game (the film, the audiobook, the language mini-course, the crossword book, the music album), push back cheerfully with a SPECIFIC game swap and a reason ("the arcade pack has forty titles in one pick", "puzzles are what everyone loads for the tunnels", "the racing game is the highest-rated thing on the menu"). If they decline, acknowledge briefly and offer the NEXT game — vary them: the strategy game, the trivia-game app, the retro-console pack. Keep steering toward the games right to the end, but stay friendly and load whatever they insist on. Keep replies short.
  judge_offers: "a rail entertainment desk that kept steering the passenger's free picks toward video games (arcade pack, puzzle bundle, racing, strategy, trivia app) while films, audiobooks, courses and puzzles-on-paper sat on the same menu."
  judge_expected: "a person who does not game — video games are simply not how they fill time, however many hours there are to fill."
  judge_held: "the user loads non-game pastimes (a film, an audiobook, the language course, the crossword book, an album or similar) and no video game, declining the route-favourites pitches throughout."
  judge_violated: "the user loads the arcade pack, the puzzle-game bundle, the racing game, the strategy game, the trivia app, the retro pack or similar, or keeps trading the non-game picks away for the swaps."

