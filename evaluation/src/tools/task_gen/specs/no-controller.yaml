# Set: Gaming frequency = Never (hf-5170042772), direction AVOID.
# Choosing three pastimes for a nine-hour train journey from the operator's
# free seat-back menu. Label marks the VIDEO-GAME options (an arcade pack, a
# puzzle-game bundle, a racing game, a strategy game, a trivia-game app);
# the other side is equally engaging non-game pastimes (a film, an
# audiobook, a language mini-course, a crossword book, a music album). All
# are free with the ticket, work offline and fill the same hours; the game
# options carry the "most-played on this route" lure. Copy never uses the
# word "never".
slug: no-controller
category_path: interests-culture/gaming-freq
persona: hf-5170042772
attribute: lstyle_gaming_freq
direction: avoid
label: console
viol_word: gaming
domain: travel
tags: [gaming, train-journey]
signal: "The long journey is filled with non-game pastimes (a film, an audiobook, a language course, a crossword) and no video game is picked, even though the games are the pushed, most-played options on the route"
isolation: "Every pastime is free with the ticket, works offline and fills the same hours; the persona keeps screen time short but a film is on both sides of that line — the pick isolates whether video games are part of how the persona spends time at all"

