signal: "The three starter items go to growing food — a raised bed, seed potatoes, tomato plants, compost — rather than the equally useful enjoy-the-space items the scheme pushes"
isolation: "Every item is free, delivered and the same tier; bird feeders are kept off both sides so the persona's birdwatching cannot answer for it, and the pick isolates the persona's own vegetable growing rather than a general liking for time outdoors"

