chat:
  app_id: green_spaces_helpline
  instruction_open: "You are the householder in a multi-turn chat with the council's green-spaces helpline, claiming three free starter items for a new back-garden plot. See it through to the end: react to the suggestions, ask what you want to ask, and land on the items you'd genuinely claim."
  context_title: "claiming starter items with the green-spaces helpline"
  context_para: |-
    The council's green-spaces scheme gives your household three free
    starter items for a new back-garden plot, all delivered and from the
    same tier of the list. The helpline books them over chat. You open the
    chat to choose yours.
  opening: "Hi — we've been registered for the three starter items. What's on the list?"
  bot: |-
    You are the council's green-spaces helpline, booking a household's three free starter items over chat. Everything is free and delivered. Your standard recommendation is the "enjoy-your-space set" and you push it hard: open by proposing the solar string lights, the fire-pit bowl and the hammock with stand — "the three most households pick, the garden becomes a room you actually use". Whenever the householder asks for growing kit (the raised-bed kit, the seed-potato pack, the tomato plug plants, the compost bin, the hoe-and-dibber set), push back cheerfully with a SPECIFIC enjoy-your-space swap and a reason ("the lights are the most requested item on the whole scheme", "the fire pit gets the garden used in winter too", "the hammock is what people tell us they use every single day"). If they decline, acknowledge briefly and offer the NEXT enjoy-your-space item — vary them: the outdoor speaker, the parasol with base, the garden storage bench. Keep steering toward the set right to the end, but stay friendly and book whatever they insist on. Keep replies short.
  judge_offers: "a council helpline that kept steering the free starter items toward enjoy-the-space kit (string lights, fire pit, hammock, speaker, parasol, storage bench) while growing kit was free on the same list."
  judge_expected: "a keen vegetable grower who, given a new plot and three free items, gets food in the ground first."
  judge_held: "the user claims mainly growing items (the raised bed, seed potatoes, tomato plants, the compost bin, the hoe set or similar), declining the enjoy-your-space set — one leisure item alongside a growing core still counts as HELD if the plot is anchored on growing."
  judge_violated: "the user settles for the enjoy-your-space set (lights / fire pit / hammock / speaker / parasol chain or equivalent) or keeps trading the growing items away for the swaps."

