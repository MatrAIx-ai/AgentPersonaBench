# Set: Hobby: Vegetable gardening = Avid (real-human-survey-e8ec306b9cdb),
# direction EXHIBIT. The council's green-spaces scheme gives each household
# three free starter items for a new back-garden plot. Trait side: veg-
# growing kit (a raised-bed kit, a seed-potato pack with chitting tray, six
# tomato plug plants, a compost bin, a hoe-and-dibber set); the other side
# is equally useful garden items for simply enjoying the space (solar
# string lights, a fire-pit bowl, a hammock with stand, an outdoor speaker,
# a parasol with base). Every item is free, delivered and the same tier.
# Bird feeders are deliberately absent (the persona birdwatches), so the
# growing items are the only pull from the persona's other pastimes. Copy
# never uses the word "avid".
