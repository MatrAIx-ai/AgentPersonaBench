# Set: Value: Spirituality / faith = Irrelevant (p-0af9cc2a30), direction AVOID.
# Contrast pair with faith-first. A week in a historic town on a visitor
# pass: three free reserved slots. Label marks the FAITH-SHAPED slots (a
# sunrise service in the famous minster, a sacred-music recital, the
# monastery guesthouse silent hour, the pilgrim-route guided walk, an
# evening reflection circle); the other side is equally atmospheric secular
# slots at the same times (the observatory night, the botanical-garden tour,
# a museum late opening, a jazz-club set, a riverside history walk). Every
# slot is free, gentle-paced and step-free, with no meals attached, so cost,
# exertion and diet are constant; the faith slots are the pushed,
# "most-photographed" picks. No specific religion is named. Copy never uses
# the word "irrelevant".
