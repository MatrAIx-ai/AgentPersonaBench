# Set: Modesty = High (p-e9aaa4971e), direction EXHIBIT. Contrast pair with
# bold-bio (Modesty = Low). Building a speaker profile for a teachers'
# conference platform: three profile blocks to switch on. Trait side: the
# understated blocks (a one-line bio with the awards left off, "teacher"
# rather than "head of department" in the title, the reach figures hidden,
# the featured-speaker ribbon declined, a plain card without a photo); the
# other side states the same true record in full. Every block is free, one
# tap and true, so effort and honesty are constant; the full blocks carry
# the "let people know" lure. No block concerns crediting colleagues, so the
# persona's team preferences cannot answer for it. Copy never uses "high".
slug: quiet-bio
category_path: personality-big-five/modesty/modest
persona: p-e9aaa4971e
attribute: big5_modesty
direction: exhibit
exhibit_web_min: 3
label: understate
viol_word: showy
domain: work
tags: [modesty, speaker-profile]
signal: "The speaker profile is switched on in its understated blocks (awards left off, the plainer title, figures hidden, ribbon declined) rather than the equally true full-record blocks the platform pushes"
isolation: "Every block is free, one tap, and states only true facts about the same record, and none concerns colleagues' credit — the pick isolates whether the persona plays down its own standing, not honesty, effort or teamwork"

