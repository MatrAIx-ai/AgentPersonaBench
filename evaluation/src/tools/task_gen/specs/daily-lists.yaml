signal: "The new tablet's tool slots go to list-based tools (today list, checklist packs, task inbox) rather than the freestyle tools, even though freestyle is pitched as friction-free"
isolation: "Every tool is free on the same tablet, so working style is the only axis and the pick isolates the list habit from cost or features"

