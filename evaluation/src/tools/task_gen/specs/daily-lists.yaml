# Set: To-do lists = Daily (p-ec140af52f), direction EXHIBIT.
# Setting up a new work tablet's productivity tools. Trait-side options are
# list-based tools; the rest are freestyle tools pitched as friction-free.
# All free, same tablet. Label marks the LIST side; bars mirror the daily set
# (survey full-bar, web >=2/3, app all picks). Copy never uses the word
# "daily". Contrast pair: no-todo-lists pins the same dimension at "Never"
# on p-e9aaa4971e.
