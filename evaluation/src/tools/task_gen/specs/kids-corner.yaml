# Set: Interest: Parenting = Passionate (p-0af9cc2a30), direction EXHIBIT.
# A free talks-and-workshops pass at a city learning centre: three seats.
# Trait side: evidence-based sessions on raising children (toddler sleep
# science, reading with under-fives, teens and screens, early language,
# play-based learning); the other side is equally rigorous, equally popular
# general talks (exoplanets, medieval maps, deep-sea life, the history of
# encryption, urban beekeeping). Every session is free, seated, the same
# length and the same evenings, and both sides are intellectually rich, so
# curiosity and love of learning cannot answer for it — only the topic pull.
# Copy never uses the word "passionate".
