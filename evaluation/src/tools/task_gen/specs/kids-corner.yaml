signal: "The talks pass goes to the sessions on raising children (toddler sleep, reading with under-fives, teens and screens) rather than to the equally rigorous general-interest talks in the same slots"
isolation: "Every session is free, seated, the same length and on the same evenings, and both sides are evidence-based and equally popular — the pick isolates the persona's pull toward the topic of raising children, not its general curiosity"

