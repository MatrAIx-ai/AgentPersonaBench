survey:
  - prompt: "Big venue day tomorrow. How does the morning start?"
    options:
      - {text: "No alarm — drift up naturally, big days go better unscripted", flag: true}
      - {text: "6:15 wake-up call, confirmed tonight", flag: false}
      - {text: "Breakfast whenever — the kitchen's open till eleven", flag: true}
      - {text: "Breakfast table held 7:20–7:50, same table as always", flag: false}
  - prompt: "The gym question. What do you do?"
    options:
      - {text: "See how you feel when you wake — no slot, no obligation", flag: true}
      - {text: "Book the 6:30 lane — forty minutes, lane four, every trip", flag: false}
      - {text: "Skip deciding now; there's always a treadmill free-ish", flag: true}
      - {text: "Put the stretch-and-run block on the calendar tonight", flag: false}
  - prompt: "Getting to the venue. Your move?"
    options:
      - {text: "Grab a car when you're ready — they queue outside all morning", flag: true}
      - {text: "Book the 8:10 car — driver texts at 8:05 sharp", flag: false}
      - {text: "Pack the bag on the way out — it's four things", flag: true}
      - {text: "Pack tonight and run the checklist — badge, notes, charger", flag: false}
