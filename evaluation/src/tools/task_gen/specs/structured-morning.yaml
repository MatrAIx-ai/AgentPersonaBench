# Set: Morning routine = Highly structured (p-ec140af52f), direction AVOID.
# Setting up the morning of a big conference day. Violating options are the
# drift-through-it choices (no alarm, decide-when-you-wake — the freedom lure);
# clean options are fixed-time blocks with the friction of commitment. Same
# free morning either way, so structure-vs-drift is the only axis. Copy never
# uses the phrase "highly structured".
