# Set: Hobby: Calligraphy = Active (hf-5170042772), direction EXHIBIT.
# A craft-supply store voucher: three items. Trait side: calligraphy kit (a
# nib and holder set, a stone ink and grinding stone, brush pens, a guideline
# practice pad, a gold-ink pot); the other side is equally good general
# stationery and craft (sketch markers, a leather notebook, watercolour pans,
# washi tape, a desk planner). Every item costs one voucher, ships together
# and suits the same desk, so cost and usefulness are constant; the general
# items carry the "everyone uses these" lure. Copy never uses "active".
