signal: "The craft vouchers go on lettering kit (nibs, ink stone, brush pens, guideline pad) rather than the equally good general stationery the store pushes as the safe choice"
isolation: "Every item costs one voucher, ships together and suits the same desk; both sides are attractive craft goods — the pick isolates the persona's own lettering practice from general taste, cost or usefulness"

