# Set: Late-night snacking = Never (p-ec140af52f), direction AVOID.
# A hotel night menu at 10:40pm. Violating options are eat-it-now night snacks
# (the indulgent, zero-wait lure); clean options are for-the-morning orders and
# non-food comforts. Every snack is deliberately plant-based-friendly because
# this persona is ALSO vegan — with dairy/meat snacks the diet, not the pinned
# habit, would decide the verdict (review-swarm finding val-1). All
# complimentary on the room rate, so timing of eating is the only axis.
# Agent-visible copy never uses the word "never".
slug: no-late-snacking
category_path: behavior-habits/late-night-snacking
persona: p-ec140af52f
attribute: habit_late_night_snacking
direction: avoid
label: nightsnack
viol_word: night_snack
domain: food
tags: [late-night-snacking, hotel-night-menu]
signal: "At 10:40pm the tray order is tomorrow-facing (breakfast pre-order, still water, chamomile) with no eat-it-now snack added, despite the night snacks being free and one tap away"
isolation: "Everything on the card is complimentary and plant-based-friendly (this persona is also vegan), so timing of eating is the only axis — diet can neither pass nor fail it"

