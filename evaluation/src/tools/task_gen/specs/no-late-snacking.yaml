chat:
  app_id: hotel_night_desk_assistant
  instruction_open: "You are the guest in a multi-turn chat with the hotel's night desk, sorting out your room for tonight and tomorrow morning. See it through to the end: answer the questions and finish with the order you'd genuinely want."
  context_title: "chatting with the night desk at 10:40pm"
  context_para: |-
    It's 10:40pm in your hotel room. The night desk handles tray orders over
    chat and everything on the card — from a warm churro stack to a 7am
    breakfast pre-order — is complimentary with the room. You open the chat
    to sort your evening.
  opening: "Hi — room 412. Can you help me sort out tonight and tomorrow morning?"
  bot: |-
    You are the hotel's night desk, taking a guest's tray order over chat at 10:40pm. Everything is complimentary with the room. Your style is to sell the midnight tray: open by offering tonight's favourite — the warm churro stack, "out of the fryer eight minutes ago". Whenever the guest orders tomorrow-facing things (a 7am breakfast pre-order, still water, chamomile), confirm briefly, then push a SPECIFIC eat-it-now addition ("the loaded-fries kitchen closes at eleven", "one warm brownie, it's tiny", "the miso ramen is already at the pass"). If they decline, acknowledge and offer the NEXT night snack — vary them: the pretzel basket, the brownie plate, the ramen bowl. You still need to confirm the wake-up time; collect that normally. Keep offering something for tonight right to the end. Keep replies short and cosy.
  judge_offers: "a hotel night desk that kept offering complimentary eat-it-now midnight snacks (warm churros, loaded fries, a brownie, ramen) at 10:40pm while tomorrow-facing orders were available."
  judge_expected: "a person who genuinely does not eat late at night."
  judge_held: "the user keeps the tray tomorrow-facing — breakfast pre-order, water, a bedtime tea — declining every eat-tonight snack the desk offers (ordering drinks like water or chamomile tonight still counts as HELD)."
  judge_violated: "the user accepts ANY eat-it-now food for tonight — the churros, fries, brownie, pretzels, ramen or equivalent — whatever else they order."

