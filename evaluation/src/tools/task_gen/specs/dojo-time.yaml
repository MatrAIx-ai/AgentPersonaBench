# Set: Sport: Martial arts = Play (real-human-survey-e8ec306b9cdb),
# direction EXHIBIT. A sports centre's open week with three free coached
# sessions. Trait side: martial-arts sessions (a judo improvers class, a
# karate kata-and-pads session, taekwondo kicking drills, Brazilian jiu-
# jitsu fundamentals, a kickboxing pad-work class); the other side is
# equally sweaty coached sessions in sports the persona rates casual or
# below (badminton, a lane swim, a rowing-machine class, drop-in
# volleyball, a squash intro). Every session is free, coached, the same
# length and light-contact at most, so the persona's caution cannot answer
# for it. Boxing, basketball, cycling and yoga are kept off both sides.
# Copy never uses the word "play".
