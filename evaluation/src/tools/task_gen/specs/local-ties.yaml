signal: "The welcome credits go to memberships rooted in the local, mutual life of the town (association, garden plot, choir, tool library, history circle) rather than to the equally sociable commercial clubs on the same list"
isolation: "Every option is free with the credits, ground-floor and seated-friendly, and both sides are social and involve other people; none of the trait options is volunteering — the pick isolates the pull of belonging to the place from sociability, cost and service"

