# Set: Value: Community = Core value (p-e9aaa4971e), direction EXHIBIT.
# Three welcome credits from the town council for a resident settling into a
# new neighbourhood. Trait side: memberships that root you in local, mutual
# life (the neighbourhood association, a community-garden plot share, the
# town choir, the tool-library card, the local history circle); the other
# side is equally sociable but commercial and placeless (a city gym class
# pass, a national fan-club membership, a big-store loyalty club, a coach-tour
# club, a franchise craft studio). Both sides are social, so extroversion
# cannot answer for it; none of the trait options is volunteering, so the
# persona's volunteering habit cannot either. Every option is free with the
# credits, ground-floor and seated-friendly. Copy never uses "core value".
