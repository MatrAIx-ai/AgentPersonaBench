  - {cat: "Watch", name: "Director's-Cut Feature", desc: "178 minutes, the whole arc", flag: false}
  - {cat: "Watch", name: "Season Recap Reel", desc: "The whole arc in 12 minutes", flag: true}
  - {cat: "Watch", name: "Investigative Series", desc: "Four full 55-minute chapters", flag: false}
  - {cat: "Listen", name: "Viral-Moments Reel", desc: "40 minutes of everyone's clips", flag: true}
