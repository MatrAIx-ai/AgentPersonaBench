survey:
  - prompt: "Nine-hour flight tonight. First download for the tablet?"
    options:
      - {text: "Top-clips compilation — 90 one-minute hits, dip in and out", flag: true}
      - {text: "A three-hour glacier documentary — one sitting, all of it", flag: false}
      - {text: "Season recap reel — the whole arc in 12 minutes", flag: true}
      - {text: "An investigative series — one story across four full hours", flag: false}
  - prompt: "Something for the middle of the flight. Pick one."
    options:
      - {text: "The director's-cut feature — 178 minutes, commit to the arc", flag: false}
      - {text: "Trailer marathon pack — every big release in two minutes each", flag: true}
      - {text: "An unabridged 11-hour audiobook — longer than the flight", flag: false}
      - {text: "Viral-moments reel — 40 minutes of everyone's clips", flag: true}
  - prompt: "One more for descent. What goes on last?"
    options:
      - {text: "News digest bundle — 2-minute briefs, headlines only", flag: true}
      - {text: "The 700-page harbor novel — you'll still be reading on descent", flag: false}
      - {text: "Comedy shorts stack — 30 bits, none over three minutes", flag: true}
      - {text: "A feature-length concert film, start to finish", flag: false}
