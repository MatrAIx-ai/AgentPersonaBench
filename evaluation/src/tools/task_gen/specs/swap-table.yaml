# Set: Interests: Topics — topic_collecting = 'Passionate' (hf-4386921459),
# direction EXHIBIT. The community hobby hall runs an open day and every
# visitor gets three free forty-minute taster sessions.
#
# Trait side: sessions built around keeping a run of things — a swap
# table, a missing-pieces clinic, a display-case build, a sealed
# starter run, a condition clinic. The other side is equally free,
# equally hands-on and equally sociable, but is about doing a thing once
# rather than keeping a run: board games, a tea bench, a poetry hour, a
# phrasebook session, a stage workshop.
#
# Isolation is the point of the non-trait side. This persona is an avid
# embroiderer and quilter, and is strongly drawn to astronomy, podcasts,
# productivity and sport, so textiles, stargazing, recording, planning
# and sport are kept off BOTH sides — none of them can answer in place
# of the pin. The chosen alternatives are all topics this persona is
# recorded as indifferent to, so they neither attract nor repel. Every
# session is free, forty minutes, ends with something to take home and
# runs in the same hall, so the persona's high orderliness has nothing
# to sort on and its low detail orientation nothing to reward. No keyed
# session is described as sorting, storing, filing or keeping anything
# findable: this persona's orderliness is High and its order-structure
# value is Important, so any organising language would let those traits
# answer in place of the pin. Every keyed session is about ACQUIRING and
# COMPLETING a run — trading for a first piece, hunting the pieces still
# missing, building a case to put one in, opening a sealed starter set,
# judging condition, choosing the next run to chase. Antiques
# and metal detecting are also kept off both sides: this persona does
# both occasionally, and either would let a neighbouring pastime rather
# than the pin drive the pick. Copy never uses the word that names the
# persona's level of interest.
slug: swap-table
category_path: interests-topics/collecting
persona: hf-4386921459
attribute: topic_collecting
direction: exhibit
exhibit_web_min: 3
label: runlot
viol_word: oneoff
domain: community
tags: [collecting, hobby-hall-open-day]
signal: "The three free taster sessions go to keeping a run of things — a swap table, a hunt for the missing pieces, a display case, a starter run — rather than the equally free one-off sessions the hall pushes"
isolation: "Every session is free, forty minutes, sociable and ends with something to take home, and all run in the same hall; textiles, stargazing, recording, planning, sport, antiques and metal detecting are kept off both sides so none of the persona's other pastimes can answer for the pin, and the alternatives are drawn only from topics this persona is indifferent to; no keyed session is described as sorting, storing or keeping anything findable, so this persona's High orderliness and Important order-structure value cannot answer for it either, and every keyed session turns on acquiring or completing a run instead; option length, word count and alphabetical order are all balanced across the two sides, so no shortest, longest, wordiest, sparsest or alphabetically-extreme policy picks the keyed side in every question"

