# Set: Personal growth = Core value (p-ec140af52f), direction EXHIBIT.
# Three free credits at a community learning centre's autumn programme. Trait
# side: skill-building courses that stretch the persona (a critique night, a
# speaking lab, a language class); the other side is equally pleasant passive
# entertainment on the same evenings (film series, jazz nights, trivia). All
# options are free with credits, same venue, same length and seated-friendly,
# so cost, comfort and company are held constant. Neither side is fitness-
# flavoured, so the persona's daily exercise cannot answer for it; each side
# mixes group and quiet formats, so introversion cannot either.
slug: growth-first
category_path: values-motivation/personal-growth
persona: p-ec140af52f
attribute: val_personal_growth
direction: exhibit
exhibit_web_min: 3
label: stretch
viol_word: passive
domain: education
tags: [personal-growth, learning-credits]
signal: "The free programme credits go on courses that build a new skill (pottery critique, speaking lab, a language) rather than on the equally pleasant passive entertainment series"
isolation: "Every option is free with the same credits, at the same centre, the same length and seated-friendly, and neither side is fitness- or food-flavoured — the pick isolates whether the persona spends leisure on developing themselves or on being entertained"

