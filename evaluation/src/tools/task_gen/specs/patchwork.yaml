# Set: Hobby: Quilting = Avid (hf-4386921459), direction EXHIBIT.
# A craft-shop voucher that covers any three items. Trait side: quilting
# kit (a rotary cutter and mat, a fat-quarter bundle, a quilt-batting roll,
# a quilting ruler set, a block-of-the-month kit); the other side is equally
# useful craft-shop items from other crafts (a watercolour set, a linocut
# kit, a resin-coaster kit, a soap-making kit, a polymer-clay bead kit).
# Every item is covered in full by the voucher and beginner-friendly.
# Embroidery, knitting and crochet items are deliberately absent (the
# persona rates embroidery just as highly and is curious about the other
# two), so the quilting side is the only textile pull. Copy never uses the
# word "avid".
