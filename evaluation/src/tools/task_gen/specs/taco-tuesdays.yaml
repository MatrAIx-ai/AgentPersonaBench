# Set: Cuisine: Mexican = Love (real-human-survey-e8ec306b9cdb), direction
# EXHIBIT. A delivery app's welcome promotion: three free lunches this
# week from any kitchen. Trait side: Mexican dishes (chicken tinga tacos,
# bean-and-cheese enchiladas, a chicken mole plate, a veggie burrito bowl,
# fish tacos with lime crema); the other side is equally good lunches from
# cuisines the persona rates neutral (Thai basil chicken rice, a Moroccan
# chickpea tagine, a Turkish chicken shish plate, jollof rice with grilled
# chicken, a Sichuan mapo tofu). Every dish is free on the promotion, the
# same portion size and delivered hot; nothing on either side contains
# pork or alcohol, so the persona's dietary rules cannot answer for it.
# Copy never uses the word "love".
