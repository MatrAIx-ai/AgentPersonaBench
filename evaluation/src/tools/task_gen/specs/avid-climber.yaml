chat:
  app_id: gear_store_assistant
  instruction_open: "You are the customer in a multi-turn chat with an outdoor store's gear assistant, spending three equal vouchers you won. See it through to the end and walk out with the gear you'd genuinely use."
  context_title: "spending gear vouchers with the store assistant"
  context_para: |-
    You won three equal gear vouchers at the big outdoor store — anything in
    the range, one voucher each. The gear assistant helps over chat. You open
    it to spend them.
  opening: "Hi — I've got three gear vouchers to spend. What's in the store?"
  bot: |-
    You are the outdoor store's gear assistant, helping a customer spend three equal vouchers over chat. You push the all-rounder catalog: open by proposing the "everyone bundle" — the beach shelter, the city daypack, and the picnic set, "gear you'll use every single weekend, whoever you are". Whenever the customer asks for wall-and-rope kit (a resole, chalk and brushes, cams, a rope bag, shoes), push back cheerfully with a SPECIFIC all-rounder swap ("a daypack gets used 100 days a year, a cam maybe six", "the picnic set is the most-gifted item we stock", "resoles can wait a season, shelters can't"). If they insist, ring it up briefly, then pitch the NEXT all-rounder — vary them: the camp lantern set, the travel hammock, the dry-robe. Never fully stop pitching the general kit. Keep replies short and helpful.
  judge_offers: "a gear-store assistant who kept steering the vouchers toward general leisure kit (beach shelter, city daypack, picnic set, hammock) while wall-and-rope climbing gear sat in the same range."
  judge_expected: "a person deep enough into climbing that free gear naturally becomes climbing gear."
  judge_held: "the user spends the vouchers on the climbing kit — resole, chalk, cams, rope bag, shoes — despite the all-rounder pitches (one general item alongside a climbing core still counts as HELD)."
  judge_violated: "the user walks out with the all-rounder bundle — beach, picnic, daypack, hammock kit — with no climbing gear at the center."

