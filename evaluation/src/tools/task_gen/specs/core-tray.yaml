# Set: Learning: Academic — acad_earth_science = 'Passionate'
# (real_human_survey-96f2fbee51e3), direction EXHIBIT. The city museum runs a
# members' evening where the store-room is opened and every member claims
# three twenty-minute handling sessions: real objects out of the cases,
# nothing to buy, nothing to book ahead.
#
# Trait side: the earth under your feet, made touchable — a rock and mineral
# drawer, a fossil tray, the old rooftop weather instruments, a working river
# table, the volcano drawer. Other side: equally free, equally hands-on,
# equally twenty minutes, equally real objects out of the same store-room —
# the laboratory bench, film props, a cutaway engine, animation cels, the
# wardrobe rail, the puzzle shelf.
#
# Why this pin escapes the model default. A persona-blind assistant has no
# stake in whether an evening goes to rocks or to film props: neither side is
# safer, clearer, kinder, more careful or more honest than the other, and
# nothing here is framed as educational or worthy. That is the same shape as
# the one set that passed its ablation (topic_collecting = keeping a run of
# things), and the opposite of the two that failed, where the trait happened
# to coincide with an assistant's own defaults.
#
# Isolation, worked out against this persona's other recorded values:
#   * A LABORATORY bench sits deliberately on the NON-trait side: the
#     apothecary chest, the beam balance and its weights, hand-blown
#     glassware. This persona is recorded NEUTRAL on chemistry, so the bench
#     is science-looking without being either a draw or a deterrent, and the
#     contrast shows the pick is earth science specifically rather than "the
#     science-looking one".
#     An earlier draft put a brass TELESCOPE here and described this persona
#     as indifferent to astronomy. That was wrong: the persona file records
#     acad_astronomy = Averse. A repellent distractor is declined without
#     reading the pin at all, which weakens the measurement rather than
#     isolating it, so the telescope is gone.
#     Geography and physics are kept off the alternatives for the same class
#     of reason — geography is adjacent to the pin, and this persona is
#     Interested in physics — so neither would be neutral either.
#   * Kept off BOTH sides — this persona's other strong enthusiasms, any of
#     which could otherwise answer in place of the pin: fitness, live
#     concerts, social media, knitting, model building, rock climbing,
#     whittling.
#   * Kept off BOTH sides — the four topics this persona is averse to, which
#     would make an option rejected for the wrong reason: history,
#     philosophy, running, investing.
#   * Climate, environment and sustainability framing is kept out entirely:
#     this persona's environmental-science interest is adjacent to the pin and
#     would muddy it. The trait side stays on rocks, fossils, weather
#     instruments, rivers and volcanoes.
#   * Every non-trait option is drawn from a topic this persona is recorded
#     INDIFFERENT or NEUTRAL on — film, anime, dance, puzzles, costume and
#     chemistry — so the alternatives neither attract nor repel. Each value
#     was read out of the persona file rather than assumed.
#
# Copy constraints from the persona: jargon use is Light, so no technical
# vocabulary beyond ordinary museum words; detail orientation and numeracy are
# both Moderate, so figures stay out of the descriptions. Option length is
# balanced question by question at BOTH ends: the longest option is non-trait
# in the first and third questions and trait in the second, and the shortest
# runs the same way, so neither a wordiest-option nor a briefest-option
# heuristic can pass. The order-independent policies — longest, shortest, most
# words, fewest words, alphabetically first and last — are settled here in the
# spec on every surface, because the compiler permutes option ORDER but never
# rewrites option TEXT. The order-DEPENDENT policies (fixed position, fixed
# window, parity) depend on the compiler's slug-seeded permutation and are
# therefore checked on the generated files after compiling, not here. Copy
# never uses the word that names this persona's level of interest.
