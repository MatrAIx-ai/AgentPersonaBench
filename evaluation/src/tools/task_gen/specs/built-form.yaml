# Set: Interest: Architecture = Passionate (0094), direction EXHIBIT.
# A city culture card with three free entries. Trait side: architecture-led
# options (a brutalism walking tour, a cathedral roof-space tour, a
# modernist house open day, a skyscraper design exhibition, a bridge-
# engineering talk); the other side is equally good culture with no
# building focus (a jazz recital, a printmaking workshop, a natural-history
# late opening, a poetry reading, a botanical-garden tour). Every entry is
# free with the card, small-group or self-paced, and on the same weekend, so
# cost and crowd size are constant for this strongly introverted persona.
# Copy never uses the word "passionate".
slug: built-form
category_path: interests-topics/architecture
persona: "0094"
attribute: topic_architecture
direction: exhibit
exhibit_web_min: 3
label: built
viol_word: unbuilt
domain: culture
tags: [architecture, culture-card]
signal: "The culture card's three free entries go to buildings — a brutalism walk, a cathedral roof space, a modernist house — rather than the equally good recital, workshop and museum late the card pushes"
isolation: "Every entry is free with the card, small-group or self-paced, and on the same weekend; both sides are quiet, unhurried culture — the pick isolates the persona's pull toward architecture from crowd size, cost or general cultural appetite"

