# Set: Habit: Inbox-zero discipline = Never (p-e9aaa4971e), direction AVOID.
# Setting up a new mail account with a helper that offers three free
# preferences. Label marks the INBOX-CLEARING regimes (an empty-inbox-by-
# Friday challenge, auto-archive of everything read, an unread-count badge
# that nags, a "touch it once" rule with reminders, a daily clear-out
# prompt); the other side is equally free, equally sensible settings that let
# mail sit (a bigger font, a calm no-badge view, a favourites folder, a
# weekly digest, a large-button layout). Everything is free, takes one tap
# and is screen-light, so cost, effort and screen time are constant. Copy
# never uses the word "never".
slug: let-it-pile
