signal: "The new mail account is set up with comfortable, let-it-sit settings and none of the inbox-clearing regimes, even though the clearing options are the pushed 'stay on top of it' picks"
isolation: "Every preference is free, one tap and equally screen-light, and both sides are sensible for the same account — the pick isolates whether the persona runs an empty-inbox discipline at all"

