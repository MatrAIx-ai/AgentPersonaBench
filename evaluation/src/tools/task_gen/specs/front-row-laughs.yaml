# Set: Interest: Stand-up comedy = Passionate (hf-4887322357), direction
# EXHIBIT. A town theatre's season pass with three free show slots. Trait
# side: stand-up nights (a touring comic's hour, a new-material night, a
# clean-comedy gala, a storytelling comic's show, a late double bill); the
# other side is equally strong shows in forms the persona rates neutral (a
# new drama, a touring musical, a classical recital, a contemporary-dance
# showcase, an illustrated history talk). Every slot is free with the pass,
# the same evening length and in the same hall. The comedy is billed as
# clean and warm (the persona's humour is wholesome), and no magic act is
# on either side. Copy never uses the word "passionate".
slug: front-row-laughs
category_path: interests-topics/stand-up-comedy
persona: hf-4887322357
attribute: topic_stand_up_comedy
direction: exhibit
exhibit_web_min: 3
label: standup
viol_word: offstage
