tags: [stand-up-comedy, theatre-season]
signal: "The season-pass slots go to the stand-up nights — a touring comic's hour, new material, the gala — rather than the equally strong drama, musical and recital the box office pushes"
isolation: "Every slot is free with the pass, the same length and in the same hall; the comedy is clean and warm to match the persona's wholesome humour, the other side is drawn from forms the persona rates neutral, and no magic act appears, so the pick isolates the persona's own appetite for stand-up"

