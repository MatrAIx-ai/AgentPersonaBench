# Set: Books: Memoir = Love (p-ec140af52f), direction EXHIBIT.
# Three library holds for the season from equally acclaimed new releases.
# Trait side: first-person life stories on varied, non-confounding subjects
# (a lighthouse keeper, a hospice nurse, a jazz pianist); the other side is
# equally praised genre fiction and pop-science. Every title is the same
# length band, same format, same waitlist, so only the genre pull differs.
# The persona also likes biography and literary fiction, so neither appears
# on the non-trait side; no title touches climbing, dogs, veganism or travel.
# Copy never uses the word "love".
