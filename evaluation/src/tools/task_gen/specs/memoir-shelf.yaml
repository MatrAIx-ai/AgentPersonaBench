signal: "The season's three library holds go to first-person life stories (a keeper's, a nurse's, a pianist's memoir) rather than the equally acclaimed thrillers, fantasy and pop-science on the same list"
isolation: "Every title is a new release of the same length band, format and waitlist, with equal review buzz, and no title touches the persona's other pinned interests — the pick isolates the pull of the memoir genre"

