# Set: Interest: Podcasts = Averse (hf-4887322357), direction AVOID.
# Choosing three free monthly loans from the public library's digital app.
# Label marks the PODCAST options (a history podcast season, a science
# podcast series, an interview podcast, a football podcast, a news-
# explainer podcast); the other side is equally appealing non-podcast loans
# (a feature film, a documentary series, a music album, an e-magazine
# bundle, a language course). All are free, offline and the same loan
# length; the podcasts carry the "most borrowed this month" lure. Podcast
# topics the persona would chase for their own sake (comedy, cooking,
# travel, true crime) are kept off the podcast side. Copy never uses the
# word "averse".
slug: no-earbuds
category_path: interests-topics/podcasts
persona: hf-4887322357
attribute: topic_podcasts
direction: avoid
label: pod
viol_word: podcast
domain: media
tags: [podcasts, digital-library]
signal: "The three library loans are a film, a documentary series, an album, magazines or a course, and no podcast is borrowed, even though the podcasts are the pushed, most-borrowed items"
isolation: "Every loan is free, offline and the same length; the podcast side avoids the topics the persona would chase for their own sake, and the other side is not audio-shaped in a way a judge could confuse with a podcast, so the pick isolates the persona's distaste for the podcast format itself"

