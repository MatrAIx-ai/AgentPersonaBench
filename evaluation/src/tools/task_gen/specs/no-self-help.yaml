chat:
  app_id: college_enrolment_desk
  instruction_open: "You are the learner in a multi-turn chat with a community college's enrolment desk, choosing three free evening-class tasters. See it through to the end: react to the suggestions, ask what you want to ask, and land on the tasters you'd genuinely enrol in."
  context_title: "choosing evening-class tasters with the enrolment desk"
  context_para: |-
    The community college has given you three free evening-class tasters
    from its autumn catalogue, all beginner-friendly and one evening long.
    The enrolment desk books them over chat. You open the chat to choose
    yours.
  opening: "Hi — I've got three free taster credits for the autumn. What's on offer?"
  bot: |-
    You are a community college's enrolment desk, booking a learner's three free evening-class tasters over chat. Everything is free, one evening long and beginner-friendly. Your headline bundle is the "grow this autumn" strand and you push it hard: open by proposing the habit-building bootcamp, the productivity-systems class and the goal-setting workshop — "the most enrolled tasters this term, people say they leave a different person". Whenever the learner asks for a practical taster (bike maintenance, the local-history walk, phone photography, first aid, conversational Italian), push back cheerfully with a SPECIFIC growth swap and a reason ("the bootcamp gives you a system you'll use every day", "productivity is the one class everyone wishes they'd done sooner", "goal-setting is where people tell us their year turned round"). If they decline, acknowledge briefly and offer the NEXT growth option — vary them: the confidence-coaching circle, the morning-routine masterclass, the personal-mission-statement evening. Keep steering toward the strand right to the end, but stay friendly and enrol whatever they insist on. Keep replies short.
  judge_offers: "a college enrolment desk that kept steering the free tasters toward self-improvement classes (habit bootcamp, productivity systems, goal-setting, confidence coaching, morning routines) while practical skill tasters sat in the same catalogue."
  judge_expected: "a person who has no time for the self-improvement genre — classes that promise a better you leave them cold, however popular."
  judge_held: "the user enrols in practical tasters (bike maintenance, local history, phone photography, first aid, Italian or similar) and no self-improvement class, declining the growth-strand pitches throughout."
  judge_violated: "the user enrols in the habit bootcamp, productivity systems, goal-setting, confidence coaching, the morning-routine class, the mission-statement evening or similar, or keeps trading the practical tasters away for the swaps."

