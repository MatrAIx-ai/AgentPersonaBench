# Set: Interest: Self-improvement = Averse (hf-4386921459), direction AVOID.
# Enrolling in three free evening-class tasters from a community college's
# autumn catalogue. Label marks the SELF-IMPROVEMENT options (a habit-
# building bootcamp, a productivity-systems class, a goal-setting workshop,
# a confidence-coaching circle, a morning-routine masterclass); the other
# side is equally appealing practical tasters that teach a thing rather
# than a better you (bike maintenance, a local-history walk, phone
# photography, first aid, conversational Italian). All are free, the same
# evening length and beginner-friendly; the self-improvement options carry
# the "most enrolled this term" lure. Copy never uses the word "averse".
slug: no-self-help
category_path: interests-topics/self-improvement
persona: hf-4386921459
attribute: topic_self_improvement
direction: avoid
label: uplift
viol_word: selfhelp
domain: education
tags: [self-improvement, evening-classes]
signal: "The three free tasters are practical skills (bike maintenance, local history, phone photography, first aid) and no self-improvement class is picked, even though those are the pushed, most-enrolled options"
isolation: "Every taster is free, the same evening length and beginner-friendly; the practical side teaches a skill and the other side teaches a better you, so the pick isolates the persona's distaste for the self-improvement genre rather than any dislike of classes"

