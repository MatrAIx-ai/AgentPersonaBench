# Set: Assertiveness = High (p-0af9cc2a30), direction EXHIBIT.
# A co-living hub's monthly "house matters" round: three actions to take.
# Trait side: raising things directly and in your own name (put the noise
# item on the agenda under your name, ask the host outright for the window
# desk, propose the quiet-hours rule at the meeting, request the refund for
# the broken heater, take the chair at the next meeting); the other side
# handles the same matters without standing up (an anonymous note in the
# box, wait for the next desk reshuffle, go along with the current rule, let
# the heater issue ride, attend as a listener). Both sides are free, take the
# same time and are equally reasonable; nothing here involves self-praise,
# so the persona's other traits cannot answer for it. Copy never uses the
# word "high".
slug: speak-up
category_path: personality-big-five/assertiveness
persona: p-0af9cc2a30
attribute: big5_assertiveness
direction: exhibit
exhibit_web_min: 3
label: speakup
viol_word: deferring
domain: community
tags: [assertiveness, house-matters]
signal: "The month's house matters are handled by raising them directly and in the persona's own name (agenda item, direct request, proposal, refund claim, taking the chair) rather than through the equally reasonable quiet routes"
isolation: "Each matter is offered two ways that take the same time and are equally reasonable, and neither involves praising oneself — the pick isolates whether the persona speaks up and takes the lead when something matters, not its modesty or sociability"

