survey:
  - prompt: "Studio build, contractor call. What do you do?"
    options:
      - {text: "Sign the first quote — within range, done is a feature", flag: true}
      - {text: "Hold three quotes open a week — one more walkthrough each", flag: false}
      - {text: "Commit today and stop thinking about it", flag: true}
      - {text: "Ask each bidder one more round of questions first", flag: false}
  - prompt: "The layout question. Your move?"
    options:
      - {text: "Lock it today — a decision off your mind by dinner", flag: true}
      - {text: "Tape both layouts and live in each for three days", flag: false}
      - {text: "Take the coordinator's recommended plan as-is", flag: true}
      - {text: "Mock both in cardboard over the weekend", flag: false}
  - prompt: "The desk, last call of the week."
    options:
      - {text: "Buy the display model now — it's right there, it fits", flag: true}
      - {text: "Sleep on it and sit at both again on Saturday", flag: false}
      - {text: "Order the bestseller and close the tab", flag: true}
      - {text: "Borrow a friend's for a week before choosing", flag: false}
