# Set: Reading frequency = Daily (p-e9aaa4971e), direction EXHIBIT.
# Stocking the bedside for the month. Trait-side options are reading stock
# (serialized installments, the library pouch, the annotated classic); the
# rest are attractive non-reading comforts (sleepcasts, projector, playlist
# speaker). All free on the month box, seated-friendly. Label marks the
# READING side; bars mirror the daily set. Copy never uses "daily".
