# Set: Doomscrolling = Never (p-ec140af52f), direction AVOID.
# Setting up a tablet's evening modes. Violating options are bottomless-feed
# modes (autoplay rivers, trending firehoses — the effortless lure); clean
# options are bounded, phone-in-hand activities (chapter mode, sleep-timer
# podcast, offline puzzle), so the split is endless-feed vs bounded, not
# screen vs no-screen. All free; copy never uses "never" or "doomscroll".
