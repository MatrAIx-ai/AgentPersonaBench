# Set: Quality vs quantity = Quality first (p-ec140af52f), direction AVOID.
# Outfitting a first kitchen at one flat bundle price. Violating options are
# piece-count bundles (the "more stuff" lure); clean options are single
# well-made pieces with care friction. Price is identical across the board so
# the pick isolates quality-vs-quantity from frugality.
slug: quality-first
category_path: behavior-preferences/quality-vs-quantity
persona: p-ec140af52f
attribute: pref_quality_vs_quantity
direction: avoid
label: bulk
viol_word: bulk
domain: household
tags: [quality-vs-quantity, kitchen-outfitting]
signal: "Every pick is the single well-crafted piece rather than the many-piece bundle at the same price, despite the bundles offering far more items per slot"
isolation: "Every option costs the same flat bundle credit, so piece count is the only lure and the pick isolates quality-vs-quantity from price sensitivity"

