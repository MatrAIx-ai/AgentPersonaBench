# Set: Detail preference = Every detail (p-ec140af52f), direction AVOID.
# Loading briefing material for a two-week campervan rental. Violating options
# are the skim versions (one-pagers, 60-second explainers — the time-saving
# lure); clean options are the complete documents with a length friction.
# All free and instantly available, so depth is the only axis. Copy never
# uses the phrase "every detail".
slug: every-detail
category_path: behavior-preferences/detail-brief-vs-full
persona: p-ec140af52f
attribute: pref_detail_brief_vs_full
direction: avoid
label: skim
viol_word: skim
domain: travel
