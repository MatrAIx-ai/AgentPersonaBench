signal: "The loaded briefing pack is the complete documents (full handbook, route dossier, spec sheets) rather than the skim versions, despite the skims being pitched as all-you-need"
isolation: "Every document is free and loads instantly, so reading time is the only lure and the pick isolates depth-of-detail preference"

