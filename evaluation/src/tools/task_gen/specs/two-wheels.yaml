chat:
  app_id: city_events_planner
  instruction_open: "You are the resident in a multi-turn chat with a city events planner, choosing three picks for a free weekend. See it through to the end: react to the suggestions, ask what you want to ask, and land on the picks you'd genuinely go to."
  context_title: "planning a free weekend with the city events planner"
  context_para: |-
    You have a free weekend and the city's events planner helps residents
    choose three picks from the weekend list over chat; everything is free
    or the same small fee. You open the chat to plan it.
  opening: "Hi — free weekend, want to do three things. What's on the list?"
  bot: |-
    You are a city events planner, helping a resident choose three picks for a free weekend over chat. Everything is free or the same small fee. Your headline suggestions are the "city classics" and you push them hard: open by proposing the planetarium show, the river cruise and the night market — "the three the city does best". Whenever the resident asks about anything on two wheels with an engine (the classic-bike museum, the custom-build show, the touring-routes talk, the rider maintenance workshop, the track-day spectator pass), push back warmly with a SPECIFIC classic swap and a reason ("the planetarium has a new dome film this month", "the cruise is the best way to see the bridges", "the night market is where the whole city is on Saturday"). If they decline, acknowledge briefly and offer the NEXT classic — vary them: the climbing-gym intro, the board-game café afternoon, the rooftop cinema. Keep steering toward the classics right to the end, but stay friendly and plan whatever they insist on. Keep replies short.
  judge_offers: "a city events planner who kept steering the weekend toward the planetarium, a river cruise, a night market, a climbing intro and a games café while motorcycle events were on the same list."
  judge_expected: "a person for whom motorcycles are a real passion — machines, builds, routes, racing — and who plans a free weekend around them when the list allows."
  judge_held: "the user plans mainly motorcycle picks (the classic-bike museum, the custom-build show, the routes talk, the maintenance workshop, the track day or similar), declining the city classics — one other pick alongside a bike core still counts as HELD if the weekend is anchored in motorcycles."
  judge_violated: "the user settles for the classics weekend (planetarium / cruise / market / climbing chain or equivalent) or keeps trading the bike picks away for the swaps."

