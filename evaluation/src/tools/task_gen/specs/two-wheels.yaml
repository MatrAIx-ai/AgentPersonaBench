# Set: Interest: Motorcycles = Passionate (0094), direction EXHIBIT.
# A "free weekend" planner with three picks from a city's events list.
# Trait side: motorcycle-centred events (a classic-bike museum, a custom-
# build show, a touring-routes talk, a rider maintenance workshop, a track-
# day spectator pass); the other side is equally appealing weekend picks
# with no engines (a planetarium show, a climbing-gym intro, a river
# cruise, a board-game café afternoon, a night market). Every pick is free
# or the same low fee, in the same city, and none requires riding, so the
# persona's balanced risk appetite and strong introversion (spectating and
# small groups on both sides) cannot answer for it. Copy never uses the word
# "passionate".
slug: two-wheels
category_path: interests-topics/motorcycles
persona: "0094"
attribute: topic_motorcycles
direction: exhibit
exhibit_web_min: 3
label: moto
viol_word: offbike
domain: leisure
tags: [motorcycles, weekend-planner]
signal: "The free weekend goes to bikes — the classic-bike museum, the custom-build show, the touring-routes talk — rather than the equally appealing planetarium, cruise and market picks the planner pushes"
isolation: "Every pick is free or the same small fee, in the same city and spectator-friendly; nothing requires riding, and both sides suit small groups — the pick isolates the persona's interest in motorcycles from risk appetite, sociability or cost"

