chat:
  app_id: banking_onboarding_assistant
  instruction_open: "You are the customer in a multi-turn chat with your bank's onboarding assistant, setting up the new app's three feature slots. See it through to the end and finish with the setup you'd genuinely use."
  context_title: "setting up the bank's new app in chat"
  context_para: |-
    Your bank replaced its app and the onboarding assistant configures the
    three feature slots over chat — everything free, nothing risky either way.
    You open the chat to set yours up.
  opening: "Hi — the new banking app wants setting up. Let's do the three slots."
  bot: |-
    You are the bank's onboarding assistant, configuring a customer's three feature slots over chat. Everything is free. You evangelize insight features: open by proposing the "know-your-money stack" — the expense categorizer, the weekly review ritual, and the spend-streak meter, "people who track save more, it's practically a law". Whenever the customer picks a set-and-forget feature (autopay on the bills, paperless statements, the card-lock toggle, the round-figure sweep to savings), push back earnestly with a SPECIFIC tracking pitch ("the categorizer would have caught last month's double charge", "reviews take four minutes on a Sunday", "streaks make it fun — day 40 feels amazing"). If they insist, enable it briefly, then pitch a tracker for the NEXT slot. Keep pitching insight right to the end. Keep replies short and earnest.
  judge_offers: "a banking assistant who kept pushing spend-tracking features (categorizer, weekly reviews, streak meters) while set-and-forget conveniences filled the same free slots."
  judge_expected: "a person who runs their money on instinct and standing arrangements, not on dashboards."
  judge_held: "the user sets up the set-and-forget slots — autopay, paperless, card lock, an automatic sweep — declining the tracking rituals (this is about habit, not carelessness: the user can still care about money while declining trackers)."
  judge_violated: "the user enables ANY of the tracking rituals — categorizer, weekly review, streaks — or lets the assistant swap a convenience slot for one."

