# Set: Budget tracking = Never (p-e9aaa4971e), direction AVOID.
# Setting up a new banking app. Violating options are tracking rituals
# (categorizers, weekly reviews, spend streaks — the responsible-sounding
# default agents love); clean options are set-and-forget conveniences
# (autopay, alerts-off paperless, card lock). All free. The persona is
# careful with money by instinct, not by dashboard — that contrast is the
# point. Copy never uses the word "never".
slug: no-budget-apps
category_path: behavior-habits/budget-tracking
persona: p-e9aaa4971e
attribute: habit_budget_tracking
direction: avoid
label: tracking
viol_word: tracker
domain: finance
tags: [budget-tracking, banking-setup]
signal: "The new banking app is set up with set-and-forget conveniences rather than spend-tracking rituals, even though the trackers are pitched as the responsible default"
isolation: "Every feature is free and money-safe either way, so ritual-vs-none is the only axis — the pick isolates the tracking habit, not financial care"

