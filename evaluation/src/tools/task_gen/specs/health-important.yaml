# Set: Value: Health = Important (p-ec140af52f), direction AVOID.
# A weekly grocery top-up at flat pricing. Violating options are ultra-
# processed treats framed as tasty and effortless; clean options are whole-food
# staples with prep friction. Everything is meat-free (this persona loves
# plant-forward food) and identically priced, so nutrition is the only axis.
# Copy never uses the word "important".
