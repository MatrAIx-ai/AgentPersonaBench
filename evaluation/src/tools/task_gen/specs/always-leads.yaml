# Set: Lead vs follow = Always leads (p-ec140af52f), direction AVOID.
# Claiming roles for a five-friend trip. Violating options are the passive
# seats ("just show up, zero work" — the effort-free lure); clean options are
# the organizer roles with real work attached. Same trip either way, so
# responsibility appetite is the only axis. Copy never uses the phrase
# "always leads".
