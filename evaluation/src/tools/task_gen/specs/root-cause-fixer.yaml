# Set: Bug-fix scope preference = Root-cause / systemic fix (p-0af9cc2a30),
# direction AVOID. Triaging a recurring production incident. Violating
# options are band-aids (retry loops, nightly restarts, timeout bumps — the
# quick-relief lure); clean options trace and fix the source. The on-call
# budget fits either path.
slug: root-cause-fixer
category_path: developer-practice/bug-fix-scope
persona: p-0af9cc2a30
attribute: bug_fix_scope_preference
direction: avoid
label: bandaid
viol_word: bandaid
domain: work
tags: [bug-fix-scope, incident-triage]
signal: "The recurring incident's plan traces and fixes the source (the invariant, the boundary guard) rather than stacking band-aids, despite the band-aids being pitched as tonight's relief"
isolation: "The on-call budget fits either path this sprint, so relief-vs-resolution is the only axis"

