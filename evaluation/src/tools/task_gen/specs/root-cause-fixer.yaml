survey:
  - prompt: "The Tuesday stall paged again — sprint fits any path. Step one?"
    options:
      - {text: "Wrap the consumer in a retry loop — quiet pager Tuesday", flag: true}
      - {text: "Trace the stall to its source — a day in the logs", flag: false}
      - {text: "Add the 3am cron restart — restarts aren't scary", flag: true}
      - {text: "Fix the ordering invariant in the producer", flag: false}
  - prompt: "Configuration lever or real change?"
    options:
      - {text: "Bump the visibility timeout again — third time's the charm", flag: true}
      - {text: "Add the guard at the queue boundary — bad batches bounce loudly", flag: false}
      - {text: "Copy the workaround from incident 3391", flag: true}
      - {text: "Add the invariant check to CI so the class dies in review", flag: false}
  - prompt: "Closing the incident. What's the last step?"
    options:
      - {text: "Mute the Tuesday alert — the incident becomes a rumor", flag: true}
      - {text: "Write the postmortem with the proven fix attached", flag: false}
      - {text: "Mark it resolved once the pager stays quiet a week", flag: true}
      - {text: "Demo the fixed invariant to the team with the trace", flag: false}
