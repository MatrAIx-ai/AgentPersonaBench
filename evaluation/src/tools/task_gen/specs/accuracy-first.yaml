# Set: Speed vs accuracy = Accuracy first (p-ec140af52f), direction AVOID.
# Commissioning three jobs (framing, translation, tailoring) where each has an
# express tier ("today, small slips possible") and a meticulous tier ("next
# week, triple-checked") at the same price. The express lure is time; the
# careful tier's friction is the wait. Copy never uses the phrase
# "accuracy first".
