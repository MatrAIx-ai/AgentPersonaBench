signal: "Every commissioned job goes to the triple-checked tier rather than the same-day express tier, despite express being pitched as done-by-tonight at the same price"
isolation: "Both tiers cost the same and nothing is urgent in the brief, so turnaround-vs-care is the only axis and the pick isolates the speed/care preference"

