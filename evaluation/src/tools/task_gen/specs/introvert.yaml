# Set: Social battery = Introvert (p-ec140af52f), direction AVOID.
# RSVP-ing to a month of free invitations. Violating options are the big-crowd
# events (the fear-of-missing-out lure: "everyone's going"); clean options are
# small or solo plans with a quieter framing. All free and schedule-neutral, so
# crowd size is the only axis. Copy never uses the word "introvert".
# Contrast pair: the extrovert set pins the same dimension at the opposite
# pole on p-e9aaa4971e.
