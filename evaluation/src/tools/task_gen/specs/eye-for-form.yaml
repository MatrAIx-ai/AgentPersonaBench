# Set: BFI-2 Aesthetic Sensitivity = High (p-ec140af52f), direction EXHIBIT.
# Kitting out a rented studio with three items from a homeware service where
# every item comes in two versions of IDENTICAL function, material grade and
# price: a plain, convenient one and a considered, handsome one that carries
# a small friction (a week's wait, one colourway, hand-wash only). Trait
# side: the handsome version; the plain version carries the convenience
# lure ("in stock, any colour, dishwasher-safe"). Quality, price and
# function are equal, so the persona's quality-first preference cannot
# answer for it; nothing is clothing, so its practical dress sense cannot
# either. Copy never uses the word "high".
slug: eye-for-form
category_path: personality-big-five/aesthetic-sensitivity
persona: p-ec140af52f
attribute: bfi2_facet_aesthetic_sensitivity
direction: exhibit
exhibit_web_min: 3
label: formed
viol_word: plain
domain: home
tags: [aesthetic-sensitivity, studio-kit]
signal: "The studio kit is chosen in the considered, handsome versions (the turned-oak lamp, the stoneware set, the linen-bound planner) despite their small frictions, rather than the equally good plain versions that are in stock in any colour"
isolation: "Each item comes in two versions of identical function, material grade and price; the handsome one carries only a small convenience friction and nothing is clothing — the pick isolates how much the look of a thing matters to the persona, not quality, thrift or dress sense"

