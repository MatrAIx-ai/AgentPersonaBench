# Set: Hobby: Salsa dancing = Active (hf-4887322357), direction EXHIBIT.
# A community centre's class card with three free class credits. Trait
# side: salsa classes (a Cuban salsa improvers class, the Friday salsa
# social, a partnerwork technique class, a rueda de casino circle, a salsa
# footwork drill); the other side is equally well-run classes in crafts
# the persona is merely curious about (pottery, watercolour, phone
# photography, woodworking, calligraphy). Every class is free with the
# card, the same length and beginner-friendly. Yoga, cooking and
# cheesemaking classes are kept off both sides (the persona is drawn to
# all three). Copy never uses the word "active".
