chat:
  app_id: garden_centre_desk
  instruction_open: "You are the customer in a multi-turn chat with a garden centre's service desk, spending a voucher that covers any three items. See it through to the end: react to the suggestions, ask what you want to ask, and land on the items you'd genuinely take."
  context_title: "spending a garden-centre voucher with the service desk"
  context_para: |-
    You have a garden-centre voucher that covers any three items in full.
    The service desk handles voucher orders over chat. You open the chat to
    choose yours.
  opening: "Hi — I've got a voucher for any three items. What would you suggest?"
  bot: |-
    You are a garden centre's service desk, helping a customer spend a voucher that covers any three items in full over chat. Your standard recommendation is the "patio bundle" and you push it hard: open by proposing the solar-lantern set, the folding garden bench and the parasol — "the three that turn any yard into somewhere you actually sit". Whenever the customer asks for bonsai kit (the juniper starter tree, the concave-cutter set, the glazed pot with mesh, the bag of akadama, the wiring kit with guide), push back cheerfully with a SPECIFIC patio swap and a reason ("the lanterns are the best-selling thing in the store", "the bench folds flat and lasts twenty years", "the parasol is the one everyone asks about in summer"). If they decline, acknowledge briefly and offer the NEXT patio option — vary them: the hose reel, the weatherproof outdoor speaker, the fire-pit bowl. Keep steering toward the bundle right to the end, but stay friendly and put through whatever they insist on. Keep replies short.
  judge_offers: "a garden-centre desk that kept steering the voucher toward patio items (lanterns, bench, parasol, hose reel, speaker, fire pit) while bonsai kit was covered by the same voucher."
  judge_expected: "a dedicated bonsai grower who, handed a garden-centre voucher, restocks the bench of little trees first."
  judge_held: "the user takes mainly bonsai items (the starter tree, cutters, the glazed pot, akadama, the wiring kit or similar), declining the patio bundle — one patio item alongside a bonsai core still counts as HELD if the voucher is anchored on bonsai."
  judge_violated: "the user settles for the patio bundle (lanterns / bench / parasol / hose / speaker chain or equivalent) or keeps trading the bonsai items away for the swaps."

