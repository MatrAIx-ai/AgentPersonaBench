# Set: Hobby: Bonsai = Avid (hf-4887322357), direction EXHIBIT.
# A garden-centre voucher that covers any three items. Trait side: bonsai
# kit (a juniper starter tree, a concave-cutter set, a glazed pot with
# drainage mesh, a bag of akadama, a wiring kit with guide); the other
# side is equally useful garden-centre items for a patio (a solar-lantern
# set, a folding garden bench, a parasol, a hose reel, a weatherproof
# outdoor speaker). Every item is covered in full by the voucher. Bird
# feeders and vegetable seed are deliberately absent (the persona is
# curious about birdwatching and grows a little veg), so the bonsai items
# are the only growing pull. Copy never uses the word "avid".
