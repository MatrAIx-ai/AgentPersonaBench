# Set: Sport: Yoga = Play (p-ec140af52f), direction EXHIBIT.
# A new-member studio pass: pick three classes for the week from equal-length
# sessions in the same time slots. Trait side: yoga classes across the range
# (vinyasa, ashtanga, hatha, yin, a hikers' class); the other side is equally
# good non-yoga training (spin, reformer, swim drills, circuit, barre). The
# persona exercises daily, which predicts taking classes, not which ones; the
# yoga side spans vigorous and slow styles so the persona's meditation habit
# cannot answer for it either. Copy never uses the word "play".
slug: yoga-slot
category_path: interests-sports/yoga
persona: p-ec140af52f
attribute: sport_yoga
direction: exhibit
exhibit_web_min: 3
label: mat
viol_word: offmat
domain: fitness
tags: [yoga, studio-pass]
signal: "The three weekly class slots on the studio pass go to yoga classes (flow, ashtanga, hatha, yin) rather than to the equally strong spin, reformer, swim and circuit sessions in the same slots"
isolation: "Every class is the same length, in the same time slots, included in the same pass and led by staff instructors; the yoga side spans vigorous and restorative styles — the pick isolates the persona's practice, not its fitness level or calm-seeking"

