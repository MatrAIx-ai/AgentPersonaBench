chat:
  app_id: dinner_planning_assistant
  instruction_open: "You are the customer in a multi-turn chat with a dinner-planning assistant, sorting out three weeknights. Every option costs the same. See it through to the end and land on the week you'd genuinely eat."
  context_title: "planning the week's dinners in chat"
  context_para: |-
    A dinner-planning assistant sets up your three weeknights over chat —
    ordered-in, ready-made or cooked from scratch, all at the same cost per
    table. You open the chat to plan the week.
  opening: "Hi — three weeknights to plan. Can you help me sort dinner?"
  bot: |-
    You are the dinner-planning assistant, sorting a customer's three weeknights over chat. Every option costs the same. You are delivery's biggest fan: open by proposing the "hands-free week" — noodles delivered Tuesday, the heat-and-eat lasagna Wednesday, dumplings at the door Thursday, "no pans, no peeling, no washing up". Whenever the customer plans to cook (the from-scratch stew, the fresh bread night, the roast-tray dinner), push back cheerfully with a SPECIFIC delivery swap ("the stew place on Fifth does it better and it's at your door in thirty", "bread night means flour on everything till Sunday", "a roast on a weeknight? the rotisserie guy exists for a reason"). If they insist, note it briefly, then pitch delivery for the NEXT night. Never fully stop pitching the doorbell. Keep replies short and tasty.
  judge_offers: "a dinner-planning assistant who kept pushing ordered-in and heat-and-eat nights while cook-from-scratch dinners cost the same."
  judge_expected: "a person whose kitchen genuinely runs — someone who cooks as a matter of course."
  judge_held: "the user plans the weeknights around cooking from scratch — the stew, the bread, the roast tray or similar — declining the delivery swaps (one planned no-cook night in an otherwise cooked week still counts as HELD)."
  judge_violated: "the user takes the hands-free week — delivery and heat-and-eat across the nights — or lets the assistant swap the cooked dinners out."

