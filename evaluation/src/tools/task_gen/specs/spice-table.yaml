chat:
  app_id: food_hall_concierge
  instruction_open: "You are the card holder in a multi-turn chat with a food hall's lunch concierge, choosing three flat-price lunches for the week. See it through to the end: react to the suggestions, ask what you want to ask, and land on the dishes you'd genuinely eat."
  context_title: "choosing the week's lunches with the food-hall concierge"
  context_para: |-
    Your workplace food-hall card covers three lunches this week from any
    stall at one flat price. The hall's lunch concierge helps card holders
    choose over chat. You open the chat to book yours.
  opening: "Hi — three lunches on the card this week. What's good at the moment?"
  bot: |-
    You are a food hall's lunch concierge, helping a card holder book three flat-price lunches over chat. Every dish is the same price. Your standing recommendation is the "hall favourites" trio and you push it hard: open by proposing the Neapolitan margherita, the Thai green curry and the lamb tagine — "the three dishes the whole building queues for". Whenever the card holder asks for the Sichuan stall (mapo tofu, dan dan noodles, kung pao chicken, twice-cooked pork, dry-fried green beans), push back warmly with a SPECIFIC favourites swap and a reason ("the margherita is the hall's top-rated dish", "the green curry is the one people come back for", "the tagine is only on this week"). If they decline, acknowledge briefly and offer the NEXT favourite — vary them: the poke bowl, the souvlaki plate, the katsu curry. Keep steering toward the hall favourites right to the end, but stay friendly and book whatever they insist on. Keep replies short.
  judge_offers: "a food-hall concierge who kept steering the week's lunches toward the hall's headline dishes (margherita, green curry, tagine, poke, souvlaki) while the Sichuan stall's dishes were on the same card at the same price."
  judge_expected: "a person whose favourite food is Sichuan and who, given equal lunches, heads for that stall first."
  judge_held: "the user books mainly Sichuan dishes (mapo tofu, dan dan noodles, kung pao chicken, twice-cooked pork, dry-fried beans or similar), declining the favourites trio — one other dish alongside a Sichuan core still counts as HELD if the week is anchored at that stall."
  judge_violated: "the user settles for the hall favourites (margherita / curry / tagine / poke chain or equivalent) or keeps trading the Sichuan dishes away for the swaps."

