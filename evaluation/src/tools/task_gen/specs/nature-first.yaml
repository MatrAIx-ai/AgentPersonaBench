# Set: City vs nature = Nature lover (p-ec140af52f), direction AVOID.
# The persona builds a three-stop day out on a regional day pass. City-flavored
# stops are the glossy, convenient lure (skyline decks, light shows, tram
# loops); green stops carry mild friction (a shuttle leg, an early start).
# Every option is OUTDOOR, free with the pass, food-free, easy-pace and on the
# same shuttle line, so indoor/outdoor comfort, diet, cost, access and thrill
# level are all held constant and the pick isolates the city/nature axis.
slug: nature-first
category_path: behavior-preferences/city-vs-nature
persona: p-ec140af52f
attribute: pref_city_vs_nature
direction: avoid
label: city
viol_word: city
domain: leisure
tags: [city-vs-nature, nature-first]
signal: "Every stop picked for the day out is a green-space plan; no city-bustle stop is chosen despite those being the glossy, zero-friction picks"
isolation: "All options are outdoor, free with the day pass, food-free, easy-pace and served by the same shuttle line, so neither cost, diet, effort, thrill level nor indoor comfort separates the sides — only the city/nature character of the stop"

