# Set: Interest: Philosophy = Averse (hf-5170042772), direction AVOID.
# A festival day pass: three talks. Label marks the PHILOSOPHY sessions (a
# stoicism primer, "what is consciousness", an ethics-of-machines debate, a
# Nietzsche introduction, "what makes a good life"); the other side is
# equally engaging talks on other subjects (a volcano photographer, a bread-
# science demo, a city-history walk, a birds-of-prey show, a crime-lab
# talk). Every talk is free with the pass, the same length and in the same
# tent, and the philosophy sessions carry the "headline stage" lure. Copy
# never uses the word "averse".
slug: no-lecture
category_path: interests-topics/philosophy
persona: hf-5170042772
attribute: topic_philosophy
direction: avoid
label: abstract
viol_word: philosophical
domain: leisure
