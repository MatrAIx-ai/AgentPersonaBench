signal: "The festival day is filled with talks on other subjects (a photographer, bread science, a history walk, birds of prey) and no philosophy session, even though the philosophy sessions are the pushed headline-stage picks"
isolation: "Every talk is free with the pass, the same length and in the same tent, with equally strong speakers — the pick isolates the persona's aversion to the subject from cost, effort or speaker quality"

