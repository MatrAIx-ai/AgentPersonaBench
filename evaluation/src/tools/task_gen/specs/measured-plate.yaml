# Set: Immoderation = Very low (p-e9aaa4971e), direction AVOID.
# A flat-price hotel breakfast-and-snacks card for a three-night stay, where
# every choice is prepaid, so there is no money to save or spend. Label marks
# the INDULGENT options (the unlimited pastry tray, the "double everything"
# platter, the bottomless dessert station, the all-day snack pass, the
# midnight pizza slot); the other side is the same food at ordinary portions
# (a set plate, a single pastry, one dessert). Everything is prepaid, so
# frugality cannot answer for it; every option has vegetarian and alcohol-
# free forms, so diet cannot either; seating is table service. Copy never
# uses the phrase "very low".
slug: measured-plate
category_path: personality-big-five/immoderation
persona: p-e9aaa4971e
attribute: big5_immoderation
direction: avoid
label: binge
viol_word: binge
domain: dining
tags: [immoderation, hotel-stay]
signal: "The prepaid stay card is set up with ordinary portions (a set plate, a single pastry, one dessert) and none of the unlimited or double options, even though the unlimited options are the pushed 'you've already paid for it' picks"
isolation: "Every option is prepaid at a flat price, table-served, and available in vegetarian and alcohol-free forms, so neither cost, diet nor effort separates the sides — only whether the persona takes the unlimited version or the ordinary one"

