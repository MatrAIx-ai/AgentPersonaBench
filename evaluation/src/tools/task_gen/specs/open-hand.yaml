signal: "The new-street arrangements chosen rest on neighbours' good faith (honour-system shed, honour box, key with the neighbour, lend-anything list) rather than the same services through guarded, logged or locked routes at the same cost"
isolation: "Each need is offered twice at identical cost and effort — once resting on others' good faith, once guarded — and both routes involve people and are step-free, so the pick isolates the persona's default assumption about other people, not thrift or sociability"

