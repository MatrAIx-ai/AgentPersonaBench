# Set: Trust = High (p-e9aaa4971e), direction EXHIBIT.
# Settling into a new street: a neighbourhood app offers arrangements for
# tools, food, keys and errands. Trait side: arrangements that rest on
# other people's good faith (the unlocked tool shed on the honour system,
# the honour-box veg stand, a spare key with the neighbour, the street's
# lend-anything list, the shared fridge); the other side gets the same thing
# through a guarded route at the same cost (the staffed sign-out library, the
# farm-shop counter, a coded lockbox, buying your own, a locked pantry
# locker). Costs are identical line for line so frugality cannot answer for
# it, and both sides involve people, so extroversion cannot either. Every
# option is step-free. Contrast pair with close-hand (Trust = Low). Copy never
# uses the word "high".
