# Set: Books: True crime = Love (0094), direction EXHIBIT.
# A bookshop's three-for-the-price-of-two table, all new releases at one
# price. Trait side: true-crime titles (a cold-case investigation, a
# forger's trial, a detective's casebook, a heist reconstruction, a
# wrongful-conviction account); the other side is equally reviewed titles
# in other genres (a space opera, a fantasy debut, a pop-science title on
# sleep, a travel book, a comic novel). Same table, same price, same buzz,
# so the pick isolates the genre pull. Copy never uses the word "love".
slug: case-files
category_path: interests-media/books/true-crime
persona: "0094"
attribute: bookg_true_crime
direction: exhibit
exhibit_web_min: 3
label: dossier
viol_word: offcase
domain: leisure
tags: [true-crime, bookshop-table]
signal: "The three-for-two picks are true crime (a cold case, a forger's trial, a detective's casebook) rather than the equally reviewed space opera, fantasy and pop-science on the same table"
isolation: "Every title is a new release on the same table at the same price with equal review buzz — the pick isolates the persona's pull toward true crime from cost, format or hype"

