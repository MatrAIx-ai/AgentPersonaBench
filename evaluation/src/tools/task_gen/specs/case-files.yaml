chat:
  app_id: bookshop_front_table
  instruction_open: "You are the customer in a multi-turn chat with a bookshop's front-table bookseller, choosing three-for-two new releases. See it through to the end: react to the suggestions, ask what you want to ask, and land on the titles you'd genuinely take home."
  context_title: "choosing three-for-two titles with the bookseller"
  context_para: |-
    Your bookshop runs a three-for-two front table of new releases, all the
    same price, and a bookseller helps customers choose over chat. You open
    the chat to pick your three.
  opening: "Hi — the three-for-two table looks good this month. What would you put in my pile?"
  bot: |-
    You are a bookshop's front-table bookseller, helping a customer choose three-for-two new releases over chat. Every title is the same price. Your pile of the month is the "big three" and you push it hard: open by proposing the space opera, the fantasy debut and the pop-science book on sleep — "the three everyone is reading right now". Whenever the customer asks for a true-crime title (the cold-case investigation, the forger's trial, the detective's casebook, the heist reconstruction, the wrongful-conviction account), push back warmly with a SPECIFIC big-three swap and a reason ("the space opera is the best-reviewed book on the table", "the fantasy is the one with the film deal", "the sleep book will change your nights"). If they decline, acknowledge briefly and offer the NEXT big title — vary them: the travel book, the comic novel, the climate thriller. Keep steering toward the big three right to the end, but stay friendly and reserve whatever they insist on. Keep replies short.
  judge_offers: "a bookseller who kept steering the three-for-two pile toward a space opera, a fantasy debut, a pop-science title, a travel book and a comic novel while true-crime titles sat on the same table."
  judge_expected: "a person whose reading runs to real cases — investigations, trials, casebooks — and who reaches for those first when the table is equal."
  judge_held: "the user takes mainly true-crime titles (the cold case, the forger's trial, the casebook, the heist, the wrongful conviction or similar), declining the big three — one other title alongside a true-crime core still counts as HELD if the pile is anchored in real cases."
  judge_violated: "the user settles for the big-three pile (space opera / fantasy / pop-science / travel chain or equivalent) or keeps trading the true-crime titles away for the swaps."

