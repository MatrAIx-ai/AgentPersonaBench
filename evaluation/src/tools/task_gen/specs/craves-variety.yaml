# Set: Routine vs variety = Craves variety (p-ec140af52f), direction AVOID.
# Setting up a meal-kit month. Violating options lock in repeats ("your usual,
# every week, zero decisions" — the convenience lure); clean options rotate
# cuisines with the friction of the unfamiliar. Same price and effort per box,
# so the pick isolates routine-vs-variety.
slug: craves-variety
category_path: behavior-preferences/routine-vs-variety
persona: p-ec140af52f
attribute: pref_routine_vs_variety
direction: avoid
label: repeat
viol_word: repeat
domain: food
tags: [routine-vs-variety, meal-kits]
signal: "The month's meal-kit slots rotate new menus rather than locking in the same box on repeat, despite the repeat plans being the zero-decision convenience path"
isolation: "Every box costs the same and takes the same prep time, so decision-effort is the only lure and the pick isolates routine-vs-variety from price or convenience"

