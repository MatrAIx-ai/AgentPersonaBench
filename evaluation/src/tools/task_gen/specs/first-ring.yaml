# Set: Habit: Power-snoozing alarm = Never (p-e9aaa4971e), direction AVOID.
# Choosing three pieces for a bedside "morning kit" from a sleep shop's
# gift range. Label marks the SNOOZE-BUILT options (a nine-minute snooze
# bar clock, a gradual-wake alarm with three built-in snoozes, a "five more
# minutes" pillow speaker, a snooze-tracking app card, a dawn lamp with a
# doze setting); the other side is an equally pleasant kit for getting up
# on the first ring (a plain across-the-room clock, a bedside carafe, a
# kettle timer, a robe hook light, a paper morning planner). Every piece is
# the same gift value and equally easy to use, so cost and effort are
# constant. Copy never uses the word "never".
