      - {text: "Calendar-only view — the day is the plan, nothing else", flag: false}
      - {text: "Checklist template pack — same way every time", flag: true}
      - {text: "Cork pinboard — pin what matters, move it around", flag: false}
  - prompt: "Second slot. Pick one."
    options:
      - {text: "Task nag bar — nudges because memories don't", flag: true}
      - {text: "Open notebook page — one blank page that starts each day", flag: false}
      - {text: "The ticked-off history pane — boxes carried forward", flag: true}
      - {text: "One-big-thing card — a single card, no list behind it", flag: false}
