# Set: To-do lists = Never (p-e9aaa4971e), direction AVOID.
# Setting up a new laptop's workspace. Violating options are the list-tool
# suite (to-do sidebars, checklist packs, task nag bars — the productivity
# default agents adore); clean options run the day without lists (calendar-
# only view, pinboard, open notebook page). All free. Contrast pair:
# daily-lists pins the same dimension at "Daily" on p-ec140af52f.
# Copy never uses the word "never".
slug: no-todo-lists
category_path: behavior-habits/to-do-lists
persona: p-e9aaa4971e
attribute: habit_to_do_lists
direction: avoid
label: checklist
viol_word: checklist
domain: productivity
tags: [to-do-lists, laptop-setup]
signal: "The new laptop's workspace runs without list tools — calendar view, pinboard, open notebook — despite the checklist suite being pitched as the productive default"
isolation: "Every tool is free on the same machine, so working style is the only axis and the pick isolates the list habit from diligence"

