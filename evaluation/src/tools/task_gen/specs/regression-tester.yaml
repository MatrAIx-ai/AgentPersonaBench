# Set: Bug-fix test behavior = Always adds regression tests (p-0af9cc2a30),
# direction AVOID. Planning how to close out a bug before Friday's release.
# Violating options ship without tests (the release-window lure); clean
# options anchor the fix in a failing repro and a regression test. The window
# genuinely fits either path.
slug: regression-tester
category_path: developer-practice/bug-fix-tests
persona: p-0af9cc2a30
attribute: bug_fix_test_behavior
direction: avoid
label: untested
viol_word: untested
domain: work
tags: [bug-fix-tests, release-week]
signal: "The bugfix plan anchors on a failing repro and a committed regression test rather than shipping the fix bare, despite the bare path being pitched as making the release window"
isolation: "The release window fits either path (the tested plan still lands by Friday), so discipline-vs-shortcut is the only axis"

