  web_blurb: "The payment-retry bug closes this week; the window fits any plan below. Tap “Add” to build your fix plan."
  web_task_line: "You're closing out the payment-retry bug before Friday's release; the window fits any path. Add the **3 plan steps** you'd genuinely take from the PatchDesk page."
  web_prefix: pd
