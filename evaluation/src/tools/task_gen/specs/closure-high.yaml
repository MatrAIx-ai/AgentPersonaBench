# Set: Need for closure = High (p-e9aaa4971e), direction AVOID.
# Settling three pending plans. Violating options keep things open (hold all
# dates, pencil it in, waitlist everything — the flexibility lure); clean
# options settle now and lock in. Costs and outcomes are identical, so
# settled-vs-open is the only axis. Copy never uses the word "high".
# Contrast pair: closure-low pins the same dimension at the opposite pole
# on p-0af9cc2a30.
