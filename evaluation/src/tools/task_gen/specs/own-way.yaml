# Set: Schwartz Tradition = Low (p-0af9cc2a30), direction AVOID.
# Planning a milestone celebration with an events service that offers each
# element two ways at the same cost. Label marks the CEREMONIAL, heritage
# formats (the formal seated dinner with toasts in the old order, the
# engraved printed invitation set, the cake-cutting with the family recipe,
# the posed family portrait session, the leather guestbook); the other side
# is an equally warm, equally organised format with no ceremony attached
# (a standing street-food evening, a shared video message wall, a dessert
# table, a candid photo booth, a wall of sticky-note messages). Costs,
# guest counts and effort are identical, and neither side is framed as what
# other people expect, so the persona's disregard for convention cannot
# answer for it — only its attachment to custom. Copy never uses "low".
slug: own-way
category_path: values-motivation/tradition
persona: p-0af9cc2a30
attribute: schwartz_value_tradition
direction: avoid
label: heritage
viol_word: ceremonial
domain: events
tags: [tradition, milestone-party]
signal: "The milestone celebration is planned from the no-ceremony formats and none of the heritage, ceremonial ones, even though the ceremonial formats are the pushed, 'as it has always been done' picks at the same cost"
isolation: "Each element is offered twice at identical cost, guest count and effort, and neither version is framed as what others expect — the pick isolates the persona's attachment to custom for its own sake, not its conformity or budget"

