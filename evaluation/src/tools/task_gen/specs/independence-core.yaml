# Set: Value: Independence = Core value (p-0af9cc2a30), direction AVOID.
# Setting up a personal-admin service's three modes. Violating options hand
# control to concierges ("we handle everything" — the effortless lure); clean
# options are self-directed tools with the work left in your hands. Same
# subscription. Copy never uses the phrase "core value".
