category_path: values-motivation/independence
persona: p-0af9cc2a30
attribute: val_independence
direction: avoid
label: managed
viol_word: handled
domain: services
tags: [independence, admin-setup]
signal: "The admin service's modes are set to self-directed tools rather than we-handle-it concierge modes, despite the concierge modes promising zero effort"
isolation: "Every mode is on the same subscription and reaches the same outcomes, so who holds the wheel is the only axis"

