signal: "Recovery week is filled with massage, sauna, rolling, stretching and swimming, and no meditation session is picked, even though the sits are what the gym pushes as the coaches' choice"
isolation: "Every session is free, staff-led and the same length; both sides are restorative and yoga is kept off entirely, so the pick isolates the persona's distaste for meditation rather than any preference for effort over rest"

