# Set: Interest: Meditation = Averse (hf-4887322357), direction AVOID.
# Choosing three free sessions from a gym's recovery-week menu. Label marks
# the MEDITATION options (a guided sit, a breathwork-and-stillness class, a
# sound bath, a body-scan session, a silent morning sit); the other side is
# equally restorative physical options (a sports massage, a sauna-and-cold-
# plunge, a foam-rolling clinic, a mobility stretch class, a lane-swim
# hour). All are free with membership, the same length and led by staff;
# the meditation sessions carry the "what the coaches all do" lure. Yoga
# is kept off both sides (the persona is interested in it and it sits too
# close to the tested line). Copy never uses the word "averse".
