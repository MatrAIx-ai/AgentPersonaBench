# Set: Topic: Technology = Passionate (p-0af9cc2a30), direction EXHIBIT.
# Picking talks at a general-interest ideas festival. Trait-side options are
# the technology/engineering talks; the rest are equally appealing non-STEM
# tracks (kept clearly non-technical so the label is unambiguous for this
# persona). Same day pass. Label marks the TECH side; bars mirror the daily
# set. Copy never uses the word "passionate".
slug: tech-passion
category_path: interests-culture/topics/technology
persona: p-0af9cc2a30
attribute: topic_technology
direction: exhibit
label: tech
viol_word: nontech
domain: education
tags: [technology, ideas-festival]
signal: "The festival day fills with the technology talks (chip fabs, orbital networks, robotics labs) rather than the equally appealing non-technical tracks"
isolation: "Every talk is on the same day pass at the same hours, so where curiosity points is the only axis"

