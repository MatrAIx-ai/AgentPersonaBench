# Set: Cuisine: Indian = Love (hf-4386921459), direction EXHIBIT.
# A food-hall meal card that covers three lunches this week. Trait side:
# Indian dishes (chana masala, masala dosa, paneer tikka wrap, vegetable
# biryani, dal tadka with roti); the other side is equally good lunches
# from cuisines the persona rates neutral (a Thai green curry, a Korean
# bibimbap, a Spanish tortilla plate, an Ethiopian veggie platter, a
# Scandinavian open sandwich). Every dish is covered by the card, the same
# portion size and served hot; nothing on either side contains pork or
# alcohol, so the persona's religious dietary rule cannot answer for it.
# Copy never uses the word "love".
