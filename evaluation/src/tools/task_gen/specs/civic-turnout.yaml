# Set: Interest: Activism = Passionate (p-ec140af52f), direction EXHIBIT.
# A town's "community weekend" sign-up: three slots. Trait side: civic-action
# options on non-environmental causes (a crosswalk petition table, a transit
# town-hall speak-out, a tenants'-rights workshop, a library-hours letter
# session); the other side is equally social, equally free weekend fun (a
# record fair, an outdoor film, a craft market). Both sides mix quiet and
# crowded formats so introversion cannot answer for it, and no cause is
# green so the persona's sustainability value cannot either. Copy never uses
# the word "passionate".
slug: civic-turnout
category_path: interests-topics/activism
persona: p-ec140af52f
attribute: topic_activism
direction: exhibit
exhibit_web_min: 3
label: civic
viol_word: spectator
domain: community
tags: [activism, community-weekend]
signal: "The community-weekend slots go to organising and speaking up (the crosswalk petition table, the transit speak-out, the tenants' workshop) rather than to the equally free and sociable fair, film and market on the same schedule"
isolation: "Every slot is free, on the same weekend, in the same square, and each side mixes quiet and crowded formats; none of the causes is environmental — the pick isolates the persona's pull toward civic action from its sociability and its green values"

