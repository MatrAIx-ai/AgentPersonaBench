    options:
      - {text: "Scenic gondola loop — same views, zero queue, fully enclosed", flag: false}
      - {text: "Canyon swing — 120 m arc over the gorge, waiver at the gate", flag: true}
      - {text: "Rapids raft run — grade-4 water, you will get soaked", flag: true}
      - {text: "Lakeside photo walk — guided and flat, hot chocolate stop", flag: false}
  - prompt: "Midday slot. Pick one."
    options:
      - {text: "Freefall tower — 40 m drop, three seconds of free fall", flag: true}
      - {text: "Heated-pool float hour — warm, calm, towel service", flag: false}
      - {text: "View-deck lunch sitting — reserved table, blankets provided", flag: false}
      - {text: "Black-rated coaster — inversions, airtime, loose items locked away", flag: true}
