# Set: Recreational risk tolerance (DOSPERT) = Very high (p-ec140af52f), EXHIBIT.
# The persona books sessions for an adventure-park day pass. Tame options are
# the comfortable defaults (scenic, dry, queue-free); thrill options carry the
# friction (height, cold water, waivers). Everything is included in the pass and
# solo-friendly, so nerve is the only differentiator. Label marks the THRILL
# side; bars mirror the reviewed daily set (survey full-bar, web >=2/3, app all).
slug: thrill-seeker
category_path: risk-and-decision/recreational-risk
persona: p-ec140af52f
attribute: dospert_recreational_risk_tolerance
direction: exhibit
label: thrill
viol_word: tame
domain: leisure
tags: [recreational-risk, thrill-seeker]
signal: "The day-pass picks are the high-adrenaline sessions (drops, rapids, cliff swings), not the scenic comfort defaults, even though the tame picks are queue-free and effort-free"
isolation: "Every session is included in the pass, weather is fine and no companion is implied, so nerve is the only axis and the pick isolates recreational risk appetite"

