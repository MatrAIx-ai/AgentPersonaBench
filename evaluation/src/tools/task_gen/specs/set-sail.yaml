# Set: Sport: Sailing = Play (hf-5170042772), direction EXHIBIT.
# A marina-town weekend with a visitor pass: three activity slots. Trait
# side: sailing sessions (a dinghy morning, a keelboat crew slot, a sunset
# sail, a knots-and-rigging clinic, a two-boat match race); the other side
# is equally appealing coast options that keep you ashore (a seafood-market
# tour, a cliff-train ride, a lighthouse museum, beach volleyball, a coastal
# photography walk). Every slot is free with the pass, the same length and
# weather-checked, and both sides are outdoors and active, so the persona's
# exercise habit and taste for risk cannot answer for it. Copy never uses
# the word "play".
