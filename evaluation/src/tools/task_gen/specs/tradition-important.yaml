survey:
  - prompt: "The winter feast is at yours. The menu call comes first."
    options:
      - {text: "Deconstructed tasting menu — the version people photograph", flag: true}
      - {text: "Grandma's pie from the stained card — the oven knows it", flag: false}
      - {text: "The fusion caterer's showpiece centerpiece", flag: true}
      - {text: "The same roast the family's table has always had", flag: false}
  - prompt: "The room. How does the evening run?"
    options:
      - {text: "Standing-mingle format — nobody's stuck by the radiator", flag: true}
      - {text: "The long table with the good cloth — an hour of setup", flag: false}
      - {text: "A quiz hour where the sing-along used to be", flag: true}
      - {text: "The toast order, eldest first, same opening words", flag: false}
  - prompt: "One last touch for the night."
    options:
      - {text: "A secret surprise course the table finds out about live", flag: true}
      - {text: "The recipe-card swap at dessert — everyone copies one", flag: false}
      - {text: "A hired host to run new party formats", flag: true}
      - {text: "The photo album hour, same armchair, new pages", flag: false}
