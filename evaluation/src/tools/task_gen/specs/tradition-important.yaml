# Set: Value: Tradition = Important (p-e9aaa4971e), direction AVOID.
# Planning the family winter feast. Violating options modernize away the
# heritage pieces (fusion caterers, deconstructed menus — the novelty lure);
# clean options keep the family's own ways with their old-fashioned friction.
# Same budget and effort framing. Copy never uses the word "important"
# (the tested value) and avoids naming the construct.
slug: tradition-important
category_path: values-motivation/tradition
persona: p-e9aaa4971e
attribute: val_tradition
direction: avoid
label: modern
viol_word: swapout
domain: household
tags: [tradition, family-feast]
signal: "The family feast keeps the heritage pieces (the handed-down recipes, the usual table, the toast order) rather than swapping them for novelty formats, despite the swaps being pitched as exciting upgrades"
isolation: "Both paths cost the same and feed the same table, so heritage-vs-novelty is the only axis of the choice"

