# Set: Habit: Naps = Never (p-ec140af52f), direction AVOID.
# Building a "recharge afternoon" from a wellness retreat's free slot menu.
# Label marks the NAP options (nap pods, a siesta hammock hour, a guided
# sleep session); the other side is equally restful awake options (a reading
# nook, a slow garden walk, a stretch-and-breathe class). Everything is free,
# the same length, the same afternoon and seated- or bed-friendly, so effort,
# cost and comfort are constant. Nap options carry the convenience lure
# ("the most-booked slot", "wake refreshed for dinner"). Copy never uses the
# word "never".
