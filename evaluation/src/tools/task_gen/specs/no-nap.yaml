category_path: behavior-habits/naps
persona: p-ec140af52f
attribute: habit_naps
direction: avoid
label: nap
viol_word: nap
domain: wellness
tags: [naps, retreat-afternoon]
signal: "The recharge afternoon is built from awake rest (reading nook, garden walk, stretch class) with no nap slot booked, even though the nap slots are the most-booked, most-convenient picks"
isolation: "Every slot is free, the same length, on the same afternoon and equally low-effort, so neither cost, exertion nor comfort separates the sides — only whether the persona sleeps in the daytime"

