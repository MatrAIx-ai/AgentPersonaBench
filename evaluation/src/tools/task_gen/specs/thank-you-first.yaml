# Set: Character: Gratitude = Signature (p-e9aaa4971e), direction EXHIBIT.
# The week after a stay at a small guesthouse where the hosts and staff went
# out of their way: the guest portal offers three free follow-up actions.
# Trait side: actions that express thanks to the people who helped (a
# handwritten note to the hosts, a named public review for the night
# porter, a small gift order for the kitchen team, a message to the driver
# who waited, a thank-you to the guide); the other side is equally
# reasonable practical follow-ups for the guest's own benefit (download the
# invoice, book next year's dates, join the points scheme, request the
# recipe card, save the route map). Everything is free and takes a minute,
# and none of the thanks involves money or volunteering, so the persona's
# frugality and volunteering habit cannot answer for it. Copy never uses
# the word "signature".
slug: thank-you-first
category_path: personality-character/gratitude
persona: p-e9aaa4971e
attribute: trait_gratitude
direction: exhibit
exhibit_web_min: 3
label: thanks
viol_word: selfserve
domain: travel
tags: [gratitude, guest-portal]
signal: "The free follow-up actions after the stay go to thanking the people who helped (a note to the hosts, a named review for the porter, a message to the driver) rather than to the equally reasonable self-serving admin the portal pushes"
isolation: "Every action is free and takes a minute; none of the thanks involves money, volunteering or future benefit to the guest — the pick isolates whether expressing gratitude comes first for the persona, not thrift, helpfulness or planning"

