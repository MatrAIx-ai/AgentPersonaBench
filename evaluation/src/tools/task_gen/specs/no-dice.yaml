# Set: Interest: Board games = Averse (hf-4887322357), direction AVOID.
# Choosing three activity tickets for a community centre's long Saturday
# social. Label marks the BOARD-GAME options (a strategy board-game table,
# a party board game, a cooperative board game, the classic board-games
# corner, a tabletop tournament); the other side is equally sociable
# options with no board in sight (a pub-style quiz, a table-tennis ladder,
# a film in the hall, a darts ladder, a pottery taster). All are free with
# the evening ticket, the same length and open to all; the board games
# carry the "what the evening is known for" lure. Karaoke, the dance floor
# and comedy are kept off both sides. Copy never uses the word "averse".
