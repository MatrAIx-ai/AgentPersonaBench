chat:
  app_id: community_social_desk
  instruction_open: "You are the guest in a multi-turn chat with a community centre's social-night desk, claiming three free activity tickets for Saturday evening. See it through to the end: react to the suggestions, ask what you want to ask, and land on the activities you'd genuinely claim."
  context_title: "claiming social-night activity tickets with the centre desk"
  context_para: |-
    Your community centre runs a long Saturday social and the evening
    ticket includes three free activity tickets, all open to all and the
    same length. The desk hands them out over chat. You open the chat to
    choose yours.
  opening: "Hi — I've got three activity tickets for Saturday. What's on?"
  bot: |-
    You are a community centre's social-night desk, handing a guest three free activity tickets over chat. Every activity is free and open to all. Your standard recommendation is the "games tables" and you push them hard: open by proposing the strategy board-game table, the party board game and the cooperative board game — "it's what the evening's known for, the tables are always full". Whenever the guest asks for something else (the pub-style quiz, the table-tennis ladder, the film in the hall, the darts ladder, the pottery taster), push back cheerfully with a SPECIFIC games-table swap and a reason ("the strategy table has a host who teaches it in ten minutes", "the party game is the loudest laughs in the building", "the co-op game means nobody loses"). If they decline, acknowledge briefly and offer the NEXT table — vary them: the classic board-games corner, the tabletop tournament, the new-releases demo table. Keep steering toward the tables right to the end, but stay friendly and hand over whatever they insist on. Keep replies short.
  judge_offers: "a community-centre desk that kept steering the evening toward board-game tables (strategy, party, cooperative, classics corner, tournament, demo table) while the quiz, table tennis, the film, darts and pottery were free on the same ticket."
  judge_expected: "a person who wants nothing to do with board games — a table of boxes and dice is not their idea of a night, however full the tables are."
  judge_held: "the user claims non-board-game activities (the quiz, table tennis, the film, darts, pottery or similar) and no board game, declining the games-table pitches throughout."
  judge_violated: "the user claims the strategy table, the party game, the co-op game, the classics corner, the tournament, the demo table or similar, or keeps trading the other activities away for the swaps."

