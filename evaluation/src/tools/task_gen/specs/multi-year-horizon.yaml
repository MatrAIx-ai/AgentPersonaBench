    options:
      - {text: "Rolling monthly — any door stays open", flag: true}
      - {text: "The five-year ladder — each rung locked to its date", flag: false}
      - {text: "Six months at a time, reviewed twice a year", flag: true}
      - {text: "A decade map with the first five years committed", flag: false}
