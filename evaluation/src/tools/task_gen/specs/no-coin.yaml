# Set: Interest: Cryptocurrency = Averse (hf-5170042772), direction AVOID.
# Setting up the home screen of a new banking app: three free tiles. Label
# marks the CRYPTO tiles (a crypto wallet tab, a live coin-price ticker, a
# "first coin" starter, a token-rewards card, a crypto news feed); the other
# side is equally useful money tiles (a savings-goal jar, a bill calendar, a
# travel currency converter, a receipts vault, a spending-insights card).
# Every tile is free and one tap, and the crypto tiles carry the pushed,
# "most-added" lure — which is exactly what a risk-seeking, spend-happy
# persona would otherwise be tempted by, so the pick isolates the aversion
# from its appetite for risk. Copy never uses the word "averse".
slug: no-coin
category_path: interests-topics/cryptocurrency
persona: hf-5170042772
attribute: topic_cryptocurrency
direction: avoid
label: coin
viol_word: coin
domain: finance
tags: [cryptocurrency, banking-app]
signal: "The banking-app home screen is set up with everyday money tiles and none of the crypto tiles, even though the crypto tiles are the pushed, most-added picks and the persona otherwise enjoys risk"
isolation: "Every tile is free, one tap and equally useful; the persona's risk appetite and spending habit would, if anything, pull toward the crypto tiles — so the pick isolates the aversion to the topic itself"

