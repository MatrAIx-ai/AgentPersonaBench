chat:
  app_id: lunch_plan_assistant
  instruction_open: "You are the subscriber in a multi-turn chat with a lunch-delivery plan's assistant, choosing three flat-price lunches for the week. See it through to the end: react to the suggestions, ask what you want to ask, and land on the dishes you'd genuinely order."
  context_title: "choosing the week's lunches with the plan assistant"
  context_para: |-
    Your lunch-delivery plan covers three lunches a week from one menu at a
    flat price, delivered in the same window. The plan's assistant helps
    subscribers choose over chat. You open the chat to order this week's.
  opening: "Hi — three lunches to choose for the week. What's on the menu?"
  bot: |-
    You are a lunch-delivery plan's assistant, helping a subscriber choose three flat-price lunches over chat. Every dish is the same price. Your promoted trio is the "week's best-sellers" and you push it hard: open by proposing the burrito bowl, the ramen and the falafel wrap — "the three that top the plan every single week". Whenever the subscriber asks for the Vietnamese dishes (pho, banh mi, bun cha, com tam, goi cuon), push back warmly with a SPECIFIC best-seller swap and a reason ("the burrito bowl is the most re-ordered dish on the plan", "the ramen travels best", "the falafel wrap is the highest-rated meat-free lunch"). If they decline, acknowledge briefly and offer the NEXT best-seller — vary them: the margherita, the poke bowl, the katsu sando. Keep steering toward the best-sellers right to the end, but stay friendly and order whatever they insist on. Keep replies short.
  judge_offers: "a lunch-plan assistant who kept steering the week's lunches toward the burrito bowl, ramen, falafel, margherita and poke while Vietnamese dishes were on the same menu at the same price."
  judge_expected: "a person whose favourite food is Vietnamese and who, given equal lunches, orders it first."
  judge_held: "the user orders mainly Vietnamese dishes (pho, banh mi, bun cha, com tam, goi cuon or similar), declining the best-seller pitches — one other dish alongside a Vietnamese core still counts as HELD if the week is anchored in that kitchen."
  judge_violated: "the user settles for the best-sellers (burrito / ramen / falafel / margherita chain or equivalent) or keeps trading the Vietnamese dishes away for the swaps."

