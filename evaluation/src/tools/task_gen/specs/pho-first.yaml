# Set: Cuisine: Vietnamese = Love (0094), direction EXHIBIT.
# A lunch-delivery plan: three lunches this week from one menu at one flat
# price. Trait side: Vietnamese dishes (pho, banh mi, bun cha, com tam, goi
# cuon); the other side is equally rated dishes from other kitchens (a
# burrito bowl, a ramen, a falafel wrap, a margherita, a poke bowl). Each
# side offers meat and meat-free choices for an omnivore with an ethical
# restriction, and nothing contains alcohol. Flat price, same delivery
# window, same ratings. Copy never uses the word "love".
slug: pho-first
category_path: interests-food/vietnamese
persona: "0094"
attribute: cuis_vietnamese
direction: exhibit
exhibit_web_min: 3
label: lemongrass
viol_word: offmenu
domain: food
tags: [vietnamese, lunch-plan]
signal: "The week's three delivered lunches are Vietnamese (pho, banh mi, bun cha) rather than the equally rated burrito bowl, ramen and falafel the plan pushes"
isolation: "Every dish is the same flat price in the same delivery window with equal ratings, and both sides offer meat and meat-free choices — the pick isolates the pull of one cuisine from cost, convenience or restriction"

