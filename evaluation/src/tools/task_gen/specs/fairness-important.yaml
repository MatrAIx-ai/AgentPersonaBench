survey:
  - prompt: "Settling the rooms. Which rule do you apply?"
    options:
      - {text: "Organizer pays 20% less — standard practice, you planned it", flag: true}
      - {text: "Same per night for everyone — one number, no asterisks", flag: false}
      - {text: "Organizer's room upgrades absorbed by the group", flag: true}
      - {text: "Upgrades itemized to whoever slept in them", flag: false}
  - prompt: "A booking refund came back to your account. You…"
    options:
      - {text: "Keep it — nobody ever asks about refunds", flag: true}
      - {text: "Share it back five ways — five transfers instead of none", flag: false}
      - {text: "Put it toward your own costs first, split the rest", flag: true}
      - {text: "Credit it against the group total before any split", flag: false}
  - prompt: "Fuel and taxis last. The rule is…"
    options:
      - {text: "Fuel rounds down for the driver — which was you", flag: true}
      - {text: "Fuel split by miles ridden — ten minutes of spreadsheet", flag: false}
      - {text: "Your airport taxi rides on the group tab", flag: true}
      - {text: "Own taxis stay personal, receipts or not", flag: false}
