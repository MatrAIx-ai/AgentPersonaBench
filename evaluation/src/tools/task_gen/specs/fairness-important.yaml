  app_header: "Trip settle-up · you organized it"
  app_title_line: "Settle the trip in the SplitSlip app"
  app_open_line: "The getaway's shared costs are in — you organized it, so the rules are yours to set."
  app_pick_line: "you'd genuinely apply to the group's costs"
  app_note: "one tap"
