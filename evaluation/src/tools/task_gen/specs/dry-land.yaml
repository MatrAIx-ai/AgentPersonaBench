# Set: Interest: Fishing = Averse (hf-4386921459), direction AVOID.
# Choosing three free activities from a lakeside lodge's stay menu. Label
# marks the FISHING options (a dawn boat-fishing trip, a fly-casting lesson,
# a jetty fishing hour, a lure-tying-and-cast session, a night-fishing
# outing); the other side is equally appealing lakeside options that keep
# rods out of it (a kayak paddle, a sauna-and-swim, a forest walk, an
# archery hour, a star-gazing night). All are free with the stay, the same
# length and guided; the fishing options carry the "what the lake is famous
# for" lure. Copy never uses the word "averse".
