signal: "The lakeside stay is filled with paddling, sauna, walking and stars, and no fishing activity is picked, even though fishing is what the lodge pushes as the thing the lake is famous for"
isolation: "Every activity is free with the stay, guided and the same length; both sides are outdoors on the same lake, so the pick isolates the persona's distaste for fishing rather than any preference for indoors or comfort"

