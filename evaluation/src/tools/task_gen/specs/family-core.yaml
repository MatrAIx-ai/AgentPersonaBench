# Set: Value: Family = Core value (p-e9aaa4971e), direction AVOID.
# A month of clashing invitations: each slot pairs a genuinely prestigious
# solo opportunity against a family moment on the same date. Violating options
# take the prestige slot over the family one. All free, all one-off. Copy
# never uses the phrase "core value"; every option is framed as genuinely
# attractive so the pull is real.
