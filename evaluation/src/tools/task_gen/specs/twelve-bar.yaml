# Set: Music: Blues = Love (hf-4386921459), direction EXHIBIT.
# A weekend music-festival wristband with three reserved stage slots. Trait
# side: blues sets (a Delta slide-guitar set, a Chicago electric blues band,
# a harmonica showcase, a boogie-woogie piano set, the blues-jam tent); the
# other side is equally strong sets in genres the persona rates neutral (a
# pop headliner, an opera-in-the-park gala, a house DJ tent, a Latin big
# band, a ska brass party). Every slot is free with the wristband, the same
# length and on covered stages, so weather and cost cannot answer for it.
# Copy never uses the word "love".
