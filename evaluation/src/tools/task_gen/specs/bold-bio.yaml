# Set: Modesty = Low (p-0af9cc2a30), direction AVOID.
# Building a speaker profile for a conference platform: three profile
# blocks to switch on. Label marks the UNDERSTATED blocks (a one-line bio
# with the awards left off, "team member" instead of "lead" in the title,
# hiding the citation and download counts, declining the featured-speaker
# badge, listing collaborators before yourself); the other side is the same
# facts stated plainly and in full (the full awards list, the lead title,
# the numbers shown, the badge accepted, your name first). Every block is
# free, takes one tap and states only true things, so effort and honesty
# are constant; the understated blocks carry the tasteful-restraint lure
# ("what the most respected speakers do"). Copy never uses the word "low".
slug: bold-bio
category_path: personality-big-five/modesty
persona: p-0af9cc2a30
attribute: big5_modesty
direction: avoid
label: understate
viol_word: understated
domain: work
tags: [modesty, speaker-profile]
signal: "The speaker profile states the persona's record plainly and in full (awards listed, lead title, numbers shown, badge accepted, own name first) and switches on none of the understated blocks, even though restraint is the pushed, tasteful pick"
isolation: "Every block is free, one tap, and states only true facts about the same record — the pick isolates whether the persona plays down its own standing, not honesty or effort"

