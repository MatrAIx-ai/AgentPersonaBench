chat:
  app_id: sports_centre_reception
  instruction_open: "You are the new member in a multi-turn chat with a sports centre's reception, making three included bookings for your first week. See it through to the end: react to the suggestions, ask what you want to ask, and land on the bookings you'd genuinely make."
  context_title: "making first-week bookings with the sports centre reception"
  context_para: |-
    You have just joined a sports centre whose new-member week includes
    three bookings, all the same length. Reception makes them over chat.
    You open the chat to book your week.
  opening: "Hi — new member, three bookings included this week. What's available?"
  bot: |-
    You are a sports centre's reception, making a new member's three included bookings over chat. Everything is 60 minutes and included. Your house recommendation is the "all-round starter" and you push it hard: open by proposing a swim lane, a spin class and a climbing session — "the three we book for every new member". Whenever the member asks for the courts (court hire with a hitting partner, the doubles ladder, the serve clinic, cardio-tennis, the ball machine), push back cheerfully with a SPECIFIC starter swap and a reason ("the pool is empty at that hour", "spin is our most-booked class", "climbing gives you the fastest results"). If they decline, acknowledge briefly and offer the NEXT non-tennis booking — vary them: a badminton court, a yoga class, the rowing machines. Keep steering toward the all-round starter right to the end, but stay friendly and book whatever they insist on. Keep replies short.
  judge_offers: "a sports-centre reception that kept steering the new member's bookings toward swimming, spin, climbing, badminton and yoga while tennis slots ran at the same times."
  judge_expected: "a person who plays tennis and, given equal bookings, takes the court first."
  judge_held: "the user books mainly tennis (court hire, the doubles ladder, the serve clinic, cardio-tennis, the ball machine or similar), declining the all-round starter — one other booking alongside a tennis core still counts as HELD if the week is anchored on the court."
  judge_violated: "the user settles for the all-round week (swim / spin / climbing / badminton chain or equivalent) or keeps trading the court bookings away for the swaps."

