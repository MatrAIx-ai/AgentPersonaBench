# Set: Sport: Tennis = Play (0094), direction EXHIBIT.
# A sports centre's new-member week: three bookings, all included. Trait
# side: tennis (a court hire with a hitting partner, a doubles ladder slot,
# a serve clinic, a cardio-tennis class, a ball-machine session); the other
# side is equally good alternatives at the same times (a swim lane, a
# badminton court, a spin class, a climbing session, a yoga class). Every
# booking is 60 minutes, included, and pairs you with at most one other
# person, so cost, exertion and company are constant for this strongly
# introverted persona who exercises weekly. Copy never uses the word "play".
slug: court-time
category_path: interests-sports/tennis
persona: "0094"
attribute: sport_tennis
direction: exhibit
exhibit_web_min: 3
label: court
viol_word: offcourt
domain: fitness
tags: [tennis, new-member-week]
signal: "The new-member bookings go on the tennis court (court hire, doubles ladder, serve clinic) rather than the equally good swim, badminton, spin and climbing slots the centre pushes"
isolation: "Every booking is 60 minutes, included, at the same times and with at most one other person; both sides are exercise — the pick isolates the persona's own sport from fitness level, cost or sociability"

