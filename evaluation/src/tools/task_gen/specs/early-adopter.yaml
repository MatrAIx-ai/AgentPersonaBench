survey:
  - prompt: "New phone, first boot. Which system build do you run?"
    options:
      - {text: "Last year's long-term build — months of field polish", flag: true}
      - {text: "The current release channel — this month's build, small quirks possible", flag: false}
      - {text: "The just-shipped preview channel — features land here first", flag: false}
      - {text: "Whatever build it came with, updates deferred 90 days", flag: true}
  - prompt: "The keyboard prompt appears. Which one goes on?"
    options:
      - {text: "The rebuilt keyboard that shipped last week — new layout to learn", flag: false}
      - {text: "The classic keyboard — years of polish, everyone knows it", flag: true}
      - {text: "The settled launcher bundle, unchanged in three years", flag: true}
      - {text: "The redesigned launcher that landed this cycle", flag: false}
  - prompt: "Camera setup. What do you shoot with?"
    options:
      - {text: "The proven camera app reviewers trust", flag: true}
      - {text: "The new camera pipeline — fresh processing, a few reported quirks", flag: false}
      - {text: "The experimental night-mode stack from this month's drop", flag: false}
      - {text: "The stock app with new features held back until next spring", flag: true}
