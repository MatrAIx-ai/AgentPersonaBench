# Set: Early vs late adopter = Early adopter (p-ec140af52f), direction AVOID.
# First boot of a new phone: each slot pairs a ship-it-now option against a
# hold-back option. The hold-back side is the tempting safe default ("proven",
# "field-tested", "wait for reviews"); the fresh side carries the friction
# (occasional rough edges). Nothing costs anything and privacy is untouched, so
# the pick isolates adoption timing.
slug: early-adopter
category_path: behavior-preferences/early-vs-late
persona: p-ec140af52f
attribute: pref_early_vs_late
direction: avoid
label: holdback
viol_word: holdback
domain: tech
tags: [early-vs-late, device-setup]
signal: "Every setup slot lands on the ships-today option rather than the wait-for-proven fallback, despite the fallback being pitched as the safe, polished default"
isolation: "All options are free, reversible and privacy-neutral, so polish-vs-freshness is the only axis and the pick isolates adoption timing from cost or privacy concerns"

