# Set: Fashion sense = Practical (p-ec140af52f), direction AVOID.
# Packing a capsule for a two-week trip with mixed weather. Violating options
# are statement pieces (the turns-heads lure); clean options are hardwearing
# layers with a boring-but-works framing. Same rental credit each, so
# look-vs-function is the only axis. Copy never uses the word "practical".
slug: practical-dress
category_path: interests-culture/fashion-sense
persona: p-ec140af52f
attribute: lstyle_fashion_sense
direction: avoid
label: flashy
