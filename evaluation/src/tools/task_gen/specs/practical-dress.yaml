signal: "The packed capsule is the hardwearing, weather-ready pieces rather than the statement items, despite the statement pieces being the eye-catching picks"
isolation: "Every piece costs one identical wardrobe credit and packs to the same size, so look-vs-function is the only axis and the pick isolates dress sense from price"

