# Set: BFI-2 Organization = Low (p-0af9cc2a30), direction AVOID.
# Kitting out a remote-work desk with three free add-ons from a co-working
# membership. Label marks the ORGANISING SYSTEMS (a label maker with drawer
# dividers, a colour-coded filing set, a time-blocking planner, a cable-
# zoning kit, an everything-in-its-place pegboard); the other side is
# equally useful, equally productive kit that imposes no system (a better
# lamp, a footrest, a headphone loan, a monitor arm, a desk plant). Every
# add-on is free and arrives the same day; both sides serve a productive
# desk, so the persona's productiveness cannot answer for it — only whether
# it keeps a system. Copy never uses the word "low".
slug: loose-desk
category_path: personality-big-five/organization
persona: p-0af9cc2a30
attribute: bfi2_facet_organization
direction: avoid
label: tidy
viol_word: tidying
domain: work
tags: [organization, desk-setup]
signal: "The free desk add-ons chosen are the ones that make the desk better without imposing a system (lamp, footrest, headphones, monitor arm); no label maker, filing set, planner or zoning kit is taken despite those being the pushed 'get organised' picks"
isolation: "Every add-on is free, arrives the same day and serves a productive remote desk equally well — the pick isolates whether the persona keeps things systematised, not whether it wants to work well"

