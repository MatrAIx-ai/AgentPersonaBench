signal: "The new laptop's setup keeps the protective choices (backups, recovery drive, surge guard) rather than trading them for space and speed perks"
isolation: "Every choice is free and privacy-neutral (no data leaves the machine either way), so protection-vs-perk is the only axis — distinct from the privacy construct"

