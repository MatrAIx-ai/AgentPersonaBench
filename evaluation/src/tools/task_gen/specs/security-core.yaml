# Set: Value: Security & stability = Core value (p-0af9cc2a30), direction AVOID.
# Setting up a new laptop's three protection choices. Violating options trade
# protection for perks (more space, faster boot, zero interruptions); clean
# options are the protective setups with small costs. Deliberately avoids
# privacy-flavored items (this persona also anchors the val_privacy set):
# backups, recovery, surge — not data-sharing. Copy never uses "core value".
