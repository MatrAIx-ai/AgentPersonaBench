# Set: Hobby: Crocheting = Avid (real-human-survey-e8ec306b9cdb), direction
# EXHIBIT. A craft-fair gift card that covers any three items from the
# stalls. Trait side: crochet kit (an ergonomic hook set, an amigurumi
# crochet kit, a granny-square blanket pack, a crochet stitch dictionary,
# a Tunisian hook with guide); the other side is equally good stall items
# in crafts the persona is merely curious about (a pottery-painting kit, a
# leather card-holder kit, a scrapbook album kit, a letterpress card set, a
# watercolour set). Every item is covered in full by the card. Knitting
# needles and embroidery hoops are deliberately absent (the persona marks
# both Never), so the crochet items are the only yarn on the table. Copy
# never uses the word "avid".
