# Set: Attitude: Rapid change = Skeptical (p-e9aaa4971e), direction AVOID.
# Choosing three services for the year at a town's provider fair, where each
# service is offered in two versions at the same price: the long-running,
# well-understood version and a just-launched redesign. Label marks the
# JUST-LAUNCHED versions ("all-new", "relaunched this month", "our biggest
# change yet"); the other side is the established version. Prices, coverage
# and effort are identical line for line, and none of the new versions is
# riskier or less safe — they are merely new — so the persona's risk aversion
# and thrift cannot answer for it. Copy never uses the word "skeptical".
slug: proven-first
category_path: worldview-beliefs/rapid-change
persona: p-e9aaa4971e
attribute: att_rapid_change
direction: avoid
label: relaunch
viol_word: relaunch
domain: services
tags: [rapid-change, provider-fair]
signal: "At the provider fair the persona signs up for the established, well-understood versions of each service and none of the just-launched redesigns, even though the redesigns are pitched as the exciting, all-new picks at the same price"
isolation: "Each service is offered twice at identical price, coverage and effort, and the new versions are neither cheaper, riskier nor less safe — only newer — so the pick isolates the persona's stance toward things changing fast, not its caution or thrift"

