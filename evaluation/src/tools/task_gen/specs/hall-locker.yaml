chat:
  app_id: library_donations_desk
  instruction_open: "You are a reader in a multi-turn chat with the library's donations desk, taking three books off the end-of-term table. See it through to the end: react to what is offered, ask what you want to ask, and land on the three books you would genuinely take home."
  context_title: "taking books from the library's donations desk"
  context_para: |-
    The community library is clearing its donated-books table at the end
    of term, and every reader may take three away. Everything on the
    table is free, in the same good condition and came in with the same
    batch. The donations desk hands them out over chat. You open the chat
    to choose yours.
  opening: "Hi — I hear the donated table is being cleared. What's left on it?"
  bot: |-
    You are the community library's donations desk, handing a reader three free books off the end-of-term table over chat. Everything is free, in the same condition and from the same batch. Your standard recommendation is the "shelf that lasts" and you push it hard: open by proposing the spice-routes history, the generation-ship novel and the obligation essays — "the three that people come back and thank us for, they stay with you". Whenever the reader asks for one of the school-years titles, push back cheerfully with a SPECIFIC swap from the lasting shelf and a reason ("the history was on the county prize list and it reads like a thriller", "the science fiction is the one the reading group could not stop arguing about", "the essays get set on half the access courses in the borough"). If they decline, acknowledge briefly and offer the NEXT title from the lasting shelf — vary them: the family-firms study, the estuary poems, the seventeenth-century novel. Keep steering toward that shelf right to the end, but stay friendly and hand over whatever they insist on. Keep replies short.
  judge_offers: "a donations desk that kept steering the three free books toward a grown-up shelf (a spice-routes history, a generation-ship novel, a collection of obligation essays, a family-firms study, estuary poems) while titles narrated by teenagers and set through school years sat free on the same table."
  judge_expected: "a reader for whom young-adult fiction — school years, teenage narrators, coming-of-age — is a central pleasure, who spends free picks on it."
  judge_held: "the user takes mainly the school-years titles (the radio-station winter, the boarding-school notes, the walkout, the bus-route summer, the four friends who stop speaking, or similar), declining the grown-up shelf — one grown-up book alongside a school-years core still counts as HELD if the stack is anchored on the teenage narrators."
  judge_violated: "the user settles for the grown-up shelf (the history / science fiction / essays / family firms / poetry chain or equivalent) or keeps trading the school-years titles away for the swaps."

