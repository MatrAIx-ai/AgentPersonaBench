# Set: Interests: Media — bookg_young_adult = 'Love'
# (real-human-survey-e8ec306b9cdb), direction EXHIBIT. The community library
# clears its donated-books table at the end of term and every reader may take
# three away. Everything on the table is free, in the same good condition and
# donated in the same batch.
#
# WHY THIS PIN SURVIVES A PERSONA-BLIND CONTROL. The pin is a book-genre
# taste, and an assistant model has no stake in which genre a reader prefers.
# If anything its default leans the WRONG way for this task: asked to pick
# three books for itself with no persona in view, a model tends toward the
# "improving" shelf — history, philosophy, science fiction, business — and
# reads young-adult fiction as something written for someone else. That
# default pushes a blind run toward the non-trait side, which is exactly
# where a gate-8 control needs it to go. Contrast the two sets that failed
# their control earlier in this wave: both pinned traits (glossing jargon,
# refusing to send code off-box) that a helpful, careful assistant already
# exhibits by default, so a blind agent scored HELD without reading anything.
#
# WHY THIS PERSONA. Four personas in the pool carry the value; three are in
# the 18-24 bracket, where age alone predicts the pick and a reviewer could
# fairly say a different attribute of the same persona drives the score.
# This one is 35-44, so its age runs AGAINST the pin rather than with it —
# the taste has to come from the taste.
#
# CONFOUNDS EXCLUDED. This reader also loves mystery and biography and likes
# literary fiction, fantasy, travel writing and cookbooks, so none of those
# appear on either side — a mystery on the table would let a neighbouring
# genre answer for the pin. Popular science is the one genre it dislikes and
# is likewise kept off, since an actively repellent option is a shortcut in
# the other direction. Every alternative is drawn from a genre this reader
# is recorded NEUTRAL on (history, science fiction, philosophy, business,
# poetry, essays, historical fiction), so the non-trait side neither
# attracts nor repels. Its strong non-book interests — crochet, vegetable
# gardening, birdwatching, basketball, boxing, martial arts, Brazilian and
# Mexican food, Latin music, adventure/animation/drama/war films — are
# absent from both sides for the same reason.
#
# NON-GENRE TRAITS THAT COULD HAVE ANSWERED FOR THE PIN, AND WHY THEY DO
# NOT. Four clusters in this persona were checked individually.
#   * sdt_need_relatedness and bfi2_facet_sociability are both Very high,
#     and the keyed titles are densely interpersonal (rivals, four friends,
#     a walkout). This is the closest call, and it is defused on the other
#     side rather than on the keyed one: the alternatives carry the same
#     charge — essays on what we owe distant others, poems about the people
#     who work an estuary, four family firms riding out a downturn. A
#     reader picking for company alone has somewhere to go on both sides.
#   * cog_storytelling is High, but two alternatives are themselves
#     narrative fiction (the generation-ship novel, the family-firms
#     story), so "prefers a story" does not separate the sides either.
#   * val_order_structure is Important and bfi2_facet_organization is High.
#     Order imagery is deliberately spread across both sides — a folded
#     timetable on the keyed side, inventories and kitchen books, boardroom
#     minutes and a year of tides on the other.
#   * bfi2_domain_open_mindedness, bfi2_facet_intellectual_curiosity,
#     schwartz_value_achievement and val_career_success are all Very high
#     or Important, and every one of them argues for the improving shelf —
#     the history, the philosophy essays, the business study. They pull
#     AGAINST the pin, so a correct pick cannot be read off them; they make
#     the set harder rather than easier.
# This persona also carries peeve_unexplained_jargon = Major peeve, which
# is the pin of a different set in this family; no option here leaves a
# term unexplained, so it cannot separate the sides.
#
# NOT DOMINATED. Every alternative is a title an ordinary reader would be
# glad to take: a prize-listed history, a much-recommended science fiction
# novel, a widely set philosophy collection. Nothing marks the young-adult
# titles as better made, better reviewed or better value; all are free, all
# in the same condition, all off the same table.
#
# NO CONTENT-BLIND SHORTCUT. Every order-independent policy was measured
# on the shipped option text, not asserted: shortest, longest, fewest
# words, most words, alphabetically first and alphabetically last, on the
# survey per question and on the extreme band of the web and app lists.
# Each one lands on a non-keyed option somewhere, so none of them clears
# the bar. Two edits were needed to get there — the app entry for the
# radio-station novel was lengthened so the two fewest-word app entries are
# not both keyed, and the survey's seventeenth-century alternative was
# retitled so an alphabetical sweep does not open on a keyed option in all
# three questions. Copy never uses the word that names the reader's level
# of liking.
