# Set: Trust = Low (p-0af9cc2a30), direction AVOID. Contrast pair with open-hand.
# Arriving at a co-living and co-working hub for a month: the hub's app
# offers each everyday arrangement two ways at the same cost. Label marks
# the GOOD-FAITH routes (leave the laptop on the shared desk as everyone
# does, the honour-jar pantry, a spare key with the hub host, the lend-
# anything monitor list, parcels on the open shelf); the other side gets the
# same thing through a guarded route (a hot-desk locker, the prepaid pantry
# card, a coded lockbox, the front-desk reservation log, a locked parcel
# locker). Costs, effort and access are identical line for line, and both
# routes involve people, so thrift and sociability cannot answer for it.
# Copy never uses the word "low".
