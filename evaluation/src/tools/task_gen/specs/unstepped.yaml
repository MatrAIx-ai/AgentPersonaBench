signal: "The walking-club add-ons chosen are the ones that support walking without counting it (routes, rain shell, boot fitting); no step-goal band, leaderboard or pedometer is taken despite those being the pushed, motivating picks"
isolation: "Every add-on is free, arrives the same week and is useful to a daily walker; the persona already walks daily, so the only difference between the sides is whether the walking gets counted"

