# Set: Habit: Step counting = Never (p-ec140af52f), direction AVOID.
# Setting up a new walking-club membership: three free add-ons. Label marks
# the STEP-COUNT options (a step-goal band, a daily-steps leaderboard, a
# pedometer widget); the other side is equally useful club extras that do not
# count steps (a route map book, a rain-shell loan, a boot-fitting session).
# Everything is free, arrives the same week and suits a daily walker, so
# cost and usefulness are constant; the counting options carry the
# motivation lure ("members who track walk 30% more"). Copy never uses the
# word "never".
