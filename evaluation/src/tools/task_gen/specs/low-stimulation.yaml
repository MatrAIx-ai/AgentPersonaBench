signal: "The festival evening is booked from the quiet menu (tea pavilion, koi garden, lantern float) rather than the sensory-spectacle sessions, despite those being pitched as what everyone comes for"
isolation: "Every session is seated, zero-exertion, risk-free and on the same pass — both sides alike — so sensory intensity is the only axis; physical risk, mobility and effort cannot decide it"

