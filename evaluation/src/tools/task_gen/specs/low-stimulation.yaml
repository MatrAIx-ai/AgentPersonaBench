# Set: Schwartz value: Stimulation = Low (p-e9aaa4971e), direction AVOID.
# A resort evening-festival menu. Violating options are the sensory-spectacle
# sessions (fireworks front row, neon parade grandstand, taiko floor seats —
# the bucket-list lure); clean options are quiet, familiar sessions. EVERY
# option is seated, zero-exertion and risk-free ON BOTH SIDES: this persona
# also carries very-low recreational risk, a mobility aid and severe pain, so
# an adrenaline-sports instrument (the first cut) would let those non-pinned
# dimensions decide the verdict and duplicate the thrill-seeker set
# (review-swarm finding val-4). Copy never uses the word "low".
