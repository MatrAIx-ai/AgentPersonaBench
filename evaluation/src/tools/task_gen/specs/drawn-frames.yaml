signal: "The three member screenings are animated — the hand-drawn feature, the stop-motion, the shorts programme — rather than the equally well-reviewed live-action films the cinema pushes"
isolation: "Every screening is free with membership, the same length and in the same slot; the live-action side is drawn only from genres the persona rates neutral, so the pick isolates the persona's own passion for animation rather than a dislike of what it is set against"

