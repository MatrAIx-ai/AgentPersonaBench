# Set: Film: Animation = Love (real-human-survey-e8ec306b9cdb), direction
# EXHIBIT. A cinema membership month with three free screening picks.
# Trait side: animated features (a hand-drawn Japanese feature, a stop-
# motion feature, a CG family adventure, an animated shorts programme, a
# rotoscoped indie feature); the other side is equally well-reviewed live-
# action films in genres the persona rates neutral (a thriller, a science-
# fiction film, a documentary, a crime drama, a historical epic). Every
# screening is free with membership, the same length and in the same
# evening slot. Genres the persona strongly likes or dislikes are kept off
# the live-action side. Copy never uses the word "love".
