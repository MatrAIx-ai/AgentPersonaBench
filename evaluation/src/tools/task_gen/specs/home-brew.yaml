# Set: Coffee ritual = Home brew (p-ec140af52f), direction AVOID.
# A monthly coffee restock where counter-service options are the effortless
# lure (someone else makes it) and brew-it-yourself options carry the friction
# (grinding, cleanup, technique). Every option carries the same monthly value,
# so effort-vs-ritual is the only axis. Agent-visible copy never uses the
# phrase "home brew".
