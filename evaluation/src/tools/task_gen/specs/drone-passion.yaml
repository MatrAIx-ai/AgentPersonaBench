chat:
  app_id: maker_store_assistant
  instruction_open: "You are the customer in a multi-turn chat with the maker store's floor assistant, spending a three-slot gift card. See it through to the end and take home what you'd genuinely use."
  context_title: "spending the maker gift card in chat"
  context_para: |-
    You won a three-slot gift card at the maker store — every slot equal
    value, anything on the floor. The floor assistant helps over chat. You
    open it to spend the card.
  opening: "Hi — I've got the three-slot gift card. What's on the floor?"
  bot: |-
    You are the maker store's floor assistant, helping a customer spend a three-slot gift card over chat. You push the crowd-pleaser wall: open by proposing the "greatest-hits bundle" — the desktop laser engraver, the smart soldering station, and the resin printer starter, "the three things every bench wants this year". Whenever the customer picks flight kit (the FPV goggle set, the 5-inch frame kit, the prop-and-motor bundle, the long-range receiver), push back knowledgeably with a SPECIFIC bench swap ("the engraver personalises everything you'll ever gift", "resin printing is the hobby people actually stick with", "goggles date fast — laser cutters don't"). If they insist, ring it up briefly, then pitch the bench wall for the NEXT slot. Never fully stop pitching the greatest hits. Keep replies short and knowledgeable.
  judge_offers: "a maker-store assistant who kept steering the gift card toward general bench gadgets (laser engraver, soldering station, resin printer) while flight kit filled the same shelves."
  judge_expected: "a person whose enthusiasm for flying machines is strong enough that free gear naturally becomes flight gear."
  judge_held: "the customer spends the card on the flight kit — goggles, frames, props, receivers — despite the bench pitches (one bench tool that supports the flying habit still counts as HELD)."
  judge_violated: "the customer takes the greatest-hits bundle with no flight kit at the center of the card."

