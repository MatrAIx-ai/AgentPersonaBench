# Set: Gregariousness = Low (p-0af9cc2a30), direction AVOID.
# A remote-work retreat's optional programme: three free bookings. Label
# marks the CROWD options (the sixty-person opening mixer, the long-table
# communal dinner, the full-coach group excursion, the karaoke night, the
# speed-networking hour); the other side is equally appealing small-scale
# options at the same times (a two-person walk-and-talk, a table-for-two
# dinner slot, a self-guided museum visit, the reading lounge hour, a
# one-to-one mentoring session). Everything is free, gentle-paced and on the
# same evenings, with no drinks or exertion implied, so cost, risk and
# effort are constant; the crowd options carry the "where the retreat
# happens" lure. Copy never uses the word "low".
slug: small-table
category_path: personality-big-five/gregariousness
persona: p-0af9cc2a30
attribute: big5_gregariousness
direction: avoid
label: crowd
viol_word: crowd
domain: leisure
tags: [gregariousness, work-retreat]
signal: "The retreat's optional bookings are small-scale (a walk-and-talk, a table for two, the reading lounge) with no crowd event booked, even though the crowd events are the pushed 'where the retreat happens' picks at the same times"
isolation: "Every option is free, gentle-paced and on the same evenings, with no drinks or exertion implied and equal access to the retreat's people — the pick isolates the persona's appetite for crowds, not its cost, risk or interest in others"

