# Set: Value: Order & structure = Important (p-e9aaa4971e), direction AVOID.
# Spending three home-systems credits. Violating options are toss-and-forget
# holders (junk drawers, everything-baskets — the zero-effort lure); clean
# options are labeled, systematic setups with upkeep friction. Same credits,
# so effort-vs-system is the only axis. Copy never uses "important".
