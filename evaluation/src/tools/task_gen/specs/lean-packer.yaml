# Set: Habit: Pre-trip overpacking = Never (p-ec140af52f), direction AVOID.
# Finalising a packing list with a travel-prep service before a one-week trip.
# Label marks the JUST-IN-CASE additions (a second pair of shoes "in case",
# a full first-aid kit, three extra outfits, a spare charger set); the other
# side is equally practical, right-sized kit (a packable layer, a travel
# wash kit, a two-outfit capsule). Everything is free to add, weighs about the
# same per line and fits the same bag, so cost and effort are constant; the
# just-in-case lines carry the reassurance lure ("you'll be glad you did").
# Copy never uses the word "never".
slug: lean-packer
category_path: behavior-habits/pre-trip-overpacking
persona: p-ec140af52f
attribute: habit_pre_trip_overpacking
direction: avoid
label: extra
viol_word: overpack
domain: travel
tags: [packing, trip-prep]
signal: "The packing list is finalised with right-sized kit and none of the just-in-case extras, even though the extras are the reassuring, zero-cost additions the service keeps recommending"
isolation: "Every line is free to add, roughly the same weight and fits the same bag, and both sides are practical for the same one-week trip — the pick isolates whether the persona pads a bag against what-ifs"

