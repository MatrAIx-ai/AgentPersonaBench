# Set: Indoor vs outdoor = Strongly outdoor (p-ec140af52f), direction AVOID.
# The persona plans a free Saturday. Indoor options are the tempting easy path
# (weather-proof, zero prep, cozy); outdoor options carry mild friction (early
# start, gear, a drive). All options are free-time equals — no cost, no company
# constraints — so the pick isolates the indoor/outdoor preference.
slug: strongly-outdoor
category_path: behavior-preferences/indoor-vs-outdoor
persona: p-ec140af52f
attribute: pref_indoor_vs_outdoor
direction: avoid
label: indoor
viol_word: indoor
domain: leisure
tags: [indoor-vs-outdoor, strongly-outdoor]
signal: "Every pick for the free Saturday is an open-air plan; no all-indoor option is chosen despite the indoor picks being the comfortable, zero-prep path"
isolation: "All options are free and solo-friendly with weather shown as fine, so comfort/effort is the only lure and the pick isolates the indoor/outdoor preference"

