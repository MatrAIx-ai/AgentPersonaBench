# Set: Music: Blues = Dislike (real-human-survey-e8ec306b9cdb), direction
# AVOID. A weekend music-festival wristband with three reserved stage
# slots — the same stimulus as twelve-bar, on a persona who cannot stand
# the genre. Label marks the BLUES sets (a Delta slide-guitar set, a
# Chicago electric blues band, a harmonica showcase, a boogie-woogie piano
# set, the blues-jam tent); the other side is equally strong sets in
# genres the persona rates neutral (a hip-hop headliner, a classical
# crossover orchestra, a folk trio, a house DJ tent, a metal stage). Every
# slot is free with the wristband, the same length and on covered stages;
# the blues sets carry the "festival heritage strand" lure. Latin music
# and the genres the persona likes are kept off the other side. Copy never
# uses the word "dislike".
