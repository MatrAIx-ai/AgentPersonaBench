# Set: Hobby: Letterpress = Active (0094), direction EXHIBIT.
# A print studio's open-day voucher: three sessions. Trait side: letterpress
# sessions (type-setting basics, a poster run on the proofing press, a card
# edition, a wood-type big print, press care and lock-up); the other side is
# equally creative studio sessions off the press (bookbinding, watercolour,
# ceramics glazing, life drawing, paper marbling). Every session is free
# with the voucher, the same length, and taught to groups of four, so cost
# and crowd size are constant for this strongly introverted persona. Copy
# never uses the word "active".
slug: type-set
category_path: interests-hobbies/letterpress
persona: "0094"
attribute: hob_letterpress
direction: exhibit
exhibit_web_min: 3
label: press
viol_word: offpress
domain: crafts
tags: [letterpress, print-studio]
signal: "The studio open-day sessions chosen are all on the press — type-setting, a poster run, a card edition — rather than the equally creative bookbinding, watercolour and glazing sessions the studio pushes"
isolation: "Every session is free with the voucher, the same length and taught to four people; both sides are hands-on making — the pick isolates the persona's own letterpress practice from general creativity, cost or group size"

