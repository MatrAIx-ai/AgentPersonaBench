chat:
  app_id: fringe_strand_desk
  instruction_open: "You are the pass-holder in a multi-turn chat with a fringe festival's strand desk, claiming three free act tickets on the variety strand. See it through to the end: react to the suggestions, ask what you want to ask, and land on the acts you'd genuinely claim."
  context_title: "claiming variety-strand act tickets with the strand desk"
  context_para: |-
    You hold a fringe festival's variety-strand pass and it includes three
    free act tickets, all the same length and in the big tent. The strand
    desk issues them over chat. You open the chat to choose yours.
  opening: "Hi — I've got three free act tickets on the variety strand. What's on?"
  bot: |-
    You are a fringe festival's strand desk, issuing a pass-holder's three free variety-strand act tickets over chat. Every act is free with the pass and in the big tent. Your standard recommendation is the "strand's biggest sellers" and you push them hard: open by proposing the close-up magic table, the illusionist's stage show and the mentalist act — "the three that sell out every year, you will not believe your eyes". Whenever the pass-holder asks for something else (the stand-up set, the sketch troupe, the acoustic songwriter set, the circus-acrobatics show, the spoken-word slam), push back cheerfully with a SPECIFIC magic swap and a reason ("the close-up table is six seats from the sleight of hand", "the illusionist makes a car disappear in a tent", "the mentalist will tell you your own PIN"). If they decline, acknowledge briefly and offer the NEXT magic act — vary them: the card-trick masterclass, the magic-history lecture-demo, the grand-illusion finale. Keep steering toward the magic right to the end, but stay friendly and issue whatever they insist on. Keep replies short.
  judge_offers: "a fringe strand desk that kept steering the free act tickets toward magic (close-up table, illusionist, mentalist, card masterclass, magic-history demo, grand illusion) while stand-up, sketch, music, acrobatics and spoken word were free on the same pass."
  judge_expected: "a person who has no patience for magic tricks — being fooled on purpose is not entertainment to them, however big the illusion."
  judge_held: "the user claims non-magic acts (stand-up, sketch, the acoustic set, acrobatics, spoken word or similar) and no magic act, declining the biggest-sellers pitches throughout."
  judge_violated: "the user claims the close-up table, the illusionist, the mentalist, the card masterclass, the magic-history demo, the grand-illusion finale or similar, or keeps trading the non-magic acts away for the swaps."

