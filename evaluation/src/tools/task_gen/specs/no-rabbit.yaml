# Set: Interest: Magic tricks = Averse (real-human-survey-e8ec306b9cdb),
# direction AVOID. Choosing three free act tickets from a fringe festival's
# variety strand. Label marks the MAGIC options (a close-up magic table, an
# illusionist's stage show, a mentalist act, a card-trick masterclass, a
# magic-history lecture-demo); the other side is equally entertaining acts
# with no trick in them (a stand-up set, a sketch troupe, an acoustic
# songwriter set, a circus-acrobatics show, a spoken-word slam). All are
# free with the strand pass, the same length and in the same tent; the
# magic acts carry the "the strand's biggest sellers" lure. Juggling is
# kept off both sides (too easily lumped in with magic). Copy never uses
# the word "averse".
slug: no-rabbit
category_path: interests-topics/magic-tricks
persona: real-human-survey-e8ec306b9cdb
attribute: topic_magic_tricks
direction: avoid
label: illusion
viol_word: conjuring
domain: leisure
tags: [magic-tricks, fringe-festival]
signal: "The variety-strand tickets go to comedy, music, acrobatics and spoken word, and no magic act is picked, even though the magic acts are the pushed biggest sellers of the strand"
isolation: "Every act is free with the pass, the same length and in the same tent; the other side is genuinely varied and juggling is kept off it, so the pick isolates the persona's distaste for magic tricks rather than a taste for any one other form"

