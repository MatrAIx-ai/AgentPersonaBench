# Set: Habit: Backing up files = Never (p-ec140af52f), direction AVOID.
# Setting up a new laptop with three free setup extras from the retailer.
# Label marks the BACKUP options (a cloud sync plan, an external backup
# drive, a scheduled-backup tool); the other side is equally useful setup
# extras that do not back anything up (a screen-privacy filter, a keyboard
# cover, a stand, a password manager). Everything is free, installs the same
# day and suits the same user, so cost and usefulness are constant; the
# backup options carry the prudence lure ("most-recommended by our techs").
# Copy never uses the word "never".
slug: no-backup
category_path: behavior-habits/backing-up-files
persona: p-ec140af52f
attribute: habit_backing_up_files
direction: avoid
label: mirror
viol_word: mirror
domain: technology
tags: [backups, laptop-setup]
signal: "The free laptop setup extras chosen are the ones that do not copy or sync files anywhere (privacy filter, stand, password manager); no cloud sync, backup drive or scheduled-backup tool is taken despite those being the techs' pushed, prudent picks"
isolation: "Every extra is free, installs the same day and is useful for the same laptop; nothing separates the sides on cost, effort or privacy — only whether the persona sets up a copy of their files"

